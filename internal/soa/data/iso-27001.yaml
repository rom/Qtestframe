# ISO/IEC 27001:2022 Annex A: the 93 control identifiers with short
# names, for the Statement of Applicability. Only the identifiers and
# their short names (titles) are listed; the normative text of the
# controls is not reproduced. Swedish names are descriptive translations.
#
# source: the id in internal/catalog/data/sources.yaml
# control / control_format: how the control is found in a ref
# ("ISO/IEC 27001:2022 A.8.13 (information backup)" → "A.8.13")
source: iso-27001
title: {en: "ISO/IEC 27001:2022 Annex A", sv: "ISO/IEC 27001:2022 bilaga A"}
control: '\bA\.(\d+)\.(\d+)\b'
control_format: 'A.$1.$2'
