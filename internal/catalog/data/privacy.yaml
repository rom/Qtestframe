area: privacy
prefix: PRIV
group: privacy
name: {en: Privacy and data protection, sv: Integritet och dataskydd}
description:
  en: Rights of data subjects, consent, data minimisation, purpose limitation, privacy notices and the inventory of personal data, in line with the GDPR.
  sv: De registrerades rättigheter, samtycke, uppgiftsminimering, ändamålsbegränsning, integritetsinformation och förteckning över personuppgifter, i linje med dataskyddsförordningen (GDPR).

requirements:
  - id: PRIV-01
    type: regulatory
    obligation: must
    priority: high
    tags: [gdpr, right-of-access, data-subject-rights]
    refs: ["GDPR Art. 15", "GDPR Art. 12(3)", "ISO/IEC 27701:2025 (providing copy of PII processed)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T01]
    en:
      title: Right of access
      description: The system MUST produce a copy of all personal data that it holds on a data subject within 30 days after a verified request.
      rationale: The GDPR gives every person the right to see the data held about them within one month.
      criteria:
        - method: test
          text: A copy produced for a test person contains every personal data field listed for them in the personal data inventory, including data in linked records.
        - method: review
          text: The request log shows that each request in the last 12 months was answered within 30 days.
    sv:
      title: Rätt till tillgång
      description: Systemet SKA ta fram en kopia av alla personuppgifter om en registrerad person inom 30 dagar efter en verifierad begäran.
      rationale: Dataskyddsförordningen ger varje person rätt att inom en månad se de uppgifter som behandlas om hen.
      criteria:
        - method: test
          text: En kopia som tas fram för en testperson innehåller varje personuppgiftsfält som förteckningen anger för personen, även uppgifter i kopplade poster.
        - method: review
          text: Loggen över begäranden visar att varje begäran de senaste 12 månaderna besvarades inom 30 dagar.

  - id: PRIV-02
    type: regulatory
    obligation: must
    priority: medium
    tags: [gdpr, rectification, data-subject-rights]
    refs: ["GDPR Art. 16", "GDPR Art. 19", "ISO/IEC 27701:2025 (access, correction or erasure)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T02]
    en:
      title: Right to rectification
      description: The system MUST let users correct their own name, contact details and other profile data, and pass the correction to connected systems within 24 hours.
      rationale: Incorrect personal data can harm the person, and the GDPR requires that corrections reach the recipients of the data.
      criteria:
        - method: test
          text: A user changes their e-mail address and the new address is shown in the system at once and in each connected system within 24 hours.
    sv:
      title: Rätt till rättelse
      description: Systemet SKA låta användare själva rätta sitt namn, sina kontaktuppgifter och övriga profiluppgifter och föra rättelsen vidare till anslutna system inom 24 timmar.
      rationale: Felaktiga personuppgifter kan skada personen, och dataskyddsförordningen kräver att rättelser når mottagarna av uppgifterna.
      criteria:
        - method: test
          text: En användare byter e-postadress och den nya adressen visas direkt i systemet och i varje anslutet system inom 24 timmar.

  - id: PRIV-03
    type: regulatory
    obligation: must
    priority: high
    tags: [gdpr, erasure, data-subject-rights]
    refs: ["GDPR Art. 17", "GDPR Art. 12(3)", "ISO/IEC 27701:2025 (access, correction or erasure)", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(m)", "Directive 2014/53/EU (RED) Art. 3(3)(e) (EN 18031-2 DLM)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T03]
    en:
      title: Right to erasure
      description: The system MUST erase or anonymise a data subject's personal data that has no legal retention obligation within 30 days after a verified erasure request.
      rationale: People have the right to have their data deleted once it is no longer needed and no law requires it to be kept.
      criteria:
        - method: test
          text: After an erasure request is carried out, a search for the test person's name, e-mail address and id in the database and search index finds nothing outside records under legal retention.
    sv:
      title: Rätt till radering
      description: Systemet SKA radera eller anonymisera den registrerades personuppgifter som saknar lagstadgad lagringsskyldighet inom 30 dagar efter en verifierad begäran om radering.
      rationale: Personer har rätt att få sina uppgifter raderade när de inte längre behövs och ingen lag kräver att de sparas.
      criteria:
        - method: test
          text: När en begäran om radering har utförts hittar en sökning efter testpersonens namn, e-postadress och id i databasen och sökindexet ingenting utanför poster med lagstadgad lagring.

  - id: PRIV-04
    type: regulatory
    obligation: must
    priority: medium
    tags: [gdpr, data-portability, export]
    refs: ["GDPR Art. 20", "ISO/IEC 27701:2025 (providing copy of PII processed)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T04]
    en:
      title: Right to data portability
      description: The system MUST let users download the personal data they have provided in a structured, machine-readable format such as JSON or CSV.
      rationale: Portability lets people move their data to another service without retyping it.
      criteria:
        - method: test
          text: The downloaded file parses as JSON or CSV and contains every field the user has entered, with field names.
    sv:
      title: Rätt till dataportabilitet
      description: Systemet SKA låta användare ladda ned de personuppgifter de själva har lämnat i ett strukturerat, maskinläsbart format som JSON eller CSV.
      rationale: Portabilitet låter personer flytta sina uppgifter till en annan tjänst utan att skriva in dem igen.
      criteria:
        - method: test
          text: Den nedladdade filen går att tolka som JSON eller CSV och innehåller varje fält som användaren har fyllt i, med fältnamn.

  - id: PRIV-05
    type: regulatory
    obligation: must
    priority: high
    tags: [gdpr, consent]
    refs: ["GDPR Art. 7(1)", "GDPR Art. 4(11)", "ISO/IEC 27701:2025 (obtain and record consent)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T05]
    en:
      title: Consent is recorded
      description: The system MUST record the time, the purpose and the version of the consent text each time a person gives consent.
      rationale: The controller has to be able to show that a person consented, to what and when.
      criteria:
        - method: test
          text: Giving consent creates a record with the person's id, the purpose, the consent text version and a UTC time.
    sv:
      title: Samtycken registreras
      description: Systemet SKA registrera tidpunkt, ändamål och version av samtyckestexten varje gång en person lämnar sitt samtycke.
      rationale: Den personuppgiftsansvarige behöver kunna visa att en person har samtyckt, till vad och när.
      criteria:
        - method: test
          text: Ett lämnat samtycke skapar en post med personens id, ändamålet, versionen av samtyckestexten och en tidpunkt i UTC.

  - id: PRIV-06
    type: regulatory
    obligation: must
    priority: high
    tags: [gdpr, consent, withdrawal]
    refs: ["GDPR Art. 7(3)", "ISO/IEC 27701:2025 (providing mechanism to modify or withdraw consent)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T06]
    en:
      title: Consent can be withdrawn
      description: The system MUST let a person withdraw each consent from the same settings page where it was given and stop the related processing within 24 hours.
      rationale: Withdrawing consent has to be as easy as giving it, and processing based on it has to end.
      criteria:
        - method: test
          text: After a withdrawal, the consent record is marked as withdrawn with a time, and no processing for that purpose occurs after 24 hours.
    sv:
      title: Samtycken kan återkallas
      description: Systemet SKA låta en person återkalla varje samtycke från samma inställningssida där det lämnades och stoppa den tillhörande behandlingen inom 24 timmar.
      rationale: Det ska vara lika lätt att återkalla ett samtycke som att lämna det, och behandling som bygger på samtycket ska upphöra.
      criteria:
        - method: test
          text: Efter en återkallelse är samtyckesposten markerad som återkallad med en tidpunkt, och ingen behandling för det ändamålet sker efter 24 timmar.

  - id: PRIV-07
    type: regulatory
    obligation: must_not
    priority: medium
    tags: [gdpr, data-minimisation]
    refs: ["GDPR Art. 5(1)(c)", "GDPR Art. 25", "ISO/IEC 27701:2025 (limit collection)", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(g)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T07]
    en:
      title: Data minimisation in forms
      description: The system MUST NOT make a personal data field mandatory when the personal data inventory gives no purpose that needs it.
      rationale: Collecting only what is needed reduces the harm of a breach and is required by the GDPR.
      criteria:
        - method: review
          text: Every mandatory personal data field in the forms is matched by an entry in the inventory with a purpose that needs the field.
    sv:
      title: Uppgiftsminimering i formulär
      description: Systemet SKA INTE göra ett personuppgiftsfält tvingande när förteckningen över personuppgifter inte anger något ändamål som kräver fältet.
      rationale: Att samla in bara det som behövs minskar skadan vid en incident och krävs av dataskyddsförordningen.
      criteria:
        - method: review
          text: Varje tvingande personuppgiftsfält i formulären motsvaras av en post i förteckningen med ett ändamål som kräver fältet.

  - id: PRIV-08
    type: regulatory
    obligation: must
    priority: high
    tags: [gdpr, records-of-processing, data-inventory]
    refs: ["GDPR Art. 30", "GDPR Art. 5(1)(b)", "ISO/IEC 27001:2022 A.5.34", "ISO/IEC 27701:2025 (records related to processing PII)"]
    tests: [PRIV-T08]
    en:
      title: Inventory of personal data
      description: The system MUST be documented in a personal data inventory that gives, for each personal data field, its purpose, legal basis, retention period and recipients.
      rationale: The inventory is the basis for records of processing, for answering data subject requests and for limiting use to stated purposes.
      criteria:
        - method: review
          text: Every personal data column in the database schema appears in the inventory with all four attributes filled in.
    sv:
      title: Förteckning över personuppgifter
      description: Systemet SKA vara dokumenterat i en förteckning över personuppgifter som för varje personuppgiftsfält anger ändamål, rättslig grund, lagringstid och mottagare.
      rationale: Förteckningen är grunden för registret över behandlingar, för att besvara de registrerades begäranden och för att begränsa användningen till angivna ändamål.
      criteria:
        - method: review
          text: Varje kolumn med personuppgifter i databasschemat finns i förteckningen med alla fyra attributen ifyllda.

  - id: PRIV-09
    type: regulatory
    obligation: must
    priority: medium
    tags: [gdpr, privacy-notice, transparency]
    refs: ["GDPR Art. 13", "GDPR Art. 12(1)", "ISO/IEC 27701:2025 (providing information to PII principals)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T09]
    en:
      title: Privacy notice where data is collected
      description: The system MUST show a link to the current privacy notice on every form that collects personal data.
      rationale: People have to be told who processes their data and why at the moment the data is collected.
      criteria:
        - method: inspection
          text: Each form that collects personal data has a working link to the privacy notice, and the notice shows its version date.
    sv:
      title: Integritetsinformation där uppgifter samlas in
      description: Systemet SKA visa en länk till den gällande integritetsinformationen i varje formulär som samlar in personuppgifter.
      rationale: Personer ska få veta vem som behandlar deras uppgifter och varför i samma stund som uppgifterna samlas in.
      criteria:
        - method: inspection
          text: Varje formulär som samlar in personuppgifter har en fungerande länk till integritetsinformationen, och informationen visar sitt versionsdatum.

  - id: PRIV-10
    type: regulatory
    obligation: must_not
    priority: high
    tags: [cookies, tracking, consent]
    refs: ["ePrivacy Directive 2002/58/EC Art. 5(3)", "GDPR Art. 6(1)(a)", "Lag (2022:482) 9 kap. 28 § (kakor)", "GDPR Art. 25(2)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T10]
    en:
      title: No tracking before consent
      description: The system MUST NOT set non-essential cookies or load third-party tracking scripts before the visitor has consented to them.
      rationale: Storing or reading information on the visitor's device for purposes other than the service itself needs prior consent.
      criteria:
        - method: test
          text: A first visit with an empty browser profile sets only cookies classed as strictly necessary and makes no request to tracking domains before consent.
    sv:
      title: Ingen spårning före samtycke
      description: Systemet SKA INTE sätta kakor som inte är nödvändiga eller ladda spårningsskript från tredje part innan besökaren har samtyckt till dem.
      rationale: Att lagra eller läsa information på besökarens enhet för andra syften än själva tjänsten kräver samtycke i förväg.
      criteria:
        - method: test
          text: Ett första besök med en tom webbläsarprofil sätter bara kakor som klassats som nödvändiga och gör inga anrop till spårningsdomäner före samtycket.

  - id: PRIV-11
    type: regulatory
    obligation: should_not
    priority: medium
    tags: [test-data, anonymisation]
    refs: ["GDPR Art. 5(1)(b)", "GDPR Art. 32", "ISO/IEC 27001:2022 A.8.33", "CWE-359 (exposure of private personal information)"]
    tests: [PRIV-T11]
    en:
      title: No real personal data in test environments
      description: The system's test and development environments SHOULD NOT contain personal data copied from production without anonymisation.
      rationale: Test environments have weaker access controls, and testing is not a purpose the data was collected for.
      criteria:
        - method: inspection
          text: A sample of 100 person records from each test environment contains no name, e-mail address or national identity number that exists in production.
    sv:
      title: Inga verkliga personuppgifter i testmiljöer
      description: Systemets test- och utvecklingsmiljöer BÖR INTE innehålla personuppgifter som kopierats från produktion utan anonymisering.
      rationale: Testmiljöer har svagare åtkomstskydd, och test är inte ett ändamål som uppgifterna samlades in för.
      criteria:
        - method: inspection
          text: Ett urval på 100 personposter från varje testmiljö innehåller inget namn, ingen e-postadress och inget personnummer som finns i produktion.

  - id: PRIV-12
    type: regulatory
    obligation: must
    priority: high
    tags: [dpia, risk-assessment]
    refs: ["GDPR Art. 35 (data protection impact assessment)", "EDPB/WP29 Guidelines on DPIA (WP248 rev.01)", "ISO/IEC 27701:2025 (privacy impact assessment)", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T12]
    en:
      title: Impact assessment before high-risk processing
      description: The organisation MUST complete a data protection impact assessment before it starts processing that meets two or more of the high-risk criteria in the supervisory authority's list.
      rationale: An assessment done before launch finds the risks while the design can still change, and the law requires it for these kinds of processing.
      criteria:
        - method: review
          text: Each processing activity in the record that meets two or more criteria has an assessment dated before the start of processing, with risks, measures and the data protection officer's opinion.
    sv:
      title: Konsekvensbedömning före behandling med hög risk
      description: Organisationen SKA genomföra en konsekvensbedömning avseende dataskydd innan den påbörjar en behandling som uppfyller två eller fler av kriterierna för hög risk i tillsynsmyndighetens förteckning.
      rationale: En bedömning före lansering hittar riskerna medan utformningen fortfarande kan ändras, och lagen kräver den för den här typen av behandlingar.
      criteria:
        - method: review
          text: Varje behandling i registret som uppfyller två eller fler kriterier har en bedömning daterad före behandlingens start, med risker, åtgärder och dataskyddsombudets yttrande.

  - id: PRIV-13
    type: regulatory
    obligation: must
    priority: high
    tags: [third-country-transfer, sub-processors]
    refs: ["GDPR Art. 44–46 (transfers to third countries)", "GDPR Art. 28(2) (engaging sub-processors)", "EDPB Recommendations 01/2020 on supplementary measures", "ISO/IEC 27701:2025 (identify basis for PII transfer between jurisdictions)", "ISO/IEC 27018:2025 (geographical location of PII)", "Regulation (EU) 2022/2554 (DORA) Art. 30", "ISO/IEC 27001:2022 A.5.34"]
    tests: [PRIV-T13]
    en:
      title: Transfers outside the EEA have a documented safeguard
      description: Each transfer of personal data to a recipient outside the EEA MUST rest on an adequacy decision or on standard contractual clauses with a recorded transfer impact assessment.
      rationale: Data in a third country can be reached by authorities there, and the exporter answers for the protection level.
      criteria:
        - method: review
          text: The list of sub-processors shows the country of each, and each one outside the EEA has an adequacy decision or signed clauses and an assessment.
    sv:
      title: Överföringar utanför EES har en dokumenterad skyddsåtgärd
      description: Varje överföring av personuppgifter till en mottagare utanför EES SKA vila på ett beslut om adekvat skyddsnivå eller på standardavtalsklausuler med en dokumenterad bedömning av överföringen.
      rationale: Uppgifter i ett tredjeland kan nås av myndigheter där, och den som överför ansvarar för skyddsnivån.
      criteria:
        - method: review
          text: Förteckningen över underbiträden visar landet för var och ett, och vart och ett utanför EES har ett beslut om adekvat skyddsnivå eller undertecknade klausuler och en bedömning.

  - id: PRIV-14
    type: security
    obligation: should
    priority: medium
    tags: [pseudonymisation, analytics]
    refs: ["GDPR Art. 4(5) and Art. 25(1) (pseudonymisation, data protection by design)", "ENISA: Pseudonymisation techniques and best practices (2019)", "ISO/IEC 27001:2022 A.8.11", "GDPR Art. 32(1)(a)", "CWE-359 (exposure of private personal information)"]
    tests: [PRIV-T14]
    en:
      title: Analytics data is pseudonymised
      description: Data copied to analytics and reporting stores SHOULD replace names, email addresses and identity numbers with keyed pseudonyms, with the key held outside the analytics environment.
      rationale: Analysts rarely need to know who a person is, and pseudonyms reduce the harm if the analytics store leaks.
      criteria:
        - method: inspection
          text: A sample of 1 000 rows in the analytics store contains no clear-text names, email addresses or identity numbers, and the pseudonymisation key is not readable from the analytics environment.
    sv:
      title: Analysdata pseudonymiseras
      description: Data som kopieras till lager för analys och rapportering BÖR ersätta namn, e-postadresser och personnummer med nyckelbaserade pseudonymer, där nyckeln förvaras utanför analysmiljön.
      rationale: Analytiker behöver sällan veta vem en person är, och pseudonymer minskar skadan om analyslagret läcker.
      criteria:
        - method: inspection
          text: Ett urval av 1 000 rader i analyslagret innehåller inga namn, e-postadresser eller personnummer i klartext, och pseudonymiseringsnyckeln går inte att läsa från analysmiljön.

  - id: PRIV-15
    type: functional
    obligation: must
    priority: high
    tags: [privacy-by-default, visibility, defaults]
    refs: ["GDPR Art. 25(2)", "EDPB Guidelines 4/2019 on Article 25 Data Protection by Design and by Default", "ISO/IEC 27701:2025 (privacy by design and by default)", "CWE-359 (exposure of private personal information)", "CWE-276 (incorrect default permissions)"]
    tests: [PRIV-T15]
    en:
      title: Smallest audience by default
      description: The system MUST set the visibility of a new profile, shared item and activity status to the smallest audience offered, so that only the user and the people the user picks can see it until the user widens it.
      rationale: Most users keep the defaults, so defaults that expose data to the whole organisation or the public decide the privacy of nearly everyone.
      criteria:
        - method: test
          text: A new account's profile, its first shared item and its activity status are visible only to the user and invited people, and become visible to others only after a change by the user.
    sv:
      title: Minsta möjliga publik som standard
      description: Systemet SKA ställa in synligheten för en ny profil, ett nytt delat objekt och aktivitetsstatus på den minsta publik som erbjuds, så att bara användaren och de personer som användaren väljer kan se dem tills användaren vidgar den.
      rationale: De flesta användare behåller standardinställningarna, så standardvärden som visar data för hela organisationen eller allmänheten avgör integriteten för nästan alla.
      criteria:
        - method: test
          text: Ett nytt kontos profil, dess första delade objekt och dess aktivitetsstatus syns bara för användaren och inbjudna personer, och blir synliga för andra först efter en ändring av användaren.

  - id: PRIV-16
    type: functional
    obligation: must
    priority: medium
    tags: [restriction, data-subject-rights]
    refs: ["GDPR Art. 18", "GDPR Art. 19", "ISO/IEC 27701:2025 (access, correction or erasure)"]
    tests: [PRIV-T16]
    en:
      title: Restriction of processing for a person
      description: The system MUST let a privacy officer mark a person's data as restricted, after which the system keeps the data but excludes it from searches, exports, mailings and automated processing until the mark is lifted.
      rationale: While an accuracy dispute or an objection is examined, the person can demand that the data is only stored and not used.
      criteria:
        - method: test
          text: With the mark set, the person does not appear in search results, exports, mailing lists or scheduled jobs, and reappears in each once the mark is lifted.
    sv:
      title: Begränsning av behandling för en person
      description: Systemet SKA låta ett dataskyddsombud markera en persons uppgifter som begränsade, varefter systemet behåller uppgifterna men utesluter dem från sökningar, exporter, utskick och automatisk behandling tills markeringen tas bort.
      rationale: Medan en tvist om riktighet eller en invändning utreds kan personen kräva att uppgifterna bara lagras och inte används.
      criteria:
        - method: test
          text: Med markeringen satt syns personen inte i sökresultat, exporter, utskickslistor eller schemalagda jobb, och kommer tillbaka i vart och ett när markeringen tas bort.

  - id: PRIV-17
    type: functional
    obligation: must
    priority: high
    tags: [objection, direct-marketing]
    refs: ["GDPR Art. 21(2)", "GDPR Art. 21(3)", "ePrivacy Directive 2002/58/EC Art. 13"]
    tests: [PRIV-T17]
    en:
      title: Objection to direct marketing stops it within 24 hours
      description: The system MUST stop every direct marketing message to a person and every profiling for marketing within 24 hours after the person objects through any channel the system offers.
      rationale: The right to object to direct marketing is absolute, and messages that keep coming after an objection are a common cause of complaints and fines.
      criteria:
        - method: test
          text: After an objection by link, by settings and by support ticket, no marketing message reaches the person 24 hours later and the person is out of each marketing segment.
          threshold: "≤ 24 h"
    sv:
      title: Invändning mot direktmarknadsföring stoppar den inom 24 timmar
      description: Systemet SKA stoppa varje direktmarknadsföring till en person och varje profilering för marknadsföring inom 24 timmar efter att personen har invänt via någon kanal som systemet erbjuder.
      rationale: Rätten att invända mot direktmarknadsföring är ovillkorlig, och meddelanden som fortsätter komma efter en invändning är en vanlig orsak till klagomål och sanktionsavgifter.
      criteria:
        - method: test
          text: Efter en invändning via länk, via inställningar och via supportärende når inget marknadsföringsmeddelande personen 24 timmar senare och personen finns inte i något marknadsföringssegment.
          threshold: "≤ 24 h"

  - id: PRIV-18
    type: security
    obligation: must
    priority: high
    tags: [data-subject-requests, identity-verification]
    refs: ["GDPR Art. 12(6)", "GDPR Art. 5(1)(c)", "EDPB Guidelines 01/2022 on data subject rights - Right of access", "CWE-359 (exposure of private personal information)", "MITRE ATT&CK T1684.001 (impersonation)"]
    tests: [PRIV-T18]
    en:
      title: Identity confirmed before data is released on request
      description: The system MUST confirm the identity of a person who requests access to, export of or erasure of personal data through the signed-in account or a verified contact channel before it acts on the request.
      rationale: An access request is an easy way to steal someone's data, while asking for more identity documents than needed creates new personal data to protect.
      criteria:
        - method: test
          text: A request from an unknown email address that names an existing user releases no data and asks for confirmation through the user's account, while a request from the signed-in user proceeds.
    sv:
      title: Identiteten bekräftas innan uppgifter lämnas ut på begäran
      description: Systemet SKA bekräfta identiteten hos en person som begär tillgång till, export av eller radering av personuppgifter via det inloggade kontot eller en verifierad kontaktväg innan det agerar på begäran.
      rationale: En begäran om tillgång är ett enkelt sätt att stjäla någons uppgifter, medan krav på fler identitetshandlingar än nödvändigt skapar nya personuppgifter att skydda.
      criteria:
        - method: test
          text: En begäran från en okänd e-postadress som anger en befintlig användare lämnar inte ut några uppgifter och ber om bekräftelse via användarens konto, medan en begäran från den inloggade användaren går vidare.

  - id: PRIV-19
    type: regulatory
    obligation: must
    priority: high
    tags: [breach-register, incident]
    refs: ["GDPR Art. 33(5)", "GDPR Art. 33(1)", "ISO/IEC 27701:2025 (records of PII breaches)"]
    tests: [PRIV-T19]
    en:
      title: Register of personal data breaches
      description: The organisation MUST record each personal data breach in a register within 72 hours of becoming aware of it, with the facts, the data and persons affected, the effects, the actions taken and whether the authority and the persons were notified.
      rationale: The register is the evidence that breaches are assessed and handled, including those that did not need to be notified, and the authority can ask for it.
      criteria:
        - method: inspection
          text: Each security incident involving personal data in the last 12 months has a register entry with the six items, created within 72 hours of detection.
          threshold: "≤ 72 h"
    sv:
      title: Register över personuppgiftsincidenter
      description: Organisationen SKA föra in varje personuppgiftsincident i ett register inom 72 timmar efter att ha fått kännedom om den, med omständigheterna, berörda uppgifter och personer, följderna, vidtagna åtgärder och om myndigheten och personerna har underrättats.
      rationale: Registret är beviset på att incidenter bedöms och hanteras, även de som inte behövde anmälas, och tillsynsmyndigheten kan begära att få se det.
      criteria:
        - method: inspection
          text: Varje säkerhetsincident med personuppgifter de senaste 12 månaderna har en registerpost med de sex uppgifterna, skapad inom 72 timmar efter upptäckten.
          threshold: "≤ 72 h"

  - id: PRIV-20
    type: regulatory
    obligation: must
    priority: medium
    tags: [processor, sub-processors, notification]
    refs: ["GDPR Art. 28(2)", "GDPR Art. 28(4)", "ISO/IEC 27701:2025 (disclosure of subcontracted PII processing)"]
    tests: [PRIV-T20]
    en:
      title: Customers told of new sub-processors 30 days ahead
      description: As processor, the supplier MUST inform each customer organisation of a new or replaced sub-processor at least 30 days before the sub-processor receives personal data, and give the customer a way to object.
      rationale: The customer, as controller, must be able to assess and refuse a new recipient of its data before the data is moved.
      criteria:
        - method: review
          text: For each sub-processor added in the last 12 months, the notice to customers is dated at least 30 days before the start date and names the service, the data and the location.
          threshold: "≥ 30 days before"
    sv:
      title: Kunder informeras om nya underbiträden 30 dagar i förväg
      description: Som personuppgiftsbiträde SKA leverantören informera varje kundorganisation om ett nytt eller utbytt underbiträde minst 30 dagar innan underbiträdet tar emot personuppgifter, och ge kunden en möjlighet att invända.
      rationale: Kunden är personuppgiftsansvarig och behöver kunna bedöma och säga nej till en ny mottagare av sina uppgifter innan uppgifterna flyttas.
      criteria:
        - method: review
          text: För varje underbiträde som lagts till de senaste 12 månaderna är meddelandet till kunderna daterat minst 30 dagar före startdatumet och anger tjänsten, uppgifterna och platsen.
          threshold: "≥ 30 dagar före"

tests:
  - id: PRIV-T01
    priority: high
    execution: manual
    tags: [gdpr, right-of-access]
    refs: ["GDPR Art. 15", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Data subject access request returns all data
      description: Runs an access request for a test person and compares the result with the personal data inventory.
      preconditions: A test person with data in every module, including linked records, and the current personal data inventory.
      expected: The copy is complete and produced within the deadline.
      steps:
        - action: Register a verified access request for the test person and note the date.
          expected: The request is logged with the date and a deadline 30 days later.
        - action: Produce the copy using the documented procedure.
          expected: A file is produced and the request is marked as answered with the date.
        - action: Compare the copy with the fields listed for the person in the inventory.
          expected: Every listed field is present, including data in linked records.
    sv:
      title: Begäran om tillgång ger alla uppgifter
      description: Genomför en begäran om tillgång för en testperson och jämför resultatet med förteckningen över personuppgifter.
      preconditions: En testperson med uppgifter i varje modul, även i kopplade poster, och den aktuella förteckningen över personuppgifter.
      expected: Kopian är fullständig och tas fram inom tidsgränsen.
      steps:
        - action: Registrera en verifierad begäran om tillgång för testpersonen och anteckna datumet.
          expected: Begäran loggas med datum och en tidsgräns 30 dagar senare.
        - action: Ta fram kopian enligt den dokumenterade rutinen.
          expected: En fil skapas och begäran markeras som besvarad med datum.
        - action: Jämför kopian med de fält som förteckningen anger för personen.
          expected: Varje angivet fält finns med, även uppgifter i kopplade poster.

  - id: PRIV-T02
    priority: medium
    execution: manual
    tags: [gdpr, rectification]
    refs: ["GDPR Art. 16", "GDPR Art. 19", "ISO/IEC 27701:2025 (access, correction or erasure)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Profile correction reaches connected systems
      description: Corrects a test user's e-mail address and checks the system and its connected systems.
      preconditions: A signed-in test user and read access to each connected system that receives the user's contact details.
      expected: The correction is shown at once in the system and within 24 hours in each connected system.
      steps:
        - action: Change the e-mail address in the profile and save.
          expected: The new address is shown in the profile at once.
          data: rättad.adress@example.com
        - action: After 24 hours, look up the user in each connected system.
          expected: Each connected system shows the new address.
    sv:
      title: Rättelse i profilen når anslutna system
      description: Rättar en testanvändares e-postadress och kontrollerar systemet och dess anslutna system.
      preconditions: En inloggad testanvändare och läsbehörighet till varje anslutet system som tar emot användarens kontaktuppgifter.
      expected: Rättelsen syns direkt i systemet och inom 24 timmar i varje anslutet system.
      steps:
        - action: Ändra e-postadressen i profilen och spara.
          expected: Den nya adressen visas direkt i profilen.
          data: rättad.adress@example.com
        - action: Slå upp användaren i varje anslutet system efter 24 timmar.
          expected: Varje anslutet system visar den nya adressen.

  - id: PRIV-T03
    priority: high
    execution: manual
    tags: [gdpr, erasure]
    refs: ["GDPR Art. 17", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(m)", "Directive 2014/53/EU (RED) Art. 3(3)(e) (EN 18031-2 DLM)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Erasure request removes the person's data
      description: Carries out an erasure request and searches every store for the person's identifiers.
      preconditions: A test person with data in every module and in the search index, and one record under legal retention such as an invoice.
      expected: Only the record under legal retention still holds the person's data.
      steps:
        - action: Carry out a verified erasure request for the test person using the documented procedure.
          expected: The request is marked as completed within 30 days of registration.
        - action: Search the database and the search index for the person's name, e-mail address and id.
          expected: The only match is the invoice under legal retention.
        - action: Open the records the person had created.
          expected: They show an anonymous author instead of the person's name.
    sv:
      title: Begäran om radering tar bort personens uppgifter
      description: Genomför en begäran om radering och söker efter personens identifierare i varje lagringsplats.
      preconditions: En testperson med uppgifter i varje modul och i sökindexet, och en post med lagstadgad lagring, till exempel en faktura.
      expected: Bara posten med lagstadgad lagring innehåller fortfarande personens uppgifter.
      steps:
        - action: Genomför en verifierad begäran om radering för testpersonen enligt den dokumenterade rutinen.
          expected: Begäran markeras som slutförd inom 30 dagar från registreringen.
        - action: Sök i databasen och sökindexet efter personens namn, e-postadress och id.
          expected: Den enda träffen är fakturan med lagstadgad lagring.
        - action: Öppna de poster som personen hade skapat.
          expected: De visar en anonym upphovsperson i stället för personens namn.

  - id: PRIV-T04
    priority: medium
    execution: automated
    tags: [gdpr, data-portability]
    refs: ["GDPR Art. 20", "ISO/IEC 27701:2025 (providing copy of PII processed)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Data export is complete and machine-readable
      description: A script requests the user's data export and checks its format and content.
      preconditions: A test user who has filled in every profile field and created at least one record of each type.
      expected: The export parses and contains every field the user entered.
      steps:
        - action: Request the data export as the test user and download the file.
          expected: The file is delivered as JSON or CSV.
        - action: Parse the file.
          expected: Parsing succeeds and each value has a field name.
        - action: Compare the values with those the user entered.
          expected: Every entered value is present.
    sv:
      title: Dataexporten är fullständig och maskinläsbar
      description: Ett skript begär användarens dataexport och kontrollerar dess format och innehåll.
      preconditions: En testanvändare som har fyllt i varje profilfält och skapat minst en post av varje typ.
      expected: Exporten går att tolka och innehåller varje fält som användaren har fyllt i.
      steps:
        - action: Begär dataexporten som testanvändaren och ladda ned filen.
          expected: Filen levereras som JSON eller CSV.
        - action: Tolka filen.
          expected: Tolkningen lyckas och varje värde har ett fältnamn.
        - action: Jämför värdena med dem som användaren har fyllt i.
          expected: Varje ifyllt värde finns med.

  - id: PRIV-T05
    priority: high
    execution: automated
    tags: [gdpr, consent]
    refs: ["GDPR Art. 7(1)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Consent creates a complete record
      description: A script gives consent for a purpose and reads the stored consent record.
      preconditions: A test user and a purpose that requires consent, such as a newsletter.
      expected: The record contains the person, purpose, text version and time.
      steps:
        - action: Give consent to the newsletter as the test user.
          expected: The consent is confirmed.
        - action: Read the consent records for the user.
          expected: A record exists with the user id, the purpose, the version of the consent text and a UTC time.
    sv:
      title: Samtycke skapar en fullständig post
      description: Ett skript lämnar samtycke för ett ändamål och läser den sparade samtyckesposten.
      preconditions: En testanvändare och ett ändamål som kräver samtycke, till exempel ett nyhetsbrev.
      expected: Posten innehåller person, ändamål, textversion och tidpunkt.
      steps:
        - action: Lämna samtycke till nyhetsbrevet som testanvändaren.
          expected: Samtycket bekräftas.
        - action: Läs samtyckesposterna för användaren.
          expected: Det finns en post med användarens id, ändamålet, versionen av samtyckestexten och en tidpunkt i UTC.

  - id: PRIV-T06
    priority: high
    execution: manual
    tags: [gdpr, consent, withdrawal]
    refs: ["GDPR Art. 7(3)", "ISO/IEC 27701:2025 (providing mechanism to modify or withdraw consent)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Withdrawn consent stops processing
      description: Withdraws a consent and checks that the related processing stops.
      preconditions: A test user who has consented to the newsletter, and access to the newsletter send log.
      expected: The withdrawal is recorded and no newsletter is sent after 24 hours.
      steps:
        - action: Open the settings page where consent was given and withdraw the newsletter consent.
          expected: The page confirms the withdrawal in one step.
        - action: Read the consent record.
          expected: It is marked as withdrawn with a time.
        - action: Check the newsletter send log for the following 7 days.
          expected: No newsletter is sent to the user later than 24 hours after the withdrawal.
    sv:
      title: Återkallat samtycke stoppar behandlingen
      description: Återkallar ett samtycke och kontrollerar att den tillhörande behandlingen upphör.
      preconditions: En testanvändare som har samtyckt till nyhetsbrevet och åtkomst till utskicksloggen för nyhetsbrevet.
      expected: Återkallelsen registreras och inget nyhetsbrev skickas efter 24 timmar.
      steps:
        - action: Öppna inställningssidan där samtycket lämnades och återkalla samtycket till nyhetsbrevet.
          expected: Sidan bekräftar återkallelsen i ett steg.
        - action: Läs samtyckesposten.
          expected: Den är markerad som återkallad med en tidpunkt.
        - action: Kontrollera utskicksloggen för nyhetsbrevet under de följande 7 dagarna.
          expected: Inget nyhetsbrev skickas till användaren senare än 24 timmar efter återkallelsen.

  - id: PRIV-T07
    priority: medium
    execution: manual
    tags: [gdpr, data-minimisation]
    refs: ["GDPR Art. 5(1)(c)", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(g)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Mandatory personal data fields are justified
      description: Reviews each form that collects personal data against the personal data inventory.
      preconditions: A list of forms that collect personal data and the current personal data inventory.
      expected: Every mandatory personal data field has a purpose in the inventory that needs it.
      steps:
        - action: List the mandatory personal data fields of each form.
          expected: A complete list is produced.
        - action: Look up each field in the inventory.
          expected: Each field has an entry whose purpose needs the field.
        - action: Submit each form with only the mandatory fields filled in.
          expected: Each form is accepted.
    sv:
      title: Tvingande personuppgiftsfält är motiverade
      description: Granskar varje formulär som samlar in personuppgifter mot förteckningen över personuppgifter.
      preconditions: En lista över formulär som samlar in personuppgifter och den aktuella förteckningen över personuppgifter.
      expected: Varje tvingande personuppgiftsfält har ett ändamål i förteckningen som kräver det.
      steps:
        - action: Lista de tvingande personuppgiftsfälten i varje formulär.
          expected: En fullständig lista tas fram.
        - action: Slå upp varje fält i förteckningen.
          expected: Varje fält har en post vars ändamål kräver fältet.
        - action: Skicka varje formulär med bara de tvingande fälten ifyllda.
          expected: Varje formulär godtas.

  - id: PRIV-T08
    priority: high
    execution: manual
    tags: [records-of-processing, data-inventory]
    refs: ["GDPR Art. 30"]
    en:
      title: Personal data inventory matches the database
      description: Compares the database schema with the personal data inventory.
      preconditions: The current database schema and the personal data inventory.
      expected: Every personal data column is in the inventory with purpose, legal basis, retention and recipients.
      steps:
        - action: Mark every column in the schema that holds personal data.
          expected: A list of personal data columns is produced.
        - action: Look up each column in the inventory.
          expected: Each column is listed.
        - action: Check the four attributes of each inventory entry.
          expected: Purpose, legal basis, retention period and recipients are filled in for every entry.
    sv:
      title: Förteckningen över personuppgifter stämmer med databasen
      description: Jämför databasschemat med förteckningen över personuppgifter.
      preconditions: Det aktuella databasschemat och förteckningen över personuppgifter.
      expected: Varje kolumn med personuppgifter finns i förteckningen med ändamål, rättslig grund, lagringstid och mottagare.
      steps:
        - action: Markera varje kolumn i schemat som innehåller personuppgifter.
          expected: En lista över kolumner med personuppgifter tas fram.
        - action: Slå upp varje kolumn i förteckningen.
          expected: Varje kolumn finns med.
        - action: Kontrollera de fyra attributen i varje post i förteckningen.
          expected: Ändamål, rättslig grund, lagringstid och mottagare är ifyllda för varje post.

  - id: PRIV-T09
    priority: medium
    execution: automated
    tags: [privacy-notice]
    refs: ["GDPR Art. 13", "ISO/IEC 27701:2025 (providing information to PII principals)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Forms that collect personal data link to the privacy notice
      description: A browser script opens every form that collects personal data and follows its privacy notice link.
      preconditions: A list of forms that collect personal data.
      expected: Every form has a working link to the current notice.
      steps:
        - action: Open each form and look for a link to the privacy notice.
          expected: Each form has the link.
        - action: Follow each link.
          expected: The page loads with status 200 and shows a version date.
    sv:
      title: Formulär som samlar in personuppgifter länkar till integritetsinformationen
      description: Ett webbläsarskript öppnar varje formulär som samlar in personuppgifter och följer dess länk till integritetsinformationen.
      preconditions: En lista över formulär som samlar in personuppgifter.
      expected: Varje formulär har en fungerande länk till den gällande informationen.
      steps:
        - action: Öppna varje formulär och leta efter en länk till integritetsinformationen.
          expected: Varje formulär har länken.
        - action: Följ varje länk.
          expected: Sidan laddas med status 200 och visar ett versionsdatum.

  - id: PRIV-T10
    priority: high
    execution: automated
    tags: [cookies, tracking]
    refs: ["ePrivacy Directive 2002/58/EC Art. 5(3)", "GDPR Art. 25(2)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: No tracking cookies or requests before consent
      description: A headless browser visits the site with an empty profile and records cookies and network requests before and after consent.
      preconditions: The list of cookies classed as strictly necessary and the list of tracking domains used by the site.
      expected: Tracking starts only after consent.
      steps:
        - action: Open the start page and three other pages without answering the consent banner.
          expected: Only strictly necessary cookies are set and no request goes to a tracking domain.
        - action: Reject all optional cookies and open the same pages.
          expected: Still no optional cookie is set and no request goes to a tracking domain.
        - action: In a new empty profile, accept all cookies and open the same pages.
          expected: The optional cookies and tracking requests appear only after acceptance.
    sv:
      title: Inga spårningskakor eller spårningsanrop före samtycke
      description: En huvudlös webbläsare besöker webbplatsen med en tom profil och registrerar kakor och nätverksanrop före och efter samtycke.
      preconditions: Listan över kakor som klassats som nödvändiga och listan över spårningsdomäner som webbplatsen använder.
      expected: Spårningen börjar först efter samtycke.
      steps:
        - action: Öppna startsidan och tre andra sidor utan att svara på samtyckesrutan.
          expected: Bara nödvändiga kakor sätts och inget anrop går till en spårningsdomän.
        - action: Avvisa alla valfria kakor och öppna samma sidor.
          expected: Fortfarande sätts ingen valfri kaka och inget anrop går till en spårningsdomän.
        - action: Godkänn alla kakor i en ny tom profil och öppna samma sidor.
          expected: De valfria kakorna och spårningsanropen syns först efter godkännandet.

  - id: PRIV-T11
    priority: medium
    execution: automated
    tags: [test-data, anonymisation]
    refs: ["ISO/IEC 27001:2022 A.8.33", "CWE-359 (exposure of private personal information)"]
    en:
      title: Test environments hold no production personal data
      description: A script compares a sample of person records in each test environment with production.
      preconditions: Read access to each test environment and a hashed list of production names, e-mail addresses and identity numbers.
      expected: No sampled value matches production.
      steps:
        - action: Draw 100 random person records from each test environment.
          expected: 100 records per environment are drawn.
        - action: Hash the name, e-mail address and identity number of each record and compare them with the production list.
          expected: No match is found.
    sv:
      title: Testmiljöer innehåller inga personuppgifter från produktion
      description: Ett skript jämför ett urval av personposter i varje testmiljö med produktion.
      preconditions: Läsbehörighet till varje testmiljö och en hashad lista över namn, e-postadresser och personnummer i produktion.
      expected: Inget värde i urvalet matchar produktion.
      steps:
        - action: Dra 100 slumpvisa personposter från varje testmiljö.
          expected: 100 poster per miljö dras.
        - action: Hasha namn, e-postadress och personnummer för varje post och jämför med listan från produktion.
          expected: Ingen träff hittas.

  - id: PRIV-T12
    priority: high
    execution: manual
    tags: [dpia, review]
    refs: ["GDPR Art. 35", "ISO/IEC 27701:2025 (privacy impact assessment)", "ISO/IEC 27001:2022 A.5.34"]
    en:
      title: Impact assessments exist for high-risk processing
      description: Screens the record of processing activities against the high-risk criteria and checks the assessments.
      preconditions: The record of processing activities; the supervisory authority's list of high-risk criteria; the assessment documents.
      expected: Each activity meeting two or more criteria has a complete assessment dated before processing started.
      steps:
        - action: Score each processing activity against the high-risk criteria.
          expected: The activities meeting two or more criteria are listed.
          data: "criteria such as large scale, sensitive data, systematic monitoring, new technology"
        - action: For each listed activity, open its assessment and compare its date with the start of processing.
          expected: The assessment exists and is dated before the start.
        - action: Check each assessment for risks, measures and the data protection officer's opinion.
          expected: All three are present.
    sv:
      title: Konsekvensbedömningar finns för behandlingar med hög risk
      description: Går igenom registret över behandlingar mot kriterierna för hög risk och kontrollerar bedömningarna.
      preconditions: Registret över behandlingar; tillsynsmyndighetens förteckning över kriterier för hög risk; bedömningsdokumenten.
      expected: Varje behandling som uppfyller två eller fler kriterier har en fullständig bedömning daterad före behandlingens start.
      steps:
        - action: Bedöm varje behandling mot kriterierna för hög risk.
          expected: Behandlingarna som uppfyller två eller fler kriterier listas.
          data: "kriterier som stor omfattning, känsliga uppgifter, systematisk övervakning, ny teknik"
        - action: Öppna bedömningen för varje listad behandling och jämför dess datum med behandlingens start.
          expected: Bedömningen finns och är daterad före starten.
        - action: Kontrollera att varje bedömning har risker, åtgärder och dataskyddsombudets yttrande.
          expected: Alla tre finns.

  - id: PRIV-T13
    priority: high
    execution: manual
    tags: [third-country-transfer, sub-processors]
    refs: []
    en:
      title: Safeguards for each transfer outside the EEA
      description: Compares the list of sub-processors and their locations with the transfer documentation.
      preconditions: The list of sub-processors with countries; the signed clauses and transfer assessments; the current list of adequacy decisions.
      expected: Each recipient outside the EEA has an adequacy decision or signed clauses with an assessment.
      steps:
        - action: Mark each sub-processor whose processing or support access takes place outside the EEA.
          expected: A list of third-country recipients is obtained.
        - action: For each, check whether its country has an adequacy decision.
          expected: The decision is found, or the recipient is passed to the next step.
        - action: For each recipient without an adequacy decision, find the signed clauses and the transfer assessment.
          expected: Both documents exist and name the recipient.
    sv:
      title: Skyddsåtgärder för varje överföring utanför EES
      description: Jämför förteckningen över underbiträden och deras placering med dokumentationen av överföringar.
      preconditions: Förteckningen över underbiträden med länder; undertecknade klausuler och bedömningar av överföringar; den aktuella listan över beslut om adekvat skyddsnivå.
      expected: Varje mottagare utanför EES har ett beslut om adekvat skyddsnivå eller undertecknade klausuler med en bedömning.
      steps:
        - action: Markera varje underbiträde vars behandling eller supportåtkomst sker utanför EES.
          expected: En lista över mottagare i tredjeland tas fram.
        - action: Kontrollera för var och en om landet har ett beslut om adekvat skyddsnivå.
          expected: Beslutet hittas, eller så går mottagaren vidare till nästa steg.
        - action: Leta upp de undertecknade klausulerna och bedömningen av överföringen för varje mottagare utan beslut om adekvat skyddsnivå.
          expected: Båda dokumenten finns och namnger mottagaren.

  - id: PRIV-T14
    priority: medium
    execution: automated
    tags: [pseudonymisation, analytics]
    refs: ["CWE-359 (exposure of private personal information)"]
    en:
      title: No clear-text identities in the analytics store
      description: Samples rows from the analytics store, searches them for identifying values and checks where the pseudonymisation key can be read.
      preconditions: Read access to the analytics store with an analyst account; a list of 100 known synthetic names, email addresses and identity numbers loaded into the source system.
      expected: No known value is found in clear text, and the analyst account cannot read the key.
      steps:
        - action: Draw 1 000 random rows from each table in the analytics store.
          expected: The rows are retrieved.
        - action: Search the rows for the known values and for patterns of email addresses and identity numbers.
          expected: No clear-text match is found.
          data: "100 known values; e-mail and identity number patterns"
        - action: With the analyst account, try to read the pseudonymisation key from the secrets manager.
          expected: Access is denied.
    sv:
      title: Inga identiteter i klartext i analyslagret
      description: Tar ett urval av rader i analyslagret, söker efter identifierande värden och kontrollerar varifrån pseudonymiseringsnyckeln kan läsas.
      preconditions: Läsåtkomst till analyslagret med ett analytikerkonto; en lista med 100 kända syntetiska namn, e-postadresser och personnummer som lagts in i källsystemet.
      expected: Inget känt värde hittas i klartext, och analytikerkontot kan inte läsa nyckeln.
      steps:
        - action: Dra 1 000 slumpvisa rader ur varje tabell i analyslagret.
          expected: Raderna hämtas.
        - action: Sök i raderna efter de kända värdena och efter mönster för e-postadresser och personnummer.
          expected: Ingen träff i klartext hittas.
          data: "100 kända värden; mönster för e-post och personnummer"
        - action: Försök läsa pseudonymiseringsnyckeln från hemlighetshanteraren med analytikerkontot.
          expected: Åtkomsten nekas.

  - id: PRIV-T15
    priority: high
    execution: manual
    tags: [privacy-by-default]
    refs: ["GDPR Art. 25(2)", "CWE-359 (exposure of private personal information)", "CWE-276 (incorrect default permissions)"]
    en:
      title: New accounts start with the narrowest visibility
      description: Creates a new account and checks what other users can see before and after the user changes the settings.
      preconditions: A new test account, a second account in the same organisation and an anonymous browser.
      expected: Nothing of the new account is visible to others until the user widens it.
      steps:
        - action: Create the account, fill in the profile and share a first item without changing any visibility setting.
          expected: The settings show the narrowest audience for profile, item and activity status.
        - action: As the second account and anonymously, look for the profile, the item and the activity status.
          expected: None of them is visible.
        - action: As the new user, widen the profile visibility to the organisation and check again as the second account.
          expected: The profile is now visible to the second account and still not anonymously.
    sv:
      title: Nya konton börjar med den snävaste synligheten
      description: Skapar ett nytt konto och kontrollerar vad andra användare ser före och efter att användaren ändrar inställningarna.
      preconditions: Ett nytt testkonto, ett andra konto i samma organisation och en anonym webbläsare.
      expected: Inget av det nya kontot syns för andra förrän användaren vidgar synligheten.
      steps:
        - action: Skapa kontot, fyll i profilen och dela ett första objekt utan att ändra någon synlighetsinställning.
          expected: Inställningarna visar den snävaste publiken för profil, objekt och aktivitetsstatus.
        - action: Leta efter profilen, objektet och aktivitetsstatusen som det andra kontot och anonymt.
          expected: Inget av dem syns.
        - action: Vidga som den nya användaren profilens synlighet till organisationen och kontrollera igen som det andra kontot.
          expected: Profilen syns nu för det andra kontot men fortfarande inte anonymt.

  - id: PRIV-T16
    priority: medium
    execution: manual
    tags: [restriction]
    refs: ["GDPR Art. 18"]
    en:
      title: Restricted person is left out of processing
      description: Marks a test person as restricted and checks searches, exports, mailing lists and jobs.
      preconditions: A privacy officer account and a test person who appears in search, in an export, on a mailing list and in a nightly job.
      expected: The person is excluded while the mark is set and included again after it is lifted.
      steps:
        - action: Set the restriction mark on the test person.
          expected: The mark is saved with the officer's name and time.
        - action: Search for the person, run the export, check the next mailing list and run the nightly job.
          expected: The person is absent from each, and the record still exists for the privacy officer.
        - action: Lift the mark and repeat the checks.
          expected: The person appears in each again.
    sv:
      title: En person med begränsning utesluts från behandling
      description: Markerar en testperson som begränsad och kontrollerar sökningar, exporter, utskickslistor och jobb.
      preconditions: Ett konto för dataskyddsombud och en testperson som finns i sökningen, i en export, på en utskickslista och i ett nattligt jobb.
      expected: Personen utesluts medan markeringen finns och tas med igen när den tas bort.
      steps:
        - action: Sätt begränsningsmarkeringen på testpersonen.
          expected: Markeringen sparas med ombudets namn och tid.
        - action: Sök efter personen, kör exporten, kontrollera nästa utskickslista och kör det nattliga jobbet.
          expected: Personen saknas i vart och ett, och posten finns fortfarande kvar för dataskyddsombudet.
        - action: Ta bort markeringen och upprepa kontrollerna.
          expected: Personen finns med i vart och ett igen.

  - id: PRIV-T17
    priority: high
    execution: manual
    tags: [objection, direct-marketing]
    refs: ["GDPR Art. 21(3)"]
    en:
      title: Objections stop marketing through every channel
      description: Lodges objections to direct marketing in three ways and checks mailings and segments a day later.
      preconditions: Three test persons on the marketing list and in a marketing segment, and a marketing mailing scheduled for the next day.
      expected: None of the three gets marketing or remains in a segment 24 hours after the objection.
      steps:
        - action: Person 1 uses the unsubscribe link, person 2 turns off marketing in the settings and person 3 objects through a support ticket.
          expected: Each objection is recorded with its time.
        - action: After 24 hours, check the recipients of the scheduled mailing and the members of the marketing segments.
          expected: None of the three persons is a recipient or a member.
    sv:
      title: Invändningar stoppar marknadsföring i varje kanal
      description: Gör invändningar mot direktmarknadsföring på tre sätt och kontrollerar utskick och segment ett dygn senare.
      preconditions: Tre testpersoner på marknadsföringslistan och i ett marknadsföringssegment, och ett marknadsföringsutskick schemalagt till nästa dag.
      expected: Ingen av de tre får marknadsföring eller finns kvar i ett segment 24 timmar efter invändningen.
      steps:
        - action: Person 1 använder avregistreringslänken, person 2 stänger av marknadsföring i inställningarna och person 3 invänder via ett supportärende.
          expected: Varje invändning registreras med sin tid.
        - action: Kontrollera efter 24 timmar mottagarna av det schemalagda utskicket och medlemmarna i marknadsföringssegmenten.
          expected: Ingen av de tre personerna är mottagare eller medlem.

  - id: PRIV-T18
    priority: high
    execution: manual
    tags: [data-subject-requests, identity-verification]
    refs: ["GDPR Art. 12(6)", "CWE-359 (exposure of private personal information)", "MITRE ATT&CK T1684.001 (impersonation)"]
    en:
      title: Requests from unverified senders release no data
      description: Sends a data access request from an unknown address and from the signed-in user.
      preconditions: An existing test user with a registered email address, and a second email address not linked to any account.
      expected: Only the verified request leads to data being released.
      steps:
        - action: From the unlinked address, request a copy of the test user's personal data.
          expected: No data is sent; a confirmation request goes to the user's registered address or account.
        - action: Sign in as the test user and request the copy from the privacy settings.
          expected: The request is accepted and the copy is produced for the signed-in user.
    sv:
      title: Begäranden från overifierade avsändare lämnar inte ut några uppgifter
      description: Skickar en begäran om tillgång från en okänd adress och från den inloggade användaren.
      preconditions: En befintlig testanvändare med registrerad e-postadress, och en andra e-postadress som inte är kopplad till något konto.
      expected: Endast den verifierade begäran leder till att uppgifter lämnas ut.
      steps:
        - action: Begär från den okopplade adressen en kopia av testanvändarens personuppgifter.
          expected: Inga uppgifter skickas; en begäran om bekräftelse går till användarens registrerade adress eller konto.
        - action: Logga in som testanvändaren och begär kopian från integritetsinställningarna.
          expected: Begäran godtas och kopian tas fram för den inloggade användaren.

  - id: PRIV-T19
    priority: high
    execution: manual
    tags: [breach-register]
    refs: ["GDPR Art. 33(5)"]
    en:
      title: Breach register is complete and on time
      description: Compares the security incidents involving personal data with the breach register.
      preconditions: The incident list of the last 12 months with detection times, and the breach register.
      expected: Each incident with personal data has a complete entry made within 72 hours.
      steps:
        - action: Select the incidents of the last 12 months that involved personal data.
          expected: A list of incidents with detection times is produced.
        - action: Find each incident in the register and compare the entry time with the detection time.
          expected: Each has an entry created within 72 hours.
        - action: Check each entry's content.
          expected: Each has the facts, affected data and persons, effects, actions and notification decisions.
    sv:
      title: Incidentregistret är fullständigt och i tid
      description: Jämför säkerhetsincidenterna med personuppgifter med registret över personuppgiftsincidenter.
      preconditions: Incidentlistan för de senaste 12 månaderna med upptäcktstider, och incidentregistret.
      expected: Varje incident med personuppgifter har en fullständig post som skapats inom 72 timmar.
      steps:
        - action: Välj ut de incidenter de senaste 12 månaderna som berörde personuppgifter.
          expected: En lista med incidenter och upptäcktstider tas fram.
        - action: Leta upp varje incident i registret och jämför postens tid med upptäcktstiden.
          expected: Var och en har en post skapad inom 72 timmar.
        - action: Kontrollera innehållet i varje post.
          expected: Var och en har omständigheter, berörda uppgifter och personer, följder, åtgärder och beslut om underrättelser.

  - id: PRIV-T20
    priority: medium
    execution: manual
    tags: [sub-processors]
    refs: ["GDPR Art. 28(2)"]
    en:
      title: Sub-processor changes were announced in time
      description: Compares the start dates of new sub-processors with the dates of the notices to customers.
      preconditions: The sub-processor list with start dates and the sent customer notices of the last 12 months.
      expected: Each new sub-processor was announced at least 30 days before its start.
      steps:
        - action: List the sub-processors added or replaced in the last 12 months with their start dates.
          expected: A list is produced.
        - action: Find the customer notice for each and compare the dates.
          expected: Each notice is at least 30 days before the start date and names the service, data and location.
        - action: Check that the notice explains how to object.
          expected: Each notice gives a way to object and a deadline.
    sv:
      title: Byten av underbiträden meddelades i tid
      description: Jämför startdatum för nya underbiträden med datumen för meddelandena till kunderna.
      preconditions: Listan över underbiträden med startdatum och de meddelanden till kunder som skickats de senaste 12 månaderna.
      expected: Varje nytt underbiträde meddelades minst 30 dagar före start.
      steps:
        - action: Lista de underbiträden som lagts till eller bytts ut de senaste 12 månaderna med sina startdatum.
          expected: En lista tas fram.
        - action: Leta upp kundmeddelandet för vart och ett och jämför datumen.
          expected: Varje meddelande ligger minst 30 dagar före startdatumet och anger tjänst, uppgifter och plats.
        - action: Kontrollera att meddelandet förklarar hur man invänder.
          expected: Varje meddelande anger ett sätt att invända och en sista dag.

risks:
  - id: PRIV-R01
    category: privacy
    likelihood: 3
    impact: 4
    tags: [data-subject-rights, gdpr]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "GDPR Art. 12(3)", "GDPR Art. 15", "GDPR Art. 17"]
    mitigated_by: [PRIV-01, PRIV-02, PRIV-03, PRIV-04, PRIV-18]
    en:
      title: Data subject requests cannot be met in time
      description: The system offers no way to find, export, correct or erase one person's data. Requests take weeks of manual work, deadlines are missed and complaints reach the supervisory authority.
      mitigation: Support access, rectification, erasure and portability in the system and confirm the requester's identity before data is released.
    sv:
      title: Begäranden från registrerade kan inte hanteras i tid
      description: Systemet saknar sätt att hitta, exportera, rätta eller radera en persons uppgifter. Begäranden tar veckor av manuellt arbete, tidsfrister missas och klagomål når tillsynsmyndigheten.
      mitigation: Stöd tillgång, rättelse, radering och dataportabilitet i systemet och bekräfta den begärandes identitet innan uppgifter lämnas ut.
  - id: PRIV-R02
    category: privacy
    likelihood: 3
    impact: 4
    tags: [dpia, high-risk-processing]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "GDPR Art. 35(1)", "GDPR Art. 35(7)"]
    mitigated_by: [PRIV-12, PRIV-08, PRIV-07]
    en:
      title: High-risk processing started without an impact assessment
      description: New processing such as profiling, monitoring or large-scale special category data starts without a data protection impact assessment. The risks to the people concerned are neither known nor reduced, and the processing may have to stop.
      mitigation: Carry out an impact assessment before high-risk processing, keep an inventory of personal data and collect only the data each purpose needs.
    sv:
      title: Behandling med hög risk påbörjas utan konsekvensbedömning
      description: Ny behandling som profilering, övervakning eller storskalig behandling av känsliga uppgifter påbörjas utan konsekvensbedömning avseende dataskydd. Riskerna för de berörda är varken kända eller minskade, och behandlingen kan behöva stoppas.
      mitigation: Gör en konsekvensbedömning före behandling med hög risk, för en förteckning över personuppgifter och samla bara in de uppgifter varje ändamål behöver.
  - id: PRIV-R03
    category: privacy
    likelihood: 3
    impact: 4
    tags: [test-data, pseudonymisation]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "GDPR Art. 32(1)(a)", "GDPR Art. 25(1)", "CWE-359 (exposure of private personal information)"]
    mitigated_by: [PRIV-11, PRIV-14, PRIV-15]
    en:
      title: Personal data exposed outside production
      description: Copies of real personal data end up in test environments, analytics tools or are visible to a wider audience than needed. Weaker protection there leads to a personal data breach.
      mitigation: Use no real personal data in test environments, pseudonymise analytics data and show data to the smallest audience by default.
    sv:
      title: Personuppgifter exponeras utanför produktion
      description: Kopior av verkliga personuppgifter hamnar i testmiljöer, analysverktyg eller blir synliga för en större krets än nödvändigt. Det svagare skyddet där leder till en personuppgiftsincident.
      mitigation: Använd inga verkliga personuppgifter i testmiljöer, pseudonymisera analysdata och visa uppgifter för minsta möjliga krets som standard.
  - id: PRIV-R04
    category: compliance
    likelihood: 2
    impact: 4
    tags: [international-transfer, sub-processor]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "GDPR Art. 44", "GDPR Art. 28(2)"]
    mitigated_by: [PRIV-13, PRIV-20, TEN-12]
    en:
      title: Personal data transferred abroad without a legal basis
      description: A new sub-processor or cloud region moves personal data outside the EEA without a documented safeguard. Customers object, and the transfer may have to stop at short notice.
      mitigation: Document a safeguard for every transfer outside the EEA, tell customers of new sub-processors 30 days ahead and keep tenant data in the chosen region.
    sv:
      title: Personuppgifter överförs utomlands utan rättslig grund
      description: Ett nytt underbiträde eller en ny molnregion flyttar personuppgifter utanför EES utan dokumenterad skyddsåtgärd. Kunder invänder och överföringen kan behöva stoppas med kort varsel.
      mitigation: Dokumentera en skyddsåtgärd för varje överföring utanför EES, meddela kunderna om nya underbiträden 30 dagar i förväg och håll organisationens data i den valda regionen.
  - id: PRIV-R05
    category: compliance
    likelihood: 3
    impact: 4
    tags: [breach-notification]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "GDPR Art. 33(1)", "GDPR Art. 33(5)"]
    mitigated_by: [PRIV-19, SLOG-01, INC-01]
    en:
      title: Personal data breach not reported within 72 hours
      description: A breach is detected late, handled informally and not documented. The supervisory authority is not notified in time and the organisation cannot show what happened.
      mitigation: Keep a register of personal data breaches, log security events and follow a documented incident response process.
    sv:
      title: Personuppgiftsincident anmäls inte inom 72 timmar
      description: En incident upptäcks sent, hanteras informellt och dokumenteras inte. Tillsynsmyndigheten underrättas inte i tid och organisationen kan inte visa vad som hände.
      mitigation: För ett register över personuppgiftsincidenter, logga säkerhetshändelser och följ en dokumenterad process för incidenthantering.
