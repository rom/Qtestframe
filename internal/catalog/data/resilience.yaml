area: resilience
prefix: RES
group: quality
name: {en: Resilience and error handling, sv: Motståndskraft och felhantering}
description:
  en: Error handling, timeouts, retries with backoff, circuit breakers, graceful degradation, idempotency, consistency after failures and clear error messages.
  sv: Felhantering, tidsgränser, omförsök med backoff, kretsbrytare, kontrollerad nedgradering, idempotens, konsistens efter fel och tydliga felmeddelanden.

requirements:
  - id: RES-01
    type: non_functional
    obligation: must
    priority: high
    tags: [timeout, dependency]
    refs: ["ISO/IEC 25010:2023 fault tolerance", "Google SRE book ch. 22 (Addressing Cascading Failures)"]
    tests: [RES-T01]
    en:
      title: Timeout on every outbound call
      description: The system MUST abort each call to another service or database after a configured timeout of at most 5 seconds.
      rationale: Calls without a timeout tie up threads and connections when a dependency hangs, and the failure spreads to the whole system.
      criteria:
        - method: test
          text: With a dependency that never answers, the call is aborted after at most 5 seconds and the error is handled.
          threshold: "timeout ≤ 5 s"
        - method: inspection
          text: The client configuration of every dependency sets a timeout.
    sv:
      title: Tidsgräns för varje utgående anrop
      description: Systemet SKA avbryta varje anrop till en annan tjänst eller databas efter en konfigurerad tidsgräns på högst 5 sekunder.
      rationale: Anrop utan tidsgräns binder trådar och anslutningar när ett beroende hänger sig, och felet sprider sig till hela systemet.
      criteria:
        - method: test
          text: Med ett beroende som aldrig svarar avbryts anropet efter högst 5 sekunder och felet hanteras.
          threshold: "tidsgräns ≤ 5 s"
        - method: inspection
          text: Klientkonfigurationen för varje beroende anger en tidsgräns.

  - id: RES-02
    type: non_functional
    obligation: must
    priority: high
    tags: [retry, backoff]
    refs: ["Google SRE book ch. 22 (Addressing Cascading Failures)", "Google SRE book ch. 21 (Handling Overload)"]
    tests: [RES-T02]
    en:
      title: Retries with exponential backoff and jitter
      description: The system MUST retry a failed call to a dependency at most 3 times, with exponentially growing random delays starting at 200 milliseconds.
      rationale: Bounded retries with random delays recover from short glitches without flooding a dependency that is already struggling.
      criteria:
        - method: test
          text: Against a dependency that always fails, the log shows 1 call plus 3 retries with growing, non-identical delays.
          threshold: "≤ 3 retries, first delay 200 ms"
    sv:
      title: Omförsök med exponentiell backoff och slumpvariation
      description: Systemet SKA göra högst 3 omförsök av ett misslyckat anrop till ett beroende, med exponentiellt växande slumpmässiga väntetider som börjar på 200 millisekunder.
      rationale: Begränsade omförsök med slumpvisa väntetider klarar korta störningar utan att översvämma ett beroende som redan har problem.
      criteria:
        - method: test
          text: Mot ett beroende som alltid fallerar visar loggen 1 anrop plus 3 omförsök med växande och olika väntetider.
          threshold: "≤ 3 omförsök, första väntetid 200 ms"

  - id: RES-03
    type: non_functional
    obligation: must_not
    priority: high
    tags: [retry, client-error]
    refs: ["RFC 9110 §15.5 (client error 4xx)", "RFC 9110 §9.2.2 (idempotent methods)"]
    tests: [RES-T02]
    en:
      title: No retries of client errors
      description: The system MUST NOT automatically retry a call that failed with a client error status in the range 400 to 499, other than 408 and 429.
      rationale: A request that the receiver has rejected as invalid fails the same way again, and retrying only adds load.
      criteria:
        - method: test
          text: A call answered with 400 or 403 is made exactly once, and a call answered with 429 is retried.
    sv:
      title: Inga omförsök vid klientfel
      description: Systemet SKA INTE automatiskt göra om ett anrop som misslyckades med en klientfelstatus mellan 400 och 499, annat än 408 och 429.
      rationale: Ett anrop som mottagaren har avvisat som ogiltigt misslyckas på samma sätt igen, och omförsök ger bara mer last.
      criteria:
        - method: test
          text: Ett anrop som besvaras med 400 eller 403 görs exakt en gång, och ett anrop som besvaras med 429 görs om.

  - id: RES-04
    type: non_functional
    obligation: should
    priority: high
    tags: [circuit-breaker, dependency]
    refs: ["ISO/IEC 25010:2023 fault tolerance", "Google SRE book ch. 22 (Addressing Cascading Failures)"]
    tests: [RES-T03]
    en:
      title: Circuit breaker for dependencies
      description: The system SHOULD stop calling a dependency for 30 seconds once at least 50 % of at least 20 calls within 10 seconds have failed.
      rationale: An open circuit gives a failing dependency room to recover and lets callers fail at once instead of waiting for timeouts.
      criteria:
        - method: test
          text: After the failure threshold is reached, calls fail immediately for 30 seconds, then one trial call is let through.
          threshold: "open at ≥ 50 % failures of ≥ 20 calls in 10 s, for 30 s"
    sv:
      title: Kretsbrytare för beroenden
      description: Systemet BÖR sluta anropa ett beroende i 30 sekunder när minst 50 % av minst 20 anrop inom 10 sekunder har misslyckats.
      rationale: En öppen krets ger ett felande beroende utrymme att återhämta sig och låter anroparna misslyckas direkt i stället för att vänta ut tidsgränser.
      criteria:
        - method: test
          text: När felgränsen har nåtts misslyckas anropen direkt i 30 sekunder, därefter släpps ett provanrop igenom.
          threshold: "öppnar vid ≥ 50 % fel av ≥ 20 anrop på 10 s, i 30 s"

  - id: RES-05
    type: functional
    obligation: must
    priority: high
    tags: [graceful-degradation, search]
    refs: ["ISO/IEC 25010:2023 fault tolerance", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)"]
    tests: [RES-T04]
    en:
      title: Core functions work without the search service
      description: While the search service is unavailable, the system MUST keep viewing and editing of records working and show a notice that search is temporarily out of service.
      rationale: Secondary services fail more often than the core, and users can go on working when the failure is contained.
      criteria:
        - method: test
          text: With the search service stopped, records can be opened and saved, and the search field shows the notice.
    sv:
      title: Kärnfunktioner fungerar utan söktjänsten
      description: Medan söktjänsten är otillgänglig SKA systemet hålla visning och redigering av poster igång och visa ett meddelande om att sökningen tillfälligt är ur funktion.
      rationale: Kringtjänster fallerar oftare än kärnan, och användarna kan fortsätta arbeta när felet hålls avgränsat.
      criteria:
        - method: test
          text: Med söktjänsten stoppad går poster att öppna och spara, och sökfältet visar meddelandet.

  - id: RES-06
    type: interface
    obligation: must
    priority: high
    tags: [idempotency, api]
    refs: ["IETF draft-ietf-httpapi-idempotency-key-header", "RFC 9110 §9.2.2 (idempotent methods)"]
    tests: [RES-T05]
    en:
      title: Idempotency key on create requests
      description: The API MUST return the original result without creating a new record when a create request is repeated with the same idempotency key within 24 hours.
      rationale: Clients retry after network errors without knowing whether the first request arrived, and the key prevents duplicates.
      criteria:
        - method: test
          text: Two identical create requests with the same Idempotency-Key header create one record and return the same identifier.
          threshold: "key valid for 24 h"
    sv:
      title: Idempotensnyckel för anrop som skapar poster
      description: API:et SKA returnera det ursprungliga resultatet utan att skapa en ny post när ett skapa-anrop upprepas med samma idempotensnyckel inom 24 timmar.
      rationale: Klienter gör om anrop efter nätverksfel utan att veta om det första anropet kom fram, och nyckeln förhindrar dubbletter.
      criteria:
        - method: test
          text: Två identiska skapa-anrop med samma Idempotency-Key-huvud skapar en post och returnerar samma identifierare.
          threshold: "nyckeln gäller i 24 h"

  - id: RES-07
    type: non_functional
    obligation: must
    priority: critical
    tags: [consistency, transaction]
    refs: ["ISO/IEC 25010:2023 integrity", "Google SRE book ch. 26 (Data Integrity)"]
    tests: [RES-T06]
    en:
      title: Atomic multi-step changes
      description: When a change that updates more than one record is interrupted, the system MUST leave the data either fully in the state before or fully in the state after the change.
      rationale: Half-applied changes create inconsistent data that is hard to detect and expensive to repair.
      criteria:
        - method: test
          text: Killing the process in the middle of a multi-record change leaves no record with the new values while others keep the old ones.
    sv:
      title: Odelbara ändringar i flera steg
      description: När en ändring som uppdaterar mer än en post avbryts SKA systemet lämna data antingen helt i tillståndet före eller helt i tillståndet efter ändringen.
      rationale: Halvt genomförda ändringar skapar inkonsekventa data som är svåra att upptäcka och dyra att reparera.
      criteria:
        - method: test
          text: Om processen avbryts mitt i en ändring av flera poster finns ingen post med nya värden medan andra har kvar de gamla.

  - id: RES-08
    type: usability
    obligation: must
    priority: high
    tags: [error-message, user]
    refs: ["ISO 9241-110:2020 (use error robustness)", "ISO/IEC 25010:2023 user error protection"]
    tests: [RES-T07]
    en:
      title: Error messages say what happened and what to do
      description: Each error message shown to a user MUST state in plain language what went wrong and which action the user can take next.
      rationale: Users who understand an error correct it themselves, while cryptic messages turn into support requests.
      criteria:
        - method: review
          text: For a sample of 20 error situations, every message names the problem and a next step, without codes as the only content.
    sv:
      title: Felmeddelanden säger vad som hände och vad man kan göra
      description: Varje felmeddelande som visas för en användare SKA på begripligt språk ange vad som gick fel och vilken åtgärd användaren kan vidta härnäst.
      rationale: Användare som förstår ett fel rättar det själva, medan kryptiska meddelanden blir supportärenden.
      criteria:
        - method: review
          text: För ett urval av 20 felsituationer anger varje meddelande problemet och ett nästa steg, utan att en kod är det enda innehållet.

  - id: RES-09
    type: security
    obligation: must_not
    priority: high
    tags: [error-message, information-disclosure]
    refs: ["OWASP ASVS 4.0 V7.4.1 (generic error messages)", "OWASP Top 10 2021 A05 (security misconfiguration)", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.7", "IEC 62443-4-2 CR 3.7"]
    tests: [RES-T07]
    en:
      title: No internal details in error responses
      description: Error pages and API error responses MUST NOT contain stack traces, database queries, file paths or software version numbers.
      rationale: Internal details help attackers map the system and are of no use to the user.
      criteria:
        - method: test
          text: Forced server errors in the interface and the API return a generic message without stack trace, query, path or version.
    sv:
      title: Inga interna detaljer i felsvar
      description: Felsidor och felsvar från API:et SKA INTE innehålla stackspårningar, databasfrågor, filsökvägar eller versionsnummer för programvaran.
      rationale: Interna detaljer hjälper angripare att kartlägga systemet och är till ingen nytta för användaren.
      criteria:
        - method: test
          text: Framtvingade serverfel i gränssnittet och API:et ger ett allmänt meddelande utan stackspårning, fråga, sökväg eller version.

  - id: RES-10
    type: usability
    obligation: should
    priority: medium
    tags: [error-message, correlation-id, support]
    refs: ["RFC 9457 (Problem Details for HTTP APIs)", "OWASP ASVS 4.0 V7.4.1"]
    tests: [RES-T07, OBS-T02]
    en:
      title: Reference number in server error messages
      description: Each message that reports a server error SHOULD show a reference number that matches the correlation id in the server logs.
      rationale: The reference lets support find the exact log entry without asking the user to describe what they did.
      criteria:
        - method: test
          text: The reference number shown for a forced server error is found in the log entry of the failed request.
    sv:
      title: Referensnummer i meddelanden om serverfel
      description: Varje meddelande om ett serverfel BÖR visa ett referensnummer som stämmer med korrelations-id:t i serverloggarna.
      rationale: Referensen gör att supporten hittar exakt rätt loggpost utan att be användaren beskriva vad hen gjorde.
      criteria:
        - method: test
          text: Referensnumret som visas för ett framtvingat serverfel återfinns i loggposten för det misslyckade anropet.

  - id: RES-11
    type: non_functional
    obligation: should
    priority: medium
    tags: [bulkhead, isolation, dependency]
    refs: ["Google SRE book ch. 22 (Addressing Cascading Failures)", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)"]
    tests: [RES-T08]
    en:
      title: Isolated resources per dependency
      description: The system SHOULD limit the concurrent calls to each dependency to at most 50 % of its worker threads.
      rationale: When one slow dependency can take all threads, every other function stops as well.
      criteria:
        - method: test
          text: With one dependency delayed by 10 seconds, requests that do not use it keep their normal response time.
          threshold: "≤ 50 % of worker threads per dependency"
    sv:
      title: Avgränsade resurser per beroende
      description: Systemet BÖR begränsa antalet samtidiga anrop till varje beroende till högst 50 % av arbetstrådarna.
      rationale: När ett långsamt beroende kan ta alla trådar stannar även alla andra funktioner.
      criteria:
        - method: test
          text: Med ett beroende fördröjt med 10 sekunder behåller anrop som inte använder det sin vanliga svarstid.
          threshold: "≤ 50 % av arbetstrådarna per beroende"

  - id: RES-12
    type: non_functional
    obligation: must
    priority: medium
    tags: [queue, dead-letter, messaging]
    refs: ["ISO/IEC 25010:2023 recoverability"]
    tests: [RES-T09]
    en:
      title: Dead-letter queue for failed messages
      description: The system MUST move a message that has failed processing 5 times to a dead-letter queue and raise an alert.
      rationale: A message that keeps failing blocks the queue, while a dead-letter queue keeps it for analysis without losing it.
      criteria:
        - method: test
          text: A message that always fails is attempted 5 times, then appears in the dead-letter queue, and an alert is raised.
          threshold: "5 attempts"
    sv:
      title: Kö för meddelanden som inte kan bearbetas
      description: Systemet SKA flytta ett meddelande som har misslyckats att bearbetas 5 gånger till en kö för obearbetbara meddelanden och skapa ett larm.
      rationale: Ett meddelande som misslyckas om och om igen blockerar kön, medan en separat kö sparar det för analys utan att det går förlorat.
      criteria:
        - method: test
          text: Ett meddelande som alltid misslyckas provas 5 gånger, hamnar sedan i kön för obearbetbara meddelanden, och ett larm skapas.
          threshold: "5 försök"

  - id: RES-13
    type: business
    obligation: should
    priority: medium
    tags: [fault-injection, chaos-engineering]
    refs: ["ISTQB CTAL-TTA (reliability testing)", "Google SRE book ch. 17 (Testing for Reliability)", "Regulation (EU) 2022/2554 (DORA) Art. 24", "Regulation (EU) 2022/2554 (DORA) Art. 25", "ISO/IEC 27001:2022 A.5.30"]
    tests: [RES-T10]
    en:
      title: Regular fault-injection tests
      description: The team SHOULD run a fault-injection test against each critical dependency at least once per quarter.
      rationale: Error handling that is never exercised tends to break unnoticed, and planned tests find the gaps before an incident does.
      criteria:
        - method: review
          text: The test log shows a fault-injection test for each critical dependency within the last 3 months, with findings recorded.
          threshold: "every 3 months per critical dependency"
    sv:
      title: Regelbundna tester med felinjektion
      description: Teamet BÖR köra ett felinjektionstest mot varje kritiskt beroende minst en gång per kvartal.
      rationale: Felhantering som aldrig används går ofta sönder utan att någon märker det, och planerade tester hittar luckorna innan en incident gör det.
      criteria:
        - method: review
          text: Testloggen visar ett felinjektionstest för varje kritiskt beroende under de senaste 3 månaderna, med registrerade fynd.
          threshold: "var 3:e månad per kritiskt beroende"

  - id: RES-14
    type: non_functional
    obligation: must
    priority: high
    tags: [overload, load-shedding, retry-after]
    refs: ["Google SRE book ch. 21 (Handling Overload)", "RFC 9110 §10.2.3 (Retry-After)", "RFC 9110 §15.6.4 (503 Service Unavailable)"]
    tests: [RES-T11]
    en:
      title: Excess load rejected instead of queued
      description: When an instance has more requests in progress than its configured limit, the system MUST answer the excess requests at once with status 503 and a Retry-After header.
      rationale: Queueing work beyond capacity makes every request slow and can take the whole service down, while early rejection keeps the accepted requests within their response times.
      criteria:
        - method: test
          text: Under load above the limit, the excess requests get 503 with Retry-After within 100 ms while accepted requests keep their normal response time.
          threshold: "rejection ≤ 100 ms"
    sv:
      title: Överlast avvisas i stället för att köas
      description: När en instans har fler pågående anrop än sin inställda gräns SKA systemet direkt besvara de överskjutande anropen med status 503 och huvudet Retry-After.
      rationale: Att köa arbete utöver kapaciteten gör varje anrop långsamt och kan fälla hela tjänsten, medan tidig avvisning håller de godtagna anropen inom sina svarstider.
      criteria:
        - method: test
          text: Vid last över gränsen får de överskjutande anropen 503 med Retry-After inom 100 ms medan godtagna anrop behåller sin vanliga svarstid.
          threshold: "avvisning ≤ 100 ms"

  - id: RES-15
    type: non_functional
    obligation: must
    priority: high
    tags: [shutdown, graceful, in-flight]
    refs: ["The Twelve-Factor App, IX Disposability", "ISO/IEC 25010:2023 fault tolerance"]
    tests: [RES-T12]
    en:
      title: In-flight work finished on shutdown
      description: On a stop signal, an instance MUST stop accepting new requests and finish the requests in progress for up to 30 seconds before it exits.
      rationale: Restarts and scale-in happen many times a day, and an abrupt exit fails every request that was being served at that moment.
      criteria:
        - method: test
          text: Stopping an instance during load produces 0 failed requests that had already been accepted.
          threshold: "0 failed accepted requests; drain ≤ 30 s"
    sv:
      title: Pågående arbete slutförs vid avstängning
      description: Vid en stoppsignal SKA en instans sluta ta emot nya anrop och slutföra pågående anrop i upp till 30 sekunder innan den avslutas.
      rationale: Omstarter och nedskalning sker många gånger per dag, och ett tvärt avslut får varje anrop som betjänas just då att misslyckas.
      criteria:
        - method: test
          text: Att stoppa en instans under last ger 0 misslyckade anrop bland dem som redan hade tagits emot.
          threshold: "0 misslyckade mottagna anrop; avveckling ≤ 30 s"

  - id: RES-16
    type: non_functional
    obligation: must
    priority: medium
    tags: [queues, bounds, memory]
    refs: ["Google SRE book ch. 22 (Addressing Cascading Failures)", "ISO/IEC 25010:2023 fault tolerance"]
    tests: [RES-T13]
    en:
      title: Bounded queues and pools
      description: Each in-memory queue, worker pool and connection pool of the system MUST have a configured maximum size.
      rationale: An unbounded queue grows until the process runs out of memory, turning a slow dependency into a crash.
      criteria:
        - method: inspection
          text: The configuration lists a maximum for each queue and pool found in a code review of the service.
          threshold: "100 % of queues and pools bounded"
    sv:
      title: Begränsade köer och pooler
      description: Varje kö i minnet, arbetarpool och anslutningspool i systemet SKA ha en inställd största storlek.
      rationale: En obegränsad kö växer tills processen får slut på minne, och ett långsamt beroende blir då en krasch.
      criteria:
        - method: inspection
          text: Konfigurationen anger ett maxvärde för varje kö och pool som hittas vid en kodgranskning av tjänsten.
          threshold: "100 % av köer och pooler begränsade"

  - id: RES-17
    type: non_functional
    obligation: must
    priority: medium
    tags: [startup, dependencies, readiness]
    refs: ["The Twelve-Factor App, IX Disposability", "ISO/IEC 25010:2023 recoverability"]
    tests: [RES-T14]
    en:
      title: Start without the database available
      description: An instance that starts while the database is unreachable MUST keep running, report not ready and connect when the database returns.
      rationale: A crash loop at start delays recovery after a shared outage and floods logs and orchestrators at the worst moment.
      criteria:
        - method: test
          text: An instance started with the database down reports not ready, does not restart, and becomes ready within 30 seconds after the database returns.
          threshold: "ready ≤ 30 s after the database returns"
    sv:
      title: Start utan att databasen är nåbar
      description: En instans som startar medan databasen inte går att nå SKA fortsätta köra, rapportera att den inte är redo och ansluta när databasen är tillbaka.
      rationale: En kraschloop vid start fördröjer återhämtningen efter ett gemensamt avbrott och översvämmar loggar och orkestrering i värsta tänkbara läge.
      criteria:
        - method: test
          text: En instans som startas med databasen nere rapporterar att den inte är redo, startar inte om och blir redo inom 30 sekunder efter att databasen är tillbaka.
          threshold: "redo ≤ 30 s efter att databasen är tillbaka"

  - id: RES-18
    type: non_functional
    obligation: must
    priority: medium
    tags: [messaging, consumers, reconnect]
    refs: ["ISO/IEC 25010:2023 recoverability", "Google SRE book ch. 22 (Addressing Cascading Failures)"]
    tests: [RES-T15]
    en:
      title: Message consumers resume after a broker outage
      description: After the message broker becomes available again, the consumers MUST resume processing without manual action within 5 minutes.
      rationale: Consumers that stay disconnected after a broker restart let messages pile up silently until someone notices the missing results.
      criteria:
        - method: test
          text: After a broker restart, every consumer is connected again and the queue backlog starts to fall within 5 minutes.
          threshold: "≤ 5 min to resumed processing"
    sv:
      title: Meddelandekonsumenter återupptar arbetet efter ett avbrott i meddelandeförmedlingen
      description: När meddelandeförmedlingen är tillgänglig igen SKA konsumenterna återuppta behandlingen utan manuell åtgärd inom 5 minuter.
      rationale: Konsumenter som förblir frånkopplade efter en omstart av förmedlingen låter meddelanden samlas på hög i det tysta tills någon märker att resultaten uteblir.
      criteria:
        - method: test
          text: Efter en omstart av förmedlingen är varje konsument ansluten igen och kön börjar minska inom 5 minuter.
          threshold: "≤ 5 min till återupptagen behandling"

tests:
  - id: RES-T01
    priority: high
    execution: automated
    tags: [timeout, fault-injection]
    refs: []
    en:
      title: Outbound call to a hanging dependency times out
      description: An integration test replaces a dependency with a stub that accepts connections but never answers.
      preconditions: The system runs in a test environment where each dependency can be replaced by a stub.
      expected: The call is aborted within 5 seconds and the user request ends with a handled error.
      steps:
        - action: Configure the stub to accept the connection and never send a response.
          expected: The stub is reachable and silent.
        - action: Send a request to the system that needs the dependency and measure the time.
          expected: The system answers within 5 seconds plus 1 second of processing, with a handled error response.
        - action: Repeat for each dependency in the dependency list.
          expected: Every dependency call is aborted within its timeout.
    sv:
      title: Utgående anrop till ett beroende som hänger sig avbryts
      description: Ett integrationstest ersätter ett beroende med en attrapp som tar emot anslutningar men aldrig svarar.
      preconditions: Systemet körs i en testmiljö där varje beroende kan ersättas med en attrapp.
      expected: Anropet avbryts inom 5 sekunder och användarens anrop avslutas med ett hanterat fel.
      steps:
        - action: Konfigurera attrappen så att den tar emot anslutningen och aldrig skickar något svar.
          expected: Attrappen är nåbar och tyst.
        - action: Skicka ett anrop till systemet som kräver beroendet och mät tiden.
          expected: Systemet svarar inom 5 sekunder plus 1 sekunds bearbetning, med ett hanterat felsvar.
        - action: Upprepa för varje beroende i listan över beroenden.
          expected: Varje anrop till ett beroende avbryts inom sin tidsgräns.

  - id: RES-T02
    priority: high
    execution: automated
    tags: [retry, backoff]
    refs: []
    en:
      title: Retry behaviour against failing dependencies
      description: An integration test uses a stub that returns configured status codes and records the arrival time of each call.
      preconditions: A stub dependency that logs every call with a timestamp.
      expected: Server errors are retried at most 3 times with growing random delays; client errors are not retried.
      steps:
        - action: Let the stub answer every call with status 503 and send one request through the system.
          expected: The stub receives 4 calls in total.
        - action: Compute the delays between the calls in this and in a second run.
          expected: The delays grow from 200 milliseconds upwards and differ between the runs.
        - action: Let the stub answer with status 400 and send one request.
          expected: The stub receives exactly 1 call.
    sv:
      title: Beteende vid omförsök mot felande beroenden
      description: Ett integrationstest använder en attrapp som returnerar konfigurerade statuskoder och registrerar när varje anrop kommer.
      preconditions: En attrapp för beroendet som loggar varje anrop med tidsstämpel.
      expected: Serverfel görs om högst 3 gånger med växande slumpmässiga väntetider; klientfel görs inte om.
      steps:
        - action: Låt attrappen svara 503 på varje anrop och skicka ett anrop genom systemet.
          expected: Attrappen tar emot totalt 4 anrop.
        - action: Beräkna väntetiderna mellan anropen i denna och i en andra körning.
          expected: Väntetiderna växer från 200 millisekunder och uppåt och skiljer sig mellan körningarna.
        - action: Låt attrappen svara 400 och skicka ett anrop.
          expected: Attrappen tar emot exakt 1 anrop.

  - id: RES-T03
    priority: high
    execution: automated
    tags: [circuit-breaker]
    refs: []
    en:
      title: Circuit breaker opens and closes
      description: An integration test drives a dependency into failure and checks the state changes of the circuit breaker.
      preconditions: A stub dependency whose answers can be switched between success and failure.
      expected: The circuit opens at the threshold, rejects calls for 30 seconds and closes after a successful trial call.
      steps:
        - action: Send 20 calls within 10 seconds while the stub fails every call.
          expected: The circuit opens and the next call fails at once without reaching the stub.
        - action: Switch the stub to success and wait 30 seconds.
          expected: The next call reaches the stub as a trial call.
        - action: Send 10 more calls.
          expected: All calls reach the stub and succeed.
    sv:
      title: Kretsbrytaren öppnar och stänger
      description: Ett integrationstest får ett beroende att fallera och kontrollerar kretsbrytarens tillståndsbyten.
      preconditions: En attrapp för beroendet vars svar kan växlas mellan lyckat och misslyckat.
      expected: Kretsen öppnar vid gränsen, avvisar anrop i 30 sekunder och stänger efter ett lyckat provanrop.
      steps:
        - action: Skicka 20 anrop inom 10 sekunder medan attrappen låter varje anrop misslyckas.
          expected: Kretsen öppnar och nästa anrop misslyckas direkt utan att nå attrappen.
        - action: Växla attrappen till lyckade svar och vänta 30 sekunder.
          expected: Nästa anrop når attrappen som provanrop.
        - action: Skicka 10 anrop till.
          expected: Alla anrop når attrappen och lyckas.

  - id: RES-T04
    priority: high
    execution: manual
    tags: [graceful-degradation, search]
    refs: []
    en:
      title: Working without the search service
      description: Stops the search service and checks that the core functions keep working.
      preconditions: A test environment where the search service can be stopped; a signed-in test user.
      expected: Records can be viewed and edited, and the search field shows a clear notice.
      steps:
        - action: Stop the search service.
          expected: The health dashboard shows the search service as down.
        - action: Open a record from the recent-items list, edit a field and save.
          expected: The record opens and the change is saved.
        - action: Look at the search field and try a search.
          expected: A notice states that search is temporarily out of service; no error page appears.
    sv:
      title: Arbeta utan söktjänsten
      description: Stoppar söktjänsten och kontrollerar att kärnfunktionerna fortsätter att fungera.
      preconditions: En testmiljö där söktjänsten kan stoppas; en inloggad testanvändare.
      expected: Poster kan visas och redigeras, och sökfältet visar ett tydligt meddelande.
      steps:
        - action: Stoppa söktjänsten.
          expected: Hälsopanelen visar söktjänsten som nere.
        - action: Öppna en post från listan över senaste poster, ändra ett fält och spara.
          expected: Posten öppnas och ändringen sparas.
        - action: Titta på sökfältet och prova en sökning.
          expected: Ett meddelande anger att sökningen tillfälligt är ur funktion; ingen felsida visas.

  - id: RES-T05
    priority: high
    execution: automated
    tags: [idempotency, api]
    refs: []
    en:
      title: Repeated create request with the same idempotency key
      description: An API test sends the same create request twice with one idempotency key and once with another key.
      preconditions: An API client with permission to create records.
      expected: The same key yields one record; a new key yields a second record.
      steps:
        - action: Send a create request with header Idempotency-Key set to a new random value.
          expected: The record is created and its identifier is returned.
          data: "Idempotency-Key: 6f1c2a90-0001"
        - action: Send the identical request with the same key.
          expected: The response returns the same identifier and no second record exists.
        - action: Send the request with a different key.
          expected: A second record with a new identifier is created.
    sv:
      title: Upprepat skapa-anrop med samma idempotensnyckel
      description: Ett API-test skickar samma skapa-anrop två gånger med en idempotensnyckel och en gång med en annan nyckel.
      preconditions: En API-klient med behörighet att skapa poster.
      expected: Samma nyckel ger en post; en ny nyckel ger en andra post.
      steps:
        - action: Skicka ett skapa-anrop med huvudet Idempotency-Key satt till ett nytt slumpvärde.
          expected: Posten skapas och dess identifierare returneras.
          data: "Idempotency-Key: 6f1c2a90-0001"
        - action: Skicka det identiska anropet med samma nyckel.
          expected: Svaret returnerar samma identifierare och ingen andra post finns.
        - action: Skicka anropet med en annan nyckel.
          expected: En andra post med en ny identifierare skapas.

  - id: RES-T06
    priority: critical
    execution: automated
    tags: [consistency, transaction, fault-injection]
    refs: []
    en:
      title: Interrupted multi-record change leaves consistent data
      description: A test starts a change of 1 000 records and kills the server process in the middle.
      preconditions: A test database with 1 000 records that a bulk change updates together; a fault hook that stops the process after 500 updates.
      expected: After restart either all 1 000 records have the old values or all have the new values.
      steps:
        - action: Start the bulk change and let the fault hook kill the process after 500 updates.
          expected: The process stops in the middle of the change.
        - action: Restart the system and count the records with the old and new values.
          expected: The count is 1 000 old and 0 new, or 0 old and 1 000 new.
    sv:
      title: Avbruten ändring av flera poster lämnar konsekventa data
      description: Ett test startar en ändring av 1 000 poster och avbryter serverprocessen mitt i.
      preconditions: En testdatabas med 1 000 poster som en massändring uppdaterar tillsammans; en felkrok som stoppar processen efter 500 uppdateringar.
      expected: Efter omstart har antingen alla 1 000 poster de gamla värdena eller alla de nya.
      steps:
        - action: Starta massändringen och låt felkroken avbryta processen efter 500 uppdateringar.
          expected: Processen stannar mitt i ändringen.
        - action: Starta om systemet och räkna posterna med gamla och nya värden.
          expected: Antalet är 1 000 gamla och 0 nya, eller 0 gamla och 1 000 nya.

  - id: RES-T07
    priority: high
    execution: manual
    tags: [error-message, information-disclosure]
    refs: ["OWASP ASVS 4.0 V7.4.1", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.7", "IEC 62443-4-2 CR 3.7"]
    en:
      title: Error messages for users and API clients
      description: Provokes user errors and server errors and reviews the resulting messages and responses.
      preconditions: A test environment where a server error can be forced through a test switch; a list of 20 error situations.
      expected: Messages explain the problem and the next step, server errors show a reference, and no internal details leak.
      steps:
        - action: Trigger each of the 20 error situations in the interface and read the message.
          expected: Every message states what went wrong and what the user can do next.
          data: "e.g. invalid date, missing required field, expired session, file too large"
        - action: Force a server error in the interface and in the API.
          expected: The response shows a generic message and a reference number, with no stack trace, query, path or version.
        - action: Search the server logs for the reference number.
          expected: The log entry of the failed request contains the same value as its correlation id.
    sv:
      title: Felmeddelanden för användare och API-klienter
      description: Framkallar användarfel och serverfel och granskar meddelandena och svaren.
      preconditions: En testmiljö där ett serverfel kan framtvingas med en testbrytare; en lista med 20 felsituationer.
      expected: Meddelandena förklarar problemet och nästa steg, serverfel visar en referens och inga interna detaljer läcker ut.
      steps:
        - action: Framkalla var och en av de 20 felsituationerna i gränssnittet och läs meddelandet.
          expected: Varje meddelande anger vad som gick fel och vad användaren kan göra härnäst.
          data: "t.ex. ogiltigt datum, obligatoriskt fält saknas, utgången session, för stor fil"
        - action: Framtvinga ett serverfel i gränssnittet och i API:et.
          expected: Svaret visar ett allmänt meddelande och ett referensnummer, utan stackspårning, fråga, sökväg eller version.
        - action: Sök efter referensnumret i serverloggarna.
          expected: Loggposten för det misslyckade anropet innehåller samma värde som korrelations-id.

  - id: RES-T08
    priority: medium
    execution: automated
    tags: [bulkhead, load-test]
    refs: []
    en:
      title: Slow dependency does not block other functions
      description: A load test delays one dependency and measures requests that do not use it.
      preconditions: A stub for the dependency with a configurable delay; a load test with two request groups, one using the dependency and one not.
      expected: Requests that do not use the slow dependency keep their response time.
      steps:
        - action: Run the load test with no delay and record the 95th percentile of the group without the dependency.
          expected: A baseline value is recorded.
        - action: Set a delay of 10 seconds on the stub and run the load test again.
          expected: The 95th percentile of the group without the dependency is at most 20 % above the baseline.
    sv:
      title: Ett långsamt beroende blockerar inte andra funktioner
      description: Ett lasttest fördröjer ett beroende och mäter anrop som inte använder det.
      preconditions: En attrapp för beroendet med inställbar fördröjning; ett lasttest med två anropsgrupper, en som använder beroendet och en som inte gör det.
      expected: Anrop som inte använder det långsamma beroendet behåller sin svarstid.
      steps:
        - action: Kör lasttestet utan fördröjning och registrera 95:e percentilen för gruppen utan beroendet.
          expected: Ett jämförelsevärde registreras.
        - action: Sätt en fördröjning på 10 sekunder i attrappen och kör lasttestet igen.
          expected: 95:e percentilen för gruppen utan beroendet är högst 20 % över jämförelsevärdet.

  - id: RES-T09
    priority: medium
    execution: automated
    tags: [queue, dead-letter]
    refs: []
    en:
      title: Failing message ends in the dead-letter queue
      description: An integration test publishes a message that the consumer can never process.
      preconditions: The message consumer runs in a test environment with a dead-letter queue and alerting to a test channel.
      expected: The message is attempted 5 times, moved to the dead-letter queue and an alert is raised.
      steps:
        - action: Publish a message with content that makes the consumer fail.
          expected: The consumer log shows a failed attempt.
          data: "malformed payload"
        - action: Wait until processing stops and count the attempts in the log.
          expected: There are exactly 5 attempts.
        - action: Check the dead-letter queue and the test alert channel.
          expected: The message is in the dead-letter queue and one alert names the queue.
    sv:
      title: Meddelande som inte kan bearbetas hamnar i rätt kö
      description: Ett integrationstest publicerar ett meddelande som konsumenten aldrig kan bearbeta.
      preconditions: Meddelandekonsumenten körs i en testmiljö med en kö för obearbetbara meddelanden och larm till en testkanal.
      expected: Meddelandet provas 5 gånger, flyttas till kön för obearbetbara meddelanden och ett larm skapas.
      steps:
        - action: Publicera ett meddelande med innehåll som får konsumenten att misslyckas.
          expected: Konsumentens logg visar ett misslyckat försök.
          data: "felformaterat innehåll"
        - action: Vänta tills bearbetningen upphör och räkna försöken i loggen.
          expected: Det finns exakt 5 försök.
        - action: Kontrollera kön för obearbetbara meddelanden och testkanalen för larm.
          expected: Meddelandet ligger i kön och ett larm anger kön.

  - id: RES-T10
    priority: medium
    execution: manual
    tags: [fault-injection, review]
    refs: ["Google SRE book ch. 17", "Regulation (EU) 2022/2554 (DORA) Art. 24", "Regulation (EU) 2022/2554 (DORA) Art. 25", "ISO/IEC 27001:2022 A.5.30"]
    en:
      title: Review of the fault-injection schedule
      description: Checks that every critical dependency has been tested with injected faults during the last quarter.
      preconditions: The list of critical dependencies and the fault-injection test log are available.
      expected: Each critical dependency has a recorded fault-injection test within the last 3 months with findings followed up.
      steps:
        - action: Compare the list of critical dependencies with the entries in the test log.
          expected: Every dependency has an entry dated within the last 3 months.
        - action: Check the findings of each entry.
          expected: Every finding has an issue in the backlog with an owner.
    sv:
      title: Granskning av schemat för felinjektion
      description: Kontrollerar att varje kritiskt beroende har testats med injicerade fel under det senaste kvartalet.
      preconditions: Listan över kritiska beroenden och testloggen för felinjektion finns tillgängliga.
      expected: Varje kritiskt beroende har ett registrerat felinjektionstest inom de senaste 3 månaderna med uppföljda fynd.
      steps:
        - action: Jämför listan över kritiska beroenden med posterna i testloggen.
          expected: Varje beroende har en post daterad inom de senaste 3 månaderna.
        - action: Kontrollera fynden i varje post.
          expected: Varje fynd har ett ärende i backloggen med en ansvarig.

  - id: RES-T11
    priority: high
    execution: automated
    tags: [overload, load-shedding]
    refs: ["Google SRE book ch. 21 (Handling Overload)", "RFC 9110 §10.2.3 (Retry-After)"]
    en:
      title: Load shedding above the concurrency limit
      description: Sends more concurrent requests than the configured limit to one instance and checks the answers.
      preconditions: One instance with a known limit of requests in progress, for example 50, and a load tool.
      expected: Excess requests are rejected at once with 503 and Retry-After; accepted requests keep normal response times.
      steps:
        - action: Send 40 concurrent requests.
          expected: Every request succeeds within the normal response time.
          data: "limit 50"
        - action: Send 80 concurrent requests.
          expected: The 30 requests above the limit receive 503 with a Retry-After header within 100 ms.
          data: "80 concurrent requests"
        - action: Compare the response times of the accepted requests with the first step.
          expected: Their 95th percentile is within 20 % of the first step.
    sv:
      title: Lastavlastning över gränsen för samtidiga anrop
      description: Skickar fler samtidiga anrop än den inställda gränsen till en instans och kontrollerar svaren.
      preconditions: En instans med en känd gräns för pågående anrop, till exempel 50, och ett lastverktyg.
      expected: Överskjutande anrop avvisas direkt med 503 och Retry-After; godtagna anrop behåller vanliga svarstider.
      steps:
        - action: Skicka 40 samtidiga anrop.
          expected: Varje anrop lyckas inom den vanliga svarstiden.
          data: "gräns 50"
        - action: Skicka 80 samtidiga anrop.
          expected: De 30 anropen över gränsen får 503 med huvudet Retry-After inom 100 ms.
          data: "80 samtidiga anrop"
        - action: Jämför svarstiderna för de godtagna anropen med första steget.
          expected: Deras 95:e percentil ligger inom 20 % från första steget.

  - id: RES-T12
    priority: high
    execution: automated
    tags: [shutdown, graceful]
    refs: ["The Twelve-Factor App, IX Disposability"]
    en:
      title: Graceful shutdown under load
      description: Sends a stop signal to an instance while it serves slow requests.
      preconditions: A test environment with 2 instances, a load script and an endpoint that takes 5 seconds to answer.
      expected: No accepted request fails and the instance exits within 30 seconds.
      steps:
        - action: Start a load with requests to the 5-second endpoint across both instances.
          expected: Requests are being served by both instances.
        - action: Send the stop signal to one instance.
          expected: The instance stops receiving new requests and the load balancer sends them to the other instance.
          data: "SIGTERM"
        - action: Count the failed requests and measure the time to exit.
          expected: 0 accepted requests fail and the instance exits within 30 seconds.
    sv:
      title: Kontrollerad avstängning under last
      description: Skickar en stoppsignal till en instans medan den betjänar långsamma anrop.
      preconditions: En testmiljö med 2 instanser, ett lastskript och en ändpunkt som tar 5 sekunder att svara.
      expected: Inget mottaget anrop misslyckas och instansen avslutas inom 30 sekunder.
      steps:
        - action: Starta en last med anrop till ändpunkten på 5 sekunder över båda instanserna.
          expected: Anrop betjänas av båda instanserna.
        - action: Skicka stoppsignalen till en av instanserna.
          expected: Instansen slutar ta emot nya anrop och lastbalanseraren skickar dem till den andra instansen.
          data: "SIGTERM"
        - action: Räkna de misslyckade anropen och mät tiden till avslut.
          expected: 0 mottagna anrop misslyckas och instansen avslutas inom 30 sekunder.

  - id: RES-T13
    priority: medium
    execution: manual
    tags: [queues, bounds]
    refs: ["Google SRE book ch. 22 (Addressing Cascading Failures)"]
    en:
      title: Every queue and pool has a maximum
      description: Reviews the code and configuration for in-memory queues, worker pools and connection pools.
      preconditions: Access to the source code and the configuration of the service.
      expected: Each queue and pool has a configured maximum size.
      steps:
        - action: Search the code for queue, channel, pool and executor constructs.
          expected: A list of every queue and pool is produced.
          data: "search terms: queue, pool, executor, channel"
        - action: Look up the configured maximum for each entry.
          expected: Each entry has a maximum; entries without one are reported as findings.
    sv:
      title: Varje kö och pool har ett maxvärde
      description: Granskar koden och konfigurationen efter köer i minnet, arbetarpooler och anslutningspooler.
      preconditions: Åtkomst till tjänstens källkod och konfiguration.
      expected: Varje kö och pool har en inställd största storlek.
      steps:
        - action: Sök i koden efter köer, kanaler, pooler och exekverare.
          expected: En lista över varje kö och pool tas fram.
          data: "söktermer: queue, pool, executor, channel"
        - action: Slå upp det inställda maxvärdet för varje post.
          expected: Varje post har ett maxvärde; poster utan maxvärde rapporteras som avvikelser.

  - id: RES-T14
    priority: medium
    execution: manual
    tags: [startup, readiness]
    refs: ["The Twelve-Factor App, IX Disposability"]
    en:
      title: Start with the database down
      description: Starts an instance while the database is stopped and then starts the database.
      preconditions: A test environment where the database can be stopped and started on its own.
      expected: The instance waits as not ready without crashing and becomes ready within 30 seconds after the database is back.
      steps:
        - action: Stop the database and start a new application instance.
          expected: The instance keeps running and its readiness endpoint reports not ready.
        - action: Watch the instance for 5 minutes.
          expected: The process is not restarted by the orchestrator.
        - action: Start the database and poll the readiness endpoint.
          expected: The instance reports ready within 30 seconds and serves requests.
    sv:
      title: Start med databasen nere
      description: Startar en instans medan databasen är stoppad och startar sedan databasen.
      preconditions: En testmiljö där databasen kan stoppas och startas för sig.
      expected: Instansen väntar som inte redo utan att krascha och blir redo inom 30 sekunder efter att databasen är tillbaka.
      steps:
        - action: Stoppa databasen och starta en ny applikationsinstans.
          expected: Instansen fortsätter köra och dess beredskapsändpunkt rapporterar att den inte är redo.
        - action: Följ instansen i 5 minuter.
          expected: Processen startas inte om av orkestreringen.
        - action: Starta databasen och fråga beredskapsändpunkten med jämna mellanrum.
          expected: Instansen rapporterar redo inom 30 sekunder och besvarar anrop.

  - id: RES-T15
    priority: medium
    execution: manual
    tags: [messaging, reconnect]
    refs: ["ISO/IEC 25010:2023 recoverability"]
    en:
      title: Consumers reconnect after a broker restart
      description: Restarts the message broker while messages are being produced and watches the consumers.
      preconditions: A test environment with the broker, a producer sending messages and the normal consumers.
      expected: Every consumer is connected again and processing resumes within 5 minutes.
      steps:
        - action: Stop the broker for 3 minutes while the producer keeps trying to send.
          expected: The producer reports send failures or buffers messages.
        - action: Start the broker and note the time.
          expected: The broker accepts connections.
        - action: Watch the consumer connections and the queue length.
          expected: Every consumer is connected and the queue length falls within 5 minutes without anyone restarting a consumer.
    sv:
      title: Konsumenter ansluter igen efter omstart av förmedlingen
      description: Startar om meddelandeförmedlingen medan meddelanden produceras och följer konsumenterna.
      preconditions: En testmiljö med förmedlingen, en producent som skickar meddelanden och de vanliga konsumenterna.
      expected: Varje konsument är ansluten igen och behandlingen återupptas inom 5 minuter.
      steps:
        - action: Stoppa förmedlingen i 3 minuter medan producenten fortsätter försöka skicka.
          expected: Producenten rapporterar misslyckade sändningar eller buffrar meddelanden.
        - action: Starta förmedlingen och notera tiden.
          expected: Förmedlingen tar emot anslutningar.
        - action: Följ konsumenternas anslutningar och köns längd.
          expected: Varje konsument är ansluten och kön minskar inom 5 minuter utan att någon startar om en konsument.
