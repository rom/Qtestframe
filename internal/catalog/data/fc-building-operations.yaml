area: fc-building-operations
prefix: FCOPS
group: operations
catalogue: facilities
name: {en: "Accessibility, energy and maintenance of buildings", sv: "Tillgänglighet, energi och underhåll av byggnader"}
description:
  en: Accessible entrances, toilets, lifts, contrast marking and hearing loops, the energy performance certificate, energy metering and follow-up, building automation for energy, waste sorting, the preventive maintenance plan, the mandatory ventilation inspection, lift inspections and fault reports from occupants.
  sv: Tillgängliga entréer, toaletter, hissar, kontrastmarkering och hörslingor, energideklarationen, energimätning och uppföljning, fastighetsautomation för energi, källsortering, planen för förebyggande underhåll, den obligatoriska ventilationskontrollen, besiktning av hissar och felanmälningar från hyresgäster.

requirements:
  - id: FCOPS-01
    type: regulatory
    obligation: must
    priority: high
    tags: [accessibility, entrance, step-free]
    refs: ["BFS 2024:12 (byggnaders tillgänglighet och användbarhet)", "EN 17210:2021", "ISO 21542:2021"]
    tests: [FCOPS-T01]
    en:
      title: Step-free main entrance with a door of at least 0.8 m clear width
      description: The main entrance of the building MUST be reachable without steps from the street and the accessible parking, with a door of at least 0.8 m clear width that opens automatically or with a force of at most 30 N.
      rationale: Steps and heavy doors stop wheelchair users, people with walkers and parents with prams from entering on their own.
      criteria:
        - method: inspection
          text: The route from the street and the accessible parking to the main door has no step above 20 mm, the clear width is at least 0.8 m, and the opening force measures at most 30 N or the door opens automatically.
          threshold: width ≥ 0.8 m, force ≤ 30 N
    sv:
      title: Huvudentré utan trappsteg med en dörr med minst 0,8 m fri bredd
      description: Byggnadens huvudentré SKA gå att nå utan trappsteg från gatan och från parkeringen för rörelsehindrade, med en dörr med minst 0,8 m fri bredd som öppnas automatiskt eller med en kraft på högst 30 N.
      rationale: Trappsteg och tunga dörrar hindrar rullstolsanvändare, personer med rollator och föräldrar med barnvagn från att ta sig in på egen hand.
      criteria:
        - method: inspection
          text: Vägen från gatan och parkeringen för rörelsehindrade till huvuddörren har inget steg över 20 mm, den fria bredden är minst 0,8 m, och öppningskraften mäts till högst 30 N eller dörren öppnas automatiskt.
          threshold: bredd ≥ 0,8 m, kraft ≤ 30 N

  - id: FCOPS-02
    type: regulatory
    obligation: must
    priority: high
    tags: [accessibility, toilet]
    refs: ["BFS 2024:12 (byggnaders tillgänglighet och användbarhet)", "ISO 21542:2021"]
    tests: [FCOPS-T01]
    en:
      title: Accessible toilet on each floor with a turning circle of 1.5 m
      description: Each floor used by staff or visitors MUST have at least one accessible toilet with a free turning circle of 1.5 m in diameter, grab rails on both sides of the toilet and an alarm button within reach from the floor.
      rationale: Without an accessible toilet on the floor, a person using a wheelchair cannot work or attend a meeting there.
      criteria:
        - method: inspection
          text: On each floor, the accessible toilet has a free circle of 1.5 m, grab rails on both sides and an alarm button that can be reached from the floor and alerts staff.
          threshold: Ø 1.5 m
    sv:
      title: Tillgänglig toalett på varje våningsplan med vändyta på 1,5 m
      description: Varje våningsplan som används av personal eller besökare SKA ha minst en tillgänglig toalett med en fri vändyta på 1,5 m i diameter, stödhandtag på båda sidor om toaletten och en larmknapp som går att nå från golvet.
      rationale: Utan en tillgänglig toalett på våningsplanet kan en person som använder rullstol inte arbeta eller delta i ett möte där.
      criteria:
        - method: inspection
          text: På varje våningsplan har den tillgängliga toaletten en fri cirkel på 1,5 m, stödhandtag på båda sidor och en larmknapp som går att nå från golvet och larmar personal.
          threshold: Ø 1,5 m

  - id: FCOPS-03
    type: usability
    obligation: should
    priority: medium
    tags: [accessibility, contrast, visual-impairment]
    refs: ["EN 17210:2021"]
    tests: [FCOPS-T02]
    en:
      title: Contrast marking of glass doors, stairs and door frames
      description: Glass doors and glass walls, the first and last step of each stair and the door frames on escape routes SHOULD be marked with a light reflectance value difference of at least 30 points against their background.
      rationale: People with low vision walk into unmarked glass and miss steps that do not stand out from the floor.
      criteria:
        - method: test
          text: Measurements with a reflectance meter on 10 marked items show a difference of at least 30 points against the background.
          threshold: LRV difference ≥ 30
    sv:
      title: Kontrastmarkering av glasdörrar, trappor och dörrkarmar
      description: Glasdörrar och glasväggar, första och sista steget i varje trappa och dörrkarmarna i utrymningsvägar BÖR vara markerade med en skillnad i ljusreflektansvärde på minst 30 enheter mot bakgrunden.
      rationale: Personer med nedsatt syn går in i omärkt glas och missar trappsteg som inte skiljer sig från golvet.
      criteria:
        - method: test
          text: Mätningar med en reflektansmätare på 10 markerade föremål visar en skillnad på minst 30 enheter mot bakgrunden.
          threshold: skillnad i LRV ≥ 30

  - id: FCOPS-04
    type: usability
    obligation: must
    priority: medium
    tags: [accessibility, hearing-loop]
    refs: ["IEC 60118-4"]
    tests: [FCOPS-T02]
    en:
      title: Hearing loop in meeting rooms with more than 20 seats
      description: Each meeting room and auditorium with more than 20 seats MUST have an audio frequency induction loop that meets IEC 60118-4 and is marked with the loop sign at the entrance.
      rationale: Hearing aid users cannot follow speech in larger rooms without a loop, and the sign tells them to switch their aid to it.
      criteria:
        - method: test
          text: A loop measurement in each such room shows a field strength within the IEC 60118-4 limits over the seating area, and the sign is at the entrance.
    sv:
      title: Hörslinga i mötesrum med fler än 20 platser
      description: Varje mötesrum och hörsal med fler än 20 platser SKA ha en hörslinga som uppfyller IEC 60118-4 och är märkt med symbolen för hörslinga vid ingången.
      rationale: Användare av hörapparat kan inte följa tal i större rum utan slinga, och symbolen visar att de kan ställa om apparaten till den.
      criteria:
        - method: test
          text: En mätning av slingan i varje sådant rum visar en fältstyrka inom gränserna i IEC 60118-4 över publikytan, och symbolen finns vid ingången.

  - id: FCOPS-05
    type: regulatory
    obligation: must
    priority: high
    tags: [accessibility, lift]
    refs: ["EN 81-70:2021+A1:2022 (car type 2)", "BFS 2024:12 (byggnaders tillgänglighet och användbarhet)"]
    tests: [FCOPS-T01]
    en:
      title: Lift to each floor with a car of at least 1.1 × 1.4 m
      description: A building with more than one floor used by staff or visitors MUST have a lift to each such floor with a car of at least 1.1 m by 1.4 m and controls that meet EN 81-70.
      rationale: This car size takes a wheelchair with an accompanying person, and accessible controls let blind and short users operate the lift.
      criteria:
        - method: inspection
          text: The lift reaches each floor, the measured car is at least 1.1 m by 1.4 m, and the controls have tactile markings and spoken floor announcements.
          threshold: car ≥ 1.1 × 1.4 m
    sv:
      title: Hiss till varje våningsplan med en hisskorg på minst 1,1 × 1,4 m
      description: En byggnad med mer än ett våningsplan som används av personal eller besökare SKA ha en hiss till varje sådant plan med en hisskorg på minst 1,1 m gånger 1,4 m och manöverdon som uppfyller EN 81-70.
      rationale: Den korgstorleken rymmer en rullstol med ledsagare, och tillgängliga manöverdon låter blinda och korta personer använda hissen.
      criteria:
        - method: inspection
          text: Hissen når varje våningsplan, den uppmätta korgen är minst 1,1 m gånger 1,4 m, och manöverdonen har taktil märkning och talade våningsutrop.
          threshold: korg ≥ 1,1 × 1,4 m

  - id: FCOPS-06
    type: regulatory
    obligation: must
    priority: medium
    tags: [energy-performance-certificate, energy]
    refs: ["Lag (2006:985) om energideklaration för byggnader", "Directive (EU) 2024/1275 (EPBD) Art. 19 (energy performance certificates)"]
    tests: [FCOPS-T03]
    en:
      title: Valid energy performance certificate for the building
      description: The building owner MUST hold an energy performance certificate for the building that is less than 10 years old and registered with the national authority.
      rationale: The certificate shows the building's energy performance to buyers and tenants and lists cost-effective improvements.
      criteria:
        - method: inspection
          text: The certificate is found in the national register, is less than 10 years old and covers the building's current heated floor area.
          threshold: < 10 years old
    sv:
      title: Giltig energideklaration för byggnaden
      description: Byggnadens ägare SKA ha en energideklaration för byggnaden som är mindre än 10 år gammal och registrerad hos den nationella myndigheten.
      rationale: Deklarationen visar byggnadens energiprestanda för köpare och hyresgäster och listar kostnadseffektiva förbättringar.
      criteria:
        - method: inspection
          text: Deklarationen finns i det nationella registret, är mindre än 10 år gammal och omfattar byggnadens nuvarande uppvärmda golvarea.
          threshold: < 10 år gammal

  - id: FCOPS-07
    type: non_functional
    obligation: should
    priority: medium
    tags: [energy-metering, follow-up, energy-management]
    refs: ["ISO 50001:2018"]
    tests: [FCOPS-T04]
    en:
      title: Hourly energy metering with monthly follow-up against a baseline
      description: The building owner SHOULD meter the electricity, heating and cooling of the building every hour and compare each month's use, corrected for outdoor temperature, with the energy baseline.
      rationale: Hourly data show waste such as ventilation running at night, and the monthly comparison shows whether measures have worked.
      criteria:
        - method: analysis
          text: The energy system has hourly values for the 3 media for the last 12 months, and each monthly report shows the corrected use against the baseline.
    sv:
      title: Energimätning per timme med månadsuppföljning mot en baslinje
      description: Byggnadens ägare BÖR mäta byggnadens el, värme och kyla varje timme och jämföra varje månads användning, korrigerad för utetemperaturen, med energibaslinjen.
      rationale: Timvärden visar slöseri som ventilation som går på natten, och jämförelsen varje månad visar om åtgärder har gett effekt.
      criteria:
        - method: analysis
          text: Energisystemet har timvärden för de 3 medierna för de senaste 12 månaderna, och varje månadsrapport visar den korrigerade användningen mot baslinjen.

  - id: FCOPS-08
    type: functional
    obligation: should
    priority: medium
    tags: [building-automation, energy, alarms]
    refs: ["Directive (EU) 2024/1275 (EPBD) Art. 13(10) (building automation and control systems)"]
    tests: [FCOPS-T04]
    en:
      title: Building automation alerts when daily energy use exceeds the baseline by 15 %
      description: The building automation system SHOULD compare each day's energy use with the expected use for the outdoor temperature and alert the operator when the difference exceeds 15 %.
      rationale: Faults such as stuck valves and wrong schedules waste energy for months unless the system points them out.
      criteria:
        - method: test
          text: A ventilation unit set to run through the night raises an energy alert the next morning.
          threshold: alert above 15 % of expected use
    sv:
      title: Fastighetsautomationen larmar när dygnets energianvändning överskrider baslinjen med 15 %
      description: Systemet för fastighetsautomation BÖR jämföra varje dygns energianvändning med den förväntade för utetemperaturen och larma driften när skillnaden överstiger 15 %.
      rationale: Fel som fastnade ventiler och felaktiga drifttider slösar energi i månader om inte systemet pekar ut dem.
      criteria:
        - method: test
          text: Ett ventilationsaggregat som ställts att gå hela natten ger ett energilarm nästa morgon.
          threshold: larm över 15 % av förväntad användning

  - id: FCOPS-09
    type: non_functional
    obligation: should
    priority: low
    tags: [waste, environment, recycling]
    refs: ["ISO 14001:2026 §6.1.2 (environmental aspects)"]
    tests: [FCOPS-T05]
    en:
      title: Waste sorted in 6 fractions with yearly quantities
      description: The building SHOULD offer the occupants waste sorting in at least 6 fractions (food, paper, plastic, metal, glass and residual waste) and report the quantity of each fraction once a year.
      rationale: Sorting at the source is the precondition for recycling, and reported quantities show whether it works.
      criteria:
        - method: inspection
          text: The waste room has containers for the 6 fractions, and the yearly report from the waste contractor states the quantity of each.
    sv:
      title: Avfall sorteras i 6 fraktioner med årliga mängder
      description: Byggnaden BÖR erbjuda hyresgästerna källsortering i minst 6 fraktioner (matavfall, papper, plast, metall, glas och restavfall) och rapportera mängden för varje fraktion en gång per år.
      rationale: Sortering vid källan är förutsättningen för återvinning, och rapporterade mängder visar om den fungerar.
      criteria:
        - method: inspection
          text: Soprummet har kärl för de 6 fraktionerna, och avfallsentreprenörens årsrapport anger mängden för var och en.

  - id: FCOPS-10
    type: business
    obligation: must
    priority: high
    tags: [preventive-maintenance, maintenance-plan]
    refs: ["ISO 41001:2018"]
    tests: [FCOPS-T06]
    en:
      title: Preventive maintenance plan for each technical installation
      description: The facility manager MUST keep a preventive maintenance plan that gives each technical installation its maintenance tasks and intervals, and record each performed task with its date.
      rationale: Installations that are only repaired when they fail cost more and fail at the worst times.
      criteria:
        - method: review
          text: Each installation in the asset register is in the plan with tasks and intervals, and a sample of 10 tasks due in the last 6 months has a recorded completion date.
    sv:
      title: Plan för förebyggande underhåll för varje teknisk installation
      description: Fastighetsförvaltaren SKA ha en plan för förebyggande underhåll som ger varje teknisk installation dess underhållsuppgifter och intervall, och dokumentera varje utförd uppgift med datum.
      rationale: Installationer som bara repareras när de går sönder kostar mer och går sönder vid de sämsta tidpunkterna.
      criteria:
        - method: review
          text: Varje installation i anläggningsregistret finns i planen med uppgifter och intervall, och ett urval av 10 uppgifter som skulle ha utförts under de senaste 6 månaderna har ett dokumenterat datum för utförandet.

  - id: FCOPS-11
    type: regulatory
    obligation: must
    priority: high
    tags: [ventilation, ovk, mandatory-inspection]
    refs: ["Plan- och byggförordning (2011:338) 5 kap. 1–7 §§ (funktionskontroll av ventilationssystem)", "BFS 2011:16 (OVK) 3 § (besiktningsintervall)"]
    tests: [FCOPS-T07]
    en:
      title: Ventilation inspection within the interval for the building type
      description: The building owner MUST have each ventilation system inspected by a certified inspector within the interval set for the building type and correct each remark by the date stated in the protocol.
      rationale: Swedish rules require recurring functional inspection of ventilation, every 3 years for preschools, schools and care premises and for blocks of flats and offices with supply and exhaust ventilation, and every 6 years for blocks of flats and offices with exhaust-only or natural ventilation, because poor ventilation harms the indoor environment.
      criteria:
        - method: review
          text: The latest protocol for each system is within the interval, the inspector's certificate is valid, and each remark has a recorded correction by its date.
    sv:
      title: Ventilationskontroll inom intervallet för byggnadstypen
      description: Byggnadens ägare SKA låta en certifierad funktionskontrollant kontrollera varje ventilationssystem inom det intervall som gäller för byggnadstypen och rätta varje anmärkning till det datum som protokollet anger.
      rationale: Reglerna kräver återkommande funktionskontroll av ventilationen, vart 3:e år för förskolor, skolor och vårdlokaler och för flerbostadshus och kontor med FT- eller FTX-ventilation, och vart 6:e år för flerbostadshus och kontor med F-, FX- eller S-ventilation, eftersom dålig ventilation skadar inomhusmiljön.
      criteria:
        - method: review
          text: Det senaste protokollet för varje system ligger inom intervallet, kontrollantens certifikat är giltigt, och varje anmärkning har en dokumenterad rättelse till sitt datum.

  - id: FCOPS-12
    type: regulatory
    obligation: must
    priority: high
    tags: [lift, periodic-inspection]
    refs: ["Plan- och byggförordning (2011:338) 5 kap. 8–11 §§ (kontroll av motordrivna anordningar)", "BFS 2025:11 2 kap. 11 § (besiktningsintervall för hissar)"]
    tests: [FCOPS-T07]
    en:
      title: Periodic lift inspection by an accredited body
      description: The building owner MUST have each lift inspected by an accredited inspection body at the interval set by the national rules and correct each remark by the date in the inspection protocol.
      rationale: Lifts carry people and can trap or injure them, and periodic inspection is the main check on their safety. Swedish rules set the first recurring inspection 2 years after the first inspection and then every year for passenger lifts, every 2 years for goods lifts, stair lifts and platform lifts serving at most two dwellings, and defects that remain after the inspection without an immediate risk are to be corrected within one month.
      criteria:
        - method: review
          text: Each lift has a current inspection protocol from an accredited body, and each remark has a recorded correction by its date.
    sv:
      title: Återkommande besiktning av hissar av ett ackrediterat organ
      description: Byggnadens ägare SKA låta ett ackrediterat kontrollorgan besiktiga varje hiss med det intervall som de nationella reglerna anger och rätta varje anmärkning till det datum som besiktningsprotokollet anger.
      rationale: Hissar bär människor och kan stänga in eller skada dem, och återkommande besiktning är den främsta kontrollen av deras säkerhet. Reglerna anger den första återkommande besiktningen 2 år efter den första besiktningen och därefter varje år för personhissar och vartannat år för varuhissar, trapphissar och plattformshissar som betjänar högst två bostäder, och brister som kvarstår efter besiktningen utan omedelbar risk ska åtgärdas inom en månad.
      criteria:
        - method: review
          text: Varje hiss har ett aktuellt besiktningsprotokoll från ett ackrediterat organ, och varje anmärkning har en dokumenterad rättelse till sitt datum.

  - id: FCOPS-13
    type: business
    obligation: must
    priority: medium
    tags: [fault-report, occupants, response-time]
    refs: ["ISO 41001:2018"]
    tests: [FCOPS-T08]
    en:
      title: Fault reports acknowledged within 1 working day
      description: The facility manager MUST acknowledge each fault report from an occupant within 1 working day, with the expected date of the repair.
      rationale: Occupants who hear nothing report the same fault again and lose trust in the management.
      criteria:
        - method: analysis
          text: The fault reports of the last 3 months show an acknowledgement with an expected repair date within 1 working day for at least 95 % of them.
          threshold: ≤ 1 working day for ≥ 95 %
    sv:
      title: Felanmälningar bekräftas inom 1 arbetsdag
      description: Fastighetsförvaltaren SKA bekräfta varje felanmälan från en hyresgäst inom 1 arbetsdag, med det datum då reparationen väntas vara klar.
      rationale: Hyresgäster som inte hör något anmäler samma fel igen och tappar förtroendet för förvaltningen.
      criteria:
        - method: analysis
          text: Felanmälningarna för de senaste 3 månaderna visar en bekräftelse med förväntat datum för reparationen inom 1 arbetsdag för minst 95 % av dem.
          threshold: ≤ 1 arbetsdag för ≥ 95 %

  - id: FCOPS-14
    type: regulatory
    obligation: must
    priority: high
    tags: [work-environment, risk-assessment, premises]
    refs: ["AFS 2023:1 11 § (investigation and risk assessment)", "AFS 2023:1 13 § (action plan)", "AFS 2023:12 (design of workplaces)"]
    tests: [FCOPS-T09]
    en:
      title: Yearly work environment risk assessment of the premises
      description: The employer MUST assess the work environment risks of the premises at least once every 12 months, including lighting, indoor climate, noise and workstation ergonomics, and keep an action plan with an owner and a date for each risk found.
      rationale: Many work-related disorders come from the premises themselves, and a regular assessment with owned actions is what gets them fixed.
      criteria:
        - method: review
          text: The latest assessment is less than 12 months old, covers the 4 listed topics, and each risk has an action with owner and date.
    sv:
      title: Årlig riskbedömning av arbetsmiljön i lokalerna
      description: Arbetsgivaren SKA bedöma arbetsmiljöriskerna i lokalerna minst en gång var 12:e månad, inklusive belysning, inomhusklimat, buller och ergonomi vid arbetsplatserna, och föra en handlingsplan med ägare och datum för varje risk som hittas.
      rationale: Många arbetsrelaterade besvär kommer från själva lokalerna, och en regelbunden bedömning med åtgärder som har ägare är det som får dem åtgärdade.
      criteria:
        - method: review
          text: Den senaste bedömningen är mindre än 12 månader gammal, omfattar de 4 angivna områdena, och varje risk har en åtgärd med ägare och datum.

  - id: FCOPS-15
    type: non_functional
    obligation: must
    priority: medium
    tags: [lighting, workstation, ergonomics]
    refs: ["EN 12464-1:2021 (lighting of indoor work places)", "AFS 2023:12 5 kap. 24 § (quality of lighting)"]
    tests: [FCOPS-T10]
    en:
      title: Maintained illuminance of at least 500 lux at desk workstations
      description: The lighting MUST give a maintained illuminance of at least 500 lux on the task area of each desk workstation for writing, reading and screen work.
      rationale: Too little light causes eye strain and poor posture, as people lean in to see.
      criteria:
        - method: test
          text: Measurements with a calibrated lux meter on the task area of 10 sampled workstations are each at least 500 lux with the daylight screened off.
          threshold: "≥ 500 lux"
    sv:
      title: Underhållen belysningsstyrka på minst 500 lux vid skrivbordsarbetsplatser
      description: Belysningen SKA ge en underhållen belysningsstyrka på minst 500 lux på arbetsytan vid varje skrivbordsarbetsplats för skrivning, läsning och bildskärmsarbete.
      rationale: För lite ljus ger trötta ögon och dålig arbetsställning när man lutar sig fram för att se.
      criteria:
        - method: test
          text: Mätningar med en kalibrerad luxmätare på arbetsytan vid 10 utvalda arbetsplatser ger var och en minst 500 lux med dagsljuset avskärmat.
          threshold: "≥ 500 lux"

  - id: FCOPS-16
    type: usability
    obligation: should
    priority: medium
    tags: [ergonomics, workstation, furniture]
    refs: ["AFS 2023:12 3 kap. 28 § (furnishings and equipment)", "ISO 9241-5 (workstation layout and postural requirements)"]
    tests: [FCOPS-T10]
    en:
      title: Height-adjustable desk and adjustable chair at each fixed workstation
      description: Each fixed desk workstation SHOULD have a desk adjustable in height from 65 to 125 cm and a chair with adjustable seat height and back support.
      rationale: Adjustable furniture lets each person vary posture and fit the workstation to their body, which lowers neck and back problems.
      criteria:
        - method: inspection
          text: 10 sampled workstations each have a desk that moves at least from 65 to 125 cm and a chair with the 2 adjustments.
          threshold: "desk range 65–125 cm"
    sv:
      title: Höj- och sänkbart skrivbord och inställbar stol vid varje fast arbetsplats
      description: Varje fast skrivbordsarbetsplats BÖR ha ett skrivbord som kan ställas in i höjd från 65 till 125 cm och en stol med inställbar sitthöjd och ryggstöd.
      rationale: Inställbara möbler gör att var och en kan variera arbetsställningen och anpassa arbetsplatsen efter sin kropp, vilket minskar besvär i nacke och rygg.
      criteria:
        - method: inspection
          text: 10 utvalda arbetsplatser har vardera ett skrivbord som går minst från 65 till 125 cm och en stol med de 2 inställningarna.
          threshold: "skrivbordets intervall 65–125 cm"

  - id: FCOPS-17
    type: non_functional
    obligation: should
    priority: medium
    tags: [acoustics, open-plan, noise]
    refs: ["ISO 3382-3:2022 (open plan offices)"]
    tests: [FCOPS-T11]
    en:
      title: Spatial decay of speech of at least 7 dB in open-plan offices
      description: Each open-plan office area SHOULD have a spatial decay rate of A-weighted speech sound pressure level of at least 7 dB per doubling of distance.
      rationale: Speech that carries across an open-plan area is the main source of distraction and lost concentration there.
      criteria:
        - method: test
          text: A measurement following ISO 3382-3 along a line of workstations in each open-plan area gives a spatial decay rate of at least 7 dB.
          threshold: "D2,S ≥ 7 dB"
    sv:
      title: Rumslig avklingning av tal på minst 7 dB i kontorslandskap
      description: Varje kontorslandskap BÖR ha en rumslig avklingning av den A-vägda ljudtrycksnivån för tal på minst 7 dB per avståndsfördubbling.
      rationale: Tal som hörs över hela kontorslandskapet är den främsta orsaken till störningar och förlorad koncentration där.
      criteria:
        - method: test
          text: En mätning enligt ISO 3382-3 längs en rad arbetsplatser i varje kontorslandskap ger en rumslig avklingning på minst 7 dB.
          threshold: "D2,S ≥ 7 dB"

  - id: FCOPS-18
    type: business
    obligation: must
    priority: medium
    tags: [indoor-environment, complaints, investigation]
    refs: ["AFS 2023:1 (systematic work environment management)"]
    tests: [FCOPS-T12]
    en:
      title: Indoor environment complaints investigated within 10 working days
      description: The facility manager MUST start an investigation of each indoor environment complaint, such as draught, heat, smell or noise, within 10 working days and report the result to the complainant.
      rationale: Unanswered complaints about the indoor environment grow into sick leave and loss of trust in the employer.
      criteria:
        - method: review
          text: Each indoor environment complaint of the last 6 months has an investigation started within 10 working days and a recorded reply to the complainant.
          threshold: "≤ 10 working days"
    sv:
      title: Klagomål på inomhusmiljön utreds inom 10 arbetsdagar
      description: Fastighetsförvaltaren SKA påbörja en utredning av varje klagomål på inomhusmiljön, till exempel drag, värme, lukt eller buller, inom 10 arbetsdagar och redovisa resultatet för den som klagat.
      rationale: Obesvarade klagomål på inomhusmiljön växer till sjukfrånvaro och förlorat förtroende för arbetsgivaren.
      criteria:
        - method: review
          text: Varje klagomål på inomhusmiljön under de senaste 6 månaderna har en utredning som påbörjades inom 10 arbetsdagar och ett dokumenterat svar till den som klagat.
          threshold: "≤ 10 arbetsdagar"

tests:
  - id: FCOPS-T01
    priority: high
    execution: manual
    tags: [accessibility]
    refs: ["BFS 2024:12 (byggnaders tillgänglighet och användbarhet)"]
    en:
      title: Accessibility walk-through of entrance, toilets and lift
      description: Measures the entrance route, the accessible toilets and the lift with a tape measure and a door force gauge.
      preconditions: A tape measure, a door force gauge and access to each floor.
      expected: The entrance, each floor's accessible toilet and the lift meet the stated dimensions and features.
      steps:
        - action: Walk from the street and the accessible parking to the main door and measure steps, door width and opening force.
          expected: No step is above 20 mm, the width is at least 0.8 m, and the force is at most 30 N or the door is automatic.
          data: Width ≥ 0.8 m, force ≤ 30 N
        - action: On each floor, measure the free circle in the accessible toilet and check the grab rails and the alarm button.
          expected: The circle is at least 1.5 m, rails are on both sides, and the button reached from the floor alerts staff.
        - action: Measure the lift car and ride to each floor using the tactile buttons.
          expected: The car is at least 1.1 m by 1.4 m, it reaches each floor, and each floor is announced.
    sv:
      title: Tillgänglighetsgenomgång av entré, toaletter och hiss
      description: Mäter vägen till entrén, de tillgängliga toaletterna och hissen med måttband och dörrkraftmätare.
      preconditions: Ett måttband, en dörrkraftmätare och tillträde till varje våningsplan.
      expected: Entrén, varje plans tillgängliga toalett och hissen uppfyller de angivna måtten och funktionerna.
      steps:
        - action: Gå från gatan och parkeringen för rörelsehindrade till huvuddörren och mät steg, dörrbredd och öppningskraft.
          expected: Inget steg är över 20 mm, bredden är minst 0,8 m, och kraften är högst 30 N eller dörren är automatisk.
          data: Bredd ≥ 0,8 m, kraft ≤ 30 N
        - action: Mät den fria cirkeln i den tillgängliga toaletten på varje plan och kontrollera stödhandtag och larmknapp.
          expected: Cirkeln är minst 1,5 m, handtag finns på båda sidor, och knappen som nås från golvet larmar personal.
        - action: Mät hisskorgen och åk till varje plan med de taktila knapparna.
          expected: Korgen är minst 1,1 m gånger 1,4 m, den når varje plan, och varje plan ropas ut.

  - id: FCOPS-T02
    priority: medium
    execution: manual
    tags: [accessibility, contrast, hearing-loop]
    refs: ["EN 17210:2021", "IEC 60118-4"]
    en:
      title: Contrast measurements and hearing loop check
      description: Measures the reflectance of marked items and checks the hearing loops in rooms with more than 20 seats.
      preconditions: A reflectance meter, a loop field strength meter and the list of rooms with more than 20 seats.
      expected: Each measured marking has a difference of at least 30 points, and each listed room has a working, signed loop.
      steps:
        - action: Measure the reflectance of 10 markings and their backgrounds.
          expected: Each difference is at least 30 points.
          data: 10 markings
        - action: Measure the loop field strength over the seating area of each listed room while speech is played.
          expected: The values are within the IEC 60118-4 limits.
        - action: Look for the loop sign at each entrance.
          expected: The sign is there.
    sv:
      title: Kontrastmätning och kontroll av hörslingor
      description: Mäter reflektansen för markerade föremål och kontrollerar hörslingorna i rum med fler än 20 platser.
      preconditions: En reflektansmätare, en fältstyrkemätare för hörslingor och listan över rum med fler än 20 platser.
      expected: Varje mätt markering har en skillnad på minst 30 enheter, och varje listat rum har en fungerande och skyltad slinga.
      steps:
        - action: Mät reflektansen för 10 markeringar och deras bakgrunder.
          expected: Varje skillnad är minst 30 enheter.
          data: 10 markeringar
        - action: Mät slingans fältstyrka över publikytan i varje listat rum medan tal spelas upp.
          expected: Värdena ligger inom gränserna i IEC 60118-4.
        - action: Leta efter symbolen för hörslinga vid varje ingång.
          expected: Symbolen finns.

  - id: FCOPS-T03
    priority: medium
    execution: manual
    tags: [energy-performance-certificate]
    refs: ["Lag (2006:985) om energideklaration för byggnader"]
    en:
      title: Energy performance certificate in the national register
      description: Looks up the building's energy performance certificate in the national register.
      preconditions: The building's property designation and access to the national register of certificates.
      expected: A certificate less than 10 years old covering the current heated area is registered.
      steps:
        - action: Search the register for the property designation.
          expected: A certificate for the building is found.
        - action: Read the date and the heated floor area of the certificate.
          expected: The date is less than 10 years ago, and the area matches the current heated area.
    sv:
      title: Energideklarationen i det nationella registret
      description: Slår upp byggnadens energideklaration i det nationella registret.
      preconditions: Byggnadens fastighetsbeteckning och åtkomst till det nationella registret över energideklarationer.
      expected: En deklaration som är mindre än 10 år gammal och omfattar den nuvarande uppvärmda arean är registrerad.
      steps:
        - action: Sök i registret på fastighetsbeteckningen.
          expected: En deklaration för byggnaden hittas.
        - action: Läs deklarationens datum och uppvärmda golvarea.
          expected: Datumet ligger mindre än 10 år bakåt, och arean stämmer med den nuvarande uppvärmda arean.

  - id: FCOPS-T04
    priority: medium
    execution: manual
    tags: [energy-metering, building-automation]
    refs: ["ISO 50001:2018"]
    en:
      title: Energy data, monthly follow-up and the energy alert
      description: Checks the hourly energy data and the monthly reports, then provokes excess use to test the energy alert.
      preconditions: Access to the energy system and the building automation, the monthly energy reports and a ventilation unit that can run overnight without harm.
      expected: Hourly data and monthly comparisons exist, and the excess use raises an alert the next morning.
      steps:
        - action: Check the energy system for hourly values of electricity, heating and cooling for the last 12 months.
          expected: Each hour has a value for each of the 3 media.
        - action: Read the last 3 monthly reports.
          expected: Each shows the temperature-corrected use against the baseline.
        - action: Set the ventilation unit to run through the night.
          expected: The building automation raises an energy alert the next morning, and the unit is reset.
    sv:
      title: Energidata, månadsuppföljning och energilarmet
      description: Kontrollerar energidata per timme och månadsrapporterna och framkallar sedan en överförbrukning för att testa energilarmet.
      preconditions: Åtkomst till energisystemet och fastighetsautomationen, månadsrapporterna om energi och ett ventilationsaggregat som kan gå över natten utan skada.
      expected: Timdata och månadsjämförelser finns, och överförbrukningen ger ett larm nästa morgon.
      steps:
        - action: Kontrollera att energisystemet har timvärden för el, värme och kyla för de senaste 12 månaderna.
          expected: Varje timme har ett värde för vart och ett av de 3 medierna.
        - action: Läs de 3 senaste månadsrapporterna.
          expected: Var och en visar den temperaturkorrigerade användningen mot baslinjen.
        - action: Ställ ventilationsaggregatet att gå hela natten.
          expected: Fastighetsautomationen ger ett energilarm nästa morgon, och aggregatet återställs.

  - id: FCOPS-T05
    priority: low
    execution: manual
    tags: [waste]
    refs: []
    en:
      title: Waste room and yearly waste report
      description: Inspects the waste room and reads the waste contractor's yearly report.
      preconditions: Access to the waste room and the latest yearly report from the waste contractor.
      expected: Containers for the 6 fractions exist, and the report states the quantity of each.
      steps:
        - action: Inspect the waste room.
          expected: There are labelled containers for food, paper, plastic, metal, glass and residual waste.
        - action: Read the yearly report.
          expected: It states the quantity of each of the 6 fractions.
    sv:
      title: Soprum och årlig avfallsrapport
      description: Granskar soprummet och läser avfallsentreprenörens årsrapport.
      preconditions: Tillträde till soprummet och den senaste årsrapporten från avfallsentreprenören.
      expected: Kärl för de 6 fraktionerna finns, och rapporten anger mängden för var och en.
      steps:
        - action: Granska soprummet.
          expected: Det finns märkta kärl för matavfall, papper, plast, metall, glas och restavfall.
        - action: Läs årsrapporten.
          expected: Den anger mängden för var och en av de 6 fraktionerna.

  - id: FCOPS-T06
    priority: high
    execution: manual
    tags: [preventive-maintenance]
    refs: ["ISO 41001:2018"]
    en:
      title: Maintenance plan compared with the asset register and work records
      description: Matches the asset register with the maintenance plan and samples tasks that were due.
      preconditions: The asset register, the preventive maintenance plan and the work records of the last 6 months.
      expected: Each installation is in the plan, and each sampled task has a completion date.
      steps:
        - action: Match each installation in the asset register with the plan.
          expected: Each has tasks and intervals.
        - action: Pick 10 tasks that were due in the last 6 months and find them in the work records.
          expected: Each has a recorded completion date.
          data: 10 tasks
    sv:
      title: Underhållsplanen jämförs med anläggningsregistret och arbetsorder
      description: Matchar anläggningsregistret mot underhållsplanen och gör stickprov på uppgifter som skulle ha utförts.
      preconditions: Anläggningsregistret, planen för förebyggande underhåll och arbetsordrarna för de senaste 6 månaderna.
      expected: Varje installation finns i planen, och varje vald uppgift har ett datum för utförandet.
      steps:
        - action: Matcha varje installation i anläggningsregistret mot planen.
          expected: Var och en har uppgifter och intervall.
        - action: Välj 10 uppgifter som skulle ha utförts under de senaste 6 månaderna och hitta dem bland arbetsordrarna.
          expected: Var och en har ett dokumenterat datum för utförandet.
          data: 10 uppgifter

  - id: FCOPS-T07
    priority: high
    execution: manual
    tags: [ventilation, lift, mandatory-inspection]
    refs: ["Plan- och byggförordning (2011:338) 5 kap. 1–7 §§ (funktionskontroll av ventilationssystem)", "BFS 2011:16 (OVK) 3 § (besiktningsintervall)", "BFS 2025:11 2 kap. 11 § (besiktningsintervall för hissar)"]
    en:
      title: Ventilation and lift inspection protocols
      description: Reviews the latest ventilation inspection and lift inspection protocols and the correction of their remarks.
      preconditions: The list of ventilation systems and lifts, the latest protocols and the work records for the remarks.
      expected: Each protocol is within its interval from a qualified inspector, and each remark is corrected by its date.
      steps:
        - action: For each ventilation system, compare the protocol date with the interval for the building type and check the inspector's certificate.
          expected: Each protocol is within the interval, and the certificate was valid on the inspection date.
          data: Interval 3 or 6 years for the building type
        - action: For each lift, check the date and the accreditation of the inspection body.
          expected: Each protocol is current and from an accredited body.
          data: First recurring inspection after 2 years, then every year for passenger lifts
        - action: For each remark in the protocols, find the correction in the work records.
          expected: Each remark has a correction dated by its deadline.
    sv:
      title: Protokoll från ventilationskontroll och hissbesiktning
      description: Granskar de senaste protokollen från ventilationskontroll och hissbesiktning och rättelsen av deras anmärkningar.
      preconditions: Listan över ventilationssystem och hissar, de senaste protokollen och arbetsordrarna för anmärkningarna.
      expected: Varje protokoll ligger inom sitt intervall och kommer från en behörig kontrollant, och varje anmärkning är rättad till sitt datum.
      steps:
        - action: Jämför protokollets datum med intervallet för byggnadstypen och kontrollera kontrollantens certifikat för varje ventilationssystem.
          expected: Varje protokoll ligger inom intervallet, och certifikatet var giltigt på kontrolldagen.
          data: Intervall 3 eller 6 år för byggnadstypen
        - action: Kontrollera datum och ackreditering för kontrollorganet för varje hiss.
          expected: Varje protokoll är aktuellt och kommer från ett ackrediterat organ.
          data: Första återkommande besiktning efter 2 år, därefter varje år för personhissar
        - action: Hitta rättelsen i arbetsordrarna för varje anmärkning i protokollen.
          expected: Varje anmärkning har en rättelse daterad senast vid sin tidsgräns.

  - id: FCOPS-T08
    priority: medium
    execution: automated
    tags: [fault-report]
    refs: []
    en:
      title: Acknowledgement time of fault reports
      description: A script computes the time from each fault report to its acknowledgement with an expected repair date.
      preconditions: An export of the fault reports of the last 3 months with report and acknowledgement times.
      expected: At least 95 % are acknowledged with an expected date within 1 working day.
      steps:
        - action: Compute the working time between report and acknowledgement for each fault report.
          expected: Each report has a value.
        - action: Compute the share acknowledged within 1 working day with an expected repair date.
          expected: The share is at least 95 %.
          data: Limit 1 working day
    sv:
      title: Tid till bekräftelse av felanmälningar
      description: Ett skript beräknar tiden från varje felanmälan till bekräftelsen med förväntat datum för reparationen.
      preconditions: En export av felanmälningarna för de senaste 3 månaderna med tidpunkter för anmälan och bekräftelse.
      expected: Minst 95 % bekräftas med förväntat datum inom 1 arbetsdag.
      steps:
        - action: Beräkna arbetstiden mellan anmälan och bekräftelse för varje felanmälan.
          expected: Varje anmälan har ett värde.
        - action: Beräkna andelen som bekräftats inom 1 arbetsdag med förväntat datum för reparationen.
          expected: Andelen är minst 95 %.
          data: Gräns 1 arbetsdag

  - id: FCOPS-T09
    priority: high
    execution: manual
    tags: [work-environment, risk-assessment]
    refs: ["AFS 2023:1 11 § (investigation and risk assessment)", "AFS 2023:1 13 § (action plan)"]
    en:
      title: Review of the work environment risk assessment of the premises
      description: Reviews the latest risk assessment and its action plan.
      preconditions: The latest work environment risk assessment of the premises and the action plan.
      expected: The assessment is current, covers the 4 topics and has an owned action for each risk.
      steps:
        - action: Read the date of the latest assessment.
          expected: It is less than 12 months old.
        - action: Check the assessment for lighting, indoor climate, noise and workstation ergonomics.
          expected: Each topic is assessed.
        - action: Compare the risks found with the action plan.
          expected: Each risk has an action with an owner and a date.
    sv:
      title: Granskning av riskbedömningen av arbetsmiljön i lokalerna
      description: Granskar den senaste riskbedömningen och dess handlingsplan.
      preconditions: Den senaste riskbedömningen av arbetsmiljön i lokalerna och handlingsplanen.
      expected: Bedömningen är aktuell, omfattar de 4 områdena och har en åtgärd med ägare för varje risk.
      steps:
        - action: Läs datumet för den senaste bedömningen.
          expected: Den är mindre än 12 månader gammal.
        - action: Kontrollera att bedömningen omfattar belysning, inomhusklimat, buller och ergonomi vid arbetsplatserna.
          expected: Varje område är bedömt.
        - action: Jämför de risker som hittats med handlingsplanen.
          expected: Varje risk har en åtgärd med ägare och datum.

  - id: FCOPS-T10
    priority: medium
    execution: manual
    tags: [lighting, ergonomics]
    refs: ["EN 12464-1:2021 (lighting of indoor work places)", "AFS 2023:12 5 kap. 24 § (quality of lighting)", "AFS 2023:12 3 kap. 28 § (furnishings and equipment)"]
    en:
      title: Illuminance and furniture at sampled workstations
      description: Measures the illuminance and checks the furniture adjustments at 10 sampled workstations.
      preconditions: A calibrated lux meter, a tape measure and 10 desk workstations chosen across the floors, measured after dark or with blinds closed.
      expected: Each workstation has at least 500 lux on the task area and adjustable desk and chair.
      steps:
        - action: Measure the illuminance at the centre of the task area of each workstation.
          expected: Each reading is at least 500 lux.
        - action: Move each desk to its lowest and highest position and measure the height.
          expected: The range covers at least 65 to 125 cm.
        - action: Check the seat height and back support adjustment of each chair.
          expected: Both can be adjusted.
    sv:
      title: Belysningsstyrka och möbler vid utvalda arbetsplatser
      description: Mäter belysningsstyrkan och kontrollerar möblernas inställningar vid 10 utvalda arbetsplatser.
      preconditions: En kalibrerad luxmätare, ett måttband och 10 skrivbordsarbetsplatser valda på olika våningar, mätt efter mörkrets inbrott eller med neddragna persienner.
      expected: Varje arbetsplats har minst 500 lux på arbetsytan och inställbart skrivbord och stol.
      steps:
        - action: Mät belysningsstyrkan mitt på arbetsytan vid varje arbetsplats.
          expected: Varje avläsning är minst 500 lux.
        - action: Ställ varje skrivbord i lägsta och högsta läge och mät höjden.
          expected: Intervallet omfattar minst 65 till 125 cm.
        - action: Kontrollera inställningen av sitthöjd och ryggstöd på varje stol.
          expected: Båda går att ställa in.

  - id: FCOPS-T11
    priority: low
    execution: manual
    tags: [acoustics, open-plan]
    refs: ["ISO 3382-3:2022 (open plan offices)"]
    en:
      title: Spatial decay rate measurement in an open-plan office
      description: An acoustician measures the spatial decay rate of speech along a line of workstations.
      preconditions: An acoustician with a calibrated sound source and meter, and the open-plan area unoccupied with ventilation in normal operation.
      expected: The spatial decay rate is at least 7 dB per doubling of distance.
      steps:
        - action: Choose a measurement line through at least 4 workstations from 2 to 16 m from the source.
          expected: The positions are marked.
        - action: Measure the A-weighted speech level at each position.
          expected: A level per position is recorded.
        - action: Calculate the spatial decay rate from the levels.
          expected: The result is at least 7 dB.
    sv:
      title: Mätning av rumslig avklingning i ett kontorslandskap
      description: En akustiker mäter den rumsliga avklingningen av tal längs en rad arbetsplatser.
      preconditions: En akustiker med kalibrerad ljudkälla och mätare, och kontorslandskapet tomt med ventilationen i normal drift.
      expected: Den rumsliga avklingningen är minst 7 dB per avståndsfördubbling.
      steps:
        - action: Välj en mätlinje genom minst 4 arbetsplatser från 2 till 16 m från källan.
          expected: Positionerna är markerade.
        - action: Mät den A-vägda talnivån vid varje position.
          expected: En nivå per position är noterad.
        - action: Beräkna den rumsliga avklingningen från nivåerna.
          expected: Resultatet är minst 7 dB.

  - id: FCOPS-T12
    priority: medium
    execution: manual
    tags: [indoor-environment, complaints]
    refs: ["AFS 2023:1 (systematic work environment management)"]
    en:
      title: Handling times of indoor environment complaints
      description: Checks the investigation start and the reply for each indoor environment complaint.
      preconditions: The fault report system with the indoor environment complaints of the last 6 months.
      expected: Each complaint was investigated within 10 working days and answered.
      steps:
        - action: Filter the fault reports on the indoor environment category.
          expected: A list of complaints with dates.
        - action: Count the working days from each complaint to the start of the investigation.
          expected: Each count is at most 10.
        - action: Look for the reply to each complainant.
          expected: Each complaint has a recorded reply with the result.
    sv:
      title: Handläggningstider för klagomål på inomhusmiljön
      description: Kontrollerar när utredningen började och svaret för varje klagomål på inomhusmiljön.
      preconditions: Felanmälningssystemet med klagomålen på inomhusmiljön under de senaste 6 månaderna.
      expected: Varje klagomål utreddes inom 10 arbetsdagar och besvarades.
      steps:
        - action: Filtrera felanmälningarna på kategorin inomhusmiljö.
          expected: En lista med klagomål och datum.
        - action: Räkna arbetsdagarna från varje klagomål till att utredningen började.
          expected: Varje antal är högst 10.
        - action: Leta efter svaret till varje person som klagat.
          expected: Varje klagomål har ett dokumenterat svar med resultatet.
