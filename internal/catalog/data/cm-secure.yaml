area: cm-secure
prefix: CMSEC
group: security
catalogue: communications
name: {en: Secure communications, sv: Säker kommunikation}
description:
  en: Network zones and conduits, deny-by-default filtering, firewall rule reviews, encryption between sites and for remote access, port-based network access control, a separate management network, protection against denial of service, flow logs, validating DNS resolvers, certificate renewal and the separation of industrial control networks.
  sv: Nätzoner och kommunikationskanaler, filtrering där allt är nekat från början, granskning av brandväggsregler, kryptering mellan platser och vid distansåtkomst, portbaserad behörighetskontroll till nätet, ett separat förvaltningsnät, skydd mot överbelastningsattacker, flödesloggar, validerande DNS-servrar, förnyelse av certifikat och avskiljning av industriella styrnät.

requirements:
  - id: CMSEC-01
    type: security
    obligation: must
    priority: critical
    tags: [segmentation, zones, conduits]
    refs: ["ISO/IEC 27033-1:2015", "ISO/IEC 27001:2022 A.8.22", "IEC 62443-3-3 SR 5.1", "MITRE ATT&CK T1210 (exploitation of remote services)", "MITRE ATT&CK M1030 (network segmentation)"]
    tests: [CMSEC-T01]
    en:
      title: Network divided into documented security zones
      description: The network MUST be divided into security zones, such as users, servers, management, guests and partner connections, with each zone and each permitted connection between zones listed in a zone and conduit register.
      rationale: Zones limit how far an intruder or malware can move from the first compromised device.
      criteria:
        - method: inspection
          text: The register lists each zone with its networks and each permitted conduit with source, destination, services and owner, and a sample of 10 networks matches the live configuration.
    sv:
      title: Nätet indelat i dokumenterade säkerhetszoner
      description: Nätet SKA vara indelat i säkerhetszoner, till exempel användare, servrar, förvaltning, gäster och partneranslutningar, där varje zon och varje tillåten förbindelse mellan zoner finns i ett register över zoner och kommunikationskanaler.
      rationale: Zoner begränsar hur långt en inkräktare eller skadlig kod kan ta sig från den första komprometterade enheten.
      criteria:
        - method: inspection
          text: Registret listar varje zon med dess nät och varje tillåten kommunikationskanal med källa, mål, tjänster och ägare, och ett urval av 10 nät stämmer med den verkliga konfigurationen.

  - id: CMSEC-02
    type: security
    obligation: must
    priority: critical
    tags: [firewall, deny-by-default, zones]
    refs: ["IEC 62443-3-3 SR 5.2", "ISO/IEC 27033-4:2014", "ISO/IEC 27001:2022 A.8.20", "MITRE ATT&CK T1210 (exploitation of remote services)", "MITRE ATT&CK M1037 (filter network traffic)"]
    tests: [CMSEC-T01]
    en:
      title: Traffic between zones denied by default
      description: The firewalls between zones MUST deny each connection that is not listed as a permitted conduit in the zone and conduit register.
      rationale: An explicit list of allowed traffic is the only way to know what can cross a zone boundary.
      criteria:
        - method: test
          text: Connection attempts on 20 services that are not in the register, between 3 pairs of zones, are blocked and logged.
    sv:
      title: Trafik mellan zoner nekas från början
      description: Brandväggarna mellan zoner SKA neka varje förbindelse som inte finns som tillåten kommunikationskanal i registret över zoner och kommunikationskanaler.
      rationale: En uttrycklig lista över tillåten trafik är det enda sättet att veta vad som kan passera en zongräns.
      criteria:
        - method: test
          text: Anslutningsförsök mot 20 tjänster som inte finns i registret, mellan 3 par av zoner, blockeras och loggas.

  - id: CMSEC-03
    type: security
    obligation: must
    priority: high
    tags: [firewall, rule-review]
    refs: ["ISO/IEC 27033-4:2014", "ISO/IEC 27001:2022 A.8.20", "MITRE ATT&CK M1037 (filter network traffic)"]
    tests: [CMSEC-T02]
    en:
      title: Firewall rules reviewed every 6 months
      description: The network security team MUST review each firewall rule every 6 months with its owner and remove each rule that has no owner, no matching register entry or no hits in the last 90 days.
      rationale: Rule sets grow with each project and seldom shrink, and forgotten rules are a common path for attackers.
      criteria:
        - method: review
          text: The latest review is at most 6 months old, lists each rule with owner and decision, and the removed rules are gone from the live rule set.
          threshold: every 6 months
    sv:
      title: Brandväggsregler granskas var 6:e månad
      description: Nätsäkerhetsfunktionen SKA granska varje brandväggsregel var 6:e månad med dess ägare och ta bort varje regel som saknar ägare, saknar motsvarande post i registret eller inte har träffats under de senaste 90 dagarna.
      rationale: Regeluppsättningar växer med varje projekt och krymper sällan, och bortglömda regler är en vanlig väg för angripare.
      criteria:
        - method: review
          text: Den senaste granskningen är högst 6 månader gammal och listar varje regel med ägare och beslut, och de borttagna reglerna finns inte längre i den aktiva regeluppsättningen.
          threshold: var 6:e månad

  - id: CMSEC-04
    type: security
    obligation: must
    priority: critical
    tags: [encryption, site-to-site, ipsec]
    refs: ["ISO/IEC 27033-5:2013", "IEC 62443-3-3 SR 4.1", "ISO/IEC 27001:2022 A.8.24", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1040 (network sniffing)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    tests: [CMSEC-T03]
    en:
      title: Traffic between sites encrypted over shared networks
      description: The network MUST encrypt and integrity-protect each connection between sites that crosses a network not owned by the organisation, with IPsec or MACsec using AES-GCM with keys of at least 256 bits.
      rationale: Leased lines and the internet pass through equipment run by others, where traffic can be read or changed.
      criteria:
        - method: inspection
          text: The configuration of each site-to-site connection over a third-party network shows IPsec or MACsec with AES-GCM and 256-bit keys.
        - method: test
          text: A capture on a third-party segment of a site-to-site connection shows only encrypted packets.
    sv:
      title: Trafik mellan platser krypteras över delade nät
      description: Nätet SKA kryptera och integritetsskydda varje förbindelse mellan platser som går över ett nät som organisationen inte äger, med IPsec eller MACsec med AES-GCM och nycklar på minst 256 bitar.
      rationale: Hyrda förbindelser och internet passerar utrustning som drivs av andra, där trafiken kan läsas eller ändras.
      criteria:
        - method: inspection
          text: Konfigurationen av varje förbindelse mellan platser över ett nät hos tredje part visar IPsec eller MACsec med AES-GCM och 256-bitarsnycklar.
        - method: test
          text: En inspelning på ett avsnitt hos tredje part av en förbindelse mellan platser visar bara krypterade paket.

  - id: CMSEC-05
    type: security
    obligation: must
    priority: critical
    tags: [remote-access, vpn, mfa]
    refs: ["ISO/IEC 27033-5:2013", "IEC 62443-3-3 SR 1.13", "ISO/IEC 27001:2022 A.6.7", "CWE-308 (use of single-factor authentication)", "MITRE ATT&CK T1133 (external remote services)", "MITRE ATT&CK M1032 (multi-factor authentication)"]
    tests: [CMSEC-T04]
    en:
      title: Remote access only through VPN with multi-factor authentication
      description: The network MUST accept remote access to internal zones only through the organisation's VPN gateway after multi-factor authentication of the user.
      rationale: Stolen passwords are the most common way into networks, and a second factor stops most of those attempts.
      criteria:
        - method: test
          text: A VPN login with a valid password and no second factor is refused, the same login with the second factor succeeds, and an external scan finds no other remote access service.
    sv:
      title: Distansåtkomst bara via VPN med flerfaktorsautentisering
      description: Nätet SKA ta emot distansåtkomst till interna zoner bara via organisationens VPN-gateway efter flerfaktorsautentisering av användaren.
      rationale: Stulna lösenord är den vanligaste vägen in i nät, och en andra faktor stoppar de flesta av de försöken.
      criteria:
        - method: test
          text: En VPN-inloggning med giltigt lösenord utan andra faktor nekas, samma inloggning med den andra faktorn lyckas, och en extern skanning hittar ingen annan tjänst för distansåtkomst.

  - id: CMSEC-06
    type: security
    obligation: must
    priority: high
    tags: [network-access-control, 802-1x, quarantine]
    refs: ["IEEE 802.1X-2020", "IEC 62443-3-3 SR 1.2", "MITRE ATT&CK T1200 (hardware additions)"]
    tests: [CMSEC-T05]
    en:
      title: Unknown devices on wired ports placed in quarantine
      description: Each wired access port in user areas MUST authenticate the connected device with IEEE 802.1X and place a device that fails authentication in a quarantine network that reaches only the onboarding portal.
      rationale: Network ports in meeting rooms and corridors are open to anyone in the building.
      criteria:
        - method: test
          text: An unregistered laptop connected to a user port gets an address in the quarantine network and reaches only the onboarding portal, while a registered laptop gets its normal network.
    sv:
      title: Okända enheter på fasta portar hamnar i karantän
      description: Varje fast accessport i användarutrymmen SKA autentisera den anslutna enheten med IEEE 802.1X och lägga en enhet som inte autentiseras i ett karantännät som bara når registreringsportalen.
      rationale: Nätuttag i mötesrum och korridorer är åtkomliga för alla som befinner sig i byggnaden.
      criteria:
        - method: test
          text: En oregistrerad dator som ansluts till en användarport får en adress i karantännätet och når bara registreringsportalen, medan en registrerad dator får sitt vanliga nät.

  - id: CMSEC-07
    type: security
    obligation: must
    priority: high
    tags: [management-network, out-of-band, segmentation]
    refs: ["ISO/IEC 27033-2:2012 (network security design)", "ISO/IEC 27001:2022 A.8.22", "MITRE ATT&CK T1021 (remote services)", "MITRE ATT&CK M1030 (network segmentation)"]
    tests: [CMSEC-T06]
    en:
      title: Network elements managed from a separate management zone
      description: The management interfaces of routers, switches, firewalls and access points MUST be reachable only from the management zone and from its jump hosts.
      rationale: An attacker who reaches a management interface from a user network can take over the network itself.
      criteria:
        - method: test
          text: Connections to the management addresses of 10 elements fail from a user, server and guest network and succeed from a jump host in the management zone.
    sv:
      title: Nätelement förvaltas från en separat förvaltningszon
      description: Förvaltningsgränssnitten i routrar, switchar, brandväggar och accesspunkter SKA vara nåbara bara från förvaltningszonen och dess hoppservrar.
      rationale: En angripare som når ett förvaltningsgränssnitt från ett användarnät kan ta över själva nätet.
      criteria:
        - method: test
          text: Anslutningar till förvaltningsadresserna för 10 element misslyckas från ett användarnät, ett servernät och ett gästnät och lyckas från en hoppserver i förvaltningszonen.

  - id: CMSEC-08
    type: security
    obligation: should
    priority: high
    tags: [ddos, availability, scrubbing]
    refs: ["IEC 62443-3-3 SR 7.1", "ISO/IEC 27033-4:2014", "MITRE ATT&CK T1498 (network denial of service)"]
    tests: [CMSEC-T07]
    en:
      title: Denial-of-service attacks mitigated within 10 minutes
      description: The internet connection SHOULD be covered by a mitigation service that starts filtering a volumetric denial-of-service attack within 10 minutes after it is detected.
      rationale: A volumetric attack fills the access link before the organisation's own firewall sees it, so the filtering has to happen upstream.
      criteria:
        - method: test
          text: In an attack simulation agreed with the provider, filtering starts within 10 minutes and legitimate test traffic reaches the organisation during the attack.
          threshold: ≤ 10 min
    sv:
      title: Överbelastningsattacker motverkas inom 10 minuter
      description: Internetanslutningen BÖR omfattas av en skyddstjänst som börjar filtrera en volymbaserad överbelastningsattack inom 10 minuter efter att den upptäckts.
      rationale: En volymbaserad attack fyller anslutningen innan organisationens egen brandvägg ser den, så filtreringen behöver ske längre upp i nätet.
      criteria:
        - method: test
          text: Vid en attacksimulering som avtalats med leverantören börjar filtreringen inom 10 minuter och legitim testtrafik når organisationen under attacken.
          threshold: ≤ 10 min

  - id: CMSEC-09
    type: security
    obligation: must
    priority: high
    tags: [flow-logs, monitoring, siem]
    refs: ["IEC 62443-3-3 SR 6.2", "ISO/IEC 27001:2022 A.8.15", "ISO/IEC 27001:2022 A.8.16", "MITRE ATT&CK T1048 (exfiltration over alternative protocol)"]
    tests: [CMSEC-T08]
    en:
      title: Flow logs of zone boundaries kept for 90 days
      description: The firewalls at zone boundaries MUST send a flow record of each allowed and denied connection to the central log system within 5 minutes, where the records are kept for 90 days.
      rationale: Flow records show where an intruder went and what was sent out, long after the connections have closed.
      criteria:
        - method: test
          text: A test connection across a zone boundary is found in the central log system within 5 minutes, and records from 90 days ago are still searchable.
          threshold: ≤ 5 min, 90 days
    sv:
      title: Flödesloggar från zongränser sparas i 90 dagar
      description: Brandväggarna vid zongränser SKA skicka en flödespost för varje tillåten och nekad förbindelse till det centrala loggsystemet inom 5 minuter, där posterna sparas i 90 dagar.
      rationale: Flödesposter visar vart en inkräktare tog sig och vad som skickades ut, långt efter att förbindelserna stängts.
      criteria:
        - method: test
          text: En testförbindelse över en zongräns hittas i det centrala loggsystemet inom 5 minuter, och poster från 90 dagar tillbaka går fortfarande att söka fram.
          threshold: ≤ 5 min, 90 dagar

  - id: CMSEC-10
    type: security
    obligation: must
    priority: medium
    tags: [dns, dnssec, resolver]
    refs: ["RFC 4035", "ISO/IEC 27001:2022 A.8.20", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    tests: [CMSEC-T09]
    en:
      title: Internal DNS resolvers validate DNSSEC
      description: The internal DNS resolvers MUST validate DNSSEC signatures and return a failure for a signed domain whose signature does not validate.
      rationale: Forged DNS answers send users and systems to the attacker's servers, and validation detects them for signed domains.
      criteria:
        - method: test
          text: A query for a test domain with a deliberately broken signature returns SERVFAIL, and a query for a correctly signed domain returns an answer with the authenticated data flag set.
    sv:
      title: Interna DNS-servrar validerar DNSSEC
      description: De interna DNS-resolvrarna SKA validera DNSSEC-signaturer och returnera ett fel för en signerad domän vars signatur inte går att validera.
      rationale: Förfalskade DNS-svar skickar användare och system till angriparens servrar, och valideringen upptäcker dem för signerade domäner.
      criteria:
        - method: test
          text: En fråga om en testdomän med en avsiktligt felaktig signatur ger SERVFAIL, och en fråga om en korrekt signerad domän ger ett svar med flaggan för autentiserade data satt.

  - id: CMSEC-11
    type: security
    obligation: must
    priority: medium
    tags: [certificates, renewal, key-management]
    refs: ["ISO/IEC 27001:2022 A.8.24"]
    tests: [CMSEC-T10]
    en:
      title: Network certificates renewed 30 days before expiry
      description: The network operator MUST renew each certificate used by VPN gateways, firewalls, wireless controllers and RADIUS servers at least 30 days before it expires.
      rationale: An expired certificate stops VPN and wireless logins for every user at once.
      criteria:
        - method: analysis
          text: The certificate inventory shows each network certificate with its expiry date, and none of the certificates in use expires within 30 days.
          threshold: ≥ 30 days before expiry
    sv:
      title: Certifikat i nätet förnyas 30 dagar före utgång
      description: Nätoperatören SKA förnya varje certifikat som används av VPN-gateways, brandväggar, styrenheter för trådlöst nät och RADIUS-servrar minst 30 dagar innan det går ut.
      rationale: Ett utgånget certifikat stoppar inloggning till VPN och trådlöst nät för varje användare samtidigt.
      criteria:
        - method: analysis
          text: Certifikatförteckningen visar varje certifikat i nätet med utgångsdatum, och inget av de certifikat som används går ut inom 30 dagar.
          threshold: ≥ 30 dagar före utgång

  - id: CMSEC-12
    type: security
    obligation: must_not
    priority: critical
    tags: [industrial-control, dmz, segmentation]
    refs: ["IEC 62443-3-3 SR 5.1", "IEC 62443-3-3 SR 5.2", "MITRE ATT&CK T0886 (remote services)", "MITRE ATT&CK M0930 (network segmentation)"]
    tests: [CMSEC-T11]
    en:
      title: No direct connection from office networks to control networks
      description: The network MUST NOT route traffic directly between an office zone and an industrial control zone, so that each exchange passes through a demilitarised zone with its own servers.
      rationale: Malware that reaches an office computer would otherwise have a direct path to the controllers of the physical process.
      criteria:
        - method: test
          text: Connections from an office computer to 10 addresses in the control zone fail, and the routing tables show no route between the two zones that bypasses the demilitarised zone.
    sv:
      title: Ingen direkt förbindelse från kontorsnät till styrnät
      description: Nätet SKA INTE vidarebefordra trafik direkt mellan en kontorszon och en zon för industriell styrning, så att varje utbyte passerar en demilitariserad zon med egna servrar.
      rationale: Skadlig kod som når en kontorsdator skulle annars ha en direkt väg till styrsystemen för den fysiska processen.
      criteria:
        - method: test
          text: Anslutningar från en kontorsdator till 10 adresser i styrzonen misslyckas, och routingtabellerna visar ingen väg mellan de två zonerna som går förbi den demilitariserade zonen.

  - id: CMSEC-13
    type: security
    obligation: must
    priority: high
    tags: [sip-trunk, session-border-controller, topology-hiding]
    refs: ["RFC 5853", "RFC 3261"]
    tests: [CMSEC-T12]
    en:
      title: SIP trunks terminated on a session border controller
      description: Each SIP trunk to an external carrier or partner MUST terminate on a session border controller that hides the internal addresses and topology, and accepts signalling only from the carrier's listed addresses.
      rationale: A SIP trunk open to the internet is scanned within hours and used for toll fraud and denial of service.
      criteria:
        - method: test
          text: A capture on the carrier side shows no internal address in SIP headers or SDP, and SIP requests from an unlisted source address get no answer.
    sv:
      title: SIP-trunkar termineras i en sessionsgränskontroll
      description: Varje SIP-trunk till en extern operatör eller partner SKA termineras i en sessionsgränskontroll som döljer de interna adresserna och topologin och som endast godtar signalering från operatörens angivna adresser.
      rationale: En SIP-trunk som är öppen mot internet skannas inom några timmar och används för samtalsbedrägerier och överbelastningsattacker.
      criteria:
        - method: test
          text: En inspelning på operatörssidan visar ingen intern adress i SIP-huvuden eller SDP, och SIP-förfrågningar från en adress som inte finns i listan får inget svar.

  - id: CMSEC-14
    type: security
    obligation: must
    priority: medium
    tags: [federation, unified-communications, external-domains]
    refs: ["ISO/IEC 27001:2022 A.8.20", "MITRE ATT&CK T1566.003 (spearphishing via service)"]
    tests: [CMSEC-T12]
    en:
      title: Federation of chat and presence only with listed external domains
      description: The unified communications platform MUST allow federation of chat, presence and calls only with external domains on an approved list, and block each other domain.
      rationale: Open federation lets anyone contact staff from look-alike domains for phishing and social engineering.
      criteria:
        - method: test
          text: A chat request from a test account in a domain not on the list is blocked, and one from a listed domain is delivered.
    sv:
      title: Federering av chatt och närvaro endast med angivna externa domäner
      description: Plattformen för samordnad kommunikation SKA tillåta federering av chatt, närvaro och samtal endast med externa domäner på en godkänd lista och blockera varje annan domän.
      rationale: Öppen federering låter vem som helst kontakta personal från domäner som liknar betrodda för nätfiske och social manipulation.
      criteria:
        - method: test
          text: En chattförfrågan från ett testkonto i en domän som inte finns i listan blockeras, och en från en domän i listan levereras.

  - id: CMSEC-15
    type: security
    obligation: must
    priority: medium
    tags: [meetings, lobby, external-participants]
    refs: ["ISO/IEC 27001:2022 A.5.14 (information transfer)"]
    tests: [CMSEC-T13]
    en:
      title: External meeting participants wait in a lobby
      description: The meeting service MUST place participants who are not signed in with an organisation account in a lobby until the organiser or a presenter admits them.
      rationale: Meetings without a lobby can be joined by anyone with the link, and links get forwarded.
      criteria:
        - method: test
          text: An anonymous participant joining with the meeting link waits in the lobby until admitted and sees no meeting content before that.
    sv:
      title: Externa mötesdeltagare väntar i en lobby
      description: Mötestjänsten SKA placera deltagare som inte är inloggade med ett konto i organisationen i en lobby tills organisatören eller en presentatör släpper in dem.
      rationale: Möten utan lobby kan nås av vem som helst med länken, och länkar vidarebefordras.
      criteria:
        - method: test
          text: En anonym deltagare som ansluter med möteslänken väntar i lobbyn tills den släpps in och ser inget mötesinnehåll dessförinnan.

  - id: CMSEC-16
    type: security
    obligation: must_not
    priority: high
    tags: [video-endpoints, auto-answer, eavesdropping]
    refs: ["ISO/IEC 27001:2022 A.8.9", "MITRE ATT&CK T1125 (video capture)", "MITRE ATT&CK T1123 (audio capture)"]
    tests: [CMSEC-T13]
    en:
      title: No automatic answer on room video endpoints
      description: Room video endpoints MUST NOT answer incoming calls automatically with camera and microphone active.
      rationale: An endpoint that answers by itself can be called by an outsider to watch and listen to a meeting room.
      criteria:
        - method: test
          text: A call to each room endpoint model rings and stays unanswered until someone accepts it in the room.
    sv:
      title: Inget automatiskt svar på videoutrustning i mötesrum
      description: Videoutrustning i mötesrum SKA INTE svara automatiskt på inkommande samtal med kamera och mikrofon aktiva.
      rationale: Utrustning som svarar av sig själv kan ringas upp av en utomstående som vill se och höra vad som sker i ett mötesrum.
      criteria:
        - method: test
          text: Ett samtal till varje modell av mötesrumsutrustning ringer och förblir obesvarat tills någon i rummet godtar det.

  - id: CMSEC-17
    type: security
    obligation: must
    priority: high
    tags: [intrusion-detection, zone-boundaries, alerting]
    refs: ["ISO/IEC 27001:2022 A.8.16", "ISO/IEC 27033-1:2015", "MITRE ATT&CK T1046 (network service discovery)", "MITRE ATT&CK T1210 (exploitation of remote services)"]
    tests: [CMSEC-T14]
    en:
      title: Intrusion detection at the zone boundaries with alerts within 5 minutes
      description: Each boundary between security zones MUST be covered by network intrusion detection that raises an alert in the security monitoring system within 5 minutes of a detected attack pattern.
      rationale: Firewalls allow the traffic that their rules permit, and attacks inside allowed traffic are only seen by inspection.
      criteria:
        - method: test
          text: A harmless test signature sent across each zone boundary raises an alert within 5 minutes.
          threshold: ≤ 5 min
    sv:
      title: Intrångsdetektering vid zongränserna med larm inom 5 minuter
      description: Varje gräns mellan säkerhetszoner SKA övervakas av intrångsdetektering i nätet som ger ett larm i säkerhetsövervakningen inom 5 minuter efter ett upptäckt angreppsmönster.
      rationale: Brandväggar släpper igenom den trafik som reglerna tillåter, och angrepp i tillåten trafik syns bara vid granskning av innehållet.
      criteria:
        - method: test
          text: En ofarlig testsignatur som skickas över varje zongräns ger ett larm inom 5 minuter.
          threshold: ≤ 5 min

  - id: CMSEC-18
    type: security
    obligation: should
    priority: medium
    tags: [protective-dns, malware, outbound]
    refs: ["CISA Protective Domain Name System Resolver Service", "MITRE ATT&CK T1071.004 (DNS)", "MITRE ATT&CK M1021 (restrict web-based content)"]
    tests: [CMSEC-T14]
    en:
      title: Protective DNS filtering of outbound name lookups
      description: The internal DNS resolvers SHOULD block lookups of domains on a threat intelligence list updated at least daily, and log each blocked lookup with the client address.
      rationale: Malware and phishing depend on name lookups, and blocking known bad domains stops many infections before a connection is made.
      criteria:
        - method: test
          text: A lookup of a test domain on the block list returns a block answer and the client address is in the log, and the list is less than 24 hours old.
          threshold: update ≤ 24 h
    sv:
      title: Skyddande DNS-filtrering av utgående namnuppslag
      description: De interna DNS-resolvrarna BÖR blockera uppslag av domäner på en lista med hotinformation som uppdateras minst dagligen, och logga varje blockerat uppslag med klientens adress.
      rationale: Skadlig kod och nätfiske är beroende av namnuppslag, och när kända skadliga domäner blockeras stoppas många infektioner innan en anslutning görs.
      criteria:
        - method: test
          text: Ett uppslag av en testdomän i blockeringslistan ger ett blockeringssvar och klientens adress finns i loggen, och listan är mindre än 24 timmar gammal.
          threshold: uppdatering ≤ 24 h

tests:
  - id: CMSEC-T01
    priority: critical
    execution: manual
    tags: [segmentation, firewall]
    refs: ["IEC 62443-3-3 SR 5.1", "IEC 62443-3-3 SR 5.2", "MITRE ATT&CK T1210 (exploitation of remote services)", "MITRE ATT&CK M1030 (network segmentation)", "MITRE ATT&CK M1037 (filter network traffic)"]
    en:
      title: Zone register compared with the network and blocked connections
      description: Compares the zone and conduit register with the configuration and tries connections that are not in the register.
      preconditions: The zone and conduit register, read access to the firewall and router configurations, and test hosts in 3 zones.
      expected: The register matches the configuration, and unlisted connections are blocked and logged.
      steps:
        - action: Pick 10 networks from the routers and find each in the register.
          expected: Each network is listed in the right zone.
        - action: From the test hosts, try 20 services between 3 pairs of zones that the register does not permit.
          expected: Each attempt is blocked.
          data: For example remote desktop from users to the management zone
        - action: Search the firewall logs for the attempts.
          expected: Each blocked attempt is logged with source, destination and port.
    sv:
      title: Zonregistret jämförs med nätet och blockerade förbindelser
      description: Jämför registret över zoner och kommunikationskanaler med konfigurationen och prövar förbindelser som inte finns i registret.
      preconditions: Registret över zoner och kommunikationskanaler, läsbehörighet till konfigurationen i brandväggar och routrar, och testdatorer i 3 zoner.
      expected: Registret stämmer med konfigurationen, och förbindelser som inte finns i det blockeras och loggas.
      steps:
        - action: Välj 10 nät från routrarna och hitta vart och ett i registret.
          expected: Varje nät finns i rätt zon.
        - action: Pröva från testdatorerna 20 tjänster mellan 3 par av zoner som registret inte tillåter.
          expected: Varje försök blockeras.
          data: Till exempel fjärrskrivbord från användare till förvaltningszonen
        - action: Sök efter försöken i brandväggsloggarna.
          expected: Varje blockerat försök är loggat med källa, mål och port.

  - id: CMSEC-T02
    priority: high
    execution: manual
    tags: [firewall, rule-review]
    refs: ["MITRE ATT&CK M1037 (filter network traffic)"]
    en:
      title: Review of the latest firewall rule review
      description: Checks the latest rule review against the live rule set and the hit counters.
      preconditions: The latest rule review record and read access to the firewall rule sets and hit counters.
      expected: The review is at most 6 months old, each rule has an owner and a decision, and removed rules are gone.
      steps:
        - action: Check the date of the latest review.
          expected: It is at most 6 months old.
        - action: Compare the reviewed rules with the live rule set.
          expected: Each live rule appears in the review with an owner and a decision.
        - action: Look up 5 rules marked for removal in the live rule set.
          expected: None of them is present.
    sv:
      title: Kontroll av den senaste granskningen av brandväggsregler
      description: Kontrollerar den senaste regelgranskningen mot den aktiva regeluppsättningen och träffräknarna.
      preconditions: Protokollet från den senaste regelgranskningen och läsbehörighet till brandväggarnas regeluppsättningar och träffräknare.
      expected: Granskningen är högst 6 månader gammal, varje regel har ägare och beslut, och borttagna regler finns inte kvar.
      steps:
        - action: Kontrollera datumet för den senaste granskningen.
          expected: Den är högst 6 månader gammal.
        - action: Jämför de granskade reglerna med den aktiva regeluppsättningen.
          expected: Varje aktiv regel finns i granskningen med ägare och beslut.
        - action: Leta efter 5 regler som markerats för borttagning i den aktiva regeluppsättningen.
          expected: Ingen av dem finns kvar.

  - id: CMSEC-T03
    priority: critical
    execution: manual
    tags: [encryption, site-to-site]
    refs: ["ISO/IEC 27033-5:2013", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1040 (network sniffing)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    en:
      title: Encryption of site-to-site connections
      description: Inspects the configuration of each connection between sites over third-party networks and captures traffic on one of them.
      preconditions: A list of site-to-site connections with their carriers, read access to the gateways and a capture point outside the gateway at one site.
      expected: Each connection uses IPsec or MACsec with AES-GCM and 256-bit keys, and the capture shows only encrypted packets.
      steps:
        - action: Read the cryptographic settings of each connection.
          expected: Each uses IPsec or MACsec with AES-GCM and 256-bit keys.
          data: AES-256-GCM
        - action: Capture 5 minutes of traffic outside the gateway at the chosen site.
          expected: Each packet between the sites is ESP or MACsec, and no application data is readable.
    sv:
      title: Kryptering av förbindelser mellan platser
      description: Granskar konfigurationen av varje förbindelse mellan platser över nät hos tredje part och spelar in trafik på en av dem.
      preconditions: En lista över förbindelser mellan platser med operatörer, läsbehörighet till gatewayerna och en inspelningspunkt utanför gatewayen på en plats.
      expected: Varje förbindelse använder IPsec eller MACsec med AES-GCM och 256-bitarsnycklar, och inspelningen visar bara krypterade paket.
      steps:
        - action: Läs de kryptografiska inställningarna för varje förbindelse.
          expected: Var och en använder IPsec eller MACsec med AES-GCM och 256-bitarsnycklar.
          data: AES-256-GCM
        - action: Spela in 5 minuters trafik utanför gatewayen på den valda platsen.
          expected: Varje paket mellan platserna är ESP eller MACsec, och inga tillämpningsdata går att läsa.

  - id: CMSEC-T04
    priority: critical
    execution: manual
    tags: [remote-access, vpn, mfa]
    refs: ["IEC 62443-3-3 SR 1.13", "CWE-308 (use of single-factor authentication)", "MITRE ATT&CK T1133 (external remote services)", "MITRE ATT&CK M1032 (multi-factor authentication)"]
    en:
      title: VPN login with and without the second factor
      description: Logs in to the VPN with and without the second factor and scans the external addresses for other remote access services.
      preconditions: A test account with a second factor and permission to scan the organisation's external addresses.
      expected: Only the login with both factors succeeds, and no other remote access service is exposed.
      steps:
        - action: Log in to the VPN with the correct password and without the second factor.
          expected: The login is refused.
        - action: Log in with the password and the second factor.
          expected: The login succeeds and internal zones are reachable.
        - action: Scan the external addresses for remote desktop, SSH and other remote access ports.
          expected: Only the VPN gateway answers.
    sv:
      title: VPN-inloggning med och utan andra faktor
      description: Loggar in i VPN med och utan andra faktor och skannar de externa adresserna efter andra tjänster för distansåtkomst.
      preconditions: Ett testkonto med andra faktor och tillstånd att skanna organisationens externa adresser.
      expected: Bara inloggningen med båda faktorerna lyckas, och ingen annan tjänst för distansåtkomst är exponerad.
      steps:
        - action: Logga in i VPN med rätt lösenord och utan andra faktor.
          expected: Inloggningen nekas.
        - action: Logga in med lösenordet och den andra faktorn.
          expected: Inloggningen lyckas och interna zoner går att nå.
        - action: Skanna de externa adresserna efter portar för fjärrskrivbord, SSH och annan distansåtkomst.
          expected: Bara VPN-gatewayen svarar.

  - id: CMSEC-T05
    priority: high
    execution: manual
    tags: [network-access-control, quarantine]
    refs: ["IEEE 802.1X-2020", "MITRE ATT&CK T1200 (hardware additions)"]
    en:
      title: Registered and unregistered laptops on a user port
      description: Connects a registered and an unregistered laptop to the same wired user port.
      preconditions: A wired user port in a meeting room, a registered laptop and an unregistered laptop.
      expected: The unregistered laptop lands in quarantine and reaches only the portal, and the registered laptop gets its normal network.
      steps:
        - action: Connect the unregistered laptop and read its address.
          expected: The address is in the quarantine network.
        - action: From the unregistered laptop, open the onboarding portal and an internal server.
          expected: The portal opens and the internal server cannot be reached.
        - action: Connect the registered laptop to the same port.
          expected: It authenticates with 802.1X and gets an address in its normal user network.
    sv:
      title: Registrerad och oregistrerad dator på en användarport
      description: Ansluter en registrerad och en oregistrerad dator till samma fasta användarport.
      preconditions: En fast användarport i ett mötesrum, en registrerad dator och en oregistrerad dator.
      expected: Den oregistrerade datorn hamnar i karantän och når bara portalen, och den registrerade datorn får sitt vanliga nät.
      steps:
        - action: Anslut den oregistrerade datorn och läs dess adress.
          expected: Adressen ligger i karantännätet.
        - action: Öppna registreringsportalen och en intern server från den oregistrerade datorn.
          expected: Portalen öppnas och den interna servern går inte att nå.
        - action: Anslut den registrerade datorn till samma port.
          expected: Den autentiseras med 802.1X och får en adress i sitt vanliga användarnät.

  - id: CMSEC-T06
    priority: high
    execution: automated
    tags: [management-network]
    refs: ["ISO/IEC 27001:2022 A.8.22", "MITRE ATT&CK T1021 (remote services)", "MITRE ATT&CK M1030 (network segmentation)"]
    en:
      title: Management interfaces reached from different zones
      description: A script tries to connect to the management addresses of 10 elements from 4 zones.
      preconditions: Test hosts in a user, server and guest network and a jump host in the management zone, and the management addresses of 10 elements.
      expected: Only the jump host reaches the management interfaces.
      steps:
        - action: Try SSH and HTTPS to each management address from the user, server and guest test hosts.
          expected: Each connection fails.
          data: TCP 22 and 443
        - action: Try the same connections from the jump host.
          expected: Each connection succeeds.
    sv:
      title: Förvaltningsgränssnitt nås från olika zoner
      description: Ett skript försöker ansluta till förvaltningsadresserna för 10 element från 4 zoner.
      preconditions: Testdatorer i ett användarnät, ett servernät och ett gästnät och en hoppserver i förvaltningszonen, samt förvaltningsadresserna för 10 element.
      expected: Bara hoppservern når förvaltningsgränssnitten.
      steps:
        - action: Pröva SSH och HTTPS mot varje förvaltningsadress från testdatorerna i användar-, server- och gästnätet.
          expected: Varje anslutning misslyckas.
          data: TCP 22 och 443
        - action: Pröva samma anslutningar från hoppservern.
          expected: Varje anslutning lyckas.

  - id: CMSEC-T07
    priority: high
    execution: manual
    tags: [ddos, scrubbing]
    refs: ["IEC 62443-3-3 SR 7.1", "MITRE ATT&CK T1498 (network denial of service)"]
    en:
      title: Denial-of-service simulation with the mitigation provider
      description: Runs an agreed attack simulation against a test address and measures when filtering starts.
      preconditions: A written agreement with the mitigation provider on time, volume and target, and a test service at the target address.
      expected: Filtering starts within 10 minutes, and legitimate test traffic gets through during the attack.
      steps:
        - action: Start the simulated volumetric attack and note the time of detection.
          expected: The provider's portal shows the attack as detected.
          data: Volume agreed with the provider
        - action: Note when filtering starts.
          expected: Filtering starts within 10 minutes of detection.
        - action: Send requests to the test service from an external test host during the attack.
          expected: At least 95 % of the requests succeed after filtering has started.
    sv:
      title: Simulerad överbelastningsattack med skyddsleverantören
      description: Genomför en avtalad attacksimulering mot en testadress och mäter när filtreringen börjar.
      preconditions: En skriftlig överenskommelse med skyddsleverantören om tid, volym och mål, och en testtjänst på måladressen.
      expected: Filtreringen börjar inom 10 minuter, och legitim testtrafik kommer fram under attacken.
      steps:
        - action: Starta den simulerade volymbaserade attacken och anteckna tidpunkten för upptäckt.
          expected: Leverantörens portal visar attacken som upptäckt.
          data: Volym enligt överenskommelse med leverantören
        - action: Anteckna när filtreringen börjar.
          expected: Filtreringen börjar inom 10 minuter från upptäckten.
        - action: Skicka förfrågningar till testtjänsten från en extern testdator under attacken.
          expected: Minst 95 % av förfrågningarna lyckas efter att filtreringen börjat.

  - id: CMSEC-T08
    priority: high
    execution: manual
    tags: [flow-logs, siem]
    refs: ["ISO/IEC 27001:2022 A.8.15", "MITRE ATT&CK T1048 (exfiltration over alternative protocol)"]
    en:
      title: Flow record of a test connection in the central log system
      description: Makes a test connection across a zone boundary and searches for it in the central log system, then searches for old records.
      preconditions: A test host in one zone, a server in another zone and search access to the central log system.
      expected: The test connection is found within 5 minutes, and records from 90 days ago are searchable.
      steps:
        - action: Connect from the test host to the server and note the time.
          expected: The connection is allowed.
        - action: Search the central log system for the connection.
          expected: A flow record with source, destination, port and the allow decision is found within 5 minutes.
        - action: Search for flow records of the same firewall from 90 days ago.
          expected: Records from that day are returned.
    sv:
      title: Flödespost för en testförbindelse i det centrala loggsystemet
      description: Gör en testförbindelse över en zongräns och söker efter den i det centrala loggsystemet, och söker sedan efter gamla poster.
      preconditions: En testdator i en zon, en server i en annan zon och sökbehörighet i det centrala loggsystemet.
      expected: Testförbindelsen hittas inom 5 minuter, och poster från 90 dagar tillbaka går att söka fram.
      steps:
        - action: Anslut från testdatorn till servern och anteckna tiden.
          expected: Förbindelsen tillåts.
        - action: Sök efter förbindelsen i det centrala loggsystemet.
          expected: En flödespost med källa, mål, port och beslutet tillåten hittas inom 5 minuter.
        - action: Sök efter flödesposter från samma brandvägg för 90 dagar sedan.
          expected: Poster från den dagen visas.

  - id: CMSEC-T09
    priority: medium
    execution: automated
    tags: [dns, dnssec]
    refs: ["RFC 4035", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    en:
      title: DNSSEC validation by the internal resolvers
      description: A script queries each internal resolver for a correctly signed and a deliberately broken test domain.
      preconditions: The addresses of the internal resolvers, a correctly signed test domain and a public test domain with a broken signature.
      expected: The broken domain gives SERVFAIL, and the signed domain gives an answer with the authenticated data flag.
      steps:
        - action: Query each resolver for the domain with the broken signature.
          expected: Each resolver returns SERVFAIL.
        - action: Query each resolver for the correctly signed domain.
          expected: Each resolver returns the answer with the AD flag set.
    sv:
      title: DNSSEC-validering i de interna resolvrarna
      description: Ett skript frågar varje intern resolver om en korrekt signerad och en avsiktligt felsignerad testdomän.
      preconditions: Adresserna till de interna resolvrarna, en korrekt signerad testdomän och en publik testdomän med felaktig signatur.
      expected: Den felsignerade domänen ger SERVFAIL, och den signerade domänen ger ett svar med flaggan för autentiserade data.
      steps:
        - action: Fråga varje resolver om domänen med den felaktiga signaturen.
          expected: Varje resolver returnerar SERVFAIL.
        - action: Fråga varje resolver om den korrekt signerade domänen.
          expected: Varje resolver returnerar svaret med AD-flaggan satt.

  - id: CMSEC-T10
    priority: medium
    execution: automated
    tags: [certificates, renewal]
    refs: []
    en:
      title: Expiry dates of certificates in use in the network
      description: A script connects to each VPN gateway, firewall, wireless controller and RADIUS server and reads the certificate it presents.
      preconditions: The certificate inventory and network access to each listed service.
      expected: Each presented certificate is in the inventory and expires more than 30 days from today.
      steps:
        - action: Read the certificate presented by each service.
          expected: Each certificate is found in the inventory.
        - action: Compare each expiry date with today's date.
          expected: Each certificate expires more than 30 days from today.
          data: Limit 30 days
    sv:
      title: Utgångsdatum för certifikat som används i nätet
      description: Ett skript ansluter till varje VPN-gateway, brandvägg, styrenhet för trådlöst nät och RADIUS-server och läser certifikatet den visar upp.
      preconditions: Certifikatförteckningen och nätåtkomst till varje tjänst i den.
      expected: Varje certifikat som visas upp finns i förteckningen och går ut mer än 30 dagar från i dag.
      steps:
        - action: Läs certifikatet som varje tjänst visar upp.
          expected: Varje certifikat finns i förteckningen.
        - action: Jämför varje utgångsdatum med dagens datum.
          expected: Varje certifikat går ut mer än 30 dagar från i dag.
          data: Gräns 30 dagar

  - id: CMSEC-T11
    priority: critical
    execution: manual
    tags: [industrial-control, dmz]
    refs: ["IEC 62443-3-3 SR 5.1", "MITRE ATT&CK T0886 (remote services)", "MITRE ATT&CK M0930 (network segmentation)"]
    en:
      title: Office computer tries to reach the control network
      description: Tries connections from an office computer to the control zone and reviews the routing between the zones.
      preconditions: A test computer in an office zone, a list of 10 addresses in the control zone and read access to the routing tables.
      expected: No connection succeeds, and no route bypasses the demilitarised zone.
      steps:
        - action: Try ping, SSH, remote desktop and the industrial protocol ports to the 10 control zone addresses.
          expected: Each attempt fails.
          data: For example TCP 502 and 44818
        - action: Read the routing tables of the routers and firewalls between the zones.
          expected: Each path between the office and the control zone ends in the demilitarised zone.
    sv:
      title: Kontorsdator försöker nå styrnätet
      description: Prövar förbindelser från en kontorsdator till styrzonen och granskar routingen mellan zonerna.
      preconditions: En testdator i en kontorszon, en lista över 10 adresser i styrzonen och läsbehörighet till routingtabellerna.
      expected: Ingen förbindelse lyckas, och ingen väg går förbi den demilitariserade zonen.
      steps:
        - action: Pröva ping, SSH, fjärrskrivbord och portarna för de industriella protokollen mot de 10 adresserna i styrzonen.
          expected: Varje försök misslyckas.
          data: Till exempel TCP 502 och 44818
        - action: Läs routingtabellerna i routrar och brandväggar mellan zonerna.
          expected: Varje väg mellan kontorszonen och styrzonen slutar i den demilitariserade zonen.

  - id: CMSEC-T12
    priority: high
    execution: manual
    tags: [session-border-controller, federation]
    refs: ["RFC 5853", "RFC 3261", "ISO/IEC 27001:2022 A.8.20", "MITRE ATT&CK T1566.003 (spearphishing via service)"]
    en:
      title: Session border controller exposure and federation allow list
      description: Captures trunk signalling at the carrier side, sends SIP from an unlisted address and tests federation with listed and unlisted domains.
      preconditions: A test call over the SIP trunk, a capture point on the carrier side of the session border controller, a test host on the internet and test accounts in a listed and an unlisted external domain.
      expected: No internal address is exposed, unlisted sources get no answer, and only listed domains federate.
      steps:
        - action: Make a test call over the trunk and capture the signalling on the carrier side.
          expected: No internal address appears in SIP headers or SDP.
        - action: Send a SIP OPTIONS request to the trunk address from the internet test host.
          expected: No answer is received.
        - action: Send a chat request to a staff account from the unlisted domain account.
          expected: The request is blocked.
        - action: Send a chat request from the listed domain account.
          expected: The request is delivered.
    sv:
      title: Exponering av sessionsgränskontrollen och listan över tillåtna federeringar
      description: Spelar in trunksignaleringen på operatörssidan, skickar SIP från en adress utanför listan och provar federering med domäner i och utanför listan.
      preconditions: Ett testsamtal över SIP-trunken, en inspelningspunkt på operatörssidan av sessionsgränskontrollen, en testvärd på internet och testkonton i en extern domän i listan och en utanför listan.
      expected: Ingen intern adress exponeras, källor utanför listan får inget svar och bara domäner i listan federeras.
      steps:
        - action: Ring ett testsamtal över trunken och spela in signaleringen på operatörssidan.
          expected: Ingen intern adress syns i SIP-huvuden eller SDP.
        - action: Skicka en SIP OPTIONS-förfrågan till trunkens adress från testvärden på internet.
          expected: Inget svar tas emot.
        - action: Skicka en chattförfrågan till ett personalkonto från kontot i domänen utanför listan.
          expected: Förfrågan blockeras.
        - action: Skicka en chattförfrågan från kontot i domänen i listan.
          expected: Förfrågan levereras.

  - id: CMSEC-T13
    priority: medium
    execution: manual
    tags: [meetings, video-endpoints]
    refs: ["ISO/IEC 27001:2022 A.5.14 (information transfer)", "ISO/IEC 27001:2022 A.8.9", "MITRE ATT&CK T1125 (video capture)", "MITRE ATT&CK T1123 (audio capture)"]
    en:
      title: Meeting lobby and room endpoint answering
      description: Joins a meeting anonymously and calls each room endpoint model.
      preconditions: A scheduled test meeting with an organiser, a browser without an organisation sign-in, the list of room endpoint models and a test caller.
      expected: The anonymous participant waits in the lobby and no endpoint answers by itself.
      steps:
        - action: Join the test meeting with the link from the browser without sign-in.
          expected: The participant is placed in the lobby and sees no content.
        - action: Admit the participant as organiser.
          expected: The participant joins the meeting.
        - action: Call each room endpoint model from the test caller and wait 60 seconds.
          expected: Each endpoint rings and none answers by itself.
    sv:
      title: Möteslobby och svar på mötesrumsutrustning
      description: Ansluter anonymt till ett möte och ringer upp varje modell av mötesrumsutrustning.
      preconditions: Ett planerat testmöte med en organisatör, en webbläsare utan inloggning i organisationen, listan över modeller av mötesrumsutrustning och en testuppringare.
      expected: Den anonyma deltagaren väntar i lobbyn och ingen utrustning svarar av sig själv.
      steps:
        - action: Anslut till testmötet med länken från webbläsaren utan inloggning.
          expected: Deltagaren placeras i lobbyn och ser inget innehåll.
        - action: Släpp in deltagaren som organisatör.
          expected: Deltagaren ansluter till mötet.
        - action: Ring varje modell av mötesrumsutrustning från testuppringaren och vänta 60 sekunder.
          expected: Varje utrustning ringer och ingen svarar av sig själv.

  - id: CMSEC-T14
    priority: high
    execution: manual
    tags: [intrusion-detection, protective-dns]
    refs: ["ISO/IEC 27001:2022 A.8.16", "ISO/IEC 27033-1:2015", "CISA Protective Domain Name System Resolver Service", "MITRE ATT&CK T1046 (network service discovery)", "MITRE ATT&CK T1210 (exploitation of remote services)", "MITRE ATT&CK T1071.004 (DNS)", "MITRE ATT&CK M1021 (restrict web-based content)"]
    en:
      title: Intrusion detection test signatures and protective DNS block
      description: Sends a harmless test signature across each zone boundary and looks up a blocked test domain.
      preconditions: A test host in each zone, a harmless test signature recognised by the detection rules, a test domain added to the block list and access to the security monitoring system and resolver logs.
      expected: Each boundary raises an alert within 5 minutes and the test domain is blocked and logged.
      steps:
        - action: Send the test signature from a host in each zone to a host in the neighbouring zone.
          expected: An alert for each boundary appears in the monitoring system within 5 minutes.
        - action: Look up the test domain from a client.
          expected: The resolver returns a block answer.
        - action: Read the resolver log and the block list update time.
          expected: The lookup is logged with the client address and the list was updated less than 24 hours ago.
    sv:
      title: Testsignaturer för intrångsdetektering och blockering i skyddande DNS
      description: Skickar en ofarlig testsignatur över varje zongräns och gör ett uppslag av en blockerad testdomän.
      preconditions: En testvärd i varje zon, en ofarlig testsignatur som detekteringsreglerna känner igen, en testdomän som lagts till i blockeringslistan och åtkomst till säkerhetsövervakningen och resolverloggarna.
      expected: Varje gräns ger ett larm inom 5 minuter och testdomänen blockeras och loggas.
      steps:
        - action: Skicka testsignaturen från en värd i varje zon till en värd i grannzonen.
          expected: Ett larm för varje gräns visas i övervakningen inom 5 minuter.
        - action: Gör ett uppslag av testdomänen från en klient.
          expected: Resolvern ger ett blockeringssvar.
        - action: Läs resolverloggen och tiden för den senaste uppdateringen av blockeringslistan.
          expected: Uppslaget är loggat med klientens adress och listan uppdaterades för mindre än 24 timmar sedan.
