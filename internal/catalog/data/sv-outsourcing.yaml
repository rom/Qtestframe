area: sv-outsourcing
prefix: SVOUT
group: security
catalogue: services
name: {en: "Outsourcing, service security and exit", sv: "Utkontraktering, tjänstesäkerhet och utträde"}
description:
  en: Security clauses and assurance from service providers, the data processing agreement, subcontractors, data location, incident notification, supplier access, yearly security follow-up, the exit plan, return and deletion of data and assistance during the transition to a new provider.
  sv: Säkerhetsklausuler och försäkran från tjänsteleverantörer, personuppgiftsbiträdesavtalet, underleverantörer, var data finns, rapportering av incidenter, leverantörens åtkomst, årlig säkerhetsuppföljning, utträdesplanen, återlämnande och radering av data och stöd under övergången till en ny leverantör.

requirements:
  - id: SVOUT-01
    type: security
    obligation: must
    priority: critical
    tags: [contract, security-requirements, audit-right]
    refs: ["ISO/IEC 27001:2022 A.5.20", "ISO/IEC 27036-2:2022"]
    tests: [SVOUT-T01]
    en:
      title: Security requirements and audit right in the service contract
      description: The service contract MUST contain the customer's information security requirements, the provider's duty to meet them and the customer's right to audit the provider, by itself or through a third party, with 30 days' notice.
      rationale: Requirements outside the contract cannot be enforced, and an audit right is the customer's way to check them.
      criteria:
        - method: review
          text: The signed contract or its security appendix contains the requirements, the duty to meet them and the audit right with a notice period of at most 30 days.
    sv:
      title: Säkerhetskrav och revisionsrätt i tjänsteavtalet
      description: Tjänsteavtalet SKA innehålla kundens krav på informationssäkerhet, leverantörens skyldighet att uppfylla dem och kundens rätt att granska leverantören, själv eller genom tredje part, med 30 dagars varsel.
      rationale: Krav utanför avtalet går inte att hävda, och en revisionsrätt är kundens sätt att kontrollera dem.
      criteria:
        - method: review
          text: Det undertecknade avtalet eller dess säkerhetsbilaga innehåller kraven, skyldigheten att uppfylla dem och revisionsrätten med en varseltid på högst 30 dagar.

  - id: SVOUT-02
    type: security
    obligation: must
    priority: high
    tags: [assurance, certification, iso-27001]
    refs: ["ISO/IEC 27001:2022 A.5.19", "ISO/IEC 27036-2:2022", "ISAE 3402"]
    tests: [SVOUT-T01]
    en:
      title: Yearly independent assurance of the provider's security
      description: The provider MUST give the customer each year either a valid ISO/IEC 27001 certificate whose scope covers the service or an independent assurance report on the controls of the service for the past 12 months.
      rationale: Few customers can audit each provider themselves, and an independent report gives a comparable view of the controls.
      criteria:
        - method: review
          text: The latest certificate or report is less than 12 months old, and its scope statement names the contracted service.
          threshold: ≤ 12 months old
    sv:
      title: Årlig oberoende försäkran om leverantörens säkerhet
      description: Leverantören SKA varje år lämna kunden antingen ett giltigt ISO/IEC 27001-certifikat vars omfattning täcker tjänsten eller en oberoende granskningsrapport om tjänstens kontroller för de senaste 12 månaderna.
      rationale: Få kunder kan själva granska varje leverantör, och en oberoende rapport ger en jämförbar bild av kontrollerna.
      criteria:
        - method: review
          text: Det senaste certifikatet eller den senaste rapporten är mindre än 12 månader gammal, och dess beskrivning av omfattningen nämner den avtalade tjänsten.
          threshold: ≤ 12 månader gammal

  - id: SVOUT-03
    type: regulatory
    obligation: must
    priority: critical
    tags: [gdpr, processor, data-processing-agreement]
    refs: ["GDPR Art. 28 (processor)"]
    tests: [SVOUT-T02]
    en:
      title: Data processing agreement before personal data is processed
      description: When the provider processes personal data for the customer, the parties MUST sign a data processing agreement with the contents set out in Article 28 of the GDPR before the processing starts.
      rationale: Processing personal data through a provider without such an agreement is a breach of the GDPR for the customer as controller.
      criteria:
        - method: review
          text: The data processing agreement is signed before the service start date and covers subject matter, duration, purpose, types of data, instructions, confidentiality, security, sub-processors, assistance, deletion or return, and audits.
    sv:
      title: Personuppgiftsbiträdesavtal innan personuppgifter behandlas
      description: När leverantören behandlar personuppgifter för kundens räkning SKA parterna underteckna ett personuppgiftsbiträdesavtal med det innehåll som artikel 28 i dataskyddsförordningen anger innan behandlingen börjar.
      rationale: Att låta en leverantör behandla personuppgifter utan ett sådant avtal är ett brott mot dataskyddsförordningen för kunden som personuppgiftsansvarig.
      criteria:
        - method: review
          text: Personuppgiftsbiträdesavtalet är undertecknat före tjänstens startdatum och omfattar föremål, varaktighet, syfte, typer av uppgifter, instruktioner, sekretess, säkerhet, underbiträden, bistånd, radering eller återlämnande och granskning.

  - id: SVOUT-04
    type: security
    obligation: must
    priority: high
    tags: [subcontractors, sub-processors, notice]
    refs: ["GDPR Art. 28(2) (engaging sub-processors)", "ISO/IEC 27036-3:2023"]
    tests: [SVOUT-T02]
    en:
      title: New subcontractors announced 30 days ahead with a right to object
      description: The provider MUST notify the customer at least 30 days before a new subcontractor starts to take part in the service and give the customer the right to object within that period.
      rationale: A subcontractor gets access to the customer's data and systems, and the customer has to be able to judge the new risk.
      criteria:
        - method: review
          text: The contract contains the 30-day notice and the right to object, and the subcontractor list matches the notices received in the last 12 months.
          threshold: ≥ 30 days notice
    sv:
      title: Nya underleverantörer aviseras 30 dagar i förväg med rätt att invända
      description: Leverantören SKA meddela kunden minst 30 dagar innan en ny underleverantör börjar delta i tjänsten och ge kunden rätt att invända inom den tiden.
      rationale: En underleverantör ges åtkomst till kundens data och system, och kunden behöver kunna bedöma den nya risken.
      criteria:
        - method: review
          text: Avtalet innehåller varseltiden på 30 dagar och rätten att invända, och listan över underleverantörer stämmer med de meddelanden som kommit in under de senaste 12 månaderna.
          threshold: ≥ 30 dagars varsel

  - id: SVOUT-05
    type: regulatory
    obligation: must
    priority: high
    tags: [data-location, third-country-transfer]
    refs: ["GDPR Art. 44–46 (transfers to third countries)", "ISO/IEC 27001:2022 A.5.23"]
    tests: [SVOUT-T03]
    en:
      title: Customer data stored only in the agreed EU and EEA countries
      description: The provider MUST store and process the customer's data, including backups and support access, only in the EU and EEA countries listed in the contract.
      rationale: Data in other countries can fall under foreign laws on access and needs safeguards that the customer has not agreed to.
      criteria:
        - method: review
          text: The provider's data location statement lists each site of storage, backup and support, and each is in a country listed in the contract.
    sv:
      title: Kundens data lagras bara i de avtalade länderna inom EU och EES
      description: Leverantören SKA lagra och behandla kundens data, även säkerhetskopior och supportåtkomst, bara i de länder inom EU och EES som anges i avtalet.
      rationale: Data i andra länder kan omfattas av utländska lagar om åtkomst och kräver skyddsåtgärder som kunden inte har godkänt.
      criteria:
        - method: review
          text: Leverantörens redovisning av var data finns listar varje plats för lagring, säkerhetskopiering och support, och var och en ligger i ett land som anges i avtalet.

  - id: SVOUT-06
    type: security
    obligation: must
    priority: critical
    tags: [incident-notification, breach]
    refs: ["GDPR Art. 33(2)", "ISO/IEC 27001:2022 A.5.20", "ISO/IEC 27036-3:2023"]
    tests: [SVOUT-T04]
    en:
      title: Security incidents reported to the customer within 24 hours
      description: The provider MUST report each information security incident that affects the customer's data or service to the customer's security contact within 24 hours of detection, with the scope known so far and the actions taken.
      rationale: The customer often has 72 hours to notify a supervisory authority and cannot meet that deadline without early information from the provider.
      criteria:
        - method: review
          text: The contract contains the 24-hour limit, and each provider incident report of the last 12 months arrived within 24 hours of the stated detection time.
          threshold: ≤ 24 h
    sv:
      title: Säkerhetsincidenter rapporteras till kunden inom 24 timmar
      description: Leverantören SKA rapportera varje informationssäkerhetsincident som berör kundens data eller tjänst till kundens säkerhetskontakt inom 24 timmar från upptäckten, med det som är känt om omfattningen och de åtgärder som vidtagits.
      rationale: Kunden har ofta 72 timmar på sig att anmäla till en tillsynsmyndighet och klarar inte den tidsgränsen utan tidig information från leverantören.
      criteria:
        - method: review
          text: Avtalet innehåller gränsen på 24 timmar, och varje incidentrapport från leverantören under de senaste 12 månaderna kom inom 24 timmar från den angivna tidpunkten för upptäckt.
          threshold: ≤ 24 h

  - id: SVOUT-07
    type: security
    obligation: must
    priority: high
    tags: [supplier-access, privileged-access, mfa]
    refs: ["ISO/IEC 27001:2022 A.5.18", "IEC 62443-2-4:2023 SP.07 (remote access)", "CWE-308 (use of single-factor authentication)", "MITRE ATT&CK T1199 (trusted relationship)", "MITRE ATT&CK T1078 (valid accounts)"]
    tests: [SVOUT-T05]
    en:
      title: Provider staff access customer systems with personal accounts and logging
      description: The provider's staff MUST access the customer's systems only with personal accounts, multi-factor authentication and session logging that the customer can read.
      rationale: Shared provider accounts make it impossible to tell who did what, and unlogged access hides misuse.
      criteria:
        - method: test
          text: A list of provider accounts shows only named persons with a second factor, and a test session by the provider is found in the session log with the person's name.
    sv:
      title: Leverantörens personal når kundens system med personliga konton och loggning
      description: Leverantörens personal SKA få åtkomst till kundens system bara med personliga konton, flerfaktorsautentisering och sessionsloggning som kunden kan läsa.
      rationale: Delade leverantörskonton gör det omöjligt att se vem som gjorde vad, och åtkomst utan loggning döljer missbruk.
      criteria:
        - method: test
          text: En lista över leverantörskonton visar bara namngivna personer med andra faktor, och en testsession av leverantören hittas i sessionsloggen med personens namn.

  - id: SVOUT-08
    type: security
    obligation: should
    priority: medium
    tags: [supplier-review, follow-up]
    refs: ["ISO/IEC 27001:2022 A.5.22"]
    tests: [SVOUT-T06]
    en:
      title: Yearly security follow-up of each critical provider
      description: The customer SHOULD follow up each critical provider once a year with a security questionnaire and the evidence behind the answers, and track each finding to closure.
      rationale: The provider's security changes over a contract of several years, and a yearly follow-up keeps the risk picture current.
      criteria:
        - method: review
          text: Each critical provider has a follow-up from the last 12 months with answers, evidence and findings, and each finding has an owner and a status.
          threshold: once per 12 months
    sv:
      title: Årlig säkerhetsuppföljning av varje kritisk leverantör
      description: Kunden BÖR följa upp varje kritisk leverantör en gång per år med ett frågeformulär om säkerhet och underlaget för svaren, och följa varje iakttagelse tills den är stängd.
      rationale: Leverantörens säkerhet förändras under ett avtal som löper i flera år, och en årlig uppföljning håller riskbilden aktuell.
      criteria:
        - method: review
          text: Varje kritisk leverantör har en uppföljning från de senaste 12 månaderna med svar, underlag och iakttagelser, och varje iakttagelse har en ägare och en status.
          threshold: en gång per 12 månader

  - id: SVOUT-09
    type: business
    obligation: must
    priority: high
    tags: [exit-plan, transition]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(8)", "ISO/IEC 27036-2:2022"]
    tests: [SVOUT-T07]
    en:
      title: Exit plan delivered within 3 months and updated each year
      description: The provider MUST deliver an exit plan within 3 months of the service start and update it each year, describing the data and documents handed over, the formats, the transition steps, the roles and the timetable.
      rationale: An exit planned while the relationship works is far cheaper and safer than one negotiated after it has broken down.
      criteria:
        - method: review
          text: The first exit plan is dated within 3 months of the service start, the latest is less than 12 months old, and both cover the 5 listed parts.
          threshold: ≤ 3 months, updated every 12 months
    sv:
      title: Utträdesplan levereras inom 3 månader och uppdateras varje år
      description: Leverantören SKA leverera en utträdesplan inom 3 månader från tjänstens start och uppdatera den varje år, med de data och dokument som lämnas över, format, stegen i övergången, roller och tidplan.
      rationale: Ett utträde som planeras medan samarbetet fungerar är mycket billigare och säkrare än ett som förhandlas fram när det har brutit samman.
      criteria:
        - method: review
          text: Den första utträdesplanen är daterad inom 3 månader från tjänstens start, den senaste är mindre än 12 månader gammal, och båda omfattar de 5 uppräknade delarna.
          threshold: ≤ 3 månader, uppdateras var 12:e månad

  - id: SVOUT-10
    type: business
    obligation: must
    priority: critical
    tags: [data-return, portability, exit]
    refs: ["GDPR Art. 28(3)(g) (deletion at the end of processing)", "EU Data Act (Regulation (EU) 2023/2854) Art. 23–25 (switching between data processing services)"]
    tests: [SVOUT-T08]
    en:
      title: Customer data returned in an open format within 30 days of exit
      description: At the end of the contract, the provider MUST return the customer's data, with its metadata and change history, in the open machine-readable formats named in the exit plan within 30 days.
      rationale: Data that cannot be taken out, or only in a closed format, locks the customer to the provider.
      criteria:
        - method: test
          text: In an exit test, a full export is delivered within 30 days in the agreed formats, and a sample of 100 records with history is loaded into a test system without loss.
          threshold: ≤ 30 days
    sv:
      title: Kundens data återlämnas i ett öppet format inom 30 dagar vid utträde
      description: När avtalet upphör SKA leverantören återlämna kundens data, med metadata och ändringshistorik, i de öppna maskinläsbara format som anges i utträdesplanen inom 30 dagar.
      rationale: Data som inte går att ta ut, eller bara i ett slutet format, låser kunden till leverantören.
      criteria:
        - method: test
          text: Vid ett utträdestest levereras en fullständig export inom 30 dagar i de avtalade formaten, och ett urval av 100 poster med historik läses in i ett testsystem utan förlust.
          threshold: ≤ 30 dagar

  - id: SVOUT-11
    type: security
    obligation: must
    priority: high
    tags: [deletion, exit, certificate]
    refs: ["GDPR Art. 28(3)(g) (deletion at the end of processing)", "ISO/IEC 27001:2022 A.8.10"]
    tests: [SVOUT-T08]
    en:
      title: Data deleted with a certificate after a confirmed return
      description: After the customer confirms that the returned data is complete, the provider MUST delete each copy of the customer's data, backups included, within 30 days and deliver a signed deletion certificate.
      rationale: Copies left with a former provider are outside the customer's control and still a risk.
      criteria:
        - method: review
          text: A deletion certificate signed by the provider is dated at most 30 days after the customer's confirmation and names production, backup and archive copies.
          threshold: ≤ 30 days
    sv:
      title: Data raderas med intyg efter bekräftat återlämnande
      description: När kunden har bekräftat att de återlämnade uppgifterna är kompletta SKA leverantören radera varje kopia av kundens data, även säkerhetskopior, inom 30 dagar och leverera ett undertecknat intyg om radering.
      rationale: Kopior som blir kvar hos en tidigare leverantör ligger utanför kundens kontroll och är fortfarande en risk.
      criteria:
        - method: review
          text: Ett intyg om radering undertecknat av leverantören är daterat högst 30 dagar efter kundens bekräftelse och omfattar produktions-, säkerhets- och arkivkopior.
          threshold: ≤ 30 dagar

  - id: SVOUT-12
    type: business
    obligation: must
    priority: high
    tags: [transition-assistance, exit, continuity]
    refs: ["EU Data Act (Regulation (EU) 2023/2854) Art. 23–25 (switching between data processing services)"]
    tests: [SVOUT-T07]
    en:
      title: Service and transition assistance for up to 6 months after notice
      description: The contract MUST oblige the provider to continue the service and assist the new provider for up to 6 months after the end of the contract at the contracted prices, at the customer's request.
      rationale: Moving a service takes time, and a provider that stops on the last day of the contract leaves the customer without service.
      criteria:
        - method: review
          text: The contract contains the obligation to continue and assist for up to 6 months at the contracted prices.
          threshold: ≤ 6 months
    sv:
      title: Tjänst och stöd vid övergång i upp till 6 månader efter avtalets slut
      description: Avtalet SKA förplikta leverantören att på kundens begäran fortsätta leverera tjänsten och bistå den nya leverantören i upp till 6 månader efter avtalets slut till de avtalade priserna.
      rationale: Att flytta en tjänst tar tid, och en leverantör som slutar på avtalets sista dag lämnar kunden utan tjänst.
      criteria:
        - method: review
          text: Avtalet innehåller skyldigheten att fortsätta och bistå i upp till 6 månader till de avtalade priserna.
          threshold: ≤ 6 månader

  - id: SVOUT-13
    type: regulatory
    obligation: must
    priority: high
    tags: [outsourcing, register, criticality]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(3)", "ISO/IEC 27001:2022 A.5.19"]
    tests: [SVOUT-T09]
    en:
      title: Register of outsourced services with criticality
      description: The customer MUST keep a register of each outsourced service with the provider, the contract reference, the supported business function, whether that function is critical and the countries where the service is performed.
      rationale: The register is the basis for risk assessment, supervision and exit planning, and supervisors in regulated sectors ask for it.
      criteria:
        - method: inspection
          text: Each active service contract in the contract system is in the register with the 5 listed fields filled in.
    sv:
      title: Register över utlagda tjänster med kritikalitet
      description: Kunden SKA föra ett register över varje utlagd tjänst med leverantör, avtalsreferens, den verksamhetsfunktion som stöds, om funktionen är kritisk och i vilka länder tjänsten utförs.
      rationale: Registret är grunden för riskbedömning, tillsyn och planering av avslut, och tillsynsmyndigheter i reglerade sektorer begär det.
      criteria:
        - method: inspection
          text: Varje aktivt tjänsteavtal i avtalssystemet finns i registret med de 5 angivna fälten ifyllda.

  - id: SVOUT-14
    type: regulatory
    obligation: must
    priority: high
    tags: [outsourcing, concentration-risk, risk-assessment]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 29"]
    tests: [SVOUT-T09]
    en:
      title: Concentration risk assessed before outsourcing a critical function
      description: Before contracting a provider for a critical function, the customer MUST assess the concentration risk, including the other critical functions already placed with the same provider and how replaceable the provider is.
      rationale: Placing several critical functions with one provider that cannot be replaced creates a single point of failure for the whole organisation.
      criteria:
        - method: review
          text: Each contract for a critical function has a concentration risk assessment dated before signature that lists the other functions with the same provider and the replaceability.
    sv:
      title: Koncentrationsrisken bedöms innan en kritisk funktion läggs ut
      description: Innan en leverantör anlitas för en kritisk funktion SKA kunden bedöma koncentrationsrisken, inklusive de andra kritiska funktioner som redan finns hos samma leverantör och hur ersättningsbar leverantören är.
      rationale: Att lägga flera kritiska funktioner hos en leverantör som inte går att ersätta skapar en enskild felpunkt för hela organisationen.
      criteria:
        - method: review
          text: Varje avtal för en kritisk funktion har en bedömning av koncentrationsrisken daterad före undertecknandet som listar de andra funktionerna hos samma leverantör och ersättningsbarheten.

  - id: SVOUT-15
    type: security
    obligation: must
    priority: high
    tags: [outsourcing, screening, privileged-access]
    refs: ["ISO/IEC 27001:2022 A.6.1", "ISO/IEC 27001:2022 A.5.20"]
    tests: [SVOUT-T10]
    en:
      title: Background checks of provider staff with privileged access
      description: The contract MUST oblige the provider to complete a background check of each of its staff before that person gets privileged access to the customer's systems or data, at the level stated in the contract.
      rationale: Privileged staff at a provider can do the same harm as the customer's own administrators and need the same vetting.
      criteria:
        - method: review
          text: The contract has the clause, and the provider's records for 5 sampled privileged staff show a completed check dated before access was granted.
    sv:
      title: Bakgrundskontroll av leverantörens personal med privilegierad behörighet
      description: Avtalet SKA förplikta leverantören att genomföra en bakgrundskontroll av varje person i sin personal på den nivå som avtalet anger innan personen ges privilegierad åtkomst till kundens system eller data.
      rationale: Privilegierad personal hos en leverantör kan göra samma skada som kundens egna administratörer och behöver samma kontroll.
      criteria:
        - method: review
          text: Avtalet har klausulen, och leverantörens underlag för 5 utvalda personer med privilegierad behörighet visar en genomförd kontroll daterad innan åtkomsten gavs.

  - id: SVOUT-16
    type: regulatory
    obligation: must
    priority: high
    tags: [outsourcing, termination, contract]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(7)"]
    tests: [SVOUT-T11]
    en:
      title: Termination rights for breach and supervisory instruction
      description: The contract for a critical function MUST give the customer the right to terminate it for a material breach of law or contract, for a weakness found in the provider's risk management, and when a supervisory authority instructs it.
      rationale: Without these rights the customer can be bound to a provider that puts it in breach of its own obligations.
      criteria:
        - method: review
          text: The termination clause of each contract for a critical function covers the 3 listed grounds.
    sv:
      title: Rätt att säga upp avtalet vid avtalsbrott och föreläggande från tillsynsmyndighet
      description: Avtalet för en kritisk funktion SKA ge kunden rätt att säga upp det vid ett väsentligt brott mot lag eller avtal, vid en brist som upptäcks i leverantörens riskhantering och när en tillsynsmyndighet förelägger kunden att göra det.
      rationale: Utan dessa rättigheter kan kunden vara bunden till en leverantör som gör att kunden själv bryter mot sina skyldigheter.
      criteria:
        - method: review
          text: Uppsägningsklausulen i varje avtal för en kritisk funktion omfattar de 3 angivna grunderna.

  - id: SVOUT-17
    type: security
    obligation: must
    priority: medium
    tags: [outsourcing, subcontractors, supply-chain]
    refs: ["ISO/IEC 27001:2022 A.5.21", "Directive (EU) 2022/2555 (NIS2) Art. 21(2)(d)", "MITRE ATT&CK T1199 (trusted relationship)"]
    tests: [SVOUT-T11]
    en:
      title: Security requirements passed on to subcontractors
      description: The contract MUST oblige the provider to pass on the security requirements of the contract to each subcontractor that takes part in the service, and to show this to the customer on request within 10 working days.
      rationale: The security of the service is only as strong as the weakest subcontractor, who has no contract with the customer.
      criteria:
        - method: review
          text: The contract has the clause, and the provider produced the relevant clauses of 2 subcontracts within 10 working days of a request.
          threshold: "≤ 10 working days"
    sv:
      title: Säkerhetskraven förs vidare till underleverantörer
      description: Avtalet SKA förplikta leverantören att föra vidare avtalets säkerhetskrav till varje underleverantör som deltar i tjänsten och att visa detta för kunden inom 10 arbetsdagar efter en begäran.
      rationale: Tjänstens säkerhet är aldrig starkare än den svagaste underleverantören, som inte har något avtal med kunden.
      criteria:
        - method: review
          text: Avtalet har klausulen, och leverantören visade de aktuella klausulerna i 2 underleverantörsavtal inom 10 arbetsdagar efter en begäran.
          threshold: "≤ 10 arbetsdagar"

  - id: SVOUT-18
    type: business
    obligation: should
    priority: medium
    tags: [outsourcing, continuity, exercise]
    refs: ["ISO 22301:2019 §8.5 (exercise programme)", "ISO/IEC 27001:2022 A.5.30"]
    tests: [SVOUT-T12]
    en:
      title: Provider takes part in the customer's continuity exercise
      description: The provider of a critical service SHOULD take part in at least 1 of the customer's continuity exercises each year that involves the service, and deliver its own findings within 15 working days.
      rationale: A continuity plan that relies on a provider is not proven until the provider has played its part in an exercise.
      criteria:
        - method: review
          text: The exercise report of the last 12 months names the provider's participants, and the provider's findings are dated within 15 working days of the exercise.
    sv:
      title: Leverantören deltar i kundens kontinuitetsövning
      description: Leverantören av en kritisk tjänst BÖR delta i minst 1 av kundens kontinuitetsövningar per år som omfattar tjänsten och lämna sina egna iakttagelser inom 15 arbetsdagar.
      rationale: En kontinuitetsplan som bygger på en leverantör är inte prövad förrän leverantören har spelat sin roll i en övning.
      criteria:
        - method: review
          text: Övningsrapporten från de senaste 12 månaderna namnger leverantörens deltagare, och leverantörens iakttagelser är daterade inom 15 arbetsdagar efter övningen.

tests:
  - id: SVOUT-T01
    priority: critical
    execution: manual
    tags: [contract, assurance]
    refs: ["ISO/IEC 27001:2022 A.5.20"]
    en:
      title: Security clauses in the contract and the provider's assurance
      description: Reviews the security clauses of the service contract and the latest certificate or assurance report.
      preconditions: The signed contract with its security appendix and the latest certificate or assurance report from the provider.
      expected: The contract has the requirements, the duty and the audit right, and the assurance is current and covers the service.
      steps:
        - action: Find the security requirements, the duty to meet them and the audit right in the contract.
          expected: Each is present, and the notice period for an audit is at most 30 days.
        - action: Check the date of the certificate or report.
          expected: It is less than 12 months old.
        - action: Read the scope statement.
          expected: It names the contracted service.
    sv:
      title: Säkerhetsklausuler i avtalet och leverantörens försäkran
      description: Granskar säkerhetsklausulerna i tjänsteavtalet och det senaste certifikatet eller den senaste granskningsrapporten.
      preconditions: Det undertecknade avtalet med säkerhetsbilaga och leverantörens senaste certifikat eller granskningsrapport.
      expected: Avtalet har kraven, skyldigheten och revisionsrätten, och försäkran är aktuell och täcker tjänsten.
      steps:
        - action: Hitta säkerhetskraven, skyldigheten att uppfylla dem och revisionsrätten i avtalet.
          expected: Var och en finns, och varseltiden för en revision är högst 30 dagar.
        - action: Kontrollera datumet för certifikatet eller rapporten.
          expected: Det är mindre än 12 månader gammalt.
        - action: Läs beskrivningen av omfattningen.
          expected: Den nämner den avtalade tjänsten.

  - id: SVOUT-T02
    priority: critical
    execution: manual
    tags: [gdpr, processor, subcontractors]
    refs: ["GDPR Art. 28 (processor)"]
    en:
      title: Data processing agreement and subcontractor notices
      description: Reviews the data processing agreement and compares the subcontractor list with the notices received.
      preconditions: The data processing agreement, the service start date, the provider's subcontractor list and the notices of the last 12 months.
      expected: The agreement predates the service and has the listed contents, and each new subcontractor was announced at least 30 days ahead.
      steps:
        - action: Compare the signature date of the agreement with the service start date.
          expected: The agreement was signed first.
        - action: Check the agreement for each of the listed contents.
          expected: Each is covered.
        - action: For each subcontractor added in the last 12 months, find the notice and compare its date with the start of the subcontractor.
          expected: Each notice came at least 30 days before the start and offered the right to object.
    sv:
      title: Personuppgiftsbiträdesavtal och meddelanden om underleverantörer
      description: Granskar personuppgiftsbiträdesavtalet och jämför listan över underleverantörer med de meddelanden som kommit in.
      preconditions: Personuppgiftsbiträdesavtalet, tjänstens startdatum, leverantörens lista över underleverantörer och meddelandena från de senaste 12 månaderna.
      expected: Avtalet är äldre än tjänsten och har det uppräknade innehållet, och varje ny underleverantör aviserades minst 30 dagar i förväg.
      steps:
        - action: Jämför avtalets datum för undertecknande med tjänstens startdatum.
          expected: Avtalet undertecknades först.
        - action: Kontrollera att avtalet omfattar vart och ett av de uppräknade innehållen.
          expected: Vart och ett finns med.
        - action: Hitta meddelandet för varje underleverantör som lagts till under de senaste 12 månaderna och jämför dess datum med underleverantörens start.
          expected: Varje meddelande kom minst 30 dagar före starten och gav rätt att invända.

  - id: SVOUT-T03
    priority: high
    execution: manual
    tags: [data-location]
    refs: ["GDPR Art. 44–46 (transfers to third countries)"]
    en:
      title: Data location statement compared with the contract
      description: Compares the provider's statement of data locations with the countries allowed in the contract.
      preconditions: The contract with its list of countries and the provider's current data location statement.
      expected: Each storage, backup and support location is in an allowed country.
      steps:
        - action: List each location of storage, backup and support in the statement.
          expected: Each location names a country.
        - action: Compare each country with the contract list.
          expected: Each country is in the list.
    sv:
      title: Redovisningen av var data finns jämförs med avtalet
      description: Jämför leverantörens redovisning av var data finns med de länder som avtalet tillåter.
      preconditions: Avtalet med dess lista över länder och leverantörens aktuella redovisning av var data finns.
      expected: Varje plats för lagring, säkerhetskopiering och support ligger i ett tillåtet land.
      steps:
        - action: Lista varje plats för lagring, säkerhetskopiering och support i redovisningen.
          expected: Varje plats anger ett land.
        - action: Jämför varje land med avtalets lista.
          expected: Varje land finns i listan.

  - id: SVOUT-T04
    priority: critical
    execution: manual
    tags: [incident-notification]
    refs: ["GDPR Art. 33(2)"]
    en:
      title: Timeliness of the provider's incident reports
      description: Checks the notification clause and the timing of each incident report from the provider in the last 12 months.
      preconditions: The contract and the provider's incident reports of the last 12 months with detection and sending times.
      expected: The contract has the 24-hour limit, and each report arrived within 24 hours of detection.
      steps:
        - action: Find the notification clause in the contract.
          expected: It sets 24 hours from detection.
        - action: For each report, compare the stated detection time with the time it arrived at the customer.
          expected: Each difference is at most 24 hours.
        - action: Read the contents of each report.
          expected: Each describes the known scope and the actions taken.
    sv:
      title: Leverantörens incidentrapporter i tid
      description: Kontrollerar rapporteringsklausulen och tidpunkten för varje incidentrapport från leverantören under de senaste 12 månaderna.
      preconditions: Avtalet och leverantörens incidentrapporter för de senaste 12 månaderna med tidpunkter för upptäckt och utskick.
      expected: Avtalet har gränsen på 24 timmar, och varje rapport kom inom 24 timmar från upptäckten.
      steps:
        - action: Hitta rapporteringsklausulen i avtalet.
          expected: Den anger 24 timmar från upptäckten.
        - action: Jämför den angivna tidpunkten för upptäckt med tidpunkten då rapporten kom till kunden för varje rapport.
          expected: Varje skillnad är högst 24 timmar.
        - action: Läs innehållet i varje rapport.
          expected: Varje rapport beskriver den kända omfattningen och vidtagna åtgärder.

  - id: SVOUT-T05
    priority: high
    execution: manual
    tags: [supplier-access]
    refs: ["ISO/IEC 27001:2022 A.5.18", "CWE-308 (use of single-factor authentication)", "MITRE ATT&CK T1199 (trusted relationship)", "MITRE ATT&CK T1078 (valid accounts)"]
    en:
      title: Provider accounts and a logged test session
      description: Lists the provider accounts in the customer's systems and asks the provider for a test session.
      preconditions: Administrator access to the customer's identity system and session log, and an agreed test session with the provider.
      expected: Each provider account is personal with a second factor, and the test session is logged with the person's name.
      steps:
        - action: List each account that belongs to the provider.
          expected: Each account names one person, and none is shared.
        - action: Check the authentication settings of each account.
          expected: Each requires a second factor.
        - action: Let the provider log in for the agreed test session and search the session log.
          expected: The session is logged with the person's name, start and end time.
    sv:
      title: Leverantörskonton och en loggad testsession
      description: Listar leverantörens konton i kundens system och ber leverantören om en testsession.
      preconditions: Administratörsbehörighet till kundens identitetssystem och sessionslogg, och en avtalad testsession med leverantören.
      expected: Varje leverantörskonto är personligt med andra faktor, och testsessionen loggas med personens namn.
      steps:
        - action: Lista varje konto som tillhör leverantören.
          expected: Varje konto anger en person, och inget är delat.
        - action: Kontrollera autentiseringsinställningarna för varje konto.
          expected: Varje konto kräver en andra faktor.
        - action: Låt leverantören logga in för den avtalade testsessionen och sök i sessionsloggen.
          expected: Sessionen är loggad med personens namn, start- och sluttid.

  - id: SVOUT-T06
    priority: medium
    execution: manual
    tags: [supplier-review]
    refs: ["ISO/IEC 27001:2022 A.5.22"]
    en:
      title: Yearly follow-up records of critical providers
      description: Reviews the follow-up of each critical provider in the last 12 months.
      preconditions: The list of critical providers and the follow-up records.
      expected: Each critical provider has a follow-up with evidence, and each finding has an owner and a status.
      steps:
        - action: Find the latest follow-up for each critical provider.
          expected: Each is less than 12 months old.
        - action: Check that the answers are supported by evidence.
          expected: Each answer that claims a control has evidence attached.
        - action: Read the findings list of each follow-up.
          expected: Each finding has an owner and a current status.
    sv:
      title: Protokoll från den årliga uppföljningen av kritiska leverantörer
      description: Granskar uppföljningen av varje kritisk leverantör under de senaste 12 månaderna.
      preconditions: Listan över kritiska leverantörer och uppföljningsprotokollen.
      expected: Varje kritisk leverantör har en uppföljning med underlag, och varje iakttagelse har en ägare och en status.
      steps:
        - action: Hitta den senaste uppföljningen för varje kritisk leverantör.
          expected: Var och en är mindre än 12 månader gammal.
        - action: Kontrollera att svaren stöds av underlag.
          expected: Varje svar som anger en kontroll har underlag bifogat.
        - action: Läs listan över iakttagelser i varje uppföljning.
          expected: Varje iakttagelse har en ägare och en aktuell status.

  - id: SVOUT-T07
    priority: high
    execution: manual
    tags: [exit-plan, transition-assistance]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(8)"]
    en:
      title: Exit plan and transition clause
      description: Reviews the exit plans and the transition assistance clause of the contract.
      preconditions: The service start date, the exit plan versions and the contract.
      expected: The first plan came within 3 months, the latest is current with the 5 parts, and the contract has the 6-month assistance.
      steps:
        - action: Compare the date of the first exit plan with the service start.
          expected: It is at most 3 months later.
        - action: Check the date and the contents of the latest exit plan.
          expected: It is less than 12 months old and covers data and documents, formats, steps, roles and timetable.
        - action: Find the transition assistance clause in the contract.
          expected: It obliges the provider to continue and assist for up to 6 months at the contracted prices.
    sv:
      title: Utträdesplan och övergångsklausul
      description: Granskar utträdesplanerna och avtalets klausul om stöd vid övergång.
      preconditions: Tjänstens startdatum, versionerna av utträdesplanen och avtalet.
      expected: Den första planen kom inom 3 månader, den senaste är aktuell med de 5 delarna, och avtalet har stödet i 6 månader.
      steps:
        - action: Jämför datumet för den första utträdesplanen med tjänstens start.
          expected: Det är högst 3 månader senare.
        - action: Kontrollera datum och innehåll i den senaste utträdesplanen.
          expected: Den är mindre än 12 månader gammal och omfattar data och dokument, format, steg, roller och tidplan.
        - action: Hitta klausulen om stöd vid övergång i avtalet.
          expected: Den förpliktar leverantören att fortsätta och bistå i upp till 6 månader till de avtalade priserna.

  - id: SVOUT-T08
    priority: critical
    execution: manual
    tags: [data-return, deletion]
    refs: ["GDPR Art. 28(3)(g) (deletion at the end of processing)"]
    en:
      title: Exit test with data return and deletion certificate
      description: Requests a full export as an exit test, loads a sample into a test system and reviews the deletion certificate of a finished exit.
      preconditions: An agreed exit test with the provider, a test system that reads the agreed formats, and the deletion certificate from a finished exit, if there is one.
      expected: The export arrives within 30 days and loads without loss, and the certificate covers each copy within 30 days of confirmation.
      steps:
        - action: Request the full export and note the date.
          expected: The export arrives within 30 days in the formats of the exit plan.
        - action: Load 100 records with their history into the test system and compare them with the service.
          expected: Each record and its history match.
          data: 100 records
        - action: Read the deletion certificate and compare its date with the customer's confirmation.
          expected: It is signed, dated at most 30 days later and names production, backup and archive copies.
    sv:
      title: Utträdestest med återlämnande av data och intyg om radering
      description: Begär en fullständig export som utträdestest, läser in ett urval i ett testsystem och granskar intyget om radering från ett avslutat utträde.
      preconditions: Ett avtalat utträdestest med leverantören, ett testsystem som läser de avtalade formaten och intyget om radering från ett avslutat utträde, om ett sådant finns.
      expected: Exporten kommer inom 30 dagar och läses in utan förlust, och intyget omfattar varje kopia inom 30 dagar från bekräftelsen.
      steps:
        - action: Begär den fullständiga exporten och anteckna datumet.
          expected: Exporten kommer inom 30 dagar i utträdesplanens format.
        - action: Läs in 100 poster med historik i testsystemet och jämför dem med tjänsten.
          expected: Varje post och dess historik stämmer.
          data: 100 poster
        - action: Läs intyget om radering och jämför dess datum med kundens bekräftelse.
          expected: Det är undertecknat, daterat högst 30 dagar senare och omfattar produktions-, säkerhets- och arkivkopior.

  - id: SVOUT-T09
    priority: high
    execution: manual
    tags: [register, concentration-risk]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(3)", "Regulation (EU) 2022/2554 (DORA) Art. 29"]
    en:
      title: Register of outsourced services and concentration assessments
      description: Compares the register with the contract system and checks the concentration risk assessments of critical contracts.
      preconditions: The register of outsourced services, an export of active service contracts and the assessments for critical functions.
      expected: The register is complete, and each critical contract was preceded by a concentration risk assessment.
      steps:
        - action: Match the active service contracts against the register.
          expected: Each contract is in the register.
        - action: Check the fields of each register entry.
          expected: Provider, contract reference, function, criticality and countries are filled in.
        - action: For each contract for a critical function, compare the assessment date with the signature date.
          expected: The assessment is earlier and lists the other functions with the provider and its replaceability.
    sv:
      title: Register över utlagda tjänster och bedömningar av koncentrationsrisk
      description: Jämför registret med avtalssystemet och kontrollerar bedömningarna av koncentrationsrisk för kritiska avtal.
      preconditions: Registret över utlagda tjänster, en export av aktiva tjänsteavtal och bedömningarna för kritiska funktioner.
      expected: Registret är komplett, och varje kritiskt avtal föregicks av en bedömning av koncentrationsrisken.
      steps:
        - action: Matcha de aktiva tjänsteavtalen mot registret.
          expected: Varje avtal finns i registret.
        - action: Kontrollera fälten i varje post i registret.
          expected: Leverantör, avtalsreferens, funktion, kritikalitet och länder är ifyllda.
        - action: Jämför för varje avtal för en kritisk funktion bedömningens datum med undertecknandedatumet.
          expected: Bedömningen är tidigare och listar de andra funktionerna hos leverantören och dess ersättningsbarhet.

  - id: SVOUT-T10
    priority: high
    execution: manual
    tags: [screening, privileged-access]
    refs: ["ISO/IEC 27001:2022 A.6.1"]
    en:
      title: Background checks of privileged provider staff
      description: Samples provider staff with privileged access and checks their background check records against the access dates.
      preconditions: The list of provider accounts with privileged access, their grant dates and the provider's screening records.
      expected: Each sampled person was checked at the contracted level before access was granted.
      steps:
        - action: Pick 5 provider staff with privileged access.
          expected: Each has a screening record from the provider.
        - action: Compare the screening level with the level in the contract.
          expected: The levels match.
        - action: Compare the screening date with the date the access was granted.
          expected: The screening is earlier.
    sv:
      title: Bakgrundskontroller av leverantörens privilegierade personal
      description: Gör ett urval av leverantörens personal med privilegierad behörighet och jämför deras kontroller med datumen för åtkomst.
      preconditions: Listan över leverantörskonton med privilegierad behörighet, datum då de gavs och leverantörens underlag om kontroller.
      expected: Varje person i urvalet kontrollerades på avtalad nivå innan åtkomsten gavs.
      steps:
        - action: Välj 5 personer hos leverantören med privilegierad behörighet.
          expected: Varje person har ett underlag om kontroll från leverantören.
        - action: Jämför kontrollens nivå med nivån i avtalet.
          expected: Nivåerna stämmer.
        - action: Jämför datumet för kontrollen med datumet då åtkomsten gavs.
          expected: Kontrollen är tidigare.

  - id: SVOUT-T11
    priority: medium
    execution: manual
    tags: [termination, subcontractors]
    refs: ["Regulation (EU) 2022/2554 (DORA) Art. 28(7)", "ISO/IEC 27001:2022 A.5.21", "MITRE ATT&CK T1199 (trusted relationship)"]
    en:
      title: Termination grounds and flow-down to subcontractors
      description: Reviews the termination clause and asks the provider to show the security clauses of its subcontracts.
      preconditions: The contract for a critical function and the provider's list of subcontractors.
      expected: The contract has the 3 termination grounds, and the provider shows the flow-down within 10 working days.
      steps:
        - action: Read the termination clause of the contract.
          expected: It covers material breach, a weakness in risk management and a supervisory instruction.
        - action: Ask the provider in writing for the security clauses of 2 named subcontracts.
          expected: The provider delivers them within 10 working days.
        - action: Compare the delivered clauses with the security requirements of the main contract.
          expected: Each requirement appears in both subcontracts.
    sv:
      title: Uppsägningsgrunder och vidareföring till underleverantörer
      description: Granskar uppsägningsklausulen och ber leverantören visa säkerhetsklausulerna i sina underleverantörsavtal.
      preconditions: Avtalet för en kritisk funktion och leverantörens lista över underleverantörer.
      expected: Avtalet har de 3 uppsägningsgrunderna, och leverantören visar vidareföringen inom 10 arbetsdagar.
      steps:
        - action: Läs avtalets uppsägningsklausul.
          expected: Den omfattar väsentligt avtalsbrott, brist i riskhanteringen och föreläggande från tillsynsmyndighet.
        - action: Begär skriftligt säkerhetsklausulerna i 2 namngivna underleverantörsavtal från leverantören.
          expected: Leverantören lämnar dem inom 10 arbetsdagar.
        - action: Jämför de mottagna klausulerna med säkerhetskraven i huvudavtalet.
          expected: Varje krav finns i båda underleverantörsavtalen.

  - id: SVOUT-T12
    priority: medium
    execution: manual
    tags: [continuity, exercise]
    refs: ["ISO 22301:2019 §8.5 (exercise programme)"]
    en:
      title: Provider participation in a continuity exercise
      description: Checks the provider's part in the latest continuity exercise that involved the service.
      preconditions: The exercise report of the last 12 months and the provider's findings.
      expected: The provider took part and delivered its findings within 15 working days.
      steps:
        - action: Read the participant list of the exercise report.
          expected: Staff of the provider are named.
        - action: Compare the date of the provider's findings with the exercise date.
          expected: The findings came within 15 working days.
    sv:
      title: Leverantörens deltagande i en kontinuitetsövning
      description: Kontrollerar leverantörens del i den senaste kontinuitetsövningen som omfattade tjänsten.
      preconditions: Övningsrapporten från de senaste 12 månaderna och leverantörens iakttagelser.
      expected: Leverantören deltog och lämnade sina iakttagelser inom 15 arbetsdagar.
      steps:
        - action: Läs deltagarlistan i övningsrapporten.
          expected: Personal från leverantören är namngiven.
        - action: Jämför datumet för leverantörens iakttagelser med övningsdatumet.
          expected: Iakttagelserna kom inom 15 arbetsdagar.
