area: email-security
prefix: MAILS
group: security
name: {en: Email and messaging security, sv: Säkerhet för e-post och meddelanden}
description:
  en: Sender authentication with SPF, DKIM and DMARC, encrypted transport, header injection, the content of outgoing messages, links, bounces, unsubscribe and sending limits.
  sv: Avsändarautentisering med SPF, DKIM och DMARC, krypterad överföring, injektion i huvuden, innehållet i utgående meddelanden, länkar, studsar, avregistrering och sändningsgränser.

requirements:
  - id: MAILS-01
    type: security
    obligation: must
    priority: high
    tags: [spf, dns, spoofing]
    refs: ["RFC 7208 (SPF)", "M3AAWG Email Authentication Recommended Best Practices", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)", "MITRE ATT&CK T1566 (phishing)"]
    tests: [MAILS-T01]
    d3fend: [D3-TAAN]
    en:
      title: SPF record for each sending domain
      description: Each domain that the system sends email from MUST publish an SPF record that lists only the services sending its mail and ends with "-all".
      rationale: Without SPF, anyone can send mail that claims to come from the domain, and receivers cannot tell real messages from phishing.
      criteria:
        - method: test
          text: A DNS lookup of each sending domain returns one SPF record ending in -all with at most 10 DNS lookups, and test mail passes SPF at two large mailbox providers.
    sv:
      title: SPF-post för varje avsändardomän
      description: Varje domän som systemet skickar e-post från SKA publicera en SPF-post som bara anger tjänsterna som skickar domänens e-post och slutar med "-all".
      rationale: Utan SPF kan vem som helst skicka e-post som påstås komma från domänen, och mottagarna kan inte skilja äkta meddelanden från nätfiske.
      criteria:
        - method: test
          text: En DNS-uppslagning av varje avsändardomän ger en SPF-post som slutar med -all och kräver högst 10 DNS-uppslagningar, och testmeddelanden godkänns i SPF hos två stora e-postleverantörer.

  - id: MAILS-02
    type: security
    obligation: must
    priority: high
    tags: [dkim, signing]
    refs: ["RFC 6376 (DKIM)", "RFC 8301 (cryptographic algorithm and key usage update to DKIM)", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)"]
    tests: [MAILS-T01]
    d3fend: [D3-TAAN]
    en:
      title: DKIM signature with a key of at least 2048 bits
      description: The system MUST sign each outgoing email with DKIM using an RSA key of at least 2048 bits or an Ed25519 key, aligned with the From domain.
      rationale: The signature proves that the message comes from the domain and was not changed on the way.
      criteria:
        - method: test
          text: The headers of a received test message show dkim=pass for the From domain, and the published key is at least 2048 bits.
          threshold: "RSA ≥ 2048 bits"
    sv:
      title: DKIM-signatur med en nyckel på minst 2048 bitar
      description: Systemet SKA signera varje utgående e-postmeddelande med DKIM med en RSA-nyckel på minst 2048 bitar eller en Ed25519-nyckel, i linje med From-domänen.
      rationale: Signaturen visar att meddelandet kommer från domänen och inte har ändrats på vägen.
      criteria:
        - method: test
          text: Huvudena i ett mottaget testmeddelande visar dkim=pass för From-domänen, och den publicerade nyckeln är minst 2048 bitar.
          threshold: "RSA ≥ 2048 bitar"

  - id: MAILS-03
    type: security
    obligation: should
    priority: high
    tags: [dmarc, reporting]
    refs: ["RFC 9989 (DMARC)", "M3AAWG Email Authentication Recommended Best Practices", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)", "MITRE ATT&CK T1566 (phishing)"]
    tests: [MAILS-T01, MAILS-T09]
    d3fend: [D3-TAAN]
    en:
      title: DMARC policy that rejects or quarantines
      description: Each sending domain SHOULD publish a DMARC record with the policy reject or quarantine and an address for aggregate reports.
      rationale: DMARC tells receivers to stop mail that fails SPF and DKIM, and the reports show who sends in the domain's name.
      criteria:
        - method: test
          text: The DMARC record of each sending domain has p=reject or p=quarantine and a rua address, and aggregate reports arrive at that address.
    sv:
      title: DMARC-policy som avvisar eller sätter i karantän
      description: Varje avsändardomän BÖR publicera en DMARC-post med policyn reject eller quarantine och en adress för sammanställda rapporter.
      rationale: DMARC talar om för mottagarna att stoppa e-post som inte klarar SPF och DKIM, och rapporterna visar vem som skickar i domänens namn.
      criteria:
        - method: test
          text: DMARC-posten för varje avsändardomän har p=reject eller p=quarantine och en rua-adress, och sammanställda rapporter kommer till den adressen.

  - id: MAILS-04
    type: security
    obligation: must
    priority: high
    tags: [tls, smtp, mta-sts]
    refs: ["RFC 3207 (SMTP STARTTLS)", "RFC 8461 (MTA-STS)", "RFC 8460 (SMTP TLS reporting)", "ISO/IEC 27001:2022 A.5.14", "ISO/IEC 27001:2022 A.8.24", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    tests: [MAILS-T02]
    d3fend: [D3-MENCR]
    en:
      title: Encrypted transport of email
      description: The system MUST deliver outgoing email over TLS 1.2 or later to each receiving server that offers STARTTLS, and send no credentials over unencrypted SMTP.
      rationale: Messages with invitations, notifications and links travel through networks that the organisation does not control.
      criteria:
        - method: test
          text: The received headers of test messages to a server with STARTTLS show TLS 1.2 or later, and the connection to the relay uses TLS before authentication.
        - method: inspection
          text: The receiving domains publish an MTA-STS policy in enforce mode.
    sv:
      title: Krypterad överföring av e-post
      description: Systemet SKA leverera utgående e-post över TLS 1.2 eller senare till varje mottagande server som erbjuder STARTTLS och skicka inga inloggningsuppgifter över okrypterad SMTP.
      rationale: Meddelanden med inbjudningar, aviseringar och länkar passerar nät som organisationen inte styr över.
      criteria:
        - method: test
          text: Received-huvudena i testmeddelanden till en server med STARTTLS visar TLS 1.2 eller senare, och anslutningen till reläservern använder TLS före autentiseringen.
        - method: inspection
          text: De mottagande domänerna publicerar en MTA-STS-policy i läget enforce.

  - id: MAILS-05
    type: security
    obligation: must
    priority: high
    tags: [header-injection, input-validation]
    refs: ["CWE-93 (CRLF injection)", "OWASP ASVS 5.0 V1.3.11 (mail injection)", "ISO/IEC 27001:2022 A.8.28"]
    tests: [MAILS-T03]
    en:
      title: No header injection in outgoing email
      description: The system MUST reject or remove carriage return and line feed characters in each value placed in an email header, such as subject, recipient and sender name.
      rationale: A line break in a header value lets an attacker add recipients or headers and use the system to send spam or phishing.
      criteria:
        - method: test
          text: A display name containing a line break followed by a Bcc header produces a message without the extra recipient.
    sv:
      title: Ingen injektion i huvuden i utgående e-post
      description: Systemet SKA avvisa eller ta bort vagnretur- och radmatningstecken i varje värde som placeras i ett e-posthuvud, till exempel ämne, mottagare och avsändarnamn.
      rationale: En radbrytning i ett huvudvärde låter en angripare lägga till mottagare eller huvuden och använda systemet för att skicka skräppost eller nätfiske.
      criteria:
        - method: test
          text: Ett visningsnamn med en radbrytning följd av ett Bcc-huvud ger ett meddelande utan den extra mottagaren.

  - id: MAILS-06
    type: security
    obligation: must
    priority: high
    tags: [html-email, xss, output-encoding]
    refs: ["OWASP ASVS 5.0 V1.2.1 (output encoding)", "CWE-79 (cross-site scripting)", "ISO/IEC 27001:2022 A.8.28", "CWE-116 (improper encoding or escaping of output)"]
    tests: [MAILS-T03]
    en:
      title: User content is encoded in HTML email
      description: The system MUST HTML-encode user-supplied text, such as names, titles and comments, before inserting it into an HTML email.
      rationale: Unencoded markup lets one user put fake links, forms or images into messages that look as if the system sent them.
      criteria:
        - method: test
          text: A comment containing a link tag and an image tag is shown as literal text in the notification email.
    sv:
      title: Användarinnehåll kodas i HTML-e-post
      description: Systemet SKA HTML-koda text som användare har angett, till exempel namn, rubriker och kommentarer, innan den infogas i ett HTML-e-postmeddelande.
      rationale: Okodad märkning låter en användare lägga in falska länkar, formulär eller bilder i meddelanden som ser ut att komma från systemet.
      criteria:
        - method: test
          text: En kommentar som innehåller en länktagg och en bildtagg visas som bokstavlig text i aviseringsmeddelandet.

  - id: MAILS-07
    type: security
    obligation: must_not
    priority: high
    tags: [content, confidentiality]
    refs: ["OWASP ASVS 5.0 V14.2.6 (minimum sensitive data)", "GDPR Art. 32 (security of processing)", "ISO/IEC 27001:2022 A.5.14", "CWE-312 (cleartext storage of sensitive information)", "MITRE ATT&CK T1114 (email collection)"]
    tests: [MAILS-T04]
    en:
      title: No passwords or confidential content in email
      description: Outgoing email MUST NOT contain passwords or the content of records classified as confidential, and links to the record in the system instead.
      rationale: Email is stored in many mailboxes, forwarded and indexed outside the organisation's control.
      criteria:
        - method: test
          text: The welcome, password reset and notification emails for a confidential record contain no password and no text of the record, only a link.
    sv:
      title: Inga lösenord eller konfidentiellt innehåll i e-post
      description: Utgående e-post SKA INTE innehålla lösenord eller innehållet i poster som klassats som konfidentiella, utan länka till posten i systemet.
      rationale: E-post lagras i många brevlådor, vidarebefordras och indexeras utanför organisationens kontroll.
      criteria:
        - method: test
          text: Välkomstmeddelandet, meddelandet om återställning av lösenord och aviseringen för en konfidentiell post innehåller inget lösenord och ingen text ur posten, bara en länk.

  - id: MAILS-08
    type: security
    obligation: should
    priority: medium
    tags: [invitation, links, expiry]
    refs: ["OWASP ASVS 5.0 V6.4.1 (activation codes)", "NIST SP 800-63A-4 §3.8 (confirmation codes)", "ISO/IEC 27001:2022 A.5.17", "CWE-1472 (generation of credential with long expiration)"]
    tests: [MAILS-T05]
    en:
      title: Invitation links work once and expire after 7 days
      description: Invitation links sent by email SHOULD be valid for one use and expire 7 days after they were sent.
      rationale: Invitations are forwarded and left in mailboxes, and an old link must not let someone else join the organisation.
      criteria:
        - method: test
          text: A used invitation link and an unused link older than 7 days both show a message that the invitation is no longer valid.
          threshold: "1 use, ≤ 7 days"
    sv:
      title: Inbjudningslänkar fungerar en gång och slutar gälla efter 7 dagar
      description: Inbjudningslänkar som skickas med e-post BÖR gälla för en användning och sluta gälla 7 dagar efter att de skickades.
      rationale: Inbjudningar vidarebefordras och blir liggande i brevlådor, och en gammal länk ska inte släppa in någon annan i organisationen.
      criteria:
        - method: test
          text: En använd inbjudningslänk och en oanvänd länk som är äldre än 7 dagar visar båda ett meddelande om att inbjudan inte längre gäller.
          threshold: "1 användning, ≤ 7 dagar"

  - id: MAILS-09
    type: functional
    obligation: should
    priority: medium
    tags: [bounce, deliverability]
    refs: ["RFC 3464 (delivery status notifications)", "M3AAWG Sender Best Common Practices"]
    tests: [MAILS-T06]
    en:
      title: Sending stops after repeated hard bounces
      description: The system SHOULD stop sending email to an address after 3 hard bounces and show the address as undeliverable to the user's administrator.
      rationale: Repeated mail to dead addresses lowers the sender's reputation, so that mail to real recipients ends up as spam.
      criteria:
        - method: test
          text: After 3 hard bounces from a test address, no further message is sent to it and the user list marks it as undeliverable.
          threshold: "3 hard bounces"
    sv:
      title: Utskicken upphör efter upprepade hårda studsar
      description: Systemet BÖR sluta skicka e-post till en adress efter 3 hårda studsar och visa adressen som omöjlig att leverera till för användarens administratör.
      rationale: Upprepade utskick till döda adresser sänker avsändarens rykte, så att e-post till riktiga mottagare hamnar som skräppost.
      criteria:
        - method: test
          text: Efter 3 hårda studsar från en testadress skickas inga fler meddelanden dit och användarlistan markerar adressen som omöjlig att leverera till.
          threshold: "3 hårda studsar"

  - id: MAILS-10
    type: regulatory
    obligation: must
    priority: medium
    tags: [unsubscribe, bulk-email]
    refs: ["RFC 8058 (one-click unsubscribe)", "ePrivacy Directive 2002/58/EC Art. 13", "Swedish Marketing Act (2008:486) §19"]
    tests: [MAILS-T07]
    en:
      title: One-click unsubscribe from non-transactional email
      description: Each newsletter and other non-transactional email MUST carry a List-Unsubscribe header with one-click unsubscribe that the system honours within 2 days.
      rationale: Receivers expect to opt out without signing in, and large mailbox providers reject bulk mail that does not offer it.
      criteria:
        - method: test
          text: A newsletter test message has List-Unsubscribe and List-Unsubscribe-Post headers, and after a one-click request no further newsletter is sent to the address.
          threshold: "≤ 2 days"
    sv:
      title: Avregistrering med ett klick från icke-transaktionell e-post
      description: Varje nyhetsbrev och annan icke-transaktionell e-post SKA ha ett List-Unsubscribe-huvud med avregistrering med ett klick som systemet verkställer inom 2 dagar.
      rationale: Mottagare förväntar sig att kunna avregistrera sig utan att logga in, och stora e-postleverantörer avvisar massutskick som inte erbjuder det.
      criteria:
        - method: test
          text: Ett testnyhetsbrev har huvudena List-Unsubscribe och List-Unsubscribe-Post, och efter en begäran med ett klick skickas inga fler nyhetsbrev till adressen.
          threshold: "≤ 2 dagar"

  - id: MAILS-11
    type: security
    obligation: should
    priority: medium
    tags: [rate-limit, abuse]
    refs: ["OWASP Abuse Case Cheat Sheet", "M3AAWG Sender Best Common Practices", "CWE-799 (improper control of interaction frequency)"]
    tests: [MAILS-T08]
    en:
      title: Limit on email to external addresses per user
      description: The system SHOULD send at most 50 emails per hour to external addresses as a result of one user's actions, such as invitations and shares.
      rationale: Invitation and share functions are abused to send spam through a trusted sender, which damages its reputation for every customer.
      criteria:
        - method: test
          text: When a user sends 60 invitations within one hour, the 51st and later are refused with a message, and the administrator is notified.
          threshold: "≤ 50 per user per hour"
    sv:
      title: Gräns för e-post till externa adresser per användare
      description: Systemet BÖR skicka högst 50 e-postmeddelanden per timme till externa adresser till följd av en användares åtgärder, till exempel inbjudningar och delningar.
      rationale: Funktioner för inbjudan och delning missbrukas för att skicka skräppost via en betrodd avsändare, vilket skadar dess rykte för alla kunder.
      criteria:
        - method: test
          text: När en användare skickar 60 inbjudningar inom en timme avvisas den 51:a och senare med ett meddelande, och administratören aviseras.
          threshold: "≤ 50 per användare och timme"

  - id: MAILS-12
    type: security
    obligation: must
    priority: high
    tags: [inbound-email, dmarc, reply-by-email]
    refs: ["RFC 9989 §5.3 (mail receiver actions)", "RFC 6376", "ISO/IEC 27001:2022 A.5.14", "CWE-290 (authentication bypass by spoofing)", "MITRE ATT&CK T1684.002 (email spoofing)"]
    tests: [MAILS-T10]
    d3fend: [D3-TAAN]
    en:
      title: Inbound email is authenticated before it changes data
      description: The system MUST act on an inbound email, such as a reply that adds a comment, only when the message passes DMARC alignment for the sender's domain and the sender address belongs to a user with the right to do the action.
      rationale: The From header of an email is trivial to forge, so acting on it lets anyone write comments or approvals in another user's name.
      criteria:
        - method: test
          text: A forged reply that fails DMARC is discarded without a change, and a genuine reply from the user adds the comment.
    sv:
      title: Inkommande e-post autentiseras innan den ändrar data
      description: Systemet SKA agera på ett inkommande e-postmeddelande, till exempel ett svar som lägger till en kommentar, endast när meddelandet klarar DMARC-anpassningen för avsändarens domän och avsändaradressen tillhör en användare med rätt att utföra åtgärden.
      rationale: Ett e-postmeddelandes From-huvud är lätt att förfalska, så att agera på det låter vem som helst skriva kommentarer eller godkännanden i en annan användares namn.
      criteria:
        - method: test
          text: Ett förfalskat svar som inte klarar DMARC kastas utan ändring, och ett äkta svar från användaren lägger till kommentaren.

  - id: MAILS-13
    type: security
    obligation: must
    priority: medium
    tags: [parked-domains, spf, dmarc]
    refs: ["M3AAWG Protecting Parked Domains Best Common Practices", "RFC 7208", "RFC 9989 (DMARC)", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)"]
    tests: [MAILS-T11]
    en:
      title: Domains that send no email say so
      description: Each domain of the organisation that sends no email MUST publish the SPF record "v=spf1 -all" and a DMARC record with the policy reject.
      rationale: Attackers prefer to spoof unused domains of a trusted brand, because nobody watches them and receivers have no policy to apply.
      criteria:
        - method: inspection
          text: A DNS lookup of every registered domain without mail traffic shows both records.
    sv:
      title: Domäner som inte skickar e-post anger det
      description: Varje domän hos organisationen som inte skickar e-post SKA publicera SPF-posten "v=spf1 -all" och en DMARC-post med policyn reject.
      rationale: Angripare förfalskar helst oanvända domäner för ett betrott varumärke, eftersom ingen bevakar dem och mottagarna saknar en policy att tillämpa.
      criteria:
        - method: inspection
          text: En DNS-uppslagning av varje registrerad domän utan e-posttrafik visar båda posterna.

  - id: MAILS-14
    type: security
    obligation: should
    priority: medium
    tags: [dmarc-reports, monitoring]
    refs: ["RFC 9990 (DMARC aggregate reporting)", "M3AAWG Email Authentication Recommended Best Practices", "ISO/IEC 27001:2022 A.8.16", "MITRE ATT&CK T1684.002 (email spoofing)"]
    tests: [MAILS-T12]
    en:
      title: Weekly review of DMARC aggregate reports
      description: The operator SHOULD review the DMARC aggregate reports of each sending domain every week and open a ticket for each source that sends more than 10 messages that fail authentication.
      rationale: The reports show both forgotten legitimate senders, whose mail will be rejected, and spoofing campaigns against the domain.
      criteria:
        - method: inspection
          text: The review log has an entry for each of the last 4 weeks, and each failing source above the threshold has a ticket.
          threshold: "> 10 failing messages per source and week"
    sv:
      title: Veckovis granskning av DMARC-sammanställningar
      description: Driftansvarig BÖR granska DMARC-sammanställningarna för varje sändande domän varje vecka och öppna ett ärende för varje källa som skickar mer än 10 meddelanden som inte klarar autentiseringen.
      rationale: Rapporterna visar både bortglömda legitima avsändare, vars e-post kommer att avvisas, och förfalskningskampanjer mot domänen.
      criteria:
        - method: inspection
          text: Granskningsloggen har en post för var och en av de senaste 4 veckorna, och varje felande källa över tröskeln har ett ärende.
          threshold: "> 10 felande meddelanden per källa och vecka"

  - id: MAILS-15
    type: security
    obligation: should
    priority: medium
    tags: [dkim, key-rotation]
    refs: ["M3AAWG DKIM Key Rotation Best Common Practices", "RFC 6376", "ISO/IEC 27001:2022 A.8.24", "CWE-324 (use of a key past its expiration date)"]
    tests: [MAILS-T13]
    en:
      title: DKIM keys rotated every 12 months
      description: The operator SHOULD replace the DKIM signing key of each sending domain at least every 12 months with a new selector, and remove the old public key from DNS 7 days after the switch.
      rationale: A long-lived signing key has more time to leak, and a leaked key lets anyone send perfectly signed mail in the domain's name.
      criteria:
        - method: inspection
          text: The current selector of each sending domain is less than 12 months old, and the previous selector no longer resolves.
          threshold: "≤ 12 months"
    sv:
      title: DKIM-nycklar byts var 12:e månad
      description: Driftansvarig BÖR byta DKIM-signeringsnyckeln för varje sändande domän minst var 12:e månad med en ny selektor, och ta bort den gamla publika nyckeln från DNS 7 dagar efter bytet.
      rationale: En långlivad signeringsnyckel har längre tid att läcka, och en läckt nyckel låter vem som helst skicka korrekt signerad e-post i domänens namn.
      criteria:
        - method: inspection
          text: Den aktuella selektorn för varje sändande domän är yngre än 12 månader, och den föregående selektorn ger inget svar i DNS.
          threshold: "≤ 12 månader"

  - id: MAILS-16
    type: security
    obligation: should
    priority: medium
    tags: [links, phishing, https]
    refs: ["M3AAWG Sender Best Common Practices", "ISO/IEC 27001:2022 A.8.23", "MITRE ATT&CK T1566.002 (spearphishing link)"]
    tests: [MAILS-T14]
    en:
      title: Email links point to the system's own HTTPS domains
      description: The system SHOULD put only HTTPS links to its own published domains in the emails it sends, without URL shorteners or third-party redirectors.
      rationale: Users can only learn to recognise phishing when genuine messages always link to the same known domains.
      criteria:
        - method: test
          text: The links in each email template resolve to HTTPS addresses on the system's domains with no redirect through another host.
    sv:
      title: Länkar i e-post går till systemets egna HTTPS-domäner
      description: Systemet BÖR enbart lägga HTTPS-länkar till sina egna publicerade domäner i den e-post det skickar, utan länkförkortare eller omdirigering via tredje part.
      rationale: Användare kan bara lära sig känna igen nätfiske när äkta meddelanden alltid länkar till samma kända domäner.
      criteria:
        - method: test
          text: Länkarna i varje e-postmall leder till HTTPS-adresser på systemets domäner utan omdirigering via en annan värd.

tests:
  - id: MAILS-T01
    priority: high
    execution: automated
    tags: [spf, dkim, dmarc, dns]
    refs: ["RFC 7208", "RFC 6376", "RFC 9989 (DMARC)", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)", "MITRE ATT&CK T1566 (phishing)"]
    en:
      title: SPF, DKIM and DMARC of the sending domains
      description: Looks up the DNS records of each sending domain and checks the authentication results of a received test message.
      preconditions: The list of sending domains; test mailboxes at two large mailbox providers; a DNS lookup tool.
      expected: SPF ends in -all within 10 lookups, DKIM uses a key of at least 2048 bits and passes, and DMARC is reject or quarantine with a report address.
      steps:
        - action: Look up the TXT records of each sending domain and evaluate the SPF record.
          expected: There is exactly one SPF record, it ends with -all and needs at most 10 DNS lookups.
        - action: Look up the DKIM selector record and read the key length.
          expected: The key is RSA of at least 2048 bits or Ed25519.
        - action: Look up the _dmarc record.
          expected: The policy is p=reject or p=quarantine and there is a rua address.
        - action: Send a test message to each test mailbox and read the Authentication-Results header.
          expected: The header shows spf=pass, dkim=pass and dmarc=pass for the From domain.
    sv:
      title: SPF, DKIM och DMARC för avsändardomänerna
      description: Slår upp DNS-posterna för varje avsändardomän och kontrollerar autentiseringsresultatet för ett mottaget testmeddelande.
      preconditions: Listan över avsändardomäner; testbrevlådor hos två stora e-postleverantörer; ett verktyg för DNS-uppslagning.
      expected: SPF slutar med -all inom 10 uppslagningar, DKIM använder en nyckel på minst 2048 bitar och godkänns, och DMARC är reject eller quarantine med en rapportadress.
      steps:
        - action: Slå upp TXT-posterna för varje avsändardomän och utvärdera SPF-posten.
          expected: Det finns exakt en SPF-post, den slutar med -all och kräver högst 10 DNS-uppslagningar.
        - action: Slå upp DKIM-selektorns post och läs nyckellängden.
          expected: Nyckeln är RSA på minst 2048 bitar eller Ed25519.
        - action: Slå upp posten _dmarc.
          expected: Policyn är p=reject eller p=quarantine och det finns en rua-adress.
        - action: Skicka ett testmeddelande till varje testbrevlåda och läs huvudet Authentication-Results.
          expected: Huvudet visar spf=pass, dkim=pass och dmarc=pass för From-domänen.

  - id: MAILS-T02
    priority: high
    execution: manual
    tags: [tls, smtp, mta-sts]
    refs: ["RFC 8461", "ISO/IEC 27001:2022 A.5.14", "ISO/IEC 27001:2022 A.8.24", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    en:
      title: Outgoing email is sent over TLS
      description: Sends test messages and inspects the transport of each hop and the MTA-STS policy of the receiving domains.
      preconditions: A test mailbox on a server that offers STARTTLS; access to the relay connection settings; the receiving domains of the organisation.
      expected: Each hop uses TLS 1.2 or later, authentication to the relay happens after TLS, and MTA-STS is in enforce mode.
      steps:
        - action: Send a test message and read the Received headers in the test mailbox.
          expected: Each hop that the system controls shows TLS 1.2 or later.
        - action: Capture the connection from the application to the mail relay.
          expected: The connection is encrypted before the AUTH command is sent.
        - action: Fetch https://mta-sts.<domain>/.well-known/mta-sts.txt for each receiving domain.
          expected: The policy has mode enforce and lists the domain's mail servers.
    sv:
      title: Utgående e-post skickas över TLS
      description: Skickar testmeddelanden och granskar överföringen i varje steg och MTA-STS-policyn för de mottagande domänerna.
      preconditions: En testbrevlåda på en server som erbjuder STARTTLS; åtkomst till inställningarna för anslutningen till reläservern; organisationens mottagande domäner.
      expected: Varje steg använder TLS 1.2 eller senare, autentiseringen mot reläservern sker efter TLS, och MTA-STS är i läget enforce.
      steps:
        - action: Skicka ett testmeddelande och läs Received-huvudena i testbrevlådan.
          expected: Varje steg som systemet styr visar TLS 1.2 eller senare.
        - action: Fånga anslutningen från applikationen till reläservern.
          expected: Anslutningen är krypterad innan kommandot AUTH skickas.
        - action: Hämta https://mta-sts.<domän>/.well-known/mta-sts.txt för varje mottagande domän.
          expected: Policyn har läget enforce och anger domänens e-postservrar.

  - id: MAILS-T03
    priority: high
    execution: automated
    tags: [header-injection, html-email]
    refs: ["OWASP Web Security Testing Guide v4.2 §4.7.10 (testing for IMAP/SMTP injection)", "ISO/IEC 27001:2022 A.8.28", "CWE-116 (improper encoding or escaping of output)"]
    en:
      title: Header injection and markup in notification email
      description: Uses a display name with a line break and a comment with HTML tags, and inspects the resulting email.
      preconditions: A test user whose display name can be changed; a mail catcher that captures all outgoing email in the test environment.
      expected: The message has no extra header or recipient, and the HTML tags are shown as text.
      steps:
        - action: Set the user's display name to a value with a line break followed by a Bcc header, then trigger a notification from that user.
          expected: The name is rejected, or the captured message has the name on one line and no Bcc header.
          data: "Alice\\r\\nBcc: victim@example.com"
        - action: Add a comment with a link tag and an image tag to an item that sends a notification.
          expected: The captured HTML message shows the tags as literal text and contains no link or image from the comment.
          data: "<a href=\"https://evil.example\">Click</a><img src=\"https://evil.example/x.png\">"
    sv:
      title: Injektion i huvuden och märkning i aviseringar
      description: Använder ett visningsnamn med en radbrytning och en kommentar med HTML-taggar och granskar det e-postmeddelande som skapas.
      preconditions: En testanvändare vars visningsnamn kan ändras; en e-postfångare som fångar all utgående e-post i testmiljön.
      expected: Meddelandet har inget extra huvud eller extra mottagare, och HTML-taggarna visas som text.
      steps:
        - action: Sätt användarens visningsnamn till ett värde med en radbrytning följd av ett Bcc-huvud och utlös sedan en avisering från användaren.
          expected: Namnet avvisas, eller så har det fångade meddelandet namnet på en rad och inget Bcc-huvud.
          data: "Alice\\r\\nBcc: victim@example.com"
        - action: Lägg till en kommentar med en länktagg och en bildtagg på en post som skickar en avisering.
          expected: Det fångade HTML-meddelandet visar taggarna som bokstavlig text och innehåller ingen länk eller bild från kommentaren.
          data: "<a href=\"https://evil.example\">Click</a><img src=\"https://evil.example/x.png\">"

  - id: MAILS-T04
    priority: high
    execution: manual
    tags: [content, confidentiality]
    refs: ["CWE-312 (cleartext storage of sensitive information)", "MITRE ATT&CK T1114 (email collection)"]
    en:
      title: Outgoing email contains no passwords or confidential text
      description: Triggers the welcome, password reset and record notification emails and reads their content.
      preconditions: A mail catcher in the test environment; a record classified as confidential with a known sentence in its description.
      expected: No email contains a password or the known sentence, and each links to the system.
      steps:
        - action: Create a new user and read the welcome email.
          expected: It contains a link to set a password and no password.
        - action: Request a password reset and read the email.
          expected: It contains a reset link and no current or new password.
        - action: Change the confidential record so that its watchers are notified, and read the notification.
          expected: It names the record and links to it, and the known sentence is not in the message.
          data: "known sentence: The merger is planned for May."
    sv:
      title: Utgående e-post innehåller inga lösenord eller konfidentiell text
      description: Utlöser välkomstmeddelandet, meddelandet om återställning av lösenord och aviseringen om en post och läser innehållet.
      preconditions: En e-postfångare i testmiljön; en post som klassats som konfidentiell med en känd mening i beskrivningen.
      expected: Inget meddelande innehåller ett lösenord eller den kända meningen, och varje meddelande länkar till systemet.
      steps:
        - action: Skapa en ny användare och läs välkomstmeddelandet.
          expected: Det innehåller en länk för att välja lösenord och inget lösenord.
        - action: Begär återställning av lösenord och läs meddelandet.
          expected: Det innehåller en återställningslänk och inget nuvarande eller nytt lösenord.
        - action: Ändra den konfidentiella posten så att dess bevakare aviseras, och läs aviseringen.
          expected: Den namnger posten och länkar till den, och den kända meningen finns inte i meddelandet.
          data: "känd mening: Sammanslagningen planeras till maj."

  - id: MAILS-T05
    priority: medium
    execution: manual
    tags: [invitation, expiry]
    refs: ["CWE-1472 (generation of credential with long expiration)"]
    en:
      title: Invitation links are single-use and expire
      description: Uses an invitation link twice and opens one that is older than 7 days.
      preconditions: An administrator who can invite users; two test mailboxes; the test clock can be moved forward.
      expected: A link works once, and an unused link stops working after 7 days.
      steps:
        - action: Invite test user 1 and accept the invitation with the link.
          expected: The account is created and joins the organisation.
        - action: Open the same link again in a private browser window.
          expected: A message says that the invitation is no longer valid.
        - action: Invite test user 2, move the clock 7 days and 1 minute forward and open the link.
          expected: A message says that the invitation has expired, and no account is created.
          data: "sent + 7 d 1 min"
    sv:
      title: Inbjudningslänkar gäller en gång och slutar gälla
      description: Använder en inbjudningslänk två gånger och öppnar en som är äldre än 7 dagar.
      preconditions: En administratör som kan bjuda in användare; två testbrevlådor; testklockan kan flyttas fram.
      expected: En länk fungerar en gång, och en oanvänd länk slutar fungera efter 7 dagar.
      steps:
        - action: Bjud in testanvändare 1 och godta inbjudan med länken.
          expected: Kontot skapas och ansluts till organisationen.
        - action: Öppna samma länk igen i ett privat webbläsarfönster.
          expected: Ett meddelande säger att inbjudan inte längre gäller.
        - action: Bjud in testanvändare 2, flytta klockan 7 dagar och 1 minut framåt och öppna länken.
          expected: Ett meddelande säger att inbjudan har gått ut, och inget konto skapas.
          data: "skickad + 7 d 1 min"

  - id: MAILS-T06
    priority: medium
    execution: automated
    tags: [bounce]
    refs: []
    en:
      title: Hard bounces stop further email
      description: Simulates three hard bounces for an address and checks that sending stops and the address is marked.
      preconditions: A test user whose address returns a permanent failure; the bounce handling of the email provider is connected to the test environment.
      expected: After the third hard bounce no message is sent, and the address is shown as undeliverable.
      steps:
        - action: Trigger three notifications to the test user and let each one bounce with a permanent failure.
          expected: The system records three hard bounces for the address.
          data: "SMTP 550 5.1.1 user unknown"
        - action: Trigger a fourth notification.
          expected: No message is handed to the email provider for the address.
        - action: Open the user list as an administrator.
          expected: The user's address is marked as undeliverable.
    sv:
      title: Hårda studsar stoppar fler utskick
      description: Simulerar tre hårda studsar för en adress och kontrollerar att utskicken upphör och att adressen markeras.
      preconditions: En testanvändare vars adress ger ett permanent fel; e-postleverantörens hantering av studsar är kopplad till testmiljön.
      expected: Efter den tredje hårda studsen skickas inga meddelanden, och adressen visas som omöjlig att leverera till.
      steps:
        - action: Utlös tre aviseringar till testanvändaren och låt var och en studsa med ett permanent fel.
          expected: Systemet registrerar tre hårda studsar för adressen.
          data: "SMTP 550 5.1.1 user unknown"
        - action: Utlös en fjärde avisering.
          expected: Inget meddelande lämnas till e-postleverantören för adressen.
        - action: Öppna användarlistan som administratör.
          expected: Användarens adress är markerad som omöjlig att leverera till.

  - id: MAILS-T07
    priority: medium
    execution: automated
    tags: [unsubscribe]
    refs: ["RFC 8058"]
    en:
      title: One-click unsubscribe from a newsletter
      description: Sends a newsletter, reads its headers and sends the one-click unsubscribe request.
      preconditions: A test subscriber of the newsletter; a mail catcher; a script that can send an HTTPS POST.
      expected: The headers are present, and after the request no further newsletter reaches the subscriber.
      steps:
        - action: Send a newsletter and read the headers of the captured message.
          expected: List-Unsubscribe has an HTTPS address and List-Unsubscribe-Post is List-Unsubscribe=One-Click.
        - action: Send a POST to the unsubscribe address with the body List-Unsubscribe=One-Click and no cookies.
          expected: The response is 200 or 202.
        - action: Send the next newsletter 2 days later.
          expected: No message is sent to the test subscriber.
    sv:
      title: Avregistrering med ett klick från ett nyhetsbrev
      description: Skickar ett nyhetsbrev, läser dess huvuden och skickar begäran om avregistrering med ett klick.
      preconditions: En testprenumerant på nyhetsbrevet; en e-postfångare; ett skript som kan skicka en HTTPS POST.
      expected: Huvudena finns, och efter begäran når inga fler nyhetsbrev prenumeranten.
      steps:
        - action: Skicka ett nyhetsbrev och läs huvudena i det fångade meddelandet.
          expected: List-Unsubscribe har en HTTPS-adress och List-Unsubscribe-Post är List-Unsubscribe=One-Click.
        - action: Skicka en POST till avregistreringsadressen med innehållet List-Unsubscribe=One-Click och utan cookies.
          expected: Svaret är 200 eller 202.
        - action: Skicka nästa nyhetsbrev 2 dagar senare.
          expected: Inget meddelande skickas till testprenumeranten.

  - id: MAILS-T08
    priority: medium
    execution: automated
    tags: [rate-limit, abuse]
    refs: ["CWE-799 (improper control of interaction frequency)"]
    en:
      title: Invitation flood is limited
      description: A script sends 60 invitations to external addresses from one user within an hour.
      preconditions: A test user who may invite external users; a mail catcher; an administrator mailbox.
      expected: The first 50 invitations are sent, the rest are refused, and the administrator is notified.
      steps:
        - action: Send 60 invitations to different external addresses from the test user within 10 minutes.
          expected: Invitations 1 to 50 are accepted; invitations 51 to 60 are refused with a message about the hourly limit.
          data: "60 addresses at example.org"
        - action: Count the captured invitation emails.
          expected: Exactly 50 were sent.
        - action: Open the administrator mailbox.
          expected: A notification names the user and the limit that was reached.
    sv:
      title: En flod av inbjudningar begränsas
      description: Ett skript skickar 60 inbjudningar till externa adresser från en användare inom en timme.
      preconditions: En testanvändare som får bjuda in externa användare; en e-postfångare; en brevlåda för administratören.
      expected: De första 50 inbjudningarna skickas, resten avvisas, och administratören aviseras.
      steps:
        - action: Skicka 60 inbjudningar till olika externa adresser från testanvändaren inom 10 minuter.
          expected: Inbjudningarna 1 till 50 godtas; inbjudningarna 51 till 60 avvisas med ett meddelande om timgränsen.
          data: "60 adresser på example.org"
        - action: Räkna de fångade inbjudningsmeddelandena.
          expected: Exakt 50 skickades.
        - action: Öppna administratörens brevlåda.
          expected: En avisering namnger användaren och gränsen som nåddes.

  - id: MAILS-T09
    priority: medium
    execution: manual
    tags: [dmarc, reporting]
    refs: ["RFC 9990 (DMARC aggregate reporting)", "ISO/IEC 27001:2022 A.5.14", "MITRE ATT&CK T1684.002 (email spoofing)", "MITRE ATT&CK T1566 (phishing)"]
    en:
      title: DMARC aggregate reports are received and read
      description: Checks that aggregate reports reach the report address and that unknown senders in them are followed up.
      preconditions: Access to the DMARC report mailbox or the report analysis tool; the list of services allowed to send for the domain.
      expected: Reports arrive daily from at least two receivers, and each unknown sending source has been investigated.
      steps:
        - action: List the aggregate reports received in the last 7 days.
          expected: Reports from at least two different receivers arrive for each day.
        - action: Compare the sending IP addresses in the reports with the allowed services.
          expected: Each source is an allowed service, or it is marked as investigated with a conclusion.
        - action: Read the share of messages that passed DMARC.
          expected: At least 99 % of the messages from allowed services pass.
          data: "threshold 99 %"
    sv:
      title: Sammanställda DMARC-rapporter tas emot och läses
      description: Kontrollerar att sammanställda rapporter når rapportadressen och att okända avsändare i dem följs upp.
      preconditions: Åtkomst till brevlådan för DMARC-rapporter eller verktyget för analys av rapporter; listan över tjänster som får skicka för domänen.
      expected: Rapporter kommer dagligen från minst två mottagare, och varje okänd avsändarkälla har utretts.
      steps:
        - action: Lista de sammanställda rapporter som tagits emot de senaste 7 dagarna.
          expected: Rapporter från minst två olika mottagare kommer för varje dag.
        - action: Jämför de avsändande IP-adresserna i rapporterna med de tillåtna tjänsterna.
          expected: Varje källa är en tillåten tjänst, eller så är den markerad som utredd med en slutsats.
        - action: Läs andelen meddelanden som klarade DMARC.
          expected: Minst 99 % av meddelandena från tillåtna tjänster klarar kontrollen.
          data: "gränsvärde 99 %"

  - id: MAILS-T10
    priority: high
    execution: manual
    tags: [inbound-email, dmarc]
    refs: ["RFC 9989 §5.3 (mail receiver actions)", "CWE-290 (authentication bypass by spoofing)", "MITRE ATT&CK T1684.002 (email spoofing)"]
    en:
      title: Forged replies do not add comments
      description: Sends a genuine and a forged reply to a notification email.
      preconditions: A test user with a mailbox on a domain with DMARC policy reject, a notification email with a reply address, and an SMTP server the tester controls that is not authorised for that domain.
      expected: Only the genuine reply changes the record.
      steps:
        - action: Reply to the notification from the user's mailbox.
          expected: The reply appears as a comment by the user on the record.
        - action: Send a reply with the user's address in From through the tester's SMTP server.
          expected: The message fails DMARC, no comment is added and the event is logged.
        - action: Send a reply from a valid mailbox of a user without access to the record.
          expected: No comment is added.
    sv:
      title: Förfalskade svar lägger inte till kommentarer
      description: Skickar ett äkta och ett förfalskat svar på ett aviseringsmejl.
      preconditions: En testanvändare med brevlåda på en domän med DMARC-policyn reject, ett aviseringsmejl med svarsadress och en SMTP-server som testaren styr och som inte är behörig för domänen.
      expected: Endast det äkta svaret ändrar posten.
      steps:
        - action: Svara på aviseringen från användarens brevlåda.
          expected: Svaret visas som en kommentar av användaren på posten.
        - action: Skicka ett svar med användarens adress i From via testarens SMTP-server.
          expected: Meddelandet klarar inte DMARC, ingen kommentar läggs till och händelsen loggas.
        - action: Skicka ett svar från en giltig brevlåda för en användare utan åtkomst till posten.
          expected: Ingen kommentar läggs till.

  - id: MAILS-T11
    priority: medium
    execution: automated
    tags: [parked-domains]
    refs: ["RFC 7208", "RFC 9989 (DMARC)", "MITRE ATT&CK T1684.002 (email spoofing)"]
    en:
      title: Non-sending domains publish restrictive records
      description: A script looks up SPF and DMARC records for each registered domain that sends no email.
      preconditions: The list of the organisation's registered domains, marked as sending or not sending.
      expected: Each non-sending domain has "v=spf1 -all" and DMARC p=reject.
      steps:
        - action: Query the TXT record of each non-sending domain.
          expected: Each returns exactly "v=spf1 -all".
        - action: Query the TXT record of _dmarc on each non-sending domain.
          expected: Each returns a DMARC record with p=reject.
    sv:
      title: Domäner som inte skickar e-post publicerar strikta poster
      description: Ett skript slår upp SPF- och DMARC-poster för varje registrerad domän som inte skickar e-post.
      preconditions: Listan över organisationens registrerade domäner, markerade som sändande eller inte sändande.
      expected: Varje domän som inte skickar e-post har "v=spf1 -all" och DMARC p=reject.
      steps:
        - action: Fråga efter TXT-posten för varje domän som inte skickar e-post.
          expected: Var och en returnerar exakt "v=spf1 -all".
        - action: Fråga efter TXT-posten för _dmarc på varje domän som inte skickar e-post.
          expected: Var och en returnerar en DMARC-post med p=reject.

  - id: MAILS-T12
    priority: medium
    execution: manual
    tags: [dmarc-reports]
    refs: ["RFC 9990 (DMARC aggregate reporting)", "MITRE ATT&CK T1684.002 (email spoofing)"]
    en:
      title: DMARC reports are reviewed and acted on
      description: Compares the DMARC aggregate reports of the last 4 weeks with the review log and tickets.
      preconditions: Access to the DMARC report mailbox or tool, the review log and the ticket system.
      expected: Each week was reviewed and each failing source above the threshold has a ticket.
      steps:
        - action: List the review log entries of the last 4 weeks.
          expected: There is one entry per week.
        - action: From the reports, list the sources with more than 10 failing messages in a week.
          expected: Each source has a ticket that names it and a decision.
    sv:
      title: DMARC-rapporter granskas och följs upp
      description: Jämför DMARC-sammanställningarna för de senaste 4 veckorna med granskningsloggen och ärendena.
      preconditions: Åtkomst till brevlådan eller verktyget för DMARC-rapporter, granskningsloggen och ärendesystemet.
      expected: Varje vecka har granskats och varje felande källa över tröskeln har ett ärende.
      steps:
        - action: Lista granskningsloggens poster för de senaste 4 veckorna.
          expected: Det finns en post per vecka.
        - action: Lista utifrån rapporterna de källor som haft mer än 10 felande meddelanden under en vecka.
          expected: Varje källa har ett ärende som namnger den och ett beslut.

  - id: MAILS-T13
    priority: medium
    execution: manual
    tags: [dkim, key-rotation]
    refs: ["RFC 6376", "CWE-324 (use of a key past its expiration date)"]
    en:
      title: DKIM selectors are current and old ones removed
      description: Reads the DKIM selector of recent messages and looks up the previous selector in DNS.
      preconditions: A recent message from each sending domain and the key rotation record with the dates of the last switch.
      expected: Each current key is less than 12 months old and the old key is gone.
      steps:
        - action: Read the s= tag of the DKIM-Signature header in each message and find its creation date in the rotation record.
          expected: Each selector was created less than 12 months ago.
        - action: Look up the previous selector of each domain in DNS.
          expected: No public key is returned.
    sv:
      title: DKIM-selektorer är aktuella och gamla har tagits bort
      description: Läser DKIM-selektorn i nyliga meddelanden och slår upp den föregående selektorn i DNS.
      preconditions: Ett nyligt meddelande från varje sändande domän och registret över nyckelbyten med datum för det senaste bytet.
      expected: Varje aktuell nyckel är yngre än 12 månader och den gamla nyckeln är borta.
      steps:
        - action: Läs taggen s= i huvudet DKIM-Signature i varje meddelande och leta upp dess skapandedatum i registret.
          expected: Varje selektor skapades för mindre än 12 månader sedan.
        - action: Slå upp den föregående selektorn för varje domän i DNS.
          expected: Ingen publik nyckel returneras.

  - id: MAILS-T14
    priority: medium
    execution: automated
    tags: [links]
    refs: ["M3AAWG Sender Best Common Practices", "MITRE ATT&CK T1566.002 (spearphishing link)"]
    en:
      title: Template links stay on the system's domains
      description: A script renders each email template and follows every link without running scripts.
      preconditions: The list of email templates, test data to render them and the list of the system's published domains.
      expected: Every link is HTTPS on a listed domain and does not redirect elsewhere.
      steps:
        - action: Render each template and extract the href of each link.
          expected: Each link starts with https:// and a listed domain.
        - action: Request each link and follow the redirects.
          expected: No redirect leads to a host outside the list.
    sv:
      title: Länkar i mallar stannar på systemets domäner
      description: Ett skript skapar varje e-postmall och följer varje länk utan att köra skript.
      preconditions: Listan över e-postmallar, testdata för att fylla dem och listan över systemets publicerade domäner.
      expected: Varje länk är HTTPS på en listad domän och omdirigerar inte någon annanstans.
      steps:
        - action: Skapa varje mall och plocka ut href för varje länk.
          expected: Varje länk börjar med https:// och en listad domän.
        - action: Anropa varje länk och följ omdirigeringarna.
          expected: Ingen omdirigering leder till en värd utanför listan.

risks:
  - id: MAILS-R01
    category: security
    likelihood: 4
    impact: 3
    tags: [spoofing, phishing]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "ENISA Threat Landscape 2024"]
    mitigated_by: [MAILS-01, MAILS-02, MAILS-03, MAILS-13, MAILS-14]
    attack: [T1684.002, T1566]
    en:
      title: Phishing email sent in the organisation's name
      description: Attackers send email that appears to come from the system's own domain, asking users to sign in or pay. Users trust the sender and give away credentials or money.
      mitigation: Publish SPF, sign with DKIM, enforce a rejecting DMARC policy, declare domains that send no email and review the DMARC reports.
    sv:
      title: Nätfiskemejl skickas i organisationens namn
      description: Angripare skickar e-post som ser ut att komma från systemets egen domän och ber användare logga in eller betala. Användarna litar på avsändaren och lämnar ut inloggningsuppgifter eller pengar.
      mitigation: Publicera SPF, signera med DKIM, tillämpa en DMARC-policy som avvisar, ange domäner som inte skickar e-post och granska DMARC-rapporterna.
  - id: MAILS-R02
    category: security
    likelihood: 3
    impact: 3
    tags: [injection, email-content]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "CWE-93 (CRLF injection)", "CWE-79 (cross-site scripting)"]
    mitigated_by: [MAILS-05, MAILS-06, MAILS-16]
    attack: [T1566.002]
    en:
      title: System email abused to carry attacker content
      description: User input reaches email headers or HTML bodies unencoded, so attackers add recipients, scripts or links to their own sites. Messages from a trusted sender spread phishing or malware.
      mitigation: Prevent header injection, encode user content in HTML email and let links point only to the system's own HTTPS domains.
    sv:
      title: Systemets e-post missbrukas för att bära angriparens innehåll
      description: Användarinmatning når e-postens rubriker eller HTML-innehåll utan kodning, så att angripare lägger till mottagare, skript eller länkar till egna webbplatser. Meddelanden från en betrodd avsändare sprider nätfiske eller skadlig kod.
      mitigation: Förhindra injektion i rubriker, koda användarinnehåll i HTML-e-post och låt länkar bara peka på systemets egna HTTPS-domäner.
  - id: MAILS-R03
    category: privacy
    likelihood: 3
    impact: 3
    tags: [confidentiality, email]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "GDPR Art. 32(1)(a)", "CWE-312 (cleartext storage of sensitive information)"]
    mitigated_by: [MAILS-07, MAILS-04, MAILS-08]
    attack: [T1114, T1557]
    en:
      title: Confidential content exposed in email
      description: Passwords, personal data or long-lived invitation links are sent in email. Messages are forwarded, stored in many mailboxes or read in transit, and the content reaches people it was not meant for.
      mitigation: Send no passwords or confidential content in email, encrypt email in transport and let invitation links work once and expire.
    sv:
      title: Konfidentiellt innehåll röjs i e-post
      description: Lösenord, personuppgifter eller långlivade inbjudningslänkar skickas med e-post. Meddelanden vidarebefordras, lagras i många brevlådor eller läses under överföring och innehållet når personer det inte var avsett för.
      mitigation: Skicka inga lösenord eller konfidentiellt innehåll med e-post, kryptera e-posten under transport och låt inbjudningslänkar fungera en gång och löpa ut.
  - id: MAILS-R04
    category: security
    likelihood: 3
    impact: 4
    tags: [inbound-email, spoofing]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "RFC 9989 §5.3 (mail receiver actions)"]
    mitigated_by: [MAILS-12, MAILS-03]
    attack: [T1684.002]
    en:
      title: Spoofed e-mail changes data in the system
      description: The system accepts replies by e-mail to update tickets or approve requests without checking the sender. An attacker forges a sender address and approves or changes items.
      mitigation: Authenticate inbound e-mail before it changes data and publish a DMARC policy that rejects or quarantines.
    sv:
      title: Förfalskad e-post ändrar data i systemet
      description: Systemet tar emot svar via e-post för att uppdatera ärenden eller godkänna förfrågningar utan att kontrollera avsändaren. En angripare förfalskar en avsändaradress och godkänner eller ändrar objekt.
      mitigation: Autentisera inkommande e-post innan den ändrar data och publicera en DMARC-policy som avvisar eller sätter i karantän.
  - id: MAILS-R05
    category: security
    likelihood: 2
    impact: 4
    tags: [dkim, parked-domains]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "M3AAWG Protecting Parked Domains Best Common Practices", "M3AAWG DKIM Key Rotation Best Common Practices"]
    mitigated_by: [MAILS-13, MAILS-15, MAILS-14]
    attack: [T1584.001, T1684.002]
    en:
      title: Unused domain or old DKIM key used to send convincing fakes
      description: Domains that send no e-mail have no policy saying so, and DKIM keys are never rotated. Attackers send mail that passes checks from domains recipients trust.
      mitigation: State that non-sending domains send no e-mail, rotate DKIM keys every year and review DMARC aggregate reports weekly.
    sv:
      title: Oanvänd domän eller gammal DKIM-nyckel används för trovärdiga förfalskningar
      description: Domäner som inte skickar e-post saknar en policy som säger det, och DKIM-nycklar roteras aldrig. Angripare skickar e-post som klarar kontrollerna från domäner som mottagarna litar på.
      mitigation: Ange att domäner som inte skickar e-post inte gör det, rotera DKIM-nycklar varje år och granska DMARC-rapporterna varje vecka.
