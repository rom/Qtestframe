area: sessions
prefix: SESS
group: security
name: {en: Session management, sv: Sessionshantering}
description:
  en: Session tokens, idle and absolute timeouts, sign-out, cookie attributes, session fixation, concurrent sessions and cross-site request forgery.
  sv: Sessionstoken, tidsgränser för inaktivitet och total längd, utloggning, attribut på kakor, sessionsfixering, samtidiga sessioner och förfalskade anrop mellan webbplatser.

requirements:
  - id: SESS-01
    type: security
    obligation: must
    priority: critical
    tags: [session-token, randomness]
    refs: ["OWASP ASVS 5.0 V7.2.3 (random session tokens)", "OWASP Session Management Cheat Sheet", "NIST SP 800-63B-4 §5.1 (session bindings)", "IEC 62443-3-3 SR 3.8", "IEC 62443-4-2 CR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-330 (use of insufficiently random values)", "CWE-338 (cryptographically weak PRNG)"]
    tests: [SESS-T01]
    en:
      title: Session tokens are unpredictable
      description: The system MUST generate session tokens with at least 128 bits of randomness from a cryptographically secure random number generator.
      rationale: Predictable or short tokens can be guessed, which gives the attacker someone else's signed-in session.
      criteria:
        - method: test
          text: A sample of 10 000 tokens contains no duplicates and passes a statistical randomness test.
        - method: review
          text: The code creates tokens with the platform's cryptographically secure generator and at least 16 random bytes.
    sv:
      title: Sessionstoken går inte att förutsäga
      description: Systemet SKA skapa sessionstoken med minst 128 bitars slumpmässighet från en kryptografiskt säker slumptalsgenerator.
      rationale: Förutsägbara eller korta token kan gissas, vilket ger angriparen någon annans inloggade session.
      criteria:
        - method: test
          text: Ett urval på 10 000 token innehåller inga dubbletter och klarar ett statistiskt slumptest.
        - method: review
          text: Koden skapar token med plattformens kryptografiskt säkra generator och minst 16 slumpmässiga byte.

  - id: SESS-02
    type: security
    obligation: must
    priority: critical
    tags: [session-fixation, login]
    refs: ["OWASP ASVS 5.0 V7.2.4 (new session token at authentication)", "OWASP Web Security Testing Guide WSTG-SESS-03", "IEC 62443-3-3 SR 3.8", "IEC 62443-4-2 CR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-384 (session fixation)"]
    tests: [SESS-T02]
    en:
      title: New session token at sign-in
      description: The system MUST issue a new session token and invalidate the previous one when a user signs in or raises their privilege level.
      rationale: Keeping the token from before sign-in allows session fixation, where the attacker plants a token and waits for the victim to sign in.
      criteria:
        - method: test
          text: The token after sign-in differs from the token before, and the old token gives no access after sign-in.
    sv:
      title: Ny sessionstoken vid inloggning
      description: Systemet SKA utfärda en ny sessionstoken och ogiltigförklara den tidigare när en användare loggar in eller höjer sin behörighetsnivå.
      rationale: Om token från före inloggningen behålls blir sessionsfixering möjlig, där angriparen planterar en token och väntar på att offret loggar in.
      criteria:
        - method: test
          text: Token efter inloggning skiljer sig från token före, och den gamla token ger ingen åtkomst efter inloggningen.

  - id: SESS-03
    type: security
    obligation: must
    priority: high
    tags: [timeout, idle-timeout]
    refs: ["OWASP ASVS 5.0 V7.3.1 (inactivity timeout)", "NIST SP 800-63B-4 §5.2 (reauthentication)", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 2.6", "IEC 62443-4-2 CR 2.6", "CWE-1463 (insufficient session timeout value)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T03]
    en:
      title: Idle session timeout
      description: The system MUST end a session after 30 minutes without any request from the user.
      rationale: An unattended signed-in browser is otherwise open to anyone who passes by.
      criteria:
        - method: test
          text: A request after 29 minutes of inactivity succeeds and a request after 31 minutes of inactivity is redirected to sign-in.
    sv:
      title: Tidsgräns för inaktiv session
      description: Systemet SKA avsluta en session efter 30 minuter utan något anrop från användaren.
      rationale: En obevakad inloggad webbläsare är annars öppen för vem som helst som går förbi.
      criteria:
        - method: test
          text: Ett anrop efter 29 minuters inaktivitet lyckas och ett anrop efter 31 minuters inaktivitet skickas vidare till inloggningen.

  - id: SESS-04
    type: security
    obligation: must
    priority: medium
    tags: [timeout, absolute-timeout]
    refs: ["OWASP ASVS 5.0 V7.3.2 (absolute session lifetime)", "NIST SP 800-63B-4 §5.2 (reauthentication)", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 2.6", "CWE-1463 (insufficient session timeout value)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T04]
    en:
      title: Absolute session lifetime
      description: The system MUST end a session 12 hours after sign-in, even while the user is active.
      rationale: A maximum lifetime limits how long a stolen token can be used.
      criteria:
        - method: test
          text: A session that sends a request every 5 minutes is ended 12 hours after sign-in.
    sv:
      title: Längsta livslängd för en session
      description: Systemet SKA avsluta en session 12 timmar efter inloggningen, även om användaren är aktiv.
      rationale: En högsta livslängd begränsar hur länge en stulen token kan användas.
      criteria:
        - method: test
          text: En session som skickar ett anrop var femte minut avslutas 12 timmar efter inloggningen.

  - id: SESS-05
    type: security
    obligation: must
    priority: high
    tags: [logout]
    refs: ["OWASP ASVS 5.0 V7.4.1 (session termination)", "OWASP Web Security Testing Guide WSTG-SESS-06", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-1465 (improper session invalidation after user logout)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T05]
    en:
      title: Sign-out invalidates the session on the server
      description: The system MUST invalidate the session token on the server when the user signs out.
      rationale: Deleting only the cookie in the browser leaves a copied token valid.
      criteria:
        - method: test
          text: A copy of the session token taken before sign-out is refused with 401 after sign-out.
    sv:
      title: Utloggning ogiltigförklarar sessionen på servern
      description: Systemet SKA ogiltigförklara sessionstoken på servern när användaren loggar ut.
      rationale: Om bara kakan i webbläsaren tas bort fortsätter en kopierad token att gälla.
      criteria:
        - method: test
          text: En kopia av sessionstoken som togs före utloggningen avvisas med 401 efter utloggningen.

  - id: SESS-06
    type: security
    obligation: must
    priority: high
    tags: [cookies, secure-flag, httponly, samesite]
    refs: ["OWASP ASVS 5.0 V3.3 (cookie setup)", "RFC 6265bis", "OWASP Web Security Testing Guide WSTG-SESS-02", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-614 (sensitive cookie without Secure attribute)", "CWE-1004 (sensitive cookie without HttpOnly flag)", "CWE-1275 (sensitive cookie with improper SameSite attribute)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    tests: [SESS-T06]
    en:
      title: Session cookie attributes
      description: The system MUST set the Secure, HttpOnly and SameSite=Lax or SameSite=Strict attributes on every cookie that holds a session token.
      rationale: The attributes keep the token off unencrypted connections, away from scripts and out of most cross-site requests.
      criteria:
        - method: test
          text: The Set-Cookie headers for session cookies contain Secure, HttpOnly and SameSite with the value Lax or Strict.
    sv:
      title: Attribut på sessionskakor
      description: Systemet SKA sätta attributen Secure, HttpOnly och SameSite=Lax eller SameSite=Strict på varje kaka som innehåller en sessionstoken.
      rationale: Attributen håller token borta från okrypterade förbindelser, från skript och från de flesta anrop mellan webbplatser.
      criteria:
        - method: test
          text: Huvudena Set-Cookie för sessionskakor innehåller Secure, HttpOnly och SameSite med värdet Lax eller Strict.

  - id: SESS-07
    type: security
    obligation: must_not
    priority: high
    tags: [session-token, url]
    refs: ["OWASP ASVS 5.0 V14.2.1 (sensitive data not in URLs)", "OWASP Session Management Cheat Sheet", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-598 (use of GET request method with sensitive query strings)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    tests: [SESS-T07]
    en:
      title: Session tokens never appear in URLs
      description: The system MUST NOT put session tokens in URLs, query strings or redirect targets.
      rationale: URLs end up in browser history, proxy logs and Referer headers, where others can read them.
      criteria:
        - method: test
          text: A proxy log of a complete user session shows no session token in any requested URL or Location header.
    sv:
      title: Sessionstoken förekommer aldrig i adresser
      description: Systemet SKA INTE lägga sessionstoken i adresser, frågesträngar eller mål för omdirigeringar.
      rationale: Adresser hamnar i webbläsarens historik, i proxyloggar och i Referer-huvuden, där andra kan läsa dem.
      criteria:
        - method: test
          text: En proxylogg från en hel användarsession visar ingen sessionstoken i någon begärd adress eller i något Location-huvud.

  - id: SESS-08
    type: security
    obligation: must
    priority: critical
    tags: [csrf]
    refs: ["OWASP ASVS 5.0 V3.5.1 (cross-site request forgery)", "OWASP Cross-Site Request Forgery Prevention Cheat Sheet", "OWASP Top 10 2021 A01", "ISO/IEC 27001:2022 A.8.28", "CWE-352 (cross-site request forgery)"]
    tests: [SESS-T08]
    en:
      title: Protection against cross-site request forgery
      description: The system MUST reject a state-changing request authenticated by a cookie when it carries neither a valid anti-forgery token nor an Origin header of the system's own site.
      rationale: Without the check, any web page the victim visits can send changes in the victim's name.
      criteria:
        - method: test
          text: A POST request from a foreign origin with a valid session cookie and no anti-forgery token is rejected with 403.
    sv:
      title: Skydd mot förfalskade anrop mellan webbplatser
      description: Systemet SKA avvisa ett ändrande anrop som autentiseras med en kaka när det varken har en giltig token mot förfalskning eller ett Origin-huvud från systemets egen webbplats.
      rationale: Utan kontrollen kan varje webbsida som offret besöker skicka ändringar i offrets namn.
      criteria:
        - method: test
          text: Ett POST-anrop från en främmande origin med en giltig sessionskaka och utan token mot förfalskning avvisas med 403.

  - id: SESS-09
    type: security
    obligation: should
    priority: medium
    tags: [concurrent-sessions, session-overview]
    refs: ["OWASP ASVS 5.0 V7.5.2 (view and end active sessions)", "ISO/IEC 27001:2022 A.8.5", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T09]
    en:
      title: Users see and end their active sessions
      description: The system SHOULD show users a list of their active sessions with device, location and last activity, and let them end each one.
      rationale: Users can then spot and close a session they do not recognise.
      criteria:
        - method: demonstration
          text: With sessions in two browsers, the user sees both in the list and ending one makes its next request fail with 401.
    sv:
      title: Användare ser och avslutar sina aktiva sessioner
      description: Systemet BÖR visa användare en lista över deras aktiva sessioner med enhet, plats och senaste aktivitet och låta dem avsluta var och en.
      rationale: Användare kan då upptäcka och stänga en session som de inte känner igen.
      criteria:
        - method: demonstration
          text: Med sessioner i två webbläsare ser användaren båda i listan, och när den ena avslutas misslyckas dess nästa anrop med 401.

  - id: SESS-10
    type: security
    obligation: must
    priority: high
    tags: [password-change, session-termination]
    refs: ["OWASP ASVS 5.0 V7.4.3 (end other sessions after a credential change)", "ISO/IEC 27001:2022 A.8.5", "ISO/IEC 27001:2022 A.5.17", "CWE-1466 (improper session invalidation after authentication credential change)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T10]
    en:
      title: Password change ends other sessions
      description: The system MUST end every other session of the account when its password is changed or reset.
      rationale: An attacker who has stolen a session keeps access after the password change if other sessions survive.
      criteria:
        - method: test
          text: After a password change in browser A, the session in browser B is refused with 401 on its next request, and browser A stays signed in.
    sv:
      title: Byte av lösenord avslutar andra sessioner
      description: Systemet SKA avsluta kontots övriga sessioner när dess lösenord byts eller återställs.
      rationale: En angripare som har stulit en session behåller åtkomsten efter lösenordsbytet om de andra sessionerna lever kvar.
      criteria:
        - method: test
          text: Efter ett lösenordsbyte i webbläsare A avvisas sessionen i webbläsare B med 401 vid nästa anrop, och webbläsare A förblir inloggad.

  - id: SESS-11
    type: security
    obligation: may
    priority: low
    tags: [concurrent-sessions, session-limit]
    refs: ["NIST SP 800-53 AC-10", "IEC 62443-3-3 SR 2.7", "IEC 62443-4-2 CR 2.7", "ISO/IEC 27001:2022 A.8.5", "MITRE ATT&CK T1550.004 (web session cookie)"]
    tests: [SESS-T11]
    en:
      title: Limit on concurrent sessions
      description: The system MAY limit each account to 3 concurrent sessions and end the oldest session when a fourth one starts.
      rationale: A limit makes shared or stolen accounts easier to notice.
      criteria:
        - method: test
          text: Signing in from a fourth browser ends the session in the browser that signed in first.
    sv:
      title: Gräns för samtidiga sessioner
      description: Systemet FÅR begränsa varje konto till 3 samtidiga sessioner och avsluta den äldsta sessionen när en fjärde startar.
      rationale: En gräns gör delade eller stulna konton lättare att upptäcka.
      criteria:
        - method: test
          text: En inloggning från en fjärde webbläsare avslutar sessionen i den webbläsare som loggade in först.

  - id: SESS-12
    type: security
    obligation: must
    priority: high
    tags: [re-authentication, sensitive-actions]
    refs: ["OWASP ASVS 5.0 V7.5.3 (authentication before highly sensitive operations)", "NIST SP 800-63B-4 §5.2 (reauthentication)", "ISO/IEC 27001:2022 A.8.5", "CWE-306 (missing authentication for critical function)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    tests: [SESS-T12]
    en:
      title: Recent sign-in before high-impact actions
      description: The system MUST ask the user to authenticate again before deleting an organisation, exporting all its data or granting the administrator role when the last authentication is more than 15 minutes old.
      rationale: A session left open or taken over should not be enough to cause damage that cannot be undone.
      criteria:
        - method: test
          text: Each of the three actions asks for authentication 16 minutes after sign-in and runs without a prompt 5 minutes after sign-in.
          threshold: "15 min since the last authentication"
    sv:
      title: Färsk inloggning före åtgärder med stor påverkan
      description: Systemet SKA be användaren att autentisera sig igen innan en organisation tas bort, alla dess data exporteras eller administratörsrollen tilldelas, när den senaste autentiseringen ligger mer än 15 minuter tillbaka.
      rationale: En session som lämnats öppen eller tagits över ska inte räcka för att orsaka skada som inte går att återställa.
      criteria:
        - method: test
          text: Var och en av de tre åtgärderna ber om autentisering 16 minuter efter inloggningen och körs utan fråga 5 minuter efter inloggningen.
          threshold: "15 min sedan senaste autentiseringen"

  - id: SESS-13
    type: security
    obligation: must
    priority: high
    tags: [revocation, administration, account-lock]
    refs: ["OWASP ASVS 5.0 V7.4.2 (sessions ended when an account is disabled)", "NIST SP 800-53 AC-2", "ISO/IEC 27001:2022 A.5.18", "IEC 62443-3-3 SR 1.3", "CWE-1464 (improper session invalidation)", "MITRE ATT&CK T1078 (valid accounts)"]
    tests: [SESS-T13]
    en:
      title: Disabling an account ends its sessions
      description: The system MUST end every active session of a user account within 60 seconds after an administrator disables the account.
      rationale: An employee who has left, or an account known to be compromised, must lose access at once and not when the session times out.
      criteria:
        - method: test
          text: A request with a session token of the disabled account is refused 60 seconds after the account is disabled.
          threshold: "≤ 60 s"
    sv:
      title: Spärrat konto avslutar sina sessioner
      description: Systemet SKA avsluta varje aktiv session för ett användarkonto inom 60 sekunder efter att en administratör har spärrat kontot.
      rationale: En medarbetare som har slutat, eller ett konto som man vet är komprometterat, ska förlora åtkomsten direkt och inte först när sessionen löper ut.
      criteria:
        - method: test
          text: Ett anrop med en sessionstoken för det spärrade kontot avvisas 60 sekunder efter att kontot spärrades.
          threshold: "≤ 60 s"

  - id: SESS-14
    type: security
    obligation: should
    priority: medium
    tags: [cookies, cookie-prefix]
    refs: ["RFC 6265bis", "OWASP Session Management Cheat Sheet", "ISO/IEC 27001:2022 A.8.5", "CWE-565 (reliance on cookies without validation and integrity checking)"]
    tests: [SESS-T14]
    en:
      title: Session cookie with the __Host- prefix
      description: The system SHOULD name the session cookie with the __Host- prefix, set Path=/ on it and leave out the Domain attribute.
      rationale: The prefix makes the browser refuse a cookie set by a sibling subdomain, which blocks cookie tossing and some session fixation attacks.
      criteria:
        - method: test
          text: The Set-Cookie header of the session cookie has a name starting with __Host-, Path=/, Secure and no Domain attribute.
    sv:
      title: Sessionskaka med prefixet __Host-
      description: Systemet BÖR ge sessionskakan ett namn med prefixet __Host-, sätta Path=/ och utelämna attributet Domain.
      rationale: Prefixet gör att webbläsaren vägrar en kaka som satts av en annan underdomän, vilket stoppar så kallad cookie tossing och vissa angrepp med sessionsfixering.
      criteria:
        - method: test
          text: Set-Cookie-huvudet för sessionskakan har ett namn som börjar med __Host-, Path=/, Secure och inget Domain-attribut.

  - id: SESS-15
    type: security
    obligation: should
    priority: medium
    tags: [logout, browser-storage]
    refs: ["W3C Clear Site Data", "OWASP ASVS 5.0 V14.3.1 (client storage cleared)", "ISO/IEC 27001:2022 A.8.5", "CWE-525 (web browser cache containing sensitive information)"]
    tests: [SESS-T15]
    en:
      title: Browser data cleared at sign-out
      description: The system SHOULD send the Clear-Site-Data header with the directives "cache", "cookies" and "storage" in the response to a sign-out request.
      rationale: Cached pages and local storage can show the previous user's data to the next person on a shared computer.
      criteria:
        - method: test
          text: The sign-out response carries the header with the three directives, and after sign-out the browser's local storage and cache for the site are empty.
    sv:
      title: Webbläsarens data rensas vid utloggning
      description: Systemet BÖR skicka huvudet Clear-Site-Data med direktiven "cache", "cookies" och "storage" i svaret på en begäran om utloggning.
      rationale: Cachade sidor och lokal lagring kan visa föregående användares data för nästa person vid en delad dator.
      criteria:
        - method: test
          text: Svaret på utloggningen har huvudet med de tre direktiven, och efter utloggningen är webbläsarens lokala lagring och cache för webbplatsen tomma.

  - id: SESS-16
    type: usability
    obligation: should
    priority: medium
    tags: [timeout, warning, accessibility]
    refs: ["WCAG 2.2 SC 2.2.1", "OWASP Session Management Cheat Sheet"]
    tests: [SESS-T16]
    en:
      title: Warning before the idle timeout
      description: The system SHOULD warn the user 2 minutes before the idle timeout and keep the session when the user confirms within those 2 minutes.
      rationale: Users who read slowly or use assistive technology otherwise lose unsaved work when the session ends without notice.
      criteria:
        - method: test
          text: A warning with an extend button appears 2 minutes before the timeout, and pressing it keeps the session for another full idle period.
          threshold: "warning ≥ 2 min before timeout"
    sv:
      title: Varning före tidsgränsen för inaktivitet
      description: Systemet BÖR varna användaren 2 minuter före tidsgränsen för inaktivitet och behålla sessionen när användaren bekräftar inom dessa 2 minuter.
      rationale: Användare som läser långsamt eller använder hjälpmedel förlorar annars osparat arbete när sessionen avslutas utan förvarning.
      criteria:
        - method: test
          text: En varning med en knapp för att förlänga visas 2 minuter före tidsgränsen, och ett tryck på knappen behåller sessionen under ytterligare en hel inaktivitetsperiod.
          threshold: "varning ≥ 2 min före tidsgränsen"

tests:
  - id: SESS-T01
    priority: critical
    execution: automated
    tags: [session-token, randomness]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-01", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.3", "IEC 62443-4-2 CR 4.3", "IEC 62443-3-3 SR 3.8", "IEC 62443-4-2 CR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-338 (cryptographically weak PRNG)", "CWE-330 (use of insufficiently random values)"]
    en:
      title: Session tokens are long, unique and random
      description: A script collects session tokens from repeated sign-ins and analyses them.
      preconditions: A test account and a script that can sign in 10 000 times without being throttled in the test environment.
      expected: The tokens have at least 128 bits of entropy and no duplicates.
      steps:
        - action: Sign in 10 000 times and store each session token.
          expected: All 10 000 tokens are stored.
        - action: Check the length and character set of each token.
          expected: Each token encodes at least 16 random bytes.
        - action: Look for duplicates and run a statistical randomness test on the token bytes.
          expected: There are no duplicates and the randomness test passes.
    sv:
      title: Sessionstoken är långa, unika och slumpmässiga
      description: Ett skript samlar in sessionstoken från upprepade inloggningar och analyserar dem.
      preconditions: Ett testkonto och ett skript som kan logga in 10 000 gånger utan att begränsas i testmiljön.
      expected: Token har minst 128 bitars entropi och inga dubbletter.
      steps:
        - action: Logga in 10 000 gånger och spara varje sessionstoken.
          expected: Alla 10 000 token sparas.
        - action: Kontrollera längd och teckenuppsättning för varje token.
          expected: Varje token kodar minst 16 slumpmässiga byte.
        - action: Sök efter dubbletter och kör ett statistiskt slumptest på tokenbytena.
          expected: Det finns inga dubbletter och slumptestet går igenom.

  - id: SESS-T02
    priority: critical
    execution: manual
    tags: [session-fixation]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-03", "IEC 62443-3-3 SR 3.8", "IEC 62443-4-2 CR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-384 (session fixation)"]
    en:
      title: The session token changes at sign-in
      description: Compares the session token before and after sign-in.
      preconditions: A browser with developer tools and a test account.
      expected: Sign-in creates a new token and the old token is useless.
      steps:
        - action: Open the sign-in page and note the value of the session cookie.
          expected: A value is noted, or no session cookie exists yet.
        - action: Sign in and note the session cookie again.
          expected: The value differs from the one noted before.
        - action: Send a request to a signed-in page using the old value.
          expected: The request is treated as not signed in.
    sv:
      title: Sessionstoken byts vid inloggning
      description: Jämför sessionstoken före och efter inloggning.
      preconditions: En webbläsare med utvecklarverktyg och ett testkonto.
      expected: Inloggningen skapar en ny token och den gamla token är oanvändbar.
      steps:
        - action: Öppna inloggningssidan och anteckna värdet på sessionskakan.
          expected: Ett värde antecknas, eller så finns ingen sessionskaka ännu.
        - action: Logga in och anteckna sessionskakan igen.
          expected: Värdet skiljer sig från det som antecknades tidigare.
        - action: Skicka ett anrop till en sida som kräver inloggning med det gamla värdet.
          expected: Anropet behandlas som ej inloggat.

  - id: SESS-T03
    priority: high
    execution: automated
    tags: [timeout, idle-timeout]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-07", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 2.6", "IEC 62443-4-2 CR 2.6", "CWE-1463 (insufficient session timeout value)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: Session ends after 30 minutes of inactivity
      description: A script signs in, waits and sends requests at the edge of the idle timeout.
      preconditions: Two test accounts and a test environment clock the script can advance.
      expected: The session survives 29 minutes of inactivity and ends after 31 minutes.
      steps:
        - action: Sign in with account 1, advance the clock by 29 minutes and request a signed-in page.
          expected: The page is returned.
        - action: Sign in with account 2, advance the clock by 31 minutes and request a signed-in page.
          expected: The response redirects to sign-in or returns 401.
    sv:
      title: Sessionen avslutas efter 30 minuters inaktivitet
      description: Ett skript loggar in, väntar och skickar anrop vid gränsen för tidsgränsen vid inaktivitet.
      preconditions: Två testkonton och en klocka i testmiljön som skriptet kan flytta fram.
      expected: Sessionen klarar 29 minuters inaktivitet och avslutas efter 31 minuter.
      steps:
        - action: Logga in med konto 1, flytta fram klockan 29 minuter och begär en sida som kräver inloggning.
          expected: Sidan returneras.
        - action: Logga in med konto 2, flytta fram klockan 31 minuter och begär en sida som kräver inloggning.
          expected: Svaret skickar vidare till inloggningen eller är 401.

  - id: SESS-T04
    priority: medium
    execution: automated
    tags: [timeout, absolute-timeout]
    refs: ["NIST SP 800-63B-4 §5.2 (reauthentication)", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 2.6", "CWE-1463 (insufficient session timeout value)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: Active session ends after 12 hours
      description: A script keeps a session active and checks that it still ends at the absolute limit.
      preconditions: A test account and a test environment clock the script can advance.
      expected: The session ends 12 hours after sign-in despite activity.
      steps:
        - action: Sign in, then advance the clock in steps of 5 minutes and send a request after each step until 11 hours and 55 minutes have passed.
          expected: Every request succeeds.
        - action: Advance the clock to 12 hours and 1 minute after sign-in and send a request.
          expected: The response redirects to sign-in or returns 401.
    sv:
      title: En aktiv session avslutas efter 12 timmar
      description: Ett skript håller en session aktiv och kontrollerar att den ändå avslutas vid den absoluta gränsen.
      preconditions: Ett testkonto och en klocka i testmiljön som skriptet kan flytta fram.
      expected: Sessionen avslutas 12 timmar efter inloggningen trots aktivitet.
      steps:
        - action: Logga in, flytta sedan fram klockan i steg om 5 minuter och skicka ett anrop efter varje steg tills 11 timmar och 55 minuter har gått.
          expected: Varje anrop lyckas.
        - action: Flytta fram klockan till 12 timmar och 1 minut efter inloggningen och skicka ett anrop.
          expected: Svaret skickar vidare till inloggningen eller är 401.

  - id: SESS-T05
    priority: high
    execution: manual
    tags: [logout]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-06", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-1465 (improper session invalidation after user logout)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: A copied token is useless after sign-out
      description: Replays a session token after the user has signed out.
      preconditions: A signed-in test user and a tool for sending HTTP requests with a chosen cookie.
      expected: The server refuses the old token.
      steps:
        - action: Copy the session cookie value from the browser.
          expected: The value is copied.
        - action: Sign out in the browser.
          expected: The sign-in page is shown.
        - action: Send a request to a signed-in page with the copied cookie value.
          expected: The response is 401 or a redirect to sign-in.
    sv:
      title: En kopierad token är oanvändbar efter utloggning
      description: Återanvänder en sessionstoken efter att användaren har loggat ut.
      preconditions: En inloggad testanvändare och ett verktyg för att skicka HTTP-anrop med en vald kaka.
      expected: Servern avvisar den gamla token.
      steps:
        - action: Kopiera värdet på sessionskakan från webbläsaren.
          expected: Värdet kopieras.
        - action: Logga ut i webbläsaren.
          expected: Inloggningssidan visas.
        - action: Skicka ett anrop till en sida som kräver inloggning med det kopierade kakvärdet.
          expected: Svaret är 401 eller en omdirigering till inloggningen.

  - id: SESS-T06
    priority: high
    execution: automated
    tags: [cookies, secure-flag, httponly, samesite]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-02", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-614 (sensitive cookie without Secure attribute)", "CWE-1004 (sensitive cookie without HttpOnly flag)", "CWE-1275 (sensitive cookie with improper SameSite attribute)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    en:
      title: Session cookies carry the security attributes
      description: A script signs in and inspects every Set-Cookie header in the responses.
      preconditions: A test account and the list of cookie names that hold session tokens.
      expected: Every session cookie has Secure, HttpOnly and SameSite=Lax or Strict.
      steps:
        - action: Sign in over HTTPS and collect all Set-Cookie headers.
          expected: At least one session cookie is set.
        - action: Check the attributes of each session cookie.
          expected: Each has Secure, HttpOnly and SameSite with the value Lax or Strict.
        - action: In a browser console, read document.cookie.
          expected: No session cookie is visible to the script.
    sv:
      title: Sessionskakor har säkerhetsattributen
      description: Ett skript loggar in och granskar varje Set-Cookie-huvud i svaren.
      preconditions: Ett testkonto och listan över namn på kakor som innehåller sessionstoken.
      expected: Varje sessionskaka har Secure, HttpOnly och SameSite=Lax eller Strict.
      steps:
        - action: Logga in över HTTPS och samla in alla Set-Cookie-huvuden.
          expected: Minst en sessionskaka sätts.
        - action: Kontrollera attributen på varje sessionskaka.
          expected: Var och en har Secure, HttpOnly och SameSite med värdet Lax eller Strict.
        - action: Läs document.cookie i webbläsarens konsol.
          expected: Ingen sessionskaka är synlig för skriptet.

  - id: SESS-T07
    priority: high
    execution: automated
    tags: [session-token, url]
    refs: ["OWASP Session Management Cheat Sheet", "IEC 62443-3-3 SR 3.8", "ISO/IEC 27001:2022 A.8.5", "CWE-598 (use of GET request method with sensitive query strings)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    en:
      title: No session token in URLs during a user session
      description: A script records the traffic of a scripted user session and searches all URLs for the token.
      preconditions: A recorded browser session through a proxy that covers sign-in, navigation, a redirect and sign-out.
      expected: The session token appears only in cookies.
      steps:
        - action: Extract the session token value from the recorded cookies.
          expected: The token value is known.
        - action: Search every request URL, query string and Location header in the recording for the token.
          expected: No match is found.
    sv:
      title: Ingen sessionstoken i adresser under en användarsession
      description: Ett skript spelar in trafiken från en skriptad användarsession och söker efter token i alla adresser.
      preconditions: En inspelad webbläsarsession via en proxy som omfattar inloggning, navigering, en omdirigering och utloggning.
      expected: Sessionstoken förekommer bara i kakor.
      steps:
        - action: Hämta sessionstokens värde från de inspelade kakorna.
          expected: Värdet på token är känt.
        - action: Sök efter token i varje begärd adress, frågesträng och Location-huvud i inspelningen.
          expected: Ingen träff hittas.

  - id: SESS-T08
    priority: critical
    execution: automated
    tags: [csrf]
    refs: ["OWASP Web Security Testing Guide WSTG-SESS-05", "ISO/IEC 27001:2022 A.8.28", "CWE-352 (cross-site request forgery)"]
    en:
      title: Forged cross-site requests are rejected
      description: A script sends state-changing requests with a valid session cookie from a foreign origin.
      preconditions: A signed-in test session whose cookie the script can use and a state-changing endpoint such as changing the display name.
      expected: Only requests with a valid anti-forgery token or the system's own origin are accepted.
      steps:
        - action: Send a POST request with the session cookie, Origin set to a foreign site and no anti-forgery token.
          expected: The response is 403 and the display name is unchanged.
          data: "Origin: https://attacker.example"
        - action: Send the same request with an anti-forgery token taken from another session.
          expected: The response is 403.
        - action: Send the request from the system's own page with its valid token.
          expected: The change is saved.
    sv:
      title: Förfalskade anrop mellan webbplatser avvisas
      description: Ett skript skickar ändrande anrop med en giltig sessionskaka från en främmande origin.
      preconditions: En inloggad testsession vars kaka skriptet kan använda och en ändrande endpoint, till exempel byte av visningsnamn.
      expected: Bara anrop med en giltig token mot förfalskning eller systemets egen origin godtas.
      steps:
        - action: Skicka ett POST-anrop med sessionskakan, Origin satt till en främmande webbplats och ingen token mot förfalskning.
          expected: Svaret är 403 och visningsnamnet är oförändrat.
          data: "Origin: https://attacker.example"
        - action: Skicka samma anrop med en token mot förfalskning som tagits från en annan session.
          expected: Svaret är 403.
        - action: Skicka anropet från systemets egen sida med dess giltiga token.
          expected: Ändringen sparas.

  - id: SESS-T09
    priority: medium
    execution: manual
    tags: [concurrent-sessions, session-overview]
    refs: ["OWASP ASVS 5.0 V7.5.2 (view and end active sessions)", "ISO/IEC 27001:2022 A.8.5", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: A user ends one of their sessions from the session list
      description: Checks the list of active sessions and ending a session from it.
      preconditions: The same test user is signed in in two different browsers.
      expected: Both sessions are listed and the chosen one ends.
      steps:
        - action: In browser A, open the list of active sessions.
          expected: Two sessions are listed with device, approximate location and last activity time.
        - action: End the session that belongs to browser B.
          expected: The session disappears from the list.
        - action: Reload a page in browser B.
          expected: Browser B is sent to the sign-in page.
    sv:
      title: En användare avslutar en av sina sessioner från sessionslistan
      description: Kontrollerar listan över aktiva sessioner och att en session kan avslutas därifrån.
      preconditions: Samma testanvändare är inloggad i två olika webbläsare.
      expected: Båda sessionerna visas och den valda avslutas.
      steps:
        - action: Öppna listan över aktiva sessioner i webbläsare A.
          expected: Två sessioner visas med enhet, ungefärlig plats och tid för senaste aktivitet.
        - action: Avsluta sessionen som hör till webbläsare B.
          expected: Sessionen försvinner från listan.
        - action: Ladda om en sida i webbläsare B.
          expected: Webbläsare B skickas till inloggningssidan.

  - id: SESS-T10
    priority: high
    execution: manual
    tags: [password-change, session-termination]
    refs: ["OWASP ASVS 5.0 V7.4.3 (end other sessions after a credential change)", "ISO/IEC 27001:2022 A.8.5", "ISO/IEC 27001:2022 A.5.17", "CWE-1466 (improper session invalidation after authentication credential change)", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: Other sessions end when the password is changed
      description: Changes the password in one browser and checks the session in another.
      preconditions: The same test user is signed in in browsers A and B.
      expected: Browser B is signed out and browser A stays signed in.
      steps:
        - action: Change the password in browser A.
          expected: The change is confirmed and browser A stays signed in.
        - action: Reload a page in browser B.
          expected: Browser B is sent to the sign-in page.
    sv:
      title: Andra sessioner avslutas när lösenordet byts
      description: Byter lösenord i en webbläsare och kontrollerar sessionen i en annan.
      preconditions: Samma testanvändare är inloggad i webbläsare A och B.
      expected: Webbläsare B loggas ut och webbläsare A förblir inloggad.
      steps:
        - action: Byt lösenord i webbläsare A.
          expected: Bytet bekräftas och webbläsare A förblir inloggad.
        - action: Ladda om en sida i webbläsare B.
          expected: Webbläsare B skickas till inloggningssidan.

  - id: SESS-T11
    priority: low
    execution: automated
    tags: [concurrent-sessions, session-limit]
    refs: ["NIST SP 800-53 AC-10", "IEC 62443-3-3 SR 2.7", "IEC 62443-4-2 CR 2.7", "ISO/IEC 27001:2022 A.8.5", "MITRE ATT&CK T1550.004 (web session cookie)"]
    en:
      title: A fourth session ends the oldest one
      description: A script opens four sessions for one account and checks which remain valid.
      preconditions: The concurrent session limit is set to 3 for the test account.
      expected: Only the three most recent sessions remain valid.
      steps:
        - action: Sign in four times in sequence with separate cookie stores and keep each token.
          expected: Four sign-ins succeed.
        - action: Send a request with each of the four tokens.
          expected: The first token is refused with 401 and the other three succeed.
    sv:
      title: En fjärde session avslutar den äldsta
      description: Ett skript öppnar fyra sessioner för ett konto och kontrollerar vilka som fortfarande gäller.
      preconditions: Gränsen för samtidiga sessioner är satt till 3 för testkontot.
      expected: Bara de tre senaste sessionerna gäller.
      steps:
        - action: Logga in fyra gånger i följd med separata lager för kakor och spara varje token.
          expected: Fyra inloggningar lyckas.
        - action: Skicka ett anrop med var och en av de fyra token.
          expected: Den första token avvisas med 401 och de andra tre lyckas.

  - id: SESS-T12
    priority: high
    execution: manual
    tags: [re-authentication]
    refs: ["OWASP ASVS 5.0 V7.5.3 (authentication before highly sensitive operations)", "NIST SP 800-63B-4 §5.2 (reauthentication)", "CWE-306 (missing authentication for critical function)", "MITRE ATT&CK T1539 (steal web session cookie)"]
    en:
      title: High-impact actions ask for a recent sign-in
      description: Checks that deleting an organisation, exporting all data and granting the administrator role need a recent authentication.
      preconditions: An administrator account in a test organisation and a test environment clock that can be advanced.
      expected: The actions run without a prompt shortly after sign-in and ask for authentication when the last sign-in is older than 15 minutes.
      steps:
        - action: Sign in, wait 5 minutes and start an export of all organisation data.
          expected: The export starts without asking for authentication.
        - action: Advance the clock to 16 minutes after sign-in and start the export again.
          expected: The system asks for the password or second factor before the export starts.
        - action: Without authenticating, try to grant the administrator role to another user and to delete the organisation.
          expected: Both actions ask for authentication and nothing changes until it succeeds.
    sv:
      title: Åtgärder med stor påverkan kräver färsk inloggning
      description: Kontrollerar att borttagning av en organisation, export av alla data och tilldelning av administratörsrollen kräver en färsk autentisering.
      preconditions: Ett administratörskonto i en testorganisation och en klocka i testmiljön som kan ställas fram.
      expected: Åtgärderna körs utan fråga kort efter inloggningen och ber om autentisering när den senaste inloggningen är äldre än 15 minuter.
      steps:
        - action: Logga in, vänta 5 minuter och starta en export av alla data i organisationen.
          expected: Exporten startar utan att be om autentisering.
        - action: Ställ fram klockan till 16 minuter efter inloggningen och starta exporten igen.
          expected: Systemet ber om lösenord eller andra faktor innan exporten startar.
        - action: Försök utan att autentisera dig att tilldela administratörsrollen till en annan användare och att ta bort organisationen.
          expected: Båda åtgärderna ber om autentisering och inget ändras förrän den lyckats.

  - id: SESS-T13
    priority: high
    execution: automated
    tags: [revocation, account-lock]
    refs: ["NIST SP 800-53 AC-2", "ISO/IEC 27001:2022 A.5.18", "CWE-1464 (improper session invalidation)", "MITRE ATT&CK T1078 (valid accounts)"]
    en:
      title: Sessions of a disabled account stop working
      description: A script keeps two sessions of an account open while an administrator disables the account.
      preconditions: A test user signed in from two browsers or clients, and an administrator account.
      expected: Both sessions are refused within 60 seconds of disabling the account.
      steps:
        - action: Send a request with each of the two session tokens.
          expected: Both requests succeed.
        - action: Disable the user account as administrator and note the time.
          expected: The account is shown as disabled.
        - action: Repeat the requests every 5 seconds for 90 seconds.
          expected: Both tokens are refused with 401 no later than 60 seconds after the noted time.
    sv:
      title: Sessioner för ett spärrat konto slutar fungera
      description: Ett skript håller två sessioner för ett konto öppna medan en administratör spärrar kontot.
      preconditions: En testanvändare inloggad från två webbläsare eller klienter samt ett administratörskonto.
      expected: Båda sessionerna avvisas inom 60 sekunder efter att kontot spärrats.
      steps:
        - action: Skicka ett anrop med var och en av de två sessionstoken.
          expected: Båda anropen lyckas.
        - action: Spärra användarkontot som administratör och anteckna tiden.
          expected: Kontot visas som spärrat.
        - action: Upprepa anropen var femte sekund i 90 sekunder.
          expected: Båda token avvisas med 401 senast 60 sekunder efter den antecknade tiden.

  - id: SESS-T14
    priority: medium
    execution: automated
    tags: [cookies, cookie-prefix]
    refs: ["RFC 6265bis", "CWE-565 (reliance on cookies without validation and integrity checking)"]
    en:
      title: Session cookie uses the __Host- prefix
      description: Inspects the Set-Cookie header of the session cookie after sign-in.
      preconditions: A test account and an HTTP client that shows response headers.
      expected: The session cookie has the __Host- prefix, Path=/, Secure and no Domain attribute.
      steps:
        - action: Sign in and read the Set-Cookie header that holds the session token.
          expected: The cookie name starts with __Host-.
        - action: Check the attributes of the cookie.
          expected: Path=/ and Secure are present and Domain is absent.
    sv:
      title: Sessionskakan har prefixet __Host-
      description: Granskar Set-Cookie-huvudet för sessionskakan efter inloggning.
      preconditions: Ett testkonto och en HTTP-klient som visar svarshuvuden.
      expected: Sessionskakan har prefixet __Host-, Path=/, Secure och inget Domain-attribut.
      steps:
        - action: Logga in och läs Set-Cookie-huvudet som innehåller sessionstoken.
          expected: Kakans namn börjar med __Host-.
        - action: Kontrollera kakans attribut.
          expected: Path=/ och Secure finns och Domain saknas.

  - id: SESS-T15
    priority: medium
    execution: manual
    tags: [logout, browser-storage]
    refs: ["W3C Clear Site Data", "CWE-525 (web browser cache containing sensitive information)"]
    en:
      title: Sign-out clears the browser's site data
      description: Checks the sign-out response header and the browser storage after sign-out.
      preconditions: A browser with developer tools and a test account whose pages store data in local storage.
      expected: The sign-out response clears cache, cookies and storage for the site.
      steps:
        - action: Sign in, open several pages and note the entries in local storage and the cache.
          expected: Entries for the site exist.
        - action: Sign out and read the headers of the sign-out response.
          expected: Clear-Site-Data contains "cache", "cookies" and "storage".
        - action: Inspect local storage and the cache again, then use the back button.
          expected: The storage is empty and the back button shows no signed-in content.
    sv:
      title: Utloggning rensar webbläsarens data för webbplatsen
      description: Kontrollerar svarshuvudet vid utloggning och webbläsarens lagring efter utloggningen.
      preconditions: En webbläsare med utvecklarverktyg och ett testkonto vars sidor sparar data i lokal lagring.
      expected: Svaret på utloggningen rensar cache, kakor och lagring för webbplatsen.
      steps:
        - action: Logga in, öppna flera sidor och anteckna posterna i lokal lagring och i cachen.
          expected: Det finns poster för webbplatsen.
        - action: Logga ut och läs huvudena i svaret på utloggningen.
          expected: Clear-Site-Data innehåller "cache", "cookies" och "storage".
        - action: Granska lokal lagring och cachen igen och använd sedan bakåtknappen.
          expected: Lagringen är tom och bakåtknappen visar inget inloggat innehåll.

  - id: SESS-T16
    priority: medium
    execution: manual
    tags: [timeout, warning]
    refs: ["WCAG 2.2 SC 2.2.1"]
    en:
      title: Warning shown before the session times out
      description: Waits for the idle timeout warning and extends the session.
      preconditions: A test account and an idle timeout set to 30 minutes in the test environment.
      expected: The warning appears 2 minutes before the timeout and extending it keeps the session.
      steps:
        - action: Sign in, open a form, type some text and leave the browser idle for 28 minutes.
          expected: A warning with an extend button appears and is announced by a screen reader.
        - action: Press the extend button and leave the browser idle for another 29 minutes.
          expected: The session is still active and the typed text is still in the form.
        - action: Leave the browser idle until the next warning and do not respond.
          expected: The session ends 2 minutes after the warning.
    sv:
      title: Varning visas innan sessionen löper ut
      description: Väntar in varningen för inaktivitet och förlänger sessionen.
      preconditions: Ett testkonto och en tidsgräns för inaktivitet på 30 minuter i testmiljön.
      expected: Varningen visas 2 minuter före tidsgränsen och förlängning behåller sessionen.
      steps:
        - action: Logga in, öppna ett formulär, skriv lite text och låt webbläsaren vara inaktiv i 28 minuter.
          expected: En varning med en knapp för att förlänga visas och läses upp av en skärmläsare.
        - action: Tryck på knappen för att förlänga och låt webbläsaren vara inaktiv i ytterligare 29 minuter.
          expected: Sessionen är fortfarande aktiv och den skrivna texten finns kvar i formuläret.
        - action: Låt webbläsaren vara inaktiv tills nästa varning och svara inte.
          expected: Sessionen avslutas 2 minuter efter varningen.
