area: accessibility
prefix: A11Y
group: usability
name: {en: Accessibility, sv: Tillgänglighet}
description:
  en: Keyboard operation, focus, text alternatives, contrast, reflow, structure, forms, screen reader support, motion, captions, time limits, hover content, language of parts, label in name, consistent help and conformance with WCAG 2.2 AA and EN 301 549.
  sv: Tangentbordsstyrning, fokus, textalternativ, kontrast, omflödning, struktur, formulär, stöd för skärmläsare, rörelse, undertexter, tidsgränser, innehåll vid hovring, språk för textavsnitt, etikett i namnet, enhetlig hjälp och överensstämmelse med WCAG 2.2 AA och EN 301 549.

requirements:
  - id: A11Y-01
    type: usability
    obligation: must
    priority: critical
    tags: [keyboard]
    refs: ["WCAG 2.2 SC 2.1.1", "EN 301 549 §9.2.1.1"]
    tests: [A11Y-T01]
    en:
      title: Keyboard operation of every function
      description: The system MUST let a user perform every function that is available with a pointing device by using the keyboard alone.
      rationale: People who are blind, have motor impairments or use switch devices depend on the keyboard interface.
      criteria:
        - method: test
          text: Every main task in the test script is completed with the keyboard only, without a mouse or touch input.
    sv:
      title: Alla funktioner kan styras med tangentbord
      description: Systemet SKA låta användaren utföra varje funktion som finns tillgänglig med pekdon genom att enbart använda tangentbordet.
      rationale: Personer som är blinda, har motoriska funktionsnedsättningar eller använder kontakter är beroende av tangentbordsgränssnittet.
      criteria:
        - method: test
          text: Varje huvuduppgift i testmanuset genomförs enbart med tangentbord, utan mus eller pekskärm.

  - id: A11Y-02
    type: usability
    obligation: must_not
    priority: critical
    tags: [keyboard, focus]
    refs: ["WCAG 2.2 SC 2.1.2", "EN 301 549 §9.2.1.2"]
    tests: [A11Y-T01]
    en:
      title: No keyboard trap
      description: The user interface MUST NOT hold keyboard focus inside a component that the user cannot leave with Tab, Shift+Tab or Escape.
      rationale: A keyboard trap stops a keyboard user from reaching the rest of the page and forces them to reload it.
      criteria:
        - method: test
          text: Focus can be moved into and out of every dialog, menu, editor and embedded component with standard keys.
    sv:
      title: Ingen tangentbordsfälla
      description: Användargränssnittet SKA INTE hålla kvar tangentbordsfokus i en komponent som användaren inte kan lämna med Tab, Skift+Tab eller Esc.
      rationale: En tangentbordsfälla hindrar tangentbordsanvändare från att nå resten av sidan och tvingar dem att ladda om den.
      criteria:
        - method: test
          text: Fokus kan flyttas in i och ut ur varje dialogruta, meny, redigerare och inbäddad komponent med standardtangenter.

  - id: A11Y-03
    type: usability
    obligation: must
    priority: high
    tags: [focus, contrast]
    refs: ["WCAG 2.2 SC 2.4.7", "WCAG 2.2 SC 2.4.11", "WCAG 2.2 SC 1.4.11"]
    tests: [A11Y-T02]
    en:
      title: Visible focus indicator
      description: The user interface MUST show a focus indicator on the focused element with a contrast ratio of at least 3:1 against the adjacent colours.
      rationale: Keyboard users need to see where they are on the page before they can act.
      criteria:
        - method: test
          text: Each interactive element shows a focus indicator when reached with Tab, and the measured contrast is at least 3:1.
          threshold: "≥ 3:1"
    sv:
      title: Synlig fokusmarkering
      description: Användargränssnittet SKA visa en fokusmarkering på elementet i fokus med ett kontrastförhållande på minst 3:1 mot angränsande färger.
      rationale: Tangentbordsanvändare behöver se var de befinner sig på sidan innan de kan agera.
      criteria:
        - method: test
          text: Varje interaktivt element visar en fokusmarkering när det nås med Tab, och den uppmätta kontrasten är minst 3:1.
          threshold: "≥ 3:1"

  - id: A11Y-04
    type: usability
    obligation: must
    priority: high
    tags: [focus, keyboard]
    refs: ["WCAG 2.2 SC 2.4.3", "WCAG 2.2 SC 2.4.11"]
    tests: [A11Y-T02]
    en:
      title: Logical focus order
      description: The user interface MUST move keyboard focus in an order that follows the visual reading order of the page.
      rationale: A focus order that jumps around the page disorients keyboard and screen reader users.
      criteria:
        - method: test
          text: Tabbing through each page visits the elements from top to bottom and left to right, and opened dialogs receive focus first.
    sv:
      title: Logisk fokusordning
      description: Användargränssnittet SKA flytta tangentbordsfokus i en ordning som följer sidans visuella läsordning.
      rationale: En fokusordning som hoppar runt på sidan gör tangentbords- och skärmläsaranvändare desorienterade.
      criteria:
        - method: test
          text: Tabbning genom varje sida besöker elementen uppifrån och ned och från vänster till höger, och öppnade dialogrutor får fokus först.

  - id: A11Y-05
    type: usability
    obligation: must
    priority: high
    tags: [text-alternative, images]
    refs: ["WCAG 2.2 SC 1.1.1", "EN 301 549 §9.1.1.1"]
    tests: [A11Y-T03, A11Y-T04]
    en:
      title: Text alternatives for images
      description: The user interface MUST give each image and icon that carries information a text alternative that conveys the same information.
      rationale: Screen reader users cannot perceive information that is only available as an image.
      criteria:
        - method: test
          text: An automated scan reports no image without a text alternative, and a manual review confirms that the texts match the images.
    sv:
      title: Textalternativ för bilder
      description: Användargränssnittet SKA ge varje bild och ikon som bär information ett textalternativ som förmedlar samma information.
      rationale: Skärmläsaranvändare kan inte uppfatta information som bara finns som bild.
      criteria:
        - method: test
          text: En automatisk skanning visar ingen bild utan textalternativ, och en manuell granskning bekräftar att texterna motsvarar bilderna.

  - id: A11Y-06
    type: usability
    obligation: must
    priority: high
    tags: [contrast]
    refs: ["WCAG 2.2 SC 1.4.3", "EN 301 549 §9.1.4.3"]
    tests: [A11Y-T03]
    en:
      title: Contrast of body text
      description: The user interface MUST display text below 24 CSS pixels with a contrast ratio of at least 4.5:1 against its background.
      rationale: Low contrast makes text unreadable for people with low vision and for everyone in bright light.
      criteria:
        - method: test
          text: An automated contrast check of every page in both colour themes reports no text below 4.5:1.
          threshold: "≥ 4.5:1"
    sv:
      title: Kontrast för brödtext
      description: Användargränssnittet SKA visa text som är mindre än 24 CSS-pixlar med ett kontrastförhållande på minst 4,5:1 mot bakgrunden.
      rationale: Låg kontrast gör text oläslig för personer med nedsatt syn och för alla i starkt ljus.
      criteria:
        - method: test
          text: En automatisk kontrastkontroll av varje sida i båda färgteman visar ingen text under 4,5:1.
          threshold: "≥ 4,5:1"

  - id: A11Y-07
    type: usability
    obligation: must
    priority: high
    tags: [reflow, responsive]
    refs: ["WCAG 2.2 SC 1.4.10", "EN 301 549 §9.1.4.10"]
    tests: [A11Y-T05]
    en:
      title: Reflow at 320 pixels width
      description: The user interface MUST present its content at a viewport width of 320 CSS pixels without horizontal scrolling of the page.
      rationale: People who zoom to 400 % and people on narrow phones need content that reflows into one column.
      criteria:
        - method: test
          text: At 320 CSS pixels width no page needs horizontal scrolling, apart from data tables and diagrams that need two dimensions.
    sv:
      title: Omflödning vid 320 pixlars bredd
      description: Användargränssnittet SKA visa sitt innehåll i ett visningsområde som är 320 CSS-pixlar brett utan att sidan behöver rullas i sidled.
      rationale: Personer som zoomar till 400 % och personer med smala mobiler behöver innehåll som flödar om till en kolumn.
      criteria:
        - method: test
          text: Vid 320 CSS-pixlars bredd behöver ingen sida rullas i sidled, bortsett från datatabeller och diagram som kräver två dimensioner.

  - id: A11Y-08
    type: usability
    obligation: must
    priority: medium
    tags: [resize, zoom]
    refs: ["WCAG 2.2 SC 1.4.4", "WCAG 2.2 SC 1.4.12"]
    tests: [A11Y-T05]
    en:
      title: Text resized to 200 percent
      description: The user interface MUST keep all text and controls visible and operable when the browser text size is increased to 200 %.
      rationale: People with low vision enlarge text and lose information when it is clipped or overlaps.
      criteria:
        - method: test
          text: At 200 % text size no text is clipped, overlapped or hidden, and every control remains operable.
          threshold: "200 %"
    sv:
      title: Text förstorad till 200 procent
      description: Användargränssnittet SKA hålla all text och alla kontroller synliga och användbara när webbläsarens textstorlek ökas till 200 %.
      rationale: Personer med nedsatt syn förstorar texten och förlorar information när den klipps av eller överlappar.
      criteria:
        - method: test
          text: Vid 200 % textstorlek klipps, överlappas eller döljs ingen text, och alla kontroller går att använda.
          threshold: "200 %"

  - id: A11Y-09
    type: usability
    obligation: should
    priority: medium
    tags: [headings, landmarks, structure]
    refs: ["WCAG 2.2 SC 1.3.1", "WCAG 2.2 SC 2.4.1", "WCAG 2.2 SC 2.4.6"]
    tests: [A11Y-T03, A11Y-T06]
    en:
      title: Headings and landmarks
      description: Each page SHOULD contain exactly one level-1 heading, headings without skipped levels and the landmarks header, navigation and main.
      rationale: Screen reader users move through a page by headings and landmarks instead of reading it from the top.
      criteria:
        - method: test
          text: An automated structure check finds one level-1 heading, no skipped heading level and the three landmarks on every page.
    sv:
      title: Rubriker och landmärken
      description: Varje sida BÖR innehålla exakt en rubrik på nivå 1, rubriker utan överhoppade nivåer och landmärkena sidhuvud, navigering och huvudinnehåll.
      rationale: Skärmläsaranvändare tar sig fram på sidan via rubriker och landmärken i stället för att läsa den uppifrån.
      criteria:
        - method: test
          text: En automatisk strukturkontroll hittar en rubrik på nivå 1, ingen överhoppad rubriknivå och de tre landmärkena på varje sida.

  - id: A11Y-10
    type: usability
    obligation: must
    priority: high
    tags: [forms, labels]
    refs: ["WCAG 2.2 SC 1.3.1", "WCAG 2.2 SC 3.3.2", "WCAG 2.2 SC 4.1.2"]
    tests: [A11Y-T03, A11Y-T07]
    en:
      title: Labels for form fields
      description: The user interface MUST give each form field a visible label that is programmatically associated with the field.
      rationale: Without an associated label a screen reader announces only "edit text" and the user cannot tell what to enter.
      criteria:
        - method: test
          text: An automated scan finds no form field without an accessible name, and the accessible name contains the visible label.
    sv:
      title: Etiketter för formulärfält
      description: Användargränssnittet SKA ge varje formulärfält en synlig etikett som är programmatiskt kopplad till fältet.
      rationale: Utan kopplad etikett läser skärmläsaren bara upp "redigera text" och användaren vet inte vad som ska anges.
      criteria:
        - method: test
          text: En automatisk skanning hittar inget formulärfält utan tillgängligt namn, och det tillgängliga namnet innehåller den synliga etiketten.

  - id: A11Y-11
    type: usability
    obligation: must
    priority: high
    tags: [forms, errors]
    refs: ["WCAG 2.2 SC 3.3.1", "WCAG 2.2 SC 3.3.3"]
    tests: [A11Y-T07]
    en:
      title: Form errors identified in text
      description: The user interface MUST name each field with an input error in text and state how the user can correct the value.
      rationale: An error shown only by a red border is lost on users who cannot see colour or the screen.
      criteria:
        - method: test
          text: Submitting a form with invalid values shows a text message per field that names the field and the correction.
    sv:
      title: Formulärfel anges i text
      description: Användargränssnittet SKA ange varje fält med felaktig inmatning i text och tala om hur användaren kan rätta värdet.
      rationale: Ett fel som bara visas med en röd ram når inte användare som inte kan se färger eller skärmen.
      criteria:
        - method: test
          text: När ett formulär skickas med ogiltiga värden visas ett textmeddelande per fält som anger fältet och hur det rättas.

  - id: A11Y-12
    type: usability
    obligation: must
    priority: high
    tags: [screen-reader, status-messages]
    refs: ["WCAG 2.2 SC 4.1.3", "EN 301 549 §9.4.1.3"]
    tests: [A11Y-T08]
    en:
      title: Status messages announced to screen readers
      description: The user interface MUST expose status messages such as "Saved" or "3 results" through a live region without moving the focus.
      rationale: Screen reader users otherwise miss the feedback that sighted users see in a toast or a counter.
      criteria:
        - method: test
          text: With a screen reader running, saving an item and filtering a list are announced while the focus stays in place.
    sv:
      title: Statusmeddelanden läses upp av skärmläsare
      description: Användargränssnittet SKA exponera statusmeddelanden som "Sparat" eller "3 träffar" via en live-region utan att flytta fokus.
      rationale: Annars missar skärmläsaranvändare den återkoppling som seende användare ser i en notis eller räknare.
      criteria:
        - method: test
          text: Med skärmläsare igång läses det upp när ett objekt sparas och när en lista filtreras, medan fokus stannar kvar.

  - id: A11Y-13
    type: usability
    obligation: must
    priority: medium
    tags: [motion, animation]
    refs: ["WCAG 2.2 SC 2.2.2", "WCAG 2.2 SC 2.3.1"]
    tests: [A11Y-T09]
    en:
      title: Pause for moving content
      description: The user interface MUST offer a control to pause or hide any content that starts moving automatically and moves for more than 5 seconds.
      rationale: Moving content distracts people with attention disorders and makes reading impossible for some users.
      criteria:
        - method: test
          text: Each carousel, ticker and looping animation longer than 5 seconds has a pause control that stops it.
          threshold: "5 s"
    sv:
      title: Paus för rörligt innehåll
      description: Användargränssnittet SKA erbjuda en kontroll för att pausa eller dölja innehåll som börjar röra sig automatiskt och rör sig i mer än 5 sekunder.
      rationale: Rörligt innehåll distraherar personer med koncentrationssvårigheter och gör läsning omöjlig för en del användare.
      criteria:
        - method: test
          text: Varje karusell, löpande text och upprepad animering som varar längre än 5 sekunder har en pausknapp som stoppar den.
          threshold: "5 s"

  - id: A11Y-14
    type: usability
    obligation: should
    priority: low
    tags: [motion, preferences]
    refs: ["WCAG 2.2 SC 2.3.3", "Media Queries Level 5 prefers-reduced-motion"]
    tests: [A11Y-T09]
    en:
      title: Reduced motion preference respected
      description: The user interface SHOULD turn off decorative animations and transitions when the operating system setting for reduced motion is on.
      rationale: Animations can trigger dizziness and nausea in people with vestibular disorders.
      criteria:
        - method: test
          text: With reduced motion enabled in the operating system, page transitions and decorative animations do not play.
    sv:
      title: Inställning för minskad rörelse respekteras
      description: Användargränssnittet BÖR stänga av dekorativa animeringar och övergångar när operativsystemets inställning för minskad rörelse är på.
      rationale: Animeringar kan ge yrsel och illamående hos personer med balansrubbningar.
      criteria:
        - method: test
          text: Med minskad rörelse påslagen i operativsystemet spelas inga sidövergångar eller dekorativa animeringar upp.

  - id: A11Y-15
    type: usability
    obligation: must
    priority: medium
    tags: [captions, media]
    refs: ["WCAG 2.2 SC 1.2.2", "WCAG 2.2 SC 1.2.1", "EN 301 549 §9.1.2.2"]
    tests: [A11Y-T10]
    en:
      title: Captions for prerecorded video
      description: The system MUST provide synchronised captions for each prerecorded video that contains speech or other meaningful audio.
      rationale: Deaf and hard-of-hearing users need captions to follow instructional and marketing videos.
      criteria:
        - method: inspection
          text: Every video with audio offers captions that cover speech and relevant sounds and are in sync with the audio.
    sv:
      title: Undertexter för inspelad video
      description: Systemet SKA tillhandahålla synkroniserade undertexter för varje inspelad video som innehåller tal eller annat betydelsebärande ljud.
      rationale: Döva och hörselskadade användare behöver undertexter för att kunna följa instruktions- och informationsfilmer.
      criteria:
        - method: inspection
          text: Varje video med ljud har undertexter som täcker tal och relevanta ljud och är synkroniserade med ljudet.

  - id: A11Y-16
    type: regulatory
    obligation: must
    priority: critical
    tags: [conformance, wcag]
    refs: ["WCAG 2.2 conformance level AA", "EN 301 549 V3.2.1 clause 9", "Lag (2018:1937) om tillgänglighet till digital offentlig service", "Directive (EU) 2016/2102"]
    tests: [A11Y-T11]
    en:
      title: Conformance with WCAG 2.2 level AA
      description: The user interface MUST meet every level A and level AA success criterion of WCAG 2.2.
      rationale: WCAG 2.2 AA is the level required by EN 301 549 and by the Swedish act on accessibility of digital public services.
      criteria:
        - method: review
          text: An accessibility audit of the 10 most used pages and the main flows reports no failed level A or AA success criterion.
    sv:
      title: Överensstämmelse med WCAG 2.2 nivå AA
      description: Användargränssnittet SKA uppfylla varje framgångskriterium på nivå A och nivå AA i WCAG 2.2.
      rationale: WCAG 2.2 AA är den nivå som krävs av EN 301 549 och av lagen om tillgänglighet till digital offentlig service.
      criteria:
        - method: review
          text: En tillgänglighetsgranskning av de 10 mest använda sidorna och huvudflödena visar inget underkänt framgångskriterium på nivå A eller AA.

  - id: A11Y-17
    type: regulatory
    obligation: must
    priority: high
    tags: [accessibility-statement, public-sector]
    refs: ["Lag (2018:1937) om tillgänglighet till digital offentlig service", "DIGG föreskrifter MDFFS 2019:2", "Commission Implementing Decision (EU) 2018/1523"]
    tests: [A11Y-T12]
    en:
      title: Published accessibility statement
      description: The system MUST link to an accessibility statement from every page that lists known shortcomings and a way to report inaccessible content.
      rationale: Public sector bodies in the EU are obliged to publish a statement, and users need a channel to report barriers.
      criteria:
        - method: inspection
          text: Every page links to the statement, and the statement contains the conformance status, known shortcomings, a feedback contact and its last review date.
    sv:
      title: Publicerad tillgänglighetsredogörelse
      description: Systemet SKA länka från varje sida till en tillgänglighetsredogörelse som anger kända brister och ett sätt att anmäla otillgängligt innehåll.
      rationale: Offentliga aktörer är skyldiga att publicera en redogörelse, och användare behöver en kanal för att anmäla hinder.
      criteria:
        - method: inspection
          text: Varje sida länkar till redogörelsen, och redogörelsen innehåller status för överensstämmelse, kända brister, kontaktväg för synpunkter och datum för senaste översyn.

  - id: A11Y-18
    type: usability
    obligation: should
    priority: medium
    tags: [target-size, touch]
    refs: ["WCAG 2.2 SC 2.5.8"]
    tests: [A11Y-T13]
    en:
      title: Minimum target size
      description: Each clickable target SHOULD be at least 24 × 24 CSS pixels or have that much space free of other targets around it.
      rationale: Tiny targets are hard to hit for people with tremor and for everyone on a touch screen.
      criteria:
        - method: test
          text: An automated measurement reports no interactive element smaller than 24 × 24 CSS pixels without the spacing.
          threshold: "≥ 24 × 24 CSS px"
    sv:
      title: Minsta storlek på klickytor
      description: Varje klickbar yta BÖR vara minst 24 × 24 CSS-pixlar eller ha motsvarande avstånd till andra klickytor runt sig.
      rationale: Pyttesmå klickytor är svåra att träffa för personer med darrningar och för alla på pekskärm.
      criteria:
        - method: test
          text: En automatisk mätning visar inget interaktivt element under 24 × 24 CSS-pixlar som saknar avståndet.
          threshold: "≥ 24 × 24 CSS px"

  - id: A11Y-19
    type: usability
    obligation: must
    priority: high
    tags: [timing, session, warning]
    refs: ["WCAG 2.2 SC 2.2.1", "EN 301 549 V3.2.1 §9.2.2.1"]
    tests: [A11Y-T14]
    en:
      title: Warning before a time limit ends
      description: When a session or a task has a time limit, the user interface MUST warn the user at least 2 minutes before the limit ends and offer a single action that extends it at least 10 times.
      rationale: Users who read, type or navigate slowly lose their work when a time limit ends without warning.
      criteria:
        - method: test
          text: With a 30-minute idle limit, a warning appears after 28 minutes, is announced by a screen reader, and pressing "Continue" extends the session; this works 10 times in a row.
          threshold: warning ≥ 2 min before the limit
    sv:
      title: Varning innan en tidsgräns löper ut
      description: När en session eller en uppgift har en tidsgräns SKA användargränssnittet varna användaren minst 2 minuter innan gränsen löper ut och erbjuda en enda handling som förlänger den minst 10 gånger.
      rationale: Användare som läser, skriver eller navigerar långsamt förlorar sitt arbete när en tidsgräns löper ut utan förvarning.
      criteria:
        - method: test
          text: Med en tidsgräns på 30 minuters inaktivitet visas en varning efter 28 minuter som läses upp av en skärmläsare, och "Fortsätt" förlänger sessionen; det fungerar 10 gånger i följd.
          threshold: varning ≥ 2 min före gränsen

  - id: A11Y-20
    type: usability
    obligation: must
    priority: medium
    tags: [tooltips, hover, focus]
    refs: ["WCAG 2.2 SC 1.4.13"]
    tests: [A11Y-T15]
    en:
      title: Content shown on hover or focus can be dismissed and kept
      description: Content that appears on pointer hover or keyboard focus, such as tooltips and pop-overs, MUST close with the Escape key without moving the focus, MUST stay visible while the pointer is over it and MUST stay until the user moves away or dismisses it.
      rationale: Tooltips that cover content or vanish when the pointer moves onto them block users with magnification and low dexterity.
      criteria:
        - method: test
          text: On 5 sampled tooltips, Escape closes each without moving the focus, the pointer can move onto each without it closing, and none closes by itself within 30 seconds.
    sv:
      title: Innehåll som visas vid hovring eller fokus kan stängas och ligger kvar
      description: Innehåll som visas när pekaren hovrar eller tangentbordsfokus hamnar på ett element, till exempel verktygstips och popup-paneler, SKA stängas med Escape utan att fokus flyttas, synas medan pekaren är över det och ligga kvar tills användaren flyttar bort eller stänger det.
      rationale: Verktygstips som täcker innehåll eller försvinner när pekaren flyttas till dem hindrar användare med förstoring och nedsatt finmotorik.
      criteria:
        - method: test
          text: På 5 utvalda verktygstips stänger Escape vart och ett utan att fokus flyttas, pekaren kan flyttas in i vart och ett utan att det stängs, och inget stängs av sig självt inom 30 sekunder.

  - id: A11Y-21
    type: usability
    obligation: must
    priority: medium
    tags: [language, screen-reader]
    refs: ["WCAG 2.2 SC 3.1.1", "WCAG 2.2 SC 3.1.2"]
    tests: [A11Y-T16]
    en:
      title: Language of the page and of passages
      description: Each page MUST declare its interface language in the document's language attribute, and text in another language, such as a requirement written in English shown in a Swedish interface, MUST be marked with its own language attribute.
      rationale: Screen readers choose their pronunciation from the language attribute, and English text read with Swedish rules is hard to understand.
      criteria:
        - method: inspection
          text: An automated check finds the interface language on each page, and a stored item with a known language is marked with that language where it is shown.
    sv:
      title: Språk för sidan och för textavsnitt
      description: Varje sida SKA ange sitt gränssnittsspråk i dokumentets språkattribut, och text på ett annat språk, till exempel ett krav skrivet på engelska som visas i ett svenskt gränssnitt, ska märkas med ett eget språkattribut.
      rationale: Skärmläsare väljer uttal utifrån språkattributet, och engelsk text som läses med svenska uttalsregler är svår att förstå.
      criteria:
        - method: inspection
          text: En automatisk kontroll hittar gränssnittsspråket på varje sida, och en sparad post med känt språk är märkt med det språket där den visas.

  - id: A11Y-22
    type: usability
    obligation: must
    priority: medium
    tags: [label-in-name, speech-input]
    refs: ["WCAG 2.2 SC 2.5.3"]
    tests: [A11Y-T16]
    en:
      title: Visible label included in the accessible name
      description: The accessible name of each control with a visible text label MUST contain that visible text, starting with it.
      rationale: Speech input users activate controls by saying what they see, which fails when the hidden name differs.
      criteria:
        - method: inspection
          text: An automated check of all pages finds no control whose accessible name does not start with its visible label.
          threshold: 0 mismatches
    sv:
      title: Den synliga etiketten ingår i det tillgängliga namnet
      description: Det tillgängliga namnet för varje kontroll med en synlig textetikett SKA innehålla den synliga texten och börja med den.
      rationale: Användare av röststyrning aktiverar kontroller genom att säga det de ser, vilket misslyckas när det dolda namnet är ett annat.
      criteria:
        - method: inspection
          text: En automatisk kontroll av alla sidor hittar ingen kontroll vars tillgängliga namn inte börjar med dess synliga etikett.
          threshold: 0 avvikelser

  - id: A11Y-23
    type: usability
    obligation: should
    priority: low
    tags: [consistent-help, navigation]
    refs: ["WCAG 2.2 SC 3.2.6"]
    tests: [A11Y-T17]
    en:
      title: Help in the same place on each page
      description: Links to help, contact details and support SHOULD appear in the same relative position on each page where they are offered.
      rationale: Users who need help find it without searching each page anew.
      criteria:
        - method: inspection
          text: On 10 sampled pages the help and support links are in the same region and in the same order.
    sv:
      title: Hjälp på samma ställe på varje sida
      description: Länkar till hjälp, kontaktuppgifter och support BÖR finnas på samma relativa plats på varje sida där de erbjuds.
      rationale: Användare som behöver hjälp hittar den utan att leta på varje sida på nytt.
      criteria:
        - method: inspection
          text: På 10 utvalda sidor finns hjälp- och supportlänkarna i samma område och i samma ordning.

  - id: A11Y-24
    type: usability
    obligation: must
    priority: high
    tags: [contrast, controls, graphics]
    refs: ["WCAG 2.2 SC 1.4.11", "EN 301 549 V3.2.1 clause 9"]
    tests: [A11Y-T18]
    en:
      title: Contrast of controls and graphics
      description: Borders of input fields, focus indicators, icons that carry meaning and chart lines MUST have a contrast ratio of at least 3:1 against the adjacent colours.
      rationale: People with low vision cannot find a text field or read a chart whose edges fade into the background.
      criteria:
        - method: test
          text: A contrast check of the input borders, meaningful icons and chart lines on the 5 main pages finds no value below 3:1.
          threshold: "≥ 3:1"
    sv:
      title: Kontrast för kontroller och grafik
      description: Kanter på inmatningsfält, fokusmarkeringar, ikoner som bär betydelse och linjer i diagram SKA ha ett kontrastförhållande på minst 3:1 mot angränsande färger.
      rationale: Personer med nedsatt syn hittar inte ett textfält och kan inte läsa ett diagram vars kanter smälter in i bakgrunden.
      criteria:
        - method: test
          text: En kontrastkontroll av fältkanter, betydelsebärande ikoner och diagramlinjer på de 5 viktigaste sidorna hittar inget värde under 3:1.
          threshold: "≥ 3:1"

  - id: A11Y-25
    type: usability
    obligation: must
    priority: medium
    tags: [text-spacing, css, overrides]
    refs: ["WCAG 2.2 SC 1.4.12", "EN 301 549 V3.2.1 clause 9"]
    tests: [A11Y-T19]
    en:
      title: Content survives increased text spacing
      description: The pages MUST show all text and functions without overlap or clipping when line height is set to 1.5, paragraph spacing to 2, letter spacing to 0.12 and word spacing to 0.16 times the font size.
      rationale: Readers with dyslexia or low vision often override spacing, and fixed-height boxes then hide text or buttons.
      criteria:
        - method: test
          text: With a text spacing style sheet applied, the 5 main pages show no clipped or overlapping text or controls.
          threshold: "0 clipped elements"
    sv:
      title: Innehållet tål ökat textavstånd
      description: Sidorna SKA visa all text och alla funktioner utan överlappning eller avklippning när radhöjden sätts till 1,5, styckeavståndet till 2, teckenavståndet till 0,12 och ordavståndet till 0,16 gånger teckenstorleken.
      rationale: Läsare med dyslexi eller nedsatt syn ändrar ofta avstånden, och rutor med fast höjd döljer då text eller knappar.
      criteria:
        - method: test
          text: Med en stilmall för textavstånd påslagen visar de 5 viktigaste sidorna ingen avklippt eller överlappande text eller kontroll.
          threshold: "0 avklippta element"

  - id: A11Y-26
    type: usability
    obligation: must
    priority: medium
    tags: [consistency, labels, icons]
    refs: ["WCAG 2.2 SC 3.2.4", "ISO 9241-110:2020 conformity with user expectations"]
    tests: [A11Y-T20]
    en:
      title: Same function, same name and icon
      description: Components that have the same function on different pages MUST have the same visible label, accessible name and icon.
      rationale: Users of screen readers and people with cognitive disabilities recognise functions by their name, and different names for the same action make them doubt what will happen.
      criteria:
        - method: inspection
          text: A review of the save, delete, search and close controls on 10 pages finds the same label, accessible name and icon for each function.
          threshold: "0 inconsistencies"
    sv:
      title: Samma funktion, samma namn och ikon
      description: Komponenter som har samma funktion på olika sidor SKA ha samma synliga etikett, tillgängliga namn och ikon.
      rationale: Skärmläsaranvändare och personer med kognitiva funktionsnedsättningar känner igen funktioner på namnet, och olika namn för samma åtgärd gör dem osäkra på vad som händer.
      criteria:
        - method: inspection
          text: En granskning av kontrollerna för spara, radera, sök och stäng på 10 sidor visar samma etikett, tillgängliga namn och ikon för varje funktion.
          threshold: "0 avvikelser"

  - id: A11Y-27
    type: usability
    obligation: must
    priority: high
    tags: [aria, custom-controls, screen-reader]
    refs: ["WCAG 2.2 SC 4.1.2", "EN 301 549 V3.2.1 clause 9"]
    tests: [A11Y-T21]
    en:
      title: Name, role and state of custom controls
      description: Each custom control such as a menu button, tab, combo box or tree MUST expose its name, role and current state to assistive technology and update the state when it changes.
      rationale: A control that looks like a tab but is announced as plain text cannot be found or operated with a screen reader.
      criteria:
        - method: test
          text: A screen reader announces name, role and state of each custom control on the main pages, and the state change after activation.
          threshold: "100 % of custom controls"
    sv:
      title: Namn, roll och tillstånd för egna kontroller
      description: Varje egenbyggd kontroll som en menyknapp, flik, kombinationsruta eller trädvy SKA exponera sitt namn, sin roll och sitt aktuella tillstånd för hjälpmedel och uppdatera tillståndet när det ändras.
      rationale: En kontroll som ser ut som en flik men läses upp som vanlig text går inte att hitta eller använda med skärmläsare.
      criteria:
        - method: test
          text: En skärmläsare läser upp namn, roll och tillstånd för varje egenbyggd kontroll på huvudsidorna, och tillståndsändringen efter aktivering.
          threshold: "100 % av de egna kontrollerna"

  - id: A11Y-28
    type: usability
    obligation: should
    priority: medium
    tags: [pdf, documents, export]
    refs: ["ISO 14289-1:2014 (PDF/UA)", "EN 301 549 V3.2.1 clause 10"]
    tests: [A11Y-T22]
    en:
      title: Accessible PDF exports
      description: PDF files generated by the system SHOULD be tagged according to PDF/UA, with headings, reading order, table headers and the document language set.
      rationale: Reports and exports are shared outside the system, and an untagged PDF is a picture of text for a screen reader user.
      criteria:
        - method: test
          text: A generated report passes a PDF/UA checker without errors and reads in the right order with a screen reader.
          threshold: "0 PDF/UA errors"
    sv:
      title: Tillgängliga PDF-exporter
      description: PDF-filer som systemet skapar BÖR vara taggade enligt PDF/UA, med rubriker, läsordning, tabellrubriker och dokumentets språk angivet.
      rationale: Rapporter och exporter delas utanför systemet, och en otaggad PDF är en bild av text för den som använder skärmläsare.
      criteria:
        - method: test
          text: En skapad rapport klarar en PDF/UA-kontroll utan fel och läses i rätt ordning med skärmläsare.
          threshold: "0 PDF/UA-fel"

  - id: A11Y-29
    type: regulatory
    obligation: must
    priority: medium
    tags: [european-accessibility-act, terms, information]
    refs: ["Directive (EU) 2019/882 (EAA) Art. 13(2) (information on how services meet the accessibility requirements)", "Directive (EU) 2019/882 (EAA) Annex V"]
    tests: [A11Y-T23]
    en:
      title: Accessibility information for consumer services
      description: For a service offered to consumers, the supplier MUST publish in its general terms, or in another clearly linked place, how the service meets the accessibility requirements that apply to it.
      rationale: The European Accessibility Act makes this information a condition for consumer services, and users need it before they choose a service.
      criteria:
        - method: inspection
          text: The terms or a page linked from them describe the accessibility features of the service and name the requirements it meets.
          threshold: "1 published statement per consumer service"
    sv:
      title: Information om tillgänglighet för konsumenttjänster
      description: För en tjänst som erbjuds konsumenter SKA leverantören i sina allmänna villkor, eller på ett annat tydligt länkat ställe, publicera hur tjänsten uppfyller de tillgänglighetskrav som gäller för den.
      rationale: Tillgänglighetsdirektivet gör denna information till ett villkor för konsumenttjänster, och användarna behöver den innan de väljer tjänst.
      criteria:
        - method: inspection
          text: Villkoren eller en sida som länkas från dem redogör för tjänstens tillgänglighetsfunktioner och anger vilka krav den uppfyller.
          threshold: "1 publicerad redogörelse per konsumenttjänst"

tests:
  - id: A11Y-T01
    priority: critical
    execution: manual
    tags: [keyboard]
    refs: ["WCAG 2.2 SC 2.1.1", "WCAG 2.2 SC 2.1.2"]
    en:
      title: Main tasks completed with the keyboard only
      description: Checks that the main tasks can be done without a pointing device and that focus never gets stuck.
      preconditions: A signed-in user, a desktop browser and the mouse or touchpad disconnected or not used.
      expected: All main tasks are completed with the keyboard and no component traps the focus.
      steps:
        - action: Starting on the start page, create, edit and save an item using only Tab, Shift+Tab, Enter, Space and the arrow keys.
          expected: Every control in the flow is reached and activated, and the item is saved.
        - action: Open a dialog, a dropdown menu and a rich text editor, then try to leave each with Tab, Shift+Tab and Escape.
          expected: Focus leaves each component and returns to a logical place on the page.
        - action: Sign out using the keyboard.
          expected: The user is signed out without needing the mouse.
    sv:
      title: Huvuduppgifter genomförs enbart med tangentbord
      description: Kontrollerar att huvuduppgifterna går att utföra utan pekdon och att fokus aldrig fastnar.
      preconditions: En inloggad användare, en webbläsare på dator och att mus eller styrplatta inte används.
      expected: Alla huvuduppgifter genomförs med tangentbord och ingen komponent håller kvar fokus.
      steps:
        - action: Börja på startsidan och skapa, redigera och spara ett objekt med enbart Tab, Skift+Tab, Retur, mellanslag och piltangenterna.
          expected: Varje kontroll i flödet nås och aktiveras, och objektet sparas.
        - action: Öppna en dialogruta, en rullgardinsmeny och en textredigerare och försök lämna var och en med Tab, Skift+Tab och Esc.
          expected: Fokus lämnar varje komponent och återgår till en logisk plats på sidan.
        - action: Logga ut med tangentbordet.
          expected: Användaren loggas ut utan att musen behövs.

  - id: A11Y-T02
    priority: high
    execution: manual
    tags: [focus]
    refs: ["WCAG 2.2 SC 2.4.3", "WCAG 2.2 SC 2.4.7"]
    en:
      title: Focus indicator and focus order
      description: Checks that the focus is always visible with enough contrast and moves in reading order.
      preconditions: A signed-in user, a desktop browser and a colour contrast analyser.
      expected: The focus is visible on every element with at least 3:1 contrast and follows the reading order.
      steps:
        - action: Press Tab repeatedly through the start page, a list page and a form page.
          expected: A visible indicator marks each focused element and the order follows the visual layout.
        - action: Measure the contrast between the focus indicator and the adjacent background on 5 different element types.
          expected: Each measured contrast ratio is at least 3:1.
          data: button, link, text field, checkbox, tab
        - action: Open a dialog and close it again with Escape.
          expected: Focus moves into the dialog on opening and returns to the control that opened it on closing.
    sv:
      title: Fokusmarkering och fokusordning
      description: Kontrollerar att fokus alltid syns med tillräcklig kontrast och flyttas i läsordning.
      preconditions: En inloggad användare, en webbläsare på dator och ett verktyg för kontrastmätning.
      expected: Fokus syns på varje element med minst 3:1 i kontrast och följer läsordningen.
      steps:
        - action: Tryck på Tab upprepade gånger genom startsidan, en listsida och en formulärsida.
          expected: En synlig markering visar varje element i fokus och ordningen följer den visuella layouten.
        - action: Mät kontrasten mellan fokusmarkeringen och den angränsande bakgrunden på 5 olika typer av element.
          expected: Varje uppmätt kontrastförhållande är minst 3:1.
          data: knapp, länk, textfält, kryssruta, flik
        - action: Öppna en dialogruta och stäng den igen med Esc.
          expected: Fokus flyttas in i dialogrutan när den öppnas och tillbaka till kontrollen som öppnade den när den stängs.

  - id: A11Y-T03
    priority: high
    execution: automated
    tags: [axe, scan]
    refs: ["WCAG 2.2 SC 1.1.1", "WCAG 2.2 SC 1.4.3", "WCAG 2.2 SC 4.1.2"]
    en:
      title: Automated accessibility scan of all pages
      description: A script opens every page in both colour themes and runs an axe-core scan with the WCAG 2.2 A and AA rule tags.
      preconditions: A test environment with seeded data and a browser automation tool with axe-core installed.
      expected: The scan reports no violation of the rules for text alternatives, contrast, labels, names and roles.
      steps:
        - action: The script signs in, visits each route of the application in the light theme and runs the scan.
          expected: The scan reports zero violations with impact serious or critical.
          data: "rule tags: wcag2a, wcag2aa, wcag21aa, wcag22aa"
        - action: The script switches to the dark theme and repeats the scan.
          expected: The scan reports zero colour-contrast violations.
        - action: The script stores the scan report as a build artefact and fails the build on any violation.
          expected: The build passes and the report lists the pages scanned.
    sv:
      title: Automatisk tillgänglighetsskanning av alla sidor
      description: Ett skript öppnar varje sida i båda färgteman och kör en axe-core-skanning med regeltaggarna för WCAG 2.2 A och AA.
      preconditions: En testmiljö med testdata och ett verktyg för webbläsarautomatisering med axe-core installerat.
      expected: Skanningen visar inga överträdelser av reglerna för textalternativ, kontrast, etiketter, namn och roller.
      steps:
        - action: Skriptet loggar in, besöker varje vy i applikationen i det ljusa temat och kör skanningen.
          expected: Skanningen visar noll överträdelser med allvarlighetsgrad serious eller critical.
          data: "regeltaggar: wcag2a, wcag2aa, wcag21aa, wcag22aa"
        - action: Skriptet byter till det mörka temat och upprepar skanningen.
          expected: Skanningen visar noll kontrastöverträdelser.
        - action: Skriptet sparar skanningsrapporten som byggartefakt och låter bygget fallera vid överträdelser.
          expected: Bygget går igenom och rapporten listar de skannade sidorna.

  - id: A11Y-T04
    priority: medium
    execution: manual
    tags: [screen-reader, images]
    refs: ["WCAG 2.2 SC 1.1.1"]
    en:
      title: Text alternatives checked with a screen reader
      description: Checks that the text alternatives of images and icons convey their meaning and that decorative images are skipped.
      preconditions: A screen reader (NVDA, JAWS or VoiceOver) with a supported browser.
      expected: Each informative image is announced with a matching text and decorative images are not announced.
      steps:
        - action: Move through the start page and a page with charts using the screen reader's graphics navigation.
          expected: Each informative image and chart is announced with a text that conveys its content.
        - action: Move to each icon-only button in the toolbar.
          expected: Each button is announced with its function, for example "Delete" or "Edit".
        - action: Move past decorative images and separators.
          expected: Decorative images are not announced.
    sv:
      title: Textalternativ kontrolleras med skärmläsare
      description: Kontrollerar att textalternativen för bilder och ikoner förmedlar betydelsen och att dekorativa bilder hoppas över.
      preconditions: En skärmläsare (NVDA, JAWS eller VoiceOver) med en webbläsare som stöds.
      expected: Varje informativ bild läses upp med en text som motsvarar den och dekorativa bilder läses inte upp.
      steps:
        - action: Gå igenom startsidan och en sida med diagram med skärmläsarens navigering för grafik.
          expected: Varje informativ bild och varje diagram läses upp med en text som förmedlar innehållet.
        - action: Gå till varje knapp i verktygsfältet som bara har en ikon.
          expected: Varje knapp läses upp med sin funktion, till exempel "Ta bort" eller "Redigera".
        - action: Gå förbi dekorativa bilder och avdelare.
          expected: Dekorativa bilder läses inte upp.

  - id: A11Y-T05
    priority: high
    execution: manual
    tags: [reflow, zoom]
    refs: ["WCAG 2.2 SC 1.4.4", "WCAG 2.2 SC 1.4.10"]
    en:
      title: Reflow at 320 pixels and text at 200 percent
      description: Checks that content reflows to a narrow viewport and survives enlarged text.
      preconditions: A desktop browser with a window width of 1280 CSS pixels and a signed-in user.
      expected: No page needs horizontal scrolling at 320 pixels and no text is lost at 200 % text size.
      steps:
        - action: Zoom the browser to 400 % (equal to 320 CSS pixels width) and visit the start page, a list page and a form.
          expected: The content reflows into one column and the page does not scroll horizontally.
          data: 1280 px / 400 % = 320 CSS px
        - action: Reset the zoom and set the browser text size to 200 %.
          expected: All text is visible and no text overlaps or is cut off.
        - action: Complete a form at 200 % text size.
          expected: Every field, button and message can be read and used.
    sv:
      title: Omflödning vid 320 pixlar och text på 200 procent
      description: Kontrollerar att innehållet flödar om i ett smalt visningsområde och klarar förstorad text.
      preconditions: En webbläsare på dator med fönsterbredden 1280 CSS-pixlar och en inloggad användare.
      expected: Ingen sida behöver rullas i sidled vid 320 pixlar och ingen text går förlorad vid 200 % textstorlek.
      steps:
        - action: Zooma webbläsaren till 400 % (motsvarar 320 CSS-pixlars bredd) och besök startsidan, en listsida och ett formulär.
          expected: Innehållet flödar om till en kolumn och sidan rullar inte i sidled.
          data: 1280 px / 400 % = 320 CSS px
        - action: Återställ zoomen och ställ in webbläsarens textstorlek på 200 %.
          expected: All text syns och ingen text överlappar eller klipps av.
        - action: Fyll i ett formulär med 200 % textstorlek.
          expected: Varje fält, knapp och meddelande går att läsa och använda.

  - id: A11Y-T06
    priority: medium
    execution: automated
    tags: [headings, landmarks]
    refs: ["WCAG 2.2 SC 1.3.1", "WCAG 2.2 SC 2.4.1"]
    en:
      title: Heading levels and landmarks on every page
      description: A script reads the accessibility tree of each page and checks the heading outline and landmarks.
      preconditions: A test environment with seeded data and a browser automation tool.
      expected: Every page has one level-1 heading, no skipped heading level and the header, navigation and main landmarks.
      steps:
        - action: The script visits each route and counts the level-1 headings.
          expected: Each page has exactly one level-1 heading.
        - action: The script walks the heading outline in document order.
          expected: No heading is more than one level deeper than the previous heading.
        - action: The script lists the landmark roles on each page.
          expected: Each page has banner, navigation and main landmarks, and main occurs once.
    sv:
      title: Rubriknivåer och landmärken på varje sida
      description: Ett skript läser tillgänglighetsträdet för varje sida och kontrollerar rubrikstrukturen och landmärkena.
      preconditions: En testmiljö med testdata och ett verktyg för webbläsarautomatisering.
      expected: Varje sida har en rubrik på nivå 1, ingen överhoppad rubriknivå och landmärkena sidhuvud, navigering och huvudinnehåll.
      steps:
        - action: Skriptet besöker varje vy och räknar rubrikerna på nivå 1.
          expected: Varje sida har exakt en rubrik på nivå 1.
        - action: Skriptet går igenom rubrikstrukturen i dokumentordning.
          expected: Ingen rubrik ligger mer än en nivå djupare än föregående rubrik.
        - action: Skriptet listar landmärkesrollerna på varje sida.
          expected: Varje sida har landmärkena banner, navigation och main, och main förekommer en gång.

  - id: A11Y-T07
    priority: high
    execution: manual
    tags: [forms, errors, screen-reader]
    refs: ["WCAG 2.2 SC 3.3.1", "WCAG 2.2 SC 3.3.2"]
    en:
      title: Form labels and error messages with a screen reader
      description: Checks that fields are announced with their labels and that validation errors are given in text.
      preconditions: A screen reader with a supported browser and a form with at least one mandatory field and one e-mail field.
      expected: Every field is announced with its label and each error names the field and the correction.
      steps:
        - action: Tab through the form with the screen reader running.
          expected: Each field is announced with its visible label, its type and whether it is mandatory.
        - action: Leave the mandatory field empty, enter an invalid e-mail address and submit.
          expected: A text message appears next to each invalid field and states how to correct it.
          data: name@example
        - action: Move focus to the invalid e-mail field.
          expected: The screen reader announces the field as invalid together with the error message.
    sv:
      title: Etiketter och felmeddelanden i formulär med skärmläsare
      description: Kontrollerar att fält läses upp med sina etiketter och att valideringsfel anges i text.
      preconditions: En skärmläsare med en webbläsare som stöds och ett formulär med minst ett tvingande fält och ett e-postfält.
      expected: Varje fält läses upp med sin etikett och varje fel anger fältet och hur det rättas.
      steps:
        - action: Tabba genom formuläret med skärmläsaren igång.
          expected: Varje fält läses upp med sin synliga etikett, sin typ och om det är tvingande.
        - action: Lämna det tvingande fältet tomt, ange en ogiltig e-postadress och skicka formuläret.
          expected: Ett textmeddelande visas vid varje ogiltigt fält och anger hur det rättas.
          data: name@example
        - action: Flytta fokus till det ogiltiga e-postfältet.
          expected: Skärmläsaren läser upp fältet som ogiltigt tillsammans med felmeddelandet.

  - id: A11Y-T08
    priority: medium
    execution: manual
    tags: [screen-reader, status-messages]
    refs: ["WCAG 2.2 SC 4.1.3"]
    en:
      title: Status messages are announced
      description: Checks that confirmations and result counts are spoken by a screen reader without a change of focus.
      preconditions: A screen reader with a supported browser and a list with at least 10 items.
      expected: Status messages are announced and the focus does not move.
      steps:
        - action: Edit an item and save it with the keyboard.
          expected: The screen reader announces the save confirmation and the focus stays on the save button or the form.
        - action: Type a filter text into the list's filter field.
          expected: The screen reader announces the new number of results while the focus stays in the filter field.
          data: "test"
    sv:
      title: Statusmeddelanden läses upp
      description: Kontrollerar att bekräftelser och antal träffar läses upp av skärmläsaren utan att fokus flyttas.
      preconditions: En skärmläsare med en webbläsare som stöds och en lista med minst 10 objekt.
      expected: Statusmeddelanden läses upp och fokus flyttas inte.
      steps:
        - action: Redigera ett objekt och spara det med tangentbordet.
          expected: Skärmläsaren läser upp bekräftelsen och fokus stannar på spara-knappen eller i formuläret.
        - action: Skriv en filtertext i listans filterfält.
          expected: Skärmläsaren läser upp det nya antalet träffar medan fokus stannar i filterfältet.
          data: "test"

  - id: A11Y-T09
    priority: medium
    execution: manual
    tags: [motion]
    refs: ["WCAG 2.2 SC 2.2.2", "WCAG 2.2 SC 2.3.3"]
    en:
      title: Moving content can be paused and reduced
      description: Checks the pause control for moving content and the reduced motion preference.
      preconditions: A page with a carousel or looping animation and access to the operating system's display settings.
      expected: Moving content can be paused, and decorative motion stops when reduced motion is set.
      steps:
        - action: Open the page with the moving content and wait 5 seconds.
          expected: A pause control is visible and reachable with the keyboard.
        - action: Activate the pause control.
          expected: The movement stops and stays stopped.
        - action: Turn on reduced motion in the operating system and reload the page.
          expected: Decorative animations and page transitions do not play.
    sv:
      title: Rörligt innehåll kan pausas och dämpas
      description: Kontrollerar pausknappen för rörligt innehåll och inställningen för minskad rörelse.
      preconditions: En sida med en karusell eller upprepad animering och tillgång till operativsystemets skärminställningar.
      expected: Rörligt innehåll kan pausas, och dekorativ rörelse upphör när minskad rörelse är inställt.
      steps:
        - action: Öppna sidan med det rörliga innehållet och vänta 5 sekunder.
          expected: En pausknapp syns och kan nås med tangentbordet.
        - action: Aktivera pausknappen.
          expected: Rörelsen stannar och förblir stillastående.
        - action: Slå på minskad rörelse i operativsystemet och ladda om sidan.
          expected: Inga dekorativa animeringar eller sidövergångar spelas upp.

  - id: A11Y-T10
    priority: medium
    execution: manual
    tags: [captions, media]
    refs: ["WCAG 2.2 SC 1.2.2"]
    en:
      title: Captions on prerecorded videos
      description: Checks that every video with audio has accurate and synchronised captions.
      preconditions: A list of all videos published in the system.
      expected: Every video has captions that match the speech and are in sync.
      steps:
        - action: Play each video with captions turned on.
          expected: Captions are available and can be turned on and off.
        - action: Compare the captions of a 60-second section with the spoken audio.
          expected: The captions contain the spoken words and relevant sounds and lag no more than 1 second behind.
          data: "lag ≤ 1 s"
    sv:
      title: Undertexter på inspelade videor
      description: Kontrollerar att varje video med ljud har korrekta och synkroniserade undertexter.
      preconditions: En förteckning över alla videor som publiceras i systemet.
      expected: Varje video har undertexter som stämmer med talet och är synkroniserade.
      steps:
        - action: Spela upp varje video med undertexterna påslagna.
          expected: Undertexter finns och kan slås på och av.
        - action: Jämför undertexterna för ett avsnitt på 60 sekunder med det talade ljudet.
          expected: Undertexterna innehåller de talade orden och relevanta ljud och ligger högst 1 sekund efter.
          data: "fördröjning ≤ 1 s"

  - id: A11Y-T11
    priority: critical
    execution: manual
    tags: [audit, wcag, conformance]
    refs: ["WCAG 2.2 conformance level AA", "WCAG-EM 1.0", "EN 301 549 clause 9"]
    en:
      title: Accessibility audit against WCAG 2.2 AA
      description: An expert audit of a sample of pages and flows against every level A and AA success criterion.
      preconditions: An auditor with WCAG experience, a sample of the 10 most used pages and the main flows, and assistive technology.
      expected: No level A or AA success criterion fails on the sampled pages.
      steps:
        - action: Define the scope and sample following the WCAG-EM methodology.
          expected: The sample lists the pages, flows, browsers and assistive technologies covered.
        - action: Evaluate each sampled page against each level A and AA success criterion.
          expected: Each criterion is recorded as passed, failed or not applicable with evidence for failures.
        - action: Summarise the results in an audit report.
          expected: The report shows zero failed criteria, or each failure is linked to a defect with a planned fix.
    sv:
      title: Tillgänglighetsgranskning mot WCAG 2.2 AA
      description: En expertgranskning av ett urval sidor och flöden mot varje framgångskriterium på nivå A och AA.
      preconditions: En granskare med erfarenhet av WCAG, ett urval av de 10 mest använda sidorna och huvudflödena samt hjälpmedel.
      expected: Inget framgångskriterium på nivå A eller AA underkänns på de granskade sidorna.
      steps:
        - action: Bestäm omfattning och urval enligt metoden WCAG-EM.
          expected: Urvalet anger vilka sidor, flöden, webbläsare och hjälpmedel som ingår.
        - action: Bedöm varje sida i urvalet mot varje framgångskriterium på nivå A och AA.
          expected: Varje kriterium noteras som godkänt, underkänt eller ej tillämpligt, med belägg för underkända kriterier.
        - action: Sammanfatta resultatet i en granskningsrapport.
          expected: Rapporten visar noll underkända kriterier, eller så är varje brist kopplad till ett fel med planerad åtgärd.

  - id: A11Y-T12
    priority: medium
    execution: manual
    tags: [accessibility-statement]
    refs: ["Lag (2018:1937) om tillgänglighet till digital offentlig service", "DIGG MDFFS 2019:2"]
    en:
      title: Accessibility statement is complete and linked
      description: Checks that the accessibility statement can be found from every page and has the mandatory content.
      preconditions: The system is deployed in a production-like environment.
      expected: The statement is linked from every page and contains all mandatory parts.
      steps:
        - action: Open 5 different pages, including the sign-in page, and look for the link to the statement.
          expected: Each page has a link to the accessibility statement, for example in the footer.
        - action: Open the statement and compare it with the checklist of mandatory content.
          expected: The statement contains the conformance status, known shortcomings, a feedback contact, the enforcement body and the review date.
          data: "Enforcement body in Sweden: DIGG"
        - action: Send a report of inaccessible content through the feedback contact.
          expected: The report is received and acknowledged.
    sv:
      title: Tillgänglighetsredogörelsen är komplett och länkad
      description: Kontrollerar att tillgänglighetsredogörelsen kan hittas från varje sida och har det innehåll som krävs.
      preconditions: Systemet är driftsatt i en produktionslik miljö.
      expected: Redogörelsen är länkad från varje sida och innehåller alla obligatoriska delar.
      steps:
        - action: Öppna 5 olika sidor, däribland inloggningssidan, och leta efter länken till redogörelsen.
          expected: Varje sida har en länk till tillgänglighetsredogörelsen, till exempel i sidfoten.
        - action: Öppna redogörelsen och jämför den med checklistan för obligatoriskt innehåll.
          expected: Redogörelsen innehåller status för överensstämmelse, kända brister, kontaktväg för synpunkter, tillsynsmyndighet och datum för översyn.
          data: "Tillsynsmyndighet i Sverige: DIGG"
        - action: Skicka en anmälan om otillgängligt innehåll via kontaktvägen.
          expected: Anmälan tas emot och bekräftas.

  - id: A11Y-T13
    priority: low
    execution: automated
    tags: [target-size]
    refs: ["WCAG 2.2 SC 2.5.8"]
    en:
      title: Size of clickable targets measured
      description: A script measures the bounding boxes of interactive elements and the space around them.
      preconditions: A test environment and a browser automation tool at a viewport of 1280 × 800 CSS pixels.
      expected: No interactive element is smaller than 24 × 24 CSS pixels without the free space around it.
      steps:
        - action: The script visits each route and collects the bounding boxes of buttons, links, inputs and custom controls.
          expected: A list of element sizes per page is produced.
        - action: For each element under 24 × 24 pixels the script checks whether a 24-pixel circle around its centre overlaps another target.
          expected: No undersized element has an overlapping neighbour, and inline links in running text are excluded.
          data: "24 × 24 CSS px"
    sv:
      title: Storleken på klickytor mäts
      description: Ett skript mäter avgränsningsrutorna för interaktiva element och utrymmet runt dem.
      preconditions: En testmiljö och ett verktyg för webbläsarautomatisering med visningsområdet 1280 × 800 CSS-pixlar.
      expected: Inget interaktivt element är mindre än 24 × 24 CSS-pixlar utan fritt utrymme runt sig.
      steps:
        - action: Skriptet besöker varje vy och samlar in avgränsningsrutorna för knappar, länkar, inmatningsfält och egna kontroller.
          expected: En lista över elementstorlekar per sida tas fram.
        - action: För varje element under 24 × 24 pixlar kontrollerar skriptet om en cirkel på 24 pixlar runt dess mitt överlappar en annan klickyta.
          expected: Inget för litet element har en överlappande granne, och länkar i löptext räknas inte.
          data: "24 × 24 CSS px"

  - id: A11Y-T14
    priority: high
    execution: manual
    tags: [timing, session]
    refs: ["WCAG 2.2 SC 2.2.1"]
    en:
      title: Time limit warning and extension
      description: Waits for the idle warning with a screen reader running and extends the session repeatedly.
      preconditions: A test environment with a 30-minute idle limit, or a shortened limit with the same 2-minute warning, and a screen reader running.
      expected: The warning comes 2 minutes before the limit, is announced, and extends the session every time.
      steps:
        - action: Sign in, open a form, type some text and wait without input.
          expected: After 28 minutes a warning appears and the screen reader announces it.
          data: 30 min limit
        - action: Press "Continue" in the warning.
          expected: The warning closes, the session continues and the typed text is still there.
        - action: Repeat the wait and the extension 10 times.
          expected: Each extension works and the session never ends while "Continue" is used.
    sv:
      title: Varning och förlängning vid tidsgräns
      description: Väntar på varningen för inaktivitet med en skärmläsare igång och förlänger sessionen upprepade gånger.
      preconditions: En testmiljö med en tidsgräns på 30 minuters inaktivitet, eller en förkortad gräns med samma varning 2 minuter före, och en skärmläsare igång.
      expected: Varningen kommer 2 minuter före gränsen, läses upp och förlänger sessionen varje gång.
      steps:
        - action: Logga in, öppna ett formulär, skriv en text och vänta utan att göra något.
          expected: Efter 28 minuter visas en varning som skärmläsaren läser upp.
          data: gräns 30 min
        - action: Tryck på "Fortsätt" i varningen.
          expected: Varningen stängs, sessionen fortsätter och den skrivna texten finns kvar.
        - action: Upprepa väntan och förlängningen 10 gånger.
          expected: Varje förlängning fungerar och sessionen avslutas aldrig så länge "Fortsätt" används.

  - id: A11Y-T15
    priority: medium
    execution: manual
    tags: [tooltips, hover]
    refs: ["WCAG 2.2 SC 1.4.13"]
    en:
      title: Tooltips dismissible, hoverable and persistent
      description: Opens 5 sampled tooltips with the pointer and the keyboard and checks the three conditions.
      preconditions: A list of 5 controls that show a tooltip or pop-over, and browser zoom at 200 percent.
      expected: Each tooltip can be closed with Escape, entered with the pointer and stays until dismissed.
      steps:
        - action: Move the keyboard focus to each control and press Escape.
          expected: The tooltip closes and the focus stays on the control.
        - action: Hover over each control and move the pointer onto the tooltip.
          expected: The tooltip stays open while the pointer is over it.
        - action: Open each tooltip and wait 30 seconds without moving.
          expected: The tooltip is still visible.
    sv:
      title: Verktygstips kan stängas, nås med pekaren och ligger kvar
      description: Öppnar 5 utvalda verktygstips med pekare och tangentbord och kontrollerar de tre villkoren.
      preconditions: En lista med 5 kontroller som visar ett verktygstips eller en popup-panel, och webbläsarens zoom på 200 procent.
      expected: Varje verktygstips kan stängas med Escape, nås med pekaren och ligger kvar tills det stängs.
      steps:
        - action: Flytta tangentbordsfokus till varje kontroll och tryck på Escape.
          expected: Verktygstipset stängs och fokus stannar på kontrollen.
        - action: Hovra över varje kontroll och flytta pekaren in i verktygstipset.
          expected: Verktygstipset är öppet så länge pekaren är över det.
        - action: Öppna varje verktygstips och vänta 30 sekunder utan att röra pekaren.
          expected: Verktygstipset syns fortfarande.

  - id: A11Y-T16
    priority: medium
    execution: automated
    tags: [language, label-in-name]
    refs: ["WCAG 2.2 SC 3.1.2", "WCAG 2.2 SC 2.5.3"]
    en:
      title: Language attributes and label in name
      description: A browser script checks the language attributes of pages and passages and compares accessible names with visible labels.
      preconditions: The interface set to Swedish, a project with one requirement whose language is English, and the list of all pages.
      expected: Each page declares Swedish, the English requirement is marked as English, and every accessible name starts with its visible label.
      steps:
        - action: Load each page and read the language attribute of the document.
          expected: Each page declares "sv".
          data: lang="sv"
        - action: Open the English requirement and read the language attribute of its title and description.
          expected: Both are marked "en".
          data: lang="en"
        - action: For each control with visible text, compare its accessible name with the visible text.
          expected: Each accessible name starts with the visible text; 0 mismatches are reported.
    sv:
      title: Språkattribut och etikett i namnet
      description: Ett webbläsarskript kontrollerar språkattributen för sidor och textavsnitt och jämför tillgängliga namn med synliga etiketter.
      preconditions: Gränssnittet inställt på svenska, ett projekt med ett krav vars språk är engelska, och listan över alla sidor.
      expected: Varje sida anger svenska, det engelska kravet är märkt som engelska och varje tillgängligt namn börjar med sin synliga etikett.
      steps:
        - action: Läs in varje sida och läs dokumentets språkattribut.
          expected: Varje sida anger "sv".
          data: lang="sv"
        - action: Öppna det engelska kravet och läs språkattributet för dess titel och beskrivning.
          expected: Båda är märkta "en".
          data: lang="en"
        - action: Jämför för varje kontroll med synlig text dess tillgängliga namn med den synliga texten.
          expected: Varje tillgängligt namn börjar med den synliga texten; 0 avvikelser rapporteras.

  - id: A11Y-T17
    priority: low
    execution: manual
    tags: [consistent-help]
    refs: ["WCAG 2.2 SC 3.2.6"]
    en:
      title: Position of help and support links
      description: Compares where the help and support links appear on sampled pages.
      preconditions: A list of 10 sample pages of different kinds, including a list, an editor and a settings page.
      expected: The help and support links are in the same region and order on each page.
      steps:
        - action: Open each sample page and note the region and order of the help and support links.
          expected: Each page shows them in the same region, for example the page header.
        - action: Compare the order of the links between the pages.
          expected: The order is the same on all 10 pages.
    sv:
      title: Placering av hjälp- och supportlänkar
      description: Jämför var hjälp- och supportlänkarna finns på ett urval sidor.
      preconditions: En lista med 10 exempelsidor av olika slag, däribland en lista, en redigerare och en inställningssida.
      expected: Hjälp- och supportlänkarna finns i samma område och ordning på varje sida.
      steps:
        - action: Öppna varje exempelsida och anteckna område och ordning för hjälp- och supportlänkarna.
          expected: Varje sida visar dem i samma område, till exempel sidhuvudet.
        - action: Jämför länkarnas ordning mellan sidorna.
          expected: Ordningen är densamma på alla 10 sidorna.

  - id: A11Y-T18
    priority: high
    execution: manual
    tags: [contrast, controls]
    refs: ["WCAG 2.2 SC 1.4.11"]
    en:
      title: Non-text contrast on the main pages
      description: Measures the contrast of control borders, meaningful icons and chart lines.
      preconditions: The 5 main pages in light and dark theme and a contrast measuring tool.
      expected: Each measured element reaches at least 3:1 against its neighbour colours.
      steps:
        - action: Measure the border of an empty input field against the page background in both themes.
          expected: The ratio is at least 3:1.
          data: "text field on the item form"
        - action: Measure the icons that carry meaning without text, such as status icons.
          expected: Each ratio is at least 3:1.
        - action: Measure the lines of a chart against the chart background.
          expected: Each line has a ratio of at least 3:1.
    sv:
      title: Kontrast för icke-text på huvudsidorna
      description: Mäter kontrasten för kontrollers kanter, betydelsebärande ikoner och diagramlinjer.
      preconditions: De 5 viktigaste sidorna i ljust och mörkt tema och ett verktyg för kontrastmätning.
      expected: Varje uppmätt element når minst 3:1 mot sina angränsande färger.
      steps:
        - action: Mät kanten på ett tomt inmatningsfält mot sidans bakgrund i båda temana.
          expected: Förhållandet är minst 3:1.
          data: "textfält i objektformuläret"
        - action: Mät ikoner som bär betydelse utan text, till exempel statusikoner.
          expected: Varje förhållande är minst 3:1.
        - action: Mät linjerna i ett diagram mot diagrammets bakgrund.
          expected: Varje linje har ett förhållande på minst 3:1.

  - id: A11Y-T19
    priority: medium
    execution: manual
    tags: [text-spacing]
    refs: ["WCAG 2.2 SC 1.4.12"]
    en:
      title: Text spacing override
      description: Applies a user style sheet with increased text spacing and inspects the main pages.
      preconditions: A browser with a bookmarklet or extension that sets the WCAG text spacing values.
      expected: No text or control is clipped, hidden or overlapping.
      steps:
        - action: Apply the spacing overrides.
          expected: Line height, paragraph, letter and word spacing change on the page.
          data: "line-height 1.5; paragraph 2 em; letter 0.12 em; word 0.16 em"
        - action: Go through the 5 main pages including a form, a list and a dialog.
          expected: All text is readable and every button and field is visible and usable.
    sv:
      title: Ändrat textavstånd
      description: Lägger på en användarstilmall med ökade textavstånd och granskar huvudsidorna.
      preconditions: En webbläsare med ett bokmärkesskript eller tillägg som sätter WCAG:s värden för textavstånd.
      expected: Ingen text eller kontroll klipps av, döljs eller överlappar.
      steps:
        - action: Lägg på de ändrade avstånden.
          expected: Radhöjd, stycke-, tecken- och ordavstånd ändras på sidan.
          data: "radhöjd 1,5; stycke 2 em; tecken 0,12 em; ord 0,16 em"
        - action: Gå igenom de 5 viktigaste sidorna, däribland ett formulär, en lista och en dialog.
          expected: All text går att läsa och varje knapp och fält är synligt och går att använda.

  - id: A11Y-T20
    priority: medium
    execution: manual
    tags: [consistency, labels]
    refs: ["WCAG 2.2 SC 3.2.4"]
    en:
      title: Consistent identification of common functions
      description: Compares label, accessible name and icon of recurring controls across pages.
      preconditions: 10 pages that contain save, delete, search and close controls, and the browser's accessibility inspector.
      expected: Each function has the same label, accessible name and icon on every page.
      steps:
        - action: Record label, accessible name and icon of the save control on each page.
          expected: The values are the same on each page.
          data: "for example \"Save\" with a disk icon"
        - action: Repeat for delete, search and close.
          expected: No page uses a different name or icon for these functions.
    sv:
      title: Enhetlig identifiering av vanliga funktioner
      description: Jämför etikett, tillgängligt namn och ikon för återkommande kontroller mellan sidor.
      preconditions: 10 sidor med kontroller för spara, radera, sök och stäng, och webbläsarens verktyg för tillgänglighetsinspektion.
      expected: Varje funktion har samma etikett, tillgängliga namn och ikon på varje sida.
      steps:
        - action: Notera etikett, tillgängligt namn och ikon för kontrollen spara på varje sida.
          expected: Värdena är desamma på varje sida.
          data: "till exempel \"Spara\" med en diskettikon"
        - action: Upprepa för radera, sök och stäng.
          expected: Ingen sida använder ett annat namn eller en annan ikon för dessa funktioner.

  - id: A11Y-T21
    priority: high
    execution: manual
    tags: [aria, screen-reader]
    refs: ["WCAG 2.2 SC 4.1.2"]
    en:
      title: Custom controls with a screen reader
      description: Operates each custom control with a screen reader and listens to what is announced.
      preconditions: NVDA with Firefox or VoiceOver with Safari, and the list of custom controls in the user interface.
      expected: Each control is announced with name, role and state, and state changes are announced.
      steps:
        - action: Move to a tab list and listen.
          expected: The screen reader announces the tab name, the role tab and selected or not selected.
          data: "NVDA 2025 with Firefox"
        - action: Open a menu button.
          expected: The button is announced as a menu button with its expanded state, which changes to expanded.
        - action: Expand a node in a tree view.
          expected: The node's expanded state is announced after the change.
    sv:
      title: Egna kontroller med skärmläsare
      description: Använder varje egenbyggd kontroll med en skärmläsare och lyssnar på vad som läses upp.
      preconditions: NVDA med Firefox eller VoiceOver med Safari, och listan över egna kontroller i användargränssnittet.
      expected: Varje kontroll läses upp med namn, roll och tillstånd, och tillståndsändringar läses upp.
      steps:
        - action: Flytta till en flikrad och lyssna.
          expected: Skärmläsaren läser upp flikens namn, rollen flik och vald eller inte vald.
          data: "NVDA 2025 med Firefox"
        - action: Öppna en menyknapp.
          expected: Knappen läses upp som menyknapp med sitt expanderade tillstånd, som ändras till expanderad.
        - action: Fäll ut en nod i en trädvy.
          expected: Nodens utfällda tillstånd läses upp efter ändringen.

  - id: A11Y-T22
    priority: medium
    execution: manual
    tags: [pdf, documents]
    refs: ["ISO 14289-1:2014 (PDF/UA)"]
    en:
      title: PDF/UA check of a generated report
      description: Generates a report as PDF and checks its tags and reading order.
      preconditions: A report with headings and a table, a PDF/UA checker such as PAC and a screen reader.
      expected: The PDF passes the checker and reads in the logical order.
      steps:
        - action: Export the report as PDF.
          expected: The PDF is created.
          data: "report with 2 headings and a 10-row table"
        - action: Run the PDF/UA checker.
          expected: The checker reports no errors; language, title and tags are present.
        - action: Read the PDF with a screen reader.
          expected: Headings are announced as headings and table cells with their column headers.
    sv:
      title: PDF/UA-kontroll av en skapad rapport
      description: Skapar en rapport som PDF och kontrollerar dess taggar och läsordning.
      preconditions: En rapport med rubriker och en tabell, ett kontrollverktyg för PDF/UA som PAC och en skärmläsare.
      expected: PDF-filen klarar kontrollen och läses i logisk ordning.
      steps:
        - action: Exportera rapporten som PDF.
          expected: PDF-filen skapas.
          data: "rapport med 2 rubriker och en tabell med 10 rader"
        - action: Kör kontrollverktyget för PDF/UA.
          expected: Verktyget rapporterar inga fel; språk, titel och taggar finns.
        - action: Läs PDF-filen med en skärmläsare.
          expected: Rubriker läses upp som rubriker och tabellceller med sina kolumnrubriker.

  - id: A11Y-T23
    priority: medium
    execution: manual
    tags: [european-accessibility-act, terms]
    refs: ["Directive (EU) 2019/882 (EAA) Annex V"]
    en:
      title: Published accessibility information of a consumer service
      description: Looks for the accessibility information from the service's terms.
      preconditions: The public website and general terms of a consumer service.
      expected: The information is reachable from the terms and describes how the requirements are met.
      steps:
        - action: Open the general terms and look for accessibility information or a link to it.
          expected: The terms contain the information or link to it.
        - action: Read the information.
          expected: It describes the accessibility features of the service, names the requirements it meets and gives a contact for feedback.
    sv:
      title: Publicerad tillgänglighetsinformation för en konsumenttjänst
      description: Letar efter tillgänglighetsinformationen utifrån tjänstens villkor.
      preconditions: Den publika webbplatsen och de allmänna villkoren för en konsumenttjänst.
      expected: Informationen nås från villkoren och redogör för hur kraven uppfylls.
      steps:
        - action: Öppna de allmänna villkoren och leta efter tillgänglighetsinformation eller en länk till den.
          expected: Villkoren innehåller informationen eller länkar till den.
        - action: Läs informationen.
          expected: Den redogör för tjänstens tillgänglighetsfunktioner, anger vilka krav den uppfyller och ger en kontakt för synpunkter.
risks:
  - id: A11Y-R01
    category: compliance
    likelihood: 3
    impact: 4
    tags: [wcag, public-sector]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "Directive (EU) 2016/2102", "Lag (2018:1937) om tillgänglighet till digital offentlig service"]
    mitigated_by: [A11Y-16, A11Y-17]
    en:
      title: Public service found inaccessible by the supervisory authority
      description: "A public body's service fails WCAG level AA or has no accessibility statement. The supervisory authority orders corrections, and people with disabilities cannot use the service meanwhile."
      mitigation: Meet WCAG 2.2 level AA, test with assistive technology before each release and publish and maintain an accessibility statement.
    sv:
      title: Tillsynsmyndigheten bedömer att en offentlig tjänst inte är tillgänglig
      description: En offentlig aktörs tjänst uppfyller inte WCAG nivå AA eller saknar tillgänglighetsredogörelse. Tillsynsmyndigheten förelägger om rättelse, och personer med funktionsnedsättning kan inte använda tjänsten under tiden.
      mitigation: Uppfyll WCAG 2.2 nivå AA, testa med hjälpmedel före varje release och publicera och underhåll en tillgänglighetsredogörelse.
  - id: A11Y-R02
    category: compliance
    likelihood: 3
    impact: 4
    tags: [eaa, consumer-services]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "Directive (EU) 2019/882 (EAA) Art. 13(2) (information on how services meet the accessibility requirements)"]
    mitigated_by: [A11Y-29, A11Y-16]
    en:
      title: Consumer service breaks the European Accessibility Act
      description: An e-commerce or banking service sold to consumers is not accessible and gives no information on how it meets the requirements. Market surveillance can stop the service and customers with disabilities are excluded.
      mitigation: Make consumer services meet the accessibility requirements and publish how they do so in the general terms or a similar place.
    sv:
      title: Konsumenttjänst bryter mot tillgänglighetsdirektivet
      description: En e-handels- eller banktjänst som säljs till konsumenter är inte tillgänglig och saknar information om hur den uppfyller kraven. Marknadskontrollen kan stoppa tjänsten och kunder med funktionsnedsättning stängs ute.
      mitigation: Se till att konsumenttjänster uppfyller tillgänglighetskraven och redovisa hur de gör det i de allmänna villkoren eller på liknande ställe.
  - id: A11Y-R03
    category: quality
    likelihood: 4
    impact: 3
    tags: [keyboard, screen-reader]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "WCAG 2.2 SC 2.1.1", "WCAG 2.2 SC 4.1.2"]
    mitigated_by: [A11Y-01, A11Y-02, A11Y-27, A11Y-12]
    en:
      title: Users of keyboards and screen readers stuck in a core task
      description: A custom control can only be used with a mouse, traps the keyboard focus or does not tell a screen reader its state. The user cannot finish the task and must ask someone else for help.
      mitigation: Make every function keyboard operable without traps, give custom controls a name, role and state, and announce status messages.
    sv:
      title: Användare av tangentbord och skärmläsare fastnar i en central uppgift
      description: En egen kontroll kan bara användas med mus, fångar tangentbordsfokus eller berättar inte sitt tillstånd för en skärmläsare. Användaren kan inte slutföra uppgiften och måste be någon annan om hjälp.
      mitigation: Gör varje funktion användbar med tangentbord utan fällor, ge egna kontroller namn, roll och tillstånd och läs upp statusmeddelanden.
