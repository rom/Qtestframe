area: secrets-management
prefix: SECR
group: security
name: {en: Secrets management, sv: Hantering av hemligheter}
description:
  en: Storage, access, rotation, revocation and inventory of passwords, API keys, certificates' private keys and other credentials that services use.
  sv: Lagring, åtkomst, rotation, återkallelse och förteckning av lösenord, API-nycklar, privata nycklar och andra inloggningsuppgifter som tjänster använder.

requirements:
  - id: SECR-01
    type: security
    obligation: must
    priority: critical
    tags: [secrets-manager, configuration]
    refs: ["OWASP ASVS 5.0 V13.3 (secret management)", "OWASP Secrets Management Cheat Sheet", "ISO/IEC 27001:2022 A.5.17 (authentication information)", "IEC 62443-3-3 SR 1.5", "CWE-798 (use of hard-coded credentials)", "CWE-260 (password in configuration file)", "MITRE ATT&CK T1552.001 (credentials in files)"]
    tests: [SECR-T01]
    en:
      title: Secrets are read from a secrets manager
      description: Each service MUST read its passwords, API keys and private keys at runtime from a dedicated secrets manager or key vault.
      rationale: Secrets in configuration files, container images or environment files spread to every copy of them and cannot be rotated or audited in one place.
      criteria:
        - method: inspection
          text: The deployment configuration, container images and repository contain references to the secrets manager and no secret values.
        - method: test
          text: A service started without access to the secrets manager fails at startup with a message naming the missing secret.
    sv:
      title: Hemligheter läses från en hemlighetshanterare
      description: Varje tjänst SKA läsa sina lösenord, API-nycklar och privata nycklar vid körning från en särskild hemlighetshanterare eller nyckelvalv.
      rationale: Hemligheter i konfigurationsfiler, containeravbilder eller miljöfiler sprids till varje kopia av dem och går inte att rotera eller granska på ett ställe.
      criteria:
        - method: inspection
          text: Driftsättningskonfigurationen, containeravbilderna och kodförrådet innehåller hänvisningar till hemlighetshanteraren och inga hemliga värden.
        - method: test
          text: En tjänst som startas utan åtkomst till hemlighetshanteraren avbryter starten med ett meddelande som namnger den saknade hemligheten.

  - id: SECR-02
    type: security
    obligation: must
    priority: critical
    tags: [least-privilege, access-policy]
    refs: ["OWASP ASVS 5.0 V13.3.2 (least privilege for secrets)", "ISO/IEC 27001:2022 A.8.2 (privileged access rights)", "ISO/IEC 27001:2022 A.8.3", "IEC 62443-3-3 SR 2.1", "CWE-522 (insufficiently protected credentials)", "MITRE ATT&CK T1555.006 (cloud secrets management stores)"]
    tests: [SECR-T02]
    en:
      title: Each secret is readable only by the services that use it
      description: The secrets manager MUST grant read access to a secret only to the service identities listed for that secret in the access policy.
      rationale: A compromised service then exposes only its own secrets and not those of the whole platform.
      criteria:
        - method: test
          text: A service identity that is not listed for a secret gets an access denied response when it reads that secret.
        - method: inspection
          text: The access policy names one or two service identities per secret and contains no wildcard grants.
    sv:
      title: Varje hemlighet kan bara läsas av tjänsterna som använder den
      description: Hemlighetshanteraren SKA ge läsåtkomst till en hemlighet enbart till de tjänsteidentiteter som står för hemligheten i åtkomstpolicyn.
      rationale: En komprometterad tjänst röjer då bara sina egna hemligheter och inte hela plattformens.
      criteria:
        - method: test
          text: En tjänsteidentitet som inte står för en hemlighet får ett svar om nekad åtkomst när den läser hemligheten.
        - method: inspection
          text: Åtkomstpolicyn anger en eller två tjänsteidentiteter per hemlighet och innehåller inga jokerteckenbehörigheter.

  - id: SECR-03
    type: security
    obligation: should
    priority: high
    tags: [rotation]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 §5.3 (cryptoperiods)", "OWASP Secrets Management Cheat Sheet §2.6 (rotation)", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.5", "CWE-324 (use of a key past its expiration date)", "MITRE ATT&CK T1552 (unsecured credentials)"]
    tests: [SECR-T03]
    en:
      title: Rotation of long-lived secrets every 90 days
      description: The system SHOULD rotate each long-lived password, API key and signing key at least every 90 days.
      rationale: Regular rotation limits how long a secret that leaked without anyone noticing can be used.
      criteria:
        - method: inspection
          text: The rotation dates in the secrets manager show no long-lived secret older than 90 days.
          threshold: "age ≤ 90 days"
    sv:
      title: Rotation av långlivade hemligheter var 90:e dag
      description: Systemet BÖR rotera varje långlivat lösenord, varje API-nyckel och varje signeringsnyckel minst var 90:e dag.
      rationale: Regelbunden rotation begränsar hur länge en hemlighet som läckt utan att någon märkt det kan användas.
      criteria:
        - method: inspection
          text: Rotationsdatumen i hemlighetshanteraren visar ingen långlivad hemlighet som är äldre än 90 dagar.
          threshold: "ålder ≤ 90 dagar"

  - id: SECR-04
    type: security
    obligation: should
    priority: high
    tags: [rotation, availability]
    refs: ["OWASP Secrets Management Cheat Sheet §2.6 (rotation)", "ISO/IEC 27001:2022 A.5.17"]
    tests: [SECR-T03]
    en:
      title: Rotated secrets take effect without a restart
      description: Each service SHOULD start using a rotated secret within 5 minutes without a restart and without failed requests.
      rationale: When rotation needs a restart or causes errors, teams postpone it, and secrets stay in use far longer than planned.
      criteria:
        - method: test
          text: During a rotation under load the service uses the new secret within 5 minutes and no request fails because of the change.
          threshold: "≤ 5 min, 0 failed requests"
    sv:
      title: Roterade hemligheter börjar gälla utan omstart
      description: Varje tjänst BÖR börja använda en roterad hemlighet inom 5 minuter utan omstart och utan misslyckade anrop.
      rationale: När rotation kräver omstart eller ger fel skjuter teamen upp den, och hemligheterna används mycket längre än planerat.
      criteria:
        - method: test
          text: Vid en rotation under last använder tjänsten den nya hemligheten inom 5 minuter och inget anrop misslyckas på grund av bytet.
          threshold: "≤ 5 min, 0 misslyckade anrop"

  - id: SECR-05
    type: security
    obligation: should
    priority: medium
    tags: [dynamic-credentials, database]
    refs: ["OWASP Secrets Management Cheat Sheet §2.4 (dynamic secrets)", "NIST SP 800-207 §2.1 (tenets of zero trust)", "ISO/IEC 27001:2022 A.5.17", "IEC 62443-3-3 SR 1.5", "MITRE ATT&CK T1078 (valid accounts)"]
    tests: [SECR-T04]
    en:
      title: Short-lived database credentials
      description: Services SHOULD connect to databases with credentials issued by the secrets manager that expire after at most 24 hours.
      rationale: Credentials that expire on their own are worthless to an attacker who copies them, and each instance gets its own traceable account.
      criteria:
        - method: test
          text: A database credential issued to a service is rejected by the database 24 hours after it was issued.
          threshold: "lifetime ≤ 24 h"
    sv:
      title: Kortlivade inloggningsuppgifter till databaser
      description: Tjänster BÖR ansluta till databaser med inloggningsuppgifter som hemlighetshanteraren utfärdar och som upphör att gälla efter högst 24 timmar.
      rationale: Uppgifter som slutar gälla av sig själva är värdelösa för en angripare som kopierar dem, och varje instans får ett eget spårbart konto.
      criteria:
        - method: test
          text: En databasinloggning som utfärdats till en tjänst avvisas av databasen 24 timmar efter att den utfärdades.
          threshold: "livslängd ≤ 24 h"

  - id: SECR-06
    type: security
    obligation: must
    priority: high
    tags: [audit, logging]
    refs: ["OWASP ASVS 5.0 V16.3.3 (documented security events)", "ISO/IEC 27001:2022 A.8.15 (logging)", "IEC 62443-3-3 SR 2.8", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1555.006 (cloud secrets management stores)"]
    tests: [SECR-T05]
    en:
      title: Reads and changes of secrets are logged
      description: The secrets manager MUST record each read, creation, change and deletion of a secret with the time, the identity and the secret's name, without the secret's value.
      rationale: The log shows who could have seen a secret, which is the first question when a leak is suspected.
      criteria:
        - method: test
          text: A read and a change of a test secret each produce a log entry with time, identity and name, and neither entry contains the value.
    sv:
      title: Läsningar och ändringar av hemligheter loggas
      description: Hemlighetshanteraren SKA registrera varje läsning, skapande, ändring och borttagning av en hemlighet med tid, identitet och hemlighetens namn, utan hemlighetens värde.
      rationale: Loggen visar vem som kan ha sett en hemlighet, vilket är den första frågan när en läcka misstänks.
      criteria:
        - method: test
          text: En läsning och en ändring av en testhemlighet ger var sin loggpost med tid, identitet och namn, och ingen av posterna innehåller värdet.

  - id: SECR-07
    type: security
    obligation: must
    priority: critical
    tags: [revocation, incident]
    refs: ["NIST SP 800-61 Rev. 2 §3.3 (containment, eradication and recovery)", "OWASP Secrets Management Cheat Sheet §5 (detection and response)", "ISO/IEC 27001:2022 A.5.26", "ISO/IEC 27001:2022 A.5.17", "MITRE ATT&CK T1552 (unsecured credentials)"]
    tests: [SECR-T06]
    en:
      title: Leaked secrets are revoked within one hour
      description: The operations team MUST revoke and replace a leaked secret within 1 hour of detection, following a documented procedure.
      rationale: Leaked keys are found and abused by automated scanners within minutes, so the response has to be prepared and rehearsed.
      criteria:
        - method: demonstration
          text: In a drill the team revokes and replaces a planted test secret within 1 hour, and the old value is rejected afterwards.
          threshold: "≤ 1 h from detection to revocation"
        - method: inspection
          text: A written procedure per secret type names who revokes it, how, and which services need the new value.
    sv:
      title: Läckta hemligheter återkallas inom en timme
      description: Driftteamet SKA återkalla och ersätta en läckt hemlighet inom 1 timme från upptäckten, enligt en dokumenterad rutin.
      rationale: Läckta nycklar hittas och missbrukas av automatiska skannrar inom minuter, så hanteringen behöver vara förberedd och inövad.
      criteria:
        - method: demonstration
          text: Vid en övning återkallar och ersätter teamet en utplacerad testhemlighet inom 1 timme, och det gamla värdet avvisas därefter.
          threshold: "≤ 1 h från upptäckt till återkallelse"
        - method: inspection
          text: En skriftlig rutin per typ av hemlighet anger vem som återkallar den, hur det görs och vilka tjänster som behöver det nya värdet.

  - id: SECR-08
    type: security
    obligation: must_not
    priority: high
    tags: [command-line, url, exposure]
    refs: ["CWE-214 (invocation of process using visible sensitive information)", "CWE-598 (use of GET request method with sensitive query strings)", "ISO/IEC 27001:2022 A.5.17", "MITRE ATT&CK T1552 (unsecured credentials)"]
    tests: [SECR-T07]
    en:
      title: No secrets in command lines or URLs
      description: Services MUST NOT pass a secret as a command-line argument or as part of a URL.
      rationale: Process listings, shell history, proxy logs and access logs record command lines and URLs in clear text.
      criteria:
        - method: inspection
          text: Process listings of the running services and the access logs of 24 hours contain no secret values.
    sv:
      title: Inga hemligheter i kommandorader eller URL:er
      description: Tjänster SKA INTE skicka en hemlighet som kommandoradsargument eller som en del av en URL.
      rationale: Processlistor, skalhistorik, proxyloggar och åtkomstloggar sparar kommandorader och URL:er i klartext.
      criteria:
        - method: inspection
          text: Processlistor för de körande tjänsterna och åtkomstloggarna för 24 timmar innehåller inga hemliga värden.

  - id: SECR-09
    type: security
    obligation: must_not
    priority: high
    tags: [api-key, user-interface]
    refs: ["OWASP ASVS 5.0 V13.3 (secret management)", "ISO/IEC 27001:2022 A.5.17"]
    tests: [SECR-T08]
    en:
      title: Issued keys are shown in full only once
      description: After the system has shown a new API key or webhook signing secret to its creator, it MUST NOT display the full value again.
      rationale: A value that can be shown again can also be read by anyone who later gets access to the account or the screen.
      criteria:
        - method: test
          text: After the creation dialog is closed, the key list, the detail page and the API show at most the last 4 characters of the key.
    sv:
      title: Utfärdade nycklar visas i sin helhet bara en gång
      description: När systemet har visat en ny API-nyckel eller signeringshemlighet för webhooks för den som skapade den SKA INTE systemet visa hela värdet igen.
      rationale: Ett värde som kan visas igen kan också läsas av den som senare får tillgång till kontot eller skärmen.
      criteria:
        - method: test
          text: När dialogrutan för skapande har stängts visar nyckellistan, detaljsidan och API:et högst de 4 sista tecknen av nyckeln.

  - id: SECR-10
    type: security
    obligation: must
    priority: high
    tags: [api-key, hashing, storage]
    refs: ["OWASP ASVS 5.0 V13.3 (secret management)", "NIST SP 800-107 Rev. 1 §5.3 (HMAC)", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.5", "CWE-257 (storing passwords in a recoverable format)"]
    tests: [SECR-T08]
    en:
      title: Issued keys are stored as keyed hashes
      description: The system MUST store the API keys and access tokens it issues only as a keyed hash such as HMAC-SHA-256.
      rationale: A copy of the database then gives an attacker no usable key.
      criteria:
        - method: inspection
          text: The key table holds a hash, a key id and the last 4 characters, and no column contains a full key.
    sv:
      title: Utfärdade nycklar lagras som nyckelbaserade hashvärden
      description: Systemet SKA lagra de API-nycklar och åtkomsttoken som det utfärdar enbart som ett nyckelbaserat hashvärde, till exempel HMAC-SHA-256.
      rationale: En kopia av databasen ger då inte en angripare någon användbar nyckel.
      criteria:
        - method: inspection
          text: Nyckeltabellen innehåller ett hashvärde, ett nyckel-id och de 4 sista tecknen, och ingen kolumn innehåller en hel nyckel.

  - id: SECR-11
    type: security
    obligation: must
    priority: high
    tags: [environments, separation]
    refs: ["ISO/IEC 27001:2022 A.8.31 (separation of development, test and production environments)", "ISO/IEC 27001:2022 A.5.17", "MITRE ATT&CK T1078 (valid accounts)"]
    tests: [SECR-T09]
    en:
      title: Separate secrets for each environment
      description: Each environment MUST use its own secrets, so that no production secret is valid in a development, test or staging environment.
      rationale: Test environments are reached by more people and tools than production, and a shared secret makes them a way into production.
      criteria:
        - method: test
          text: The database password, signing keys and API keys of staging are rejected by the production services.
        - method: inspection
          text: The secrets manager keeps each environment's secrets under a separate path with separate access policies.
    sv:
      title: Egna hemligheter för varje miljö
      description: Varje miljö SKA använda egna hemligheter, så att ingen produktionshemlighet gäller i en utvecklings-, test- eller stagingmiljö.
      rationale: Testmiljöer nås av fler personer och verktyg än produktion, och en gemensam hemlighet gör dem till en väg in i produktion.
      criteria:
        - method: test
          text: Databaslösenordet, signeringsnycklarna och API-nycklarna i staging avvisas av produktionstjänsterna.
        - method: inspection
          text: Hemlighetshanteraren håller varje miljös hemligheter under en egen sökväg med egna åtkomstpolicyer.

  - id: SECR-12
    type: security
    obligation: should
    priority: medium
    tags: [inventory, ownership, expiry]
    refs: ["ISO/IEC 27001:2022 A.5.9 (inventory of information and other associated assets)", "NIST SP 800-57 Part 1 Rev. 5 §9.2.1 (key inventories)", "ISO/IEC 27001:2022 A.8.24"]
    tests: [SECR-T10]
    en:
      title: Inventory of secrets with owner and expiry
      description: The organisation SHOULD keep an inventory that lists each secret with its owner, purpose, consuming services, last rotation and expiry date.
      rationale: Secrets without an owner are never rotated, and expired certificates are a common cause of outages.
      criteria:
        - method: review
          text: A quarterly review finds an owner, a purpose and a rotation date for each secret in the secrets manager.
        - method: inspection
          text: An alert reaches the owner 30 days before a certificate or key expires.
          threshold: "warning ≥ 30 days before expiry"
    sv:
      title: Förteckning över hemligheter med ägare och utgångsdatum
      description: Organisationen BÖR föra en förteckning som anger varje hemlighet med ägare, syfte, tjänster som använder den, senaste rotation och utgångsdatum.
      rationale: Hemligheter utan ägare roteras aldrig, och utgångna certifikat är en vanlig orsak till driftavbrott.
      criteria:
        - method: review
          text: En kvartalsvis granskning hittar en ägare, ett syfte och ett rotationsdatum för varje hemlighet i hemlighetshanteraren.
        - method: inspection
          text: En varning når ägaren 30 dagar innan ett certifikat eller en nyckel slutar gälla.
          threshold: "varning ≥ 30 dagar före utgång"

  - id: SECR-13
    type: security
    obligation: should
    priority: high
    tags: [workload-identity, cloud, short-lived-credentials]
    refs: ["NIST SP 800-207 §3.1.1 (enhanced identity governance)", "OWASP Secrets Management Cheat Sheet", "CSA Cloud Controls Matrix v4.0 IAM", "ISO/IEC 27001:2022 A.5.17", "MITRE ATT&CK T1552.001 (credentials in files)", "MITRE ATT&CK T1078.004 (cloud accounts)"]
    tests: [SECR-T11]
    en:
      title: Workload identity instead of static cloud keys
      description: The system SHOULD authenticate its services to cloud provider APIs with federated workload identities that issue credentials valid for at most 1 hour, and not with long-lived access keys.
      rationale: Static access keys are copied into configuration, images and laptops, where they stay valid long after anyone remembers them.
      criteria:
        - method: inspection
          text: The cloud account lists no active long-lived access keys for service identities, and the services' credentials expire after at most 1 hour.
          threshold: "≤ 1 h credential lifetime"
    sv:
      title: Arbetslastidentitet i stället för statiska molnnycklar
      description: Systemet BÖR autentisera sina tjänster mot molnleverantörens API:er med federerade arbetslastidentiteter som utfärdar autentiseringsuppgifter som gäller högst 1 timme, och inte med långlivade åtkomstnycklar.
      rationale: Statiska åtkomstnycklar kopieras till konfiguration, avbilder och bärbara datorer, där de fortsätter att gälla långt efter att någon minns dem.
      criteria:
        - method: inspection
          text: Molnkontot har inga aktiva långlivade åtkomstnycklar för tjänsteidentiteter, och tjänsternas autentiseringsuppgifter går ut efter högst 1 timme.
          threshold: "≤ 1 h giltighetstid"

  - id: SECR-14
    type: security
    obligation: must
    priority: high
    tags: [dual-control, privileged-access, secrets-manager]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 (split knowledge and dual control)", "ISO/IEC 27001:2022 A.8.2", "PCI DSS v4.0.1 Req. 3.7.6", "IEC 62443-3-3 SR 1.3", "MITRE ATT&CK M1026 (privileged account management)"]
    tests: [SECR-T12]
    en:
      title: Two people for root access to the secrets manager
      description: The system MUST require approval by a second named administrator before anyone uses the root or recovery credentials of the secrets manager.
      rationale: The root credential opens every secret at once, so a single person must not be able to use it alone, whether by mistake or on purpose.
      criteria:
        - method: test
          text: An attempt to unseal or use the root credential with one administrator's share alone fails, and succeeds after a second administrator approves.
    sv:
      title: Två personer för rotåtkomst till hemlighetshanteraren
      description: Systemet SKA kräva godkännande av en andra namngiven administratör innan någon använder hemlighetshanterarens rot- eller återställningsuppgifter.
      rationale: Rotuppgiften öppnar varje hemlighet på en gång, så en enskild person ska inte kunna använda den ensam, vare sig av misstag eller med avsikt.
      criteria:
        - method: test
          text: Ett försök att låsa upp eller använda rotuppgiften med enbart en administratörs andel misslyckas, och lyckas när en andra administratör har godkänt.

  - id: SECR-15
    type: security
    obligation: must
    priority: high
    tags: [ci-cd, pipeline, masking]
    refs: ["OWASP Top 10 CI/CD Security Risks CICD-SEC-6", "OWASP Secrets Management Cheat Sheet", "NIST SP 800-204D", "ISO/IEC 27001:2022 A.8.25", "CWE-532 (insertion of sensitive information into log file)", "MITRE ATT&CK T1677 (poisoned pipeline execution)"]
    tests: [SECR-T13]
    en:
      title: Pipeline secrets kept from forks and logs
      description: The system MUST withhold deployment secrets from pipeline runs triggered by pull requests from forks and mask every secret value in the pipeline logs.
      rationale: A pull request from outside can change the build script to print or send away every secret the pipeline holds.
      criteria:
        - method: test
          text: A pull request from a fork whose build prints all environment variables shows no deployment secret, and a run that echoes a secret shows only a mask in the log.
    sv:
      title: Pipelinens hemligheter hålls borta från förgreningar och loggar
      description: Systemet SKA undanhålla driftsättningshemligheter från pipelinekörningar som startas av pull requests från förgreningar och maskera varje hemligt värde i pipelinens loggar.
      rationale: En pull request utifrån kan ändra byggskriptet så att det skriver ut eller skickar iväg varje hemlighet som pipelinen har.
      criteria:
        - method: test
          text: En pull request från en förgrening vars bygge skriver ut alla miljövariabler visar ingen driftsättningshemlighet, och en körning som skriver ut en hemlighet visar bara en mask i loggen.

  - id: SECR-16
    type: security
    obligation: should
    priority: medium
    tags: [containers, environment-variables, runtime]
    refs: ["OWASP Secrets Management Cheat Sheet", "CWE-526 (cleartext storage of sensitive information in an environment variable)", "ISO/IEC 27001:2022 A.8.12", "MITRE ATT&CK T1552 (unsecured credentials)"]
    tests: [SECR-T14]
    en:
      title: Secrets delivered as in-memory files
      description: The system SHOULD give secrets to running services as files on an in-memory volume readable only by the service's user, and not in environment variables.
      rationale: Environment variables are inherited by child processes and appear in crash dumps, debug pages and container inspection output.
      criteria:
        - method: inspection
          text: The container inspection output shows no secret values in the environment, and the secret files are on a tmpfs mount with mode 0400 owned by the service user.
    sv:
      title: Hemligheter levereras som filer i minnet
      description: Systemet BÖR ge hemligheter till körande tjänster som filer på en minnesbaserad volym som bara tjänstens användare kan läsa, och inte i miljövariabler.
      rationale: Miljövariabler ärvs av barnprocesser och syns i kraschdumpar, felsökningssidor och utdata från inspektion av containrar.
      criteria:
        - method: inspection
          text: Utdata från inspektion av containern visar inga hemliga värden i miljön, och hemlighetsfilerna ligger på en tmpfs-montering med rättigheterna 0400 och tjänstens användare som ägare.

tests:
  - id: SECR-T01
    priority: critical
    execution: manual
    tags: [secrets-manager, inspection]
    refs: ["OWASP ASVS 5.0 V13.3 (secret management)", "IEC 62443-3-3 SR 1.5", "CWE-798 (use of hard-coded credentials)", "CWE-260 (password in configuration file)", "MITRE ATT&CK T1552.001 (credentials in files)"]
    en:
      title: Services get their secrets only from the secrets manager
      description: Inspects configuration and images for secret values and checks that a service cannot start without the secrets manager.
      preconditions: Read access to the repository, the deployment configuration and the container registry; a test environment where a service can be started.
      expected: No secret values are found outside the secrets manager, and a service without access to it does not start.
      steps:
        - action: Run a secret scanner over the repository, the deployment configuration and the latest container image of each service.
          expected: The scanner reports no passwords, keys or tokens.
        - action: Read the configuration of each service and list where each secret comes from.
          expected: Every secret is a reference to a path in the secrets manager.
        - action: Start one service in the test environment with its access to the secrets manager removed.
          expected: The service stops during startup with a message naming the secret it could not read.
    sv:
      title: Tjänster hämtar sina hemligheter enbart från hemlighetshanteraren
      description: Granskar konfiguration och avbilder efter hemliga värden och kontrollerar att en tjänst inte kan starta utan hemlighetshanteraren.
      preconditions: Läsåtkomst till kodförrådet, driftsättningskonfigurationen och containerregistret; en testmiljö där en tjänst kan startas.
      expected: Inga hemliga värden finns utanför hemlighetshanteraren, och en tjänst utan åtkomst till den startar inte.
      steps:
        - action: Kör en hemlighetsskanner över kodförrådet, driftsättningskonfigurationen och den senaste containeravbilden för varje tjänst.
          expected: Skannern rapporterar inga lösenord, nycklar eller token.
        - action: Läs konfigurationen för varje tjänst och lista varifrån varje hemlighet kommer.
          expected: Varje hemlighet är en hänvisning till en sökväg i hemlighetshanteraren.
        - action: Starta en tjänst i testmiljön med dess åtkomst till hemlighetshanteraren borttagen.
          expected: Tjänsten avbryter starten med ett meddelande som namnger hemligheten den inte kunde läsa.

  - id: SECR-T02
    priority: critical
    execution: automated
    tags: [access-policy, least-privilege]
    refs: ["CWE-522 (insufficiently protected credentials)", "MITRE ATT&CK T1555.006 (cloud secrets management stores)"]
    en:
      title: A service cannot read another service's secret
      description: A script reads secrets with two service identities and checks that each one gets only its own.
      preconditions: Two services A and B with one secret each in the test environment; the script can run with the identity of each service.
      expected: Each identity reads its own secret and is denied the other's.
      steps:
        - action: With the identity of service A, read the secret of service A.
          expected: The value is returned.
        - action: With the identity of service A, read the secret of service B.
          expected: The secrets manager answers with access denied and logs the attempt.
        - action: Export the access policy and search it for wildcard paths or identities.
          expected: The policy contains no wildcard grants.
    sv:
      title: En tjänst kan inte läsa en annan tjänsts hemlighet
      description: Ett skript läser hemligheter med två tjänsteidentiteter och kontrollerar att var och en bara får sin egen.
      preconditions: Två tjänster A och B med en hemlighet var i testmiljön; skriptet kan köras med varje tjänsts identitet.
      expected: Varje identitet läser sin egen hemlighet och nekas den andras.
      steps:
        - action: Läs tjänst A:s hemlighet med tjänst A:s identitet.
          expected: Värdet returneras.
        - action: Läs tjänst B:s hemlighet med tjänst A:s identitet.
          expected: Hemlighetshanteraren svarar med nekad åtkomst och loggar försöket.
        - action: Exportera åtkomstpolicyn och sök efter sökvägar eller identiteter med jokertecken.
          expected: Policyn innehåller inga jokerteckenbehörigheter.

  - id: SECR-T03
    priority: high
    execution: automated
    tags: [rotation, load-test]
    refs: ["CWE-324 (use of a key past its expiration date)", "MITRE ATT&CK T1552 (unsecured credentials)"]
    en:
      title: Rotation of a secret under load
      description: Rotates a database password while a load test runs and checks the rotation dates of all long-lived secrets.
      preconditions: A staging environment with a load generator; the service reloads secrets from the secrets manager; read access to the rotation dates.
      expected: The service switches to the new secret within 5 minutes without failed requests, and no long-lived secret is older than 90 days.
      steps:
        - action: Start a load test of 50 requests per second against an endpoint that uses the database.
          expected: The error rate is 0 %.
        - action: Rotate the database password in the secrets manager and note the time.
          expected: The new password is active in the database.
        - action: Watch the service logs and the error rate for 10 minutes.
          expected: The service reports that it uses the new password within 5 minutes and no request fails.
          data: "load: 50 req/s"
        - action: List the last rotation date of each long-lived secret.
          expected: No secret was last rotated more than 90 days ago.
    sv:
      title: Rotation av en hemlighet under last
      description: Roterar ett databaslösenord medan ett lasttest körs och kontrollerar rotationsdatumen för alla långlivade hemligheter.
      preconditions: En stagingmiljö med lastgenerator; tjänsten läser om hemligheter från hemlighetshanteraren; läsåtkomst till rotationsdatumen.
      expected: Tjänsten byter till den nya hemligheten inom 5 minuter utan misslyckade anrop, och ingen långlivad hemlighet är äldre än 90 dagar.
      steps:
        - action: Starta ett lasttest med 50 anrop per sekund mot en ändpunkt som använder databasen.
          expected: Felandelen är 0 %.
        - action: Rotera databaslösenordet i hemlighetshanteraren och notera tiden.
          expected: Det nya lösenordet är aktivt i databasen.
        - action: Följ tjänstens loggar och felandelen i 10 minuter.
          expected: Tjänsten rapporterar att den använder det nya lösenordet inom 5 minuter och inget anrop misslyckas.
          data: "last: 50 anrop/s"
        - action: Lista senaste rotationsdatum för varje långlivad hemlighet.
          expected: Ingen hemlighet roterades senast för mer än 90 dagar sedan.

  - id: SECR-T04
    priority: medium
    execution: automated
    tags: [dynamic-credentials, database]
    refs: ["MITRE ATT&CK T1078 (valid accounts)"]
    en:
      title: Database credentials expire after 24 hours
      description: Requests a database credential from the secrets manager and checks that it stops working when its lifetime has passed.
      preconditions: The secrets manager issues dynamic database credentials in the test environment; the lifetime can be read from the response.
      expected: The credential lifetime is at most 24 hours and the database rejects it afterwards.
      steps:
        - action: Request a database credential with the identity of a service and read its lifetime.
          expected: The lifetime is at most 24 hours.
        - action: Connect to the database with the credential.
          expected: The connection succeeds.
        - action: Revoke the lease or let the lifetime pass, then connect again.
          expected: The database rejects the login.
    sv:
      title: Databasinloggningar slutar gälla efter 24 timmar
      description: Begär en databasinloggning från hemlighetshanteraren och kontrollerar att den slutar fungera när livslängden har gått ut.
      preconditions: Hemlighetshanteraren utfärdar dynamiska databasinloggningar i testmiljön; livslängden går att läsa i svaret.
      expected: Inloggningens livslängd är högst 24 timmar och databasen avvisar den därefter.
      steps:
        - action: Begär en databasinloggning med en tjänsts identitet och läs livslängden.
          expected: Livslängden är högst 24 timmar.
        - action: Anslut till databasen med inloggningen.
          expected: Anslutningen lyckas.
        - action: Återkalla lånet eller låt livslängden gå ut och anslut sedan igen.
          expected: Databasen avvisar inloggningen.

  - id: SECR-T05
    priority: high
    execution: manual
    tags: [audit, logging]
    refs: ["CWE-778 (insufficient logging)", "MITRE ATT&CK T1555.006 (cloud secrets management stores)"]
    en:
      title: Secret access appears in the audit log without the value
      description: Reads and changes a test secret and checks the audit log of the secrets manager.
      preconditions: A test secret with a known value; read access to the audit log of the secrets manager.
      expected: Each operation has a log entry with time, identity and name, and the value appears in no entry.
      steps:
        - action: Read the test secret with a service identity.
          expected: An entry with the time, the identity and the secret's name appears in the audit log within 1 minute.
        - action: Change the value of the test secret with an administrator account.
          expected: An entry with the time, the administrator's identity and the secret's name appears.
        - action: Search the audit log for the old and the new value.
          expected: Neither value is found.
    sv:
      title: Åtkomst till hemligheter syns i granskningsloggen utan värdet
      description: Läser och ändrar en testhemlighet och kontrollerar hemlighetshanterarens granskningslogg.
      preconditions: En testhemlighet med känt värde; läsåtkomst till hemlighetshanterarens granskningslogg.
      expected: Varje åtgärd har en loggpost med tid, identitet och namn, och värdet finns inte i någon post.
      steps:
        - action: Läs testhemligheten med en tjänsteidentitet.
          expected: En post med tid, identitet och hemlighetens namn syns i granskningsloggen inom 1 minut.
        - action: Ändra testhemlighetens värde med ett administratörskonto.
          expected: En post med tid, administratörens identitet och hemlighetens namn syns.
        - action: Sök i granskningsloggen efter det gamla och det nya värdet.
          expected: Inget av värdena hittas.

  - id: SECR-T06
    priority: critical
    execution: manual
    tags: [revocation, drill]
    refs: ["NIST SP 800-61 Rev. 2 §3.3", "ISO/IEC 27001:2022 A.5.26", "ISO/IEC 27001:2022 A.5.17", "MITRE ATT&CK T1552 (unsecured credentials)"]
    en:
      title: Drill for a leaked secret
      description: Plants a test secret as if it had leaked and measures the time until it is revoked and replaced.
      preconditions: A test secret used by a service in staging; the written revocation procedure; the on-call engineer is not told the time of the drill.
      expected: The secret is revoked and replaced within 1 hour and the old value no longer works.
      steps:
        - action: Report the test secret as leaked through the normal security reporting channel and note the time.
          expected: The on-call engineer acknowledges the report.
        - action: Let the team follow the written procedure without help.
          expected: The team revokes the secret, issues a new one and updates the services within 1 hour.
          data: "start time and end time from the incident record"
        - action: Use the old value against the service.
          expected: The request is rejected.
        - action: Compare the steps taken with the written procedure.
          expected: Each deviation is recorded and the procedure is updated.
    sv:
      title: Övning med en läckt hemlighet
      description: Placerar ut en testhemlighet som om den hade läckt och mäter tiden tills den har återkallats och ersatts.
      preconditions: En testhemlighet som en tjänst i staging använder; den skriftliga rutinen för återkallelse; jourhavande tekniker får inte veta tidpunkten för övningen.
      expected: Hemligheten återkallas och ersätts inom 1 timme och det gamla värdet fungerar inte längre.
      steps:
        - action: Rapportera testhemligheten som läckt via den vanliga kanalen för säkerhetsrapporter och notera tiden.
          expected: Jourhavande tekniker bekräftar rapporten.
        - action: Låt teamet följa den skriftliga rutinen utan hjälp.
          expected: Teamet återkallar hemligheten, utfärdar en ny och uppdaterar tjänsterna inom 1 timme.
          data: "start- och sluttid från incidentposten"
        - action: Använd det gamla värdet mot tjänsten.
          expected: Anropet avvisas.
        - action: Jämför de utförda stegen med den skriftliga rutinen.
          expected: Varje avvikelse registreras och rutinen uppdateras.

  - id: SECR-T07
    priority: high
    execution: manual
    tags: [command-line, url, exposure]
    refs: ["MITRE ATT&CK T1552 (unsecured credentials)"]
    en:
      title: Secrets do not appear in process listings or access logs
      description: Lists the command lines of the running services and searches the access logs for secret values.
      preconditions: Shell access to a production-like host; the values of the test environment's secrets are known to the tester; 24 hours of access logs.
      expected: No secret value is found in command lines, URLs or access logs.
      steps:
        - action: List the full command lines of all service processes on the host.
          expected: No command line contains a password, key or token.
        - action: Search 24 hours of access logs and proxy logs for the known secret values and for query parameters named token, key, secret or password.
          expected: No match is found.
          data: "parameter names: token, key, secret, password, api_key"
    sv:
      title: Hemligheter syns inte i processlistor eller åtkomstloggar
      description: Listar kommandoraderna för de körande tjänsterna och söker efter hemliga värden i åtkomstloggarna.
      preconditions: Skalåtkomst till en produktionslik värd; testaren känner till värdena på testmiljöns hemligheter; åtkomstloggar för 24 timmar.
      expected: Inget hemligt värde finns i kommandorader, URL:er eller åtkomstloggar.
      steps:
        - action: Lista de fullständiga kommandoraderna för alla tjänsteprocesser på värden.
          expected: Ingen kommandorad innehåller ett lösenord, en nyckel eller en token.
        - action: Sök i 24 timmars åtkomst- och proxyloggar efter de kända hemliga värdena och efter frågeparametrar som heter token, key, secret eller password.
          expected: Ingen träff hittas.
          data: "parameternamn: token, key, secret, password, api_key"

  - id: SECR-T08
    priority: high
    execution: manual
    tags: [api-key, hashing, user-interface]
    refs: ["CWE-257 (storing passwords in a recoverable format)"]
    en:
      title: A new API key is shown once and stored as a hash
      description: Creates an API key, checks where it is shown afterwards and inspects how it is stored.
      preconditions: A signed-in user who may create API keys; read access to the database of the test environment.
      expected: The full key is shown only in the creation dialog, and the database holds only a hash and the last 4 characters.
      steps:
        - action: Create an API key and copy the value shown in the dialog.
          expected: The full key is shown together with a notice that it is not shown again.
        - action: Close the dialog and open the key list, the key's detail page and the API response for the key.
          expected: Each shows at most the last 4 characters.
        - action: Search the database for the copied value.
          expected: The value is not found; the row holds a keyed hash, a key id and the last 4 characters.
        - action: Call the API with the copied key.
          expected: The call is authenticated.
    sv:
      title: En ny API-nyckel visas en gång och lagras som hashvärde
      description: Skapar en API-nyckel, kontrollerar var den visas efteråt och granskar hur den lagras.
      preconditions: En inloggad användare som får skapa API-nycklar; läsåtkomst till testmiljöns databas.
      expected: Hela nyckeln visas bara i dialogrutan för skapande, och databasen innehåller bara ett hashvärde och de 4 sista tecknen.
      steps:
        - action: Skapa en API-nyckel och kopiera värdet som visas i dialogrutan.
          expected: Hela nyckeln visas tillsammans med ett meddelande om att den inte visas igen.
        - action: Stäng dialogrutan och öppna nyckellistan, nyckelns detaljsida och API-svaret för nyckeln.
          expected: Var och en visar högst de 4 sista tecknen.
        - action: Sök i databasen efter det kopierade värdet.
          expected: Värdet hittas inte; raden innehåller ett nyckelbaserat hashvärde, ett nyckel-id och de 4 sista tecknen.
        - action: Anropa API:et med den kopierade nyckeln.
          expected: Anropet autentiseras.

  - id: SECR-T09
    priority: high
    execution: automated
    tags: [environments, separation]
    refs: ["MITRE ATT&CK T1078 (valid accounts)"]
    en:
      title: Staging secrets are rejected in production
      description: Uses the secrets of the staging environment against production and compares the secret paths of both environments.
      preconditions: A read-only test account in production; the staging secrets are available to the test script.
      expected: Every staging secret is rejected by production, and the environments use separate paths and policies.
      steps:
        - action: Call the production API with the staging API key and a token signed with the staging signing key.
          expected: Both calls are rejected with 401.
        - action: Connect to the production database with the staging database password.
          expected: The login is rejected.
        - action: Compare the secret paths and access policies of staging and production.
          expected: No path or policy is shared between the environments.
    sv:
      title: Stagingmiljöns hemligheter avvisas i produktion
      description: Använder stagingmiljöns hemligheter mot produktion och jämför hemlighetssökvägarna i båda miljöerna.
      preconditions: Ett testkonto med enbart läsrätt i produktion; stagingmiljöns hemligheter är tillgängliga för testskriptet.
      expected: Varje hemlighet från staging avvisas av produktion, och miljöerna använder egna sökvägar och policyer.
      steps:
        - action: Anropa produktionens API med stagingmiljöns API-nyckel och med en token signerad med stagingmiljöns signeringsnyckel.
          expected: Båda anropen avvisas med 401.
        - action: Anslut till produktionsdatabasen med stagingmiljöns databaslösenord.
          expected: Inloggningen avvisas.
        - action: Jämför hemlighetssökvägar och åtkomstpolicyer i staging och produktion.
          expected: Ingen sökväg eller policy delas mellan miljöerna.

  - id: SECR-T10
    priority: medium
    execution: manual
    tags: [inventory, review, expiry]
    refs: []
    en:
      title: Review of the secrets inventory and expiry warnings
      description: Compares the inventory with the secrets manager and checks that expiry warnings reach the owners.
      preconditions: The secrets inventory and an export of the secrets manager's entries; a test certificate that expires in 29 days.
      expected: Each secret has an inventory entry with owner, purpose and rotation date, and the owner of the test certificate is warned.
      steps:
        - action: Compare the list of secrets in the secrets manager with the inventory.
          expected: Each secret has an entry, and each entry names an owner, a purpose and the services that use it.
        - action: Check the last rotation date and expiry date of each entry.
          expected: Each entry has both dates filled in.
        - action: Wait for the next run of the expiry check for the test certificate.
          expected: The certificate's owner receives a warning that it expires within 30 days.
          data: "test certificate valid for 29 more days"
    sv:
      title: Granskning av förteckningen över hemligheter och varningar om utgång
      description: Jämför förteckningen med hemlighetshanteraren och kontrollerar att varningar om utgång når ägarna.
      preconditions: Förteckningen över hemligheter och en export av posterna i hemlighetshanteraren; ett testcertifikat som slutar gälla om 29 dagar.
      expected: Varje hemlighet har en post i förteckningen med ägare, syfte och rotationsdatum, och testcertifikatets ägare får en varning.
      steps:
        - action: Jämför listan med hemligheter i hemlighetshanteraren med förteckningen.
          expected: Varje hemlighet har en post, och varje post anger ägare, syfte och tjänsterna som använder den.
        - action: Kontrollera senaste rotationsdatum och utgångsdatum för varje post.
          expected: Varje post har båda datumen ifyllda.
        - action: Vänta på nästa körning av utgångskontrollen för testcertifikatet.
          expected: Certifikatets ägare får en varning om att det slutar gälla inom 30 dagar.
          data: "testcertifikatet gäller i 29 dagar till"

  - id: SECR-T11
    priority: high
    execution: manual
    tags: [workload-identity]
    refs: ["CSA Cloud Controls Matrix v4.0 IAM", "MITRE ATT&CK T1552.001 (credentials in files)", "MITRE ATT&CK T1078.004 (cloud accounts)"]
    en:
      title: Services use short-lived workload credentials
      description: Lists the access keys of service identities and inspects the credentials a running service uses.
      preconditions: Read access to the cloud account's identity settings and a shell in a running service container in the test environment.
      expected: No long-lived keys exist for services and the running service holds credentials that expire within 1 hour.
      steps:
        - action: List the access keys of every service identity in the cloud account.
          expected: No active long-lived access key is listed.
        - action: In the service container, read the expiry time of the credentials the cloud SDK uses.
          expected: The credentials expire no more than 1 hour after they were issued.
    sv:
      title: Tjänster använder kortlivade uppgifter för arbetslastidentitet
      description: Listar åtkomstnycklarna för tjänsteidentiteter och granskar de autentiseringsuppgifter som en körande tjänst använder.
      preconditions: Läsbehörighet till molnkontots identitetsinställningar och ett skal i en körande tjänstecontainer i testmiljön.
      expected: Det finns inga långlivade nycklar för tjänster och den körande tjänsten har uppgifter som går ut inom 1 timme.
      steps:
        - action: Lista åtkomstnycklarna för varje tjänsteidentitet i molnkontot.
          expected: Ingen aktiv långlivad åtkomstnyckel listas.
        - action: Läs i tjänstecontainern utgångstiden för de uppgifter som molnets SDK använder.
          expected: Uppgifterna går ut högst 1 timme efter att de utfärdades.

  - id: SECR-T12
    priority: high
    execution: manual
    tags: [dual-control]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 (split knowledge and dual control)", "MITRE ATT&CK M1026 (privileged account management)"]
    en:
      title: Root access to the secrets manager needs two administrators
      description: Tries to use the root or recovery credential of a test secrets manager with one and with two administrators.
      preconditions: A test instance of the secrets manager set up like production, and two administrators with their key shares or approval rights.
      expected: One administrator alone cannot use the root credential.
      steps:
        - action: Administrator A tries to unseal the secrets manager or generate a root token alone.
          expected: The attempt fails and is logged.
        - action: Administrator B approves or adds the second share.
          expected: The operation succeeds and the log names both administrators.
    sv:
      title: Rotåtkomst till hemlighetshanteraren kräver två administratörer
      description: Försöker använda rot- eller återställningsuppgiften för en testinstans av hemlighetshanteraren med en och med två administratörer.
      preconditions: En testinstans av hemlighetshanteraren inställd som i produktion, och två administratörer med sina nyckelandelar eller rätt att godkänna.
      expected: En administratör ensam kan inte använda rotuppgiften.
      steps:
        - action: Administratör A försöker ensam låsa upp hemlighetshanteraren eller skapa en rottoken.
          expected: Försöket misslyckas och loggas.
        - action: Administratör B godkänner eller lägger till den andra andelen.
          expected: Åtgärden lyckas och loggen anger båda administratörerna.

  - id: SECR-T13
    priority: high
    execution: manual
    tags: [ci-cd, masking]
    refs: ["OWASP Top 10 CI/CD Security Risks CICD-SEC-6", "CWE-532 (insertion of sensitive information into log file)", "MITRE ATT&CK T1677 (poisoned pipeline execution)"]
    en:
      title: Fork pull requests get no secrets and logs mask them
      description: Opens a pull request from a fork that tries to print secrets, and runs a trusted build that echoes a secret.
      preconditions: A fork of the repository owned by a test account without write access, and a known test secret configured in the pipeline.
      expected: No secret reaches the fork's build and the trusted build log shows only a mask.
      steps:
        - action: In the fork, change the build script to print all environment variables and open a pull request.
          expected: The build runs without deployment secrets and the log shows none of them.
        - action: On a branch of the main repository, add a step that echoes the test secret and run it.
          expected: The log shows a mask such as *** in place of the value.
    sv:
      title: Pull requests från förgreningar får inga hemligheter och loggarna maskerar dem
      description: Öppnar en pull request från en förgrening som försöker skriva ut hemligheter, och kör ett betrott bygge som skriver ut en hemlighet.
      preconditions: En förgrening av förrådet som ägs av ett testkonto utan skrivbehörighet, och en känd testhemlighet konfigurerad i pipelinen.
      expected: Ingen hemlighet når förgreningens bygge och det betrodda byggets logg visar bara en mask.
      steps:
        - action: Ändra byggskriptet i förgreningen så att det skriver ut alla miljövariabler och öppna en pull request.
          expected: Bygget körs utan driftsättningshemligheter och loggen visar ingen av dem.
        - action: Lägg i en gren i huvudförrådet till ett steg som skriver ut testhemligheten och kör det.
          expected: Loggen visar en mask, till exempel ***, i stället för värdet.

  - id: SECR-T14
    priority: medium
    execution: manual
    tags: [containers, environment-variables]
    refs: ["CWE-526 (cleartext storage of sensitive information in an environment variable)", "MITRE ATT&CK T1552 (unsecured credentials)"]
    en:
      title: No secrets in the container environment
      description: Inspects a running service container for secrets in environment variables and checks the secret files.
      preconditions: Access to the container runtime in the test environment and a known test secret given to the service.
      expected: The secret is only in a protected file on an in-memory volume.
      steps:
        - action: Inspect the container's environment variables.
          expected: The test secret does not appear.
        - action: List the mounts of the container and the permissions of the secret file.
          expected: The file is on a tmpfs mount, has mode 0400 and is owned by the service user.
    sv:
      title: Inga hemligheter i containerns miljö
      description: Granskar en körande tjänstecontainer efter hemligheter i miljövariabler och kontrollerar hemlighetsfilerna.
      preconditions: Åtkomst till containermiljön i testmiljön och en känd testhemlighet som ges till tjänsten.
      expected: Hemligheten finns bara i en skyddad fil på en minnesbaserad volym.
      steps:
        - action: Granska containerns miljövariabler.
          expected: Testhemligheten förekommer inte.
        - action: Lista containerns monteringar och rättigheterna för hemlighetsfilen.
          expected: Filen ligger på en tmpfs-montering, har rättigheterna 0400 och ägs av tjänstens användare.

risks:
  - id: SECR-R01
    category: security
    likelihood: 4
    impact: 4
    tags: [leaked-secret, source-code]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "ENISA Threat Landscape 2024", "CWE-798 (use of hard-coded credentials)", "CWE-532 (insertion of sensitive information into log file)"]
    mitigated_by: [SECR-01, CRY-07, SECR-08, SECR-15, SLOG-03]
    attack: [T1552.001]
    en:
      title: Credentials leak through code, logs or command lines
      description: A password or key is committed to the repository, printed in a build log or passed on a command line. Anyone with access to the repository, logs or process list uses it to reach production.
      mitigation: Read secrets from a secrets manager, keep them out of code, images, logs, command lines and URLs, and protect pipeline secrets from forks.
    sv:
      title: Inloggningsuppgifter läcker via kod, loggar eller kommandorader
      description: Ett lösenord eller en nyckel checkas in i kodförrådet, skrivs ut i en bygglogg eller skickas på en kommandorad. Den som har åtkomst till kodförrådet, loggarna eller processlistan använder den för att nå produktion.
      mitigation: Läs hemligheter från en hemlighetshanterare, håll dem borta från kod, avbilder, loggar, kommandorader och adresser och skydda pipelinens hemligheter från förgreningar.
  - id: SECR-R02
    category: security
    likelihood: 3
    impact: 4
    tags: [long-lived-secret, rotation]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "CWE-324 (use of a key past its expiration date)"]
    mitigated_by: [SECR-03, SECR-05, SECR-07, SECR-13, SECR-04]
    attack: [T1552, T1078.004]
    en:
      title: Leaked secret stays valid for months
      description: A static key or database password is never rotated and nobody knows where it is used. Once it leaks, the attacker keeps access long after the leak because revoking it would break the service.
      mitigation: Rotate long-lived secrets without restarts, use short-lived database credentials and workload identity, and revoke leaked secrets within one hour.
    sv:
      title: Läckt hemlighet fortsätter att gälla i månader
      description: En statisk nyckel eller ett databaslösenord byts aldrig och ingen vet var den används. När den läcker behåller angriparen åtkomsten långt efter läckan eftersom ett återkallande skulle stoppa tjänsten.
      mitigation: Byt långlivade hemligheter utan omstart, använd kortlivade databasinloggningar och arbetslastidentitet och återkalla läckta hemligheter inom en timme.
  - id: SECR-R03
    category: security
    likelihood: 2
    impact: 5
    tags: [secrets-manager, privileged-access]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "CWE-522 (insufficiently protected credentials)", "MITRE ATT&CK M1026 (privileged account management)"]
    mitigated_by: [SECR-02, SECR-06, SECR-14, SECR-11]
    attack: [T1555.006]
    en:
      title: Secrets manager misused to read every secret
      description: A service or administrator can read all secrets, including those of other environments, and reads are not logged. One compromised identity unlocks the whole system without trace.
      mitigation: Let each secret be readable only by the services that use it, log reads and changes, require two people for root access and keep separate secrets for each environment.
    sv:
      title: Hemlighetshanteraren missbrukas för att läsa alla hemligheter
      description: En tjänst eller administratör kan läsa alla hemligheter, även andra miljöers, och läsningarna loggas inte. En enda komprometterad identitet låser upp hela systemet utan spår.
      mitigation: Låt varje hemlighet vara läsbar bara för de tjänster som använder den, logga läsningar och ändringar, kräv två personer för rotåtkomst och ha separata hemligheter för varje miljö.
  - id: SECR-R04
    category: supply-chain
    likelihood: 3
    impact: 5
    tags: [ci-secrets, pull-requests]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 CI/CD Security Risks CICD-SEC-6", "CWE-200 (exposure of sensitive information to an unauthorized actor)"]
    mitigated_by: [SECR-15, SECR-11, SUP-16]
    attack: [T1677, T1552.001]
    en:
      title: Pipeline secrets stolen through a pull request
      description: A pull request from a fork changes the pipeline so that it prints or sends out the deployment secrets. The attacker uses them to publish releases or reach production.
      mitigation: Keep pipeline secrets from forks and logs, use separate secrets per environment and pin third-party pipeline steps.
    sv:
      title: Hemligheter i byggkedjan stjäls via en pull request
      description: En pull request från en förgrening ändrar byggkedjan så att den skriver ut eller skickar iväg hemligheterna för driftsättning. Angriparen använder dem för att publicera releaser eller nå produktionen.
      mitigation: Håll hemligheter i byggkedjan borta från förgreningar och loggar, använd separata hemligheter per miljö och lås externa byggsteg.
  - id: SECR-R05
    category: security
    likelihood: 3
    impact: 4
    tags: [static-cloud-keys, workload-identity]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "NIST SP 800-207 §3.1.1 (enhanced identity governance)", "CWE-798 (use of hard-coded credentials)"]
    mitigated_by: [SECR-13, SECR-05, SECR-12]
    attack: [T1078.004, T1552.001]
    en:
      title: Long-lived cloud key copied from a server
      description: Services use static cloud access keys stored in configuration. A key copied from one server gives an attacker access to the cloud account from anywhere, for as long as it exists.
      mitigation: Use workload identity instead of static cloud keys, short-lived database credentials and an inventory of remaining secrets with owner and expiry.
    sv:
      title: Långlivad molnnyckel kopieras från en server
      description: Tjänster använder statiska åtkomstnycklar till molnet som lagras i konfigurationen. En nyckel som kopieras från en server ger angriparen åtkomst till molnkontot var som helst ifrån, så länge den finns.
      mitigation: Använd arbetslastidentitet i stället för statiska molnnycklar, kortlivade databasuppgifter och en förteckning över kvarvarande hemligheter med ägare och utgångsdatum.
