area: security-logging
prefix: SLOG
group: security
name: {en: Security logging and monitoring, sv: Säkerhetsloggning och övervakning}
description:
  en: Logging of security events, keeping secrets out of logs, log integrity and retention, alerting on suspicious activity and time synchronisation.
  sv: Loggning av säkerhetshändelser, hemligheter som hålls borta från loggar, loggarnas integritet och lagringstid, larm vid misstänkt aktivitet och tidssynkronisering.

requirements:
  - id: SLOG-01
    type: security
    obligation: must
    priority: high
    tags: [security-events, logging]
    refs: ["OWASP ASVS 5.0 V16.3 (security events)", "OWASP Top 10 2021 A09", "NIST SP 800-53 AU-2", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 2.8", "IEC 62443-4-2 CR 2.8", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(l)", "CWE-778 (insufficient logging)", "CWE-223 (omission of security-relevant information)"]
    tests: [SLOG-T01]
    en:
      title: Security events are logged
      description: The system MUST log successful and failed sign-ins, sign-outs, password and multi-factor changes, permission changes and denied access attempts.
      rationale: Without these events an attack cannot be detected while it happens or reconstructed afterwards.
      criteria:
        - method: test
          text: Each of the listed events, triggered once in the test environment, produces exactly one log record.
    sv:
      title: Säkerhetshändelser loggas
      description: Systemet SKA logga lyckade och misslyckade inloggningar, utloggningar, ändringar av lösenord och flerfaktorsinställningar, ändrade behörigheter och nekade åtkomstförsök.
      rationale: Utan de här händelserna går det varken att upptäcka en attack medan den pågår eller att rekonstruera den efteråt.
      criteria:
        - method: test
          text: Var och en av de listade händelserna ger, när den utlöses en gång i testmiljön, exakt en loggpost.

  - id: SLOG-02
    type: security
    obligation: must
    priority: high
    tags: [log-content, logging]
    refs: ["OWASP ASVS 5.0 V16.2.1 (log entry metadata)", "NIST SP 800-53 AU-3", "OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.15", "ISO/IEC 27002:2022 §8.15", "IEC 62443-3-3 SR 2.8", "CWE-223 (omission of security-relevant information)"]
    tests: [SLOG-T01]
    en:
      title: Content of a security log record
      description: The system MUST include the time in UTC, the user or client id, the source IP address, the event type and the outcome in each security log record.
      rationale: Investigators need to know who did what, from where and when, and whether it succeeded.
      criteria:
        - method: inspection
          text: Ten sampled security log records each contain all five fields with non-empty values.
    sv:
      title: Innehåll i en säkerhetsloggpost
      description: Systemet SKA ta med tidpunkt i UTC, användar- eller klient-id, källans IP-adress, händelsetyp och utfall i varje säkerhetsloggpost.
      rationale: Den som utreder en händelse behöver veta vem som gjorde vad, varifrån och när, och om det lyckades.
      criteria:
        - method: inspection
          text: Tio stickprov bland säkerhetsloggposterna innehåller vart och ett alla fem fälten med ifyllda värden.

  - id: SLOG-03
    type: security
    obligation: must_not
    priority: critical
    tags: [secrets, sensitive-data, logging]
    refs: ["OWASP ASVS 5.0 V16.2.5 (sensitive data in logs)", "OWASP Logging Cheat Sheet", "PCI DSS v4.0.1 Req. 3.3", "ISO/IEC 27001:2022 A.8.15", "CWE-532 (insertion of sensitive information into log file)"]
    tests: [SLOG-T02]
    en:
      title: No secrets in logs
      description: The system MUST NOT write passwords, session tokens, API keys, one-time codes or full payment card numbers to any log.
      rationale: Logs are read by many people and tools and are kept for a long time, so a secret written there is effectively disclosed.
      criteria:
        - method: test
          text: After a scripted session that uses known secret values, a search of all logs finds none of them.
    sv:
      title: Inga hemligheter i loggar
      description: Systemet SKA INTE skriva lösenord, sessionstoken, API-nycklar, engångskoder eller fullständiga kortnummer till någon logg.
      rationale: Loggar läses av många personer och verktyg och sparas länge, så en hemlighet som skrivs dit är i praktiken röjd.
      criteria:
        - method: test
          text: Efter en skriptad session som använder kända hemliga värden hittar en sökning i alla loggar inget av dem.

  - id: SLOG-04
    type: security
    obligation: must
    priority: medium
    tags: [log-injection, encoding]
    refs: ["OWASP ASVS 5.0 V16.4.1 (log injection)", "OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-117 (improper output neutralization for logs)"]
    tests: [SLOG-T03]
    en:
      title: Protection against log injection
      description: The system MUST encode line breaks and control characters in user-supplied values before it writes them to a log.
      rationale: Unencoded line breaks let an attacker forge log records that mislead investigators or monitoring rules.
      criteria:
        - method: test
          text: A user name with an embedded line break produces one log record in which the line break is shown as an escape sequence.
    sv:
      title: Skydd mot injektion i loggar
      description: Systemet SKA koda radbrytningar och styrtecken i värden från användare innan de skrivs till en logg.
      rationale: Okodade radbrytningar låter en angripare förfalska loggposter som vilseleder utredare och övervakningsregler.
      criteria:
        - method: test
          text: Ett användarnamn med en inbäddad radbrytning ger en enda loggpost där radbrytningen visas som en escape-sekvens.

  - id: SLOG-05
    type: security
    obligation: must
    priority: high
    tags: [log-integrity, central-logging]
    refs: ["OWASP ASVS 5.0 V16.4.3 (logs sent to a separate system)", "NIST SP 800-53 AU-9", "ISO/IEC 27001:2022 A.8.15", "PCI DSS v4.0.1 Req. 10.3", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(f)", "MITRE ATT&CK T1070 (indicator removal)", "MITRE ATT&CK M1029 (remote data storage)"]
    tests: [SLOG-T04]
    en:
      title: Logs are protected from change
      description: The system MUST send security log records within 1 minute to a central store where the application's own accounts cannot change or delete them.
      rationale: An attacker who takes over the application otherwise erases the traces of the attack.
      criteria:
        - method: test
          text: A new log record appears in the central store within 1 minute, and an attempt to delete it with the application's credentials is refused.
    sv:
      title: Loggar skyddas mot ändring
      description: Systemet SKA skicka säkerhetsloggposter inom 1 minut till ett centralt lager där applikationens egna konton inte kan ändra eller radera dem.
      rationale: En angripare som tar över applikationen sopar annars igen spåren efter attacken.
      criteria:
        - method: test
          text: En ny loggpost syns i det centrala lagret inom 1 minut, och ett försök att radera den med applikationens inloggningsuppgifter avvisas.

  - id: SLOG-06
    type: security
    obligation: must
    priority: high
    tags: [alerting, credential-stuffing]
    refs: ["OWASP ASVS 5.0 V16.3.1 (authentication events)", "NIST SP 800-53 SI-4", "ISO/IEC 27001:2022 A.8.16", "OWASP Top 10 2021 A09", "IEC 62443-3-3 SR 6.2", "Regulation (EU) 2022/2554 (DORA) Art. 10", "MITRE ATT&CK T1110.003 (password spraying)", "MITRE ATT&CK T1110.004 (credential stuffing)"]
    tests: [SLOG-T05]
    en:
      title: Alert on mass sign-in failures
      description: The system MUST alert the security on-call within 15 minutes when more than 50 sign-ins fail within 5 minutes across all accounts.
      rationale: Credential stuffing spreads attempts over many accounts and is not caught by per-account limits alone.
      criteria:
        - method: test
          text: 60 failed sign-ins spread over 30 accounts within 5 minutes create an alert that reaches the on-call channel within 15 minutes.
    sv:
      title: Larm vid många misslyckade inloggningar
      description: Systemet SKA larma säkerhetsjouren inom 15 minuter när mer än 50 inloggningar misslyckas inom 5 minuter sammanlagt för alla konton.
      rationale: Attacker med läckta inloggningsuppgifter sprider försöken över många konton och fångas inte av gränser per konto.
      criteria:
        - method: test
          text: 60 misslyckade inloggningar fördelade på 30 konton inom 5 minuter skapar ett larm som når jourkanalen inom 15 minuter.

  - id: SLOG-07
    type: security
    obligation: should
    priority: medium
    tags: [alerting, privileged-access]
    refs: ["NIST SP 800-53 AC-2(4)", "ISO/IEC 27001:2022 A.8.16", "IEC 62443-3-3 SR 6.2", "Regulation (EU) 2022/2554 (DORA) Art. 10", "MITRE ATT&CK T1098 (account manipulation)"]
    tests: [SLOG-T06]
    en:
      title: Alert on new administrator rights
      description: The system SHOULD alert the security on-call within 15 minutes when an account is given the administrator role.
      rationale: Granting administrator rights is a common step after an account takeover and is rare in normal operation.
      criteria:
        - method: test
          text: Granting the administrator role to a test account creates an alert with the account, the granting user and the time within 15 minutes.
    sv:
      title: Larm vid ny administratörsbehörighet
      description: Systemet BÖR larma säkerhetsjouren inom 15 minuter när ett konto tilldelas administratörsrollen.
      rationale: Att ge administratörsbehörighet är ett vanligt steg efter att ett konto har kapats och sker sällan i normal drift.
      criteria:
        - method: test
          text: När administratörsrollen ges till ett testkonto skapas inom 15 minuter ett larm med kontot, den som tilldelade rollen och tidpunkten.

  - id: SLOG-08
    type: security
    obligation: must
    priority: medium
    tags: [time-synchronisation, ntp]
    refs: ["NIST SP 800-53 AU-8", "ISO/IEC 27001:2022 A.8.17", "PCI DSS v4.0.1 Req. 10.6", "IEC 62443-3-3 SR 2.11", "IEC 62443-4-2 CR 2.11", "ISO/IEC 27019:2024 (clock synchronisation)"]
    tests: [SLOG-T07]
    en:
      title: Synchronised clocks
      description: The system MUST keep the clock of every server within 1 second of a common NTP time source.
      rationale: Events from different servers can only be put in the right order when their clocks agree.
      criteria:
        - method: inspection
          text: Each server has the same NTP source configured and its measured offset is below 1 second.
    sv:
      title: Synkroniserade klockor
      description: Systemet SKA hålla klockan på varje server inom 1 sekund från en gemensam NTP-tidskälla.
      rationale: Händelser från olika servrar går bara att lägga i rätt ordning när deras klockor stämmer överens.
      criteria:
        - method: inspection
          text: Varje server har samma NTP-källa konfigurerad och dess uppmätta avvikelse är under 1 sekund.

  - id: SLOG-09
    type: security
    obligation: should
    priority: medium
    tags: [log-retention]
    refs: ["PCI DSS v4.0.1 Req. 10.5.1", "NIST SP 800-53 AU-11", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 2.9"]
    tests: [SLOG-T08]
    en:
      title: Retention of security logs
      description: The system SHOULD keep security log records for at least 12 months, with the latest 3 months searchable without a restore.
      rationale: Breaches are often found months after they started, and investigators then need the old records.
      criteria:
        - method: inspection
          text: The retention setting of the log store is 12 months or more, and a search for a record that is 80 days old returns it directly.
    sv:
      title: Lagringstid för säkerhetsloggar
      description: Systemet BÖR spara säkerhetsloggposter i minst 12 månader, varav de senaste 3 månaderna går att söka i utan återläsning.
      rationale: Intrång upptäcks ofta flera månader efter att de började, och den som utreder behöver då de gamla posterna.
      criteria:
        - method: inspection
          text: Lagringstiden för logglagret är 12 månader eller mer, och en sökning efter en post som är 80 dagar gammal ger träff direkt.

  - id: SLOG-10
    type: security
    obligation: may
    priority: low
    tags: [siem, log-format]
    refs: ["RFC 5424", "OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 6.1"]
    tests: [SLOG-T09]
    en:
      title: Structured log format for a SIEM
      description: The system MAY write security log records as one JSON object per line so that a SIEM can read them without custom parsing.
      rationale: A structured format lets monitoring tools filter and correlate events without fragile text patterns.
      criteria:
        - method: inspection
          text: Each security log line is a valid JSON object with named fields for time, actor, source, event and outcome.
    sv:
      title: Strukturerat loggformat för SIEM
      description: Systemet FÅR skriva säkerhetsloggposter som ett JSON-objekt per rad så att ett SIEM-system kan läsa dem utan egen tolkning.
      rationale: Ett strukturerat format låter övervakningsverktyg filtrera och samköra händelser utan bräckliga textmönster.
      criteria:
        - method: inspection
          text: Varje rad i säkerhetsloggen är ett giltigt JSON-objekt med namngivna fält för tid, aktör, källa, händelse och utfall.

  - id: SLOG-11
    type: security
    obligation: must
    priority: high
    tags: [log-source, monitoring, alert]
    refs: ["NIST SP 800-53 Rev. 5 AU-5 (response to audit logging process failures)", "PCI DSS v4.0.1 Req. 10.7.2 (failures of critical security control systems)", "ISO/IEC 27001:2022 A.8.16", "IEC 62443-3-3 SR 2.10", "IEC 62443-4-2 CR 2.10", "MITRE ATT&CK T1685 (disable or modify tools)"]
    tests: [SLOG-T10]
    en:
      title: Alert when a log source stops sending
      description: The central log system MUST alert the security team within 15 minutes when a production log source that has sent at least one record per 5 minutes during the previous 24 hours stops sending.
      rationale: Attackers turn off logging first, and a broken log shipper looks the same as a quiet system until someone needs the records.
      criteria:
        - method: test
          text: Stopping the log shipper on one production-like server raises an alert that names the server within 15 minutes.
          threshold: "≤ 15 min"
    sv:
      title: Larm när en loggkälla slutar skicka
      description: Det centrala loggsystemet SKA larma säkerhetsteamet inom 15 minuter när en loggkälla i produktion som har skickat minst en post per 5 minuter under de senaste 24 timmarna slutar skicka.
      rationale: Angripare stänger av loggningen först, och en trasig logginsamlare ser likadan ut som ett tyst system tills någon behöver posterna.
      criteria:
        - method: test
          text: Att stoppa logginsamlaren på en produktionslik server ger ett larm som namnger servern inom 15 minuter.
          threshold: "≤ 15 min"

  - id: SLOG-12
    type: security
    obligation: should
    priority: medium
    tags: [anomaly, administrator, alert]
    refs: ["MITRE ATT&CK T1078 (valid accounts)", "NIST SP 800-53 Rev. 5 SI-4 (system monitoring)", "ISO/IEC 27001:2022 A.8.16", "IEC 62443-3-3 SR 6.2", "Regulation (EU) 2022/2554 (DORA) Art. 10"]
    tests: [SLOG-T11]
    en:
      title: Alert on administrator sign-in from a new country
      description: The system SHOULD alert the security team within 10 minutes when an administrator account signs in from a country it has not signed in from during the last 90 days.
      rationale: Stolen administrator credentials are among the most damaging, and a sign-in from an unexpected place is one of the few early signs.
      criteria:
        - method: test
          text: A sign-in to an administrator account from an address located in a new country raises an alert with account, country and time within 10 minutes, and a sign-in from a known country does not.
          threshold: "≤ 10 min"
    sv:
      title: Larm vid inloggning som administratör från ett nytt land
      description: Systemet BÖR larma säkerhetsteamet inom 10 minuter när ett administratörskonto loggar in från ett land som kontot inte har loggat in från under de senaste 90 dagarna.
      rationale: Stulna inloggningsuppgifter för administratörer hör till de mest skadliga, och en inloggning från en oväntad plats är ett av få tidiga tecken.
      criteria:
        - method: test
          text: En inloggning på ett administratörskonto från en adress i ett nytt land ger ett larm med konto, land och tid inom 10 minuter, och en inloggning från ett känt land ger inget larm.
          threshold: "≤ 10 min"

  - id: SLOG-13
    type: security
    obligation: should
    priority: high
    tags: [alerting, data-exfiltration, export]
    refs: ["NIST SP 800-53 SI-4", "MITRE ATT&CK TA0010 (exfiltration)", "ISO/IEC 27001:2022 A.8.16", "MITRE ATT&CK T1213 (data from information repositories)"]
    tests: [SLOG-T12]
    en:
      title: Alert on bulk export by one user
      description: The system SHOULD alert the security on-call within 15 minutes when one user exports or downloads more than 1 000 records within 1 hour.
      rationale: Data theft by insiders or with stolen accounts often looks like normal use, one export at a time, until the totals are added up.
      criteria:
        - method: test
          text: Exporting 1 001 records within 1 hour raises an alert naming the user and the volume, and exporting 999 records raises none.
          threshold: "> 1 000 records per hour per user"
    sv:
      title: Larm vid massexport av en användare
      description: Systemet BÖR larma säkerhetsjouren inom 15 minuter när en användare exporterar eller laddar ned mer än 1 000 poster inom 1 timme.
      rationale: Datastöld av insiders eller med stulna konton liknar ofta vanlig användning, en export i taget, tills summorna läggs ihop.
      criteria:
        - method: test
          text: Export av 1 001 poster inom 1 timme ger ett larm som anger användaren och mängden, och export av 999 poster ger inget.
          threshold: "> 1 000 poster per timme och användare"

  - id: SLOG-14
    type: security
    obligation: should
    priority: medium
    tags: [alerting, authorisation, enumeration]
    refs: ["OWASP Logging Cheat Sheet", "OWASP Top 10 2021 A09", "NIST SP 800-53 AU-6", "ISO/IEC 27001:2022 A.8.16"]
    tests: [SLOG-T13]
    en:
      title: Alert on repeated denied access by one user
      description: The system SHOULD alert the security on-call within 15 minutes when one signed-in user gets more than 20 responses of 403 or 404 on record identifiers within 5 minutes.
      rationale: A burst of denied requests for many different record identifiers is the trace of someone probing for records they may not read.
      criteria:
        - method: test
          text: 21 denied requests for different record identifiers within 5 minutes raise one alert, and 19 raise none.
          threshold: "> 20 denials in 5 min"
    sv:
      title: Larm vid upprepad nekad åtkomst för en användare
      description: Systemet BÖR larma säkerhetsjouren inom 15 minuter när mer än 20 anrop mot postidentifierare från en inloggad användare besvaras med 403 eller 404 inom 5 minuter.
      rationale: En serie nekade anrop mot olika postidentifierare är spåret efter någon som letar efter poster som personen saknar rätt att läsa.
      criteria:
        - method: test
          text: 21 nekade anrop mot olika postidentifierare inom 5 minuter ger ett larm, och 19 ger inget.
          threshold: "> 20 nekanden på 5 min"

  - id: SLOG-15
    type: security
    obligation: must
    priority: medium
    tags: [correlation, tracing]
    refs: ["W3C Trace Context", "OpenTelemetry specification (logs data model)", "ISO/IEC 27001:2022 A.8.15"]
    tests: [SLOG-T14]
    en:
      title: Correlation identifier across services
      description: The system MUST write the trace identifier of the incoming request in each log record that a service writes while handling that request.
      rationale: An investigation must follow one attacker request through the front end, the API and the back-end services without guessing from timestamps.
      criteria:
        - method: test
          text: One request with a known traceparent header gives log records with the same trace identifier in each service it passes.
    sv:
      title: Korrelationsidentifierare mellan tjänster
      description: Systemet SKA skriva spårningsidentifieraren för det inkommande anropet i varje loggpost som en tjänst skriver medan den hanterar anropet.
      rationale: En utredning ska kunna följa ett anrop från en angripare genom webbgränssnittet, API:et och de bakomliggande tjänsterna utan att gissa utifrån tidsstämplar.
      criteria:
        - method: test
          text: Ett anrop med ett känt traceparent-huvud ger loggposter med samma spårningsidentifierare i varje tjänst som anropet passerar.

  - id: SLOG-16
    type: security
    obligation: should
    priority: medium
    tags: [detection, alert-testing]
    refs: ["NIST SP 800-53 SI-4", "NIST SP 800-61 Rev. 3 (detection)", "ISO/IEC 27001:2022 A.8.16"]
    tests: [SLOG-T15]
    en:
      title: Monthly test of each security alert rule
      description: The supplier SHOULD trigger each security alert rule with test events once a month and record whether the alert reached the on-call within its time limit.
      rationale: Alert rules break silently when log formats, field names or routing change, and the gap is otherwise found during a real attack.
      criteria:
        - method: inspection
          text: The test record for the last 3 months has one entry per alert rule and month, with the time from event to alert.
          threshold: "every rule tested every month"
    sv:
      title: Månatligt test av varje larmregel för säkerhet
      description: Leverantören BÖR utlösa varje larmregel för säkerhet med testhändelser en gång i månaden och registrera om larmet nådde jouren inom sin tidsgräns.
      rationale: Larmregler slutar tyst att fungera när loggformat, fältnamn eller vidarekoppling ändras, och luckan upptäcks annars under ett verkligt angrepp.
      criteria:
        - method: inspection
          text: Testregistret för de senaste 3 månaderna har en post per larmregel och månad, med tiden från händelse till larm.
          threshold: "varje regel testad varje månad"

  - id: SLOG-17
    type: security
    obligation: should
    priority: medium
    tags: [privacy, pseudonymisation, logs]
    refs: ["GDPR Art. 5(1)(c)", "GDPR Art. 32(1)(a)", "OWASP Logging Cheat Sheet", "ISO/IEC 27701:2025 (de-identification)", "CWE-359 (exposure of private personal information)", "CWE-532 (insertion of sensitive information into log file)"]
    tests: [SLOG-T16]
    en:
      title: Users identified by id, not by name, in logs
      description: The system SHOULD identify users in technical and security logs by their internal user id, and write no names, email addresses or personal identity numbers.
      rationale: Logs are copied to many tools and kept long; an internal id still lets investigators find the person while the logs themselves hold less personal data.
      criteria:
        - method: test
          text: A search of one day of logs for the names, email addresses and identity numbers of the test users returns no hits, while their user ids are present.
    sv:
      title: Användare anges med id och inte med namn i loggar
      description: Systemet BÖR identifiera användare i tekniska loggar och säkerhetsloggar med deras interna användar-id, och inte skriva namn, e-postadresser eller personnummer.
      rationale: Loggar kopieras till många verktyg och sparas länge; ett internt id låter ändå utredare hitta personen medan själva loggarna innehåller färre personuppgifter.
      criteria:
        - method: test
          text: En sökning i en dags loggar efter testanvändarnas namn, e-postadresser och personnummer ger inga träffar, medan deras användar-id finns med.

tests:
  - id: SLOG-T01
    priority: high
    execution: automated
    tags: [security-events, log-content]
    refs: ["OWASP Logging Cheat Sheet", "IEC 62443-3-3 SR 2.8", "IEC 62443-4-2 CR 2.8", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(l)", "ISO/IEC 27001:2022 A.8.15", "ISO/IEC 27002:2022 §8.15", "CWE-778 (insufficient logging)", "CWE-223 (omission of security-relevant information)"]
    en:
      title: Security events produce complete log records
      description: A script triggers each security event once and reads the resulting log records.
      preconditions: A test account, an administrator test account and read access to the security log of the test environment.
      expected: Every event is logged once with all required fields.
      steps:
        - action: Sign in successfully, fail a sign-in, sign out, change the password and enrol a second factor.
          expected: One log record exists for each of the five events.
        - action: As the administrator, add a role to the test account; as the test account, open an administration page.
          expected: One record exists for the role change and one for the denied access.
        - action: Check the fields of each of the seven records.
          expected: Each has a UTC time, a user id, a source IP address, an event type and an outcome.
    sv:
      title: Säkerhetshändelser ger fullständiga loggposter
      description: Ett skript utlöser varje säkerhetshändelse en gång och läser de loggposter som uppstår.
      preconditions: Ett testkonto, ett testkonto för administratör och läsbehörighet till säkerhetsloggen i testmiljön.
      expected: Varje händelse loggas en gång med alla obligatoriska fält.
      steps:
        - action: Logga in, misslyckas med en inloggning, logga ut, byt lösenord och registrera en andra faktor.
          expected: Det finns en loggpost för var och en av de fem händelserna.
        - action: Lägg som administratör till en roll på testkontot och öppna som testkontot en administrationssida.
          expected: Det finns en post för rolländringen och en för den nekade åtkomsten.
        - action: Kontrollera fälten i var och en av de sju posterna.
          expected: Var och en har tid i UTC, användar-id, källans IP-adress, händelsetyp och utfall.

  - id: SLOG-T02
    priority: critical
    execution: automated
    tags: [secrets, sensitive-data]
    refs: ["OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.15", "CWE-532 (insertion of sensitive information into log file)"]
    en:
      title: Known secret values never reach the logs
      description: A script runs a session with recognisable secret values and searches every log for them.
      preconditions: Access to all application, access and error logs of the test environment, and a test payment card number if payments exist.
      expected: None of the secret values is found in any log.
      steps:
        - action: Sign in with a marked password, use the session, create an API key, enter a one-time code and submit a test card number.
          expected: Every action succeeds or fails as normal.
          data: "Pw-MARKER-9921, 4111111111111111"
        - action: Trigger an error in the same session so that error logging runs.
          expected: An error is logged.
        - action: Search all logs for the password, session token, API key, one-time code and full card number.
          expected: No match is found; at most the last four digits of the card appear.
    sv:
      title: Kända hemliga värden hamnar aldrig i loggarna
      description: Ett skript kör en session med igenkännbara hemliga värden och söker efter dem i varje logg.
      preconditions: Åtkomst till alla applikations-, åtkomst- och felloggar i testmiljön och ett testkortnummer om betalningar finns.
      expected: Inget av de hemliga värdena hittas i någon logg.
      steps:
        - action: Logga in med ett märkt lösenord, använd sessionen, skapa en API-nyckel, ange en engångskod och skicka ett testkortnummer.
          expected: Varje åtgärd lyckas eller misslyckas som vanligt.
          data: "Pw-MARKER-9921, 4111111111111111"
        - action: Utlös ett fel i samma session så att felloggningen körs.
          expected: Ett fel loggas.
        - action: Sök i alla loggar efter lösenordet, sessionstoken, API-nyckeln, engångskoden och hela kortnumret.
          expected: Ingen träff hittas; högst kortets sista fyra siffror förekommer.

  - id: SLOG-T03
    priority: medium
    execution: automated
    tags: [log-injection]
    refs: ["OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-117 (improper output neutralization for logs)"]
    en:
      title: Line breaks in user input do not forge log records
      description: A script signs in with a user name that contains a line break followed by a fake log record.
      preconditions: Read access to the security log in the test environment.
      expected: Exactly one record is written and the line break is escaped.
      steps:
        - action: Send a failed sign-in with a user name that contains a line break and a forged success record.
          expected: The sign-in fails.
          data: "alice\\n2026-01-01T00:00:00Z LOGIN_SUCCESS user=admin"
        - action: Read the new records in the security log.
          expected: There is one record for the failed sign-in, the line break is shown as an escape sequence and no separate success record exists.
    sv:
      title: Radbrytningar i indata förfalskar inte loggposter
      description: Ett skript loggar in med ett användarnamn som innehåller en radbrytning följd av en falsk loggpost.
      preconditions: Läsbehörighet till säkerhetsloggen i testmiljön.
      expected: Exakt en post skrivs och radbrytningen är kodad.
      steps:
        - action: Skicka en misslyckad inloggning med ett användarnamn som innehåller en radbrytning och en förfalskad post om lyckad inloggning.
          expected: Inloggningen misslyckas.
          data: "alice\\n2026-01-01T00:00:00Z LOGIN_SUCCESS user=admin"
        - action: Läs de nya posterna i säkerhetsloggen.
          expected: Det finns en post för den misslyckade inloggningen, radbrytningen visas som en escape-sekvens och ingen separat post om lyckad inloggning finns.

  - id: SLOG-T04
    priority: high
    execution: manual
    tags: [log-integrity, central-logging]
    refs: ["NIST SP 800-53 AU-9", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(f)", "MITRE ATT&CK T1070 (indicator removal)", "MITRE ATT&CK M1029 (remote data storage)"]
    en:
      title: Central log records arrive in time and cannot be deleted
      description: Checks forwarding latency and write protection of the central log store.
      preconditions: Access to the central log store and the credentials the application uses to send logs.
      expected: Records arrive within 1 minute and the application cannot alter them.
      steps:
        - action: Trigger a failed sign-in and note the time.
          expected: The record is searchable in the central store within 1 minute.
        - action: With the application's log credentials, try to delete or overwrite the record.
          expected: The operation is refused.
        - action: Stop the application server and check the central store.
          expected: All records sent before the stop are still present.
    sv:
      title: Centrala loggposter kommer fram i tid och kan inte raderas
      description: Kontrollerar fördröjningen vid vidarebefordran och skrivskyddet i det centrala logglagret.
      preconditions: Åtkomst till det centrala logglagret och de inloggningsuppgifter som applikationen använder för att skicka loggar.
      expected: Posterna kommer fram inom 1 minut och applikationen kan inte ändra dem.
      steps:
        - action: Utlös en misslyckad inloggning och anteckna tiden.
          expected: Posten går att söka fram i det centrala lagret inom 1 minut.
        - action: Försök radera eller skriva över posten med applikationens inloggningsuppgifter för loggning.
          expected: Åtgärden avvisas.
        - action: Stoppa applikationsservern och kontrollera det centrala lagret.
          expected: Alla poster som skickades före stoppet finns kvar.

  - id: SLOG-T05
    priority: high
    execution: automated
    tags: [alerting, credential-stuffing]
    refs: ["NIST SP 800-53 SI-4", "IEC 62443-3-3 SR 6.2", "Regulation (EU) 2022/2554 (DORA) Art. 10", "MITRE ATT&CK T1110.003 (password spraying)", "MITRE ATT&CK T1110.004 (credential stuffing)"]
    en:
      title: Credential stuffing raises an alert
      description: A script simulates failed sign-ins spread over many accounts and checks the alert channel.
      preconditions: 30 test accounts, a monitored test alert channel and the alert rule active in the test environment.
      expected: An alert reaches the channel within 15 minutes.
      steps:
        - action: Send 60 failed sign-ins spread evenly over the 30 accounts within 5 minutes.
          expected: Every attempt fails with the normal error.
        - action: Watch the alert channel for 15 minutes from the first attempt.
          expected: One alert arrives that states the number of failures and the time window.
    sv:
      title: Massinloggning med läckta uppgifter ger larm
      description: Ett skript simulerar misslyckade inloggningar fördelade på många konton och bevakar larmkanalen.
      preconditions: 30 testkonton, en bevakad larmkanal för test och larmregeln aktiv i testmiljön.
      expected: Ett larm når kanalen inom 15 minuter.
      steps:
        - action: Skicka 60 misslyckade inloggningar jämnt fördelade på de 30 kontona inom 5 minuter.
          expected: Varje försök misslyckas med det vanliga felet.
        - action: Bevaka larmkanalen i 15 minuter från det första försöket.
          expected: Ett larm kommer som anger antalet misslyckanden och tidsfönstret.

  - id: SLOG-T06
    priority: medium
    execution: manual
    tags: [alerting, privileged-access]
    refs: ["NIST SP 800-53 AC-2(4)", "IEC 62443-3-3 SR 6.2", "Regulation (EU) 2022/2554 (DORA) Art. 10", "MITRE ATT&CK T1098 (account manipulation)"]
    en:
      title: Granting administrator rights raises an alert
      description: Grants the administrator role and checks the alert channel.
      preconditions: Two administrator test accounts, an ordinary test account and a monitored test alert channel.
      expected: An alert with the details arrives within 15 minutes.
      steps:
        - action: As administrator 1, give the ordinary test account the administrator role.
          expected: The role is granted.
        - action: Watch the alert channel for 15 minutes.
          expected: An alert arrives that names the account, administrator 1 and the time.
    sv:
      title: Tilldelad administratörsbehörighet ger larm
      description: Ger administratörsrollen till ett konto och bevakar larmkanalen.
      preconditions: Två testkonton för administratörer, ett vanligt testkonto och en bevakad larmkanal för test.
      expected: Ett larm med uppgifterna kommer inom 15 minuter.
      steps:
        - action: Ge som administratör 1 det vanliga testkontot administratörsrollen.
          expected: Rollen tilldelas.
        - action: Bevaka larmkanalen i 15 minuter.
          expected: Ett larm kommer som anger kontot, administratör 1 och tidpunkten.

  - id: SLOG-T07
    priority: medium
    execution: automated
    tags: [time-synchronisation, ntp]
    refs: ["NIST SP 800-53 AU-8", "IEC 62443-3-3 SR 2.11", "IEC 62443-4-2 CR 2.11", "ISO/IEC 27019:2024 (clock synchronisation)"]
    en:
      title: Server clocks are within one second of NTP
      description: A script queries the time configuration and offset of every server.
      preconditions: Shell or monitoring access to every server of the environment.
      expected: All servers use the same NTP source with an offset below 1 second.
      steps:
        - action: Read the configured time source on each server.
          expected: Every server lists the same NTP source.
        - action: Measure the offset of each server against that source.
          expected: Every offset is below 1 second.
    sv:
      title: Serverklockor ligger inom en sekund från NTP
      description: Ett skript hämtar tidskonfiguration och avvikelse för varje server.
      preconditions: Skal- eller övervakningsåtkomst till varje server i miljön.
      expected: Alla servrar använder samma NTP-källa med en avvikelse under 1 sekund.
      steps:
        - action: Läs den konfigurerade tidskällan på varje server.
          expected: Varje server anger samma NTP-källa.
        - action: Mät avvikelsen för varje server mot den källan.
          expected: Varje avvikelse är under 1 sekund.

  - id: SLOG-T08
    priority: medium
    execution: manual
    tags: [log-retention]
    refs: ["PCI DSS v4.0.1 Req. 10.5.1", "IEC 62443-3-3 SR 2.9"]
    en:
      title: Old security log records can be found
      description: Inspects retention settings and searches for records of different ages.
      preconditions: Access to the log store of an environment that has been running for more than 12 months.
      expected: Records up to 3 months are searchable directly and records up to 12 months exist.
      steps:
        - action: Read the retention setting of the log store and its archive.
          expected: The combined retention is 12 months or more.
        - action: Search for a security record that is 80 days old.
          expected: The record is returned without a restore.
        - action: Retrieve a record that is 11 months old from the archive.
          expected: The record is retrieved.
    sv:
      title: Gamla säkerhetsloggposter går att hitta
      description: Granskar inställningarna för lagringstid och söker efter poster av olika ålder.
      preconditions: Åtkomst till logglagret i en miljö som har varit i drift i mer än 12 månader.
      expected: Poster upp till 3 månader går att söka direkt och poster upp till 12 månader finns kvar.
      steps:
        - action: Läs lagringstiden för logglagret och dess arkiv.
          expected: Den sammanlagda lagringstiden är 12 månader eller mer.
        - action: Sök efter en säkerhetspost som är 80 dagar gammal.
          expected: Posten returneras utan återläsning.
        - action: Hämta en post som är 11 månader gammal från arkivet.
          expected: Posten hämtas.

  - id: SLOG-T09
    priority: low
    execution: automated
    tags: [siem, log-format]
    refs: ["OWASP Logging Cheat Sheet", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 6.1"]
    en:
      title: Security log lines are valid JSON
      description: A script parses every line of a day's security log as JSON and checks the field names.
      preconditions: A security log file from the test environment that covers one day of activity.
      expected: Every line parses and has the agreed fields.
      steps:
        - action: Parse each line as a JSON object.
          expected: No line fails to parse.
        - action: Check each object for the fields time, actor, source, event and outcome.
          expected: All five fields are present in every object.
    sv:
      title: Raderna i säkerhetsloggen är giltig JSON
      description: Ett skript tolkar varje rad i ett dygns säkerhetslogg som JSON och kontrollerar fältnamnen.
      preconditions: En säkerhetsloggfil från testmiljön som täcker ett dygns aktivitet.
      expected: Varje rad går att tolka och har de överenskomna fälten.
      steps:
        - action: Tolka varje rad som ett JSON-objekt.
          expected: Ingen rad misslyckas.
        - action: Kontrollera att varje objekt har fälten time, actor, source, event och outcome.
          expected: Alla fem fälten finns i varje objekt.

  - id: SLOG-T10
    priority: high
    execution: manual
    tags: [log-source, alert]
    refs: ["NIST SP 800-53 Rev. 5 AU-5", "ISO/IEC 27001:2022 A.8.16", "IEC 62443-3-3 SR 2.10", "IEC 62443-4-2 CR 2.10", "MITRE ATT&CK T1685 (disable or modify tools)"]
    en:
      title: A stopped log shipper raises an alert
      description: Stops the log shipper on one server and measures the time until the security team is alerted.
      preconditions: A production-like server that sends logs to the central log system; agreement with the security team about the test.
      expected: An alert naming the server reaches the security team within 15 minutes, and it clears when logging resumes.
      steps:
        - action: Stop the log shipper on the server and note the time.
          expected: No more records from the server arrive in the central log system.
        - action: Wait for the alert.
          expected: The security team receives an alert naming the server within 15 minutes.
          data: "limit 15 min"
        - action: Start the log shipper again.
          expected: Records arrive again and the alert is marked as resolved.
    sv:
      title: En stoppad logginsamlare ger larm
      description: Stoppar logginsamlaren på en server och mäter tiden tills säkerhetsteamet larmas.
      preconditions: En produktionslik server som skickar loggar till det centrala loggsystemet; överenskommelse med säkerhetsteamet om testet.
      expected: Ett larm som namnger servern når säkerhetsteamet inom 15 minuter, och det försvinner när loggningen återupptas.
      steps:
        - action: Stoppa logginsamlaren på servern och notera tiden.
          expected: Inga fler poster från servern kommer in i det centrala loggsystemet.
        - action: Vänta på larmet.
          expected: Säkerhetsteamet får ett larm som namnger servern inom 15 minuter.
          data: "gräns 15 min"
        - action: Starta logginsamlaren igen.
          expected: Poster kommer in igen och larmet markeras som åtgärdat.

  - id: SLOG-T11
    priority: medium
    execution: manual
    tags: [anomaly, administrator]
    refs: []
    en:
      title: Administrator sign-in from a new country
      description: Signs in to a test administrator account through addresses in a known and in a new country.
      preconditions: A test administrator account that has signed in only from one country during the last 90 days; a VPN or proxy with exit points in two other countries.
      expected: The sign-in from the new country raises an alert within 10 minutes; the one from the known country does not.
      steps:
        - action: Sign in to the account from the usual country.
          expected: No alert is raised.
        - action: Sign in to the account through an exit point in a country not used during the last 90 days and note the time.
          expected: Within 10 minutes the security team receives an alert with account, country and time.
          data: "exit point in a new country"
    sv:
      title: Inloggning som administratör från ett nytt land
      description: Loggar in på ett testkonto för administratör via adresser i ett känt och i ett nytt land.
      preconditions: Ett testkonto för administratör som bara har loggat in från ett land de senaste 90 dagarna; en VPN eller proxy med utgångar i två andra länder.
      expected: Inloggningen från det nya landet ger ett larm inom 10 minuter; inloggningen från det kända landet gör det inte.
      steps:
        - action: Logga in på kontot från det vanliga landet.
          expected: Inget larm utlöses.
        - action: Logga in på kontot via en utgång i ett land som inte använts de senaste 90 dagarna och notera tiden.
          expected: Inom 10 minuter får säkerhetsteamet ett larm med konto, land och tid.
          data: "utgång i ett nytt land"

  - id: SLOG-T12
    priority: high
    execution: automated
    tags: [alerting, export]
    refs: ["NIST SP 800-53 SI-4", "MITRE ATT&CK T1213 (data from information repositories)"]
    en:
      title: Bulk export raises an alert
      description: A script exports records as two users, one above and one below the threshold.
      preconditions: Two test users with export rights, a data set of 2 000 records and access to the on-call alert channel in the test environment.
      expected: Only the export above 1 000 records raises an alert, within 15 minutes.
      steps:
        - action: As user A, export 1 001 records in four batches within 30 minutes.
          expected: An alert naming user A and 1 001 records reaches the on-call channel within 15 minutes of the last batch.
        - action: As user B, export 999 records within 30 minutes.
          expected: No alert is raised for user B.
    sv:
      title: Massexport ger ett larm
      description: Ett skript exporterar poster som två användare, en över och en under tröskeln.
      preconditions: Två testanvändare med exportbehörighet, en datamängd med 2 000 poster och åtkomst till jourens larmkanal i testmiljön.
      expected: Endast exporten över 1 000 poster ger ett larm, inom 15 minuter.
      steps:
        - action: Exportera som användare A 1 001 poster i fyra omgångar inom 30 minuter.
          expected: Ett larm som anger användare A och 1 001 poster når jourens kanal inom 15 minuter efter den sista omgången.
        - action: Exportera som användare B 999 poster inom 30 minuter.
          expected: Inget larm ges för användare B.

  - id: SLOG-T13
    priority: medium
    execution: automated
    tags: [alerting, enumeration]
    refs: ["OWASP Top 10 2021 A09"]
    en:
      title: Probing for other users' records raises an alert
      description: A script requests record identifiers that the test user may not read.
      preconditions: Two test users, one that owns 30 records and one without access to them.
      expected: More than 20 denials in 5 minutes raise one alert; fewer raise none.
      steps:
        - action: As the user without access, request 19 different records of the other user within 5 minutes.
          expected: Each request is denied and no alert is raised.
        - action: Wait 10 minutes, then request 21 different records within 5 minutes.
          expected: One alert naming the user and the number of denials reaches the on-call within 15 minutes.
    sv:
      title: Letande efter andra användares poster ger ett larm
      description: Ett skript anropar postidentifierare som testanvändaren saknar rätt att läsa.
      preconditions: Två testanvändare, en som äger 30 poster och en utan åtkomst till dem.
      expected: Mer än 20 nekanden på 5 minuter ger ett larm; färre ger inget.
      steps:
        - action: Anropa som användaren utan åtkomst 19 olika poster hos den andra användaren inom 5 minuter.
          expected: Varje anrop nekas och inget larm ges.
        - action: Vänta 10 minuter och anropa sedan 21 olika poster inom 5 minuter.
          expected: Ett larm som anger användaren och antalet nekanden når jouren inom 15 minuter.

  - id: SLOG-T14
    priority: medium
    execution: automated
    tags: [correlation, tracing]
    refs: ["W3C Trace Context"]
    en:
      title: Trace identifier follows a request through the services
      description: Sends a request with a known trace identifier and searches the central log for it.
      preconditions: A test environment where the services ship logs to the central store, and the list of services a record update passes.
      expected: Each service on the path writes the same trace identifier.
      steps:
        - action: Send a request that updates a record with a traceparent header.
          expected: The request succeeds.
          data: "traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        - action: Search the central log for the trace identifier 4bf92f3577b34da6a3ce929d0e0e4736.
          expected: Log records from each service on the list are found with that identifier.
    sv:
      title: Spårningsidentifieraren följer ett anrop genom tjänsterna
      description: Skickar ett anrop med en känd spårningsidentifierare och söker efter den i den centrala loggen.
      preconditions: En testmiljö där tjänsterna skickar loggar till det centrala lagret, och listan över de tjänster som en uppdatering av en post passerar.
      expected: Varje tjänst på vägen skriver samma spårningsidentifierare.
      steps:
        - action: Skicka ett anrop som uppdaterar en post med ett traceparent-huvud.
          expected: Anropet lyckas.
          data: "traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        - action: Sök i den centrala loggen efter spårningsidentifieraren 4bf92f3577b34da6a3ce929d0e0e4736.
          expected: Loggposter från varje tjänst i listan hittas med den identifieraren.

  - id: SLOG-T15
    priority: medium
    execution: manual
    tags: [detection, alert-testing]
    refs: ["NIST SP 800-53 SI-4"]
    en:
      title: Each alert rule was tested in the last 3 months
      description: Compares the list of security alert rules with the alert test record.
      preconditions: An export of the active alert rules and the alert test record.
      expected: Every rule has a monthly test entry with the measured time to alert.
      steps:
        - action: List the active security alert rules.
          expected: A list of rules is produced.
        - action: For each rule, find the test entries of the last 3 months.
          expected: Each rule has three entries, each with the time from test event to alert.
        - action: Compare each measured time with the rule's time limit.
          expected: Each failed entry has a ticket with a fix.
    sv:
      title: Varje larmregel har testats de senaste 3 månaderna
      description: Jämför listan över larmregler för säkerhet med testregistret för larm.
      preconditions: En export av de aktiva larmreglerna och testregistret för larm.
      expected: Varje regel har en månatlig testpost med uppmätt tid till larm.
      steps:
        - action: Lista de aktiva larmreglerna för säkerhet.
          expected: En lista med regler tas fram.
        - action: Leta upp testposterna för de senaste 3 månaderna för varje regel.
          expected: Varje regel har tre poster, var och en med tiden från testhändelse till larm.
        - action: Jämför varje uppmätt tid med regelns tidsgräns.
          expected: Varje underkänd post har ett ärende med en åtgärd.

  - id: SLOG-T16
    priority: medium
    execution: automated
    tags: [privacy, logs]
    refs: ["GDPR Art. 5(1)(c)", "CWE-359 (exposure of private personal information)", "CWE-532 (insertion of sensitive information into log file)"]
    en:
      title: Logs hold user ids and no direct identifiers
      description: Signs in and works as test users with known personal data and searches the logs for that data.
      preconditions: Three test users with known names, email addresses and test personal identity numbers, and search access to the central log.
      expected: The logs contain the users' ids but none of their names, addresses or numbers.
      steps:
        - action: As each test user, sign in, fail a sign-in once, edit a record and sign out.
          expected: The actions succeed or fail as intended.
        - action: Search the logs of that day for each test user's name, email address and identity number.
          expected: There are no hits.
        - action: Search the logs for each test user's internal id.
          expected: Each id is found in the sign-in and edit events.
    sv:
      title: Loggar innehåller användar-id och inga direkta identifierare
      description: Loggar in och arbetar som testanvändare med kända personuppgifter och söker efter uppgifterna i loggarna.
      preconditions: Tre testanvändare med kända namn, e-postadresser och testpersonnummer, och sökbehörighet till den centrala loggen.
      expected: Loggarna innehåller användarnas id men inga av deras namn, adresser eller nummer.
      steps:
        - action: Logga in som varje testanvändare, misslyckas med en inloggning en gång, redigera en post och logga ut.
          expected: Åtgärderna lyckas eller misslyckas som avsett.
        - action: Sök i dagens loggar efter varje testanvändares namn, e-postadress och personnummer.
          expected: Det finns inga träffar.
        - action: Sök i loggarna efter varje testanvändares interna id.
          expected: Varje id hittas i händelserna för inloggning och redigering.

risks:
  - id: SLOG-R01
    category: security
    likelihood: 4
    impact: 4
    tags: [detection, monitoring]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A09", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1078 (valid accounts)", "MITRE ATT&CK T1098 (account manipulation)"]
    mitigated_by: [SLOG-01, SLOG-02, SLOG-06, SLOG-07, SLOG-12, SLOG-16]
    en:
      title: Intrusion goes unnoticed for months
      description: Security events are not logged or no alert fires when accounts are misused or new administrators appear. The attacker works undisturbed and the damage grows until someone outside notices.
      mitigation: Log security events with enough detail, alert on mass sign-in failures, new administrator rights and administrator sign-in from a new country, and test each alert rule every month.
    sv:
      title: Intrång upptäcks inte på flera månader
      description: Säkerhetshändelser loggas inte eller inget larm går när konton missbrukas eller nya administratörer dyker upp. Angriparen arbetar ostört och skadan växer tills någon utanför märker det.
      mitigation: Logga säkerhetshändelser med tillräcklig detaljnivå, larma vid många misslyckade inloggningar, nya administratörsbehörigheter och administratörsinloggning från ett nytt land, och testa varje larmregel varje månad.
  - id: SLOG-R02
    category: security
    likelihood: 3
    impact: 4
    tags: [log-tampering, forensics]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "CWE-117 (improper output neutralization for logs)", "MITRE ATT&CK T1070 (indicator removal)", "MITRE ATT&CK T1685 (disable or modify tools)"]
    mitigated_by: [SLOG-05, SLOG-04, SLOG-11, SLOG-08, SLOG-09]
    en:
      title: Logs erased or forged to hide an attack
      description: An attacker deletes or alters log records, injects false lines or stops a log source. The investigation cannot tell what happened and evidence is lost.
      mitigation: Protect logs from change, neutralise log injection, alert when a log source stops sending, synchronise clocks and keep security logs for the set period.
    sv:
      title: Loggar raderas eller förfalskas för att dölja en attack
      description: En angripare raderar eller ändrar loggposter, skjuter in falska rader eller stoppar en loggkälla. Utredningen kan inte avgöra vad som hände och bevis går förlorade.
      mitigation: Skydda loggarna mot ändring, oskadliggör injektion i loggar, larma när en loggkälla slutar skicka, synkronisera klockorna och spara säkerhetsloggarna under fastställd tid.
  - id: SLOG-R03
    category: privacy
    likelihood: 3
    impact: 3
    tags: [logs, personal-data]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "GDPR Art. 32(1)(a)", "CWE-532 (insertion of sensitive information into log file)", "CWE-359 (exposure of private personal information)"]
    mitigated_by: [SLOG-03, SLOG-17, RET-12]
    en:
      title: Secrets and personal data collected in logs
      description: Passwords, tokens and personal data are written to logs that many people and tools can read and that are kept for a long time. A leak of the logs exposes them.
      mitigation: Keep secrets out of logs, identify users by id instead of by name and delete application and debug logs after 30 days.
    sv:
      title: Hemligheter och personuppgifter samlas i loggar
      description: Lösenord, token och personuppgifter skrivs till loggar som många personer och verktyg kan läsa och som sparas länge. En läcka av loggarna röjer dem.
      mitigation: Håll hemligheter borta från loggarna, identifiera användare med id i stället för namn och radera applikations- och felsökningsloggar efter 30 dagar.
