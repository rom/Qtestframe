area: audit-trail
prefix: AUD
group: privacy
name: {en: Audit trail and electronic signatures, sv: Ändringslogg och elektroniska underskrifter}
description:
  en: Recording who changed what and when, tamper evidence, retention and export of audit records for auditors, and electronic signatures.
  sv: Registrering av vem som ändrade vad och när, manipuleringsskydd, lagring och export av ändringsloggen för revisorer samt elektroniska underskrifter.

requirements:
  - id: AUD-01
    type: regulatory
    obligation: must
    priority: critical
    tags: [audit-trail, change-history]
    refs: ["21 CFR Part 11 §11.10(e)", "EU GMP Annex 11 §9", "ISO/IEC 27001:2022 A.8.15", "NIST SP 800-53 AU-3", "IEC 62443-3-3 SR 2.8", "IEC 62443-4-2 CR 2.8", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(l)", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1565.001 (stored data manipulation)"]
    tests: [AUD-T01]
    en:
      title: Every change is recorded in the audit trail
      description: The system MUST record the user, the UTC time, the record id, the field, the old value and the new value for each creation, change and deletion of a business record.
      rationale: An auditor has to be able to reconstruct the full history of a record and see who is responsible for each change.
      criteria:
        - method: test
          text: Creating, changing two fields of and deleting a test record produces audit entries that show all six attributes for each change.
    sv:
      title: Varje ändring registreras i ändringsloggen
      description: Systemet SKA registrera användare, tidpunkt i UTC, post-id, fält, gammalt värde och nytt värde för varje gång en verksamhetspost skapas, ändras eller raderas.
      rationale: En revisor behöver kunna återskapa hela historiken för en post och se vem som ansvarar för varje ändring.
      criteria:
        - method: test
          text: När en testpost skapas, får två fält ändrade och raderas uppstår poster i ändringsloggen som visar alla sex attributen för varje ändring.

  - id: AUD-02
    type: regulatory
    obligation: must_not
    priority: critical
    tags: [audit-trail, immutability]
    refs: ["21 CFR Part 11 §11.10(e)", "EU GMP Annex 11 §9", "NIST SP 800-53 AU-9", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(f)", "MITRE ATT&CK T1070 (indicator removal)"]
    tests: [AUD-T02]
    en:
      title: Audit entries cannot be changed or deleted
      description: The system MUST NOT offer any user, including administrators, a function or API that changes or deletes an audit entry.
      rationale: An audit trail that its users can edit proves nothing.
      criteria:
        - method: test
          text: Attempts to update or delete an audit entry through the user interface and the API, as an administrator, are refused or have no such function.
        - method: inspection
          text: The database account used by the application has only insert and select rights on the audit table.
    sv:
      title: Poster i ändringsloggen kan inte ändras eller raderas
      description: Systemet SKA INTE erbjuda någon användare, inte heller administratörer, en funktion eller ett API som ändrar eller raderar en post i ändringsloggen.
      rationale: En ändringslogg som användarna själva kan redigera bevisar ingenting.
      criteria:
        - method: test
          text: Försök som administratör att uppdatera eller radera en post i ändringsloggen via användargränssnittet och API:et avvisas, eller så saknas sådan funktion.
        - method: inspection
          text: Databaskontot som applikationen använder har bara rättighet att infoga och läsa i loggtabellen.

  - id: AUD-03
    type: security
    obligation: must
    priority: high
    tags: [tamper-evidence, hash-chain]
    refs: ["NIST SP 800-53 AU-9(3)", "NIST SP 800-53 AU-10", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "CWE-353 (missing support for integrity check)", "MITRE ATT&CK T1070 (indicator removal)", "MITRE ATT&CK T1565.001 (stored data manipulation)"]
    tests: [AUD-T03]
    en:
      title: Tamper-evident audit trail
      description: The system MUST link each audit entry to the previous one with a cryptographic hash so that a verification run detects any changed, inserted or removed entry.
      rationale: Even with access controls, someone with database access could alter entries; the hash chain makes such changes visible.
      criteria:
        - method: test
          text: The verification run reports success on an untouched trail and names the first broken entry after one entry is changed directly in the database.
    sv:
      title: Manipuleringssäker ändringslogg
      description: Systemet SKA länka varje post i ändringsloggen till den föregående med en kryptografisk hash så att en verifieringskörning upptäcker varje ändrad, tillagd eller borttagen post.
      rationale: Även med åtkomstskydd kan någon med åtkomst till databasen ändra poster; hashkedjan gör sådana ändringar synliga.
      criteria:
        - method: test
          text: Verifieringskörningen rapporterar att en orörd logg är korrekt och anger den första trasiga posten efter att en post har ändrats direkt i databasen.

  - id: AUD-04
    type: regulatory
    obligation: must
    priority: high
    tags: [audit-trail, retention-period]
    refs: ["21 CFR Part 11 §11.10(c)", "EU GMP Annex 11 §17", "Swedish Bookkeeping Act (1999:1078) ch. 7 §2", "ISO/IEC 27001:2022 A.5.33", "ISO/IEC 27001:2022 A.8.15"]
    tests: [AUD-T04]
    en:
      title: Retention of audit records
      description: The system MUST keep audit entries for at least 7 years after the end of the calendar year in which they were created.
      rationale: Audits and legal claims can concern events many years back; teams adjust the period to the rules that apply to them.
      criteria:
        - method: inspection
          text: The retention setting for the audit trail is 7 years or more, and the retention job excludes audit entries younger than that.
    sv:
      title: Lagringstid för ändringsloggen
      description: Systemet SKA spara poster i ändringsloggen i minst 7 år efter utgången av det kalenderår då de skapades.
      rationale: Revisioner och rättsliga anspråk kan gälla händelser långt tillbaka i tiden; team anpassar tiden efter de regler som gäller för dem.
      criteria:
        - method: inspection
          text: Lagringstiden för ändringsloggen är 7 år eller mer, och gallringsjobbet undantar poster i ändringsloggen som är yngre än så.

  - id: AUD-05
    type: regulatory
    obligation: must
    priority: high
    tags: [audit-trail, export, auditor]
    refs: ["21 CFR Part 11 §11.10(b)", "EU GMP Annex 11 §8", "ISO/IEC 27001:2022 A.5.35", "IEC 62443-3-3 SR 6.1", "IEC 62443-4-2 CR 6.1"]
    tests: [AUD-T05]
    en:
      title: Export of the audit trail for auditors
      description: The system MUST let an auditor export the audit entries for a chosen date range and record as a CSV file together with a SHA-256 checksum of the file.
      rationale: Auditors work with their own tools and need a complete copy that they can show has not been altered.
      criteria:
        - method: test
          text: An export for one record and one month contains exactly the entries shown in the system for that selection, and the checksum matches the file.
    sv:
      title: Export av ändringsloggen för revisorer
      description: Systemet SKA låta en revisor exportera posterna i ändringsloggen för ett valt datumintervall och en vald post som en CSV-fil tillsammans med en SHA-256-kontrollsumma för filen.
      rationale: Revisorer arbetar i egna verktyg och behöver en fullständig kopia som de kan visa inte har ändrats.
      criteria:
        - method: test
          text: En export för en post och en månad innehåller exakt de poster som systemet visar för det urvalet, och kontrollsumman stämmer med filen.

  - id: AUD-06
    type: security
    obligation: should
    priority: medium
    tags: [auditor, read-only, roles]
    refs: ["ISO/IEC 27001:2022 A.5.35", "ISO/IEC 27001:2022 A.8.34", "NIST SP 800-53 AU-9(4)"]
    tests: [AUD-T06]
    en:
      title: Read-only auditor role
      description: The system SHOULD offer an auditor role that can read and export the audit trail and all records without any right to change data.
      rationale: External auditors then get the access they need without the risk that they alter what they examine.
      criteria:
        - method: test
          text: A user with only the auditor role can open and export the audit trail, and every create, update and delete request from that user returns 403.
    sv:
      title: Revisorsroll med enbart läsbehörighet
      description: Systemet BÖR erbjuda en revisorsroll som kan läsa och exportera ändringsloggen och alla poster utan någon rätt att ändra data.
      rationale: Externa revisorer får då den åtkomst de behöver utan risk att de ändrar det de granskar.
      criteria:
        - method: test
          text: En användare med enbart revisorsrollen kan öppna och exportera ändringsloggen, och varje anrop från den användaren som skapar, uppdaterar eller raderar svarar 403.

  - id: AUD-07
    type: regulatory
    obligation: must
    priority: critical
    tags: [e-signature, re-authentication]
    refs: ["21 CFR Part 11 §11.50", "21 CFR Part 11 §11.200(a)", "EU GMP Annex 11 §14", "eIDAS Regulation (EU) No 910/2014 Art. 26", "IEC 62443-3-3 SR 2.12", "IEC 62443-4-2 CR 2.12", "CWE-306 (missing authentication for critical function)"]
    tests: [AUD-T07]
    en:
      title: Electronic signature with re-authentication
      description: The system MUST ask the signer for their password or a second factor at each electronic signature and store the signer's name, the UTC time and the meaning of the signature.
      rationale: The signature has to be attributable to one person, and its meaning, such as reviewed or approved, has to be clear to any later reader.
      criteria:
        - method: test
          text: Signing is refused without the password or second factor, and a completed signature shows name, time and meaning on the record and in the audit trail.
    sv:
      title: Elektronisk underskrift med ny autentisering
      description: Systemet SKA be den som skriver under om lösenord eller en andra faktor vid varje elektronisk underskrift och spara undertecknarens namn, tidpunkten i UTC och underskriftens innebörd.
      rationale: Underskriften behöver kunna knytas till en person, och dess innebörd, till exempel granskad eller godkänd, behöver vara tydlig för den som läser den senare.
      criteria:
        - method: test
          text: Underskriften avvisas utan lösenord eller andra faktor, och en genomförd underskrift visar namn, tidpunkt och innebörd på posten och i ändringsloggen.

  - id: AUD-08
    type: regulatory
    obligation: must
    priority: high
    tags: [e-signature, record-linking]
    refs: ["21 CFR Part 11 §11.70", "EU GMP Annex 11 §14", "IEC 62443-3-3 SR 2.12", "IEC 62443-4-2 CR 2.12", "CWE-347 (improper verification of cryptographic signature)"]
    tests: [AUD-T08]
    en:
      title: Signatures are bound to the signed content
      description: The system MUST mark a signature as no longer valid when the signed record is changed after signing.
      rationale: A signature has to apply to exactly the content that the signer saw, not to a later version.
      criteria:
        - method: test
          text: After a field of a signed record is changed, the record shows the signature as invalidated, and the audit trail shows the change and the signature status.
    sv:
      title: Underskrifter är knutna till det undertecknade innehållet
      description: Systemet SKA markera en underskrift som inte längre giltig när den undertecknade posten ändras efter underskriften.
      rationale: En underskrift ska gälla exakt det innehåll som undertecknaren såg, inte en senare version.
      criteria:
        - method: test
          text: När ett fält i en undertecknad post ändras visar posten att underskriften är ogiltig, och ändringsloggen visar ändringen och underskriftens status.

  - id: AUD-09
    type: regulatory
    obligation: should
    priority: medium
    tags: [audit-trail, reason-for-change]
    refs: ["EU GMP Annex 11 §9", "21 CFR Part 11 §11.10(e)"]
    tests: [AUD-T09]
    en:
      title: Reason for change on approved records
      description: The system SHOULD ask for a reason of at least 10 characters when a user changes a record that has already been approved, and store it in the audit trail.
      rationale: Changes to approved data are the ones auditors question most, and the reason gives them the context.
      criteria:
        - method: test
          text: Saving a change to an approved record without a reason, or with 9 characters, is refused; with a reason of 10 characters it is saved and the reason appears in the audit trail.
    sv:
      title: Orsak till ändring av godkända poster
      description: Systemet BÖR be om en orsak på minst 10 tecken när en användare ändrar en post som redan har godkänts och spara orsaken i ändringsloggen.
      rationale: Ändringar av godkända uppgifter är de som revisorer ifrågasätter mest, och orsaken ger dem sammanhanget.
      criteria:
        - method: test
          text: En ändring av en godkänd post utan orsak, eller med 9 tecken, sparas inte; med en orsak på 10 tecken sparas den och orsaken syns i ändringsloggen.

  - id: AUD-10
    type: usability
    obligation: may
    priority: low
    tags: [audit-trail, history-view]
    refs: ["EU GMP Annex 11 §9"]
    tests: [AUD-T10]
    en:
      title: Change history shown on each record
      description: The system MAY show the change history of a record on the record's own page, newest change first.
      rationale: Users and reviewers can then see what happened to a record without going to a separate audit tool.
      criteria:
        - method: demonstration
          text: The history tab of a record lists its changes with user, time, field, old value and new value in reverse order of time.
    sv:
      title: Ändringshistorik visas på varje post
      description: Systemet FÅR visa en posts ändringshistorik på postens egen sida, med den senaste ändringen först.
      rationale: Användare och granskare kan då se vad som har hänt med en post utan att gå till ett separat loggverktyg.
      criteria:
        - method: demonstration
          text: Historikfliken för en post visar dess ändringar med användare, tidpunkt, fält, gammalt värde och nytt värde i omvänd tidsordning.

  - id: AUD-11
    type: regulatory
    obligation: should
    priority: medium
    tags: [audit-trail, read-access, sensitive-data]
    refs: ["Swedish Patient Data Act (2008:355) Ch. 4 §3 (access logging)", "HIPAA Security Rule 45 CFR §164.312(b) (audit controls)", "ISO/IEC 27001:2022 A.8.15", "GDPR Art. 32(1)(b)", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1213 (data from information repositories)"]
    tests: [AUD-T11]
    en:
      title: Reading a sensitive record is recorded
      description: The system SHOULD record in the audit trail each time a user opens a record classified as sensitive, with user, time and record.
      rationale: For health, personnel and case data the question is often who looked at a record, not only who changed it.
      criteria:
        - method: test
          text: Opening a sensitive record creates an audit entry with user, time and record id within 1 minute, and opening an ordinary record does not.
    sv:
      title: Läsning av en känslig post registreras
      description: Systemet BÖR registrera i ändringsloggen varje gång en användare öppnar en post som klassats som känslig, med användare, tid och post.
      rationale: För hälso-, personal- och ärendeuppgifter är frågan ofta vem som har tittat på en post, inte bara vem som har ändrat den.
      criteria:
        - method: test
          text: Att öppna en känslig post skapar en post i ändringsloggen med användare, tid och post-id inom 1 minut, och att öppna en vanlig post gör det inte.

  - id: AUD-12
    type: performance
    obligation: should
    priority: medium
    tags: [audit-trail, search, performance]
    refs: ["ISO/IEC 25010:2023 time behaviour", "EU GMP Annex 11 §9 (audit trails available and convertible)"]
    tests: [AUD-T12]
    en:
      title: Search of the audit trail within 5 seconds
      description: The audit trail SHOULD return the entries for a given user, record or period within 5 seconds when it holds 10 million entries.
      rationale: Investigations and audits ask many questions in a row, and slow searches make people export everything instead.
      criteria:
        - method: test
          text: With 10 million entries, searches by user, by record and by a 1-month period each return their first page within 5 seconds.
          threshold: "≤ 5 s at 10 000 000 entries"
    sv:
      title: Sökning i ändringsloggen inom 5 sekunder
      description: Ändringsloggen BÖR visa posterna för en viss användare, post eller period inom 5 sekunder när den innehåller 10 miljoner poster.
      rationale: Utredningar och revisioner ställer många frågor i följd, och långsamma sökningar får människor att exportera allt i stället.
      criteria:
        - method: test
          text: Med 10 miljoner poster visar sökningar på användare, på post och på en period om 1 månad var sin första sida inom 5 sekunder.
          threshold: "≤ 5 s vid 10 000 000 poster"

  - id: AUD-13
    type: security
    obligation: must
    priority: high
    tags: [configuration-changes, administration]
    refs: ["21 CFR Part 11 §11.10(e)", "EU GMP Annex 11 §9", "NIST SP 800-53 AU-2", "ISO/IEC 27001:2022 A.8.15", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1098 (account manipulation)"]
    tests: [AUD-T13]
    en:
      title: Configuration and permission changes are audited
      description: The system MUST record in the audit trail each change to system settings, role definitions, workflows and electronic signature rules, with the administrator, the UTC time and the old and new values.
      rationale: A change to a workflow or a role can alter many records later without touching any of them, and is then invisible in the record history.
      criteria:
        - method: test
          text: Changing a role's permissions, a workflow step and a signature setting gives three audit entries with administrator, time and both values.
    sv:
      title: Ändringar av konfiguration och behörigheter granskningsloggas
      description: Systemet SKA i granskningsloggen registrera varje ändring av systeminställningar, rolldefinitioner, arbetsflöden och regler för elektroniska underskrifter, med administratören, UTC-tiden och de gamla och nya värdena.
      rationale: En ändring av ett arbetsflöde eller en roll kan senare påverka många poster utan att röra någon av dem, och syns då inte i postens historik.
      criteria:
        - method: test
          text: En ändring av en rolls behörigheter, ett steg i ett arbetsflöde och en underskriftsinställning ger tre granskningsposter med administratör, tid och båda värdena.

  - id: AUD-14
    type: security
    obligation: must
    priority: critical
    tags: [fail-closed, audit-failure]
    refs: ["IEC 62443-3-3 SR 2.10", "IEC 62443-4-2 CR 2.10", "NIST SP 800-53 AU-5", "21 CFR Part 11 §11.10(e)", "CWE-778 (insufficient logging)"]
    tests: [AUD-T14]
    en:
      title: No change without an audit entry
      description: The system MUST refuse a change to a business record when it cannot write the matching audit entry, and tell the user that the change was not saved.
      rationale: A change saved without its audit entry breaks the completeness that regulators and auditors rely on, and cannot be repaired afterwards.
      criteria:
        - method: test
          text: With the audit store made unavailable, an edit is refused with a message, the record is unchanged, and an alert goes to the operator.
    sv:
      title: Ingen ändring utan granskningspost
      description: Systemet SKA avvisa en ändring av en verksamhetspost när det inte kan skriva motsvarande granskningspost, och meddela användaren att ändringen inte sparades.
      rationale: En ändring som sparas utan sin granskningspost bryter den fullständighet som tillsynsmyndigheter och revisorer förlitar sig på, och kan inte lagas i efterhand.
      criteria:
        - method: test
          text: När granskningslagret görs otillgängligt avvisas en redigering med ett meddelande, posten är oförändrad och ett larm går till driften.

  - id: AUD-15
    type: security
    obligation: must
    priority: high
    tags: [impersonation, support-access]
    refs: ["ISO/IEC 27001:2022 A.8.15", "NIST SP 800-53 AU-3", "OWASP Logging Cheat Sheet", "CWE-223 (omission of security-relevant information)"]
    tests: [AUD-T15]
    en:
      title: Both identities recorded during impersonation
      description: The system MUST record both the acting support or administrator account and the impersonated user in each audit entry made while one user acts as another.
      rationale: Entries that name only the impersonated user put the support engineer's changes on the customer's account and hide who really acted.
      criteria:
        - method: test
          text: A change made by a support engineer acting as a customer user gives an entry with both account ids and the impersonation session id.
    sv:
      title: Båda identiteterna registreras vid agerande som annan användare
      description: Systemet SKA registrera både det agerande support- eller administratörskontot och den användare som någon agerar som i varje granskningspost som skapas medan en användare agerar som en annan.
      rationale: Poster som bara anger den användare man agerar som lägger supportteknikerns ändringar på kundens konto och döljer vem som verkligen agerade.
      criteria:
        - method: test
          text: En ändring som en supporttekniker gör som en kundanvändare ger en post med båda kontonas id och id för sessionen.

  - id: AUD-16
    type: security
    obligation: should
    priority: medium
    tags: [trusted-timestamp, tamper-evidence]
    refs: ["RFC 3161", "eIDAS Regulation (EU) No 910/2014 Art. 41 (qualified electronic time stamps)", "ISO/IEC 27001:2022 A.8.15", "MITRE ATT&CK T1070 (indicator removal)"]
    tests: [AUD-T16]
    en:
      title: Daily external time stamp on the audit chain
      description: The system SHOULD obtain a time stamp from an external time-stamping authority on the latest hash of the audit chain once every 24 hours and store the token with the chain.
      rationale: An external time stamp proves that the audit trail existed in that form at that time, even against someone who controls the whole system.
      criteria:
        - method: test
          text: Each of the last 7 days has a time-stamp token that verifies against the authority's certificate and matches the chain hash of that day.
          threshold: "every 24 h"
    sv:
      title: Daglig extern tidsstämpel på granskningskedjan
      description: Systemet BÖR hämta en tidsstämpel från en extern tidsstämpeltjänst på den senaste hashen i granskningskedjan en gång per dygn och lagra tidsstämpeln tillsammans med kedjan.
      rationale: En extern tidsstämpel visar att granskningsloggen fanns i den formen vid den tidpunkten, även mot någon som styr hela systemet.
      criteria:
        - method: test
          text: Var och en av de senaste 7 dagarna har en tidsstämpel som kan verifieras mot tjänstens certifikat och stämmer med kedjans hash för den dagen.
          threshold: "en gång per dygn"

  - id: AUD-17
    type: business
    obligation: should
    priority: medium
    tags: [audit-review, gxp]
    refs: ["EU GMP Annex 11 §9", "PIC/S PI 041-1 (data integrity)", "ISO/IEC 27001:2022 A.8.15"]
    tests: [AUD-T17]
    en:
      title: Monthly review of audit entries on critical data
      description: A named reviewer SHOULD review the audit entries on records classified as critical every month and record the review with findings in the system.
      rationale: An audit trail that nobody reads finds nothing; a regular review catches unauthorised changes and data integrity problems while they can still be corrected.
      criteria:
        - method: inspection
          text: The review record has an entry for each of the last 3 months with reviewer, period covered and findings.
          threshold: "every month"
    sv:
      title: Månatlig granskning av granskningsposter för kritiska data
      description: En namngiven granskare BÖR granska granskningsposterna för poster som klassats som kritiska varje månad och registrera granskningen med iakttagelser i systemet.
      rationale: En granskningslogg som ingen läser hittar ingenting; en regelbunden granskning fångar obehöriga ändringar och problem med dataintegriteten medan de fortfarande går att rätta.
      criteria:
        - method: inspection
          text: Granskningsregistret har en post för var och en av de senaste 3 månaderna med granskare, period och iakttagelser.
          threshold: "varje månad"

tests:
  - id: AUD-T01
    priority: critical
    execution: automated
    tags: [audit-trail, change-history]
    refs: ["21 CFR Part 11 §11.10(e)", "IEC 62443-3-3 SR 2.8", "IEC 62443-4-2 CR 2.8", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(l)", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1565.001 (stored data manipulation)"]
    en:
      title: Create, change and delete appear in the audit trail
      description: A script creates, changes and deletes a record and reads the resulting audit entries.
      preconditions: A test user allowed to manage records and read access to the audit trail.
      expected: Each operation produces entries with user, time, record id, field, old value and new value.
      steps:
        - action: Create a record with a title and a status.
          expected: An entry shows the creation with the user, a UTC time, the record id and the initial values.
          data: "title: Audit test, status: draft"
        - action: Change the title and the status.
          expected: Two entries show the field names with their old and new values.
        - action: Delete the record.
          expected: An entry shows the deletion with the user, the time and the last values.
    sv:
      title: Skapa, ändra och radera syns i ändringsloggen
      description: Ett skript skapar, ändrar och raderar en post och läser de poster i ändringsloggen som uppstår.
      preconditions: En testanvändare som får hantera poster och läsbehörighet till ändringsloggen.
      expected: Varje åtgärd ger loggposter med användare, tidpunkt, post-id, fält, gammalt värde och nytt värde.
      steps:
        - action: Skapa en post med titel och status.
          expected: En loggpost visar skapandet med användaren, en tidpunkt i UTC, post-id och de första värdena.
          data: "titel: Loggtest, status: utkast"
        - action: Ändra titeln och statusen.
          expected: Två loggposter visar fältnamnen med gamla och nya värden.
        - action: Radera posten.
          expected: En loggpost visar raderingen med användaren, tidpunkten och de sista värdena.

  - id: AUD-T02
    priority: critical
    execution: manual
    tags: [audit-trail, immutability]
    refs: ["NIST SP 800-53 AU-9", "ISO/IEC 27001:2022 A.8.15", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(f)", "MITRE ATT&CK T1070 (indicator removal)"]
    en:
      title: Administrators cannot alter the audit trail
      description: Tries to change and delete audit entries as an administrator and inspects the database rights.
      preconditions: An administrator account, an API client and read access to the database grants.
      expected: No path exists to change or delete an audit entry.
      steps:
        - action: As an administrator, look for edit or delete actions on audit entries in the user interface.
          expected: No such actions exist.
        - action: Send PUT and DELETE requests for an audit entry id to the API as the administrator.
          expected: Each request is refused with 403, 404 or 405 and the entry is unchanged.
        - action: Read the grants of the application's database account on the audit table.
          expected: Only insert and select are granted.
    sv:
      title: Administratörer kan inte ändra ändringsloggen
      description: Försöker ändra och radera poster i ändringsloggen som administratör och granskar rättigheterna i databasen.
      preconditions: Ett administratörskonto, en API-klient och läsbehörighet till rättigheterna i databasen.
      expected: Det finns inget sätt att ändra eller radera en post i ändringsloggen.
      steps:
        - action: Leta som administratör efter åtgärder för att redigera eller radera loggposter i användargränssnittet.
          expected: Inga sådana åtgärder finns.
        - action: Skicka PUT- och DELETE-anrop för ett loggpost-id till API:et som administratör.
          expected: Varje anrop avvisas med 403, 404 eller 405 och posten är oförändrad.
        - action: Läs rättigheterna för applikationens databaskonto på loggtabellen.
          expected: Bara infoga och läsa är beviljade.

  - id: AUD-T03
    priority: high
    execution: automated
    tags: [tamper-evidence, hash-chain]
    refs: ["NIST SP 800-53 AU-9(3)", "IEC 62443-3-3 SR 3.9", "IEC 62443-4-2 CR 3.9", "CWE-353 (missing support for integrity check)", "MITRE ATT&CK T1070 (indicator removal)", "MITRE ATT&CK T1565.001 (stored data manipulation)"]
    en:
      title: Hash chain verification detects tampering
      description: A script verifies the audit hash chain, alters the database directly and verifies again.
      preconditions: A test database with at least 1000 audit entries and direct write access for the test script.
      expected: The verification passes on the untouched trail and fails on each kind of tampering.
      steps:
        - action: Run the verification on the untouched trail.
          expected: The verification reports success.
        - action: Change the new value of entry 500 directly in the database and run the verification.
          expected: The verification fails and names entry 500.
        - action: Restore the data, delete entry 700 directly and run the verification.
          expected: The verification fails and names the entry after the gap.
    sv:
      title: Verifiering av hashkedjan upptäcker manipulation
      description: Ett skript verifierar hashkedjan i ändringsloggen, ändrar databasen direkt och verifierar igen.
      preconditions: En testdatabas med minst 1000 poster i ändringsloggen och direkt skrivåtkomst för testskriptet.
      expected: Verifieringen går igenom för den orörda loggen och misslyckas för varje typ av manipulation.
      steps:
        - action: Kör verifieringen på den orörda loggen.
          expected: Verifieringen rapporterar att loggen är korrekt.
        - action: Ändra det nya värdet i post 500 direkt i databasen och kör verifieringen.
          expected: Verifieringen misslyckas och anger post 500.
        - action: Återställ data, radera post 700 direkt och kör verifieringen.
          expected: Verifieringen misslyckas och anger posten efter luckan.

  - id: AUD-T04
    priority: high
    execution: manual
    tags: [audit-trail, retention-period]
    refs: ["EU GMP Annex 11 §17", "ISO/IEC 27001:2022 A.5.33", "ISO/IEC 27001:2022 A.8.15"]
    en:
      title: Audit entries are kept for 7 years
      description: Inspects the retention setting and runs the retention job on aged audit entries.
      preconditions: A test environment where audit entries can be back-dated, and access to the retention configuration.
      expected: Audit entries younger than the retention period survive the retention job.
      steps:
        - action: Read the retention setting for the audit trail.
          expected: It is 7 years or more after the end of the year of creation.
        - action: Back-date an audit entry to 6 years and 11 months ago and run the retention job.
          expected: The entry still exists.
    sv:
      title: Poster i ändringsloggen sparas i 7 år
      description: Granskar inställningen för lagringstid och kör gallringsjobbet på åldrade poster i ändringsloggen.
      preconditions: En testmiljö där poster i ändringsloggen kan bakdateras och åtkomst till konfigurationen för lagringstider.
      expected: Poster i ändringsloggen som är yngre än lagringstiden finns kvar efter gallringsjobbet.
      steps:
        - action: Läs inställningen för ändringsloggens lagringstid.
          expected: Den är 7 år eller mer efter utgången av det år då posten skapades.
        - action: Bakdatera en loggpost till 6 år och 11 månader sedan och kör gallringsjobbet.
          expected: Posten finns kvar.

  - id: AUD-T05
    priority: high
    execution: manual
    tags: [audit-trail, export, auditor]
    refs: ["21 CFR Part 11 §11.10(b)", "IEC 62443-3-3 SR 6.1", "IEC 62443-4-2 CR 6.1"]
    en:
      title: Audit export is complete and has a checksum
      description: Exports the audit trail for one record and one month and compares it with the view in the system.
      preconditions: A test record with at least 20 audit entries in the chosen month, and a user with the auditor role.
      expected: The export matches the system view and its checksum.
      steps:
        - action: Choose the record and the month and export the audit trail.
          expected: A CSV file and a SHA-256 checksum are delivered.
        - action: Compute the SHA-256 checksum of the file.
          expected: It equals the delivered checksum.
        - action: Compare the rows of the file with the entries shown in the system for the same selection.
          expected: The number of rows and every value match.
    sv:
      title: Exporten av ändringsloggen är fullständig och har en kontrollsumma
      description: Exporterar ändringsloggen för en post och en månad och jämför med vyn i systemet.
      preconditions: En testpost med minst 20 loggposter under den valda månaden och en användare med revisorsrollen.
      expected: Exporten stämmer med vyn i systemet och med sin kontrollsumma.
      steps:
        - action: Välj posten och månaden och exportera ändringsloggen.
          expected: En CSV-fil och en SHA-256-kontrollsumma levereras.
        - action: Beräkna SHA-256-kontrollsumman för filen.
          expected: Den är lika med den levererade kontrollsumman.
        - action: Jämför raderna i filen med de loggposter som systemet visar för samma urval.
          expected: Antalet rader och varje värde stämmer.

  - id: AUD-T06
    priority: medium
    execution: automated
    tags: [auditor, read-only]
    refs: ["ISO/IEC 27001:2022 A.8.34"]
    en:
      title: Auditor role can read but not change
      description: A script signs in with a user that has only the auditor role and calls read and write endpoints.
      preconditions: A test user with only the auditor role and a list of create, update and delete endpoints.
      expected: Reads and exports succeed and every write is refused.
      steps:
        - action: Read records and the audit trail and request an audit export.
          expected: Each request succeeds.
        - action: Call each create, update and delete endpoint.
          expected: Each response is 403 and nothing changes.
    sv:
      title: Revisorsrollen kan läsa men inte ändra
      description: Ett skript loggar in med en användare som bara har revisorsrollen och anropar endpoints för läsning och skrivning.
      preconditions: En testanvändare med enbart revisorsrollen och en lista över endpoints som skapar, uppdaterar och raderar.
      expected: Läsning och export lyckas och varje skrivning avvisas.
      steps:
        - action: Läs poster och ändringsloggen och begär en export av loggen.
          expected: Varje anrop lyckas.
        - action: Anropa varje endpoint som skapar, uppdaterar eller raderar.
          expected: Varje svar är 403 och ingenting ändras.

  - id: AUD-T07
    priority: critical
    execution: manual
    tags: [e-signature, re-authentication]
    refs: ["21 CFR Part 11 §11.50", "21 CFR Part 11 §11.200(a)", "IEC 62443-3-3 SR 2.12", "IEC 62443-4-2 CR 2.12", "CWE-306 (missing authentication for critical function)"]
    en:
      title: Signing requires re-authentication and records its meaning
      description: Signs a record with and without re-authentication and checks what is stored.
      preconditions: A signed-in user allowed to approve, and a record that is ready for approval.
      expected: Signing needs the password or second factor and stores name, time and meaning.
      steps:
        - action: Choose to approve the record and close the password prompt without entering anything.
          expected: The record is not signed.
        - action: Approve again and enter a wrong password.
          expected: The signature is refused.
        - action: Approve again with the correct password.
          expected: The record shows the signer's full name, a UTC time and the meaning Approved, and the audit trail has a matching entry.
    sv:
      title: Underskrift kräver ny autentisering och registrerar sin innebörd
      description: Skriver under en post med och utan ny autentisering och kontrollerar vad som sparas.
      preconditions: En inloggad användare som får godkänna och en post som är klar för godkännande.
      expected: Underskriften kräver lösenord eller andra faktor och sparar namn, tidpunkt och innebörd.
      steps:
        - action: Välj att godkänna posten och stäng lösenordsrutan utan att ange något.
          expected: Posten skrivs inte under.
        - action: Godkänn igen och ange fel lösenord.
          expected: Underskriften avvisas.
        - action: Godkänn igen med rätt lösenord.
          expected: Posten visar undertecknarens fullständiga namn, en tidpunkt i UTC och innebörden Godkänd, och ändringsloggen har en motsvarande post.

  - id: AUD-T08
    priority: high
    execution: manual
    tags: [e-signature, record-linking]
    refs: ["21 CFR Part 11 §11.70", "IEC 62443-3-3 SR 2.12", "IEC 62443-4-2 CR 2.12", "CWE-347 (improper verification of cryptographic signature)"]
    en:
      title: Changing a signed record invalidates the signature
      description: Changes a field of a signed record and checks the signature status.
      preconditions: A record that has been approved with an electronic signature, and a user allowed to edit it.
      expected: The signature is shown as invalid after the change.
      steps:
        - action: Open the signed record.
          expected: The signature is shown as valid.
        - action: Change one field and save.
          expected: The record shows the signature as invalidated by the change.
        - action: Open the audit trail of the record.
          expected: It shows the field change and the change of signature status with the same time.
    sv:
      title: Ändring av en undertecknad post gör underskriften ogiltig
      description: Ändrar ett fält i en undertecknad post och kontrollerar underskriftens status.
      preconditions: En post som har godkänts med elektronisk underskrift och en användare som får redigera den.
      expected: Underskriften visas som ogiltig efter ändringen.
      steps:
        - action: Öppna den undertecknade posten.
          expected: Underskriften visas som giltig.
        - action: Ändra ett fält och spara.
          expected: Posten visar att underskriften har blivit ogiltig genom ändringen.
        - action: Öppna postens ändringslogg.
          expected: Den visar fältändringen och ändringen av underskriftens status med samma tidpunkt.

  - id: AUD-T09
    priority: medium
    execution: manual
    tags: [audit-trail, reason-for-change]
    refs: ["EU GMP Annex 11 §9"]
    en:
      title: Changing an approved record asks for a reason
      description: Changes an approved record with no reason, a short reason and a valid reason.
      preconditions: An approved record and a user allowed to edit it.
      expected: The change is saved only with a reason of at least 10 characters, which is stored in the audit trail.
      steps:
        - action: Change a field of the approved record and save without a reason.
          expected: The save is refused and a reason is requested.
        - action: Enter a reason of 9 characters and save.
          expected: The save is refused with a message about the minimum length.
          data: Typo fix.
        - action: Enter a reason of 10 characters or more and save.
          expected: The change is saved and the reason appears in the audit entry.
          data: Typo in the title corrected
    sv:
      title: Ändring av en godkänd post kräver en orsak
      description: Ändrar en godkänd post utan orsak, med en för kort orsak och med en giltig orsak.
      preconditions: En godkänd post och en användare som får redigera den.
      expected: Ändringen sparas bara med en orsak på minst 10 tecken, som sparas i ändringsloggen.
      steps:
        - action: Ändra ett fält i den godkända posten och spara utan orsak.
          expected: Sparningen avvisas och en orsak efterfrågas.
        - action: Ange en orsak på 9 tecken och spara.
          expected: Sparningen avvisas med ett meddelande om minsta längd.
          data: Stavfel x
        - action: Ange en orsak på 10 tecken eller mer och spara.
          expected: Ändringen sparas och orsaken syns i loggposten.
          data: Stavfel i titeln rättat

  - id: AUD-T10
    priority: low
    execution: manual
    tags: [audit-trail, history-view]
    refs: ["EU GMP Annex 11 §9"]
    en:
      title: Record page shows its change history
      description: Opens the history tab of a record that has been changed several times.
      preconditions: A record that has been changed at least three times by two different users.
      expected: The history lists every change, newest first.
      steps:
        - action: Open the record and its history tab.
          expected: Every change is listed with user, time, field, old value and new value.
        - action: Check the order of the list.
          expected: The newest change is at the top.
    sv:
      title: Postens sida visar dess ändringshistorik
      description: Öppnar historikfliken för en post som har ändrats ett antal gånger.
      preconditions: En post som har ändrats minst tre gånger av två olika användare.
      expected: Historiken visar varje ändring med den senaste först.
      steps:
        - action: Öppna posten och dess historikflik.
          expected: Varje ändring visas med användare, tidpunkt, fält, gammalt värde och nytt värde.
        - action: Kontrollera ordningen i listan.
          expected: Den senaste ändringen ligger överst.

  - id: AUD-T11
    priority: medium
    execution: manual
    tags: [audit-trail, read-access]
    refs: ["CWE-778 (insufficient logging)", "MITRE ATT&CK T1213 (data from information repositories)"]
    en:
      title: Opening a sensitive record leaves an audit entry
      description: Opens a sensitive and an ordinary record and checks the audit trail.
      preconditions: A record classified as sensitive and an ordinary record; a user with read access to both; an auditor account.
      expected: Only the sensitive record's opening is recorded, with user, time and record id.
      steps:
        - action: As the user, open the sensitive record and note the time.
          expected: The record is shown.
        - action: As the user, open the ordinary record.
          expected: The record is shown.
        - action: As the auditor, search the audit trail for the user's entries of the last 5 minutes.
          expected: There is a read entry for the sensitive record with user, time and record id, and none for the ordinary record.
    sv:
      title: Att öppna en känslig post ger en post i ändringsloggen
      description: Öppnar en känslig och en vanlig post och kontrollerar ändringsloggen.
      preconditions: En post som klassats som känslig och en vanlig post; en användare med läsrätt till båda; ett konto för granskare.
      expected: Bara öppnandet av den känsliga posten registreras, med användare, tid och post-id.
      steps:
        - action: Öppna den känsliga posten som användaren och notera tiden.
          expected: Posten visas.
        - action: Öppna den vanliga posten som användaren.
          expected: Posten visas.
        - action: Sök som granskare i ändringsloggen efter användarens poster de senaste 5 minuterna.
          expected: Det finns en läspost för den känsliga posten med användare, tid och post-id, och ingen för den vanliga posten.

  - id: AUD-T12
    priority: medium
    execution: automated
    tags: [audit-trail, search, performance]
    refs: []
    en:
      title: Audit trail searches with 10 million entries
      description: Fills the audit trail of a test environment with 10 million entries and times three typical searches.
      preconditions: A production-like test environment; a script that generates 10 million audit entries spread over 2 years, 500 users and 100 000 records.
      expected: Each search returns its first page within 5 seconds.
      steps:
        - action: Generate the 10 million entries and wait until indexing has finished.
          expected: The audit trail reports 10 million entries.
          data: "10 000 000 entries, 2 years, 500 users, 100 000 records"
        - action: Search for all entries of one user and measure the time to the first page.
          expected: The first page is shown within 5 seconds.
        - action: Search for all entries of one record, then for all entries in one month, and measure each.
          expected: Each first page is shown within 5 seconds.
    sv:
      title: Sökningar i ändringsloggen med 10 miljoner poster
      description: Fyller ändringsloggen i en testmiljö med 10 miljoner poster och tar tid på tre typiska sökningar.
      preconditions: En produktionslik testmiljö; ett skript som genererar 10 miljoner poster i ändringsloggen fördelade på 2 år, 500 användare och 100 000 poster.
      expected: Varje sökning visar sin första sida inom 5 sekunder.
      steps:
        - action: Generera de 10 miljoner posterna och vänta tills indexeringen är klar.
          expected: Ändringsloggen anger 10 miljoner poster.
          data: "10 000 000 poster, 2 år, 500 användare, 100 000 poster"
        - action: Sök efter alla poster för en användare och mät tiden till första sidan.
          expected: Första sidan visas inom 5 sekunder.
        - action: Sök efter alla poster för en post och därefter efter alla poster under en månad, och mät var och en.
          expected: Varje första sida visas inom 5 sekunder.

  - id: AUD-T13
    priority: high
    execution: manual
    tags: [configuration-changes]
    refs: ["NIST SP 800-53 AU-2", "CWE-778 (insufficient logging)", "MITRE ATT&CK T1098 (account manipulation)"]
    en:
      title: Settings and role changes appear in the audit trail
      description: Changes a role, a workflow and a signature setting and searches the audit trail.
      preconditions: An administrator account and an auditor account in a test organisation.
      expected: Each change has an audit entry with administrator, time and old and new values.
      steps:
        - action: As administrator, add a permission to a role, remove a step from a workflow and change the signature meaning list.
          expected: The three changes are saved.
        - action: As auditor, search the audit trail for the administrator's changes today.
          expected: Three entries are listed, each with the administrator, UTC time, old value and new value.
    sv:
      title: Ändringar av inställningar och roller syns i granskningsloggen
      description: Ändrar en roll, ett arbetsflöde och en underskriftsinställning och söker i granskningsloggen.
      preconditions: Ett administratörskonto och ett granskarkonto i en testorganisation.
      expected: Varje ändring har en granskningspost med administratör, tid och gamla och nya värden.
      steps:
        - action: Lägg som administratör till en behörighet i en roll, ta bort ett steg ur ett arbetsflöde och ändra listan över underskrifters betydelse.
          expected: De tre ändringarna sparas.
        - action: Sök som granskare i granskningsloggen efter administratörens ändringar i dag.
          expected: Tre poster listas, var och en med administratör, UTC-tid, gammalt värde och nytt värde.

  - id: AUD-T14
    priority: critical
    execution: automated
    tags: [fail-closed]
    refs: ["IEC 62443-3-3 SR 2.10", "CWE-778 (insufficient logging)"]
    en:
      title: Edits are refused when the audit store is down
      description: Makes the audit store unavailable in a test environment and tries to edit a record.
      preconditions: A test environment where the audit store can be stopped, a test record and access to the operator alert channel.
      expected: The edit is refused, the record is unchanged and an alert is raised.
      steps:
        - action: Stop the audit store.
          expected: The audit store does not accept writes.
        - action: Edit the test record and save.
          expected: The save is refused with a message that the change was not saved.
        - action: Start the audit store and open the record.
          expected: The record has its earlier value, and the operator channel has an alert about the audit failure.
    sv:
      title: Redigeringar avvisas när granskningslagret är nere
      description: Gör granskningslagret otillgängligt i en testmiljö och försöker redigera en post.
      preconditions: En testmiljö där granskningslagret kan stoppas, en testpost och åtkomst till driftens larmkanal.
      expected: Redigeringen avvisas, posten är oförändrad och ett larm ges.
      steps:
        - action: Stoppa granskningslagret.
          expected: Granskningslagret tar inte emot skrivningar.
        - action: Redigera testposten och spara.
          expected: Sparandet avvisas med ett meddelande om att ändringen inte sparades.
        - action: Starta granskningslagret och öppna posten.
          expected: Posten har sitt tidigare värde, och driftens kanal har ett larm om felet i granskningsloggen.

  - id: AUD-T15
    priority: high
    execution: manual
    tags: [impersonation]
    refs: ["NIST SP 800-53 AU-3", "CWE-223 (omission of security-relevant information)"]
    en:
      title: Impersonated changes name the support engineer
      description: A support engineer acts as a customer user, changes a record and the audit entry is inspected.
      preconditions: A support account with the right to act as users, a customer test user and an auditor account.
      expected: The entry names both accounts and the impersonation session.
      steps:
        - action: As support, start acting as the customer user and change a record.
          expected: The change is saved and a banner shows the impersonation.
        - action: As auditor, open the audit entry of the change.
          expected: It shows the support account, the customer user and the impersonation session id.
    sv:
      title: Ändringar som annan användare anger supportteknikern
      description: En supporttekniker agerar som en kundanvändare och ändrar en post, och granskningsposten granskas.
      preconditions: Ett supportkonto med rätt att agera som användare, en kundanvändare för test och ett granskarkonto.
      expected: Posten anger båda kontona och sessionen.
      steps:
        - action: Börja som support agera som kundanvändaren och ändra en post.
          expected: Ändringen sparas och en banderoll visar att någon agerar som användaren.
        - action: Öppna som granskare granskningsposten för ändringen.
          expected: Den visar supportkontot, kundanvändaren och id för sessionen.

  - id: AUD-T16
    priority: medium
    execution: automated
    tags: [trusted-timestamp]
    refs: ["RFC 3161", "MITRE ATT&CK T1070 (indicator removal)"]
    en:
      title: Daily time-stamp tokens verify against the chain
      description: A script verifies the time-stamp tokens of the last 7 days against the authority certificate and the audit chain.
      preconditions: The time-stamp tokens, the authority's certificate chain and read access to the audit chain.
      expected: Seven valid tokens match the chain hashes of their days.
      steps:
        - action: Verify each token's signature against the authority's certificate chain.
          expected: Seven tokens verify, one per day.
        - action: Compare each token's message imprint with the chain hash stored for that day.
          expected: Each imprint matches.
    sv:
      title: Dagliga tidsstämplar kan verifieras mot kedjan
      description: Ett skript verifierar tidsstämplarna för de senaste 7 dagarna mot tjänstens certifikat och granskningskedjan.
      preconditions: Tidsstämplarna, tjänstens certifikatkedja och läsbehörighet till granskningskedjan.
      expected: Sju giltiga tidsstämplar stämmer med kedjans hashar för sina dagar.
      steps:
        - action: Verifiera varje tidsstämpels signatur mot tjänstens certifikatkedja.
          expected: Sju tidsstämplar verifieras, en per dag.
        - action: Jämför varje tidsstämpels meddelandeavtryck med den kedjehash som sparats för den dagen.
          expected: Varje avtryck stämmer.

  - id: AUD-T17
    priority: medium
    execution: manual
    tags: [audit-review]
    refs: ["EU GMP Annex 11 §9"]
    en:
      title: Audit reviews of critical data were done monthly
      description: Checks the review record for the last 3 months.
      preconditions: The list of record types classified as critical and the audit review record.
      expected: Each month has a review with reviewer, period and findings.
      steps:
        - action: Open the review record and filter on the last 3 months.
          expected: There is one entry per month.
        - action: Read each entry and follow up one finding.
          expected: Each entry has reviewer, covered period and findings, and the finding has a recorded action.
    sv:
      title: Granskningar av kritiska data gjordes varje månad
      description: Kontrollerar granskningsregistret för de senaste 3 månaderna.
      preconditions: Listan över posttyper som klassats som kritiska och registret över granskningar.
      expected: Varje månad har en granskning med granskare, period och iakttagelser.
      steps:
        - action: Öppna granskningsregistret och filtrera på de senaste 3 månaderna.
          expected: Det finns en post per månad.
        - action: Läs varje post och följ upp en iakttagelse.
          expected: Varje post har granskare, period och iakttagelser, och iakttagelsen har en registrerad åtgärd.

risks:
  - id: AUD-R01
    category: compliance
    likelihood: 3
    impact: 4
    tags: [accountability, audit]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "21 CFR Part 11 §11.10(e)", "CWE-778 (insufficient logging)"]
    mitigated_by: [AUD-01, AUD-14, AUD-13, AUD-10]
    en:
      title: Changes cannot be traced to a person
      description: Some changes are made without an audit entry, for example through configuration or bulk operations. Nobody can show who changed a record, and an audit or investigation fails.
      mitigation: Record every change in the audit trail, allow no change without an audit entry, audit configuration and permission changes and show the history on each record.
    sv:
      title: Ändringar kan inte spåras till en person
      description: Vissa ändringar görs utan en post i granskningsloggen, till exempel via konfiguration eller massoperationer. Ingen kan visa vem som ändrade en post, och en revision eller utredning misslyckas.
      mitigation: Registrera varje ändring i granskningsloggen, tillåt ingen ändring utan en granskningspost, logga ändringar av konfiguration och behörigheter och visa historiken på varje post.
  - id: AUD-R02
    category: security
    likelihood: 2
    impact: 4
    tags: [tampering, integrity]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "21 CFR Part 11 §11.10(e)", "CWE-353 (missing support for integrity check)"]
    mitigated_by: [AUD-02, AUD-03, AUD-16, AUD-06]
    attack: [T1070, T1565.001]
    en:
      title: Audit trail altered to cover up a change
      description: A privileged user or an attacker edits or deletes audit entries. The trail no longer shows what really happened and can no longer be used as evidence.
      mitigation: Make audit entries impossible to change or delete, chain them so that tampering is evident, time-stamp the chain externally every day and give auditors a read-only role.
    sv:
      title: Granskningsloggen ändras för att dölja en ändring
      description: En privilegierad användare eller en angripare ändrar eller raderar poster i granskningsloggen. Loggen visar inte längre vad som verkligen hände och kan inte längre användas som bevis.
      mitigation: Gör granskningsposter omöjliga att ändra eller radera, kedja dem så att manipulation syns, tidsstämpla kedjan externt varje dag och ge revisorer en roll med enbart läsrätt.
  - id: AUD-R03
    category: compliance
    likelihood: 2
    impact: 4
    tags: [electronic-signature, gxp]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "21 CFR Part 11 §11.70", "CWE-347 (improper verification of cryptographic signature)"]
    mitigated_by: [AUD-07, AUD-08, AUD-09]
    en:
      title: Electronic signature repudiated or moved to other content
      description: A signature can be given without re-authentication, or stays valid after the signed content changes. The signer denies the approval, or an approval appears to cover content it never covered.
      mitigation: Require re-authentication for each electronic signature, bind the signature to the signed content and record a reason for each change to an approved record.
    sv:
      title: Elektronisk underskrift förnekas eller flyttas till annat innehåll
      description: En underskrift kan ges utan förnyad autentisering eller fortsätter att gälla när det undertecknade innehållet ändras. Undertecknaren förnekar godkännandet, eller ett godkännande ser ut att omfatta innehåll det aldrig omfattade.
      mitigation: Kräv förnyad autentisering för varje elektronisk underskrift, bind underskriften till det undertecknade innehållet och registrera ett skäl för varje ändring av en godkänd post.
  - id: AUD-R04
    category: security
    likelihood: 2
    impact: 4
    tags: [impersonation, support-access]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "ISO/IEC 27001:2022 A.8.15", "CWE-778 (insufficient logging)"]
    mitigated_by: [AUD-15, AUD-13, AUD-11]
    attack: [T1078, T1098]
    en:
      title: Changes made while impersonating a user cannot be told apart
      description: An administrator or support person acts as a user, and the audit trail shows only the user. Permission changes and reads of sensitive records are not audited, so misuse cannot be proven or detected.
      mitigation: Record both identities during impersonation, audit configuration and permission changes and record reads of sensitive records.
    sv:
      title: Ändringar som görs i en annan användares namn går inte att skilja ut
      description: En administratör eller supportperson agerar som en användare och granskningsloggen visar bara användaren. Behörighetsändringar och läsning av känsliga poster loggas inte, så missbruk kan varken bevisas eller upptäckas.
      mitigation: Registrera båda identiteterna när någon agerar som en annan användare, logga konfigurations- och behörighetsändringar och registrera läsning av känsliga poster.
  - id: AUD-R05
    category: compliance
    likelihood: 3
    impact: 3
    tags: [review, critical-data]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "EU GMP Annex 11 §9", "21 CFR Part 11 §11.10(b)"]
    mitigated_by: [AUD-17, AUD-05, AUD-06]
    en:
      title: Audit trail kept but never reviewed
      description: Entries on critical data are recorded but nobody looks at them, and auditors cannot get an export. Unauthorised changes stay unnoticed until an inspection finds them.
      mitigation: Review audit entries on critical data every month and give auditors a read-only role and an export of the audit trail.
    sv:
      title: Granskningsloggen sparas men granskas aldrig
      description: Poster om kritiska data registreras men ingen tittar på dem, och revisorer kan inte få en export. Obehöriga ändringar upptäcks inte förrän en inspektion hittar dem.
      mitigation: Granska loggposter om kritiska data varje månad och ge revisorer en roll med enbart läsrätt och en export av granskningsloggen.
