# Reference sources: the laws, regulations, standards and best practices
# the catalogue cites in "refs" (see FORMAT.md, "Reference sources").
# Every ref must match exactly one source (checked by go test). To cite a
# new source, add one entry here.
#
#   - id: gdpr                    # unique: a-z 0-9 and "-"
#     kind: law                   # one of the kinds below
#     jurisdiction: EU            # optional: EU, SE, US, … (two capitals) or international
#     short: GDPR                 # optional short name (same in every language)
#     name: {en: …, sv: …}
#     match: ["GDPR "]            # prefixes a ref starts with (case sensitive)
#     regex: ['^OWASP .*Cheat Sheet']   # optional Go regular expressions
#     clause: 'Art\. \d+'         # optional: the clause group of a ref (default: see FORMAT.md)
#     url: https://…              # optional

kinds:
  - id: law
    name: {en: Laws and regulations, sv: Lagar och förordningar}
  - id: directive
    name: {en: Directives, sv: Direktiv}
  - id: standard
    name: {en: Standards and specifications, sv: Standarder och specifikationer}
  - id: practice
    name: {en: Best practices and frameworks, sv: Bästa praxis och ramverk}
  - id: guideline
    name: {en: Guidelines and guidance, sv: Riktlinjer och vägledningar}

