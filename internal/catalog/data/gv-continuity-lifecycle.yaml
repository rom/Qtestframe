area: gv-continuity-lifecycle
prefix: GVLC
group: operations
catalogue: governance
name: {en: "Suppliers, continuity and end of life", sv: "Leverantörer, kontinuitet och livscykelns slut"}
description:
  en: Supplier register and contract follow-up, exit plans, business continuity management per ISO 22301 (impact analysis, crisis organisation, exercises), obsolescence management, life-cycle planning and decommissioning with data sanitisation and disposal.
  sv: Leverantörsregister och avtalsuppföljning, exitplaner, kontinuitetshantering enligt ISO 22301 (konsekvensanalys, krisorganisation, övningar), hantering av komponenter som utgår, livscykelplanering och avveckling med radering av data och omhändertagande av utrustning.

requirements:
  - id: GVLC-01
    type: business
    obligation: must
    priority: high
    tags: [supplier, supplier-register]
    refs: ["ISO 9001:2026 §8.4.1", "ISO/IEC 27001:2022 A.5.19", "Directive (EU) 2022/2555 (NIS2) Art. 21(2)(d)"]
    tests: [GVLC-T01]
    en:
      title: Supplier register with criticality and contract owner
      description: The organisation MUST keep a supplier register that states for each supplier the delivered products or services, a criticality class, a contract owner and the contract end date.
      rationale: Suppliers can be followed up and replaced in time only when it is known who they are, how much depends on them and who answers for the contract.
      criteria:
        - method: inspection
          text: Each supplier with an active contract is in the register with all four fields, and each contract in the contract archive matches a register entry.
    sv:
      title: Leverantörsregister med kritikalitet och avtalsägare
      description: Organisationen SKA föra ett leverantörsregister som för varje leverantör anger levererade produkter eller tjänster, en kritikalitetsklass, en avtalsägare och avtalets slutdatum.
      rationale: Leverantörer kan följas upp och ersättas i tid bara när det är känt vilka de är, hur mycket som beror på dem och vem som ansvarar för avtalet.
      criteria:
        - method: inspection
          text: Varje leverantör med ett aktivt avtal finns i registret med alla fyra uppgifterna, och varje avtal i avtalsarkivet motsvaras av en post i registret.

  - id: GVLC-02
    type: regulatory
    obligation: must
    priority: high
    tags: [supplier, contract]
    refs: ["ISO/IEC 27001:2022 A.5.20", "Directive (EU) 2022/2555 (NIS2) Art. 21(2)(d)", "EN 13269:2016"]
    tests: [GVLC-T01]
    en:
      title: Contract terms for critical suppliers
      description: Each contract with a critical supplier MUST contain service levels, security requirements, a right to audit and exit terms.
      rationale: Terms that are not in the contract cannot be enforced when the supplier underperforms or the relationship ends.
      criteria:
        - method: review
          text: Each contract with a supplier in the highest criticality class contains a clause for each of the four topics.
          threshold: "4 topics"
    sv:
      title: Avtalsvillkor för kritiska leverantörer
      description: Varje avtal med en kritisk leverantör SKA innehålla servicenivåer, säkerhetskrav, rätt till revision och villkor för avslut.
      rationale: Villkor som inte står i avtalet kan inte göras gällande när leverantören inte levererar eller samarbetet upphör.
      criteria:
        - method: review
          text: Varje avtal med en leverantör i den högsta kritikalitetsklassen innehåller en klausul för vart och ett av de fyra områdena.
          threshold: "4 områden"

  - id: GVLC-03
    type: business
    obligation: should
    priority: medium
    tags: [supplier, supplier-review]
    refs: ["ISO/IEC 27001:2022 A.5.22", "ISO 9001:2026 §8.4.1", "ITIL 4 Supplier management"]
    tests: [GVLC-T02]
    en:
      title: Quarterly review of critical suppliers
      description: The contract owner SHOULD review the delivered service levels of each critical supplier once per quarter and record the deviations and agreed actions.
      rationale: Regular follow-up catches a falling service level while there is still time to correct it within the contract.
      criteria:
        - method: review
          text: For each critical supplier there are four review records from the last 12 months, each with the measured service levels, the deviations and the agreed actions.
          threshold: "1 review per quarter"
    sv:
      title: Kvartalsvis uppföljning av kritiska leverantörer
      description: Avtalsägaren BÖR en gång per kvartal följa upp de levererade servicenivåerna för varje kritisk leverantör och dokumentera avvikelser och överenskomna åtgärder.
      rationale: Regelbunden uppföljning fångar en sjunkande servicenivå medan det fortfarande finns tid att rätta den inom avtalet.
      criteria:
        - method: review
          text: För varje kritisk leverantör finns fyra uppföljningar från de senaste 12 månaderna, var och en med uppmätta servicenivåer, avvikelser och överenskomna åtgärder.
          threshold: "1 uppföljning per kvartal"

  - id: GVLC-04
    type: functional
    obligation: should
    priority: medium
    tags: [contract, reminder]
    refs: ["ITIL 4 Supplier management"]
    tests: [GVLC-T02]
    en:
      title: Reminder 6 months before a notice deadline
      description: The contract management system SHOULD notify the contract owner 6 months before the notice deadline or end date of each contract.
      rationale: Contracts that renew silently or expire unnoticed leave no time to renegotiate or to procure a replacement.
      criteria:
        - method: test
          text: A test contract with a notice deadline 6 months and 1 day ahead sends a reminder to the contract owner on the next day.
          threshold: "6 months ahead"
    sv:
      title: Påminnelse 6 månader före en uppsägningstid
      description: Avtalssystemet BÖR meddela avtalsägaren 6 månader före sista dag för uppsägning eller slutdatum för varje avtal.
      rationale: Avtal som förlängs utan att någon märker det eller löper ut obemärkt lämnar ingen tid att omförhandla eller upphandla en ersättare.
      criteria:
        - method: test
          text: Ett testavtal med sista uppsägningsdag om 6 månader och 1 dag skickar en påminnelse till avtalsägaren dagen därpå.
          threshold: "6 månader i förväg"

  - id: GVLC-05
    type: business
    obligation: should
    priority: high
    tags: [supplier, exit-plan]
    refs: ["ISO/IEC 27001:2022 A.5.19", "ITIL 4 Supplier management"]
    tests: [GVLC-T03]
    en:
      title: Exit plan for each critical supplier
      description: The contract owner SHOULD keep an exit plan for each critical supplier that covers the return of data, the transition to another supplier and the time it takes, and review it every 24 months.
      rationale: An exit is hardest to plan when it has become urgent; a plan made in calm conditions avoids lock-in and loss of data.
      criteria:
        - method: review
          text: Each critical supplier has an exit plan less than 24 months old that covers data return, transition and an estimated duration.
          threshold: "≤ 24 months between reviews"
    sv:
      title: Exitplan för varje kritisk leverantör
      description: Avtalsägaren BÖR ha en exitplan för varje kritisk leverantör som omfattar återlämning av data, övergång till en annan leverantör och den tid det tar, och granska den var 24:e månad.
      rationale: Ett avslut är svårast att planera när det har blivit brådskande; en plan som görs i lugnt läge undviker inlåsning och förlust av data.
      criteria:
        - method: review
          text: Varje kritisk leverantör har en exitplan som är yngre än 24 månader och som omfattar återlämning av data, övergång och en uppskattad tidsåtgång.
          threshold: "≤ 24 månader mellan granskningarna"

  - id: GVLC-06
    type: business
    obligation: must
    priority: high
    tags: [business-continuity, business-impact-analysis]
    refs: ["ISO 22301:2019 §8.2.2 (business impact analysis)"]
    tests: [GVLC-T04]
    en:
      title: Business impact analysis reviewed every 12 months
      description: The organisation MUST keep a business impact analysis that gives each critical activity a maximum tolerable period of disruption and a recovery time objective, and review it every 12 months.
      rationale: Continuity planning without agreed recovery targets spends effort on the wrong activities and leaves the vital ones unprotected.
      criteria:
        - method: review
          text: The analysis is less than 12 months old, and each critical activity in it has a maximum tolerable period of disruption and a shorter recovery time objective.
          threshold: "≤ 12 months between reviews"
    sv:
      title: Konsekvensanalys som granskas var 12:e månad
      description: Organisationen SKA ha en konsekvensanalys som ger varje kritisk verksamhet en längsta tolererbara avbrottstid och ett mål för återställningstid och granska den var 12:e månad.
      rationale: Kontinuitetsplanering utan överenskomna mål för återställning lägger kraft på fel verksamheter och lämnar de livsviktiga oskyddade.
      criteria:
        - method: review
          text: Analysen är yngre än 12 månader, och varje kritisk verksamhet i den har en längsta tolererbara avbrottstid och ett kortare mål för återställningstid.
          threshold: "≤ 12 månader mellan granskningarna"

  - id: GVLC-07
    type: business
    obligation: should
    priority: medium
    tags: [business-continuity, strategy]
    refs: ["ISO 22301:2019 §8.3"]
    tests: [GVLC-T04]
    en:
      title: Continuity solution for each critical activity
      description: The business continuity plan SHOULD name for each critical activity a continuity solution whose documented recovery time is within the activity's recovery time objective.
      rationale: A recovery target only protects the business when a solution exists that can meet it.
      criteria:
        - method: analysis
          text: For each critical activity the plan names a solution, and its documented recovery time is equal to or shorter than the recovery time objective.
    sv:
      title: Kontinuitetslösning för varje kritisk verksamhet
      description: Kontinuitetsplanen BÖR för varje kritisk verksamhet ange en kontinuitetslösning vars dokumenterade återställningstid ligger inom verksamhetens mål för återställningstid.
      rationale: Ett mål för återställning skyddar verksamheten bara när det finns en lösning som kan nå det.
      criteria:
        - method: analysis
          text: För varje kritisk verksamhet anger planen en lösning, och dess dokumenterade återställningstid är lika med eller kortare än målet för återställningstid.

  - id: GVLC-08
    type: business
    obligation: must
    priority: high
    tags: [business-continuity, crisis-management]
    refs: ["ISO 22301:2019 §8.4.2 (response structure)"]
    tests: [GVLC-T05]
    en:
      title: Crisis organisation with named deputies
      description: The organisation MUST appoint a crisis management team with a named holder and a named deputy for each role, and verify their contact details every 6 months.
      rationale: In a disruption the first hour is lost if no one knows who leads, or if the phone numbers are wrong.
      criteria:
        - method: inspection
          text: Each role in the crisis organisation has a holder and a deputy, and the contact list has a verification date less than 6 months old.
          threshold: "≤ 6 months between verifications"
    sv:
      title: Krisorganisation med namngivna ersättare
      description: Organisationen SKA utse en krisledningsgrupp med en namngiven innehavare och en namngiven ersättare för varje roll och kontrollera deras kontaktuppgifter var 6:e månad.
      rationale: Vid en störning går den första timmen förlorad om ingen vet vem som leder eller om telefonnumren är fel.
      criteria:
        - method: inspection
          text: Varje roll i krisorganisationen har en innehavare och en ersättare, och kontaktlistan har ett kontrolldatum som är yngre än 6 månader.
          threshold: "≤ 6 månader mellan kontrollerna"

  - id: GVLC-09
    type: business
    obligation: must
    priority: high
    tags: [business-continuity, exercise]
    refs: ["ISO 22301:2019 §8.5 (exercise programme)"]
    tests: [GVLC-T06]
    en:
      title: Each continuity plan exercised every 12 months
      description: The organisation MUST exercise each business continuity plan at least once every 12 months and record the result with the improvement actions.
      rationale: Plans that are never exercised contain wrong assumptions that surface only in a real disruption.
      criteria:
        - method: review
          text: Each continuity plan has an exercise report less than 12 months old, and each improvement action in it has an owner and a due date.
          threshold: "≤ 12 months between exercises"
    sv:
      title: Varje kontinuitetsplan övas var 12:e månad
      description: Organisationen SKA öva varje kontinuitetsplan minst en gång var 12:e månad och dokumentera resultatet med förbättringsåtgärderna.
      rationale: Planer som aldrig övas innehåller felaktiga antaganden som visar sig först vid en verklig störning.
      criteria:
        - method: review
          text: Varje kontinuitetsplan har en övningsrapport som är yngre än 12 månader, och varje förbättringsåtgärd i den har ägare och slutdatum.
          threshold: "≤ 12 månader mellan övningarna"

  - id: GVLC-10
    type: constraint
    obligation: should
    priority: medium
    tags: [business-continuity, offline-copy]
    refs: ["ISO 22301:2019 §8.4"]
    tests: [GVLC-T05]
    en:
      title: Continuity plans reachable without the primary IT
      description: Each member of the crisis management team SHOULD have access to the current continuity plans and contact list without the organisation's primary IT services.
      rationale: The plans are needed most when the systems that normally store them are down.
      criteria:
        - method: demonstration
          text: With the primary network and file services disconnected, each team member present opens the current version of the plan and the contact list.
    sv:
      title: Kontinuitetsplaner som nås utan den ordinarie it-miljön
      description: Varje medlem i krisledningsgruppen BÖR ha tillgång till de gällande kontinuitetsplanerna och kontaktlistan utan organisationens ordinarie it-tjänster.
      rationale: Planerna behövs som mest när de system som de normalt lagras i ligger nere.
      criteria:
        - method: demonstration
          text: Med det ordinarie nätverket och filtjänsterna bortkopplade öppnar varje närvarande gruppmedlem den gällande versionen av planen och kontaktlistan.

  - id: GVLC-11
    type: business
    obligation: must
    priority: high
    tags: [obsolescence, end-of-support]
    refs: ["IEC 62402:2019"]
    tests: [GVLC-T07]
    en:
      title: Monitoring of end-of-support dates
      description: The organisation MUST keep a list of the hardware and software components of each class 1 asset with their announced end-of-support dates and check the list against supplier notices every quarter.
      rationale: Components that lose support stop receiving spare parts and security fixes; an early warning gives time to plan the replacement.
      criteria:
        - method: review
          text: The component list has a check date less than 3 months old, and each component has an end-of-support date or the note that none is announced.
          threshold: "≤ 3 months between checks"
    sv:
      title: Bevakning av datum för upphörande support
      description: Organisationen SKA ha en lista över hård- och programvarukomponenterna i varje tillgång i klass 1 med deras aviserade datum för upphörande support och stämma av listan mot leverantörernas meddelanden varje kvartal.
      rationale: Komponenter som förlorar sin support slutar få reservdelar och säkerhetsrättningar; en tidig varning ger tid att planera utbytet.
      criteria:
        - method: review
          text: Komponentlistan har ett kontrolldatum som är yngre än 3 månader, och varje komponent har ett datum för upphörande support eller en anteckning om att inget datum är aviserat.
          threshold: "≤ 3 månader mellan kontrollerna"

  - id: GVLC-12
    type: business
    obligation: should
    priority: medium
    tags: [obsolescence, decision]
    refs: ["IEC 62402:2019"]
    tests: [GVLC-T07]
    en:
      title: Obsolescence decision 24 months before end of support
      description: The asset owner SHOULD decide on a last-time buy, a replacement or a redesign at least 24 months before the end of support of a component in a class 1 asset.
      rationale: Replacing a critical component takes procurement, testing and installation time that is lost if the decision waits for the end date.
      criteria:
        - method: review
          text: Each component with an end of support within 24 months has a recorded decision with the chosen option and a plan date.
          threshold: "≥ 24 months ahead"
    sv:
      title: Beslut om utgående komponent 24 månader före supportens slut
      description: Tillgångsägaren BÖR besluta om sista köp, utbyte eller omkonstruktion minst 24 månader innan supporten upphör för en komponent i en tillgång i klass 1.
      rationale: Att byta ut en kritisk komponent kräver tid för upphandling, test och installation som går förlorad om beslutet väntar till slutdatumet.
      criteria:
        - method: review
          text: Varje komponent vars support upphör inom 24 månader har ett dokumenterat beslut med valt alternativ och ett planerat datum.
          threshold: "≥ 24 månader i förväg"

  - id: GVLC-13
    type: business
    obligation: should
    priority: medium
    tags: [life-cycle, replacement]
    refs: ["ISO 55001:2024 §6.2 (asset management objectives and planning)"]
    tests: [GVLC-T08]
    en:
      title: Planned replacement year for critical assets
      description: The asset management plan SHOULD state a planned replacement year and an estimated cost for each class 1 asset.
      rationale: Known replacement dates and costs let the organisation budget for them instead of facing them as emergencies.
      criteria:
        - method: inspection
          text: Each class 1 asset in the register has a planned replacement year and an estimated cost in the asset management plan.
    sv:
      title: Planerat utbytesår för kritiska tillgångar
      description: Planen för tillgångsförvaltning BÖR ange ett planerat utbytesår och en uppskattad kostnad för varje tillgång i klass 1.
      rationale: Kända utbytesår och kostnader låter organisationen budgetera för dem i stället för att möta dem som akuta händelser.
      criteria:
        - method: inspection
          text: Varje tillgång i klass 1 i registret har ett planerat utbytesår och en uppskattad kostnad i planen för tillgångsförvaltning.

  - id: GVLC-14
    type: business
    obligation: must
    priority: high
    tags: [decommissioning]
    refs: ["ISO 55001:2024 §8.2 (control of change)", "ISO/IEC 27001:2022 A.8.32"]
    tests: [GVLC-T09]
    en:
      title: Approved decommissioning plan
      description: The asset owner MUST approve a decommissioning plan that covers the dependent systems, the data, the licences, the contracts and the users before a system is taken out of operation.
      rationale: Systems that are switched off without a plan break the systems that depend on them and leave contracts and licences running.
      criteria:
        - method: review
          text: Each system decommissioned in the last 12 months has a plan approved before the shutdown date that covers the five topics.
          threshold: "5 topics"
    sv:
      title: Godkänd avvecklingsplan
      description: Tillgångsägaren SKA godkänna en avvecklingsplan som omfattar beroende system, data, licenser, avtal och användare innan ett system tas ur drift.
      rationale: System som stängs av utan plan slår ut de system som beror på dem och lämnar avtal och licenser löpande.
      criteria:
        - method: review
          text: Varje system som har avvecklats under de senaste 12 månaderna har en plan som godkändes före avstängningsdatumet och som omfattar de fem områdena.
          threshold: "5 områden"

  - id: GVLC-15
    type: regulatory
    obligation: must
    priority: high
    tags: [decommissioning, records, archive]
    refs: ["ISO/IEC 27001:2022 A.5.33"]
    tests: [GVLC-T09]
    en:
      title: Records archived before removal
      description: The records of a system that are subject to a retention period MUST be moved to an archive and verified as readable before the system is removed.
      rationale: Retention obligations continue after the system is gone, and records that cannot be read later are of no use as evidence.
      criteria:
        - method: inspection
          text: For each decommissioned system an archive record lists the moved records with their retention period and a verification of readability dated before the removal.
    sv:
      title: Handlingar arkiveras före borttagning
      description: Ett systems handlingar med en bevarandetid SKA flyttas till ett arkiv och kontrolleras som läsbara innan systemet tas bort.
      rationale: Skyldigheten att bevara handlingar gäller även efter att systemet är borta, och handlingar som inte går att läsa senare duger inte som bevis.
      criteria:
        - method: inspection
          text: För varje avvecklat system finns en arkivanteckning som anger de flyttade handlingarna med bevarandetid och en kontroll av läsbarheten daterad före borttagningen.

  - id: GVLC-16
    type: security
    obligation: must
    priority: critical
    tags: [decommissioning, sanitisation]
    refs: ["ISO/IEC 27001:2022 A.7.14", "ISO/IEC 27001:2022 A.8.10", "NIST SP 800-88 Rev. 2"]
    tests: [GVLC-T10]
    en:
      title: Storage media sanitised with a certificate
      description: Each storage medium of a decommissioned system MUST be sanitised or destroyed before it leaves the organisation's control, with a certificate per medium.
      rationale: Discarded disks and memory cards are a common source of data leaks long after a system is gone.
      criteria:
        - method: inspection
          text: For each storage medium in the asset register of a decommissioned system there is a sanitisation or destruction certificate with the medium's serial number.
    sv:
      title: Lagringsmedier raderas med intyg
      description: Varje lagringsmedium i ett avvecklat system SKA raderas eller förstöras innan det lämnar organisationens kontroll, med ett intyg per medium.
      rationale: Kasserade diskar och minneskort är en vanlig källa till dataläckor långt efter att ett system är borta.
      criteria:
        - method: inspection
          text: För varje lagringsmedium i tillgångsregistret för ett avvecklat system finns ett intyg om radering eller förstöring med mediets serienummer.

  - id: GVLC-17
    type: regulatory
    obligation: must
    priority: medium
    tags: [decommissioning, disposal, weee]
    refs: ["Directive 2012/19/EU (WEEE)"]
    tests: [GVLC-T10]
    en:
      title: Disposal of electronic equipment through a licensed recycler
      description: The organisation MUST hand over discarded electrical and electronic equipment to a licensed recycler and keep the receipt of each handover.
      rationale: Electronic waste contains hazardous substances and valuable materials, and its handling is regulated.
      criteria:
        - method: inspection
          text: Each piece of discarded equipment in the asset register has a handover receipt from a recycler whose licence is valid on the handover date.
    sv:
      title: Omhändertagande av elektronisk utrustning via godkänd återvinnare
      description: Organisationen SKA lämna kasserad elektrisk och elektronisk utrustning till en godkänd återvinnare och spara kvittot för varje överlämning.
      rationale: Elektronikavfall innehåller farliga ämnen och värdefulla material, och hanteringen av det är reglerad.
      criteria:
        - method: inspection
          text: Varje kasserad utrustning i tillgångsregistret har ett kvitto på överlämning från en återvinnare vars tillstånd gäller på överlämningsdagen.

  - id: GVLC-18
    type: security
    obligation: must
    priority: high
    tags: [decommissioning, access]
    refs: ["ISO/IEC 27001:2022 A.5.18"]
    tests: [GVLC-T11]
    en:
      title: Accounts and certificates revoked within 5 working days
      description: The accounts, keys and certificates of a decommissioned system MUST be revoked within 5 working days after its shutdown.
      rationale: Credentials that outlive their system are forgotten and remain a way into the systems that trusted it.
      criteria:
        - method: inspection
          text: For each decommissioned system the identity management and certificate records show each of its accounts, keys and certificates revoked within 5 working days of the shutdown.
          threshold: "≤ 5 working days"
    sv:
      title: Konton och certifikat spärras inom 5 arbetsdagar
      description: Ett avvecklat systems konton, nycklar och certifikat SKA spärras inom 5 arbetsdagar efter avstängningen.
      rationale: Inloggningsuppgifter som lever kvar efter sitt system glöms bort och förblir en väg in i de system som litade på det.
      criteria:
        - method: inspection
          text: För varje avvecklat system visar identitetshanteringen och certifikatregistret att vart och ett av dess konton, nycklar och certifikat spärrades inom 5 arbetsdagar efter avstängningen.
          threshold: "≤ 5 arbetsdagar"

  - id: GVLC-19
    type: business
    obligation: must
    priority: high
    tags: [business-impact-analysis, rto, mtpd]
    refs: ["ISO 22301:2019 §8.2.2 (business impact analysis)"]
    tests: [GVLC-T12]
    en:
      title: Recovery time objective shorter than the maximum tolerable disruption
      description: The business impact analysis MUST set for each critical activity a maximum tolerable period of disruption and a recovery time objective that is shorter than that period.
      rationale: A recovery objective equal to or longer than the tolerable disruption leaves no margin for the delays that always occur in a real recovery.
      criteria:
        - method: review
          text: Each critical activity in the analysis has both values, and each recovery time objective is shorter than its maximum tolerable period.
    sv:
      title: Mål för återställningstid kortare än längsta tolererbara avbrott
      description: Konsekvensanalysen SKA för varje kritisk aktivitet ange en längsta tolererbar avbrottstid och ett mål för återställningstid som är kortare än den tiden.
      rationale: Ett återställningsmål som är lika långt eller längre än det tolererbara avbrottet lämnar ingen marginal för de förseningar som alltid uppstår vid en verklig återställning.
      criteria:
        - method: review
          text: Varje kritisk aktivitet i analysen har båda värdena, och varje mål för återställningstid är kortare än den längsta tolererbara avbrottstiden.

  - id: GVLC-20
    type: business
    obligation: must
    priority: high
    tags: [crisis-communication, templates, contacts]
    refs: ["ISO 22301:2019 §8.4.3 (warning and communication)"]
    tests: [GVLC-T12]
    en:
      title: Crisis communication with approved message templates and tested contact lists
      description: The crisis organisation MUST keep approved message templates for staff, customers, media and authorities, and test the contact lists for these groups at least once every 6 months.
      rationale: In the first hour of a crisis there is no time to write and approve messages from scratch or to search for phone numbers.
      criteria:
        - method: review
          text: Templates exist for the 4 groups with an approval date, and a contact test less than 6 months old reached at least 90 % of the listed contacts.
          threshold: "test ≤ 6 months; reach ≥ 90 %"
    sv:
      title: Kriskommunikation med godkända meddelandemallar och provade kontaktlistor
      description: Krisorganisationen SKA ha godkända meddelandemallar för personal, kunder, medier och myndigheter, och prova kontaktlistorna för dessa grupper minst en gång var 6:e månad.
      rationale: Den första timmen i en kris finns ingen tid att skriva och godkänna meddelanden från grunden eller att leta efter telefonnummer.
      criteria:
        - method: review
          text: Mallar finns för de 4 grupperna med ett godkännandedatum, och ett kontaktprov som är mindre än 6 månader gammalt nådde minst 90 % av de listade kontakterna.
          threshold: "prov ≤ 6 månader; nådda ≥ 90 %"

  - id: GVLC-21
    type: business
    obligation: must
    priority: medium
    tags: [post-incident-review, continuity, lessons-learned]
    refs: ["ISO 22301:2019 §8.6 (evaluation of business continuity documentation and capabilities)"]
    tests: [GVLC-T13]
    en:
      title: Review within 30 days after each activation of a continuity plan
      description: After each real activation of a continuity plan, the plan owner MUST hold a review within 30 days that compares the actual recovery times with the objectives and records the changes to the plan.
      rationale: A real activation is the best test of a plan, and its lessons are lost if nobody records them while memories are fresh.
      criteria:
        - method: review
          text: Each activation in the incident log of the last 12 months has a review record within 30 days with actual against target times and plan changes.
          threshold: "≤ 30 days"
    sv:
      title: Genomgång inom 30 dagar efter varje aktivering av en kontinuitetsplan
      description: Efter varje verklig aktivering av en kontinuitetsplan SKA planens ägare hålla en genomgång inom 30 dagar som jämför de faktiska återställningstiderna med målen och dokumenterar ändringarna av planen.
      rationale: En verklig aktivering är det bästa provet av en plan, och lärdomarna går förlorade om ingen dokumenterar dem medan minnet är färskt.
      criteria:
        - method: review
          text: Varje aktivering i incidentloggen under de senaste 12 månaderna har en dokumenterad genomgång inom 30 dagar med faktiska tider mot målen och ändringar av planen.
          threshold: "≤ 30 dagar"

  - id: GVLC-22
    type: business
    obligation: should
    priority: medium
    tags: [life-cycle-cost, investment, replacement]
    refs: ["IEC 60300-3-3:2017 (life cycle costing)", "ISO 55001:2024 §6.2 (asset management objectives and planning)"]
    tests: [GVLC-T13]
    en:
      title: Life cycle cost in each investment and replacement decision
      description: Each decision on investing in or replacing an asset above the agreed value limit SHOULD be based on a life cycle cost estimate that includes acquisition, operation, maintenance and disposal over the planned life.
      rationale: The purchase price is often a minor part of the total cost, and decisions on price alone lead to higher costs over the life of the asset.
      criteria:
        - method: review
          text: Each investment decision above the limit in the last 12 months has a life cycle cost estimate with the 4 cost elements and the planned life.
    sv:
      title: Livscykelkostnad i varje beslut om investering och utbyte
      description: Varje beslut om att investera i eller byta ut en tillgång över den avtalade beloppsgränsen BÖR grundas på en uppskattning av livscykelkostnaden som omfattar anskaffning, drift, underhåll och avveckling under den planerade livslängden.
      rationale: Inköpspriset är ofta en mindre del av den totala kostnaden, och beslut som bara utgår från priset leder till högre kostnader under tillgångens livslängd.
      criteria:
        - method: review
          text: Varje investeringsbeslut över gränsen under de senaste 12 månaderna har en uppskattning av livscykelkostnaden med de 4 kostnadsposterna och den planerade livslängden.

tests:
  - id: GVLC-T01
    priority: high
    execution: manual
    tags: [supplier, contract]
    refs: ["ISO/IEC 27001:2022 A.5.19", "ISO/IEC 27001:2022 A.5.20"]
    en:
      title: Review of the supplier register and critical contracts
      description: Checks the supplier register against the contract archive and the contract terms of critical suppliers.
      preconditions: The supplier register and the contract archive with all active contracts.
      expected: Every active contract has a complete register entry, and every critical supplier contract covers the four topics.
      steps:
        - action: Match each active contract in the archive to an entry in the supplier register.
          expected: Each contract has an entry with products or services, criticality class, contract owner and end date.
        - action: Read each contract with a supplier in the highest criticality class.
          expected: Each contract has clauses for service levels, security requirements, a right to audit and exit terms.
    sv:
      title: Granskning av leverantörsregistret och kritiska avtal
      description: Kontrollerar leverantörsregistret mot avtalsarkivet och avtalsvillkoren för kritiska leverantörer.
      preconditions: Leverantörsregistret och avtalsarkivet med alla aktiva avtal.
      expected: Varje aktivt avtal har en fullständig post i registret, och varje avtal med en kritisk leverantör täcker de fyra områdena.
      steps:
        - action: Koppla varje aktivt avtal i arkivet till en post i leverantörsregistret.
          expected: Varje avtal har en post med produkter eller tjänster, kritikalitetsklass, avtalsägare och slutdatum.
        - action: Läs varje avtal med en leverantör i den högsta kritikalitetsklassen.
          expected: Varje avtal har klausuler om servicenivåer, säkerhetskrav, rätt till revision och villkor för avslut.

  - id: GVLC-T02
    priority: medium
    execution: manual
    tags: [supplier-review, reminder]
    refs: ["ISO/IEC 27001:2022 A.5.22", "ITIL 4 Supplier management"]
    en:
      title: Supplier reviews and contract reminders
      description: Checks the quarterly supplier reviews and tests the reminder before a notice deadline.
      preconditions: The supplier review records of the last 12 months and a test account in the contract management system.
      expected: Each critical supplier has four quarterly reviews, and the reminder is sent 6 months before the notice deadline.
      steps:
        - action: Count the review records of the last 12 months for each critical supplier.
          expected: Each critical supplier has four records with service levels, deviations and actions.
        - action: Create a test contract with a notice deadline 6 months and 1 day from today and the tester as contract owner.
          expected: The contract is saved.
          data: "Notice deadline = today + 6 months + 1 day"
        - action: Check the tester's notifications on the following day.
          expected: A reminder about the test contract's notice deadline has arrived.
    sv:
      title: Leverantörsuppföljningar och avtalspåminnelser
      description: Kontrollerar de kvartalsvisa leverantörsuppföljningarna och testar påminnelsen före en uppsägningstid.
      preconditions: Leverantörsuppföljningarna för de senaste 12 månaderna och ett testkonto i avtalssystemet.
      expected: Varje kritisk leverantör har fyra kvartalsvisa uppföljningar, och påminnelsen skickas 6 månader före sista uppsägningsdag.
      steps:
        - action: Räkna uppföljningarna under de senaste 12 månaderna för varje kritisk leverantör.
          expected: Varje kritisk leverantör har fyra uppföljningar med servicenivåer, avvikelser och åtgärder.
        - action: Skapa ett testavtal med sista uppsägningsdag om 6 månader och 1 dag från i dag och testaren som avtalsägare.
          expected: Avtalet sparas.
          data: "Sista uppsägningsdag = i dag + 6 månader + 1 dag"
        - action: Kontrollera testarens aviseringar dagen därpå.
          expected: En påminnelse om testavtalets sista uppsägningsdag har kommit.

  - id: GVLC-T03
    priority: high
    execution: manual
    tags: [exit-plan]
    refs: ["ISO/IEC 27001:2022 A.5.19"]
    en:
      title: Review of supplier exit plans
      description: Checks that each critical supplier has a current and complete exit plan.
      preconditions: The list of critical suppliers and their exit plans.
      expected: Each critical supplier has an exit plan less than 24 months old covering data return, transition and duration.
      steps:
        - action: Find the exit plan for each critical supplier and check its review date.
          expected: Each plan exists and was reviewed within the last 24 months.
        - action: Check the content of each plan.
          expected: Each plan covers the return of data, the transition to another supplier and an estimated duration.
    sv:
      title: Granskning av exitplaner för leverantörer
      description: Kontrollerar att varje kritisk leverantör har en aktuell och fullständig exitplan.
      preconditions: Listan över kritiska leverantörer och deras exitplaner.
      expected: Varje kritisk leverantör har en exitplan som är yngre än 24 månader och omfattar återlämning av data, övergång och tidsåtgång.
      steps:
        - action: Leta upp exitplanen för varje kritisk leverantör och kontrollera dess granskningsdatum.
          expected: Varje plan finns och har granskats under de senaste 24 månaderna.
        - action: Kontrollera innehållet i varje plan.
          expected: Varje plan omfattar återlämning av data, övergång till en annan leverantör och en uppskattad tidsåtgång.

  - id: GVLC-T04
    priority: high
    execution: manual
    tags: [business-impact-analysis, strategy]
    refs: ["ISO 22301:2019 §8.2.2 (business impact analysis)", "ISO 22301:2019 §8.3"]
    en:
      title: Review of the impact analysis and continuity solutions
      description: Checks the business impact analysis and that each critical activity has a solution that meets its recovery time objective.
      preconditions: The current business impact analysis and the business continuity plan.
      expected: The analysis is less than 12 months old with targets for each critical activity, and each solution meets its recovery time objective.
      steps:
        - action: Check the date of the analysis and the targets of each critical activity.
          expected: The analysis is less than 12 months old, and each activity has a maximum tolerable period of disruption and a shorter recovery time objective.
        - action: For each critical activity, compare the documented recovery time of the solution in the plan with the recovery time objective.
          expected: Each solution has a recovery time equal to or shorter than the objective.
    sv:
      title: Granskning av konsekvensanalysen och kontinuitetslösningarna
      description: Kontrollerar konsekvensanalysen och att varje kritisk verksamhet har en lösning som når dess mål för återställningstid.
      preconditions: Den gällande konsekvensanalysen och kontinuitetsplanen.
      expected: Analysen är yngre än 12 månader med mål för varje kritisk verksamhet, och varje lösning når sitt mål för återställningstid.
      steps:
        - action: Kontrollera analysens datum och målen för varje kritisk verksamhet.
          expected: Analysen är yngre än 12 månader, och varje verksamhet har en längsta tolererbara avbrottstid och ett kortare mål för återställningstid.
        - action: Jämför för varje kritisk verksamhet den dokumenterade återställningstiden för lösningen i planen med målet för återställningstid.
          expected: Varje lösning har en återställningstid som är lika med eller kortare än målet.

  - id: GVLC-T05
    priority: high
    execution: manual
    tags: [crisis-management, offline-copy]
    refs: ["ISO 22301:2019 §8.4.2 (response structure)", "ISO 22301:2019 §8.4"]
    en:
      title: Crisis organisation and plans without primary IT
      description: Checks the crisis organisation and demonstrates that the plans can be reached without the primary IT services.
      preconditions: The crisis organisation chart, the contact list and a meeting of the crisis management team in a room where the primary network can be disconnected.
      expected: Each role has a holder and deputy, contact details are verified, and each member opens the plan and contact list offline.
      steps:
        - action: Check each role in the crisis organisation for a holder and a deputy, and check the verification date of the contact list.
          expected: Each role has both, and the verification date is less than 6 months old.
        - action: Call 3 randomly chosen numbers from the contact list.
          expected: Each call reaches the named person.
          data: "3 numbers chosen at random"
        - action: Disconnect the primary network and file services and ask each team member present to open the current plan and contact list.
          expected: Each member opens the current version of both.
    sv:
      title: Krisorganisationen och planer utan ordinarie it-miljö
      description: Kontrollerar krisorganisationen och visar att planerna kan nås utan de ordinarie it-tjänsterna.
      preconditions: Krisorganisationens schema, kontaktlistan och ett möte med krisledningsgruppen i ett rum där det ordinarie nätverket kan kopplas bort.
      expected: Varje roll har innehavare och ersättare, kontaktuppgifterna är kontrollerade, och varje medlem öppnar planen och kontaktlistan utan nätverk.
      steps:
        - action: Kontrollera att varje roll i krisorganisationen har en innehavare och en ersättare, och kontrollera kontaktlistans kontrolldatum.
          expected: Varje roll har båda, och kontrolldatumet är yngre än 6 månader.
        - action: Ring 3 slumpvis valda nummer i kontaktlistan.
          expected: Varje samtal når den namngivna personen.
          data: "3 slumpvis valda nummer"
        - action: Koppla bort det ordinarie nätverket och filtjänsterna och be varje närvarande gruppmedlem öppna den gällande planen och kontaktlistan.
          expected: Varje medlem öppnar den gällande versionen av båda.

  - id: GVLC-T06
    priority: high
    execution: manual
    tags: [exercise]
    refs: ["ISO 22301:2019 §8.5 (exercise programme)"]
    en:
      title: Review of continuity exercises
      description: Checks that each continuity plan has been exercised within 12 months and that improvement actions are followed up.
      preconditions: The list of continuity plans and the exercise reports of the last 12 months.
      expected: Each plan has an exercise report less than 12 months old, and each improvement action has an owner and a due date.
      steps:
        - action: Match each continuity plan to an exercise report.
          expected: Each plan has a report less than 12 months old.
        - action: Check the improvement actions in each report.
          expected: Each action has an owner and a due date, and overdue actions are marked as such.
    sv:
      title: Granskning av kontinuitetsövningar
      description: Kontrollerar att varje kontinuitetsplan har övats inom 12 månader och att förbättringsåtgärderna följs upp.
      preconditions: Listan över kontinuitetsplaner och övningsrapporterna för de senaste 12 månaderna.
      expected: Varje plan har en övningsrapport som är yngre än 12 månader, och varje förbättringsåtgärd har ägare och slutdatum.
      steps:
        - action: Koppla varje kontinuitetsplan till en övningsrapport.
          expected: Varje plan har en rapport som är yngre än 12 månader.
        - action: Kontrollera förbättringsåtgärderna i varje rapport.
          expected: Varje åtgärd har ägare och slutdatum, och försenade åtgärder är markerade som försenade.

  - id: GVLC-T07
    priority: high
    execution: manual
    tags: [obsolescence]
    refs: ["IEC 62402:2019"]
    en:
      title: Review of the obsolescence list and decisions
      description: Checks the end-of-support list of critical assets and the decisions for components that lose support within 24 months.
      preconditions: The component list of class 1 assets with end-of-support dates and the recorded obsolescence decisions.
      expected: The list was checked within 3 months, and each component losing support within 24 months has a decision.
      steps:
        - action: Check the date of the latest check of the list and the end-of-support field of each component.
          expected: The check is less than 3 months old, and each component has a date or the note that none is announced.
        - action: Filter the components whose end of support is within 24 months and find their decisions.
          expected: Each filtered component has a decision with the chosen option and a plan date.
          data: "End of support ≤ today + 24 months"
    sv:
      title: Granskning av listan över utgående komponenter och besluten
      description: Kontrollerar listan över supportens slut för kritiska tillgångar och besluten för komponenter vars support upphör inom 24 månader.
      preconditions: Komponentlistan för tillgångar i klass 1 med datum för upphörande support och de dokumenterade besluten om utgående komponenter.
      expected: Listan har stämts av inom 3 månader, och varje komponent vars support upphör inom 24 månader har ett beslut.
      steps:
        - action: Kontrollera datumet för den senaste avstämningen av listan och fältet för supportens slut för varje komponent.
          expected: Avstämningen är yngre än 3 månader, och varje komponent har ett datum eller en anteckning om att inget datum är aviserat.
        - action: Filtrera fram komponenterna vars support upphör inom 24 månader och leta upp besluten för dem.
          expected: Varje framfiltrerad komponent har ett beslut med valt alternativ och planerat datum.
          data: "Supportens slut ≤ i dag + 24 månader"

  - id: GVLC-T08
    priority: medium
    execution: manual
    tags: [life-cycle]
    refs: ["ISO 55001:2024 §6.2 (asset management objectives and planning)"]
    en:
      title: Inspection of planned replacement years
      description: Checks that each critical asset has a planned replacement year and cost.
      preconditions: The asset register filtered on class 1 and the asset management plan.
      expected: Each class 1 asset has a planned replacement year and an estimated cost.
      steps:
        - action: Find each class 1 asset in the asset management plan.
          expected: Each asset has an entry.
        - action: Check the replacement year and the cost of each entry.
          expected: Each entry has a replacement year and an estimated cost.
    sv:
      title: Inspektion av planerade utbytesår
      description: Kontrollerar att varje kritisk tillgång har ett planerat utbytesår och en kostnad.
      preconditions: Tillgångsregistret filtrerat på klass 1 och planen för tillgångsförvaltning.
      expected: Varje tillgång i klass 1 har ett planerat utbytesår och en uppskattad kostnad.
      steps:
        - action: Leta upp varje tillgång i klass 1 i planen för tillgångsförvaltning.
          expected: Varje tillgång har en post.
        - action: Kontrollera utbytesåret och kostnaden i varje post.
          expected: Varje post har ett utbytesår och en uppskattad kostnad.

  - id: GVLC-T09
    priority: high
    execution: manual
    tags: [decommissioning, archive]
    refs: ["ISO 55001:2024 §8.2 (control of change)", "ISO/IEC 27001:2022 A.5.33"]
    en:
      title: Review of decommissioning plans and archiving
      description: Checks the decommissioning plans and the archiving of records for systems decommissioned in the last 12 months.
      preconditions: The list of systems decommissioned in the last 12 months, their decommissioning plans and archive records.
      expected: Each plan was approved before shutdown and covers the five topics, and records were archived and verified as readable before removal.
      steps:
        - action: For each system, compare the approval date of the plan with the shutdown date and check the plan's topics.
          expected: Each plan was approved before the shutdown and covers dependent systems, data, licences, contracts and users.
        - action: Open the archive record of each system and retrieve one archived record.
          expected: The archive record lists the records with retention periods and a readability check before removal, and the retrieved record opens.
    sv:
      title: Granskning av avvecklingsplaner och arkivering
      description: Kontrollerar avvecklingsplanerna och arkiveringen av handlingar för system som har avvecklats under de senaste 12 månaderna.
      preconditions: Listan över system som har avvecklats under de senaste 12 månaderna, deras avvecklingsplaner och arkivanteckningar.
      expected: Varje plan godkändes före avstängningen och omfattar de fem områdena, och handlingarna arkiverades och kontrollerades som läsbara före borttagningen.
      steps:
        - action: Jämför för varje system planens godkännandedatum med avstängningsdatumet och kontrollera planens områden.
          expected: Varje plan godkändes före avstängningen och omfattar beroende system, data, licenser, avtal och användare.
        - action: Öppna arkivanteckningen för varje system och hämta en arkiverad handling.
          expected: Arkivanteckningen anger handlingarna med bevarandetid och en kontroll av läsbarheten före borttagningen, och den hämtade handlingen går att öppna.

  - id: GVLC-T10
    priority: critical
    execution: manual
    tags: [sanitisation, disposal]
    refs: ["ISO/IEC 27001:2022 A.7.14", "NIST SP 800-88 Rev. 2", "Directive 2012/19/EU (WEEE)"]
    en:
      title: Certificates for media sanitisation and equipment disposal
      description: Checks the sanitisation certificates of storage media and the disposal receipts of discarded equipment.
      preconditions: The asset register entries of decommissioned systems with their storage media and equipment, the sanitisation certificates and the recycler receipts.
      expected: Each medium has a certificate with its serial number, and each discarded piece of equipment has a receipt from a licensed recycler.
      steps:
        - action: Match each storage medium of the decommissioned systems to a sanitisation or destruction certificate by serial number.
          expected: Each medium has a certificate.
        - action: Match each discarded piece of equipment to a handover receipt and check the recycler's licence on the handover date.
          expected: Each piece has a receipt, and the recycler's licence was valid on that date.
    sv:
      title: Intyg om radering av medier och omhändertagande av utrustning
      description: Kontrollerar intygen om radering av lagringsmedier och kvittona för kasserad utrustning.
      preconditions: Posterna i tillgångsregistret för avvecklade system med lagringsmedier och utrustning, intygen om radering och återvinnarens kvitton.
      expected: Varje medium har ett intyg med sitt serienummer, och varje kasserad utrustning har ett kvitto från en godkänd återvinnare.
      steps:
        - action: Koppla varje lagringsmedium i de avvecklade systemen till ett intyg om radering eller förstöring med hjälp av serienumret.
          expected: Varje medium har ett intyg.
        - action: Koppla varje kasserad utrustning till ett kvitto på överlämning och kontrollera återvinnarens tillstånd på överlämningsdagen.
          expected: Varje utrustning har ett kvitto, och återvinnarens tillstånd gällde den dagen.

  - id: GVLC-T11
    priority: high
    execution: manual
    tags: [decommissioning, access]
    refs: ["ISO/IEC 27001:2022 A.5.18"]
    en:
      title: Revocation of credentials of decommissioned systems
      description: Checks that accounts, keys and certificates of decommissioned systems were revoked within 5 working days.
      preconditions: The list of decommissioned systems with shutdown dates, read access to identity management and the certificate register.
      expected: Each account, key and certificate of each system was revoked within 5 working days of the shutdown.
      steps:
        - action: List the accounts and service accounts of each decommissioned system in identity management and note their revocation dates.
          expected: Each account is disabled with a date within 5 working days of the shutdown.
        - action: List the keys and certificates issued to each system in the certificate register.
          expected: Each is revoked with a date within 5 working days of the shutdown.
    sv:
      title: Spärr av inloggningsuppgifter för avvecklade system
      description: Kontrollerar att konton, nycklar och certifikat för avvecklade system spärrades inom 5 arbetsdagar.
      preconditions: Listan över avvecklade system med avstängningsdatum, läsbehörighet till identitetshanteringen och certifikatregistret.
      expected: Varje konto, nyckel och certifikat för varje system spärrades inom 5 arbetsdagar efter avstängningen.
      steps:
        - action: Lista konton och tjänstekonton för varje avvecklat system i identitetshanteringen och notera datumen för spärr.
          expected: Varje konto är spärrat med ett datum inom 5 arbetsdagar efter avstängningen.
        - action: Lista de nycklar och certifikat som har utfärdats till varje system i certifikatregistret.
          expected: Var och en är spärrad med ett datum inom 5 arbetsdagar efter avstängningen.

  - id: GVLC-T12
    priority: high
    execution: manual
    tags: [business-impact-analysis, crisis-communication]
    refs: ["ISO 22301:2019 §8.2.2 (business impact analysis)", "ISO 22301:2019 §8.4.3 (warning and communication)"]
    en:
      title: Recovery objectives in the impact analysis and crisis communication readiness
      description: Compares the recovery objectives with the tolerable disruption and checks the message templates and the latest contact test.
      preconditions: The current business impact analysis, the crisis communication plan with templates and the latest contact test report.
      expected: Each recovery objective is shorter than its tolerable disruption, templates exist for the 4 groups and the latest test reached 90 % of the contacts.
      steps:
        - action: For each critical activity, compare the recovery time objective with the maximum tolerable period of disruption.
          expected: The objective is shorter.
          data: "MTPD 24 h, RTO 8 h"
        - action: Look up the message templates.
          expected: Approved templates exist for staff, customers, media and authorities.
        - action: Read the latest contact test report.
          expected: It is less than 6 months old and reached at least 90 % of the contacts.
    sv:
      title: Återställningsmål i konsekvensanalysen och beredskap för kriskommunikation
      description: Jämför återställningsmålen med den tolererbara avbrottstiden och kontrollerar meddelandemallarna och det senaste kontaktprovet.
      preconditions: Den gällande konsekvensanalysen, planen för kriskommunikation med mallar och rapporten från det senaste kontaktprovet.
      expected: Varje återställningsmål är kortare än sin tolererbara avbrottstid, mallar finns för de 4 grupperna och det senaste provet nådde 90 % av kontakterna.
      steps:
        - action: Jämför för varje kritisk aktivitet målet för återställningstid med den längsta tolererbara avbrottstiden.
          expected: Målet är kortare.
          data: "Längsta tolererbara avbrott 24 h, återställningsmål 8 h"
        - action: Slå upp meddelandemallarna.
          expected: Godkända mallar finns för personal, kunder, medier och myndigheter.
        - action: Läs rapporten från det senaste kontaktprovet.
          expected: Den är mindre än 6 månader gammal och provet nådde minst 90 % av kontakterna.

  - id: GVLC-T13
    priority: medium
    execution: manual
    tags: [post-incident-review, life-cycle-cost]
    refs: ["ISO 22301:2019 §8.6 (evaluation of business continuity documentation and capabilities)", "IEC 60300-3-3:2017 (life cycle costing)"]
    en:
      title: Reviews after plan activations and life cycle cost estimates
      description: Checks the reviews after real activations of continuity plans and the life cycle cost basis of recent investment decisions.
      preconditions: The incident log of the last 12 months, the review records, and the investment decisions above the value limit with their basis.
      expected: Each activation was reviewed within 30 days, and each investment decision has a life cycle cost estimate.
      steps:
        - action: Find the plan activations in the incident log and their review records.
          expected: Each activation has a review within 30 days.
        - action: Read each review.
          expected: It compares actual recovery times with the objectives and lists plan changes.
        - action: Read the basis of each investment decision above the limit.
          expected: It has a life cycle cost estimate with acquisition, operation, maintenance, disposal and the planned life.
    sv:
      title: Genomgångar efter aktivering av planer och uppskattningar av livscykelkostnad
      description: Kontrollerar genomgångarna efter verkliga aktiveringar av kontinuitetsplaner och livscykelkostnaden i underlaget för de senaste investeringsbesluten.
      preconditions: Incidentloggen för de senaste 12 månaderna, dokumentationen från genomgångarna och investeringsbesluten över beloppsgränsen med underlag.
      expected: Varje aktivering gicks igenom inom 30 dagar, och varje investeringsbeslut har en uppskattning av livscykelkostnaden.
      steps:
        - action: Hitta aktiveringarna av planer i incidentloggen och dokumentationen från deras genomgångar.
          expected: Varje aktivering har en genomgång inom 30 dagar.
        - action: Läs varje genomgång.
          expected: Den jämför faktiska återställningstider med målen och listar ändringar av planen.
        - action: Läs underlaget för varje investeringsbeslut över gränsen.
          expected: Det har en uppskattning av livscykelkostnaden med anskaffning, drift, underhåll, avveckling och planerad livslängd.

risks:
  - id: GVLC-R01
    category: availability
    likelihood: 3
    impact: 5
    tags: [business-continuity, crisis]
    refs: ["ISO 31000:2018 §6.4.2 (risk identification)", "ISO 22301:2019 §8.2.2 (business impact analysis)", "ISO 22301:2019 §8.4 (business continuity plans and procedures)"]
    mitigated_by: [GVLC-06, GVLC-07, GVLC-08, GVLC-09, GVLC-10, GVLC-19]
    en:
      title: Critical activities stop in a crisis
      description: A major disruption hits and there is no current impact analysis, no continuity solution and no practised crisis organisation. Critical activities stop for longer than the organisation can tolerate.
      mitigation: Review the business impact analysis every year, provide a continuity solution for each critical activity, name a crisis organisation with deputies, exercise each plan every year, keep plans reachable without the primary IT and set recovery times shorter than the maximum tolerable disruption.
    sv:
      title: Kritiska verksamheter stannar vid en kris
      description: En stor störning inträffar och det finns ingen aktuell konsekvensanalys, ingen kontinuitetslösning och ingen övad krisorganisation. Kritiska verksamheter står stilla längre än organisationen tål.
      mitigation: Gå igenom konsekvensanalysen varje år, ha en kontinuitetslösning för varje kritisk verksamhet, utse en krisorganisation med ersättare, öva varje plan varje år, håll planerna åtkomliga utan den ordinarie IT-miljön och sätt återställningstider som är kortare än den längsta acceptabla störningen.
  - id: GVLC-R02
    category: supply-chain
    likelihood: 3
    impact: 4
    tags: [supplier, contract]
    refs: ["ISO/IEC 27001:2022 A.5.19", "ITIL 4 Supplier management"]
    mitigated_by: [GVLC-01, GVLC-02, GVLC-03, GVLC-04, GVLC-05]
    en:
      title: Critical supplier fails or a contract lapses unnoticed
      description: Nobody knows which suppliers are critical, contracts renew or lapse without a decision and there is no exit plan. A supplier failure or an expired contract interrupts the service.
      mitigation: Keep a supplier register with criticality and contract owner, agree contract terms for critical suppliers, review them every quarter, get a reminder 6 months before a notice deadline and keep an exit plan for each critical supplier.
    sv:
      title: Kritisk leverantör fallerar eller ett avtal löper ut obemärkt
      description: Ingen vet vilka leverantörer som är kritiska, avtal förlängs eller löper ut utan beslut och det finns ingen exitplan. Ett leverantörsfel eller ett utgånget avtal avbryter tjänsten.
      mitigation: För ett leverantörsregister med kritikalitet och avtalsägare, avtala villkor för kritiska leverantörer, följ upp dem varje kvartal, få en påminnelse 6 månader före en uppsägningstidpunkt och ha en exitplan för varje kritisk leverantör.
  - id: GVLC-R03
    category: operational
    likelihood: 4
    impact: 3
    tags: [obsolescence, end-of-life]
    refs: ["ISO 55001:2024 §6.2 (asset management objectives and planning)", "ISO/IEC 27001:2022 A.8.8"]
    mitigated_by: [GVLC-11, GVLC-12, GVLC-13, GVLC-22, GVLC-14]
    en:
      title: Systems run past their end of support
      description: End-of-support dates are not monitored and replacements are not planned or budgeted. Critical systems run without security updates and parts, and replacement becomes an emergency.
      mitigation: Monitor end-of-support dates, decide on obsolescence 24 months ahead, plan a replacement year for critical assets, include life cycle cost in investment decisions and approve a decommissioning plan.
    sv:
      title: System körs efter att stödet har upphört
      description: Datum när stödet upphör bevakas inte och ersättningar planeras eller budgeteras inte. Kritiska system körs utan säkerhetsuppdateringar och reservdelar, och ersättningen blir akut.
      mitigation: Bevaka när stödet upphör, besluta om utfasning 24 månader i förväg, planera ett utbytesår för kritiska tillgångar, räkna med livscykelkostnaden i investeringsbeslut och godkänn en avvecklingsplan.
