area: api-security
prefix: APIS
group: security
name: {en: API security, sv: API-säkerhet}
description:
  en: Authentication of API clients, token scopes and lifetime, rate limits, CORS, request size limits, mass assignment and error responses that do not leak details.
  sv: Autentisering av API-klienter, behörighetsomfång och livslängd för token, anropsgränser, CORS, storleksgränser för anrop, massilldelning och felsvar som inte läcker detaljer.

requirements:
  - id: APIS-01
    type: security
    obligation: must
    priority: critical
    tags: [api, authentication]
    refs: ["OWASP API Security Top 10 2023 API2", "OWASP ASVS 5.0 V6 (authentication)", "RFC 6749", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 1.2", "IEC 62443-4-2 CR 1.2", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(d)", "Regulation (EU) 2022/2554 (DORA) Art. 9(4)(d)", "CWE-306 (missing authentication for critical function)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    tests: [APIS-T01]
    en:
      title: Every API client is authenticated
      description: The system MUST reject with 401 a request to an endpoint that is not marked as public in the API description when the request carries no valid access token or API key.
      rationale: An API endpoint without authentication is reachable by anyone on the internet, including automated scanners.
      criteria:
        - method: test
          text: Each non-public endpoint called without credentials, with an expired token and with a malformed token returns 401.
    sv:
      title: Varje API-klient autentiseras
      description: Systemet SKA avvisa med 401 ett anrop till en endpoint som inte är markerad som publik i API-beskrivningen när anropet saknar en giltig åtkomsttoken eller API-nyckel.
      rationale: En endpoint utan autentisering kan nås av vem som helst på internet, även av automatiska skannrar.
      criteria:
        - method: test
          text: Varje icke-publik endpoint som anropas utan inloggningsuppgifter, med en utgången token och med en felformad token svarar 401.

  - id: APIS-02
    type: security
    obligation: must_not
    priority: high
    tags: [api-key, url]
    refs: ["OWASP ASVS 5.0 V14.2.1 (sensitive data not in URLs)", "OWASP REST Security Cheat Sheet", "ISO/IEC 27001:2022 A.5.17", "CWE-598 (use of GET request method with sensitive query strings)", "MITRE ATT&CK T1552 (unsecured credentials)"]
    tests: [APIS-T02]
    en:
      title: No credentials in query strings
      description: The system MUST NOT accept API keys or access tokens in the URL query string.
      rationale: Query strings are written to access logs, proxy logs and browser history, where the credentials leak.
      criteria:
        - method: test
          text: A request with a valid API key in the query string and none in the header is rejected with 401.
    sv:
      title: Inga inloggningsuppgifter i frågesträngar
      description: Systemet SKA INTE godta API-nycklar eller åtkomsttoken i adressens frågesträng.
      rationale: Frågesträngar skrivs till åtkomstloggar, proxyloggar och webbläsarhistorik, där uppgifterna läcker.
      criteria:
        - method: test
          text: Ett anrop med en giltig API-nyckel i frågesträngen och ingen i huvudet avvisas med 401.

  - id: APIS-03
    type: security
    obligation: must
    priority: high
    tags: [rate-limiting, api]
    refs: ["OWASP API Security Top 10 2023 API4", "OWASP ASVS 5.0 V2.4.1 (anti-automation)", "RFC 6585 §4", "IEC 62443-3-3 SR 7.1", "IEC 62443-4-2 CR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 RLM)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    tests: [APIS-T03]
    en:
      title: Rate limit per API client
      description: The system MUST answer with 429 and a Retry-After header when an API client sends more than 100 requests within 1 minute.
      rationale: Without a limit a single client can exhaust capacity for everyone or scrape data at machine speed.
      criteria:
        - method: test
          text: Of 120 requests sent by one client within 1 minute, the first 100 succeed and the rest return 429 with Retry-After.
    sv:
      title: Anropsgräns per API-klient
      description: Systemet SKA svara med 429 och ett Retry-After-huvud när en API-klient skickar mer än 100 anrop inom 1 minut.
      rationale: Utan gräns kan en enda klient förbruka kapaciteten för alla eller hämta stora mängder data i maskinfart.
      criteria:
        - method: test
          text: Av 120 anrop som en klient skickar inom 1 minut lyckas de första 100 och resten får 429 med Retry-After.

  - id: APIS-04
    type: security
    obligation: must
    priority: high
    tags: [access-token, expiry, oauth]
    refs: ["RFC 9700 §4.14 (refresh token protection)", "OWASP ASVS 5.0 V9.2.1 (token validity time span)", "RFC 7519 §4.1.4", "ISO/IEC 27001:2022 A.8.5", "ISO/IEC 27001:2022 A.5.17", "CWE-1472 (generation of credential with long expiration)", "CWE-1469 (improper check for credential expiration)", "MITRE ATT&CK T1550.001 (application access token)"]
    tests: [APIS-T04]
    en:
      title: Short-lived access tokens
      description: The system MUST issue API access tokens that expire at most 60 minutes after they were issued and reject them after that time.
      rationale: A short lifetime limits how long a leaked token is useful to an attacker.
      criteria:
        - method: inspection
          text: The exp claim of a newly issued token is at most 3600 seconds after its iat claim.
        - method: test
          text: A token used 61 minutes after issue is rejected with 401.
    sv:
      title: Åtkomsttoken med kort livslängd
      description: Systemet SKA utfärda åtkomsttoken för API:et som slutar gälla senast 60 minuter efter utfärdandet och avvisa dem efter den tiden.
      rationale: En kort livslängd begränsar hur länge en läckt token är användbar för en angripare.
      criteria:
        - method: inspection
          text: Anspråket exp i en nyutfärdad token ligger högst 3600 sekunder efter anspråket iat.
        - method: test
          text: En token som används 61 minuter efter utfärdandet avvisas med 401.

  - id: APIS-05
    type: security
    obligation: must
    priority: critical
    tags: [scopes, oauth, authorisation]
    refs: ["RFC 6749 §3.3", "OWASP API Security Top 10 2023 API5", "OWASP ASVS 5.0 V10.3.2 (authorization from token claims)", "ISO/IEC 27001:2022 A.8.3", "IEC 62443-3-3 SR 2.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(d)", "CWE-863 (incorrect authorization)"]
    tests: [APIS-T05]
    en:
      title: Token scopes limit API operations
      description: The system MUST refuse with 403 an API operation that is not covered by the scopes of the access token used.
      rationale: Scopes let an integration hold only the rights it needs, so a leaked read-only token cannot delete data.
      criteria:
        - method: test
          text: A token with only a read scope can read records, and its write and delete requests return 403.
    sv:
      title: Behörighetsomfång i token begränsar API-operationer
      description: Systemet SKA avvisa med 403 en API-operation som inte täcks av behörighetsomfånget i den åtkomsttoken som används.
      rationale: Behörighetsomfång låter en integration ha bara de rättigheter den behöver, så att en läckt token för läsning inte kan radera data.
      criteria:
        - method: test
          text: En token med enbart läsomfång kan läsa poster, och dess anrop för skrivning och radering får 403.

  - id: APIS-06
    type: security
    obligation: must_not
    priority: high
    tags: [cors]
    refs: ["OWASP ASVS 5.0 V3.4.2 (CORS allowed origins)", "OWASP Web Security Testing Guide WSTG-CLNT-07", "Fetch Living Standard §3.2", "ISO/IEC 27001:2022 A.8.26", "CWE-942 (permissive cross-domain policy with untrusted domains)", "CWE-346 (origin validation error)"]
    tests: [APIS-T06]
    en:
      title: CORS limited to listed origins
      description: The system MUST NOT return an Access-Control-Allow-Origin header for an origin that is not on its configured list of trusted origins.
      rationale: Reflecting any origin, especially with credentials, lets every website read the API responses of a signed-in user.
      criteria:
        - method: test
          text: A preflight and a simple request from an unlisted origin get no Access-Control-Allow-Origin header, and a listed origin gets its own value back.
    sv:
      title: CORS begränsat till listade origins
      description: Systemet SKA INTE returnera ett Access-Control-Allow-Origin-huvud för en origin som saknas i den konfigurerade listan över betrodda origins.
      rationale: Om varje origin speglas, särskilt med inloggningsuppgifter, kan alla webbplatser läsa API-svaren för en inloggad användare.
      criteria:
        - method: test
          text: Ett förhandsanrop och ett enkelt anrop från en olistad origin får inget Access-Control-Allow-Origin-huvud, och en listad origin får tillbaka sitt eget värde.

  - id: APIS-07
    type: security
    obligation: must
    priority: medium
    tags: [request-size, denial-of-service]
    refs: ["OWASP API Security Top 10 2023 API4", "OWASP ASVS 5.0 V15.2.2 (resource-demanding functionality)", "IEC 62443-3-3 SR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    tests: [APIS-T07]
    en:
      title: Limit on request body size
      description: The system MUST reject an API request whose body is larger than 1 MB with status 413 before parsing it.
      rationale: Parsing oversized bodies uses memory and CPU and is a cheap way to slow the service down for everyone.
      criteria:
        - method: test
          text: A body of 1 MB is accepted for parsing and a body of 1 MB plus one byte returns 413 without increasing memory use.
    sv:
      title: Gräns för anropets storlek
      description: Systemet SKA avvisa ett API-anrop vars innehåll är större än 1 MB med status 413 innan innehållet tolkas.
      rationale: Att tolka för stora anrop förbrukar minne och processorkraft och är ett billigt sätt att göra tjänsten långsam för alla.
      criteria:
        - method: test
          text: Ett innehåll på 1 MB tas emot för tolkning och ett innehåll på 1 MB plus en byte får 413 utan att minnesanvändningen ökar.

  - id: APIS-08
    type: security
    obligation: must_not
    priority: high
    tags: [error-handling, information-disclosure]
    refs: ["OWASP ASVS 5.0 V16.5.1 (generic error messages)", "OWASP Top 10 2021 A05", "OWASP Error Handling Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.7", "IEC 62443-4-2 CR 3.7", "CWE-209 (error message containing sensitive information)", "CWE-497 (exposure of sensitive system information)"]
    tests: [APIS-T08]
    en:
      title: Error responses do not leak internals
      description: The system MUST NOT include stack traces, SQL statements, internal file paths, host names or software versions in error responses.
      rationale: Internal details help attackers map the system and choose exploits for the exact versions in use.
      criteria:
        - method: test
          text: Responses to malformed requests and forced server errors contain only a generic message and a correlation id.
    sv:
      title: Felsvar läcker inga interna detaljer
      description: Systemet SKA INTE ta med stackspår, SQL-satser, interna filsökvägar, värdnamn eller programvaruversioner i felsvar.
      rationale: Interna detaljer hjälper angripare att kartlägga systemet och välja attacker mot exakt de versioner som används.
      criteria:
        - method: test
          text: Svar på felformade anrop och framtvingade serverfel innehåller bara ett allmänt meddelande och ett korrelations-id.

  - id: APIS-09
    type: security
    obligation: must
    priority: high
    tags: [mass-assignment, api]
    refs: ["OWASP API Security Top 10 2023 API3", "OWASP ASVS 5.0 V15.3.3 (mass assignment)", "OWASP Mass Assignment Cheat Sheet", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-915 (mass assignment)"]
    tests: [APIS-T09]
    en:
      title: Protection against mass assignment
      description: The system MUST change only the fields that are on the writable list of an endpoint and reject requests that try to set any other field.
      rationale: Binding the whole request to the record lets a client set fields such as role, owner or price that it is not meant to control.
      criteria:
        - method: test
          text: An update that also sets role, owner id or created date is rejected with 400, and the record is unchanged.
    sv:
      title: Skydd mot massilldelning
      description: Systemet SKA ändra enbart de fält som finns på en endpoints lista över skrivbara fält och avvisa anrop som försöker sätta andra fält.
      rationale: Om hela anropet binds till posten kan en klient sätta fält som roll, ägare eller pris som den inte ska styra över.
      criteria:
        - method: test
          text: En uppdatering som även sätter roll, ägar-id eller skapandedatum avvisas med 400, och posten är oförändrad.

  - id: APIS-10
    type: performance
    obligation: should
    priority: medium
    tags: [pagination, api]
    refs: ["OWASP API Security Top 10 2023 API4", "IEC 62443-3-3 SR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    tests: [APIS-T10]
    en:
      title: Upper limit on page size
      description: The system SHOULD return at most 100 items per page from a list endpoint, whatever page size the client asks for.
      rationale: Unbounded result sets make it possible to pull a whole database in one request and to overload the server.
      criteria:
        - method: test
          text: A list request with a page size of 10 000 returns 100 items and a link to the next page.
    sv:
      title: Övre gräns för sidstorlek
      description: Systemet BÖR returnera högst 100 objekt per sida från en endpoint för listor, oavsett vilken sidstorlek klienten begär.
      rationale: Obegränsade resultat gör det möjligt att hämta en hel databas i ett anrop och att överbelasta servern.
      criteria:
        - method: test
          text: Ett listanrop med sidstorleken 10 000 returnerar 100 objekt och en länk till nästa sida.

  - id: APIS-11
    type: security
    obligation: should
    priority: medium
    tags: [api-key, revocation]
    refs: ["OWASP ASVS 5.0 V10.4.9 (token revocation)", "NIST SP 800-53 IA-5", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.5.18", "IEC 62443-3-3 SR 1.5", "IEC 62443-4-2 CR 1.5", "MITRE ATT&CK T1550.001 (application access token)"]
    tests: [APIS-T11]
    en:
      title: API keys can be revoked at once
      description: The system SHOULD let an administrator revoke an API key so that requests using it are rejected within 1 minute.
      rationale: A leaked key has to be stopped immediately without waiting for it to expire.
      criteria:
        - method: test
          text: Requests with a key fail with 401 within 1 minute after the key is revoked in the administration.
    sv:
      title: API-nycklar kan återkallas direkt
      description: Systemet BÖR låta en administratör återkalla en API-nyckel så att anrop med den avvisas inom 1 minut.
      rationale: En läckt nyckel behöver stoppas omedelbart utan att vänta på att den slutar gälla.
      criteria:
        - method: test
          text: Anrop med en nyckel misslyckas med 401 inom 1 minut efter att nyckeln har återkallats i administrationen.

  - id: APIS-12
    type: security
    obligation: must
    priority: high
    tags: [oauth, refresh-token, token-rotation]
    refs: ["RFC 9700 §4.14 (refresh token protection)", "OWASP ASVS 5.0 V10.4.5 (refresh token replay)", "ISO/IEC 27001:2022 A.8.5", "CWE-294 (authentication bypass by capture-replay)", "MITRE ATT&CK T1528 (steal application access token)"]
    tests: [APIS-T12]
    en:
      title: Refresh tokens rotate and reuse revokes the grant
      description: The system MUST issue a new refresh token on each use and revoke every token of the grant when a refresh token that has already been used is presented again.
      rationale: A stolen refresh token gives long-term access; rotation with reuse detection exposes the theft the first time the attacker or the real client uses an old token.
      criteria:
        - method: test
          text: After one refresh the old refresh token is refused, and presenting it also makes the new access and refresh tokens invalid.
    sv:
      title: Uppdateringstoken roteras och återanvändning återkallar behörigheten
      description: Systemet SKA utfärda en ny uppdateringstoken vid varje användning och återkalla varje token för behörigheten när en redan använd uppdateringstoken visas upp igen.
      rationale: En stulen uppdateringstoken ger åtkomst länge; rotation med upptäckt av återanvändning avslöjar stölden första gången angriparen eller den riktiga klienten använder en gammal token.
      criteria:
        - method: test
          text: Efter en uppdatering avvisas den gamla uppdateringstoken, och när den visas upp blir även de nya åtkomst- och uppdateringstoken ogiltiga.

  - id: APIS-13
    type: security
    obligation: should
    priority: medium
    tags: [oauth, sender-constrained, dpop, mtls]
    refs: ["RFC 9449", "RFC 8705", "RFC 9700 §2.2.1 (sender-constrained access tokens)", "ISO/IEC 27001:2022 A.8.5", "CWE-294 (authentication bypass by capture-replay)", "MITRE ATT&CK T1528 (steal application access token)", "MITRE ATT&CK T1550.001 (application access token)"]
    tests: [APIS-T13]
    en:
      title: Sender-constrained tokens for write access
      description: The system SHOULD bind access tokens with write scopes to the client's key by DPoP or mutual TLS and refuse such a token presented without proof of that key.
      rationale: A bearer token copied from a log or a proxy works for anyone; a bound token is useless without the client's private key.
      criteria:
        - method: test
          text: A write request with a bound token and a valid proof succeeds, and the same token with a missing proof or a proof from another key is refused with 401.
    sv:
      title: Avsändarbundna token för skrivåtkomst
      description: Systemet BÖR binda åtkomsttoken med skrivbehörighet till klientens nyckel med DPoP eller ömsesidig TLS och avvisa en sådan token som visas upp utan bevis på nyckeln.
      rationale: En innehavartoken som kopierats från en logg eller en proxy fungerar för vem som helst; en bunden token är oanvändbar utan klientens privata nyckel.
      criteria:
        - method: test
          text: Ett skrivanrop med en bunden token och ett giltigt bevis lyckas, och samma token utan bevis eller med ett bevis från en annan nyckel avvisas med 401.

  - id: APIS-14
    type: security
    obligation: must
    priority: critical
    tags: [jwt, token-validation]
    refs: ["RFC 8725 §3.1", "RFC 9068 §4", "OWASP ASVS 5.0 V9.1.2 (token algorithm allowlist)", "OWASP API Security Top 10 2023 API2", "CWE-347 (improper verification of cryptographic signature)", "MITRE ATT&CK T1606 (forge web credentials)"]
    tests: [APIS-T14]
    en:
      title: JWT access tokens are checked against a fixed algorithm list
      description: The system MUST accept a JWT access token only when it is signed with an algorithm from a configured allow-list and its issuer, audience and expiry time match the API.
      rationale: Libraries that trust the algorithm named in the token header can be tricked into accepting unsigned tokens or tokens signed with the public key as an HMAC secret.
      criteria:
        - method: test
          text: Tokens with alg none, with HS256 using the public key, with a wrong audience or with a past expiry time are all refused.
    sv:
      title: JWT-åtkomsttoken kontrolleras mot en fast lista med algoritmer
      description: Systemet SKA godta en JWT-åtkomsttoken endast när den är signerad med en algoritm från en konfigurerad tillåtelselista och dess utfärdare, mottagare och utgångstid stämmer med API:et.
      rationale: Bibliotek som litar på algoritmen som anges i tokenhuvudet kan luras att godta osignerade token eller token som signerats med den publika nyckeln som HMAC-hemlighet.
      criteria:
        - method: test
          text: Token med alg none, med HS256 och den publika nyckeln, med fel mottagare eller med passerad utgångstid avvisas.

  - id: APIS-15
    type: security
    obligation: must
    priority: high
    tags: [api-inventory, versioning, attack-surface]
    refs: ["OWASP API Security Top 10 2023 API9", "ISO/IEC 27001:2022 A.5.9", "NIST SP 800-53 CM-8", "CWE-912 (hidden functionality)", "MITRE ATT&CK M1042 (disable or remove feature or program)"]
    tests: [APIS-T15]
    en:
      title: Inventory of exposed API endpoints
      description: The system MUST respond only on API endpoints that are listed in the published API description, and answer 404 for every other path under the API base address.
      rationale: Old versions, debug routes and forgotten test endpoints are often unprotected and unknown to the team that patches the API.
      criteria:
        - method: test
          text: A crawl of the API host finds no endpoint that answers with data and is missing from the API description.
        - method: inspection
          text: Each retired API version answers 404 or 410 on every path.
    sv:
      title: Förteckning över exponerade API-ändpunkter
      description: Systemet SKA svara endast på API-ändpunkter som finns i den publicerade API-beskrivningen och svara 404 för varje annan sökväg under API:ets basadress.
      rationale: Gamla versioner, felsökningsvägar och bortglömda teständpunkter är ofta oskyddade och okända för teamet som rättar API:et.
      criteria:
        - method: test
          text: En genomsökning av API-värden hittar ingen ändpunkt som svarar med data och saknas i API-beskrivningen.
        - method: inspection
          text: Varje avvecklad API-version svarar 404 eller 410 på varje sökväg.

  - id: APIS-16
    type: security
    obligation: must
    priority: high
    tags: [business-flows, abuse, rate-limit]
    refs: ["OWASP API Security Top 10 2023 API6", "CWE-799 (improper control of interaction frequency)", "ISO/IEC 27001:2022 A.8.6"]
    tests: [APIS-T16]
    en:
      title: Limits on sensitive business flows
      description: The system MUST limit account creation, invitation sending and voucher redemption to 10 requests per hour for each source address and each account.
      rationale: These flows are abused by scripts for spam, fake accounts and fraud even when every single request is valid and authorised.
      criteria:
        - method: test
          text: The 11th request within one hour from the same source or account is refused with 429, while a request from another source still succeeds.
          threshold: "10 per hour"
    sv:
      title: Gränser för känsliga affärsflöden
      description: Systemet SKA begränsa skapande av konton, utskick av inbjudningar och inlösen av värdekoder till 10 anrop per timme för varje källadress och varje konto.
      rationale: Dessa flöden missbrukas av skript för skräppost, falska konton och bedrägerier även när varje enskilt anrop är giltigt och behörigt.
      criteria:
        - method: test
          text: Det 11:e anropet inom en timme från samma källa eller konto avvisas med 429, medan ett anrop från en annan källa fortfarande lyckas.
          threshold: "10 per timme"

tests:
  - id: APIS-T01
    priority: critical
    execution: automated
    tags: [api, authentication]
    refs: ["OWASP API Security Top 10 2023 API2", "ISO/IEC 27001:2022 A.8.5", "IEC 62443-3-3 SR 1.2", "IEC 62443-4-2 CR 1.2", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(d)", "Regulation (EU) 2022/2554 (DORA) Art. 9(4)(d)", "CWE-306 (missing authentication for critical function)", "MITRE ATT&CK T1190 (exploit public-facing application)"]
    en:
      title: Non-public endpoints reject missing and invalid credentials
      description: A script calls every endpoint in the API description with no, expired and malformed credentials.
      preconditions: The API description marks public endpoints, and the script has an expired token and a malformed token.
      expected: Every non-public endpoint returns 401 in all three cases.
      steps:
        - action: Call each non-public endpoint without an Authorization header.
          expected: Each response is 401.
        - action: Call each non-public endpoint with the expired token.
          expected: Each response is 401.
        - action: Call each non-public endpoint with the malformed token.
          expected: Each response is 401.
          data: "Authorization: Bearer abc.def"
    sv:
      title: Icke-publika endpoints avvisar saknade och ogiltiga inloggningsuppgifter
      description: Ett skript anropar varje endpoint i API-beskrivningen utan, med utgångna och med felformade inloggningsuppgifter.
      preconditions: API-beskrivningen markerar publika endpoints, och skriptet har en utgången token och en felformad token.
      expected: Varje icke-publik endpoint svarar 401 i alla tre fallen.
      steps:
        - action: Anropa varje icke-publik endpoint utan Authorization-huvud.
          expected: Varje svar är 401.
        - action: Anropa varje icke-publik endpoint med den utgångna token.
          expected: Varje svar är 401.
        - action: Anropa varje icke-publik endpoint med den felformade token.
          expected: Varje svar är 401.
          data: "Authorization: Bearer abc.def"

  - id: APIS-T02
    priority: high
    execution: automated
    tags: [api-key, url]
    refs: ["OWASP REST Security Cheat Sheet", "ISO/IEC 27001:2022 A.5.17", "CWE-598 (use of GET request method with sensitive query strings)", "MITRE ATT&CK T1552 (unsecured credentials)"]
    en:
      title: Credentials in the query string are refused
      description: A script sends a valid API key and a valid token as query parameters.
      preconditions: A valid API key and a valid access token for a test client.
      expected: Neither credential is accepted from the query string.
      steps:
        - action: Call a protected endpoint with the API key as a query parameter and no header.
          expected: The response is 401.
          data: "?api_key=<valid key>"
        - action: Call a protected endpoint with the access token as a query parameter and no header.
          expected: The response is 401.
          data: "?access_token=<valid token>"
    sv:
      title: Inloggningsuppgifter i frågesträngen avvisas
      description: Ett skript skickar en giltig API-nyckel och en giltig token som frågeparametrar.
      preconditions: En giltig API-nyckel och en giltig åtkomsttoken för en testklient.
      expected: Ingen av uppgifterna godtas från frågesträngen.
      steps:
        - action: Anropa en skyddad endpoint med API-nyckeln som frågeparameter och utan huvud.
          expected: Svaret är 401.
          data: "?api_key=<giltig nyckel>"
        - action: Anropa en skyddad endpoint med åtkomsttoken som frågeparameter och utan huvud.
          expected: Svaret är 401.
          data: "?access_token=<giltig token>"

  - id: APIS-T03
    priority: high
    execution: automated
    tags: [rate-limiting]
    refs: ["OWASP API Security Top 10 2023 API4", "IEC 62443-3-3 SR 7.1", "IEC 62443-4-2 CR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 RLM)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    en:
      title: Requests above the rate limit get 429
      description: A script sends a burst of requests from one client and counts the responses.
      preconditions: A test client with the default rate limit of 100 requests per minute.
      expected: Requests above the limit are refused with 429 and Retry-After.
      steps:
        - action: Send 120 requests to a cheap read endpoint within 30 seconds.
          expected: The first 100 succeed and the remaining 20 return 429.
        - action: Inspect the 429 responses.
          expected: Each has a Retry-After header with a value in seconds.
        - action: Wait for the time given in Retry-After and send one request.
          expected: The request succeeds.
    sv:
      title: Anrop över anropsgränsen får 429
      description: Ett skript skickar en skur av anrop från en klient och räknar svaren.
      preconditions: En testklient med standardgränsen 100 anrop per minut.
      expected: Anrop över gränsen avvisas med 429 och Retry-After.
      steps:
        - action: Skicka 120 anrop till en enkel läsendpoint inom 30 sekunder.
          expected: De första 100 lyckas och de återstående 20 får 429.
        - action: Granska svaren med 429.
          expected: Vart och ett har ett Retry-After-huvud med ett värde i sekunder.
        - action: Vänta den tid som anges i Retry-After och skicka ett anrop.
          expected: Anropet lyckas.

  - id: APIS-T04
    priority: high
    execution: automated
    tags: [access-token, expiry]
    refs: ["RFC 7519 §4.1.4", "ISO/IEC 27001:2022 A.8.5", "ISO/IEC 27001:2022 A.5.17", "CWE-1472 (generation of credential with long expiration)", "CWE-1469 (improper check for credential expiration)", "MITRE ATT&CK T1550.001 (application access token)"]
    en:
      title: Access tokens expire within 60 minutes
      description: A script decodes a new token and uses it after its lifetime.
      preconditions: A test client that can obtain tokens and a test environment clock the script can advance.
      expected: The token lifetime is at most 60 minutes and is enforced.
      steps:
        - action: Obtain an access token and decode its claims.
          expected: exp minus iat is 3600 seconds or less.
        - action: Advance the clock by 61 minutes and call a protected endpoint with the token.
          expected: The response is 401.
    sv:
      title: Åtkomsttoken slutar gälla inom 60 minuter
      description: Ett skript avkodar en ny token och använder den efter dess livslängd.
      preconditions: En testklient som kan hämta token och en klocka i testmiljön som skriptet kan flytta fram.
      expected: Livslängden för token är högst 60 minuter och upprätthålls.
      steps:
        - action: Hämta en åtkomsttoken och avkoda dess anspråk.
          expected: exp minus iat är 3600 sekunder eller mindre.
        - action: Flytta fram klockan 61 minuter och anropa en skyddad endpoint med token.
          expected: Svaret är 401.

  - id: APIS-T05
    priority: critical
    execution: automated
    tags: [scopes, authorisation]
    refs: ["RFC 6749 §3.3", "ISO/IEC 27001:2022 A.8.3", "IEC 62443-3-3 SR 2.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(d)", "CWE-863 (incorrect authorization)"]
    en:
      title: A read-only token cannot write or delete
      description: A script uses a token with only a read scope against read, write and delete operations.
      preconditions: A test client allowed to request a token with only the read scope, and a test record.
      expected: Only read operations succeed.
      steps:
        - action: Read the test record with the read-only token.
          expected: The record is returned.
        - action: Update the test record with the read-only token.
          expected: The response is 403 and the record is unchanged.
        - action: Delete the test record with the read-only token.
          expected: The response is 403 and the record still exists.
    sv:
      title: En token för enbart läsning kan inte skriva eller radera
      description: Ett skript använder en token med enbart läsomfång mot operationer för läsning, skrivning och radering.
      preconditions: En testklient som får begära en token med enbart läsomfång, och en testpost.
      expected: Bara läsoperationer lyckas.
      steps:
        - action: Läs testposten med läs-token.
          expected: Posten returneras.
        - action: Uppdatera testposten med läs-token.
          expected: Svaret är 403 och posten är oförändrad.
        - action: Radera testposten med läs-token.
          expected: Svaret är 403 och posten finns kvar.

  - id: APIS-T06
    priority: high
    execution: automated
    tags: [cors]
    refs: ["OWASP Web Security Testing Guide WSTG-CLNT-07", "ISO/IEC 27001:2022 A.8.26", "CWE-942 (permissive cross-domain policy with untrusted domains)", "CWE-346 (origin validation error)"]
    en:
      title: CORS headers only for trusted origins
      description: A script sends preflight and simple requests with listed, unlisted and null origins.
      preconditions: The configured list of trusted origins for the test environment.
      expected: Only listed origins receive CORS permission.
      steps:
        - action: Send an OPTIONS preflight with an unlisted origin.
          expected: The response has no Access-Control-Allow-Origin header.
          data: "Origin: https://evil.example"
        - action: Send a GET with Origin set to null.
          expected: The response has no Access-Control-Allow-Origin header.
        - action: Send a GET with a listed origin.
          expected: Access-Control-Allow-Origin equals that origin and is never a wildcard when credentials are allowed.
    sv:
      title: CORS-huvuden bara för betrodda origins
      description: Ett skript skickar förhandsanrop och enkla anrop med listade, olistade och null-origins.
      preconditions: Den konfigurerade listan över betrodda origins för testmiljön.
      expected: Bara listade origins får CORS-tillstånd.
      steps:
        - action: Skicka ett förhandsanrop med OPTIONS och en olistad origin.
          expected: Svaret har inget Access-Control-Allow-Origin-huvud.
          data: "Origin: https://evil.example"
        - action: Skicka ett GET-anrop med Origin satt till null.
          expected: Svaret har inget Access-Control-Allow-Origin-huvud.
        - action: Skicka ett GET-anrop med en listad origin.
          expected: Access-Control-Allow-Origin är lika med den origin och är aldrig ett jokertecken när inloggningsuppgifter tillåts.

  - id: APIS-T07
    priority: medium
    execution: automated
    tags: [request-size]
    refs: ["OWASP API Security Top 10 2023 API4", "IEC 62443-3-3 SR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    en:
      title: Oversized request bodies are rejected with 413
      description: A script sends bodies at and just above the size limit and watches memory use.
      preconditions: A write endpoint that accepts JSON and memory metrics for the API server.
      expected: Bodies over 1 MB are refused before parsing.
      steps:
        - action: Send a valid JSON body of exactly 1 MB.
          expected: The request is processed, or rejected for content reasons with 400.
        - action: Send a JSON body of 1 MB plus one byte.
          expected: The response is 413.
        - action: Send 50 bodies of 100 MB in parallel.
          expected: Each response is 413 and the memory use of the server rises by less than 50 MB.
    sv:
      title: För stora anrop avvisas med 413
      description: Ett skript skickar innehåll vid och strax över storleksgränsen och bevakar minnesanvändningen.
      preconditions: En skrivendpoint som tar emot JSON och minnesmätvärden för API-servern.
      expected: Innehåll över 1 MB avvisas innan det tolkas.
      steps:
        - action: Skicka ett giltigt JSON-innehåll på exakt 1 MB.
          expected: Anropet behandlas, eller avvisas av innehållsskäl med 400.
        - action: Skicka ett JSON-innehåll på 1 MB plus en byte.
          expected: Svaret är 413.
        - action: Skicka 50 innehåll på 100 MB parallellt.
          expected: Varje svar är 413 och serverns minnesanvändning ökar med mindre än 50 MB.

  - id: APIS-T08
    priority: high
    execution: automated
    tags: [error-handling, information-disclosure]
    refs: ["OWASP Web Security Testing Guide WSTG-ERRH-01", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.7", "IEC 62443-4-2 CR 3.7", "CWE-209 (error message containing sensitive information)", "CWE-497 (exposure of sensitive system information)"]
    en:
      title: Error responses contain no internal details
      description: A script provokes client and server errors and searches the responses for internal details.
      preconditions: A test endpoint or fault injection that forces a server error in the test environment.
      expected: Error responses hold only a generic message and a correlation id.
      steps:
        - action: Send malformed JSON, a wrong content type and an unknown route.
          expected: Each response has a generic message, a correlation id and the correct 4xx status.
          data: '{"name": '
        - action: Force a server error.
          expected: The response is 500 with a generic message and a correlation id.
        - action: Search all collected responses for stack frames, SQL keywords, file paths and version strings.
          expected: No match is found.
          data: "at com., Traceback, SELECT, /var/, /home/, Server: nginx/"
    sv:
      title: Felsvar innehåller inga interna detaljer
      description: Ett skript framkallar klient- och serverfel och söker efter interna detaljer i svaren.
      preconditions: En testendpoint eller felinjicering som tvingar fram ett serverfel i testmiljön.
      expected: Felsvar innehåller bara ett allmänt meddelande och ett korrelations-id.
      steps:
        - action: Skicka felformad JSON, fel innehållstyp och en okänd väg.
          expected: Varje svar har ett allmänt meddelande, ett korrelations-id och rätt status i 4xx-serien.
          data: '{"name": '
        - action: Tvinga fram ett serverfel.
          expected: Svaret är 500 med ett allmänt meddelande och ett korrelations-id.
        - action: Sök i alla insamlade svar efter stackramar, SQL-nyckelord, filsökvägar och versionssträngar.
          expected: Ingen träff hittas.
          data: "at com., Traceback, SELECT, /var/, /home/, Server: nginx/"

  - id: APIS-T09
    priority: high
    execution: automated
    tags: [mass-assignment]
    refs: ["OWASP API Security Top 10 2023 API3", "ISO/IEC 27001:2022 A.8.28", "IEC 62443-3-3 SR 3.5", "CWE-915 (mass assignment)"]
    en:
      title: Protected fields cannot be set through the API
      description: A script adds protected fields to create and update requests.
      preconditions: An ordinary test user who owns a record, and the list of writable fields for that record type.
      expected: Requests with protected fields are rejected and no protected value changes.
      steps:
        - action: Update the record and add a role field with the value admin.
          expected: The response is 400 and the user's role is unchanged.
          data: '{"title": "x", "role": "admin"}'
        - action: Update the record and set the owner id to another user.
          expected: The response is 400 and the owner is unchanged.
        - action: Create a record with a created date in the past.
          expected: The response is 400, or the record gets the server time as created date.
    sv:
      title: Skyddade fält kan inte sättas via API:et
      description: Ett skript lägger till skyddade fält i anrop som skapar och uppdaterar poster.
      preconditions: En vanlig testanvändare som äger en post och listan över skrivbara fält för den posttypen.
      expected: Anrop med skyddade fält avvisas och inget skyddat värde ändras.
      steps:
        - action: Uppdatera posten och lägg till ett rollfält med värdet admin.
          expected: Svaret är 400 och användarens roll är oförändrad.
          data: '{"title": "x", "role": "admin"}'
        - action: Uppdatera posten och sätt ägar-id till en annan användare.
          expected: Svaret är 400 och ägaren är oförändrad.
        - action: Skapa en post med ett skapandedatum bakåt i tiden.
          expected: Svaret är 400, eller så får posten serverns tid som skapandedatum.

  - id: APIS-T10
    priority: medium
    execution: automated
    tags: [pagination]
    refs: ["OWASP API Security Top 10 2023 API4", "IEC 62443-3-3 SR 7.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(h)", "CWE-770 (allocation of resources without limits or throttling)", "MITRE ATT&CK T1499.003 (application exhaustion flood)"]
    en:
      title: Page size is capped at 100
      description: A script asks a list endpoint for very large pages.
      preconditions: A list endpoint with at least 250 records for the test user.
      expected: No response holds more than 100 items.
      steps:
        - action: Request the list with a page size of 10 000.
          expected: The response holds 100 items and a link to the next page.
          data: "?limit=10000"
        - action: Follow the next-page links to the end.
          expected: Every page holds at most 100 items and all records are returned once.
    sv:
      title: Sidstorleken begränsas till 100
      description: Ett skript begär mycket stora sidor från en endpoint för listor.
      preconditions: En endpoint för listor med minst 250 poster för testanvändaren.
      expected: Inget svar innehåller mer än 100 objekt.
      steps:
        - action: Begär listan med sidstorleken 10 000.
          expected: Svaret innehåller 100 objekt och en länk till nästa sida.
          data: "?limit=10000"
        - action: Följ länkarna till nästa sida till slutet.
          expected: Varje sida innehåller högst 100 objekt och alla poster returneras en gång.

  - id: APIS-T11
    priority: medium
    execution: manual
    tags: [api-key, revocation]
    refs: ["NIST SP 800-53 IA-5", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.5.18", "IEC 62443-3-3 SR 1.5", "IEC 62443-4-2 CR 1.5", "MITRE ATT&CK T1550.001 (application access token)"]
    en:
      title: A revoked API key stops working within one minute
      description: Revokes an API key in the administration while a client uses it.
      preconditions: An administrator and a script that calls the API with a test key every 5 seconds.
      expected: The key is refused within 1 minute of revocation.
      steps:
        - action: Start the script and confirm that its calls succeed.
          expected: Each call returns 200.
        - action: Revoke the key in the administration and note the time.
          expected: The key is shown as revoked.
        - action: Read the script's results.
          expected: Calls return 401 no later than 1 minute after the noted time.
    sv:
      title: En återkallad API-nyckel slutar fungera inom en minut
      description: Återkallar en API-nyckel i administrationen medan en klient använder den.
      preconditions: En administratör och ett skript som anropar API:et med en testnyckel var femte sekund.
      expected: Nyckeln avvisas inom 1 minut efter återkallelsen.
      steps:
        - action: Starta skriptet och bekräfta att dess anrop lyckas.
          expected: Varje anrop svarar 200.
        - action: Återkalla nyckeln i administrationen och anteckna tiden.
          expected: Nyckeln visas som återkallad.
        - action: Läs skriptets resultat.
          expected: Anropen svarar 401 senast 1 minut efter den antecknade tiden.

  - id: APIS-T12
    priority: high
    execution: automated
    tags: [refresh-token, token-rotation]
    refs: ["RFC 9700 §4.14 (refresh token protection)", "CWE-294 (authentication bypass by capture-replay)", "MITRE ATT&CK T1528 (steal application access token)"]
    en:
      title: Reused refresh token revokes the token family
      description: A script refreshes a token, then replays the old refresh token.
      preconditions: A registered test client and a user grant that returned an access token and a refresh token R1.
      expected: R1 cannot be reused, and its reuse revokes the newer tokens.
      steps:
        - action: Exchange R1 for new tokens.
          expected: A new access token and a new refresh token R2 are returned.
        - action: Exchange R1 again.
          expected: The request is refused with invalid_grant.
        - action: Call the API with the new access token and exchange R2.
          expected: The access token is refused with 401 and R2 is refused with invalid_grant.
    sv:
      title: Återanvänd uppdateringstoken återkallar tokenfamiljen
      description: Ett skript uppdaterar en token och spelar sedan upp den gamla uppdateringstoken igen.
      preconditions: En registrerad testklient och en användarbehörighet som gav en åtkomsttoken och en uppdateringstoken R1.
      expected: R1 kan inte återanvändas, och återanvändningen återkallar de nyare token.
      steps:
        - action: Byt R1 mot nya token.
          expected: En ny åtkomsttoken och en ny uppdateringstoken R2 returneras.
        - action: Byt R1 igen.
          expected: Anropet avvisas med invalid_grant.
        - action: Anropa API:et med den nya åtkomsttoken och byt R2.
          expected: Åtkomsttoken avvisas med 401 och R2 avvisas med invalid_grant.

  - id: APIS-T13
    priority: medium
    execution: automated
    tags: [dpop, sender-constrained]
    refs: ["RFC 9449", "CWE-294 (authentication bypass by capture-replay)", "MITRE ATT&CK T1528 (steal application access token)", "MITRE ATT&CK T1550.001 (application access token)"]
    en:
      title: Bound tokens need proof of the client key
      description: A script obtains a DPoP-bound token and sends write requests with and without a valid proof.
      preconditions: A test client with two key pairs, K1 registered for DPoP and K2 unknown to the system.
      expected: The token works only with a fresh proof signed by K1.
      steps:
        - action: Obtain a token with a write scope using a DPoP proof signed by K1.
          expected: The token response has token_type DPoP.
        - action: Send a write request with the token and a new proof signed by K1.
          expected: The request succeeds.
        - action: Send the same request with the token as a plain bearer token, and again with a proof signed by K2.
          expected: Both requests are refused with 401.
    sv:
      title: Bundna token kräver bevis på klientnyckeln
      description: Ett skript hämtar en DPoP-bunden token och skickar skrivanrop med och utan giltigt bevis.
      preconditions: En testklient med två nyckelpar, K1 registrerat för DPoP och K2 okänt för systemet.
      expected: Token fungerar bara med ett nytt bevis signerat med K1.
      steps:
        - action: Hämta en token med skrivbehörighet med ett DPoP-bevis signerat med K1.
          expected: Tokensvaret har token_type DPoP.
        - action: Skicka ett skrivanrop med token och ett nytt bevis signerat med K1.
          expected: Anropet lyckas.
        - action: Skicka samma anrop med token som vanlig innehavartoken, och igen med ett bevis signerat med K2.
          expected: Båda anropen avvisas med 401.

  - id: APIS-T14
    priority: critical
    execution: automated
    tags: [jwt, token-validation]
    refs: ["RFC 8725 §3.1", "RFC 9068 §4", "CWE-347 (improper verification of cryptographic signature)", "MITRE ATT&CK T1606 (forge web credentials)"]
    en:
      title: Forged and mismatched JWT access tokens are refused
      description: A script sends altered JWT access tokens to a protected API endpoint.
      preconditions: A valid JWT access token for the API and the authorisation server's public key.
      expected: Only the unaltered token with matching claims is accepted.
      steps:
        - action: Call the endpoint with the valid token.
          expected: The call succeeds.
        - action: Call it with the token re-encoded with alg none and no signature.
          expected: The call is refused with 401.
        - action: Call it with the token signed with HS256 using the public key as the secret.
          expected: The call is refused with 401.
        - action: Call it with correctly signed tokens that have a wrong audience and an expiry time in the past.
          expected: Both calls are refused with 401.
    sv:
      title: Förfalskade och felaktiga JWT-åtkomsttoken avvisas
      description: Ett skript skickar ändrade JWT-åtkomsttoken till en skyddad API-ändpunkt.
      preconditions: En giltig JWT-åtkomsttoken för API:et och auktoriseringsserverns publika nyckel.
      expected: Endast den oförändrade token med matchande anspråk godtas.
      steps:
        - action: Anropa ändpunkten med den giltiga token.
          expected: Anropet lyckas.
        - action: Anropa den med token omkodad med alg none och utan signatur.
          expected: Anropet avvisas med 401.
        - action: Anropa den med token signerad med HS256 och den publika nyckeln som hemlighet.
          expected: Anropet avvisas med 401.
        - action: Anropa den med korrekt signerade token som har fel mottagare och en utgångstid som passerats.
          expected: Båda anropen avvisas med 401.

  - id: APIS-T15
    priority: high
    execution: automated
    tags: [api-inventory]
    refs: ["OWASP API Security Top 10 2023 API9", "CWE-912 (hidden functionality)", "MITRE ATT&CK M1042 (disable or remove feature or program)"]
    en:
      title: No API endpoints outside the published description
      description: A script compares the paths that answer on the API host with the published API description.
      preconditions: The published OpenAPI description, a word list of common paths and a test account.
      expected: Every path that returns data is in the description, and retired versions return 404 or 410.
      steps:
        - action: Request every path in the word list and every path of the description under each known version prefix.
          expected: The responses are recorded.
          data: "/v0/, /v1/, /beta/, /debug/, /internal/, /swagger.json, /actuator/"
        - action: Compare the paths that answered 2xx with the description.
          expected: No path outside the description answered with data.
        - action: Request the paths of a retired version.
          expected: Each answers 404 or 410.
    sv:
      title: Inga API-ändpunkter utanför den publicerade beskrivningen
      description: Ett skript jämför de sökvägar som svarar på API-värden med den publicerade API-beskrivningen.
      preconditions: Den publicerade OpenAPI-beskrivningen, en ordlista med vanliga sökvägar och ett testkonto.
      expected: Varje sökväg som returnerar data finns i beskrivningen, och avvecklade versioner svarar 404 eller 410.
      steps:
        - action: Anropa varje sökväg i ordlistan och varje sökväg i beskrivningen under varje känt versionsprefix.
          expected: Svaren registreras.
          data: "/v0/, /v1/, /beta/, /debug/, /internal/, /swagger.json, /actuator/"
        - action: Jämför sökvägarna som svarade 2xx med beskrivningen.
          expected: Ingen sökväg utanför beskrivningen svarade med data.
        - action: Anropa sökvägarna för en avvecklad version.
          expected: Var och en svarar 404 eller 410.

  - id: APIS-T16
    priority: high
    execution: automated
    tags: [business-flows, rate-limit]
    refs: ["OWASP API Security Top 10 2023 API6"]
    en:
      title: Sensitive flows stop after 10 requests per hour
      description: A script repeats account creation, invitations and voucher redemption from one source and one account.
      preconditions: A test environment with rate limits as in production, two source addresses and test vouchers.
      expected: The 11th request in an hour is refused per source and per account, and another source is unaffected.
      steps:
        - action: Create 11 accounts from source A within 10 minutes.
          expected: The first 10 succeed and the 11th is refused with 429.
        - action: Send 11 invitations, then redeem 11 test vouchers, from one account within 10 minutes.
          expected: The 11th invitation and the 11th redemption are refused with 429.
        - action: Create an account from source B.
          expected: The request succeeds.
    sv:
      title: Känsliga flöden stoppas efter 10 anrop per timme
      description: Ett skript upprepar skapande av konton, inbjudningar och inlösen av värdekoder från en källa och ett konto.
      preconditions: En testmiljö med samma anropsgränser som i produktion, två källadresser och testvärdekoder.
      expected: Det 11:e anropet under en timme avvisas per källa och per konto, och en annan källa påverkas inte.
      steps:
        - action: Skapa 11 konton från källa A inom 10 minuter.
          expected: De första 10 lyckas och det 11:e avvisas med 429.
        - action: Skicka 11 inbjudningar och lös sedan in 11 testvärdekoder från ett konto inom 10 minuter.
          expected: Den 11:e inbjudan och den 11:e inlösen avvisas med 429.
        - action: Skapa ett konto från källa B.
          expected: Anropet lyckas.

risks:
  - id: APIS-R01
    category: security
    likelihood: 3
    impact: 4
    tags: [token-theft, api]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP API Security Top 10 2023 API2", "CWE-294 (authentication bypass by capture-replay)"]
    mitigated_by: [APIS-04, APIS-12, APIS-13, APIS-11]
    attack: [T1528, T1550.001]
    en:
      title: Stolen API token used to act as a client
      description: An access or refresh token leaks from a log, a device or a compromised client and the attacker calls the API as that client. Data is read or changed until the token expires or is revoked.
      mitigation: Issue short-lived access tokens, rotate refresh tokens and revoke the grant on reuse, bind write tokens to the sender and make it possible to revoke a key at once.
    sv:
      title: Stulen API-token används för att uppträda som en klient
      description: En åtkomst- eller förnyelsetoken läcker från en logg, en enhet eller en komprometterad klient och angriparen anropar API:et som den klienten. Data läses eller ändras tills token löper ut eller återkallas.
      mitigation: Utfärda kortlivade åtkomsttoken, byt förnyelsetoken vid varje användning och återkalla behörigheten vid återanvändning, bind skrivande token till avsändaren och gör det möjligt att återkalla en nyckel direkt.
  - id: APIS-R02
    category: availability
    likelihood: 4
    impact: 3
    tags: [denial-of-service, rate-limit]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP API Security Top 10 2023 API4 (unrestricted resource consumption)", "CWE-770 (allocation of resources without limits or throttling)"]
    mitigated_by: [APIS-03, APIS-07, APIS-10, APIS-16]
    attack: [T1499.003]
    en:
      title: API overloaded by one client
      description: A misbehaving or hostile client sends many requests, very large bodies or asks for huge pages. The service slows down or stops for every other client.
      mitigation: Limit the request rate per client, the body size and the page size, and set limits on sensitive business flows.
    sv:
      title: API:et överbelastas av en enda klient
      description: En felaktig eller fientlig klient skickar många anrop, mycket stora meddelanden eller begär enorma sidor. Tjänsten blir långsam eller slutar fungera för alla andra klienter.
      mitigation: Begränsa anropsfrekvensen per klient, meddelandestorleken och sidstorleken och sätt gränser för känsliga affärsflöden.
  - id: APIS-R03
    category: security
    likelihood: 3
    impact: 4
    tags: [mass-assignment, api]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP API Security Top 10 2023 API3", "CWE-915 (mass assignment)", "CWE-863 (incorrect authorization)"]
    mitigated_by: [APIS-09, APIS-05]
    attack: [T1190, T1565.001]
    en:
      title: Protected fields changed through the API
      description: The API binds every field of a request to the stored object, so a client sets fields such as role, owner or price that it must not change. Users raise their own rights or alter business data.
      mitigation: Accept only listed fields for each operation and limit operations with token scopes.
    sv:
      title: Skyddade fält ändras via API:et
      description: API:et binder varje fält i ett anrop till det lagrade objektet, så att en klient sätter fält som roll, ägare eller pris som den inte får ändra. Användare höjer sin egen behörighet eller ändrar affärsdata.
      mitigation: Ta bara emot listade fält för varje operation och begränsa operationerna med omfång i token.
  - id: APIS-R04
    category: security
    likelihood: 3
    impact: 3
    tags: [shadow-api, inventory]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP API Security Top 10 2023 API9", "CWE-912 (hidden functionality)", "MITRE ATT&CK M1042 (disable or remove feature or program)"]
    mitigated_by: [APIS-15, APIS-01, APIS-08]
    attack: [T1190, T1595.003]
    en:
      title: Forgotten API endpoint left open
      description: An old version or a test endpoint stays reachable without the protection of the current API. Attackers find it and use it to bypass authentication or read internal details.
      mitigation: Keep an inventory of every exposed endpoint and remove what is not in it, authenticate every client and keep error responses free of internal details.
    sv:
      title: Bortglömd API-ändpunkt lämnas öppen
      description: En gammal version eller en teständpunkt är fortfarande nåbar utan skydden i det aktuella API:et. Angripare hittar den och använder den för att kringgå autentiseringen eller läsa interna detaljer.
      mitigation: För en förteckning över alla exponerade ändpunkter och ta bort det som inte finns i den, autentisera varje klient och håll felsvaren fria från interna detaljer.
  - id: APIS-R05
    category: security
    likelihood: 3
    impact: 4
    tags: [refresh-tokens, token-theft]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "RFC 9700 §4.14 (refresh token protection)", "CWE-294 (authentication bypass by capture-replay)"]
    mitigated_by: [APIS-12, APIS-13, APIS-04]
    attack: [T1528, T1550.001]
    en:
      title: Stolen refresh token gives lasting access to the API
      description: A long-lived refresh token is copied from a device or a log. The attacker keeps obtaining new access tokens for months, even after the user changes password.
      mitigation: Keep access tokens short-lived, rotate refresh tokens and revoke the grant on reuse, and bind tokens for write access to the client.
    sv:
      title: "Stulen förnyelsetoken ger varaktig åtkomst till API:et"
      description: En långlivad förnyelsetoken kopieras från en enhet eller en logg. Angriparen fortsätter att hämta nya åtkomsttoken i månader, även efter att användaren bytt lösenord.
      mitigation: Håll åtkomsttoken kortlivade, rotera förnyelsetoken och återkalla behörigheten vid återanvändning, och bind token för skrivåtkomst till klienten.
  - id: APIS-R06
    category: security
    likelihood: 3
    impact: 4
    tags: [business-flows, automation-abuse]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP API Security Top 10 2023 API6", "CWE-799 (improper control of interaction frequency)"]
    mitigated_by: [APIS-16, APIS-03]
    attack: [T1585]
    en:
      title: Sensitive business flow automated by bots
      description: "Sign-up, booking or purchase endpoints accept any number of calls. Bots buy up limited stock, create fake accounts in bulk or send messages at the organisation's expense."
      mitigation: Limit sensitive business flows per user and client and rate limit every API client.
    sv:
      title: Känsliga affärsflöden automatiseras av robotar
      description: Ändpunkter för registrering, bokning eller köp tar emot hur många anrop som helst. Robotar köper upp begränsade lager, skapar falska konton i mängd eller skickar meddelanden på organisationens bekostnad.
      mitigation: Begränsa känsliga affärsflöden per användare och klient och begränsa anropstakten för varje API-klient.
