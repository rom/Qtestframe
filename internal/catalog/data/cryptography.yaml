area: cryptography
prefix: CRY
group: security
name: {en: Cryptography, sv: Kryptografi}
description:
  en: Encrypted connections, certificate validation, encryption at rest, key and secret management, password hashing and secure random numbers.
  sv: Krypterade förbindelser, certifikatvalidering, kryptering av lagrade data, hantering av nycklar och hemligheter, lösenordshashning och säkra slumptal.

requirements:
  - id: CRY-01
    type: security
    obligation: must
    priority: critical
    tags: [tls, transport-encryption]
    refs: ["OWASP ASVS 5.0 V12.1.1 (TLS versions)", "NIST SP 800-52 Rev. 2", "OWASP Top 10 2021 A02", "PCI DSS v4.0.1 Req. 4.2.1", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 SCM)", "CWE-327 (broken or risky cryptographic algorithm)", "MITRE ATT&CK T1689 (downgrade attack)"]
    tests: [CRY-T01]
    d3fend: [D3-MENCR]
    en:
      title: TLS 1.2 or later for external connections
      description: The system MUST accept external connections only over TLS 1.2 or TLS 1.3 and refuse SSL, TLS 1.0 and TLS 1.1.
      rationale: Older protocol versions have known weaknesses that let an attacker on the network read or change the traffic.
      criteria:
        - method: test
          text: A TLS scan of every public host name shows only TLS 1.2 and 1.3 enabled and only cipher suites with forward secrecy.
        - method: test
          text: A plain HTTP request is redirected to HTTPS or refused.
    sv:
      title: TLS 1.2 eller senare för externa förbindelser
      description: Systemet SKA godta externa förbindelser enbart över TLS 1.2 eller TLS 1.3 och avvisa SSL, TLS 1.0 och TLS 1.1.
      rationale: Äldre protokollversioner har kända svagheter som låter en angripare i nätet läsa eller ändra trafiken.
      criteria:
        - method: test
          text: En TLS-skanning av varje publikt värdnamn visar att bara TLS 1.2 och 1.3 är påslagna och bara chiffersviter med framåtsekretess används.
        - method: test
          text: Ett vanligt HTTP-anrop skickas vidare till HTTPS eller avvisas.

  - id: CRY-02
    type: security
    obligation: should
    priority: medium
    tags: [tls, hsts]
    refs: ["OWASP ASVS 5.0 V3.4.1 (Strict-Transport-Security)", "RFC 6797", "ISO/IEC 27001:2022 A.8.24", "CWE-1428 (reliance on HTTP instead of HTTPS)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    tests: [CRY-T01]
    en:
      title: HTTP Strict Transport Security
      description: The system SHOULD send a Strict-Transport-Security header with a max-age of at least 31 536 000 seconds on every HTTPS response.
      rationale: The header makes browsers use HTTPS directly and stops downgrade attacks on the first plain HTTP request.
      criteria:
        - method: test
          text: Every HTTPS response has a Strict-Transport-Security header whose max-age is 31 536 000 or higher.
    sv:
      title: HTTP Strict Transport Security
      description: Systemet BÖR skicka ett Strict-Transport-Security-huvud med max-age på minst 31 536 000 sekunder på varje HTTPS-svar.
      rationale: Huvudet får webbläsare att använda HTTPS direkt och stoppar nedgraderingsattacker mot det första okrypterade HTTP-anropet.
      criteria:
        - method: test
          text: Varje HTTPS-svar har ett Strict-Transport-Security-huvud vars max-age är 31 536 000 eller högre.

  - id: CRY-03
    type: security
    obligation: must
    priority: high
    tags: [tls, internal-traffic]
    refs: ["OWASP ASVS 5.0 V12.3.1 (encrypted connections)", "NIST SP 800-53 SC-8", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.1", "IEC 62443-3-3 SR 3.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "ISO/IEC 27033-1:2015", "Regulation (EU) 2022/2554 (DORA) Art. 9(3)(a)", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1040 (network sniffing)"]
    tests: [CRY-T02]
    d3fend: [D3-MENCR]
    en:
      title: Encrypted connections between internal components
      description: The system MUST encrypt connections between its own components, including the database, message queue and cache, with TLS 1.2 or later.
      rationale: An attacker who gets into the internal network can otherwise read credentials and personal data in transit.
      criteria:
        - method: inspection
          text: The configuration of each internal connection requires TLS, and a packet capture on the internal network shows no readable application data.
    sv:
      title: Krypterade förbindelser mellan interna komponenter
      description: Systemet SKA kryptera förbindelser mellan sina egna komponenter, inklusive databas, meddelandekö och cache, med TLS 1.2 eller senare.
      rationale: En angripare som tar sig in i det interna nätet kan annars läsa inloggningsuppgifter och personuppgifter under överföringen.
      criteria:
        - method: inspection
          text: Konfigurationen för varje intern förbindelse kräver TLS, och en paketinspelning i det interna nätet visar inga läsbara applikationsdata.

  - id: CRY-04
    type: security
    obligation: must_not
    priority: critical
    tags: [tls, certificate-validation]
    refs: ["OWASP ASVS 5.0 V12.3.2 (TLS certificate validation)", "OWASP Top 10 2021 A02", "OWASP Transport Layer Security Cheat Sheet", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.9", "IEC 62443-4-2 CR 1.9", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 SCM)", "CWE-295 (improper certificate validation)", "CWE-297 (improper validation of certificate with host mismatch)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    tests: [CRY-T03]
    en:
      title: Certificate validation is never turned off
      description: The system MUST NOT accept a server certificate on an outgoing connection when its chain, host name or validity period fails validation.
      rationale: Turning off validation makes the encryption worthless, because anyone in the path can present their own certificate.
      criteria:
        - method: test
          text: Outgoing calls to a test server with a self-signed, expired or wrong-host certificate fail.
        - method: review
          text: The code and configuration contain no option that skips certificate verification.
    sv:
      title: Certifikatvalidering stängs aldrig av
      description: Systemet SKA INTE godta ett servercertifikat i en utgående förbindelse när kedjan, värdnamnet eller giltighetstiden inte klarar valideringen.
      rationale: Om valideringen stängs av blir krypteringen värdelös, eftersom vem som helst i vägen kan visa upp ett eget certifikat.
      criteria:
        - method: test
          text: Utgående anrop till en testserver med självsignerat, utgånget eller felaktigt namngivet certifikat misslyckas.
        - method: review
          text: Koden och konfigurationen innehåller inget alternativ som hoppar över certifikatkontrollen.

  - id: CRY-05
    type: security
    obligation: must
    priority: critical
    tags: [password-hashing, argon2]
    refs: ["OWASP Password Storage Cheat Sheet", "OWASP ASVS 5.0 V11.4.2 (password hashing)", "NIST SP 800-63B-4 §3.1.1.2 (password verifiers)", "RFC 9106", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.5", "CWE-916 (password hash with insufficient computational effort)", "MITRE ATT&CK T1110.002 (password cracking)"]
    tests: [CRY-T04]
    d3fend: [D3-CH]
    en:
      title: Password hashing algorithm and work factor
      description: The system MUST hash passwords with Argon2id using at least 19 MiB of memory, 2 iterations and a parallelism of 1.
      rationale: A memory-hard algorithm with a high work factor makes offline guessing of stolen hashes expensive; teams that use bcrypt or PBKDF2 can replace the values here.
      criteria:
        - method: inspection
          text: The stored hash strings start with $argon2id$ and encode m of 19456 or more, t of 2 or more and p of 1 or more.
        - method: test
          text: After the work factor is raised in the configuration, a user's hash is upgraded at the next successful sign-in.
    sv:
      title: Algoritm och arbetsfaktor för lösenordshashning
      description: Systemet SKA hasha lösenord med Argon2id med minst 19 MiB minne, 2 iterationer och en parallellitet på 1.
      rationale: En minneskrävande algoritm med hög arbetsfaktor gör det dyrt att gissa stulna hashar offline; team som använder bcrypt eller PBKDF2 kan byta ut värdena här.
      criteria:
        - method: inspection
          text: De lagrade hashsträngarna börjar med $argon2id$ och anger m på 19456 eller mer, t på 2 eller mer och p på 1 eller mer.
        - method: test
          text: När arbetsfaktorn höjs i konfigurationen uppgraderas en användares hash vid nästa lyckade inloggning.

  - id: CRY-06
    type: security
    obligation: must
    priority: high
    tags: [encryption-at-rest, aes]
    refs: ["OWASP ASVS 5.0 V14.2.4 (sensitive data protection controls)", "NIST SP 800-53 SC-28", "ISO/IEC 27001:2022 A.8.24", "PCI DSS v4.0.1 Req. 3.5", "IEC 62443-3-3 SR 4.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "GDPR Art. 32(1)(a)", "ISO/IEC 27040:2024", "CWE-311 (missing encryption of sensitive data)", "MITRE ATT&CK T1530 (data from cloud storage)"]
    tests: [CRY-T05]
    d3fend: [D3-FE]
    en:
      title: Encryption of stored data
      description: The system MUST encrypt databases, file storage and backups that hold personal or confidential data with AES-256 or a cipher of at least the same key length.
      rationale: Encryption at rest protects the data when disks, snapshots or backup media are lost or copied.
      criteria:
        - method: inspection
          text: The storage and backup configuration shows encryption with AES-256 turned on for each store that holds such data.
    sv:
      title: Kryptering av lagrade data
      description: Systemet SKA kryptera databaser, fillagring och säkerhetskopior som innehåller personuppgifter eller konfidentiella data med AES-256 eller ett chiffer med minst samma nyckellängd.
      rationale: Kryptering av lagrade data skyddar dem när diskar, ögonblicksbilder eller säkerhetskopior försvinner eller kopieras.
      criteria:
        - method: inspection
          text: Konfigurationen för lagring och säkerhetskopiering visar att kryptering med AES-256 är påslagen för varje lagringsplats med sådana data.

  - id: CRY-07
    type: security
    obligation: must_not
    priority: critical
    tags: [secrets, source-code]
    refs: ["OWASP ASVS 5.0 V13.3.1 (secrets management solution)", "OWASP Secrets Management Cheat Sheet", "OWASP Top 10 2021 A05", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-4-1 SM-8", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 CCK)", "CWE-798 (use of hard-coded credentials)", "CWE-540 (inclusion of sensitive information in source code)", "MITRE ATT&CK T1552.001 (credentials in files)"]
    tests: [CRY-T06]
    d3fend: [D3-CS]
    en:
      title: No secrets in source code or images
      description: The system MUST NOT keep passwords, API keys, private keys or other secrets in source code, version control history or container images.
      rationale: Code and images are copied widely, and a secret stored there is exposed to everyone who can read them.
      criteria:
        - method: test
          text: A secret scan of the full version control history and of each released image reports no live secret.
        - method: inspection
          text: The application reads its secrets at runtime from a secrets manager or protected environment.
    sv:
      title: Inga hemligheter i källkod eller avbilder
      description: Systemet SKA INTE ha lösenord, API-nycklar, privata nycklar eller andra hemligheter i källkod, versionshistorik eller containeravbilder.
      rationale: Kod och avbilder kopieras i stor omfattning, och en hemlighet som ligger där är exponerad för alla som kan läsa dem.
      criteria:
        - method: test
          text: En skanning efter hemligheter i hela versionshistoriken och i varje släppt avbild rapporterar ingen giltig hemlighet.
        - method: inspection
          text: Applikationen läser sina hemligheter vid körning från en hemlighetshanterare eller en skyddad miljö.

  - id: CRY-08
    type: security
    obligation: should
    priority: medium
    tags: [key-management, key-rotation]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 §5.3", "ISO/IEC 27001:2022 A.8.24", "PCI DSS v4.0.1 Req. 3.7.4", "IEC 62443-3-3 SR 4.3", "CWE-324 (use of a key past its expiration date)"]
    tests: [CRY-T07]
    en:
      title: Rotation of encryption keys
      description: The system SHOULD rotate its data encryption keys at least every 12 months without downtime for users.
      rationale: Regular rotation limits the amount of data protected by a single key and rehearses the procedure needed after a leak.
      criteria:
        - method: demonstration
          text: A key rotation in the test environment completes while a load test runs with no failed requests, and data encrypted with the old key can still be read.
        - method: inspection
          text: The key inventory shows a creation date less than 12 months old for each active key.
    sv:
      title: Byte av krypteringsnycklar
      description: Systemet BÖR byta sina datakrypteringsnycklar minst var 12:e månad utan avbrott för användarna.
      rationale: Regelbundna byten begränsar hur mycket data som skyddas av en enda nyckel och övar det förfarande som behövs efter en läcka.
      criteria:
        - method: demonstration
          text: Ett nyckelbyte i testmiljön slutförs medan ett lasttest körs utan misslyckade anrop, och data som krypterats med den gamla nyckeln går fortfarande att läsa.
        - method: inspection
          text: Nyckelförteckningen visar ett skapandedatum som är mindre än 12 månader gammalt för varje aktiv nyckel.

  - id: CRY-09
    type: security
    obligation: must
    priority: high
    tags: [randomness, csprng]
    refs: ["OWASP ASVS 5.0 V11.5.1 (cryptographically secure random values)", "NIST SP 800-90A Rev. 1", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.3", "IEC 62443-4-2 CR 4.3", "CWE-338 (cryptographically weak PRNG)", "CWE-330 (use of insufficiently random values)"]
    tests: [CRY-T08, SESS-T01]
    en:
      title: Cryptographically secure random numbers
      description: The system MUST take every token, key, nonce, salt and one-time code from a cryptographically secure random number generator.
      rationale: General-purpose random generators are predictable once a few outputs are known.
      criteria:
        - method: review
          text: A code search finds no general-purpose random function used for a security value.
    sv:
      title: Kryptografiskt säkra slumptal
      description: Systemet SKA ta varje token, nyckel, nonce, salt och engångskod från en kryptografiskt säker slumptalsgenerator.
      rationale: Slumptalsgeneratorer för allmänt bruk blir förutsägbara när man känner till en handfull utdata.
      criteria:
        - method: review
          text: En kodsökning hittar ingen slumpfunktion för allmänt bruk som används för ett säkerhetsvärde.

  - id: CRY-10
    type: security
    obligation: must_not
    priority: high
    tags: [weak-algorithms]
    refs: ["OWASP ASVS 5.0 V11.3 (encryption algorithms)", "NIST SP 800-131A Rev. 2", "OWASP Top 10 2021 A02", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.3", "IEC 62443-4-2 CR 4.3", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 CRY)", "CWE-327 (broken or risky cryptographic algorithm)", "CWE-328 (use of weak hash)"]
    tests: [CRY-T09]
    en:
      title: No broken cryptographic algorithms
      description: The system MUST NOT use MD5, SHA-1, DES, 3DES, RC4 or the ECB mode of operation for any security purpose.
      rationale: These algorithms have practical attacks and give a false sense of protection.
      criteria:
        - method: test
          text: A static analysis and a dependency scan for weak cryptographic calls report no use for a security purpose.
    sv:
      title: Inga knäckta kryptografiska algoritmer
      description: Systemet SKA INTE använda MD5, SHA-1, DES, 3DES, RC4 eller driftläget ECB för något säkerhetsändamål.
      rationale: De här algoritmerna har praktiska attacker och ger en falsk känsla av skydd.
      criteria:
        - method: test
          text: En statisk analys och en beroendeskanning efter svaga kryptografiska anrop rapporterar ingen användning för säkerhetsändamål.

  - id: CRY-11
    type: security
    obligation: may
    priority: low
    tags: [key-management, hsm, kms]
    refs: ["NIST SP 800-57 Part 1 Rev. 5", "PCI DSS v4.0.1 Req. 3.6", "ISO/IEC 27001:2022 A.8.24", "CWE-522 (insufficiently protected credentials)", "MITRE ATT&CK T1552.004 (private keys)"]
    tests: [CRY-T10]
    en:
      title: Master keys in a hardware security module
      description: The system MAY keep its key-encryption keys in a hardware security module or a cloud key management service from which they cannot be exported.
      rationale: Keys that never leave dedicated hardware cannot be copied even by someone with full access to the servers.
      criteria:
        - method: inspection
          text: The key-encryption key is marked as non-exportable in the key management service, and the application only calls it to wrap and unwrap data keys.
    sv:
      title: Huvudnycklar i en hårdvarusäkerhetsmodul
      description: Systemet FÅR förvara sina nyckelkrypteringsnycklar i en hårdvarusäkerhetsmodul eller en nyckelhanteringstjänst i molnet där de inte kan exporteras.
      rationale: Nycklar som aldrig lämnar dedikerad hårdvara kan inte kopieras ens av den som har full åtkomst till servrarna.
      criteria:
        - method: inspection
          text: Nyckelkrypteringsnyckeln är markerad som icke exporterbar i nyckelhanteringstjänsten, och applikationen anropar den bara för att kapsla in och packa upp datanycklar.

  - id: CRY-12
    type: security
    obligation: must
    priority: high
    tags: [crypto-inventory, cbom, post-quantum]
    refs: ["NIST IR 8547 §4.1 (quantum-vulnerable algorithms)", "CycloneDX 1.6 (cryptography bill of materials)", "NIS Cooperation Group PQC Roadmap §6.2 (cryptographic inventory)", "ISO/IEC 27001:2022 A.8.24"]
    tests: [CRY-T11]
    en:
      title: Inventory of cryptographic use
      description: The supplier MUST keep an inventory that lists, for each use of cryptography in the system, the algorithm, key length, purpose, component and library version, and update it within 30 days of each change.
      rationale: Moving away from algorithms broken by quantum computers, or by new attacks, is impossible to plan without knowing where each algorithm is used.
      criteria:
        - method: inspection
          text: The inventory has the five fields for every TLS endpoint, data store encryption, signature and hash use found in a code search.
        - method: review
          text: The last change to the inventory is no more than 30 days after the last change to a cryptographic setting.
          threshold: "≤ 30 days"
    sv:
      title: Förteckning över kryptografisk användning
      description: Leverantören SKA föra en förteckning som för varje användning av kryptografi i systemet anger algoritm, nyckellängd, syfte, komponent och biblioteksversion, och uppdatera den inom 30 dagar efter varje ändring.
      rationale: Det går inte att planera bytet från algoritmer som knäcks av kvantdatorer, eller av nya angrepp, utan att veta var varje algoritm används.
      criteria:
        - method: inspection
          text: Förteckningen har de fem fälten för varje TLS-ändpunkt, kryptering av datalager, signatur och hashanvändning som en kodsökning hittar.
        - method: review
          text: Den senaste ändringen av förteckningen ligger högst 30 dagar efter den senaste ändringen av en kryptografisk inställning.
          threshold: "≤ 30 dagar"

  - id: CRY-13
    type: security
    obligation: should
    priority: medium
    tags: [post-quantum, tls, key-exchange, ml-kem]
    refs: ["NIST FIPS 203", "RFC 10024 §4 (X25519MLKEM768)", "NIST IR 8547 §3.2.1 (hybrid key establishment)", "ISO/IEC 27001:2022 A.8.24", "CWE-326 (inadequate encryption strength)"]
    tests: [CRY-T12]
    en:
      title: Hybrid post-quantum key exchange on external TLS
      description: The system SHOULD offer the hybrid key exchange X25519MLKEM768 on its external TLS 1.3 endpoints and prefer it when the client supports it.
      rationale: Traffic recorded today can be decrypted later by a quantum computer; a hybrid exchange protects it while keeping the classical security if the new algorithm turns out weak.
      criteria:
        - method: test
          text: A TLS 1.3 client that offers X25519MLKEM768 and X25519 gets X25519MLKEM768, and a client that offers only X25519 still connects.
    sv:
      title: Hybrid postkvant-nyckelutväxling i extern TLS
      description: Systemet BÖR erbjuda den hybrida nyckelutväxlingen X25519MLKEM768 på sina externa ändpunkter för TLS 1.3 och föredra den när klienten stöder den.
      rationale: Trafik som spelas in i dag kan dekrypteras senare av en kvantdator; en hybrid utväxling skyddar den och behåller det klassiska skyddet om den nya algoritmen visar sig svag.
      criteria:
        - method: test
          text: En klient för TLS 1.3 som erbjuder X25519MLKEM768 och X25519 får X25519MLKEM768, och en klient som bara erbjuder X25519 kan fortfarande ansluta.

  - id: CRY-14
    type: constraint
    obligation: should
    priority: medium
    tags: [crypto-agility, configuration]
    refs: ["NIST IR 8547 §1.1 (crypto agility)", "NIS Cooperation Group PQC Roadmap §4.2 (crypto agility)", "ISO/IEC 27001:2022 A.8.24"]
    tests: [CRY-T13]
    en:
      title: Algorithms changed by configuration
      description: The system SHOULD read the algorithms for TLS, data encryption and signatures from configuration, so that replacing one algorithm needs no code change and no more than one release.
      rationale: When an algorithm is broken the replacement is urgent, and hard-coded algorithms turn it into a development project.
      criteria:
        - method: demonstration
          text: In a test environment the signature algorithm is switched from ECDSA P-256 to ML-DSA-65 by a configuration change, and new signatures verify while old ones are still accepted during the transition.
    sv:
      title: Algoritmer byts via konfiguration
      description: Systemet BÖR läsa algoritmerna för TLS, datakryptering och signaturer från konfigurationen, så att ett byte av en algoritm inte kräver någon kodändring och högst en leverans.
      rationale: När en algoritm knäcks är bytet brådskande, och hårdkodade algoritmer gör det till ett utvecklingsprojekt.
      criteria:
        - method: demonstration
          text: I en testmiljö byts signaturalgoritmen från ECDSA P-256 till ML-DSA-65 genom en konfigurationsändring, och nya signaturer kan verifieras medan gamla fortfarande godtas under övergången.

  - id: CRY-15
    type: security
    obligation: must_not
    priority: high
    tags: [key-management, key-separation]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 §5.2", "ISO/IEC 27002:2022 §8.24", "IEC 62443-3-3 SR 4.3"]
    tests: [CRY-T14]
    en:
      title: One key for one purpose
      description: The system MUST NOT use the same cryptographic key for more than one purpose, such as encryption and signing, or for more than one environment.
      rationale: A key used for two purposes can let an attack on one use break the other, and a key shared with the test environment is only as safe as that environment.
      criteria:
        - method: inspection
          text: The key inventory shows one purpose and one environment for each key, and no key identifier appears twice in the configuration of different services or environments.
    sv:
      title: En nyckel för ett syfte
      description: Systemet SKA INTE använda samma kryptografiska nyckel för mer än ett syfte, till exempel kryptering och signering, eller i mer än en miljö.
      rationale: En nyckel som används för två syften kan göra att ett angrepp mot den ena användningen knäcker den andra, och en nyckel som delas med testmiljön är bara så säker som den miljön.
      criteria:
        - method: inspection
          text: Nyckelförteckningen visar ett syfte och en miljö per nyckel, och ingen nyckelidentifierare förekommer två gånger i konfigurationen för olika tjänster eller miljöer.

  - id: CRY-16
    type: security
    obligation: should
    priority: medium
    tags: [post-quantum, data-at-rest, long-term-confidentiality]
    refs: ["NIST IR 8547 §4.1.3 (symmetric algorithms)", "NIST FIPS 197", "ISO/IEC 27001:2022 A.8.24", "CWE-326 (inadequate encryption strength)"]
    tests: [CRY-T15]
    en:
      title: 256-bit keys for data with long confidentiality needs
      description: The system SHOULD encrypt data classified as confidential for more than 10 years with AES using 256-bit keys.
      rationale: Quantum search attacks halve the effective strength of symmetric keys, and 256-bit keys keep a wide margin for data that must stay secret for decades.
      criteria:
        - method: inspection
          text: The storage configuration and the crypto inventory show AES-256 for each data store that holds data classified as confidential for more than 10 years.
    sv:
      title: 256-bitarsnycklar för data med långvarigt sekretessbehov
      description: Systemet BÖR kryptera data som är klassade som konfidentiella i mer än 10 år med AES med 256-bitarsnycklar.
      rationale: Kvantsökning halverar den effektiva styrkan hos symmetriska nycklar, och 256-bitarsnycklar ger god marginal för data som ska vara hemliga i årtionden.
      criteria:
        - method: inspection
          text: Lagringskonfigurationen och kryptoförteckningen visar AES-256 för varje datalager som innehåller data klassade som konfidentiella i mer än 10 år.

  - id: CRY-17
    type: security
    obligation: must
    priority: medium
    tags: [post-quantum, migration-plan]
    refs: ["NIST IR 8547 §4 (transition timeline)", "NIS Cooperation Group PQC Roadmap §4 (transition timeline)", "ISO/IEC 27001:2022 A.8.24", "CWE-327 (broken or risky cryptographic algorithm)"]
    tests: [CRY-T11]
    en:
      title: Migration plan for quantum-vulnerable algorithms
      description: The supplier MUST keep a plan that gives a target date no later than 2030 for replacing RSA and elliptic-curve algorithms in each high-risk use listed in the cryptographic inventory.
      rationale: Replacing public-key algorithms touches protocols, certificates, hardware and partners, and takes years when it is not planned.
      criteria:
        - method: review
          text: Each RSA or elliptic-curve entry marked high-risk in the inventory has a replacement algorithm, an owner and a target date in 2030 or earlier.
          threshold: "target date ≤ 2030"
    sv:
      title: Plan för att ersätta algoritmer som är sårbara för kvantdatorer
      description: Leverantören SKA ha en plan som anger ett måldatum senast 2030 för att ersätta RSA och algoritmer baserade på elliptiska kurvor i varje högriskanvändning i den kryptografiska förteckningen.
      rationale: Byte av algoritmer för publika nycklar berör protokoll, certifikat, hårdvara och partner och tar flera år om det inte planeras.
      criteria:
        - method: review
          text: Varje post med RSA eller elliptiska kurvor som är markerad som högrisk i förteckningen har en ersättningsalgoritm, en ägare och ett måldatum 2030 eller tidigare.
          threshold: "måldatum ≤ 2030"

tests:
  - id: CRY-T01
    priority: critical
    execution: automated
    tags: [tls, hsts]
    refs: ["OWASP Web Security Testing Guide WSTG-CRYP-01", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 SCM)", "CWE-327 (broken or risky cryptographic algorithm)", "MITRE ATT&CK T1689 (downgrade attack)", "CWE-1428 (reliance on HTTP instead of HTTPS)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    en:
      title: TLS scan of public host names
      description: A TLS scanner checks protocol versions, cipher suites and the HSTS header of each public host name.
      preconditions: A list of the system's public host names and a TLS scanning tool in the pipeline.
      expected: Only TLS 1.2 and 1.3 are offered, plain HTTP is redirected and HSTS is set for at least one year.
      steps:
        - action: Scan each host name for supported protocol versions.
          expected: SSL 3.0, TLS 1.0 and TLS 1.1 are refused; TLS 1.2 or 1.3 is accepted.
        - action: List the cipher suites offered for TLS 1.2.
          expected: Every suite uses ECDHE or DHE key exchange and an AEAD cipher.
        - action: Request the start page over plain HTTP and over HTTPS.
          expected: HTTP returns a redirect to HTTPS, and the HTTPS response has Strict-Transport-Security with max-age of at least 31536000.
    sv:
      title: TLS-skanning av publika värdnamn
      description: En TLS-skanner kontrollerar protokollversioner, chiffersviter och HSTS-huvudet för varje publikt värdnamn.
      preconditions: En lista över systemets publika värdnamn och ett verktyg för TLS-skanning i byggkedjan.
      expected: Bara TLS 1.2 och 1.3 erbjuds, okrypterad HTTP skickas vidare och HSTS är satt till minst ett år.
      steps:
        - action: Skanna varje värdnamn efter protokollversioner som stöds.
          expected: SSL 3.0, TLS 1.0 och TLS 1.1 avvisas; TLS 1.2 eller 1.3 godtas.
        - action: Lista de chiffersviter som erbjuds för TLS 1.2.
          expected: Varje svit använder nyckelutbyte med ECDHE eller DHE och ett AEAD-chiffer.
        - action: Begär startsidan över okrypterad HTTP och över HTTPS.
          expected: HTTP ger en omdirigering till HTTPS, och HTTPS-svaret har Strict-Transport-Security med max-age på minst 31536000.

  - id: CRY-T02
    priority: high
    execution: manual
    tags: [tls, internal-traffic]
    refs: ["NIST SP 800-53 SC-8", "IEC 62443-3-3 SR 4.1", "IEC 62443-3-3 SR 3.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "ISO/IEC 27033-1:2015", "Regulation (EU) 2022/2554 (DORA) Art. 9(3)(a)", "CWE-319 (cleartext transmission of sensitive information)", "MITRE ATT&CK T1040 (network sniffing)"]
    en:
      title: Internal connections are encrypted
      description: Inspects the configuration of internal connections and captures traffic on the internal network.
      preconditions: Access to the deployment configuration and permission to capture packets on the internal network of the test environment.
      expected: Every internal connection uses TLS and no application data is readable.
      steps:
        - action: List every connection between components and check its configuration.
          expected: The database, message queue and cache connections each require TLS 1.2 or later.
        - action: Capture traffic for 5 minutes while a test user creates and reads records.
          expected: The capture contains only TLS traffic between components and no readable names or passwords.
    sv:
      title: Interna förbindelser är krypterade
      description: Granskar konfigurationen för interna förbindelser och spelar in trafiken i det interna nätet.
      preconditions: Åtkomst till driftkonfigurationen och tillstånd att spela in paket i testmiljöns interna nät.
      expected: Varje intern förbindelse använder TLS och inga applikationsdata går att läsa.
      steps:
        - action: Lista varje förbindelse mellan komponenter och kontrollera dess konfiguration.
          expected: Förbindelserna till databas, meddelandekö och cache kräver var och en TLS 1.2 eller senare.
        - action: Spela in trafiken i 5 minuter medan en testanvändare skapar och läser poster.
          expected: Inspelningen innehåller bara TLS-trafik mellan komponenterna och inga läsbara namn eller lösenord.

  - id: CRY-T03
    priority: critical
    execution: automated
    tags: [certificate-validation]
    refs: ["OWASP Transport Layer Security Cheat Sheet", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.9", "IEC 62443-4-2 CR 1.9", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 SCM)", "CWE-295 (improper certificate validation)", "CWE-297 (improper validation of certificate with host mismatch)", "MITRE ATT&CK T1557 (adversary-in-the-middle)"]
    en:
      title: Outgoing calls fail on invalid certificates
      description: A script points the system's outgoing integrations at test servers with invalid certificates.
      preconditions: Three test servers with a self-signed, an expired and a wrong-host certificate, and an integration whose target URL can be changed.
      expected: Every connection to an invalid certificate fails and is logged.
      steps:
        - action: Point the integration at the server with a self-signed certificate and trigger a call.
          expected: The call fails with a certificate error and no data is sent.
        - action: Repeat with the expired and the wrong-host certificate.
          expected: Both calls fail with a certificate error.
        - action: Search the code and configuration for options that turn off certificate verification.
          expected: None are found.
          data: InsecureSkipVerify, verify=False, rejectUnauthorized false
    sv:
      title: Utgående anrop misslyckas vid ogiltiga certifikat
      description: Ett skript riktar systemets utgående integrationer mot testservrar med ogiltiga certifikat.
      preconditions: Tre testservrar med ett självsignerat, ett utgånget och ett felaktigt namngivet certifikat, och en integration vars måladress kan ändras.
      expected: Varje förbindelse mot ett ogiltigt certifikat misslyckas och loggas.
      steps:
        - action: Rikta integrationen mot servern med självsignerat certifikat och utlös ett anrop.
          expected: Anropet misslyckas med ett certifikatfel och inga data skickas.
        - action: Upprepa med det utgångna och det felaktigt namngivna certifikatet.
          expected: Båda anropen misslyckas med ett certifikatfel.
        - action: Sök i koden och konfigurationen efter alternativ som stänger av certifikatkontrollen.
          expected: Inga hittas.
          data: InsecureSkipVerify, verify=False, rejectUnauthorized false

  - id: CRY-T04
    priority: critical
    execution: manual
    tags: [password-hashing, argon2]
    refs: ["OWASP Password Storage Cheat Sheet", "ISO/IEC 27001:2022 A.5.17", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 1.5", "IEC 62443-4-2 CR 1.5", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "CWE-916 (password hash with insufficient computational effort)", "CWE-257 (storing passwords in a recoverable format)", "MITRE ATT&CK T1110.002 (password cracking)"]
    en:
      title: Password hashes use Argon2id with the agreed work factor
      description: Inspects the stored password hashes and checks the upgrade of old hashes.
      preconditions: Read access to the credential table in the test environment and a test account with a hash created under a lower work factor.
      expected: All hashes use Argon2id with at least the agreed parameters.
      steps:
        - action: Read the hash strings of 10 accounts created after the current configuration was set.
          expected: Each starts with $argon2id$ and encodes m of 19456 or more, t of 2 or more and p of 1 or more.
          data: "$argon2id$v=19$m=19456,t=2,p=1$..."
        - action: Sign in with the test account that has the older hash and read its hash again.
          expected: The hash has been replaced by one with the current parameters.
    sv:
      title: Lösenordshashar använder Argon2id med den överenskomna arbetsfaktorn
      description: Granskar de lagrade lösenordshasharna och kontrollerar att gamla hashar uppgraderas.
      preconditions: Läsbehörighet till tabellen med inloggningsuppgifter i testmiljön och ett testkonto med en hash som skapats med lägre arbetsfaktor.
      expected: Alla hashar använder Argon2id med minst de överenskomna parametrarna.
      steps:
        - action: Läs hashsträngarna för 10 konton som skapats efter att den nuvarande konfigurationen sattes.
          expected: Var och en börjar med $argon2id$ och anger m på 19456 eller mer, t på 2 eller mer och p på 1 eller mer.
          data: "$argon2id$v=19$m=19456,t=2,p=1$..."
        - action: Logga in med testkontot som har den äldre hashen och läs dess hash igen.
          expected: Hashen har ersatts av en med de nuvarande parametrarna.

  - id: CRY-T05
    priority: high
    execution: manual
    tags: [encryption-at-rest]
    refs: ["NIST SP 800-53 SC-28", "IEC 62443-3-3 SR 4.1", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "GDPR Art. 32(1)(a)", "ISO/IEC 27040:2024", "CWE-311 (missing encryption of sensitive data)", "MITRE ATT&CK T1530 (data from cloud storage)"]
    en:
      title: Stored data and backups are encrypted
      description: Inspects the encryption settings of each data store and backup target.
      preconditions: A list of the data stores and backup targets that hold personal or confidential data, and read access to their configuration.
      expected: Every listed store and backup is encrypted with AES-256.
      steps:
        - action: For each database and file store, read the encryption setting.
          expected: Encryption at rest is on with AES-256.
        - action: For each backup target, read the encryption setting of the latest backup.
          expected: The backup is encrypted with AES-256.
        - action: Try to read a raw database file or snapshot without the key.
          expected: The content is not readable.
    sv:
      title: Lagrade data och säkerhetskopior är krypterade
      description: Granskar krypteringsinställningarna för varje datalager och mål för säkerhetskopiering.
      preconditions: En lista över datalager och mål för säkerhetskopiering som innehåller personuppgifter eller konfidentiella data, och läsbehörighet till deras konfiguration.
      expected: Varje listat lager och varje säkerhetskopia är krypterad med AES-256.
      steps:
        - action: Läs krypteringsinställningen för varje databas och fillager.
          expected: Kryptering av lagrade data är påslagen med AES-256.
        - action: Läs krypteringsinställningen för den senaste säkerhetskopian på varje mål.
          expected: Säkerhetskopian är krypterad med AES-256.
        - action: Försök läsa en rå databasfil eller ögonblicksbild utan nyckeln.
          expected: Innehållet går inte att läsa.

  - id: CRY-T06
    priority: critical
    execution: automated
    tags: [secrets, secret-scanning]
    refs: ["OWASP Secrets Management Cheat Sheet", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-4-1 SM-8", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 CCK)", "CWE-798 (use of hard-coded credentials)", "CWE-540 (inclusion of sensitive information in source code)", "MITRE ATT&CK T1552.001 (credentials in files)"]
    en:
      title: Secret scan of history and images
      description: A secret scanner runs over the full version control history and every released container image.
      preconditions: A secret scanning tool in the pipeline with rules for passwords, API keys and private keys.
      expected: No live secret is found.
      steps:
        - action: Scan the full version control history of every repository of the system.
          expected: No finding, or only findings confirmed as test values or revoked secrets.
        - action: Scan the file system layers of each released container image.
          expected: No finding.
        - action: Add a dummy private key to a branch and run the pipeline.
          expected: The pipeline fails and names the file with the key.
    sv:
      title: Skanning efter hemligheter i historik och avbilder
      description: En skanner för hemligheter körs över hela versionshistoriken och varje släppt containeravbild.
      preconditions: Ett verktyg för skanning efter hemligheter i byggkedjan med regler för lösenord, API-nycklar och privata nycklar.
      expected: Ingen giltig hemlighet hittas.
      steps:
        - action: Skanna hela versionshistoriken i varje kodförråd som hör till systemet.
          expected: Inga fynd, eller bara fynd som bekräftats vara testvärden eller återkallade hemligheter.
        - action: Skanna filsystemlagren i varje släppt containeravbild.
          expected: Inga fynd.
        - action: Lägg till en påhittad privat nyckel i en gren och kör byggkedjan.
          expected: Byggkedjan misslyckas och anger filen med nyckeln.

  - id: CRY-T07
    priority: medium
    execution: manual
    tags: [key-rotation]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 §5.3", "IEC 62443-3-3 SR 4.3", "CWE-324 (use of a key past its expiration date)"]
    en:
      title: Key rotation under load
      description: Rotates the data encryption key while the system is in use and checks the key inventory.
      preconditions: A test environment with encrypted data, a load test script and access to the key management procedure.
      expected: The rotation causes no failed requests and no key is older than 12 months.
      steps:
        - action: Start the load test and rotate the data encryption key following the documented procedure.
          expected: The rotation completes and the load test reports no failed requests.
        - action: Read a record that was encrypted before the rotation and save a new one.
          expected: The old record is readable and the new one is encrypted with the new key.
        - action: Review the key inventory.
          expected: Every active key was created less than 12 months ago.
    sv:
      title: Nyckelbyte under last
      description: Byter datakrypteringsnyckel medan systemet används och granskar nyckelförteckningen.
      preconditions: En testmiljö med krypterade data, ett skript för lasttest och åtkomst till rutinen för nyckelhantering.
      expected: Bytet orsakar inga misslyckade anrop och ingen nyckel är äldre än 12 månader.
      steps:
        - action: Starta lasttestet och byt datakrypteringsnyckel enligt den dokumenterade rutinen.
          expected: Bytet slutförs och lasttestet rapporterar inga misslyckade anrop.
        - action: Läs en post som krypterades före bytet och spara en ny.
          expected: Den gamla posten går att läsa och den nya är krypterad med den nya nyckeln.
        - action: Granska nyckelförteckningen.
          expected: Varje aktiv nyckel skapades för mindre än 12 månader sedan.

  - id: CRY-T08
    priority: high
    execution: automated
    tags: [randomness, csprng, static-analysis]
    refs: ["OWASP ASVS 5.0 V11.5.1 (cryptographically secure random values)", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.3", "IEC 62443-4-2 CR 4.3", "CWE-338 (cryptographically weak PRNG)", "CWE-330 (use of insufficiently random values)"]
    en:
      title: No general-purpose random functions for security values
      description: A static analysis rule searches the code for general-purpose random functions near security values.
      preconditions: A static analysis tool with rules for insecure random number generation for the languages used.
      expected: Security values come only from secure generators.
      steps:
        - action: Run the rule set for insecure randomness on the source code.
          expected: No finding in code that creates tokens, keys, nonces, salts or one-time codes.
          data: math/rand, java.util.Random, Math.random, random.random
        - action: Review the helper that creates tokens.
          expected: It reads from the platform's secure generator.
    sv:
      title: Inga slumpfunktioner för allmänt bruk för säkerhetsvärden
      description: En regel för statisk analys söker i koden efter slumpfunktioner för allmänt bruk som används för säkerhetsvärden.
      preconditions: Ett verktyg för statisk analys med regler för osäker slumptalsgenerering för de språk som används.
      expected: Säkerhetsvärden kommer bara från säkra generatorer.
      steps:
        - action: Kör regeluppsättningen för osäker slump på källkoden.
          expected: Inga fynd i kod som skapar token, nycklar, nonce, salt eller engångskoder.
          data: math/rand, java.util.Random, Math.random, random.random
        - action: Granska hjälpfunktionen som skapar token.
          expected: Den läser från plattformens säkra generator.

  - id: CRY-T09
    priority: high
    execution: automated
    tags: [weak-algorithms, static-analysis]
    refs: ["NIST SP 800-131A Rev. 2", "ISO/IEC 27001:2022 A.8.24", "IEC 62443-3-3 SR 4.3", "IEC 62443-4-2 CR 4.3", "Regulation (EU) 2024/2847 (CRA) Annex I Part I §2(e)", "Directive 2014/53/EU (RED) Art. 3(3)(d) (EN 18031-1 CRY)", "CWE-327 (broken or risky cryptographic algorithm)", "CWE-328 (use of weak hash)"]
    en:
      title: Scan for weak cryptographic algorithms
      description: A static analysis rule and a configuration check look for weak algorithms and modes.
      preconditions: A static analysis tool with a rule set for weak cryptography, and the TLS and signing configuration files.
      expected: No weak algorithm is used for a security purpose.
      steps:
        - action: Run the weak cryptography rule set on the source code and dependencies.
          expected: No use of MD5, SHA-1, DES, 3DES, RC4 or ECB mode for a security purpose is reported.
        - action: Search the configuration files for the same algorithm names.
          expected: None appear in security settings.
    sv:
      title: Skanning efter svaga kryptografiska algoritmer
      description: En regel för statisk analys och en konfigurationskontroll letar efter svaga algoritmer och driftlägen.
      preconditions: Ett verktyg för statisk analys med en regeluppsättning för svag kryptografi, och konfigurationsfilerna för TLS och signering.
      expected: Ingen svag algoritm används för säkerhetsändamål.
      steps:
        - action: Kör regeluppsättningen för svag kryptografi på källkoden och beroendena.
          expected: Ingen användning av MD5, SHA-1, DES, 3DES, RC4 eller ECB för säkerhetsändamål rapporteras.
        - action: Sök i konfigurationsfilerna efter samma algoritmnamn.
          expected: Inga förekommer i säkerhetsinställningar.

  - id: CRY-T10
    priority: low
    execution: manual
    tags: [hsm, kms]
    refs: ["NIST SP 800-57 Part 1 Rev. 5", "ISO/IEC 27001:2022 A.8.24", "CWE-522 (insufficiently protected credentials)", "MITRE ATT&CK T1552.004 (private keys)"]
    en:
      title: Key-encryption key cannot be exported
      description: Inspects the key management service and how the application uses the key-encryption key.
      preconditions: Administrator read access to the key management service.
      expected: The key-encryption key is non-exportable and used only to wrap data keys.
      steps:
        - action: Open the key-encryption key in the key management service.
          expected: The key is marked as non-exportable and its material is not shown.
        - action: Try to export the key with an administrator account.
          expected: The export is refused.
        - action: Review the key service's access log for one day.
          expected: The application calls only wrap and unwrap operations.
    sv:
      title: Nyckelkrypteringsnyckeln kan inte exporteras
      description: Granskar nyckelhanteringstjänsten och hur applikationen använder nyckelkrypteringsnyckeln.
      preconditions: Läsbehörighet som administratör till nyckelhanteringstjänsten.
      expected: Nyckelkrypteringsnyckeln är icke exporterbar och används bara för att kapsla in datanycklar.
      steps:
        - action: Öppna nyckelkrypteringsnyckeln i nyckelhanteringstjänsten.
          expected: Nyckeln är markerad som icke exporterbar och nyckelmaterialet visas inte.
        - action: Försök exportera nyckeln med ett administratörskonto.
          expected: Exporten avvisas.
        - action: Granska nyckeltjänstens åtkomstlogg för ett dygn.
          expected: Applikationen anropar bara operationer för att kapsla in och packa upp.

  - id: CRY-T11
    priority: high
    execution: manual
    tags: [crypto-inventory, post-quantum]
    refs: ["NIST IR 8547 §4.1 (quantum-vulnerable algorithms)", "CycloneDX 1.6 (cryptography bill of materials)", "CWE-327 (broken or risky cryptographic algorithm)"]
    en:
      title: Cryptographic inventory is complete and has a migration plan
      description: Compares the inventory with a code and configuration search and checks the migration plan for high-risk entries.
      preconditions: The cryptographic inventory, the migration plan, read access to the source code and the deployment configuration.
      expected: Every use found is in the inventory with all fields, and each high-risk RSA or elliptic-curve use has a planned replacement.
      steps:
        - action: Search the code and configuration for cryptographic libraries, cipher names, key lengths and TLS settings.
          expected: A list of uses is produced.
          data: "RSA, ECDSA, ECDH, X25519, AES, ChaCha20, SHA-, HMAC, ssl_protocols, cipher"
        - action: Match each use against the inventory.
          expected: Each use has an entry with algorithm, key length, purpose, component and library version.
        - action: For each high-risk entry with RSA or elliptic curves, look it up in the migration plan.
          expected: Each has a replacement algorithm, an owner and a target date in 2030 or earlier.
    sv:
      title: Den kryptografiska förteckningen är fullständig och har en övergångsplan
      description: Jämför förteckningen med en sökning i kod och konfiguration och kontrollerar övergångsplanen för högriskposter.
      preconditions: Den kryptografiska förteckningen, övergångsplanen, läsbehörighet till källkoden och driftsättningens konfiguration.
      expected: Varje användning som hittas finns i förteckningen med alla fält, och varje högriskanvändning av RSA eller elliptiska kurvor har en planerad ersättning.
      steps:
        - action: Sök i kod och konfiguration efter kryptobibliotek, namn på chiffer, nyckellängder och TLS-inställningar.
          expected: En lista med användningar tas fram.
          data: "RSA, ECDSA, ECDH, X25519, AES, ChaCha20, SHA-, HMAC, ssl_protocols, cipher"
        - action: Matcha varje användning mot förteckningen.
          expected: Varje användning har en post med algoritm, nyckellängd, syfte, komponent och biblioteksversion.
        - action: Slå upp varje högriskpost med RSA eller elliptiska kurvor i övergångsplanen.
          expected: Var och en har en ersättningsalgoritm, en ägare och ett måldatum 2030 eller tidigare.

  - id: CRY-T12
    priority: medium
    execution: automated
    tags: [post-quantum, tls]
    refs: ["NIST FIPS 203", "RFC 10024 §4 (X25519MLKEM768)", "CWE-326 (inadequate encryption strength)"]
    en:
      title: TLS endpoint negotiates the hybrid key exchange
      description: A TLS client that supports ML-KEM connects to each external endpoint with different group lists.
      preconditions: A TLS 1.3 client that supports X25519MLKEM768 and can set the offered groups, such as a recent OpenSSL.
      expected: The hybrid group is chosen when offered, and classical clients still connect.
      steps:
        - action: Connect offering the groups X25519MLKEM768 and X25519.
          expected: The handshake completes with X25519MLKEM768.
        - action: Connect offering only X25519.
          expected: The handshake completes with X25519.
    sv:
      title: TLS-ändpunkten förhandlar fram den hybrida nyckelutväxlingen
      description: En TLS-klient med stöd för ML-KEM ansluter till varje extern ändpunkt med olika listor över grupper.
      preconditions: En klient för TLS 1.3 som stöder X25519MLKEM768 och där de erbjudna grupperna kan anges, till exempel en aktuell OpenSSL.
      expected: Den hybrida gruppen väljs när den erbjuds, och klassiska klienter kan fortfarande ansluta.
      steps:
        - action: Anslut och erbjud grupperna X25519MLKEM768 och X25519.
          expected: Handskakningen slutförs med X25519MLKEM768.
        - action: Anslut och erbjud bara X25519.
          expected: Handskakningen slutförs med X25519.

  - id: CRY-T13
    priority: medium
    execution: manual
    tags: [crypto-agility]
    refs: ["NIST IR 8547 §1.1 (crypto agility)"]
    en:
      title: Signature algorithm switched by configuration
      description: Changes the configured signature algorithm in a test environment and checks old and new signatures.
      preconditions: A test environment, a document signed with the current algorithm and a configuration that offers ML-DSA-65.
      expected: The switch needs only a configuration change and both signatures verify during the transition.
      steps:
        - action: Set the signature algorithm to ML-DSA-65 in the configuration and restart the service.
          expected: The service starts without a code change or a new build.
        - action: Sign a new document and verify it.
          expected: The signature uses ML-DSA-65 and verifies.
        - action: Verify the document signed before the switch.
          expected: The old signature still verifies.
    sv:
      title: Signaturalgoritmen byts via konfiguration
      description: Byter den konfigurerade signaturalgoritmen i en testmiljö och kontrollerar gamla och nya signaturer.
      preconditions: En testmiljö, ett dokument signerat med den nuvarande algoritmen och en konfiguration som erbjuder ML-DSA-65.
      expected: Bytet kräver bara en konfigurationsändring och båda signaturerna kan verifieras under övergången.
      steps:
        - action: Sätt signaturalgoritmen till ML-DSA-65 i konfigurationen och starta om tjänsten.
          expected: Tjänsten startar utan kodändring eller nytt bygge.
        - action: Signera ett nytt dokument och verifiera det.
          expected: Signaturen använder ML-DSA-65 och kan verifieras.
        - action: Verifiera dokumentet som signerades före bytet.
          expected: Den gamla signaturen kan fortfarande verifieras.

  - id: CRY-T14
    priority: high
    execution: manual
    tags: [key-separation]
    refs: ["NIST SP 800-57 Part 1 Rev. 5 §5.2"]
    en:
      title: Keys are not shared between purposes or environments
      description: Compares the key identifiers used by each service and environment.
      preconditions: The key inventory and read access to the key configuration of the test and production environments.
      expected: Each key has one purpose and appears in one environment only.
      steps:
        - action: List the key identifiers and their use for each service in production.
          expected: No identifier is used both for encryption and for signing.
        - action: List the key identifiers in the test environment and compare with production.
          expected: No identifier appears in both.
    sv:
      title: Nycklar delas inte mellan syften eller miljöer
      description: Jämför nyckelidentifierarna som används av varje tjänst och miljö.
      preconditions: Nyckelförteckningen och läsbehörighet till nyckelkonfigurationen i test- och produktionsmiljön.
      expected: Varje nyckel har ett syfte och förekommer i endast en miljö.
      steps:
        - action: Lista nyckelidentifierarna och deras användning för varje tjänst i produktion.
          expected: Ingen identifierare används både för kryptering och för signering.
        - action: Lista nyckelidentifierarna i testmiljön och jämför med produktion.
          expected: Ingen identifierare förekommer i båda.

  - id: CRY-T15
    priority: medium
    execution: manual
    tags: [long-term-confidentiality]
    refs: ["NIST FIPS 197", "CWE-326 (inadequate encryption strength)"]
    en:
      title: Long-term confidential data uses AES-256
      description: Checks the encryption settings of data stores that hold long-term confidential data.
      preconditions: The data classification with retention of confidentiality, and access to the storage encryption settings.
      expected: Each such data store uses AES with 256-bit keys.
      steps:
        - action: List the data stores that hold data classified as confidential for more than 10 years.
          expected: At least one data store is listed, or the classification states that there are none.
        - action: Read the encryption algorithm and key length of each listed data store.
          expected: Each shows AES with a 256-bit key.
    sv:
      title: Långvarigt konfidentiella data använder AES-256
      description: Kontrollerar krypteringsinställningarna för datalager som innehåller långvarigt konfidentiella data.
      preconditions: Dataklassningen med sekretesstid och åtkomst till lagringens krypteringsinställningar.
      expected: Varje sådant datalager använder AES med 256-bitarsnycklar.
      steps:
        - action: Lista de datalager som innehåller data klassade som konfidentiella i mer än 10 år.
          expected: Minst ett datalager listas, eller så anger klassningen att det inte finns något.
        - action: Läs krypteringsalgoritm och nyckellängd för varje listat datalager.
          expected: Vart och ett visar AES med en 256-bitarsnyckel.

risks:
  - id: CRY-R01
    category: security
    likelihood: 3
    impact: 4
    tags: [tls, adversary-in-the-middle]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A02", "CWE-295 (improper certificate validation)", "CWE-319 (cleartext transmission of sensitive information)"]
    mitigated_by: [CRY-01, CRY-02, CRY-03, CRY-04]
    attack: [T1557, T1040]
    en:
      title: Traffic intercepted or altered in transit
      description: A connection uses an old protocol, plain text or a client that does not validate certificates. Someone on the network reads credentials and data or changes them on the way.
      mitigation: Use TLS 1.2 or later externally and encrypted connections internally, enable HTTP Strict Transport Security and never turn off certificate validation.
    sv:
      title: Trafik avlyssnas eller ändras under överföring
      description: En förbindelse använder ett gammalt protokoll, klartext eller en klient som inte validerar certifikat. Någon i nätet läser inloggningsuppgifter och data eller ändrar dem på vägen.
      mitigation: Använd TLS 1.2 eller senare externt och krypterade förbindelser internt, aktivera HTTP Strict Transport Security och stäng aldrig av certifikatvalideringen.
  - id: CRY-R02
    category: security
    likelihood: 2
    impact: 5
    tags: [key-management, encryption]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A02", "CWE-522 (insufficiently protected credentials)", "CWE-324 (use of a key past its expiration date)"]
    mitigated_by: [CRY-11, CRY-08, CRY-15, CRY-06]
    attack: [T1552.004]
    en:
      title: Encryption keys stolen together with the data
      description: Data is encrypted, but the keys are stored next to it, used for many purposes and never rotated. One breach exposes all encrypted data, including copies taken earlier.
      mitigation: Keep master keys in a hardware security module, use one key for one purpose, rotate keys and encrypt stored data with keys held apart from it.
    sv:
      title: Krypteringsnycklar stjäls tillsammans med data
      description: Data krypteras men nycklarna lagras bredvid, används för många syften och byts aldrig. Ett intrång röjer all krypterad data, även kopior som tagits tidigare.
      mitigation: Förvara huvudnycklar i en hårdvarusäkerhetsmodul, använd en nyckel för ett syfte, byt nycklar regelbundet och kryptera lagrad data med nycklar som hålls åtskilda från den.
  - id: CRY-R03
    category: security
    likelihood: 2
    impact: 4
    tags: [post-quantum, harvest-now-decrypt-later]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "NIST IR 8547", "CWE-327 (broken or risky cryptographic algorithm)", "CWE-326 (inadequate encryption strength)"]
    mitigated_by: [CRY-13, CRY-17, CRY-12, CRY-14, CRY-16]
    attack: [T1040]
    en:
      title: Recorded traffic decrypted by a future quantum computer
      description: An adversary records encrypted traffic today and decrypts it once quantum computers break the key exchange. Data with a long confidentiality need, such as health or trade secrets, is exposed years later.
      mitigation: Use hybrid post-quantum key exchange, keep an inventory of cryptographic use, make algorithms changeable by configuration and plan the migration of quantum-vulnerable algorithms.
    sv:
      title: Inspelad trafik dekrypteras av en framtida kvantdator
      description: En motståndare spelar in krypterad trafik i dag och dekrypterar den när kvantdatorer bryter nyckelutbytet. Uppgifter med långt konfidentialitetsbehov, som hälsodata eller affärshemligheter, röjs flera år senare.
      mitigation: Använd hybridnyckelutbyte med postkvantalgoritmer, för en förteckning över kryptografins användning, gör algoritmerna utbytbara via konfiguration och planera migreringen av kvantsårbara algoritmer.
  - id: CRY-R04
    category: security
    likelihood: 3
    impact: 4
    tags: [randomness, weak-algorithm]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP Top 10 2021 A02", "CWE-338 (cryptographically weak PRNG)", "CWE-327 (broken or risky cryptographic algorithm)", "CWE-328 (use of weak hash)"]
    mitigated_by: [CRY-09, CRY-10, SESS-01]
    attack: [T1606]
    en:
      title: Tokens or signatures broken because of weak cryptography
      description: Session tokens, reset codes or keys come from a predictable random generator, or data is protected with a broken hash or cipher. An attacker predicts tokens or forges protected values.
      mitigation: Use a cryptographically secure random generator for every secret value and allow no broken algorithms.
    sv:
      title: Token eller signaturer knäcks på grund av svag kryptografi
      description: Sessionstoken, återställningskoder eller nycklar kommer från en förutsägbar slumptalsgenerator, eller data skyddas med en knäckt hash eller ett knäckt chiffer. En angripare förutsäger token eller förfalskar skyddade värden.
      mitigation: Använd en kryptografiskt säker slumptalsgenerator för alla hemliga värden och tillåt inga knäckta algoritmer.
  - id: CRY-R05
    category: security
    likelihood: 3
    impact: 4
    tags: [certificate-validation, tls]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP ASVS 5.0 V12.3.2 (TLS certificate validation)", "CWE-295 (improper certificate validation)"]
    mitigated_by: [CRY-04, CRY-03, CRY-02]
    attack: [T1557]
    en:
      title: Certificate checks switched off in an integration
      description: A developer turns off certificate validation to get past a test certificate, and the setting reaches production. Anyone on the network path can impersonate the remote service.
      mitigation: Never turn off certificate validation, encrypt connections between internal components and use HTTP Strict Transport Security.
    sv:
      title: Certifikatkontrollen stängs av i en integration
      description: En utvecklare stänger av certifikatvalideringen för att komma förbi ett testcertifikat, och inställningen når produktion. Vem som helst på nätvägen kan utge sig för att vara den andra tjänsten.
      mitigation: Stäng aldrig av certifikatvalideringen, kryptera anslutningar mellan interna komponenter och använd HTTP Strict Transport Security.
  - id: CRY-R06
    category: security
    likelihood: 2
    impact: 4
    tags: [weak-randomness, tokens]
    refs: ["ISO/IEC 27005:2022 §7 (risk assessment process)", "OWASP ASVS 5.0 V11.5.1 (cryptographically secure random values)", "CWE-338 (use of cryptographically weak pseudo-random number generator)"]
    mitigated_by: [CRY-09, CRY-15]
    attack: [T1606]
    en:
      title: Predictable tokens and keys generated by a weak random source
      description: Reset links, session tokens or keys are made with an ordinary random function. An attacker who observes a few values predicts the next ones and takes over accounts.
      mitigation: Generate every token and key with a cryptographically secure random generator and use one key for one purpose only.
    sv:
      title: Förutsägbara token och nycklar skapas av en svag slumpkälla
      description: Återställningslänkar, sessionstoken eller nycklar skapas med en vanlig slumpfunktion. En angripare som ser några värden förutsäger nästa och tar över konton.
      mitigation: Skapa varje token och nyckel med en kryptografiskt säker slumpgenerator och använd en nyckel för ett enda syfte.
