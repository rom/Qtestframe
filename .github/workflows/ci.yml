name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qtf
          POSTGRES_PASSWORD: qtf
          POSTGRES_DB: qtf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qtf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QTF_TEST_POSTGRES_DSN: postgres://qtf:qtf@localhost:5432/qtf?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: software TPM for the tpm key provider tests
        run: sudo apt-get update && sudo apt-get install -y swtpm
      - name: vet (linux + darwin)
        run: make vet
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: tests with 85% coverage floor (SQLite + PostgreSQL)
        run: make coverage-go
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  pkcs11:
    # the HSM key provider (build tag pkcs11, cgo) against SoftHSM2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y softhsm2 swtpm
      - run: make test-pkcs11 test-tpm
      - run: CGO_ENABLED=1 go vet -tags pkcs11 ./internal/secrets
      - run: make go-pkcs11 && ./bin/qtestframe version

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: type-check and build
        run: npm run build
        working-directory: web
      - name: unit tests with 85% coverage floor
        run: npm run coverage
        working-directory: web
      - name: single-file Markdown guides are up to date (make guide-docs admin-guide-docs)
        run: |
          node web/scripts/guide-export.mjs --no-pdf --out docs/user-guide
          node web/scripts/guide-export.mjs --guide admin --no-pdf --out docs/admin-guide
          git diff --exit-code -- docs/user-guide/qtestframe-user-guide-*.md docs/admin-guide/qtestframe-admin-guide-*.md

  build:
    needs: [go, web]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make build
      - run: ./bin/qtestframe version

  e2e:
    # Playwright end-to-end tests against the built binary (see docs/testing.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the binary (web client + server)
        run: make build
      - name: type-check the end-to-end tests
        run: npm run typecheck:e2e
        working-directory: web
      - name: install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: end-to-end tests
        run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
