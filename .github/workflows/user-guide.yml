name: user-guide
# Builds the user guide as PDF and single-file Markdown (make guide) and
# publishes it on the rolling "user-guide" release, so README.md can link to
# the latest files. Pull requests get the files as a build artifact.
on:
  push:
    branches: [rom]
    paths: ['docs/user-guide/**', 'web/src/guide/**', 'web/scripts/guide-export.mjs', '.github/workflows/user-guide.yml']
  pull_request:
    paths: ['docs/user-guide/**', 'web/src/guide/**', 'web/scripts/guide-export.mjs']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: install Chromium for printing
        run: npx playwright-core install --with-deps chromium
        working-directory: web
      - name: build the guide (PDF and Markdown, English and Swedish)
        run: make guide GUIDE_OUT=dist/user-guide
      - name: bundle the Markdown with its images
        run: cd dist && zip -qr user-guide/qtestframe-user-guide-markdown.zip user-guide/*.md user-guide/images
      - uses: actions/upload-artifact@v4
        with:
          name: user-guide
          path: dist/user-guide/*
      - name: publish on the user-guide release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rom'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view user-guide >/dev/null 2>&1 || gh release create user-guide --title "User guide (latest)" --notes "The Qtestframe user guide as PDF and single-file Markdown, rebuilt on every change to the guide on the main branch." --prerelease --target "$GITHUB_SHA"
          gh release upload user-guide --clobber dist/user-guide/qtestframe-user-guide-*.pdf dist/user-guide/qtestframe-user-guide-*.md dist/user-guide/qtestframe-user-guide-markdown.zip
