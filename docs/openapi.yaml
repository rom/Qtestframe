    get:
      tags:
      - Dashboards
      summary: Get dashboard
      operationId: getProjectsByPidDashboardsByDid
      description: |-
        → Dashboard (also the export: the client adds format and version). Another user's personal dashboard: 404.

        **Permission:** `project.read`.
      x-permission: project.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Dashboards
      summary: Change dashboard
      operationId: putProjectsByPidDashboardsByDid
      description: |-
        `{name?, widgets?}` → Dashboard. Personal: its owner; shared: `project.update`. Changing a built-in layout stores the shared dashboard that replaces it.

        **Permission:** `project.read`.
      x-permission: project.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
