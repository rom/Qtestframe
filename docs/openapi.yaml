      description: |-
        `{requirement_id, lang: en|sv}` → `{meta, result: {requirement_id, requirement_key, tests: [{title, description, preconditions, test_data, expected_result, steps: [{action, data, expected}], criteria: [numbers], criterion_ids: [ids]}]}}`. Sends the requirement (title, description, acceptance criteria) to the configured service and returns drafts; **nothing is saved** — the client creates the tests the user accepts (`POST /projects/{pid}/tests`, status `draft`) and links them (`POST /projects/{pid}/links`). See *AI requests* below for streaming, errors and the audit entry.

        **AI requests** (all feature endpoints): with `Accept: text/event-stream` the answer is streamed as server-sent events `start` `{feature, provider, model}`, `progress` `{chars}` while the service writes, then `result` (the JSON body) or `error` `{status, code, error, meta}`; closing the connection cancels the request. Otherwise the JSON body. `meta` is `{feature, prompt_version, provider, model, usage: {input_tokens, output_tokens}, retried, duration_ms, cost}`. Errors: `409 ai_unavailable` (not available here; see `GET /projects/{pid}/ai`), `429 rate_limited`, `422 ai_refused`, `502 ai_service`, `502 ai_invalid_answer` (the answer did not match the schema, also after one retry), `504 ai_timeout`. Each request is audited as `ai.request` with feature, item ids, model and tokens, never the content.

