components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qtf_session
      description: Browser session from `POST /api/v1/auth/login` or single sign-on (HttpOnly, Secure, SameSite=Lax).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 'Required with the session cookie on every method other than GET/HEAD: the `csrf_token` of `GET /api/v1/auth/me` or the login
        response. An `Origin` header, if sent, must match the host or `server.base_url`.'
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: qtf_<token>
      description: 'API token (`Authorization: Bearer qtf_…`) from `POST /api/v1/tokens`; bound to one tenant, no CSRF header needed.'
  parameters:
    reportLang:
      name: lang
      in: query
      required: false
      description: language of the report's own texts (en, sv; also e.g. sv-SE). Used when the body has no supported `lang`; then the user's preferred language, the Accept-Language header and English follow.
      schema:
        type: string
        example: sv
    catalogLang:
      name: lang
      in: query
      required: false
      description: language of the texts (en, sv; default en)
      schema:
        type: string
        enum:
        - en
        - sv
    catalogArea:
      name: area
      in: query
      required: false
      description: area ids, comma-separated
      schema:
        type: string
    catalogGroup:
      name: group
      in: query
      required: false
      description: group ids, comma-separated
      schema:
        type: string
    catalogQ:
      name: q
      in: query
      required: false
      description: free-text search; all words must occur
      schema:
        type: string
    catalogPriority:
      name: priority
      in: query
      required: false
      description: priorities, comma-separated
      schema:
        type: string
    catalogTag:
      name: tag
      in: query
      required: false
      description: tags, comma-separated (any of them)
      schema:
        type: string
    catalogCatalogue:
      name: catalogue
      in: query
      required: false
      description: catalogue types (software, hardware, …), comma-separated
      schema:
        type: string
    catalogSource:
      name: source
      in: query
      required: false
      description: reference source ids (GET /catalog/sources), comma-separated (any of them)
      schema:
        type: string
    catalogProject:
      name: project_id
      in: query
      required: false
      description: mark the items the project already has (`in_project`)
      schema:
        type: string
    catalogNotInProject:
      name: not_in_project
      in: query
      required: false
      description: with project_id, leave out the items the project already has
      schema:
        type: boolean
    pid:
      name: pid
      in: path
      required: true
      description: project id
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      description: item id
      schema:
        type: string
    q:
      name: q
      in: query
      required: false
      description: filter expression (see the query language in docs/api.md)
      schema:
        type: string
    DryRunImpact:
      name: dry_run
      in: query
      required: false
      description: '`impact`: run the change in a transaction, answer `{dry_run: "impact", status, impact}` with the combined change impact of the items whose substance or status it changes (same shape as `GET /requirements/{id}/impact`, with `roots`) and roll everything back — nothing is saved. (The boolean `dry_run` of the requirement import keeps its meaning.)'
      schema:
        type: string
        enum: [impact]
    ImpactChoice:
      name: impact
      in: query
      required: false
      description: 'what saving does with the change impact: `suspect` (default) marks what the project''s rules mark suspect and notifies the owners of the items only recommended for review; `notify` marks nothing and notifies the owners of every affected item; `skip` marks nothing and notifies nobody (results recorded before still go stale, documents still become outdated). A status change only recommends reviews: its owners are notified with `notify` only.'
      schema:
        type: string
        enum: [suspect, notify, skip]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: the version the change is based on, from the item's ETag (e.g. `"3"`); a newer saved version answers 412 `stale`
      schema:
        type: string
  headers:
    ETag:
      description: the item's version, e.g. `"3"`; send it back as If-Match
      schema:
        type: string
  responses:
    Stale:
      description: Someone saved a newer version (code `stale`); the body has the saved item
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaleError'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in (code `unauthorized`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission or CSRF check failed (code `forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such item in the current tenant (code `not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AIStatus:
      type: object
      description: Availability of the optional AI assistance.
      properties:
        available:
          type: boolean
        reason:
          type: string
          enum: [off, not_configured, organisation, project]
        provider:
