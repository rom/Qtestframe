      operationId: getProjectsByPidAccess
      description: |-
        The project's access mode (`organisation`: every member of the organisation; `restricted`: project members and organisation administrators only), the number of project members, the caller's access (`my_access`: source, project role, effective permissions, `can_share`) and the roles the caller may give (`grantable_roles`).

