  /api/v1/my-work:
    get:
      tags:
      - My work
      summary: List my work
      operationId: getMyWork
      description: |-
        The caller's work list across the projects they can see: requirements, tests and risks they own in a non-final status, defects and test executions assigned to them, review requests waiting for them, review requests they asked for that are pending or came back with changes requested, their requirements and tests in review, waivers and risk acceptances waiting for their signature, risk reviews they own that are due, and owned items that became suspect, have stale results or are blocked. Rows of the same item are merged; `reasons` say why it is there (`owner`, `assigned`, `review_requested`, `review_returned`, `awaiting_review`, `in_review`, `waiver_approval`, `risk_acceptance`, `change_approval`, `change_returned`, `change_approved`, `risk_review`, `overdue`, `suspect`, `stale`, `blocked`). Overdue rows come first, then by due date, then the most recently changed. `?project=<id or key>` limits the list to one project, `?source=<names>` (comma-separated) to some sources, `?reason=<reason>` to the rows with that reason. → `{"items":[WorkItem],"total":n,"summary":{"count","waiting","overdue","by_reason","by_kind","by_project"},"sources":[...]}`

        **Permission:** any authenticated user; the handler checks: signed in, and the permissions of each row's project.
      x-permission: authenticated
      parameters:
      - name: project
        in: query
        required: false
        schema:
          type: string
        description: Project id or key.
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated source names (owned, defects, executions, reviews, waivers, risk_acceptance, change_requests, ...).
      - name: reason
        in: query
        required: false
        schema:
          type: string
        description: Keep only the rows with this reason.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkItem'
                  total:
                    type: integer
                  summary:
                    $ref: '#/components/schemas/WorkSummary'
                  sources:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
