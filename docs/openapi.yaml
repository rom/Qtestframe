      summary: Create dashboard
      operationId: postProjectsByPidDashboards
      description: |-
        `{name, shared?, widgets?, source_id?}` → Dashboard: a personal dashboard, or a shared one (needs `project.update`); `source_id` copies a dashboard the caller sees. Also takes an export (`{format: qtestframe-dashboard, version: 1, name, widgets}`). Widgets: x 0–11, w 1–12 within the columns, h 1–24, at most 60, known types (see `GET /dashboards/widgets`); at most 30 shared dashboards per project and 30 personal ones per user and project.

        **Permission:** `project.read`.
      x-permission: project.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
