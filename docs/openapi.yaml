  /api/v1/auth/mfa/challenge:
    get:
      tags:
      - Auth
      summary: Pending second factor
      operationId: getAuthMfaChallenge
      description: |-
        Describes the sign-in that waits for its second factor (the `qtf_mfa` cookie set by `POST /auth/login` or an OIDC callback): `{"mfa_required": true, "methods": ["totp","recovery_code"], "remember_days", "expires_at"}`. 401 `mfa_expired` when none is pending.

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - Auth
      summary: Give the second factor
      operationId: postAuthMfaVerify
      description: |-
        `{"code", "remember"?}`: a 6-digit TOTP code (each code is accepted once) or a recovery code (single use). On success the session starts and the answer is `/auth/me`; with `remember` and a server policy with `remember_days` > 0 the device is remembered (`qtf_mfa_device` cookie). Wrong codes: 401 `mfa_invalid`, recorded as failed sign-ins (method `mfa`); after 5 wrong codes the pending sign-in is dropped (401 `mfa_expired`); attempts share the sign-in rate limit (429).

        **Permission:** none (public).
      x-permission: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
