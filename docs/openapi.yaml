# OpenAPI 3.1 description of the Qtestframe REST API, served at
# GET /api/v1/openapi.json (and .yaml). Keep it in sync with the routes:
# internal/api/openapi_test.go fails when a registered route is missing here,
# a path here does not exist, or an x-permission differs from the router.
openapi: 3.1.0
info:
  title: Qtestframe REST API
  version: v1
  summary: Requirements and test management
  description: |
    The REST API of Qtestframe. The reference with all details and examples is
    `docs/api.md` in the source code; this
    description lists every route with its parameters, the main request and
    response bodies and the permission it needs.

    **Authentication.** Browser clients use the `qtf_session` cookie and send
    the `X-CSRF-Token` header on every method other than GET/HEAD. Other
    clients send an API token: `Authorization: Bearer qtf_…`.

    **Permissions.** `x-permission` names the permissions the router checks
    before the handler runs (all of them are needed; `none` = public,
    `authenticated` = any signed-in user). Several handlers check more, for
    example the write permission of an item's kind; the operation description
    says so.

    **Errors.** Non-2xx responses have the body `{"error": "…", "code": "…"}`
    (see `Error`). Lists are `{"items": [...], "total": n}`. IDs are UUID
    strings and times RFC 3339.

    Model schemas follow the Go types in `internal/model` (JSON tags are
    authoritative); derived fields are filled in by the server and ignored in
    requests.
servers:
- url: /
  description: The Qtestframe server that serves this description
security:
- sessionCookie: []
  csrfToken: []
- bearerToken: []
tags:
- name: Auth
  description: Sign-in, sessions and the current user
- name: Administration
  description: Tenants, users, roles, settings, audit log, meta data, backup
- name: Members
  description: Members of the current tenant
- name: Tokens
  description: API tokens
- name: Projects
  description: Projects and dashboards
- name: Dashboards
  description: Customisable dashboards, the home dashboard and widget data
- name: Folders and categories
  description: Folder trees and category values
- name: Requirements
  description: Requirements, history, comments, analysis
- name: Relations
  description: Relations between requirements
- name: Tests
  description: Test cases, dependencies and readiness
- name: Traceability
  description: Requirement–test links and the traceability matrix
- name: Verification
  description: Criterion-level verification, verification records, hierarchy roll-up and system elements
- name: Variants
  description: Product variants, markets and customer configurations; applicability and coverage per variant
- name: Item links
  description: Links between requirements, tests, runs, files and URLs
- name: Runs and executions
  description: Test runs, executions and result imports
- name: Code and builds
  description: Commits, merge and pull requests, CI builds, webhooks and the regression selection
- name: CI/CD
  description: Quality gate, test selection, pipeline templates and commit statuses posted to GitLab
- name: Baselines
  description: Baselines and electronic sign-offs
- name: Releases
  description: Releases and exit criteria
- name: Cycles
  description: Test cycles, their plan, progress and recurring schedules
- name: Defects
  description: Defects and the issue tracker (Jira, GitHub or GitLab)
- name: Requirement issues
  description: Issues created from requirements in GitLab, GitHub or Jira
- name: Risks
  description: Risks
- name: Waivers
  description: Waivers and deviations with their electronically signed approvals
- name: Change requests
  description: Formal change control of requirements and tests, decided by the change control board with electronic signatures
- name: Reviews
  description: Review requests
- name: Discussions
  description: Threaded comments on requirements, tests, defects, risks, runs and review requests
- name: My work
  description: The personal work list across projects
- name: Notifications and webhooks
  description: In-app notifications, webhooks and chat channels
- name: Live updates
  description: Server-Sent Events stream of changes made by others, and presence (who is viewing or editing an item)
- name: Files
  description: Files, attachments, documents, avatars
- name: Reports and export
  description: Reports, export (CSV, XLSX, PDF, DOCX, Markdown, ReqIF) and search
- name: Import
  description: Requirement import
- name: OSLC
  description: Read-only OSLC RM 2.0 / QM 2.0 provider (RDF/XML, Turtle, JSON-LD)
- name: Catalogue
  description: Built-in catalogue of standard requirements and tests, and copying them into a project
- name: Operations
  description: Health, readiness and this description
- name: Exploratory testing
  description: Session-based exploratory testing (charters, timer, notes, debriefs, metrics)
- name: AI assistance
  description: Optional suggestions from a language model service (drafts of tests, improved requirements, run summaries, framework mappings, acceptance criteria); nothing is saved without the user
- name: Environments
  description: Test environments, their components, health checks and bookings
- name: Test data
  description: Shared test data sets, their links, usage and refresh requests
paths:
  /api/v1/change-requests/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Change requests
      summary: Get a change request
      operationId: getChangeRequestsById
      description: |-
        The change request with its items (`proposed` and `current` values of the proposed fields, `base_version`, `current_version`, `outdated`, `applied_version`), the impact snapshot of the assessment (`impact`, a ChangeImpact), signatures (`approvals`, `valid` while the signed content is unchanged), timeline (`events`) and `content_hash`.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Change requests
      summary: Change a draft change request
      operationId: patchChangeRequestsById
      description: |-
        The fields of the create request (and `items` to add or replace proposals); only a draft can be changed (409: withdraw it first).

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Change requests
      summary: Delete a change request
      operationId: deleteChangeRequestsById
      description: |-
        204; only a draft or rejected change request (409 otherwise).

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/apply:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Apply an approved change request
      operationId: postChangeRequestsByIdApply
      description: |-
        `{impact?: suspect|notify|skip}` (default the change request's impact_action): approved → implemented. The proposed values are saved atomically through the normal PATCH of each item (validation, permissions, revisions, history, audit) and the change impact is applied once; any failure saves nothing (the answer names the item). 409 `outdated` when an item changed since it was proposed.

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/assess:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Assess a change request
      operationId: postChangeRequestsByIdAssess
      description: |-
        `{notes?, effort?, review?}`: submitted or assessed → assessed; the impact is computed again and stored with the assessor's notes and effort estimate. `review: true` sends it to the board at once.

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/close:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Close a change request
      operationId: postChangeRequestsByIdClose
      description: |-
        `{create_baseline?, baseline_name?, comment?}`: verified, rejected or deferred → closed; a verified change request can create a baseline of the project (default the change request's `baseline_on_close`).

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/decision:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Decide a change request (electronic signature)
      operationId: postChangeRequestsByIdDecision
      description: |-
        `{"decision": "approve"|"reject"|"defer", "comment", "password"}`: an electronic signature of a board member over the content hash, with the project's signature meaning, given in the browser with the signer's password or a single sign-on less than 15 minutes old. Rejecting and deferring need a comment; the requester cannot decide their own change request; only board members (listed users, holders of listed roles; none listed: anyone with `change.approve`). Any rejection rejects, any deferral defers, approvals that meet the quorum (all, any or N) approve. 409 when an item changed since it was proposed.

        **Permission:** `change.approve`.
      x-permission: change.approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/impact:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Change requests
      summary: Change impact of a change request now
      operationId: getChangeRequestsByIdImpact
      description: |-
        The transitive change impact of the proposed changes on the current graph (ChangeImpact with roots, items per kind, depth and path); the stored `impact` is the snapshot of the assessment.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/items:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Add items to a change request
      operationId: postChangeRequestsByIdItems
      description: |-
        `{items: [{entity_type, entity_id, proposed, base_version?}]}` adds items to a draft or replaces the proposals of items it has; the base version is the item's current version unless given.

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/items/{item}:
    parameters:
    - $ref: '#/components/parameters/id'
    - name: item
      in: path
      required: true
      schema:
        type: string
      description: the item's id in the change request
    delete:
      tags:
      - Change requests
      summary: Remove an item from a change request
      operationId: deleteChangeRequestsByIdItemsByItem
      description: |-
        Removes an item (its id) from a draft change request.

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/review:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Send a change request to the board
      operationId: postChangeRequestsByIdReview
      description: |-
        assessed → in_review; the board members (who hold `change.approve`) are notified. Event `change_request.review`.

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/submit:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Submit a change request
      operationId: postChangeRequestsByIdSubmit
      description: |-
        draft → submitted (400 without items or reason); the impact snapshot is computed and stored. Event `change_request.submitted`.

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/verify:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Verify an implemented change request
      operationId: postChangeRequestsByIdVerify
      description: |-
        `{comment?}`: implemented → verified.

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/change-requests/{id}/withdraw:
    parameters:
    - $ref: '#/components/parameters/id'
    post:
      tags:
      - Change requests
      summary: Withdraw a change request
      operationId: postChangeRequestsByIdWithdraw
      description: |-
        `{comment?}`: submitted, assessed, in_review, rejected or deferred → draft, to change it (signatures of the earlier content stop counting).

        **Permission:** `change.create`.
      x-permission: change.create
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/change-control:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Change requests
      summary: Get the change control settings
      operationId: getProjectsByPidChangeControl
      description: |-
        The project's change control: `{settings: {mode: off|warn|enforce, protected_statuses, lock_signed_baselines, board: {users, roles, quorum: all|any|N}, signature_meaning, baseline_on_close, updated_by, updated_at}, effective_statuses, default_statuses, modes, default_signature_meaning}`. Without settings change control is off.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Change requests
      summary: Set the change control settings
      operationId: putProjectsByPidChangeControl
      description: |-
        `{mode, protected_statuses, lock_signed_baselines, board: {users: [e-mail], roles: [role], quorum}, signature_meaning, baseline_on_close}`. With `enforce`, requirements and tests whose status is protected (empty: approved, implemented, verified, ready) or that are in a signed baseline (`lock_signed_baselines`) cannot be changed directly: PATCH, bulk edit, batch, exchange, restore and delete answer 409 `change_control` `{error, code, hint, kind, id, key, reasons, open_change_requests}`. An emergency override `?change_override=<justification>` (at least 10 characters, `change.approve`) saves the change and is audited (`change_control.override`). With `warn` the change is saved and the answer has the header `X-Change-Control: warn` (and `X-Change-Control-Reason`).

        **Permission:** `project.update`.
      x-permission: project.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/change-requests:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Change requests
      summary: List change requests
      operationId: getProjectsByPidChangeRequests
      description: |-
        The change requests of the project, newest first, with their items (key, title, base and current version, `outdated`), signatures and linked defects and risks. Filters: `status`, `category`, `open=true` (not rejected, implemented, verified or closed), `item=<kind>:<id>` (those that change the item).

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Change requests
      summary: Create a change request
      operationId: postProjectsByPidChangeRequests
      description: |-
        `{title, reason, category: correction|enhancement|regulatory|defect_driven|risk_driven|other, priority, impact_action: suspect|notify|skip, links: {defect_ids, risk_ids, issues}, baseline_on_close, items: [{entity_type: requirement|test, entity_id, proposed: {field: value}, base_version?}], submit?}` → 201 the change request (key PROJ-CR-n, status draft; submitted with `submit: true`). `proposed` holds new field values as in a PATCH (requirements: title, description, obligation, type, priority, status, source, rationale, owner, tags, custom_fields; tests: title, description, preconditions, expected_result, execution_type, priority, status, estimated_minutes, owner, tags, custom_fields).

        **Permission:** `change.create`.
      x-permission: change.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/change-requests/open-items:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Change requests
      summary: Items with open change requests
      operationId: getProjectsByPidChangeRequestsOpenItems
      description: |-
        `{items: {"<kind>:<id>": ["PROJ-CR-1", …]}}`: the requirements and tests of the project with open change requests, for badges.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/requirements/{id}/change-control:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Change requests
      summary: Change control of a requirement
      operationId: getRequirementsByIdChangeControl
      description: |-
        `{key, mode, protected, blocked, reasons, open_change_requests: [{id, key, title, status}], can_propose, can_override}`.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tests/{id}/change-control:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Change requests
      summary: Change control of a test
      operationId: getTestsByIdChangeControl
      description: |-
        `{key, mode, protected, blocked, reasons, open_change_requests: [{id, key, title, status}], can_propose, can_override}`.

        **Permission:** `test.read`.
      x-permission: test.read
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /healthz:
    get:
      tags:
      - Operations
      summary: Health
      operationId: getHealthz
      description: '**Permission:** none (public).'
      x-permission: none
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      tags:
      - Operations
