  /api/v1/projects/{pid}/export:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Reports and export
      summary: Export
      operationId: getProjectsByPidExport
      description: |-
        Downloads project data. `format` `xlsx`, `csv`, `pdf`, `docx` (aliases `excel`, `word`) export the chosen `aspects`; `reqif` and `reqifz` export the requirements as ReqIF 1.2 (aspects do not apply): `.reqif` is the XML document, `.reqifz` a ZIP with the document and the requirements' attachments below `files/<key>/`. `q` is applied to requirements if it is a valid requirement query and to tests if it is a valid test query. The response has `Content-Disposition: attachment; filename="<KEY>-<YYYYMMDD-HHMMSS>.<ext>"`.

        **Permission:** `export`.
      x-permission: export
      parameters:
      - name: format
        in: query
        required: true
        description: file format
        schema:
          type: string
          enum:
          - xlsx
          - csv
          - pdf
          - docx
          - excel
          - word
          - reqif
          - reqifz
      - name: aspects
        in: query
        required: false
        description: comma-separated subset of requirements, criteria, tests, traceability, runs (default all; not for ReqIF)
        schema:
          type: string
      - $ref: '#/components/parameters/q'
      responses:
        '200':
          description: 'The export file: `application/zip` for several CSV aspects and for `reqifz`, `application/xml` (a ReqIF 1.2 document)
            for `reqif`'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
