      tags:
      - Projects
      summary: Save project
      operationId: getProjectsByPidArchive
      description: |-
        Downloads the whole project as a project archive (`application/zip`, `<key>-project-<time>.zip`): `manifest.json` (`kind: qtestframe-project`, `format_version`, `schema_version`, `app_version`, `created_at`, `driver`, `project {id, key, name}`, `tables {table: rows}`, `files`, `file_bytes`), `tables/<table>.jsonl` with every row of the project and `files/<id>` with the content of each file. Webhook secrets, the tracker token, accounts, memberships, sessions, API tokens, notifications, e-mail subscriptions, the audit log and the trash are not included. Audited as `project.save`.

        **Permission:** `project.update`, `export`.
      x-permission: project.update, export
      responses:
        '200':
          description: The project archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
