    post:
      tags:
      - Administration
      summary: Verify a backup file
      operationId: postAdminBackupsByIdVerify
      description: |-
        Opens the file of a backup run and checks it: its SHA-256 against the one recorded when it was written, the decryption (with `backup.passphrase`), the ZIP structure and checksums, the manifest and the row counts → `{ok, error?, sha256, sha256_ok, encrypted, manifest?}`. The outcome is recorded with the run (`verified_at`, `verify_error`) and audited as `admin.backup.verify`.

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
