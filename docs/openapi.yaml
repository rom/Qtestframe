      description: |-
        The waivers and deviations of the project, newest first, with their requirements, approvals (`valid`: the signed content is unchanged), `active` (approved and not expired today), `release_name` and `risk_key`. Filters: `status` (draft, requested, approved, rejected, expired, revoked), `type` (waiver, deviation), `release_id` (a release id, or `project` for project-wide ones), `requirement_id`, `active=true`.

        **Permission:** `requirement.read`.
      x-permission: requirement.read
      parameters:
      - name: status
        in: query
        required: false
        description: "draft | requested | approved | rejected | expired | revoked"
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: "waiver | deviation"
        schema:
          type: string
      - name: release_id
        in: query
        required: false
        description: "a release id, or 'project' for project-wide waivers"
        schema:
          type: string
      - name: requirement_id
        in: query
        required: false
        description: "only waivers covering this requirement"
        schema:
          type: string
      - name: active
        in: query
        required: false
        description: "true: only approved waivers that have not expired"
        schema:
          type: string
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
