      required: true
      schema:
        type: string
    get:
      tags:
      - Administration
      summary: Download a backup file
      operationId: getAdminBackupsByIdDownload
      description: |-
        The file of a backup run from the backup directory (`application/zip`, or `application/octet-stream` when encrypted). 404 when the run has no file or it is missing, 410 when the retention rules deleted it. Audited as `admin.backup.download`.

        **Permission:** any authenticated user; the handler checks: super admin.
