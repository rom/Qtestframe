        **Permission:** `project.read`.
      x-permission: project.read
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qtf_session
      description: Browser session from `POST /api/v1/auth/login` or single sign-on (HttpOnly, Secure, SameSite=Lax).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 'Required with the session cookie on every method other than GET/HEAD: the `csrf_token` of `GET /api/v1/auth/me` or the login
        response. An `Origin` header, if sent, must match the host or `server.base_url`.'
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: qtf_<token>
      description: 'API token (`Authorization: Bearer qtf_…`) from `POST /api/v1/tokens`; bound to one tenant, no CSRF header needed.'
  parameters:
    reportLang:
      name: lang
      in: query
      required: false
      description: language of the report's own texts (en, sv; also e.g. sv-SE). Used when the body has no supported `lang`; then the user's preferred language, the Accept-Language header and English follow.
      schema:
        type: string
        example: sv
    catalogLang:
      name: lang
      in: query
      required: false
      description: language of the texts (en, sv; default en)
      schema:
        type: string
        enum:
        - en
        - sv
    catalogArea:
      name: area
      in: query
      required: false
      description: area ids, comma-separated
      schema:
        type: string
    catalogGroup:
      name: group
      in: query
      required: false
      description: group ids, comma-separated
      schema:
        type: string
    catalogQ:
      name: q
      in: query
      required: false
      description: free-text search; all words must occur
      schema:
        type: string
    catalogPriority:
      name: priority
      in: query
      required: false
      description: priorities, comma-separated
      schema:
        type: string
    catalogTag:
      name: tag
      in: query
      required: false
      description: tags, comma-separated (any of them)
      schema:
        type: string
    catalogProject:
      name: project_id
      in: query
      required: false
      description: mark the items the project already has (`in_project`)
      schema:
        type: string
    catalogNotInProject:
      name: not_in_project
      in: query
      required: false
      description: with project_id, leave out the items the project already has
      schema:
        type: boolean
    pid:
      name: pid
      in: path
      required: true
      description: project id
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      description: item id
      schema:
        type: string
    q:
      name: q
      in: query
      required: false
      description: filter expression (see the query language in docs/api.md)
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: the version the change is based on, from the item's ETag (e.g. `"3"`); a newer saved version answers 412 `stale`
      schema:
        type: string
  headers:
    ETag:
      description: the item's version, e.g. `"3"`; send it back as If-Match
      schema:
        type: string
  responses:
    Stale:
      description: Someone saved a newer version (code `stale`); the body has the saved item
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaleError'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in (code `unauthorized`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission or CSRF check failed (code `forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such item in the current tenant (code `not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CatalogRequirement:
      type: object
      properties:
        id:
          type: string
        area:
          type: string
        group:
          type: string
        type:
          type: string
        obligation:
          type: string
        priority:
          type: string
        tags:
          type: array
          items:
            type: string
        refs:
          type: array
          description: the standards it is based on (cited, not copied)
          items:
            type: string
        tests:
          type: array
          description: catalogue tests that verify it
          items:
            type: string
        title:
          type: string
        description:
          type: string
        in_project:
          type: array
          items:
            type: object
    CatalogTest:
      type: object
      properties:
        id:
          type: string
        area:
          type: string
        group:
          type: string
        priority:
          type: string
        execution:
          type: string
        tags:
          type: array
          items:
            type: string
        refs:
          type: array
          items:
            type: string
        requirements:
          type: array
          description: catalogue requirements it verifies
          items:
            type: string
        steps:
          type: integer
        title:
          type: string
        description:
          type: string
        in_project:
          type: array
          items:
            type: object
    CatalogImport:
      type: object
      properties:
