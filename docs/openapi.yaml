# OpenAPI 3.1 description of the Qtestframe REST API, served at
# GET /api/v1/openapi.json (and .yaml). Keep it in sync with the routes:
# internal/api/openapi_test.go fails when a registered route is missing here,
# a path here does not exist, or an x-permission differs from the router.
openapi: 3.1.0
info:
  title: Qtestframe REST API
  version: v1
  summary: Requirements and test management
  description: |
    The REST API of Qtestframe. The reference with all details and examples is
    `docs/api.md` in the source code; this
    description lists every route with its parameters, the main request and
    response bodies and the permission it needs.

    **Authentication.** Browser clients use the `qtf_session` cookie and send
    the `X-CSRF-Token` header on every method other than GET/HEAD. Other
    clients send an API token: `Authorization: Bearer qtf_…`.

    **Permissions.** `x-permission` names the permissions the router checks
    before the handler runs (all of them are needed; `none` = public,
    `authenticated` = any signed-in user). Several handlers check more, for
    example the write permission of an item's kind; the operation description
    says so.

    **Errors.** Non-2xx responses have the body `{"error": "…", "code": "…"}`
    (see `Error`). Lists are `{"items": [...], "total": n}`. IDs are UUID
    strings and times RFC 3339.

    Model schemas follow the Go types in `internal/model` (JSON tags are
    authoritative); derived fields are filled in by the server and ignored in
    requests.
servers:
- url: /
  description: The Qtestframe server that serves this description
security:
- sessionCookie: []
  csrfToken: []
- bearerToken: []
tags:
- name: Auth
  description: Sign-in, sessions and the current user
- name: Administration
  description: Tenants, users, roles, settings, audit log, meta data, backup
- name: Members
  description: Members of the current tenant
- name: Tokens
  description: API tokens
- name: Projects
  description: Projects and dashboards
- name: Folders and categories
  description: Folder trees and category values
- name: Requirements
  description: Requirements, history, comments, analysis
- name: Relations
  description: Relations between requirements
- name: Tests
  description: Test cases, dependencies and readiness
- name: Traceability
  description: Requirement–test links and the traceability matrix
- name: Item links
  description: Links between requirements, tests, runs, files and URLs
- name: Runs and executions
  description: Test runs, executions and result imports
- name: Baselines
  description: Baselines and electronic sign-offs
- name: Releases
  description: Releases and exit criteria
- name: Defects
  description: Defects and the defect tracker
- name: Risks
  description: Risks
- name: Reviews
  description: Review requests
- name: Notifications and webhooks
  description: In-app notifications and webhooks
- name: Files
  description: Files, attachments, documents, avatars
- name: Reports and export
  description: Reports, export (CSV, XLSX, PDF, DOCX, ReqIF) and search
- name: Import
  description: Requirement import
- name: Catalogue
  description: Built-in catalogue of standard requirements and tests, and copying them into a project
- name: Operations
  description: Health, readiness and this description
paths:
  /healthz:
    get:
      tags:
      - Operations
      summary: Health
      operationId: getHealthz
      description: '**Permission:** none (public).'
      x-permission: none
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      tags:
      - Operations
      summary: Ready
      operationId: getReadyz
      description: '**Permission:** none (public).'
      x-permission: none
      security: []
      responses:
        '200':
          description: The database is reachable (503 `unavailable` otherwise)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/openapi.json:
    get:
      tags:
      - Operations
      summary: Open api
      operationId: getOpenapiJson
      description: '**Permission:** none (public).'
      x-permission: none
      security: []
      responses:
        '200':
          description: This description as JSON
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/openapi.yaml:
    get:
      tags:
      - Operations
      summary: Open api
      operationId: getOpenapiYaml
      description: '**Permission:** none (public).'
      x-permission: none
      security: []
      responses:
        '200':
          description: This description as YAML
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/providers:
    get:
      tags:
      - Auth
      summary: Providers
      operationId: getAuthProviders
      description: |-
        public — `{"local":true,"oidc":[{"name","display_name","login_url"}],"saml":[{"name","display_name","login_url"}]}`

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: postAuthLogin
      description: |-
        `{"email","password","tenant"?}` (tenant = slug); 401 on bad credentials, 429 after 10 attempts in 5 min per IP + e-mail, 403 if local login is disabled — `Me` + `qtf_session` cookie

        **Permission:** none (public).
      x-permission: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; sets the qtf_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: postAuthLogout
      description: |-
        deletes the session — 204

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        '204':
          description: Signed out
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/oidc/{name}/login:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
      description: provider or role name
    get:
      tags:
      - Auth
      summary: OIDC login
      operationId: getAuthOidcByNameLogin
      description: |-
        browser redirect — 302

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        '302':
          description: Redirect
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/oidc/{name}/callback:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
      description: provider or role name
    get:
      tags:
      - Auth
      summary: OIDC callback
      operationId: getAuthOidcByNameCallback
      description: |-
        browser redirect — 302 → `/`

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/saml/{name}/metadata:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
      description: provider or role name
    get:
      tags:
      - Auth
      summary: SAML metadata
      operationId: getAuthSamlByNameMetadata
      description: |-
        SP metadata XML — XML

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/saml/{name}/login:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
      description: provider or role name
    get:
      tags:
      - Auth
      summary: SAML login
      operationId: getAuthSamlByNameLogin
      description: |-
        browser redirect — 302

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        '302':
          description: Redirect
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/saml/{name}/acs:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
      description: provider or role name
    post:
      tags:
      - Auth
      summary: SAMLACS
      operationId: postAuthSamlByNameAcs
      description: |-
        IdP POST binding — 302 → `/`

        **Permission:** none (public).
      x-permission: none
      security: []
      responses:
        2XX:
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      operationId: getAuthMe
      description: |-
        `Me`

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      responses:
        '200':
          description: The current user, tenant, role, permissions and the CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Auth
      summary: Update me
      operationId: patchAuthMe
      description: |-
        `{"display_name"?, "preferences"?}` → `Me`. `preferences` keys present in the body replace the stored ones; `null` resets a key. Invalid values → 400

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                preferences:
                  $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/switch-tenant:
    post:
      tags:
      - Auth
      summary: Switch tenant
      operationId: postAuthSwitchTenant
      description: |-
        `{"tenant_id"}` — `Me`

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/password:
    post:
      tags:
      - Auth
      summary: Change password
      operationId: postAuthPassword
      description: |-
        `{"current_password","new_password"}` (local accounts only) — 204

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: Changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions:
    get:
      tags:
      - Auth
      summary: List sessions
      operationId: getAuthSessions
      description: |-
        own active sessions: `[{id, created_at, expires_at, last_seen, ip, user_agent, tenant_id, current}]` (newest first)

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    delete:
      tags:
      - Auth
      summary: Delete session
      operationId: deleteAuthSessionsById
      description: |-
        revoke one own session (revoking `current` logs out)

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/revoke-others:
    post:
      tags:
      - Auth
      summary: Revoke other sessions
      operationId: postAuthSessionsRevokeOthers
      description: |-
        revoke all own sessions except the current one → `{"revoked": n}`

        **Permission:** any authenticated user; the handler checks: only the caller's own account and sessions.
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/meta:
    get:
      tags:
      - Administration
      summary: Meta
      operationId: getMeta
      description: |-
        enumerations: `{"obligations","requirement_statuses","requirement_types","priorities","test_statuses","script_languages","evaluation_methods","run_statuses","result_statuses","roles"}` plus `"analysis_languages"` (language packs of `/reqlang/analyze`), `"runner_enabled"` and `"version"`

        **Permission:** any authenticated user; the handler checks: any.
      x-permission: authenticated
      responses:
        '200':
          description: Enumerations, version and server features
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/rbac:
    get:
      tags:
      - Administration
      summary: RBAC
      operationId: getRbac
      description: |-
        `{"roles":[...],"matrix":{role:[perm]},"permissions":[...]}` – the effective matrix of the current tenant

        **Permission:** any authenticated user; the handler checks: any.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tenants:
    get:
      tags:
      - Administration
      summary: List tenants
      operationId: getTenants
      description: |-
        list

        **Permission:** any authenticated user; the handler checks: super admin (all) / member (own).
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Administration
      summary: Create tenant
      operationId: postTenants
      description: |-
        `{"slug","name"}`

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tenants/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    patch:
      tags:
      - Administration
      summary: Update tenant
      operationId: patchTenantsById
      description: |-
        `{"name"}`

        **Permission:** any authenticated user; the handler checks: super admin or tenant.manage.
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Administration
      summary: Delete tenant
      operationId: deleteTenantsById
      description: '**Permission:** any authenticated user; the handler checks: super admin.'
      x-permission: authenticated
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      tags:
      - Administration
      summary: List users
      operationId: getUsers
      description: |-
        list all users

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Administration
      summary: Create user
      operationId: postUsers
      description: |-
        `{"email","display_name","password","super_admin"}`

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/users/{id}:
    parameters:
    - $ref: '#/components/parameters/id'
    patch:
      tags:
      - Administration
      summary: Update user
      operationId: patchUsersById
      description: |-
        `{"display_name","disabled","super_admin","password"}`; disabling or setting a password ends the user's sessions; you cannot demote or disable yourself (409)

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/members:
    get:
      tags:
      - Members
      summary: List members
      operationId: getMembers
      description: |-
        members of current tenant

        **Permission:** `member.read`.
      x-permission: member.read
      responses:
        '200':
          description: Members of the current tenant
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Members
      summary: Add member
      operationId: postMembers
      description: |-
        `{"email","role","display_name"?,"password"?}` – creates the local user if it does not exist

        **Permission:** `member.manage`.
      x-permission: member.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/members/bulk:
    post:
      tags:
      - Members
      summary: Bulk members
      operationId: postMembersBulk
      description: |-
        `{"user_ids":[...], "action": "role"|"remove", "role"?}` (max 1000, all or nothing) → `{"changed":[{user_id, email, role}], "skipped":[{user_id, email, role, reason}]}`; reasons `self` (your own membership is never changed in bulk), `not_found`, `unchanged`. A change that would leave no admin is refused (409). For a removal, `role` is the role the member had

        **Permission:** `member.manage`.
      x-permission: member.manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: JSON object; see the description for the fields.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/members/{uid}:
    parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
      description: user id
    patch:
      tags:
      - Members
      summary: Update member
      operationId: patchMembersByUid
      description: |-
        `{"role"}`; the last admin cannot be demoted (409)

