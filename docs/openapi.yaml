      operationId: postTokens
      description: |-
        `{"name","roles" (or "role"),"expires_days"?}` → `{"token":"qtf_...", "item": APIToken}` (token only shown once; the roles default to all of the creator's roles, and their permissions must all be held by the creator; a token cannot create tokens; on every request a token gets the intersection of its roles' permissions and those of the user's current roles)

        **Permission:** `token.manage`.
      x-permission: token.manage
      requestBody:
        required: true
