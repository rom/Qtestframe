    post:
      tags:
      - Auth
      summary: Activate the authenticator app
      operationId: postAuthMfaTotpConfirm
      description: |-
        `{"code"}`: a current code of the new authenticator activates it and returns `{"recovery_codes": [...]}` (10 single-use codes, shown once, stored hashed). A session that had to enrol (`mfa_enrolment_required`) is unlocked. 400 `mfa_invalid` for a wrong code.

        **Permission:** signed in.
      x-permission: authenticated
      requestBody:
        required: true
