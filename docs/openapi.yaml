    put:
      tags:
      - Projects
      summary: Save correlation settings
      operationId: putProjectsByPidCorrelationSettings
      description: |-
        saves the settings; fields left out keep their value, `relation_impact` (relation type → `incoming` | `outgoing` | `both` | `off`) is replaced as a whole; `relation_modes` (relation type → `suspect` | `review`); `impact_depth` 1–10 (default 3); `impact_rules` (`verifies`, `calls`, `test_depends_on`, `item_link`, `risk`, `defect`, `variant`, `code` → `{direction, mode}`; only `verifies` can mark `suspect`); `stale_after_days` 0 turns the age rule off (at most 3650); a severity cannot both block and warn; `regression_action` `reopen` | `new_defect` | `off`; `applicability_impact` `review` (default: a changed variant applicability recommends a review of what the impact rules reach and notifies its owners) | `suspect` (a change of substance: the rules mark trace links and relations suspect) | `off` → the settings as GET returns them

