      - Waivers
      summary: Create a waiver or deviation
      operationId: postProjectsByPidWaivers
      description: |-
        `{"type": "waiver"|"deviation", "title", "release_id" (null: the whole project), "requirement_ids", "variant_ids" (ids or names: limits the waiver to these variants, each with the variants below it; [] every variant — in a release gated per variant it then accepts only in them), "justification", "compensating", "conditions", "risk_id", "new_risk": {"title", "likelihood", "impact"} (creates a risk for the requirements and links it), "approvers": [e-mail], "expires_on": "YYYY-MM-DD", "submit": false}` → 201 the waiver (key PROJ-WVR-n), a draft or with `submit` requested (needs requirements, a justification and, for a deviation, compensating measures; the approvers are notified).

        **Permission:** `requirement.write`.
