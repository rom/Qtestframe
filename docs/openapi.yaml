    post:
      tags:
      - Files
      summary: Generate document
      operationId: postProjectsByPidDocumentsGenerate
      description: |-
        Generates a requirements specification (`requirements_spec`, modelled on ISO/IEC/IEEE 29148) or a test plan with its test specification (`test_plan`, modelled on ISO/IEC/IEEE 29119-3) from the project's requirements and tests, or from a baseline, and saves it in the document archive → 201 File (`kind: document`, tags `generated`, `requirements-specification` or `test-plan` and the version, e.g. `v2.0`). Download it with `GET /files/{id}/content`. See docs/api.md "Generated documents".

        **Permission:** `export, requirement.read` checked by the router; `test.read` for a test plan; `requirement.write` or `test.write` (the upload permission of the archive).
      x-permission: export, requirement.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              properties:
                kind:
                  type: string
                  enum:
                  - requirements_spec
                  - test_plan
                format:
                  type: string
                  enum:
                  - pdf
                  - docx
                  - md
                  default: pdf
                name:
                  type: string
                  description: file name (default `<KEY>-<kind tag>-v<version>.<format>`)
                description:
                  type: string
                  description: description of the archived file (default title and version)
                options:
                  type: object
                  properties:
                    title:
                      type: string
                    version:
                      type: string
                      description: default one more than the latest generated version of this kind (`1.0` first)
                    author:
                      type: string
                      description: default the caller's name
                    query:
                      type: string
                      description: filter in the query language of the lists; requirements (specification) or tests (test plan)
                    include_inactive:
                      type: boolean
                      description: include rejected and obsolete requirements and deprecated tests
                    baseline_id:
                      type: string
                      description: generate from this baseline's frozen items
                    group_by:
                      type: string
                      enum:
                      - folder
                      - category
                      - type
                      description: grouping of a specification (a test plan is grouped by folder)
                    dimension:
                      type: string
                      description: category dimension for `group_by` category
                    fields:
                      type: array
                      items:
                        type: string
                      description: fields shown of each item; default all but `results`
                    traceability:
                      type: boolean
                      default: true
                    glossary:
                      type: boolean
                      default: true
                    include_discussions:
                      type: boolean
                      description: add an appendix with the discussions of the items
                    dependency_graph:
                      type: boolean
                      default: true
                      description: 'requirements specification: add the dependency graph appendix (the relations between the requirements as figures and as a table; left out without relations)'
                    new_page_per_requirement:
                      type: boolean
                      default: true
                      description: 'requirements specification: every requirement starts at the top of a new page (PDF, DOCX), together with a folder or group heading right before it; false prints compactly. Items that fit on one page are never split across two.'
                    lang:
                      type: string
                      enum:
                      - en
                      - sv
