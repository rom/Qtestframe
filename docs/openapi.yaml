      - Runs and executions
      summary: Import results
      operationId: postRunsByIdResults
      description: |-
        CI import: `{"results":[{"test_key","status","duration_ms","output"}]}` → `{"updated":n,"unknown":["KEY"],"rejected":[{"test_key","readiness","reason"}]}`; results of tests that may not be executed (see below) are not recorded; `reason` spells out the blocking issues

        **Permission:** `run.execute`.
      x-permission: run.execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
