          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/dashboard/insights:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Projects
      summary: Dashboard insights
      operationId: getProjectsByPidDashboardInsights
      description: |-
        Further key figures of the dashboard, counted on the server: `requirements` `{total, with_tests, passing, review: {none, pending, changes_requested, approved}, by_status}`, `tests` `{total, by_type: {manual|automated: {result: n}}}`, `risks` `{total, open, by_level (open), by_status, heat: [likelihood-1][impact-1] (not closed), mitigation: {state: n} (open)}`, `defects` `{open, buckets: {lt7, 7to30, 30to90, gt90}, by_severity: {severity: {bucket: n}}, average_days, oldest_days}`, `suspect` `{links, requirements}`, `trace_rules` `{rules, failed, errors, warnings, violations, passed}`, `release` (the current release's execution progress, or null) and `activity` `{from, to, days: [{day, changes, executions, defects}], total}` (the last 30 days). See "Dashboard and metrics" in docs/api.md.

        **Permission:** `project.read`.
      x-permission: project.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/dashboards:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Dashboards
      summary: List dashboards
      operationId: getProjectsByPidDashboards
      description: |-
        The dashboards the caller sees in the project → `{items: [Dashboard], default_id, can_manage}`: the built-in layouts `overview`, `trends`, `quality` (the former fixed dashboard; `stored: false` until an administrator changes one, then the shared dashboard that replaces it, `builtin` set), the other shared dashboards, then the caller's personal ones. A Dashboard is `{id, project_id, owner_id (personal), name, builtin, source_id, widgets: [{id, type, title, x, y, w, h, settings}], shared, stored, default, editable}` on a grid of 12 columns. See "Dashboards" in docs/api.md.

        **Permission:** `project.read`.
      x-permission: project.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
