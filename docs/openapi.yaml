  /api/v1/projects/import:
    post:
      tags:
      - Projects
      summary: Load project
      operationId: postProjectsImport
      description: |-
        multipart `archive` (a project archive) + optional `key`, `name` (default: those of the archive) and `dry_run=true` (checks everything, saves nothing, answers 200 and reports a taken key as `key_taken: true`). Creates a **new** project in the current organisation in one transaction: every row gets a new id and all references (ids in columns, JSON and texts; item keys such as `OLD-REQ-1` when the key changes) are rewritten; sequence counters are kept, so new items get the next free key. Rows that refer to something outside the archive (e.g. a reviewer without an account here) are left out and counted in `skipped`. Loaded webhooks are disabled and have no secret. → `{project, manifest, imported: {table: rows}, skipped?, files, dry_run?, key_taken?}`. 409 when the key is taken or the archive comes from a newer schema; 400 for invalid archives. Audited as `project.load`.

        **Permission:** `project.create`.
      x-permission: project.create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - archive
              properties:
                archive:
                  type: string
                  format: binary
                  description: The project archive (ZIP)
                key:
                  type: string
                  description: Key of the new project (default the archive's)
                name:
                  type: string
                  description: Name of the new project (default the archive's)
                dry_run:
                  type: boolean
                  description: Check only; nothing is saved (200)
      responses:
        '200':
          description: Dry run; nothing is saved
          content:
            application/json:
              schema:
                type: object
        '201':
          description: The new project and what was loaded
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
