  /api/v1/suggest:
    get:
      tags:
      - Projects
      summary: Autocomplete suggestions
      operationId: getSuggest
      description: |-
        Suggestions for a free-text field: the caller's own history of the field (in the projects they may read) and, for `requirement.source`, `requirement.owner` and `risk.owner`, the values used in the project. Prefix matches first, then word-start matches, then contains; ties by frequency and recency. At most 8. See docs/api.md#autocomplete.

        **Permission:** signed in; read of the field (e.g. `test.read` for `test.step.expected`) in `project_id`.
      x-permission: authenticated
      parameters:
      - name: field
        in: query
        required: true
        description: field key, e.g. `test.step.expected`, `requirement.source`, `search`
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: the text typed so far
        schema:
          type: string
      - name: project_id
        in: query
        required: false
        description: the project of the field (required except for `search`)
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 1-8 (default 8)
        schema:
          type: integer
      - name: sources
        in: query
        required: false
        description: 'comma-separated: history, project (default both, as the preference allows)'
        schema:
          type: string
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suggest/history:
    get:
      tags:
      - Auth
      summary: Count my autocomplete history
      operationId: getSuggestHistory
      description: |-
        `{"count": n}`: how many values the caller has stored (all organisations).

        **Permission:** signed in.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Auth
      summary: Record autocomplete history
      operationId: postSuggestHistory
      description: |-
        `{"project_id"?, "entries": [{"field", "value", "project_id"?}]}` → `{"recorded": n}`. Records the values the caller saved (at most 200 entries; values are trimmed and at most 1000 characters). Nothing is recorded when the preference `autocomplete` is `off` or `project`.

        **Permission:** signed in; read of each field in its project.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - field
                    - value
                    properties:
                      field:
                        type: string
                      value:
                        type: string
                      project_id:
                        type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Auth
      summary: Clear my autocomplete history
      operationId: deleteSuggestHistory
      description: |-
        Deletes the caller's autocomplete history in every organisation → `{"deleted": n}`.

        **Permission:** signed in.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/exchange/reqif/apply:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Import
      summary: Apply a ReqIF import
      operationId: postProjectsByPidExchangeReqifApply
      description: |-
        Parses and compares the file again (same fields as the preview) and saves the confirmed rows in one transaction through the regular create and update handlers (history, audit, suspect links). Conflicts are skipped unless `overwrite_conflicts`; `exclude` (JSON array of row indexes) leaves rows out. Records the IDENTIFIERs of the objects and relations (`external_refs`) for the next re-import, adds the relations and trace links of the document and removes those imported before that the document no longer has, attaches the embedded files. → totals of requirements and tests `{created, updated, unchanged, skipped, folders_created, relations_added, relations_removed, links_added, links_removed, references_saved, files_attached, tests (the tests' share), items:[{index, location, id, key, title, action, version}], skipped_rows:[{index, location, title, reason}]}`; audited as `requirement.import`

        **Permission:** `requirement.write`.
      x-permission: requirement.write
      parameters:
      - $ref: '#/components/parameters/DryRunImpact'
      - $ref: '#/components/parameters/ImpactChoice'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReqIFExchangeUpload'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/exchange/reqif/preview:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Import
      summary: Preview a ReqIF import
      operationId: postProjectsByPidExchangeReqifPreview
      description: |-
        Reads a ReqIF 1.x document (.reqif or .reqifz, e.g. from IBM DOORS, DOORS Next or Siemens Polarion) and compares it with the project; nothing is stored. Objects already imported (by IDENTIFIER) or exported from this project are updates. Test objects (by object type) are compared with the tests, SPEC-RELATIONs between a test and a requirement are trace links, files embedded in the XHTML of a .reqifz become attachments. → the requirements' diff (as for the Excel preview) plus `{tests (the tests' diff or null), title, tool, qtestframe, attributes, test_attributes:[{name, type, values, objects, sample, object_types, field, guess}], targets, test_targets:[{key, label, type}], object_types:[{name, objects, kind, guess}], relation_types:{name: type}, relation_type_mapping:[{name, relations, type, guess}], relation_targets, relations:{add, remove, keep, links, changes:[{ref, type, file_type, source, target, action, kind}]}, folders, test_folders, files:[{object, ref, name, size, existing}], skipped, errors, previous, target_folder, test_target_folder, can_import_tests}`

        **Permission:** `requirement.write`.
      x-permission: requirement.write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReqIFExchangeUpload'
      responses:
        '200':
          description: The diff; nothing is stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeDiff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/exchange/xlsx:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Import
      summary: Export a round-trip workbook
      operationId: getProjectsByPidExchangeXlsx
      description: |-
        Excel workbook for editing and importing back: sheet Requirements or Tests with ID, Key and Version columns and one column per field (relations and links as keys), a Steps sheet for tests, instructions and a hidden sheet with the column keys. Query: `kind` (requirement | test), `q`, `folder_id`, `recursive`. Audited as `project.export`.

        **Permission:** `export` (and the read permission of the kind).
      x-permission: export
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum: [requirement, test]
      - name: q
        in: query
        schema:
          type: string
      - name: folder_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: The workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/exchange/xlsx/apply:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Import
      summary: Apply an edited workbook
      operationId: postProjectsByPidExchangeXlsxApply
      description: |-
        Compares the workbook again and saves the confirmed rows in one transaction (all or nothing) through the regular create and update handlers: history, audit, suspect links, notifications. Rows with errors are skipped, conflicts too unless `overwrite_conflicts`; `create=false` skips new rows; `exclude` is a JSON array of row indexes. A save that races with the import answers 409 `stale`. → `{created, updated, unchanged, skipped, folders_created, relations_added, relations_removed, links_added, links_removed, items:[…], skipped_rows:[…]}`; audited as `requirement.import` / `test.import`

        **Permission:** `project.read` (and the write permission of the kind; the review permission to set a review status).
      x-permission: project.read
      parameters:
      - $ref: '#/components/parameters/DryRunImpact'
      - $ref: '#/components/parameters/ImpactChoice'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExchangeUpload'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResult'
        '409':
          description: An item was saved by someone else during the import (code `stale`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/exchange/xlsx/preview:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Import
      summary: Preview an edited workbook
      operationId: postProjectsByPidExchangeXlsxPreview
      description: |-
        Compares a round-trip workbook with the stored items; nothing is stored. Rows with an ID (or a known Key) are updates, rows without are new; a row whose Version differs from the stored one and whose values differ is a conflict. → `{kind, file, summary:{new, changed, unchanged, conflicts, errors}, rows:[{index, row, location, status, id, key, title, base_version, version, changes:[{field, label, cell, old, new}], errors:[{field, label, cell, message}], warnings}], columns:[Field], ignored:[header], warnings}`

        **Permission:** `project.read` (and the write permission of the kind).
      x-permission: project.read
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExchangeUpload'
      responses:
        '200':
          description: The diff; nothing is stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeDiff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/export/view:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Reports and export
      summary: Export a view
      operationId: postProjectsByPidExportView
      description: |-
        Renders a table the client shows (e.g. the spreadsheet view with its visible columns, order, sort and filters) as `xlsx`, `csv`, `md`, `pdf` or `docx`. At most 200 columns and 2,000,000 cells. The response has `Content-Disposition: attachment; filename="<KEY>-<name>-<YYYYMMDD-HHMMSS>.<ext>"`.

        **Permission:** `export`.
      x-permission: export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - format
              - columns
              - rows
              properties:
                format:
                  type: string
                  enum:
                  - xlsx
                  - csv
                  - md
                  - pdf
                  - docx
                  - excel
                  - word
                  - markdown
                name:
                  type: string
                  description: file and sheet name (reduced to a-z, 0-9 and -)
                title:
                  type: string
                lang:
                  type: string
                  enum:
                  - en
                  - sv
                filter:
                  type: string
                  description: shown under the title (Markdown)
                columns:
                  type: array
                  items:
                    type: string
                rows:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
      responses:
        '200':
          description: The export file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{pid}/export:
    parameters:
    - $ref: '#/components/parameters/pid'
    get:
      tags:
      - Reports and export
      summary: Export
      operationId: getProjectsByPidExport
      description: |-
        Downloads project data. `format` `xlsx`, `csv`, `pdf`, `docx`, `md` (aliases `excel`, `word`, `markdown`) export the chosen `aspects` (`md`: one GitHub-flavoured Markdown document, `text/markdown`); `reqif` and `reqifz` export the requirements as ReqIF 1.2 with their folders, custom fields, criteria and relations (aspects do not apply); `include=tests` adds the test cases (type "Test case", with steps, custom fields and folders) and their "Verifies" links, `include=records` the verification records; `baseline=<id>` exports the frozen versions of a baseline's items (not with `q`). `.reqif` is the XML document, `.reqifz` a ZIP with the document and the items' attachments below `files/<key>/`. `q` is applied to requirements if it is a valid requirement query and to tests if it is a valid test query. The response has `Content-Disposition: attachment; filename="<KEY>-<YYYYMMDD-HHMMSS>.<ext>"`.

        **Permission:** `export`.
      x-permission: export
      parameters:
      - name: format
        in: query
        required: true
        description: file format
        schema:
          type: string
          enum:
          - xlsx
          - csv
          - pdf
          - docx
          - md
          - excel
          - word
          - markdown
          - reqif
          - reqifz
      - name: aspects
        in: query
        required: false
        description: comma-separated subset of requirements, criteria, tests, traceability, runs (default all; not for ReqIF)
        schema:
          type: string
      - name: include
        in: query
        required: false
        description: 'ReqIF only: comma-separated tests, records'
        schema:
          type: string
      - name: baseline
        in: query
        required: false
        description: 'ReqIF only: the id of a baseline of the project to export'
        schema:
          type: string
      - $ref: '#/components/parameters/q'
      responses:
        '200':
          description: 'The export file: `application/zip` for several CSV aspects and for `reqifz`, `application/xml` (a ReqIF 1.2 document)
            for `reqif`'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
