          - en
          - sv
        requirement_folder_id:
          type: string
          description: target folder of the requirements ('' = top level)
        test_folder_id:
          type: string
          description: target folder of the tests ('' = top level)
        folders:
          type: string
          enum:
          - none
          - area
          - group
        status:
          type: string
          description: status of the requirements (default draft)
        test_status:
          type: string
          description: status of the tests (default draft)
        include_tests:
          type: boolean
        add_copies:
          type: boolean
        source:
          type: string
          description: source of the requirements; omitted = the cited standards
    StaleError:
