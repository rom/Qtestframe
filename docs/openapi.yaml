    post:
      tags:
      - Administration
      summary: Run backup now
      operationId: postAdminBackupsRun
      description: |-
        Starts a backup into `backup.directory` with the settings of the scheduled backups (encryption, upload, retention) in the background → 202 with the BackupRun (status `running`). 400 when no directory is set, 409 while a backup runs (on any server: the backup lock). Audited as `admin.backup.run`; the outcome as `admin.backup.completed` or `admin.backup.failed`.

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
