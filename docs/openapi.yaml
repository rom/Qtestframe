  /api/v1/projects/{pid}/tests/batch:
    parameters:
    - $ref: '#/components/parameters/pid'
    post:
      tags:
      - Tests
      summary: Batch update (test)
      operationId: postProjectsByPidTestsBatch
      description: |-
        Saves different fields per item in one transaction (the spreadsheet view). Each item goes through the same checks as a `PATCH` (validation, write or review permission, history, audit); when one fails nothing is saved and the answer names it (`index`, `id`). Versions are checked first: when an item was saved by someone else since `version`, nothing is saved and the answer is 409 `stale` with every outdated item. See docs/api.md, *Batch update*.

        **Permission:** `test.read` (write or review per item).
      x-permission: test.read
      parameters:
      - $ref: '#/components/parameters/DryRunImpact'
      - $ref: '#/components/parameters/ImpactChoice'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdateResult'
        '400':
          description: Invalid batch or value (the failing item has `index` and `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFailure'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Some items were changed by someone else (code `stale`); nothing was saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchConflict'
        default:
          $ref: '#/components/responses/Error'
