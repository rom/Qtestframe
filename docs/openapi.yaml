      operationId: getAuthMfa
      description: |-
        `{"enabled", "enabled_at", "pending", "recovery_codes_left", "recovery_codes_total", "trusted_devices", "required", "enrolment_deadline", "enrolment_required", "remember_days"}`. The TOTP secret is never returned.

        **Permission:** signed in.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
