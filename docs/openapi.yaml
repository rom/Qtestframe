        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Live updates
      summary: Presence heartbeat
      operationId: postPresence
      description: |-
        `{"entity_type","entity_id","state":"viewing"|"editing"|"left"}` records that the caller is on an item (send it every 20 s while the item is open, `left` when it is closed) → `{"others":[...],"ttl_ms"}`. Changes (someone arrives, starts editing or leaves) are sent as `presence` events on the stream to those who may see the item. Presence is shared between server instances on PostgreSQL.

        **Permission:** any authenticated user; the handler checks: the read permission of the item.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_type:
                  type: string
                entity_id:
                  type: string
                state:
                  type: string
                  enum: [viewing, editing, left]
      responses:
        '200':
          description: The others on the item
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
