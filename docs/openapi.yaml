      description: |-
        what a change of the requirement's substance (title, description, obligation, criteria) makes suspect, out of date, outdated or stale, or recommends for review, transitively up to the project's `impact_depth` (or `?depth=` 1–10): `{kind, id, key, title, roots, depth, requirements, tests, risks, defects, links, issues, documents, results, variants, code, total, suspect, review, by_kind, by_depth}`. Every item has `depth`, `mode` (`suspect` | `review`), `path` (`[{kind, id, key, edge, direction}]` from the changed item) and `owner`; depth 1 is the one-level analysis described here. `requirements`: the requirements related to it along the relation types the project's `relation_impact` names (with `relation`, `direction`); `tests`: the tests verifying it and those requirements (`via`: the related requirement); `issues`: its tracker issues (when `flag_issues`); `documents`: the generated documents containing it; `results`: the latest results of its tests that go stale (when `stale_on_change`). `already` marks items that are suspect, out of date or stale already; `total` counts the others. Without `test.read` the tests and results are left out

