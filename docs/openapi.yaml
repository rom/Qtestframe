    post:
      tags:
      - Auth
      summary: Start setting up an authenticator app
      operationId: postAuthMfaTotp
      description: |-
        Creates a new TOTP secret (RFC 6238: SHA-1, 6 digits, 30 s) that is active only after `POST /auth/mfa/totp/confirm`: `{"secret", "otpauth_uri", "issuer", "account", "digits", "period", "algorithm"}`. This is the only time the secret is returned. 409 when an authenticator is already active. Browser sessions only (403 for API tokens).

        **Permission:** signed in.
      x-permission: authenticated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
