      operationId: getAdminBackups
      description: |-
        The settings of the scheduled backups (section `backup` of the system settings, without secrets: `encrypted` says whether a passphrase is set) with the next scheduled backup, and the latest runs, newest first → `{"settings": {enabled, schedule, schedule_error?, directory, keep_last, keep_days, encrypted, s3_enabled, s3_target?, next_run_at?}, "running": bool, "runs": [BackupRun]}`; BackupRun = `{id, kind: schedule|manual, status: running|succeeded|failed, started_by, started_at, finished_at?, file_name, size, sha256, encrypted, remote_key, rows, schema_version, error, pruned_at?, verified_at?, verify_error}`. Query `limit` (default 100).

        **Permission:** any authenticated user; the handler checks: super admin.
      x-permission: authenticated
      parameters:
      - name: limit
        in: query
