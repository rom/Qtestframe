          - unauthorized
          - forbidden
          - not_found
          - conflict
          - stale
          - invalid_query
          - rate_limited
          - unavailable
          - internal
        position:
          type: integer
          description: byte offset of an invalid query (code invalid_query)
      additionalProperties: true
