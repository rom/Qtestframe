    patch:
      tags:
      - Runs and executions
      summary: Update run
      operationId: patchRunsById
      description: |-
        `{"name","description","status","environment","build"}`. A run also changes status by itself: the first result moves a `planned` run to `in_progress`; when every execution has a final result (`passed`, `failed`, `blocked`, `skipped`) a `planned`/`in_progress` run becomes `completed`; taking a result back to `not_run`/`in_progress`, or adding tests, reopens a `completed` run. `aborted` runs are never changed automatically. `environment_id` (id or name, "" none) selects an environment item (its name is kept in `environment`); a new free-text `environment` is linked by name again.

        **Permission:** `run.write`.
      x-permission: run.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
