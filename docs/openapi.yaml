  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: postAuthLogin
      description: |-
        `{"email","password","tenant"?}` (tenant = slug); 401 on bad credentials, 429 after 10 attempts in 5 min per IP + e-mail, 403 if local login is disabled — `Me` + `qtf_session` cookie. When the account has a second factor (and the device is not remembered) the answer is instead `{"mfa_required": true, "methods", "remember_days", "expires_at"}` with a short-lived `qtf_mfa` cookie: finish with `POST /auth/mfa/verify`. A session whose MFA policy requires a second factor that is not set up yet answers 403 `mfa_enrolment_required` outside `/api/v1/auth/` until it is.

        **Permission:** none (public).
      x-permission: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; sets the qtf_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
