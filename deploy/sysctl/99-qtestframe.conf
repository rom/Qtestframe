# /etc/sysctl.d/99-qtestframe.conf — optional host hardening for a
# Qtestframe server. Review before use; apply with `sysctl --system`.
# None of these are required by Qtestframe itself.

### Kernel information leaks / exploitation hardening
# Hide kernel pointers from unprivileged users (/proc/kallsyms etc.).
kernel.kptr_restrict = 2
# dmesg only for CAP_SYSLOG.
kernel.dmesg_restrict = 1
# ptrace only of own descendants (1) / only with CAP_SYS_PTRACE (2).
kernel.yama.ptrace_scope = 2
# No unprivileged eBPF; harden the JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# perf events only for CAP_PERFMON.
kernel.perf_event_paranoid = 3
# Disable kexec (no runtime kernel replacement).
kernel.kexec_load_disabled = 1
# SysRq only for sync/remount-ro/reboot (176) or fully off (0).
kernel.sysrq = 0
# Unprivileged user namespaces: Qtestframe does not need them (the systemd
# unit sets RestrictNamespaces=yes anyway). Disabling them system-wide
# breaks rootless podman / browsers' sandboxes — leave commented if needed.
#kernel.unprivileged_userns_clone = 0      # Debian/Ubuntu kernels
#user.max_user_namespaces = 0
# Core dumps of setuid programs off.
fs.suid_dumpable = 0
# Protect against link/FIFO tricks in world-writable directories.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

### IPv4 network hardening
# Reverse path filtering (strict). Use 2 (loose) with asymmetric routing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# No source routing, no ICMP redirects (we are not a router).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.ip_forward = 0
# Log martian packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
# SYN flood protection.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_synack_retries = 3
# RFC 1337 TIME-WAIT assassination protection.
net.ipv4.tcp_rfc1337 = 1
# Ignore broadcast pings and bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

### IPv6 network hardening
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Do not accept router advertisements on servers with static addressing.
#net.ipv6.conf.all.accept_ra = 0
#net.ipv6.conf.default.accept_ra = 0

### Capacity for many concurrent HTTPS clients
net.core.somaxconn = 4096
net.ipv4.ip_local_port_range = 10240 65535
# Alternative to CAP_NET_BIND_SERVICE: allow unprivileged binding from 443.
# (Applies to ALL users of the host — the capability is more precise.)
#net.ipv4.ip_unprivileged_port_start = 443
