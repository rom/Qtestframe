# /usr/lib/tmpfiles.d/qtestframe.conf
# Directory layout and permissions. Apply with:
#   systemd-tmpfiles --create /usr/lib/tmpfiles.d/qtestframe.conf
# systemd also (re)creates StateDirectory/RuntimeDirectory/ConfigurationDirectory
# from the unit; these entries additionally fix ownership of pre-existing
# trees and define directories the unit does not manage (tls/, secrets/).
#
#Type Path                          Mode User       Group       Age Argument
# Configuration: owned by root, group-readable by the service (read-only).
d     /etc/qtestframe               0750 root       qtestframe  -   -
d     /etc/qtestframe/tls           0750 root       qtestframe  -   -
d     /etc/qtestframe/secrets       0750 root       qtestframe  -   -
z     /etc/qtestframe/config.yaml   0640 root       qtestframe  -   -
# TLS: certificate world-readable is harmless, key group-readable only.
z     /etc/qtestframe/tls/server.crt   0644 root    qtestframe  -   -
z     /etc/qtestframe/tls/fullchain.pem 0644 root   qtestframe  -   -
z     /etc/qtestframe/tls/server.key   0640 root    qtestframe  -   -
# State: SQLite database and the runner work directory (writable).
d     /var/lib/qtestframe           0750 qtestframe qtestframe  -   -
z     /var/lib/qtestframe/qtestframe.db 0600 qtestframe qtestframe - -
# Leftover runner job directories older than a day are removed by
# systemd-tmpfiles-clean.timer (the runner normally cleans up itself).
d     /var/lib/qtestframe/runner    0700 qtestframe qtestframe  1d  -
# Runtime and log directories.
d     /run/qtestframe               0750 qtestframe qtestframe  -   -
d     /var/log/qtestframe           0750 qtestframe qtestframe  30d -
