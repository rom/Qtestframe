# /usr/lib/sysusers.d/qtestframe.conf
# Creates the unprivileged system user/group the service runs as.
# Apply with: systemd-sysusers /usr/lib/sysusers.d/qtestframe.conf
#
#Type Name        ID  GECOS                         Home                 Shell
u     qtestframe  -   "Qtestframe service account"  /var/lib/qtestframe  /usr/sbin/nologin
