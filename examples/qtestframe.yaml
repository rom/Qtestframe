# Qtestframe – working example configuration (local evaluation).
#
# Runs as-is from the repository root after `make build`:
#
#   ./bin/qtestframe serve --config examples/qtestframe.yaml
#
# then open http://localhost:8080 and sign in as admin@example.com with the
# bootstrap password below (change it under Profile after the first login).
#
# Everything is relative to the directory you start the server from:
# the SQLite database and the script runner live in ./data (created on start).
#
# This file is plain HTTP on purpose. For HTTPS see
# examples/qtestframe-tls.yaml; for a production server see
# deploy/config.example.yaml and docs/operations.md.
#
# Unknown keys are rejected, so a typo shows up as an error at start-up.
# Command line flags override this file, e.g. `--port 9090` or `-p 9090`.

server:
  # Address and port to listen on. ":8080" = all interfaces; use
  # "127.0.0.1:8080" to accept local connections only.
  listen: ":8080"
  # URL users type in the browser (used for OIDC/SAML callbacks).
  base_url: "http://localhost:8080"
  read_timeout: 30s
  write_timeout: 120s
  # No TLS here: HSTS is only sent over TLS anyway.
  hsts: false

database:
  # sqlite (single file, zero setup) or postgres. To use PostgreSQL:
  #   driver: postgres
  #   dsn: "postgres://qtf:qtf@localhost:5432/qtf?sslmode=disable"
  # (scripts/dev-postgres.sh starts a throwaway PostgreSQL in a container).
  driver: sqlite
  dsn: "./data/qtestframe.db"

logging:
  level: info        # debug | info | warn | error
  format: text       # text (readable) | json (for log shippers)
  syslog:
    # Set enabled: true to also ship logs to a syslog server, e.g. a local
    # rsyslog listening on UDP 514.
    enabled: false
    network: udp     # udp | tcp | tls | unix
    address: "127.0.0.1:514"
    tag: qtestframe
    facility: local0
    format: rfc5424

auth:
  local: true          # e-mail + password login
  session_ttl: 12h
  # Browsers only send Secure cookies over HTTPS (http://localhost is an
  # exception in most browsers). Plain HTTP therefore needs false.
  cookie_secure: false
  oidc: []             # see deploy/config.example.yaml for OIDC providers
  saml: []             # see deploy/config.example.yaml for SAML providers

requirements:
  # Create a linked draft test case for every new requirement.
  auto_create_test: true

runner:
  # Allow "Run script" for automated test cases. Scripts run on this machine
  # in a sandbox (Landlock + seccomp + rlimits); keep it off on shared hosts.
  enabled: true
  sandbox: true
  deny_network: false
  timeout: 60s
  work_dir: "./data/runner"
  max_output_bytes: 1048576
  interpreters:
    sh: /bin/sh
    bash: /bin/bash
    python: /usr/bin/python3
    javascript: /usr/bin/node
  # Web tests in a real browser (Playwright), run in the background. To try
  # them: in some directory run `npm i @playwright/test` and
  # `npx playwright install --with-deps chromium`, point playwright_dir at
  # it and set enabled: true. seed-demo adds a web test against this server
  # (server.base_url).
  web:
    enabled: false
    node: /usr/bin/node
    playwright_dir: ""         # the directory with node_modules/@playwright/test
    browsers_path: ""          # PLAYWRIGHT_BROWSERS_PATH; empty = Playwright's default
    browser: chromium          # chromium | firefox | webkit
    headless: true
    timeout: 60s               # per test
    screenshots: on_failure    # on_failure | always | off
    trace: on_failure          # on_failure | always | off
    video: "off"               # off | on_failure | always
    max_parallel: 2

# Outgoing e-mail: notifications by e-mail, invitations of new members and
# reports sent by e-mail or on a schedule. Off while host is empty; then the
# web client hides or explains these features. Links in e-mails use
# server.base_url, which must be set. To try it locally without a real mail
# server, run any SMTP sink on port 2525 (e.g. `python3 -m aiosmtpd -n -l
# 127.0.0.1:2525`) and uncomment:
#
# email:
#   host: 127.0.0.1         # SMTP server
#   port: 2525              # 587 (STARTTLS), 465 (implicit TLS) or 25
#   tls: none               # starttls (default) | tls | none (local relays only)
#   from: qtestframe@example.com
#   from_name: Qtestframe
#   # username: qtestframe  # with a password from password_file or the
#   # password_file: /run/secrets/smtp-password   # QTF_EMAIL_PASSWORD variable,
#   #                       # never in this file
#   timeout: 30s
#   digest_hour: 7          # hour (UTC) of the daily notification digest
#   # enabled: false        # keep the settings but send nothing

hardening:
  # In-process Linux hardening; ignored (reported as skipped) on macOS.
  no_new_privs: true
  landlock: true
  seccomp: true
  drop_capabilities: true

bootstrap:
  # Created on the very first start, when the database has no users.
  # The administrator is a super admin and admin of this tenant.
  tenant_slug: default
  tenant_name: "Default"
  admin_email: "admin@example.com"
  admin_password: "Change-me-1234"

# Runtime system settings: super administrators can change a set of settings
# (OIDC providers, logging and syslog, e-mail, sign-in security, the runner)
# in Administration -> System settings; those values are stored in the
# database and win over this file. Settings set by a QTF_* environment
# variable are always read-only there. List keys (or prefixes ending in
# ".*", or "*" for all) here to keep them read-only, e.g.
#   locked: ["auth.oidc", "logging.*", "runner.*"]
# See docs/operations.md, "Runtime system settings".
system_settings:
  locked: []

# Encryption of stored secrets (TOTP secrets, webhook secrets, tracker
# tokens, secret test variables, the SMTP password and OIDC client secrets
# entered in System settings). They are encrypted with a data key that is
# itself protected by a key provider. The default needs no configuration: a
# key file qtestframe-secrets.key is created (mode 0600) next to the SQLite
# database. Back it up separately from the database: backups keep the
# secrets encrypted and cannot be restored without it.
# See docs/security.md, "Encryption of stored secrets".
secrets:
  provider: local            # local | tpm | pkcs11 (QTF_SECRETS_PROVIDER)
  local:
    key_file: ""             # default: next to the database; or QTF_SECRETS_KEY
  # tpm:                     # seal the data key to the TPM 2.0 of this machine
  #   device: /dev/tpmrm0
  #   pcrs: [7]              # optional: also bind it to the Secure Boot state
  # pkcs11:                  # an HSM; needs a binary built with `make go-pkcs11`
  #   module: /usr/lib/softhsm/libsofthsm2.so
  #   token_label: qtestframe
  #   pin_file: /run/secrets/hsm-pin   # or QTF_SECRETS_PKCS11_PIN
  #   key_label: qtestframe-kek
  #   generate_key: true
